<meta
    name="viewport"

>

<meta

    content="Learn detailed Vietnamese vocabulary with pronunciation, meaning, and example sentences."
>

<title>Vietnamese Dictionary</title>

     GOOGLE FONTS
====================================================== -->

    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
    crossorigin
>

<link

<style>

/* =====================================================
   DESIGN TOKENS
====================================================== */

:root {

            --accent: #2E2E2E;
 
            --accent-dark: #1F1F1F;
 
            --accent-light: #f5f5f5;
 
            --accent-bg: #F9F9F9;
 
            --accent-border: #d0d0d0;

            --ink: #143a6b;
 
            --ink-soft: #66809d;

            --phonetic: rgb(0, 116, 217);

            --white: #ffffff;


            --line: #d9e6f2;


            --radius: 17px;

}


/* =====================================================
   RESET
====================================================== */

* {

    box-sizing: border-box;

    margin: 0;

    padding: 0;

}


html {

    scroll-behavior: smooth;

}


/* =====================================================
   BODY
====================================================== */

body {

    min-height: 100vh;

    padding:
        24px 20px 45px;

    font-family:
        Calibri,
        "Segoe UI",
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    color:
        var(--ink);

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #f5f9fd 48%,
            #edf5fc 100%
        );

}


/* =====================================================
   HEADER
====================================================== */

header {

    width:
        min(1000px, 100%);

    margin:
        0 auto 24px;

}


/* =====================================================
   BACK BUTTON
====================================================== */

.header-inner {

    display:
        flex;

    align-items:
        center;

}


.back-button {

    display:
        inline-flex;

    align-items:
        center;

    gap:
        7px;

    padding:
        5px 0;

    border:
        0;

    background:
        transparent;

    color:
        var(--accent);

    text-decoration:
        none;

    font-family:
        inherit;

    font-size:
        1.08rem;

    font-weight:
        800;

    cursor:
        pointer;

    transition:
        color 0.2s ease,
        transform 0.2s ease;

}


.back-button:hover {

    color:
        var(--accent-dark);

    transform:
        translateX(-3px);

}


/* =====================================================
   MAIN
====================================================== */

main {

    width:
        min(1000px, 100%);

    margin:
        0 auto;

}


/* =====================================================
   WORD DETAIL CARD
====================================================== */

.word-detail {

    width:
        100%;

    overflow:
        hidden;

    background:
        rgba(255, 255, 255, 0.96);

    border:
        1px solid
        var(--accent-border);

    border-radius:
        var(--radius);

    box-shadow:
        0 10px 28px
        rgba(20, 58, 107, 0.07);

}


/* =====================================================
   WORD HEADER
====================================================== */

.word-header {

    position:
        relative;

    padding:
        30px 34px 27px;

    background:
        var(--accent-bg);

    border-bottom:
        1px solid
        var(--accent-border);

}


/* Gold accent line */

.word-header::before {

    content:
        "";

    position:
        absolute;

    top:
        0;

    left:
        0;

    width:
        100%;

    height:
        5px;

    background:
        var(--accent);

}


/* =====================================================
   WORD
====================================================== */

.word {

    color:
        var(--accent-dark);

    font-family:
         Calibri,
        "Segoe UI",
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    font-size:
        clamp(
            3rem,
            7vw,
            4.1rem
        );

    font-weight:
        700;

    line-height:
        1.05;

    margin-bottom:
        5px;

}


/* =====================================================
   PHONETICS
====================================================== */

.phonetics {

    color:
        var(--phonetic);

    font-size:
        1.2rem;

    font-style:
        italic;

    line-height:
        1.4;

    margin-bottom:
        5px;

}


/* =====================================================
   ENGLISH
====================================================== */

.english {

    color:
        var(--ink);

    font-size:
        1.4rem;

    font-weight:
        700;

    line-height:
        1.4;

}


/* =====================================================
   WORD CLASS
====================================================== */

.word-class {

    display:
        inline-flex;

    align-items:
        center;

    width:
        fit-content;

    margin-top:
        10px;

    padding:
        4px 10px;

    border:
        1px solid
        var(--accent-border);

    border-radius:
        999px;

    background:
        rgba(255, 255, 255, 0.75);

    color:
        #777777;

    font-size:
        0.95rem;

    font-style:
        italic;

    line-height:
        1.3;

}


/* =====================================================
   CONTENT SECTION
====================================================== */

.section {

    padding:
        25px 34px 0;

}


.section:last-child {

    padding-bottom:
        32px;

}


.section + .section {

    margin-top:
        24px;

    padding-top:
        24px;

    border-top:
        1px solid
        #e4e4e4;

}


/* =====================================================
   SECTION TITLE
====================================================== */

.section-title {

    color:
        var(--accent-dark);

    font-size:
        1.3rem;

    font-weight:
        800;

    line-height:
        1.25;

    margin-bottom:
        11px;

}


/* =====================================================
   MEANING
====================================================== */

.meaning-list {

    display:
        grid;

    gap:
        7px;

}


.meaning-item {

    display:
        flex;

    align-items:
        flex-start;

    color:
        #555555;

    font-size:
        1.12rem;

    line-height:
        1.6;

}


/* =====================================================
   EXAMPLES
====================================================== */

.example-list {

    display:
        grid;

    gap:
        18px;

}


.example {

    display:
        grid;

    grid-template-columns:
        28px 1fr;

    column-gap:
        7px;

}


.example-number {

    color:
        var(--accent);

    font-size:
        1.08rem;

    font-weight:
        800;

    line-height:
        1.5;

}


.example-content {

    min-width:
        0;

}


/* =====================================================
   EXAMPLE VIETNAMESE
====================================================== */

.example-vietnamese {

    color:
        var(--ink);

    font-size:
        1.16rem;

    font-weight:
        700;

    line-height:
        1.5;

}


/* =====================================================
   EXAMPLE PHONETICS
====================================================== */

.example-phonetics {

    margin-top:
        2px;

    color:
        var(--phonetic);

    font-size:
        1.02rem;

    font-style:
        italic;

    line-height:
        1.45;

}


/* =====================================================
   EXAMPLE ENGLISH
====================================================== */

.example-english {

    margin-top:
        2px;

    color:
        var(--ink-soft);

    font-size:
        1.02rem;

    line-height:
        1.45;

}


/* =====================================================
   NO EXAMPLES
====================================================== */

.no-examples {

    color:
        #777777;

    font-size:
        1.02rem;

    line-height:
        1.5;

}


/* =====================================================
   LOADING / ERROR MESSAGE
====================================================== */

.message {

    padding:
        55px 25px;

    text-align:
        center;

    background:
        rgba(255, 255, 255, 0.9);

    border:
        1px solid
        var(--accent-border);

    border-radius:
        var(--radius);

}


.message-icon {

    margin-bottom:
        10px;

    font-size:
        2.2rem;

}


.message h2 {

    margin-bottom:
        7px;

    color:
        var(--accent-dark);

    font-size:
        1.6rem;

    line-height:
        1.25;

}


.message p {

    color:
        var(--ink-soft);

    font-size:
        1.08rem;

    line-height:
        1.5;

}


.message a {

    display:
        inline-flex;

    align-items:
        center;

    justify-content:
        center;

    margin-top:
        18px;

    padding:
        9px 16px;

    border-radius:
        999px;

    background:
        var(--accent);

    color:
        var(--white);

    text-decoration:
        none;

    font-size:
        1rem;

    font-weight:
        800;

    transition:
        0.2s ease;

}


.message a:hover {

    background:
        var(--accent-dark);

    transform:
        translateY(-1px);

}


/* =====================================================
   RESPONSIVE
====================================================== */

@media (max-width: 700px) {

    body {

        padding:
            20px 14px 35px;

    }


    header {

        margin-bottom:
            18px;

    }


    .back-button {

        font-size:
            1rem;

    }


    .word-detail {

        border-radius:
            14px;

    }


    .word-header {

        padding:
            27px 21px 23px;

    }


    .word {

        font-size:
            2.8rem;

    }


    .phonetics {

        font-size:
            1.05rem;

    }


    .english {

        font-size:
            1.25rem;

    }


    .section {

        padding:
            21px 21px 0;

    }


    .section:last-child {

        padding-bottom:
            26px;

    }


    .section + .section {

        margin-top:
            20px;

        padding-top:
            20px;

    }


    .section-title {

        font-size:
            1.2rem;

    }


    .meaning-item {

        font-size:
            1.05rem;

    }


    .example-list {

        gap:
            16px;

    }


    .example {

        grid-template-columns:
            24px 1fr;

        column-gap:
            6px;

    }


    .example-number {

        font-size:
            1rem;

    }


    .example-vietnamese {

        font-size:
            1.08rem;

    }


    .example-phonetics,
    .example-english {

        font-size:
            0.98rem;

    }

}

</style>

<body>


<!-- =====================================================
     HEADER
====================================================== -->

<header>

    <div class="header-inner">

        <a
            href="../index.html?page=dictionary"
            class="back-button"
        >
            ← Back 
        </a>

    </div>

</header>


<!-- =====================================================
     MAIN
====================================================== -->

<main>

    <div id="content">

        <div class="message">

            <div class="message-icon">
                ⏳
            </div>

            <h2>
                Loading word...
            </h2>

            <p>
                Please wait while we load the vocabulary.
            </p>

        </div>

    </div>

</main>


<script>

/* =====================================================
   ELEMENTS
====================================================== */

const content =
    document.getElementById(
        "content"
    );


/* =====================================================
   URL PARAMETERS
====================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const requestedWord =
    params.get(
        "word"
    );


const requestedCategory =
    params.get(
        "cat"
    );


const requestedTopic =
    params.get(
        "topic"
    );


/* =====================================================
   LOAD CATEGORIES.JSON
====================================================== */

async function loadWord() {

    try {

        if (!requestedWord) {

            showError(
                "No word selected",
                "Please return to the dictionary and select a word."
            );

            return;

        }


        /*
         * word.html is inside:
         *
         * Dictionary/
         *
         * categories.json is in the
         * website root.
         *
         * Therefore:
         *
         * ../categories.json
         */

        const response =
            await fetch(
                "../categories.json",
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                `Could not load categories.json (${response.status})`
            );

        }


        const categories =
            await response.json();


        const wordData =
            findWord(
                categories,
                requestedWord,
                requestedCategory,
                requestedTopic
            );


        if (!wordData) {

            showError(
                "Word not found",
                `We could not find "${requestedWord}" in the vocabulary.`
            );

            return;

        }


        renderWord(
            wordData
        );

    }

    catch (error) {

        console.error(
            "Dictionary word error:",
            error
        );


        showError(
            "Could not load word",
            "Please make sure categories.json is available."
        );

    }

}


/* =====================================================
   FIND WORD
====================================================== */

function findWord(
    categories,
    targetWord,
    targetCategory,
    targetTopic
) {

    let exactMatch =
        null;

    let fallbackMatch =
        null;


    /*
     * Current JSON structure:
     *
     * category
     *   └── vocab[]
     *        └── topic
     *             └── vocabulary[]
     *                  └── word
     *
     */


    Object.entries(
        categories
    ).forEach(
        ([categoryName, category]) => {


            /*
             * Dictionary only uses
             * vocabulary categories.
             */

            if (
                !category ||
                category.type !== "vocabulary" ||
                !Array.isArray(
                    category.vocab
                )
            ) {

                return;

            }


            category.vocab.forEach(
                topic => {


                    if (
                        !topic ||
                        !Array.isArray(
                            topic.vocabulary
                        )
                    ) {

                        return;

                    }


                    topic.vocabulary.forEach(
                        word => {


                            if (
                                !word ||
                                typeof word !== "object"
                            ) {

                                return;

                            }


                            const vietnamese =
                                String(
                                    word.vietnamese ||
                                    ""
                                ).trim();


                            if (
                                vietnamese.toLowerCase() !==
                                String(
                                    targetWord
                                ).trim().toLowerCase()
                            ) {

                                return;

                            }


                            const built = {

                                vietnamese:
                                    vietnamese,

                                phonetics:
                                    word.phonetics ||
                                    word.phonetic ||
                                    "",

                                english:
                                    word.english ||
                                    "",

                                wordClass:
                                    word.wordClass ||
                                    "",

                                explain:
                                    word.explain ||
                                    "",

                                category:
                                    categoryName,

                                topic:
                                    topic.topic ||
                                    "",

                                examples:
                                    Array.isArray(
                                        word.examples
                                    )
                                        ?
                                        word.examples
                                        :
                                        []

                            };


                            /*
                             * First matching word
                             * becomes fallback.
                             */

                            if (
                                !fallbackMatch
                            ) {

                                fallbackMatch =
                                    built;

                            }


                            /*
                             * Prefer exact
                             * category + topic.
                             */

                            const categoryMatches =
                                targetCategory &&
                                categoryName ===
                                    targetCategory;


                            const topicMatches =
                                targetTopic &&
                                (
                                    topic.topic ||
                                    ""
                                ) ===
                                    targetTopic;


                            if (
                                categoryMatches &&
                                topicMatches
                            ) {

                                exactMatch =
                                    built;

                            }

                        }
                    );

                }
            );

        }
    );


    return (
        exactMatch ||
        fallbackMatch
    );

}


/* =====================================================
   RENDER WORD
====================================================== */

function renderWord(
    word
) {

    /*
     * IMPORTANT:
     *
     * Do NOT limit examples to 2.
     *
     * Render every example available
     * in the JSON.
     */

    const examples =
        Array.isArray(
            word.examples
        )
            ?
            word.examples
            :
            [];


    content.innerHTML = `

        <article class="word-detail">


            <!-- =============================================
                 WORD HEADER
            ============================================== -->

            <section class="word-header">


                <div class="word">

                    ${escapeHTML(
                        word.vietnamese
                    )}

                </div>


                ${
                    word.phonetics
                        ?

                        `

                            <div class="phonetics">

                                /${escapeHTML(
                                    word.phonetics
                                )}/

                            </div>

                        `

                        :

                        ""

                }


                ${
                    word.english
                        ?

                        `

                            <div class="english">

                                ${escapeHTML(
                                    word.english
                                )}

                            </div>

                        `

                        :

                        ""

                }


                ${
                    word.wordClass
                        ?

                        `

                            <div class="word-class">

                                ${escapeHTML(
                                    word.wordClass
                                )}

                            </div>

                        `

                        :

                        ""

                }

            </section>


            <!-- =============================================
                 MEANING
            ============================================== -->

            ${
                word.explain

                    ?

                    `

                        <section class="section">

                            <h2 class="section-title">
                                Meaning
                            </h2>


                            <div class="meaning-list">

                                <div class="meaning-item">

                                    <span>

                                        ${escapeHTML(
                                            word.explain
                                        )}

                                    </span>

                                </div>

                            </div>

                        </section>

                    `

                    :

                    ""

            }


            <!-- =============================================
                 EXAMPLES
            ============================================== -->

            <section class="section">


                <h2 class="section-title">
                    Example
                </h2>


                ${
                    examples.length === 0

                        ?

                        `

                            <p class="no-examples">

                                No example sentences available.

                            </p>

                        `

                        :

                        `

                            <div class="example-list">

                                ${examples
                                    .map(
                                        (
                                            example,
                                            index
                                        ) =>
                                            renderExample(
                                                example,
                                                index
                                            )
                                    )
                                    .join("")}

                            </div>

                        `

                }

            </section>


        </article>

    `;


    document.title =
        `${word.vietnamese} — Vietnamese Dictionary`;

}


/* =====================================================
   RENDER EXAMPLE
====================================================== */

function renderExample(
    example,
    index
) {


    /*
     * Example can be:
     *
     * "Tôi đi..."
     *
     * OR
     *
     * {
     *   vietnamese: "...",
     *   phonetics: "...",
     *   english: "..."
     * }
     *
     */


    if (
        typeof example === "string"
    ) {

        return `

            <div class="example">

                <div class="example-number">

                    ${index + 1}.

                </div>


                <div class="example-content">

                    <div class="example-vietnamese">

                        ${escapeHTML(
                            example
                        )}

                    </div>

                </div>

            </div>

        `;

    }


    if (
        !example ||
        typeof example !== "object"
    ) {

        return "";

    }


    const vietnamese =
        example.vietnamese ||
        "";


    const phonetics =
        example.phonetics ||
        example.phonetic ||
        "";


    const english =
        example.english ||
        "";


    return `

        <div class="example">

            <div class="example-number">

                ${index + 1}.

            </div>


            <div class="example-content">


                ${
                    vietnamese

                        ?

                        `

                            <div class="example-vietnamese">

                                ${escapeHTML(
                                    vietnamese
                                )}

                            </div>

                        `

                        :

                        ""

                }


                ${
                    phonetics

                        ?

                        `

                            <div class="example-phonetics">

                                /${escapeHTML(
                                    phonetics
                                )}/

                            </div>

                        `

                        :

                        ""

                }


                ${
                    english

                        ?

                        `

                            <div class="example-english">

                                ${escapeHTML(
                                    english
                                )}

                            </div>

                        `

                        :

                        ""

                }


            </div>

        </div>

    `;

}


/* =====================================================
   ERROR
====================================================== */

function showError(
    title,
    description
) {

    content.innerHTML = `

        <div class="message">


            <div class="message-icon">
                ⚠️
            </div>


            <h2>

                ${escapeHTML(
                    title
                )}

            </h2>


            <p>

                ${escapeHTML(
                    description
                )}

            </p>


            <a
                href="../index.html"
            >
                ← Back
            </a>


        </div>

    `;

}


/* =====================================================
   HTML ESCAPE
====================================================== */

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =====================================================
   START
====================================================== */

loadWord();

</script>


</body>
