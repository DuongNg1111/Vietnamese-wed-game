<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>

        <div class="header-inner">

            <a
                href="dictionary.html"
                class="back-button"
            >
                ← Back
            </a>

        </div>

    </header>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>

        <div id="content">

            <div class="message">

                <div class="message-icon">
                    ⏳
                </div>

                <h2>
                    Loading word...
                </h2>

                <p>
                    Please wait while we load the vocabulary.
                </p>

            </div>

        </div>

    </main>


    <!-- =====================================================
         SCRIPT
    ====================================================== -->

    <script>

        const content =
            document.getElementById("content");


        /* =====================================================
           GET WORD FROM URL
        ====================================================== */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const requestedWord =
            params.get("word");


        const requestedCategory =
            params.get("cat");


        const requestedTopic =
            params.get("topic");


        /* =====================================================
           LOAD CATEGORIES.JSON
        ====================================================== */

        async function loadWord() {

            try {

                if (!requestedWord) {

                    showError(
                        "No word selected",
                        "Please return to the dictionary and select a word."
                    );

                    return;

                }


                const response =
                    await fetch(
                        "../categories.json"
                    );


                if (!response.ok) {

                    throw new Error(
                        "Could not load categories.json"
                    );

                }


                const categories =
                    await response.json();


                const wordData =
                    findWord(
                        categories,
                        requestedWord,
                        requestedCategory,
                        requestedTopic
                    );


                if (!wordData) {

                    showError(
                        "Word not found",
                        `We could not find "${requestedWord}" in the vocabulary.`
                    );

                    return;

                }


                renderWord(
                    wordData
                );

            }

            catch (error) {

                console.error(
                    "Dictionary word error:",
                    error
                );


                showError(
                    "Could not load word",
                    "Please make sure categories.json is available."
                );

            }

        }


        /* =====================================================
           FIND WORD
        ====================================================== */

        function findWord(
            categories,
            targetWord,
            targetCategory,
            targetTopic
        ) {

            let exactMatch = null;

            let fallbackMatch = null;


            Object.entries(
                categories
            ).forEach(
                ([categoryName, category]) => {


                    if (
                        category.type !== "vocabulary" ||
                        !Array.isArray(
                            category.vocab
                        )
                    ) {

                        return;

                    }


                    category.vocab.forEach(
                        topic => {


                            if (
                                !Array.isArray(
                                    topic.vocabulary
                                )
                            ) {

                                return;

                            }


                            topic.vocabulary.forEach(
                                word => {


                                    if (
                                        word.vietnamese !==
                                        targetWord
                                    ) {

                                        return;

                                    }


                                    const built = {

                                        vietnamese:
                                            word.vietnamese,

                                        phonetics:
                                            word.phonetics || "",

                                        english:
                                            word.english || "",

                                        wordClass:
                                            word.wordClass || "",

                                        explain:
                                            word.explain || "",

                                        category:
                                            categoryName,

                                        topic:
                                            topic.topic || "",

                                        examples:
                                            Array.isArray(
                                                word.examples
                                            )
                                                ? word.examples
                                                : []

                                    };


                                    /*
                                     * First match becomes
                                     * fallback.
                                     */

                                    if (
                                        !fallbackMatch
                                    ) {

                                        fallbackMatch =
                                            built;

                                    }


                                    /*
                                     * Exact category + topic
                                     * match.
                                     *
                                     * Used internally only.
                                     */

                                    if (
                                        targetCategory &&
                                        targetTopic &&
                                        categoryName ===
                                            targetCategory &&
                                        (
                                            topic.topic || ""
                                        ) ===
                                            targetTopic
                                    ) {

                                        exactMatch =
                                            built;

                                    }

                                }
                            );

                        }
                    );

                }
            );


            return (
                exactMatch ||
                fallbackMatch
            );

        }


        /* =====================================================
           RENDER WORD
        ====================================================== */

        function renderWord(
            word
        ) {


            /*
             * Show maximum 2 examples.
             */

            const examples =
                word.examples.slice(
                    0,
                    2
                );


            content.innerHTML = `

                <article class="word-detail">


                    <!-- =================================================
                         WORD HEADER
                    ================================================== -->

                    <section class="word-header">

                        <div class="word">
                            ${escapeHTML(
                                word.vietnamese
                            )}
                        </div>


                        ${
                            word.phonetics
                                ? `

                                    <div class="phonetics">
                                        /${escapeHTML(
                                            word.phonetics
                                        )}/
                                    </div>

                                  `
                                : ""
                        }


                        <div class="english">
                            ${escapeHTML(
                                word.english
                            )}
                        </div>


                        ${
                            word.wordClass
                                ? `

                                    <div class="word-class">
                                        ${escapeHTML(
                                            word.wordClass
                                        )}
                                    </div>

                                  `
                                : ""
                        }

                    </section>


                    <!-- =================================================
                         MEANING
                    ================================================== -->

                    ${
                        word.explain
                            ? `

                                <section class="section">

                                    <h2 class="section-title">
                                        Meaning
                                    </h2>


                                    <div class="meaning-list">

                                        <div class="meaning-item">

                                            <span>
                                                ${escapeHTML(
                                                    word.explain
                                                )}
                                            </span>

                                        </div>

                                    </div>

                                </section>

                              `
                            : ""
                    }


                    <!-- =================================================
                         EXAMPLE SENTENCES
                    ================================================== -->

                    <section class="section">



                        ${
                            examples.length === 0

                                ? `

                                    <p class="no-examples">
                                        No example sentences available.
                                    </p>

                                  `

                                : `

                                    <div class="example-list">

                                        ${
                                            examples.map(
                                                (
                                                    example,
                                                    index
                                                ) => {


                                                    /*
                                                     * String example.
                                                     */

                                                    if (
                                                        typeof example ===
                                                        "string"
                                                    ) {

                                                        return `

                                                            <div class="example">

                                                                <div class="example-number">
                                                                    ${index + 1}.
                                                                </div>


                                                                <div class="example-content">

                                                                    <div class="example-vietnamese">
                                                                        ${escapeHTML(
                                                                            example
                                                                        )}
                                                                    </div>

                                                                </div>

                                                            </div>

                                                        `;

                                                    }


                                                    /*
                                                     * Object example.
                                                     */

                                                    return `

                                                        <div class="example">

                                                            <div class="example-number">
                                                                ${index + 1}.
                                                            </div>


                                                            <div class="example-content">

                                                                ${
                                                                    example.vietnamese
                                                                        ? `

                                                                            <div class="example-vietnamese">
                                                                                ${escapeHTML(
                                                                                    example.vietnamese
                                                                                )}
                                                                            </div>

                                                                          `
                                                                        : ""
                                                                }


                                                                ${
                                                                    example.phonetics
                                                                        ? `

                                                                            <div class="example-phonetics">
                                                                                /${escapeHTML(
                                                                                    example.phonetics
                                                                                )}/
                                                                            </div>

                                                                          `
                                                                        : ""
                                                                }


                                                                ${
                                                                    example.english
                                                                        ? `

                                                                            <div class="example-english">
                                                                                ${escapeHTML(
                                                                                    example.english
                                                                                )}
                                                                            </div>

                                                                          `
                                                                        : ""
                                                                }

                                                            </div>

                                                        </div>

                                                    `;

                                                }
                                            ).join("")
                                        }

                                    </div>

                                  `
                        }

                    </section>

                </article>

            `;


            /* =====================================================
               UPDATE PAGE TITLE
            ====================================================== */

            document.title =
                `${word.vietnamese} — Vietnamese Dictionary`;

        }


        /* =====================================================
           ERROR MESSAGE
        ====================================================== */

        function showError(
            title,
            description
        ) {

            content.innerHTML = `

                <div class="message">

                    <div class="message-icon">
                        ⚠️
                    </div>


                    <h2>
                        ${escapeHTML(
                            title
                        )}
                    </h2>


                    <p>
                        ${escapeHTML(
                            description
                        )}
                    </p>


                    <a
                        href="dictionary.html"
                    >
                        ← Back to Dictionary
                    </a>

                </div>

            `;

        }


        /* =====================================================
           HTML ESCAPE
        ====================================================== */

        function escapeHTML(
            value
        ) {

            return String(value)

                .replaceAll(
                    "&",
                    "&amp;"
                )

                .replaceAll(
                    "<",
                    "&lt;"
                )

                .replaceAll(
                    ">",
                    "&gt;"
                )

                .replaceAll(
                    '"',
                    "&quot;"
                )

                .replaceAll(
                    "'",
                    "&#039;"
                );

        }


        /* =====================================================
           START
        ====================================================== */

        loadWord();

    </script>

</body>

</html>
