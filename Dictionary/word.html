<header>

    <div class="header-inner">

        <a
            href="../index.html?page=dictionary"
            class="back-button"
        >
            ← Back
        </a>

    </div>

</header>


<!-- =====================================================
     MAIN
====================================================== -->

<main>

    <div id="content">

        <div class="message">

            <div class="message-icon">
                ⏳
            </div>

            <h2>
                Loading word...
            </h2>

            <p>
                Please wait while we load the vocabulary.
            </p>

        </div>

    </div>

<script>

/* =====================================================
   ELEMENTS
====================================================== */

const content =
    document.getElementById(
        "content"
    );


/* =====================================================
   URL PARAMETERS
====================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const requestedWord =
    params.get(
        "word"
    );


const requestedCategory =
    params.get(
        "cat"
    );


const requestedTopic =
    params.get(
        "topic"
    );


/* =====================================================
   AUDIO STATE
====================================================== */

let currentAudio = null;

let currentButton = null;


/* =====================================================
   AUDIO FILENAME
   SAME MAPPING AS dictionary.html
====================================================== */

function getAudioFilename(text) {

    text =
        String(
            text ?? ""
        ).trim();


    let result =
        text
            .normalize("NFD")
            .replace(
                /[\u0300-\u036f]/g,
                ""
            )
            .replace(
                /đ/g,
                "d"
            )
            .replace(
                /Đ/g,
                "D"
            )
            .toLowerCase()
            .trim()
            .replace(
                /\s+/g,
                "-"
            );


    /* =================================================
       SPECIAL CASES
       Avoid filename collisions
    ================================================= */

    if (text === "bò")
        return "bo";

    if (text === "bơ")
        return "bo-2";


    if (text === "ba")
        return "ba";

    if (text === "bà")
        return "ba-2";


    if (text === "con")
        return "con-word";


    if (text === "dép")
        return "dep";

    if (text === "đẹp")
        return "dep-2";


    if (text === "mười")
        return "muoi";

    if (text === "mươi")
        return "muoi-2";


    if (text === "cảm")
        return "cam";

    if (text === "cam")
        return "cam-2";


    if (text === "đau")
        return "dau";

    if (text === "đầu")
        return "dau-2";


    if (text === "vớ")
        return "vo";

    if (text === "vợ")
        return "vo-2";


    if (text === "dơ")
        return "do";

    if (text === "đỏ")
        return "do-2";


    if (text === "nặng")
        return "nang";

    if (text === "nắng")
        return "nang-2";


    return result;

}


/* =====================================================
   AUDIO URL
====================================================== */

function getAudioUrl(text) {

    const filename =
        getAudioFilename(
            text
        );


    /*
     * IMPORTANT:
     *
     * This file is:
     *
     * Dictionary/word.html
     *
     * Audio is:
     *
     * audio/vocabulary/
     *
     * Therefore:
     *
     * ../audio/vocabulary/
     */

    return (
        "../audio/vocabulary/" +
        filename +
        ".mp3"
    );

}


/* =====================================================
   PLAY WORD AUDIO
====================================================== */

function playWordAudio(
    button,
    word
) {

    const audioUrl =
        getAudioUrl(
            word
        );


    console.log(
        "WORD:",
        word
    );

    console.log(
        "AUDIO URL:",
        audioUrl
    );


    /*
     * Convert relative URL to absolute URL.
     * This makes comparison with audio.src reliable.
     */

    const absoluteUrl =
        new URL(
            audioUrl,
            window.location.href
        ).href;


    console.log(
        "ABSOLUTE AUDIO URL:",
        absoluteUrl
    );


    /* =================================================
       CLICK SAME AUDIO → STOP
    ================================================= */

    if (
        currentAudio &&
        currentAudio.src === absoluteUrl &&
        !currentAudio.paused
    ) {

        currentAudio.pause();

        currentAudio.currentTime =
            0;


        if (currentButton) {

            currentButton.classList.remove(
                "playing"
            );

            currentButton.classList.remove(
                "error"
            );

            currentButton.textContent =
                "🔊";

        }


        currentAudio =
            null;

        currentButton =
            null;


        return;

    }


    /* =================================================
       STOP PREVIOUS AUDIO
    ================================================= */

    if (currentAudio) {

        currentAudio.pause();

        currentAudio.currentTime =
            0;

    }


    if (currentButton) {

        currentButton.classList.remove(
            "playing"
        );

        currentButton.classList.remove(
            "error"
        );

        currentButton.textContent =
            "🔊";

    }


    /* =================================================
       CREATE AUDIO
    ================================================= */

    const audio =
        new Audio(
            audioUrl
        );


    audio.preload =
        "auto";


    currentAudio =
        audio;

    currentButton =
        button;


    button.classList.remove(
        "error"
    );

    button.classList.add(
        "playing"
    );

    button.textContent =
        "⏸";


    /* =================================================
       AUDIO ERROR
    ================================================= */

    audio.onerror =
        function () {

            console.error(
                "AUDIO FILE NOT FOUND:",
                audioUrl
            );


            button.classList.remove(
                "playing"
            );

            button.classList.add(
                "error"
            );

            button.textContent =
                "⚠️";


            currentAudio =
                null;

            currentButton =
                null;

        };


    /* =================================================
       AUDIO ENDED
    ================================================= */

    audio.onended =
        function () {

            button.classList.remove(
                "playing"
            );

            button.classList.remove(
                "error"
            );

            button.textContent =
                "🔊";


            currentAudio =
                null;

            currentButton =
                null;

        };


    /* =================================================
       PLAY
    ================================================= */

    const playPromise =
        audio.play();


    if (
        playPromise &&
        typeof playPromise.then ===
            "function"
    ) {

        playPromise
            .then(
                function () {

                    console.log(
                        "PLAYING:",
                        audioUrl
                    );

                }
            )
            .catch(
                function (error) {

                    console.error(
                        "AUDIO PLAY ERROR:",
                        error
                    );

                    console.error(
                        "AUDIO URL:",
                        audioUrl
                    );


                    button.classList.remove(
                        "playing"
                    );

                    button.classList.add(
                        "error"
                    );

                    button.textContent =
                        "⚠️";


                    currentAudio =
                        null;

                    currentButton =
                        null;

                }
            );

    }

}


/* =====================================================
   LOAD WORD
====================================================== */

async function loadWord() {

    try {

        if (!requestedWord) {

            showError(
                "No word selected",
                "Please return to the dictionary and select a word."
            );

            return;

        }


        /*
         * word.html is inside:
         *
         * Dictionary/
         *
         * categories.json is in root.
         */

        const response =
            await fetch(
                "../categories.json",
                {
                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                `Could not load categories.json (${response.status})`
            );

        }


        const categories =
            await response.json();


        const wordData =
            findWord(
                categories,
                requestedWord,
                requestedCategory,
                requestedTopic
            );


        if (!wordData) {

            showError(
                "Word not found",
                `We could not find "${requestedWord}" in the vocabulary.`
            );

            return;

        }


        /* =================================================
           ANALYTICS
        ================================================= */

        if (
            typeof trackEvent ===
            "function"
        ) {

            trackEvent(
                "word_view",
                {

                    page:
                        window.location.pathname,

                    metadata: {

                        word:
                            wordData.vietnamese,

                        phonetics:
                            wordData.phonetics,

                        english:
                            wordData.english,

                        category:
                            wordData.category,

                        topic:
                            wordData.topic

                    }

                }
            );

        }


        renderWord(
            wordData
        );

    }

    catch (
        error
    ) {

        console.error(
            "Dictionary word error:",
            error
        );


        showError(
            "Could not load word",
            "Please make sure categories.json is available."
        );

    }

}


/* =====================================================
   FIND WORD
====================================================== */

function findWord(
    categories,
    targetWord,
    targetCategory,
    targetTopic
) {

    const normalizedTarget =
        String(
            targetWord || ""
        )
            .trim()
            .toLowerCase();


    if (!normalizedTarget) {

        return null;

    }


    let exactMatch =
        null;

    let fallbackMatch =
        null;


    /*
     * categories.json structure:
     *
     * {
     *     "People & Pronouns": {
     *         "type": "vocabulary",
     *         "vocab": [
     *             {
     *                 "topic": "Family & People",
     *                 "vocabulary": [
     *                     {
     *                         "vietnamese": "anh",
     *                         "phonetics": "...",
     *                         "english": "..."
     *                     }
     *                 ]
     *             }
     *         ]
     *     }
     * }
     */


    for (
        const [
            categoryName,
            category
        ]
        of Object.entries(
            categories || {}
        )
    ) {

        /*
         * Only vocabulary categories.
         */

        if (
            !category ||
            category.type !==
                "vocabulary"
        ) {

            continue;

        }


        if (
            !Array.isArray(
                category.vocab
            )
        ) {

            continue;

        }


        /*
         * Optional category filter.
         */

        const categoryMatches =
            !targetCategory ||
            String(
                categoryName
            )
                .trim()
                .toLowerCase()
            ===
            String(
                targetCategory
            )
                .trim()
                .toLowerCase();


        /*
         * LOOP THROUGH TOPICS
         */

        for (
            const topic
            of category.vocab
        ) {

            if (
                !topic ||
                !Array.isArray(
                    topic.vocabulary
                )
            ) {

                continue;

            }


            const topicName =
                String(
                    topic.topic || ""
                )
                    .trim();


            /*
             * Optional topic filter.
             */

            const topicMatches =
                !targetTopic ||
                topicName
                    .toLowerCase()
                ===
                String(
                    targetTopic
                )
                    .trim()
                    .toLowerCase();


            /*
             * LOOP THROUGH WORDS
             */

            for (
                const word
                of topic.vocabulary
            ) {

                if (
                    !word ||
                    typeof word !==
                        "object"
                ) {

                    continue;

                }


                const vietnamese =
                    String(
                        word.vietnamese || ""
                    )
                        .trim();


                /*
                 * Match Vietnamese word.
                 */

                if (
                    vietnamese
                        .toLowerCase()
                    !==
                    normalizedTarget
                ) {

                    continue;

                }


                /*
                 * Build word object.
                 */

                const built = {

                    vietnamese:
                        vietnamese,

                    phonetics:
                        word.phonetics ||
                        word.phonetic ||
                        "",

                    english:
                        word.english ||
                        "",

                    wordClass:
                        word.wordClass ||
                        "",

                    explain:
                        word.explain ||
                        "",

                    category:
                        categoryName,

                    topic:
                        topicName,

                    examples:
                        Array.isArray(
                            word.examples
                        )
                            ? word.examples
                            : []

                };


                /*
                 * Keep first match
                 * as fallback.
                 */

                if (
                    !fallbackMatch
                ) {

                    fallbackMatch =
                        built;

                }


                /*
                 * Exact category + topic
                 * match.
                 */

                if (
                    categoryMatches &&
                    topicMatches
                ) {

                    exactMatch =
                        built;

                }

            }

        }

    }


    /*
     * Prefer exact match.
     * Otherwise use first match.
     */

    return (
        exactMatch ||
        fallbackMatch
    );

}


/* =====================================================
   RENDER WORD
====================================================== */

function renderWord(
    word
) {

    /*
     * Render every example
     * available in JSON.
     */

    const examples =
        Array.isArray(
            word.examples
        )
            ? word.examples
            : [];


    content.innerHTML = `

        <article class="word-detail">


            <!-- =============================================
                 WORD HEADER
            ============================================== -->

            <div class="word-header">


                <!-- =========================================
                     WORD + AUDIO
                ========================================== -->

                <div class="word-title-row">

                    <div class="word">

                        ${escapeHTML(
                            word.vietnamese
                        )}

                    </div>


                    <button
                        type="button"
                        class="audio-button"
                        aria-label="Play pronunciation"
                        title="Play pronunciation"
                        onclick='playWordAudio(
                            this,
                            ${JSON.stringify(
                                word.vietnamese
                            )}
                        )'
                    >
                        🔊
                    </button>

                </div>


                <!-- =========================================
                     PHONETICS
                ========================================== -->

                ${
                    word.phonetics
                        ?

                        `

                            <div class="phonetics">

                                /${escapeHTML(
                                    word.phonetics
                                )}/

                            </div>

                        `

                        :

                        ""
                }


                <!-- =========================================
                     ENGLISH
                ========================================== -->

                ${
                    word.english
                        ?

                        `

                            <div class="english">

                                ${escapeHTML(
                                    word.english
                                )}

                            </div>

                        `

                        :

                        ""
                }


                <!-- =========================================
                     WORD CLASS
                ========================================== -->

                ${
                    word.wordClass
                        ?

                        `

                            <div class="word-class">

                                ${escapeHTML(
                                    word.wordClass
                                )}

                            </div>

                        `

                        :

                        ""
                }

            </div>


            <!-- =============================================
                 MEANING
            ============================================== -->

            ${
                word.explain

                    ?

                    `

                        <section class="section">

                            <h2 class="section-title">
                                Meaning
                            </h2>


                            <div class="meaning-list">

                                <div class="meaning-item">

                                    <span>

                                        ${escapeHTML(
                                            word.explain
                                        )}

                                    </span>

                                </div>

                            </div>

                        </section>

                    `

                    :

                    ""

            }


            <!-- =============================================
                 EXAMPLES
            ============================================== -->

            <section class="section">


                <h2 class="section-title">
                    Example
                </h2>


                ${
                    examples.length === 0

                        ?

                        `

                            <p class="no-examples">

                                No example sentences available.

                            </p>

                        `

                        :

                        `

                            <div class="example-list">

                                ${examples
                                    .map(
                                        (
                                            example,
                                            index
                                        ) =>
                                            renderExample(
                                                example,
                                                index
                                            )
                                    )
                                    .join("")}

                            </div>

                        `

                }

            </section>


        </article>

    `;


    document.title =
        `${word.vietnamese} — Vietnamese Dictionary`;

}


/* =====================================================
   RENDER EXAMPLE
====================================================== */

function renderExample(
    example,
    index
) {

    /*
     * Example can be:
     *
     * "Tôi đi..."
     *
     * OR
     *
     * {
     *     vietnamese: "...",
     *     phonetics: "...",
     *     english: "..."
     * }
     */


    if (
        typeof example === "string"
    ) {

        return `

            <div class="example">

                <div class="example-number">

                    ${index + 1}.

                </div>


                <div class="example-content">

                    <div class="example-vietnamese">

                        ${escapeHTML(
                            example
                        )}

                    </div>

                </div>

            </div>

        `;

    }


    if (
        !example ||
        typeof example !== "object"
    ) {

        return "";

    }


    const vietnamese =
        example.vietnamese ||
        "";


    const phonetics =
        example.phonetics ||
        example.phonetic ||
        "";


    const english =
        example.english ||
        "";


    return `

        <div class="example">

            <div class="example-number">

                ${index + 1}.

            </div>


            <div class="example-content">


                ${
                    vietnamese

                        ?

                        `

                            <div class="example-vietnamese">

                                ${escapeHTML(
                                    vietnamese
                                )}

                            </div>

                        `

                        :

                        ""

                }


                ${
                    phonetics

                        ?

                        `

                            <div class="example-phonetics">

                                /${escapeHTML(
                                    phonetics
                                )}/

                            </div>

                        `

                        :

                        ""

                }


                ${
                    english

                        ?

                        `

                            <div class="example-english">

                                ${escapeHTML(
                                    english
                                )}

                            </div>

                        `

                        :

                        ""

                }


            </div>

        </div>

    `;

}


/* =====================================================
   ERROR
====================================================== */

function showError(
    title,
    description
) {

    content.innerHTML = `

        <div class="message">


            <div class="message-icon">
                ⚠️
            </div>


            <h2>

                ${escapeHTML(
                    title
                )}

            </h2>


            <p>

                ${escapeHTML(
                    description
                )}

            </p>


            <a
                href="../index.html?page=dictionary"
            >
                ← Back
            </a>


        </div>

    `;

}


/* =====================================================
   HTML ESCAPE
====================================================== */

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}
