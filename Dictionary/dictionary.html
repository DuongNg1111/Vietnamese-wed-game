<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Browse and search Vietnamese vocabulary from all vocabulary categories."
    >

    <title>Vietnamese Dictionary</title>


    <!-- =========================================================
         GOOGLE FONTS
    ========================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap"
        rel="stylesheet"
    >


    <style>


        /* =========================================================
           RESET
        ========================================================== */

        * {

            box-sizing:
                border-box;

            margin:
                0;

            padding:
                0;

        }


        /* =========================================================
           THEME
        ========================================================== */

        :root {

            --accent: #2E2E2E;
            --accent-dark: #1F1F1F;
            --accent-light: #f5f5f5;
            --accent-bg: #F9F9F9;
            --accent-border: #d0d0d0;

            --ink: #143a6b;
            --ink-soft: #66809d;

            --phonetic: rgb(0, 116, 217);

            --white: #ffffff;

            --radius: 14px;


            --correct:
                #019b3f;

            --correct-bg:
                #eaf3ff;


            --wrong:
                #d9536f;

            --wrong-bg:
                #fff0f3;


            --white:
                #ffffff;


            --line:
                #e2e6eb;


            --shadow:
                0 8px 25px
                rgba(20, 58, 107, 0.07);

        }


        /* =========================================================
           BODY
        ========================================================== */

        body {

            margin:
                0;

            min-height:
                100vh;

            padding:
                28px
                20px
                45px;

            font-family:
                Calibri,
                "Segoe UI",
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            color:
                var(--ink);

            background:
                linear-gradient(
                    180deg,
                    #ffffff 0%,
                    var(--accent-bg) 48%,
                    var(--accent-light) 100%
                );

        }


        /* =========================================================
           PAGE
        ========================================================== */

        .page {

            width:
                100%;

            max-width:
                900px;

            margin:
                0 auto;

        }


        /* =========================================================
           BACK BUTTON
        ========================================================== */

        .back-button {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                7px;

            margin-bottom:
                18px;

            color:
                var(--ink-soft);

            text-decoration:
                none;

            font-size:
                15px;

            font-weight:
                700;

            transition:
                color 0.2s ease,
                transform 0.2s ease;

        }


        .back-button:hover {

            color:
                var(--ink);

            transform:
                translateX(-3px);

        }


        /* =========================================================
           DICTIONARY CONTAINER
        ========================================================== */

        .dictionary-container {

            position:
                relative;

            overflow:
                hidden;

            background:
                var(--white);

            border:
                1px solid
                var(--accent-border);

            border-radius:
                16px;

            box-shadow:
                var(--shadow);

        }


        /* =========================================================
           ACCENT LINE
        ========================================================== */

        .dictionary-container::before {

            content:
                "";

            display:
                block;

            width:
                100%;

            height:
                5px;

            background:
                var(--accent);

        }


        /* =========================================================
           HEADER
        ========================================================== */

        .dictionary-header {

            padding:
                30px
                32px
                25px;

            border-bottom:
                1px solid
                var(--line);

        }


        .dictionary-title {

            font-family:
                "Kalam",
                cursive;

            color:
                var(--ink);

            font-size:
                clamp(42px, 6vw, 56px);

            line-height:
                1.1;

            font-weight:
                700;

            margin-bottom:
                8px;

        }


        .dictionary-description {

            color:
                var(--ink-soft);

            font-size:
                17px;

            line-height:
                1.55;

        }


        /* =========================================================
           CONTENT
        ========================================================== */

        .dictionary-content {

            padding:
                28px
                32px
                36px;

        }


        /* =========================================================
           SEARCH
        ========================================================== */

        .search-box {

            position:
                relative;

            margin-bottom:
                12px;

        }


        .search-icon {

            position:
                absolute;

            left:
                17px;

            top:
                50%;

            transform:
                translateY(-50%);

            color:
                white;

            font-size:
                21px;

            pointer-events:
                none;

        }


        #searchInput {

            width:
                100%;

            min-height:
                48px;

            padding:
                10px
                16px
                10px
                47px;

            border:
                1.5px solid
                var(--accent-border);

            border-radius:
                10px;

            background:
                white;

            color:
                var(--ink);

            font-family:
                Calibri,
                "Segoe UI",
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            font-size:
                17px;

            outline:
                none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;

        }


        #searchInput::placeholder {

            color:
                #9aa9b8;

        }


        #searchInput:focus {

            border-color:
                var(--accent);

            background:
                var(--white);

            box-shadow:
                0 0 0 3px
                rgba(162, 117, 52, 0.10);

        }


        /* =========================================================
           STATS
        ========================================================== */

        .stats {

            display:
                flex;

            align-items:
                center;

            justify-content:
                flex-start;

            margin-bottom:
                24px;

            color:
                var(--ink-soft);

            font-size:
                14px;

        }


        .stats strong {

            color:
                var(--accent-dark);

            font-weight:
                800;

        }


        /* =========================================================
           DICTIONARY GRID
        ========================================================== */

        #dictionaryGrid {

            display:
                grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(0, 1fr)
                );

            gap:
                14px;

        }


        /* =========================================================
           WORD CARD
        ========================================================== */

        .word-card {

            position:
                relative;

            overflow:
                hidden;

            width:
                100%;

            padding:
                20px;

            text-align:
                left;

            background:
                var(--white);

            border:
                1px solid
                var(--accent-border);

            border-radius:
                12px;

            box-shadow:
                0 3px 10px
                rgba(20, 58, 107, 0.04);

            color:
                var(--ink);

            font-family:
                Calibri,
                "Segoe UI",
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            cursor:
                pointer;

            appearance:
                none;

            -webkit-appearance:
                none;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                border-color 0.2s ease;

        }


        /* =========================================================
           CARD ACCENT LINE
        ========================================================== */

        .word-card::before {

            content:
                "";

            position:
                absolute;

            top:
                0;

            left:
                0;

            width:
                100%;

            height:
                3px;

            background:
                var(--accent);

        }


        /* =========================================================
           CARD HOVER
        ========================================================== */

        .word-card:hover {

            transform:
                translateY(-3px);

            border-color:
                var(--accent);

            box-shadow:
                0 9px 22px
                rgba(162, 117, 52, 0.12);

        }


        .word-card:focus {

            outline:
                3px solid
                rgba(162, 117, 52, 0.16);

            outline-offset:
                2px;

        }


        .word-card:active {

            transform:
                translateY(-1px);

        }


        /* =========================================================
           WORD TOP
        ========================================================== */

        .word-top {

            display:
                flex;

            align-items:
                flex-start;

            justify-content:
                space-between;

            gap:
                12px;

            margin-bottom:
                4px;

        }


        /* =========================================================
           VIETNAMESE
        ========================================================== */

        .vietnamese {

            color:
                var(--ink);

            font-size:
                25px;

            font-weight:
                700;

            line-height:
                1.3;

        }


        /* =========================================================
           PHONETICS
        ========================================================== */

        .phonetics {

            color:
                var(--phonetic);

            font-size:
                15px;

            font-style:
                italic;

            line-height:
                1.4;

            margin-bottom:
                9px;

        }


        /* =========================================================
           ENGLISH
        ========================================================== */

        .english {

            color:
                var(--ink-soft);

            font-size:
                16px;

            font-weight:
                500;

            line-height:
                1.45;

        }


        /* =========================================================
           METADATA
        ========================================================== */

        .metadata {

            display:
                flex;

            flex-wrap:
                wrap;

            gap:
                6px;

            margin-top:
                13px;

        }


        /* =========================================================
           TAG
        ========================================================== */

        .tag {

            display:
                inline-flex;

            align-items:
                center;

            padding:
                4px
                8px;

            border:
                1px solid
                var(--accent-border);

            border-radius:
                7px;

            background:
                var(--accent-light);

            color:
                var(--accent-dark);

            font-size:
                12px;

            font-weight:
                700;

            line-height:
                1.3;

        }


        /* =========================================================
           TOPIC TAG
        ========================================================== */

        .topic-tag {

            background:
                var(--accent-bg);

            color:
                var(--ink-soft);

            border-color:
                var(--line);

        }


        /* =========================================================
           CLICK HINT
        ========================================================== */

        .click-hint {

            margin-top:
                13px;

            padding-top:
                10px;

            border-top:
                1px solid
                var(--line);

            color:
                var(--ink-soft);

            font-size:
                12px;

            font-weight:
                600;

        }


        /* =========================================================
           MESSAGE
        ========================================================== */

        .message {

            grid-column:
                1 / -1;

            padding:
                50px
                20px;

            text-align:
                center;

            color:
                var(--ink-soft);

        }


        .message-icon {

            margin-bottom:
                10px;

            font-size:
                38px;

        }


        .message h2 {

            margin-bottom:
                7px;

            color:
                var(--ink);

            font-size:
                22px;

            font-weight:
                700;

        }


        .message p {

            font-size:
                15px;

            line-height:
                1.55;

        }


        /* =========================================================
           MOBILE
        ========================================================== */

        @media (max-width: 700px) {

            body {

                padding:
                    20px
                    14px
                    35px;

            }


            .dictionary-header {

                padding:
                    25px
                    22px
                    21px;

            }


            .dictionary-content {

                padding:
                    24px
                    22px
                    30px;

            }


            #dictionaryGrid {

                grid-template-columns:
                    1fr;

            }

        }


        @media (max-width: 520px) {

            body {

                padding:
                    16px
                    12px
                    30px;

            }


            .back-button {

                margin-bottom:
                    14px;

                font-size:
                    14px;

            }


            .dictionary-container {

                border-radius:
                    13px;

            }


            .dictionary-header {

                padding:
                    22px
                    18px
                    19px;

            }


            .dictionary-content {

                padding:
                    22px
                    18px
                    27px;

            }


            .dictionary-title {

                font-size:
                    43px;

            }


            .dictionary-description {

                font-size:
                    16px;

            }


            #searchInput {

                font-size:
                    16px;

            }


            .word-card {

                padding:
                    18px;

            }


            .vietnamese {

                font-size:
                    24px;

            }

        }


    </style>

</head>


<body>


<div class="page">


    <!-- =========================================================
         BACK
    ========================================================== -->

    <a
        href="../index.html"
        class="back-button"
    >
        ← Back to Lobby
    </a>


    <!-- =========================================================
         DICTIONARY CONTAINER
    ========================================================== -->

    <main class="dictionary-container">


        <!-- =====================================================
             HEADER
        ====================================================== -->

        <header class="dictionary-header">

            <h1 class="dictionary-title">
                Dictionary
            </h1>


            <p class="dictionary-description">

                Browse and search Vietnamese vocabulary
                from all vocabulary categories.

            </p>

        </header>


        <!-- =====================================================
             CONTENT
        ====================================================== -->

        <div class="dictionary-content">


            <!-- =================================================
                 SEARCH
            ================================================== -->

            <div class="search-box">

                <span
                    class="search-icon"
                    aria-hidden="true"
                >
                    🔎
                </span>


                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search Vietnamese or English..."
                    autocomplete="off"
                    aria-label="Search dictionary"
                >

            </div>


            <!-- =================================================
                 STATS
            ================================================== -->

            <div class="stats">

                <span>

                    Showing

                    <strong id="resultCount">
                        0
                    </strong>

                    words

                </span>

            </div>


            <!-- =================================================
                 DICTIONARY GRID
            ================================================== -->

            <div id="dictionaryGrid">

                <div class="message">

                    <div class="message-icon">
                        ⏳
                    </div>

                    <h2>
                        Loading dictionary...
                    </h2>

                    <p>
                        Please wait while we load the vocabulary.
                    </p>

                </div>

            </div>


        </div>

    </main>


</div>


<script>


    /* =========================================================
       ELEMENTS
    ========================================================== */

    const dictionaryGrid =
        document.getElementById(
            "dictionaryGrid"
        );


    const searchInput =
        document.getElementById(
            "searchInput"
        );


    const resultCount =
        document.getElementById(
            "resultCount"
        );


    let dictionary = [];


    /* =========================================================
       LOAD CATEGORIES.JSON
    ========================================================== */

    async function loadDictionary() {

        try {

            /*
             * dictionary.html is inside:
             *
             * Dictionary/
             *
             * categories.json is inside:
             *
             * WEB GAME/
             *
             * Therefore:
             *
             * ../categories.json
             */

            const response =
                await fetch(
                    "../categories.json"
                );


            if (!response.ok) {

                throw new Error(
                    "Could not load categories.json"
                );

            }


            const categories =
                await response.json();


            buildDictionary(
                categories
            );


            renderDictionary(
                dictionary
            );

        }

        catch (error) {

            console.error(
                "Dictionary error:",
                error
            );


            dictionaryGrid.innerHTML = `

                <div class="message">

                    <div class="message-icon">
                        ⚠️
                    </div>

                    <h2>
                        Could not load dictionary
                    </h2>

                    <p>
                        Please make sure
                        <strong>categories.json</strong>
                        is in the main WEB GAME folder.
                    </p>

                </div>

            `;

        }

    }


    /* =========================================================
       BUILD DICTIONARY
    ========================================================== */

    function buildDictionary(
        categories
    ) {

        dictionary = [];


        Object.entries(
            categories
        ).forEach(
            ([categoryName, category]) => {

                /*
                 * ONLY vocabulary categories.
                 *
                 * Sentences and Useful Phrases
                 * are ignored automatically.
                 */

                if (
                    category.type !== "vocabulary"
                    ||
                    !Array.isArray(
                        category.vocab
                    )
                ) {

                    return;

                }


                category.vocab.forEach(
                    topic => {

                        if (
                            !Array.isArray(
                                topic.vocabulary
                            )
                        ) {

                            return;

                        }


                        topic.vocabulary.forEach(
                            word => {

                                dictionary.push({

                                    vietnamese:
                                        word.vietnamese || "",

                                    phonetics:
                                        word.phonetics || "",

                                    english:
                                        word.english || "",

                                    category:
                                        categoryName,

                                    topic:
                                        topic.topic || ""

                                });

                            }
                        );

                    }
                );

            }
        );


        /*
         * Sort alphabetically
         * by Vietnamese word.
         */

        dictionary.sort(
            (a, b) =>
                a.vietnamese.localeCompare(
                    b.vietnamese,
                    "vi"
                )
        );

    }


    /* =========================================================
       RENDER DICTIONARY
    ========================================================== */

    function renderDictionary(
        words
    ) {

        resultCount.textContent =
            words.length;


        /*
         * No results.
         */

        if (
            words.length === 0
        ) {

            dictionaryGrid.innerHTML = `

                <div class="message">

                    <div class="message-icon">
                        🔍
                    </div>

                    <h2>
                        No words found
                    </h2>

                    <p>
                        Try a different search.
                    </p>

                </div>

            `;

            return;

        }


        /*
         * Create cards.
         */

        dictionaryGrid.innerHTML =
            words.map(
                (word, index) => `

                    <button
                        type="button"
                        class="word-card"
                        data-index="${index}"
                        aria-label="View details for ${escapeHTML(
                            word.vietnamese
                        )}"
                    >

                        <div class="word-top">

                            <div class="vietnamese">

                                ${escapeHTML(
                                    word.vietnamese
                                )}

                            </div>

                        </div>


                        ${
                            word.phonetics
                                ? `

                                    <div class="phonetics">

                                        /${escapeHTML(
                                            word.phonetics
                                        )}/

                                    </div>

                                `
                                : ""
                        }


                        <div class="english">

                            ${escapeHTML(
                                word.english
                            )}

                        </div>


                        <div class="metadata">

                            ${
                                word.category
                                    ? `

                                        <span class="tag">

                                            ${escapeHTML(
                                                word.category
                                            )}

                                        </span>

                                    `
                                    : ""
                            }


                            ${
                                word.topic
                                    ? `

                                        <span class="tag topic-tag">

                                            ${escapeHTML(
                                                word.topic
                                            )}

                                        </span>

                                    `
                                    : ""
                            }

                        </div>


                        <div class="click-hint">

                            Click to view details →

                        </div>

                    </button>

                `
            )
            .join("");


        /*
         * Add click events.
         *
         * Pass:
         *
         * word
         * category
         * topic
         *
         * so word.html can identify
         * the exact dictionary entry.
         */

        document
            .querySelectorAll(
                ".word-card"
            )
            .forEach(
                card => {

                    card.addEventListener(
                        "click",
                        () => {

                            const index =
                                Number(
                                    card.dataset.index
                                );


                            const word =
                                words[index];


                            if (!word) {

                                return;

                            }


                            const url =
                                "word.html" +
                                "?word=" +
                                encodeURIComponent(
                                    word.vietnamese
                                ) +
                                "&cat=" +
                                encodeURIComponent(
                                    word.category
                                ) +
                                "&topic=" +
                                encodeURIComponent(
                                    word.topic
                                );


                            window.location.href =
                                url;

                        }
                    );

                }
            );

    }


    /* =========================================================
       SEARCH
    ========================================================== */

    searchInput.addEventListener(
        "input",
        () => {

            const query =
                searchInput.value
                    .trim()
                    .toLowerCase();


            /*
             * Empty search.
             */

            if (!query) {

                renderDictionary(
                    dictionary
                );

                return;

            }


            /*
             * Search Vietnamese,
             * phonetics,
             * English,
             * category,
             * topic.
             */

            const filtered =
                dictionary.filter(
                    word => {

                        const vietnamese =
                            word.vietnamese
                                .toLowerCase();


                        const phonetics =
                            word.phonetics
                                .toLowerCase();


                        const english =
                            word.english
                                .toLowerCase();


                        const category =
                            word.category
                                .toLowerCase();


                        const topic =
                            word.topic
                                .toLowerCase();


                        return (

                            vietnamese.includes(
                                query
                            )

                            ||

                            phonetics.includes(
                                query
                            )

                            ||

                            english.includes(
                                query
                            )

                            ||

                            category.includes(
                                query
                            )

                            ||

                            topic.includes(
                                query
                            )

                        );

                    }
                );


            renderDictionary(
                filtered
            );

        }
    );


    /* =========================================================
       HTML ESCAPE
    ========================================================== */

    function escapeHTML(
        value
    ) {

        return String(value)

            .replaceAll(
                "&",
                "&amp;"
            )

            .replaceAll(
                "<",
                "&lt;"
            )

            .replaceAll(
                ">",
                "&gt;"
            )

            .replaceAll(
                '"',
                "&quot;"
            )

            .replaceAll(
                "'",
                "&#039;"
            );

    }


    /* =========================================================
       START
    ========================================================== */

    loadDictionary();


</script>


</body>

</html>
