<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Vietnamese Pronouns True or False</title>

<meta
    name="game-title"
    content="Vietnamese Pronouns True or False"
>

<meta
    name="game-description"
    content="Practice Vietnamese pronouns by deciding whether each pronoun is correct."
>

<meta
    name="game-icon"
    content="👤"
>


<style>

/* ==========================================================
   RESET
========================================================== */

*{
    box-sizing:border-box;
}


body{

    margin:0;

    font-family:
        'Segoe UI',
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    background:#f4f7f6;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    color:#2c3e50;

}


/* ==========================================================
   SCREEN
========================================================== */

.screen{
    display:none;
}


.screen.active{
    display:block;
}


/* ==========================================================
   CONTAINER
========================================================== */

.container{

    position:relative;

    width:min(900px,96vw);

    margin:0 auto;

    background:white;

    padding:65px 30px 30px;

    border-radius:20px;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.08);

}


/* ==========================================================
   BACK TO LOBBY
========================================================== */

.lobby-btn{

    position:absolute;

    top:20px;

    left:22px;

    padding:8px 14px;

    border:none;

    border-radius:8px;

    background:#eef5fc;

    color:#34495e;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.lobby-btn:hover{

    background:#dcecff;

    transform:translateX(-2px);

}


/* ==========================================================
   INTRO
========================================================== */

#intro{

    text-align:center;

    padding:20px 20px 30px;

}


#intro .emoji{

    font-size:60px;

    margin-bottom:10px;

}


#intro h1{

    margin:0 0 10px;

    font-size:34px;

}


#intro p{

    color:#7f8c8d;

    font-size:18px;

    line-height:1.6;

}


.start-btn{

    margin-top:20px;

    padding:14px 35px;

    border:none;

    border-radius:12px;

    background:#34495e;

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.start-btn:hover{

    background:#2c3e50;

    transform:translateY(-2px);

}


/* ==========================================================
   TITLE
========================================================== */

.title{

    text-align:center;

    margin:0 0 5px;

}


.subtitle{

    text-align:center;

    color:#7f8c8d;

    margin-bottom:25px;

}


/* ==========================================================
   GAME BOX
========================================================== */

.game-box{

    background:#fff;

    padding:25px;

    border-radius:15px;

    border:1px solid #eee;

    text-align:center;

}


.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:15px;

    font-weight:bold;

}


.question-count{

    color:#7f8c8d;

}


.score{

    color:#27ae60;

    font-size:18px;

}


/* ==========================================================
   PROGRESS
========================================================== */

.progress-wrap{

    width:100%;

    height:9px;

    background:#eee;

    border-radius:20px;

    overflow:hidden;

    margin-bottom:20px;

}


.progress{

    width:0%;

    height:100%;

    background:#34495e;

    transition:.3s;

}


/* ==========================================================
   QUESTION
========================================================== */

.card{

    background:#fffde7;

    border:2px dashed #f1c40f;

    border-radius:12px;

    padding:35px 25px;

    margin:20px 0;

    min-height:180px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    gap:12px;

}


.scenario{

    color:#7f8c8d;

    font-size:16px;

    line-height:1.5;

}


.statement{

    font-size:27px;

    font-weight:700;

    color:#2c3e50;

}


/* ==========================================================
   TRUE / FALSE OPTIONS
========================================================== */

.options{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:15px;

}


.option-btn{

    padding:18px;

    font-size:20px;

    font-weight:bold;

    color:white;

    border:none;

    border-radius:10px;

    cursor:pointer;

    transition:.2s;

}


.true-btn{

    background:#27ae60;

}


.true-btn:hover{

    background:#219653;

    transform:translateY(-2px);

}


.false-btn{

    background:#e74c3c;

}


.false-btn:hover{

    background:#c0392b;

    transform:translateY(-2px);

}


.option-btn.correct{

    background:#27ae60;

}


.option-btn.wrong{

    background:#e74c3c;

}


.option-btn.disabled{

    pointer-events:none;

    opacity:.7;

}


/* ==========================================================
   RESULT
========================================================== */

.result-message{

    min-height:40px;

    margin-top:20px;

    font-size:18px;

    font-weight:bold;

}


.correct-text{

    color:#27ae60;

}


.wrong-text{

    color:#e74c3c;

}


.explanation{

    min-height:30px;

    margin-top:5px;

    color:#7f8c8d;

    font-size:15px;

    line-height:1.5;

}


/* ==========================================================
   NEXT BUTTON
========================================================== */

.next-btn{

    padding:12px 28px;

    border:none;

    border-radius:10px;

    background:#34495e;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    margin-top:10px;

    transition:.2s;

}


.next-btn:hover{

    background:#2c3e50;

    transform:translateY(-2px);

}


/* ==========================================================
   FINAL
========================================================== */

#final{

    text-align:center;

    padding:30px 20px 40px;

}


#final h2{

    font-size:35px;

    color:#27ae60;

}


.final-score{

    font-size:30px;

    margin:25px 0;

    font-weight:bold;

    color:#1976d2;

}


.final-message{

    color:#7f8c8d;

    font-size:18px;

}


/* ==========================================================
   MOBILE
========================================================== */

@media(max-width:600px){

    body{

        padding:10px;

    }


    .container{

        padding:60px 15px 20px;

    }


    .options{

        grid-template-columns:1fr;

    }


    .card{

        min-height:150px;

        padding:25px 15px;

    }


    .statement{

        font-size:23px;

    }


    #intro h1{

        font-size:28px;

    }


    #final h2{

        font-size:30px;

    }


    .lobby-btn{

        top:16px;

        left:16px;

        font-size:13px;

        padding:7px 12px;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- ========================================================
     BACK TO LOBBY
========================================================= -->

<button
    class="lobby-btn"
    onclick="backToLobby()"
>

    ← Back to Lobby

</button>



<!-- ========================================================
     INTRO
========================================================= -->

<div
    id="intro"
    class="screen active"
>

    <div class="emoji">

        👤

    </div>


    <h1>

        Vietnamese Pronouns
        <br>
        True or False

    </h1>


    <p>

        Read each situation and pronoun.
        <br>
        Decide if the pronoun is correct.

    </p>


    <p>

        🎯 10 questions

    </p>


    <button
        class="start-btn"
        onclick="startGame()"
    >

        Start Game

    </button>

</div>



<!-- ========================================================
     GAME
========================================================= -->

<div
    id="game"
    class="screen"
>


    <h1 class="title">

        👤 Pronouns: True or False

    </h1>


    <p class="subtitle">

        Is the Vietnamese pronoun correct?

    </p>



    <div class="game-box">


        <!-- TOP BAR -->

        <div class="topbar">


            <div class="question-count">

                Question

                <span id="questionNumber">
                    1
                </span>

                /

                <span id="totalQuestions">
                    10
                </span>

            </div>


            <div class="score">

                Score:

                <span id="score">
                    0
                </span>

            </div>


        </div>



        <!-- PROGRESS -->

        <div class="progress-wrap">

            <div
                class="progress"
                id="progress"
            ></div>

        </div>



        <!-- QUESTION -->

        <div
            class="card"
            id="questionCard"
        >

            <div
                class="scenario"
                id="scenario"
            ></div>


            <div
                class="statement"
                id="statement"
            ></div>

        </div>



        <!-- OPTIONS -->

        <div class="options">


            <button
                class="option-btn true-btn"
                id="trueBtn"
                onclick="handleAnswer(true)"
            >

                ✅ TRUE

            </button>


            <button
                class="option-btn false-btn"
                id="falseBtn"
                onclick="handleAnswer(false)"
            >

                ❌ FALSE

            </button>


        </div>



        <!-- RESULT -->

        <div
            class="result-message"
            id="resultText"
        ></div>


        <div
            class="explanation"
            id="explanation"
        ></div>



        <!-- NEXT -->

        <button
            class="next-btn"
            id="nextBtn"
            onclick="nextQuestion()"
            style="display:none;"
        >

            Next →

        </button>


    </div>


</div>



<!-- ========================================================
     FINAL
========================================================= -->

<div
    id="final"
    class="screen"
>


    <h2>

        🎉 Game Complete!

    </h2>


    <p class="final-message">

        You completed the
        Vietnamese Pronouns True or False challenge.

    </p>


    <div class="final-score">

        Score:

        <span id="finalScore"></span>

    </div>


    <p
        class="final-message"
        id="finalMessage"
    ></p>


    <button
        class="start-btn"
        onclick="restartGame()"
    >

        Play Again

    </button>


</div>


</div>



<script>


/* ==========================================================
   QUESTION DATABASE
========================================================== */

const database = [

    {
        scenario:
        "You meet a man from your grandparents' generation.",

        statement:
        "You call him “Ông.”",

        answer:true,

        explanation:
        "Ông is commonly used for a man in the grandparents' generation."
    },


    {
        scenario:
        "You meet a woman from your grandparents' generation.",

        statement:
        "You call her “Chị.”",

        answer:false,

        explanation:
        "A woman in the grandparents' generation is usually called Bà."
    },


    {
        scenario:
        "You meet your mother's younger brother.",

        statement:
        "You call him “Chú.”",

        answer:true,

        explanation:
        "Chú is commonly used for a younger male relative in the parents' generation."
    },


    {
        scenario:
        "You meet your mother's younger sister.",

        statement:
        "You call her “Dì.”",

        answer:true,

        explanation:
        "Dì is commonly used for a younger female relative in the parents' generation."
    },


    {
        scenario:
        "You meet someone from your parents' generation who is older than your parents.",

        statement:
        "You call them “Bác.”",

        answer:true,

        explanation:
        "Bác is used for an older person in the parents' generation."
    },


    {
        scenario:
        "You meet a man of your generation who is older than you.",

        statement:
        "You call him “Anh.”",

        answer:true,

        explanation:
        "Anh is used for an older male in your generation."
    },


    {
        scenario:
        "You meet a woman of your generation who is older than you.",

        statement:
        "You call her “Em.”",

        answer:false,

        explanation:
        "A woman of your generation who is older than you is called Chị."
    },


    {
        scenario:
        "You talk to someone of your generation who is younger than you.",

        statement:
        "You call them “Em.”",

        answer:true,

        explanation:
        "Em is commonly used for someone younger than you in your generation."
    },


    {
        scenario:
        "You talk to a young child from a younger generation.",

        statement:
        "You call them “Cháu.”",

        answer:true,

        explanation:
        "Cháu is commonly used for someone from a younger generation."
    },


    {
        scenario:
        "You meet your older sister.",

        statement:
        "You call her “Chị.”",

        answer:true,

        explanation:
        "Chị is used for an older female in your generation."
    }

];



/* ==========================================================
   STATE
========================================================== */

let questions = [];

let currentQuestion = 0;

let score = 0;

let answered = false;



/* ==========================================================
   SHUFFLE
========================================================== */

function shuffle(array){

    const arr = [...array];


    for(
        let i = arr.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] = [
            arr[j],
            arr[i]
        ];

    }


    return arr;

}



/* ==========================================================
   START GAME
========================================================== */

function startGame(){

    questions =
        shuffle(database);


    currentQuestion = 0;

    score = 0;


    document
        .getElementById("intro")
        .classList.remove("active");


    document
        .getElementById("final")
        .classList.remove("active");


    document
        .getElementById("game")
        .classList.add("active");


    document
        .getElementById("score")
        .textContent =
        "0";


    document
        .getElementById("totalQuestions")
        .textContent =
        questions.length;


    loadQuestion();

}



/* ==========================================================
   LOAD QUESTION
========================================================== */

function loadQuestion(){

    answered = false;


    const question =
        questions[currentQuestion];


    document
        .getElementById("questionNumber")
        .textContent =
        currentQuestion + 1;


    document
        .getElementById("progress")
        .style.width =
        (
            currentQuestion /
            questions.length *
            100
        ) + "%";


    document
        .getElementById("scenario")
        .textContent =
        question.scenario;


    document
        .getElementById("statement")
        .textContent =
        question.statement;


    document
        .getElementById("resultText")
        .textContent =
        "";


    document
        .getElementById("resultText")
        .className =
        "result-message";


    document
        .getElementById("explanation")
        .textContent =
        "";


    document
        .getElementById("nextBtn")
        .style.display =
        "none";


    document
        .getElementById("trueBtn")
        .className =
        "option-btn true-btn";


    document
        .getElementById("falseBtn")
        .className =
        "option-btn false-btn";

}



/* ==========================================================
   HANDLE ANSWER
========================================================== */

function handleAnswer(selected){

    if(answered){

        return;

    }


    const question =
        questions[currentQuestion];


    const trueBtn =
        document.getElementById(
            "trueBtn"
        );


    const falseBtn =
        document.getElementById(
            "falseBtn"
        );


    const selectedButton =
        selected
            ? trueBtn
            : falseBtn;


    if(selected === question.answer){

        answered = true;

        score++;


        selectedButton.classList.add(
            "correct"
        );


        document
            .getElementById("score")
            .textContent =
            score;


        document
            .getElementById("resultText")
            .textContent =
            "🎉 Correct!";


        document
            .getElementById("resultText")
            .className =
            "result-message correct-text";


        document
            .getElementById("explanation")
            .textContent =
            question.explanation;


        trueBtn.classList.add(
            "disabled"
        );


        falseBtn.classList.add(
            "disabled"
        );


        const nextBtn =
            document.getElementById(
                "nextBtn"
            );


        nextBtn.style.display =
            "inline-block";


        if(
            currentQuestion ===
            questions.length - 1
        ){

            nextBtn.textContent =
                "Finish 🎉";

        }else{

            nextBtn.textContent =
                "Next →";

        }


    }else{

        selectedButton.classList.add(
            "wrong"
        );


        document
            .getElementById("resultText")
            .textContent =
            "❌ Try again!";


        document
            .getElementById("resultText")
            .className =
            "result-message wrong-text";


        setTimeout(() => {

            selectedButton.classList.remove(
                "wrong"
            );

        },600);

    }

}



/* ==========================================================
   NEXT QUESTION
========================================================== */

function nextQuestion(){

    currentQuestion++;


    if(
        currentQuestion <
        questions.length
    ){

        loadQuestion();

    }else{

        finishGame();

    }

}



/* ==========================================================
   FINISH GAME
========================================================== */

function finishGame(){

    document
        .getElementById("game")
        .classList.remove(
            "active"
        );


    document
        .getElementById("final")
        .classList.add(
            "active"
        );


    document
        .getElementById("finalScore")
        .textContent =
        score +
        " / " +
        questions.length;


    const percent =
        Math.round(
            score /
            questions.length *
            100
        );


    let message;


    if(percent >= 90){

        message =
            "🏆 Excellent! You really understand Vietnamese pronouns.";

    }else if(percent >= 70){

        message =
            "🎉 Good job! Keep practicing.";

    }else{

        message =
            "📚 Keep practicing Vietnamese pronouns.";

    }


    document
        .getElementById("finalMessage")
        .textContent =
        message;

}



/* ==========================================================
   RESTART
========================================================== */

function restartGame(){

    startGame();

}



/* ==========================================================
   BACK TO LOBBY
========================================================== */

function backToLobby(){

    window.location.href =
        "../../index.html";

}

</script>

</body>

</html>
