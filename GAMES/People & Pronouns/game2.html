<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Vietnamese Pronouns in Context</title>

<meta
    name="game-title"
    content="Vietnamese Pronouns in Context"
>

<meta
    name="game-description"
    content="Practice choosing Vietnamese pronouns in everyday situations."
>

<meta
    name="game-icon"
    content="👥"
>


<style>

/* ==========================================================
   RESET
========================================================== */

*{
    box-sizing:border-box;
}


body{

    margin:0;

    font-family:
        'Segoe UI',
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    background:#f4f7f6;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    color:#2c3e50;

}


/* ==========================================================
   SCREEN
========================================================== */

.screen{
    display:none;
}


.screen.active{
    display:block;
}


/* ==========================================================
   CONTAINER
========================================================== */

.container{

    position:relative;

    width:min(750px,96vw);

    margin:0 auto;

    background:white;

    padding:65px 30px 30px;

    border-radius:20px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.08);

}


/* ==========================================================
   BACK TO LOBBY
========================================================== */

.lobby-btn{

    position:absolute;

    top:20px;

    left:22px;

    padding:8px 14px;

    border:none;

    border-radius:8px;

    background:#eef5fc;

    color:#34495e;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.lobby-btn:hover{

    background:#dcecff;

    transform:translateX(-2px);

}


/* ==========================================================
   INTRO
========================================================== */

#intro{

    text-align:center;

    padding:20px 20px 30px;

}


#intro .emoji{

    font-size:60px;

    margin-bottom:10px;

}


#intro h1{

    margin:0 0 15px;

    font-size:34px;

}


#intro p{

    color:#7f8c8d;

    font-size:17px;

    line-height:1.6;

    margin:8px 0;

}


.start-btn{

    margin-top:20px;

    padding:14px 35px;

    border:none;

    border-radius:12px;

    background:#34495e;

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.start-btn:hover{

    background:#2c3e50;

    transform:translateY(-2px);

}


/* ==========================================================
   TITLE
========================================================== */

.title{

    text-align:center;

    margin:0 0 5px;

}


.subtitle{

    text-align:center;

    color:#7f8c8d;

    margin-bottom:25px;

}


/* ==========================================================
   GAME BOX
========================================================== */

.game-box{

    background:#fff;

    padding:25px;

    border-radius:15px;

    border:1px solid #eee;

    text-align:center;

}


.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:15px;

    font-weight:bold;

}


.question-count{

    color:#7f8c8d;

}


.score{

    color:#27ae60;

    font-size:18px;

}


/* ==========================================================
   PROGRESS
========================================================== */

.progress-wrap{

    width:100%;

    height:9px;

    background:#eee;

    border-radius:20px;

    overflow:hidden;

    margin-bottom:20px;

}


.progress{

    width:0%;

    height:100%;

    background:#34495e;

    transition:.3s;

}


/* ==========================================================
   SITUATION CARD
========================================================== */

.card{

    background:#f8fbff;

    border:2px dashed #3498db;

    border-radius:12px;

    padding:35px 22px;

    margin:20px 0;

    min-height:170px;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:20px;

    font-weight:600;

    line-height:1.6;

}


/* ==========================================================
   OPTIONS
========================================================== */

.options{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:12px;

}


.option-btn{

    padding:17px;

    font-size:18px;

    font-weight:bold;

    background:#34495e;

    color:white;

    border:none;

    border-radius:9px;

    cursor:pointer;

    transition:.2s;

}


.option-btn:hover{

    background:#2c3e50;

    transform:translateY(-2px);

}


.option-btn.correct{

    background:#27ae60;

}


.option-btn.wrong{

    background:#e74c3c;

}


.option-btn.disabled{

    pointer-events:none;

    opacity:.7;

}


/* ==========================================================
   RESULT
========================================================== */

.result-message{

    min-height:40px;

    margin-top:20px;

    font-size:18px;

    font-weight:bold;

}


.correct-text{

    color:#27ae60;

}


.wrong-text{

    color:#e74c3c;

}


/* ==========================================================
   NEXT BUTTON
========================================================== */

.next-btn{

    padding:12px 28px;

    border:none;

    border-radius:10px;

    background:#34495e;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    margin-top:5px;

    transition:.2s;

}


.next-btn:hover{

    background:#2c3e50;

    transform:translateY(-2px);

}


/* ==========================================================
   FINAL
========================================================== */

#final{

    text-align:center;

    padding:30px 20px 40px;

}


#final h2{

    font-size:35px;

    color:#27ae60;

}


.final-score{

    font-size:30px;

    margin:25px 0;

    font-weight:bold;

    color:#1976d2;

}


.final-message{

    color:#7f8c8d;

    font-size:18px;

}


#final .start-btn{

    margin-top:10px;

}


/* ==========================================================
   MOBILE
========================================================== */

@media(max-width:600px){

    body{

        padding:10px;

    }


    .container{

        width:100%;

        padding:
            60px 15px 20px;

    }


    #intro{

        padding:
            20px 10px 25px;

    }


    #intro h1{

        font-size:28px;

    }


    #intro p{

        font-size:16px;

    }


    .game-box{

        padding:18px;

    }


    .options{

        grid-template-columns:1fr;

    }


    .card{

        font-size:18px;

        min-height:140px;

        padding:25px 15px;

    }


    .lobby-btn{

        top:16px;

        left:16px;

        font-size:13px;

        padding:7px 12px;

    }


    #final h2{

        font-size:30px;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- ========================================================
     BACK TO LOBBY
========================================================= -->

<button
    class="lobby-btn"
    onclick="backToLobby()"
>

    ← Back to Lobby

</button>



<!-- ========================================================
     INTRO
========================================================= -->

<div
    id="intro"
    class="screen active"
>

    <div class="emoji">

        👥

    </div>


    <h1>

        Vietnamese Pronouns in Context

    </h1>


    <p>

        Read the situation and choose
        the Vietnamese pronoun you would use.

    </p>


    <p>

        🎯 10 questions

    </p>


    <button
        class="start-btn"
        onclick="startGame()"
    >

        Start Game

    </button>

</div>



<!-- ========================================================
     GAME
========================================================= -->

<div
    id="game"
    class="screen"
>


    <h1 class="title">

        👥 Vietnamese Pronouns in Context

    </h1>


    <p class="subtitle">

        Choose the pronoun that fits the situation.

    </p>



    <div class="game-box">


        <!-- TOP BAR -->

        <div class="topbar">

            <div class="question-count">

                Question

                <span id="questionNumber">
                    1
                </span>

                /

                <span id="totalQuestions">
                    10
                </span>

            </div>


            <div class="score">

                Score:

                <span id="score">
                    0
                </span>

            </div>

        </div>



        <!-- PROGRESS -->

        <div class="progress-wrap">

            <div
                class="progress"
                id="progress"
            ></div>

        </div>



        <!-- QUESTION -->

        <div
            class="card"
            id="questionText"
        ></div>



        <!-- OPTIONS -->

        <div
            class="options"
            id="optionsContainer"
        ></div>



        <!-- RESULT -->

        <div
            class="result-message"
            id="resultText"
        ></div>



        <!-- NEXT -->

        <button
            class="next-btn"
            id="nextBtn"
            onclick="nextQuestion()"
            style="display:none;"
        >

            Next →

        </button>


    </div>


</div>



<!-- ========================================================
     FINAL
========================================================= -->

<div
    id="final"
    class="screen"
>


    <h2>

        🎉 Game Complete!

    </h2>


    <p class="final-message">

        You completed Vietnamese Pronouns in Context.

    </p>


    <div class="final-score">

        Score:

        <span id="finalScore"></span>

    </div>


    <p
        class="final-message"
        id="finalMessage"
    ></p>


    <button
        class="start-btn"
        onclick="restartGame()"
    >

        Play Again

    </button>


</div>


</div>



<script>


/* ==========================================================
   QUESTION DATABASE
========================================================== */

const database = [

    {
        q:
        "You meet your friend's older brother. He is a man around your age but a little older than you. What do you call him?",

        a:[
            "Anh",
            "Em",
            "Chú",
            "Bác"
        ],

        c:"Anh"
    },


    {
        q:
        "Your new neighbor is a woman around your age and a little older than you. What do you call her?",

        a:[
            "Chị",
            "Em",
            "Dì",
            "Bà"
        ],

        c:"Chị"
    },


    {
        q:
        "You are talking to your younger brother. What do you call him?",

        a:[
            "Em",
            "Anh",
            "Cháu",
            "Chú"
        ],

        c:"Em"
    },


    {
        q:
        "You meet your mother's younger brother. What do you call him?",

        a:[
            "Chú",
            "Bác",
            "Anh",
            "Ông"
        ],

        c:"Chú"
    },


    {
        q:
        "You meet your mother's younger sister. What do you call her?",

        a:[
            "Dì",
            "Bác",
            "Chị",
            "Bà"
        ],

        c:"Dì"
    },


    {
        q:
        "Your father's older brother comes to visit. What do you call him?",

        a:[
            "Bác",
            "Chú",
            "Anh",
            "Ông"
        ],

        c:"Bác"
    },


    {
        q:
        "You are talking to a little child who is much younger than you. What do you call them?",

        a:[
            "Cháu",
            "Em",
            "Anh",
            "Bác"
        ],

        c:"Cháu"
    },


    {
        q:
        "You meet your grandmother. What do you call her?",

        a:[
            "Bà",
            "Dì",
            "Chị",
            "Cháu"
        ],

        c:"Bà"
    },


    {
        q:
        "You meet your grandfather. What do you call him?",

        a:[
            "Ông",
            "Bác",
            "Chú",
            "Anh"
        ],

        c:"Ông"
    },


    {
        q:
        "A woman is older than you but belongs to your generation. You are speaking directly to her. What do you call her?",

        a:[
            "Chị",
            "Bà",
            "Dì",
            "Em"
        ],

        c:"Chị"
    }

];



/* ==========================================================
   STATE
========================================================== */

let questions = [];

let currentQuestion = 0;

let score = 0;

let answered = false;



/* ==========================================================
   SHUFFLE
========================================================== */

function shuffle(array){

    const arr = [...array];


    for(
        let i = arr.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] = [
            arr[j],
            arr[i]
        ];

    }


    return arr;

}



/* ==========================================================
   START GAME
========================================================== */

function startGame(){

    questions =
        shuffle(database);


    currentQuestion = 0;

    score = 0;


    document
        .getElementById("intro")
        .classList.remove("active");


    document
        .getElementById("final")
        .classList.remove("active");


    document
        .getElementById("game")
        .classList.add("active");


    document
        .getElementById("score")
        .textContent =
        "0";


    document
        .getElementById("totalQuestions")
        .textContent =
        questions.length;


    loadQuestion();

}



/* ==========================================================
   LOAD QUESTION
========================================================== */

function loadQuestion(){

    answered = false;


    const question =
        questions[currentQuestion];


    document
        .getElementById("questionNumber")
        .textContent =
        currentQuestion + 1;


    document
        .getElementById("progress")
        .style.width =
        (
            currentQuestion /
            questions.length *
            100
        ) + "%";


    document
        .getElementById("questionText")
        .textContent =
        question.q;


    document
        .getElementById("resultText")
        .textContent =
        "";


    document
        .getElementById("resultText")
        .className =
        "result-message";


    document
        .getElementById("nextBtn")
        .style.display =
        "none";


    const container =
        document.getElementById(
            "optionsContainer"
        );


    container.innerHTML =
        "";


    const options =
        shuffle(question.a);


    options.forEach(option => {

        const btn =
            document.createElement(
                "button"
            );


        btn.className =
            "option-btn";


        btn.textContent =
            option;


        btn.onclick = () =>
            handleAnswer(
                btn,
                option
            );


        container.appendChild(btn);

    });

}



/* ==========================================================
   HANDLE ANSWER
========================================================== */

function handleAnswer(
    button,
    selected
){

    if(answered){

        return;

    }


    const question =
        questions[currentQuestion];


    if(selected === question.c){

        answered = true;


        button.classList.add(
            "correct"
        );


        score++;


        document
            .getElementById("score")
            .textContent =
            score;


        document
            .getElementById("resultText")
            .textContent =
            "🎉 Correct!";


        document
            .getElementById("resultText")
            .className =
            "result-message correct-text";


        document
            .querySelectorAll(
                ".option-btn"
            )
            .forEach(btn => {

                btn.classList.add(
                    "disabled"
                );

            });


        document
            .getElementById("nextBtn")
            .style.display =
            "inline-block";


        if(
            currentQuestion ===
            questions.length - 1
        ){

            document
                .getElementById("nextBtn")
                .textContent =
                "Finish 🎉";

        }else{

            document
                .getElementById("nextBtn")
                .textContent =
                "Next →";

        }


    }else{

        button.classList.add(
            "wrong"
        );


        document
            .getElementById("resultText")
            .textContent =
            "❌ Try again!";


        document
            .getElementById("resultText")
            .className =
            "result-message wrong-text";


        setTimeout(() => {

            button.classList.remove(
                "wrong"
            );

        },600);

    }

}



/* ==========================================================
   NEXT QUESTION
========================================================== */

function nextQuestion(){

    currentQuestion++;


    if(
        currentQuestion <
        questions.length
    ){

        loadQuestion();

    }else{

        finishGame();

    }

}



/* ==========================================================
   FINISH GAME
========================================================== */

function finishGame(){

    document
        .getElementById("game")
        .classList.remove(
            "active"
        );


    document
        .getElementById("final")
        .classList.add(
            "active"
        );


    document
        .getElementById("finalScore")
        .textContent =
        score +
        " / " +
        questions.length;


    const percent =
        Math.round(
            score /
            questions.length *
            100
        );


    let message;


    if(percent >= 90){

        message =
            "🏆 Excellent! You know how to use Vietnamese pronouns.";

    }else if(percent >= 70){

        message =
            "🎉 Good job! Keep practicing.";

    }else{

        message =
            "📚 Keep practicing Vietnamese pronouns in everyday situations.";

    }


    document
        .getElementById("finalMessage")
        .textContent =
        message;

}



/* ==========================================================
   RESTART
========================================================== */

function restartGame(){

    startGame();

}



/* ==========================================================
   BACK TO LOBBY
========================================================== */

function backToLobby(){

    window.location.href =
        "../../index.html";

}

</script>


</body>

</html>
