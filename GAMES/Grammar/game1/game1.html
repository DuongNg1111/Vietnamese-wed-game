<meta

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
}


/* =========================================================
   BODY
========================================================= */

body{

    margin:0;

    min-height:100vh;

    padding:20px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #eef4ff,
            #fff8e8
        );

    color:#26354a;

}


/* =========================================================
   PAGE
========================================================= */

.page{

    width:100%;

    max-width:920px;

    margin:0 auto;

}


/* =========================================================
   BACK TO LOBBY
========================================================= */

.lobby-link{

    display:inline-block;

    margin-bottom:14px;

    color:#4779b8;

    text-decoration:none;

    font-size:15px;

    font-weight:bold;

}


.lobby-link:hover{

    text-decoration:underline;

}


/* =========================================================
   GAME CONTAINER
========================================================= */

.game-container{

    width:100%;

    background:#ffffff;

    border-radius:22px;

    padding:30px;

    box-shadow:
        0 10px 35px rgba(
            60,
            80,
            110,
            .16
        );

}


/* =========================================================
   TOP BAR
========================================================= */

.top{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;

}


.title{

    font-size:28px;

    font-weight:800;

}


.score{

    background:#fff5d9;

    color:#a06a00;

    padding:10px 16px;

    border-radius:14px;

    font-weight:bold;

}


/* =========================================================
   GAME CARD
========================================================= */

.card{

    background:#ffffff;

}


/* =========================================================
   START SCREEN
========================================================= */

.start-screen{

    text-align:center;

    padding:30px 10px;

}


.start-icon{

    font-size:60px;

    margin-bottom:10px;

}


.start-screen h1{

    font-size:34px;

    margin:
        5px 0 10px;

}


.start-screen p{

    color:#667085;

    font-size:17px;

}


.how-to{

    max-width:500px;

    margin:25px auto;

    padding:16px 20px;

    background:#f7f9fc;

    border-radius:15px;

    text-align:left;

    line-height:1.6;

}


.start-btn{

    border:none;

    background:#4779b8;

    color:white;

    padding:14px 30px;

    border-radius:12px;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.start-btn:hover{

    transform:
        translateY(-2px);

}


/* =========================================================
   ROUND
========================================================= */

.round{

    font-size:14px;

    font-weight:bold;

    color:#7b8798;

    margin-bottom:7px;

}


h2{

    margin:
        5px 0 18px;

    font-size:25px;

}


/* =========================================================
   AUDIO
========================================================= */

.audio{

    width:100%;

    padding:15px 18px;

    border:none;

    border-radius:14px;

    background:#4779b8;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    margin-bottom:18px;

}


.audio:hover{

    opacity:.9;

}


/* =========================================================
   HINT
========================================================= */

.hint{

    background:#f0f4ff;

    border-radius:14px;

    padding:15px 18px;

    margin-bottom:20px;

}


.hint strong{

    display:block;

    margin-bottom:4px;

}


.small{

    font-size:14px;

    color:#667085;

}


/* =========================================================
   ORDER
========================================================= */

.order-label{

    font-size:17px;

    margin:
        10px 0 8px;

}


.target{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    flex-wrap:wrap;

    margin:
        16px 0 22px;

}


.slot{

    width:175px;

    min-height:56px;

    border:
        2px dashed #aaa;

    border-radius:12px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#fff;

    font-weight:bold;

    color:#999;

    text-align:center;

    padding:8px;

}


.slot.over{

    border-color:#4779b8;

    background:#eef5ff;

}


.slot.filled{

    border-style:solid;

    border-color:#7197c9;

    background:#e7edff;

    color:#26354a;

}


.arrow{

    font-size:24px;

    font-weight:bold;

    color:#7b8798;

}


/* =========================================================
   CHOICES
========================================================= */

.choices{

    display:flex;

    gap:10px;

    flex-wrap:wrap;

    justify-content:center;

    margin-top:14px;

}


.choice{

    padding:
        12px 16px;

    border:
        2px solid #ddd;

    border-radius:12px;

    background:#fff;

    cursor:grab;

    font-weight:bold;

    user-select:none;

    transition:.15s;

}


.choice:hover{

    transform:
        translateY(-2px);

    border-color:#89a9d6;

    background:#f7faff;

}


.choice:active{

    cursor:grabbing;

}


/* =========================================================
   CONTROLS
========================================================= */

.controls{

    display:flex;

    justify-content:center;

    gap:10px;

    margin-top:22px;

    flex-wrap:wrap;

}


.check,
.clear,
.next,
.reset{

    padding:
        12px 20px;

    border-radius:12px;

    cursor:pointer;

    font-weight:bold;

    font-size:16px;

}


.check{

    background:#4779b8;

    color:white;

    border:none;

}


.clear{

    background:#edf0f5;

    color:#566274;

    border:none;

}


.next{

    background:#2d9b57;

    color:white;

    border:none;

}


.reset{

    background:#4779b8;

    color:white;

    border:none;

}


.check:disabled{

    opacity:.5;

    cursor:default;

}


/* =========================================================
   FEEDBACK
========================================================= */

.feedback{

    min-height:30px;

    margin-top:16px;

    text-align:center;

    font-weight:bold;

    font-size:17px;

}


/* =========================================================
   HIDDEN
========================================================= */

.hidden{

    display:none;

}


/* =========================================================
   FINAL SCREEN
========================================================= */

.final{

    text-align:center;

    padding:
        35px 15px;

}


.final-icon{

    font-size:65px;

}


.final h2{

    margin:
        10px 0;

}


.final-score{

    font-size:30px;

    font-weight:bold;

    margin:15px;

}


.final-message{

    color:#667085;

    font-size:17px;

    margin-bottom:25px;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    body{

        padding:12px;

    }


    .game-container{

        padding:22px 17px;

        border-radius:18px;

    }


    .top{

        flex-direction:column;

        align-items:flex-start;

        gap:12px;

    }


    .title{

        font-size:23px;

    }


    .start-screen h1{

        font-size:27px;

    }


    h2{

        font-size:22px;

    }


    .slot{

        width:140px;

    }


    .arrow{

        font-size:20px;

    }

}


@media(max-width:400px){

    .slot{

        width:120px;

        font-size:14px;

    }


    .arrow{

        font-size:17px;

    }

}

</style>

</head>


<body>


<div class="page">


    <!-- BACK TO LOBBY IS OUTSIDE THE GAME FRAME -->

    <a
        href="../../../index.html"
        class="lobby-link"
    >
        ← Back to Lobby
    </a>


    <div class="game-container">


        <!-- =================================================
             START SCREEN
        ================================================== -->

        <div
            id="startScreen"
            class="start-screen"
        >

            <div class="start-icon">
                📊
            </div>


            <h1>
                Vietnamese Comparison Challenge
            </h1>


            <p>
                Listen and arrange the words in order.
            </p>


            <div class="how-to">

                🎯 <strong>How to Play:</strong><br>

                Listen to the clue, then drag the words
                into the correct order.

            </div>


            <button
                class="start-btn"
                onclick="startGame()"
            >
                Start Game
            </button>

        </div>


        <!-- =================================================
             GAME SCREEN
        ================================================== -->

        <div
            id="gameScreen"
            class="card hidden"
        >

            <div class="top">

                <div class="title">
                    Vietnamese Comparison
                </div>


                <div class="score">

                    ⭐ Score:
                    <span id="score">
                        0
                    </span>

                </div>

            </div>


            <div
                id="game"
            ></div>

        </div>


    </div>

</div>



<script>

/* =========================================================
   AUDIO / FOLDER STRUCTURE

   GAMES/
   └── Grammar/
       └── game1/
           ├── game1.html
           └── sounds/
               ├── round1.mp3
               ├── round2.mp3
               ├── ...
               └── round12.mp3

   Since game1.html and sounds are in the same folder,
   the correct path is:

       sounds/round1.mp3

========================================================= */


/* =========================================================
   ROUND DATA
========================================================= */

const rounds = [

    {
        title:"BIG / SMALL",

        order:"small to big",

        items:[
            "Con chó",
            "Con mèo",
            "Con chuột"
        ],

        answer:[
            "Con chuột",
            "Con mèo",
            "Con chó"
        ],

        audio:"sounds/round1"

    },


    {
        title:"TALL / SHORT",

        order:"short to tall",

        items:[
            "John",
            "Peter",
            "David"
        ],

        answer:[
            "David",
            "Peter",
            "John"
        ],

        audio:"sounds/round2"

    },


    {
        title:"BEAUTIFUL / UGLY",

        order:"ugly to beautiful",

        items:[
            "Anna",
            "Mary",
            "Lisa"
        ],

        answer:[
            "Mary",
            "Anna",
            "Lisa"
        ],

        audio:"sounds/round3"

    },


    {
        title:"DELICIOUS / BAD",

        order:"bad to delicious",

        items:[
            "Cơm gà",
            "Cơm bò",
            "Cơm heo"
        ],

        answer:[
            "Cơm heo",
            "Cơm bò",
            "Cơm gà"
        ],

        audio:"sounds/round4"

    },


    {
        title:"HOT / COOL",

        order:"cool to hot",

        items:[
            "Hôm nay",
            "Hôm qua",
            "Ngày mai"
        ],

        answer:[
            "Hôm qua",
            "Hôm nay",
            "Ngày mai"
        ],

        audio:"sounds/round5"

    },


    {
        title:"BIG / SMALL",

        order:"small to big",

        items:[
            "Phòng khách",
            "Phòng ngủ",
            "Bếp"
        ],

        answer:[
            "Phòng ngủ",
            "Phòng khách",
            "Bếp"
        ],

        audio:"sounds/round6"

    },


    {
        title:"TALL / SHORT",

        order:"short to tall",

        items:[
            "John",
            "Peter",
            "David",
            "Alex"
        ],

        answer:[
            "David",
            "Peter",
            "John",
            "Alex"
        ],

        audio:"sounds/round7"

    },


    {
        title:"DELICIOUS / BAD",

        order:"bad to delicious",

        items:[
            "Mì",
            "Cơm gà",
            "Cơm bò",
            "Cơm heo"
        ],

        answer:[
            "Cơm heo",
            "Cơm bò",
            "Mì",
            "Cơm gà"
        ],

        audio:"sounds/round8"

    },


    {
        title:"BIG / SMALL",

        order:"small to big",

        items:[
            "Con mèo",
            "Con chó",
            "Con khỉ",
            "Con chuột"
        ],

        answer:[
            "Con chuột",
            "Con mèo",
            "Con chó",
            "Con khỉ"
        ],

        audio:"sounds/round9"

    },


    {
        title:"BEAUTIFUL / UGLY",

        order:"ugly to beautiful",

        items:[
            "Anna",
            "Mary",
            "Lisa",
            "Cháu gái của tôi"
        ],

        answer:[
            "Mary",
            "Anna",
            "Lisa",
            "Cháu gái của tôi"
        ],

        audio:"sounds/round10"

    },


    {
        title:"HOT / COOL",

        order:"cool to hot",

        items:[
            "Hôm qua",
            "Hôm nay",
            "Ngày mai",
            "Chủ nhật"
        ],

        answer:[
            "Hôm qua",
            "Chủ nhật",
            "Hôm nay",
            "Ngày mai"
        ],

        audio:"sounds/round11"

    },


    {
        title:"👑 BOSS — BIG / SMALL",

        order:"small to big",

        items:[
            "Con chuột",
            "Con mèo",
            "Con chó",
            "Con khỉ"
        ],

        answer:[
            "Con chuột",
            "Con mèo",
            "Con khỉ",
            "Con chó"
        ],

        audio:"sounds/round12"

    }

];


/* =========================================================
   VARIABLES
========================================================= */

let current = 0;

let score = 0;


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    current = 0;

    score = 0;

    document
        .getElementById("score")
        .textContent = "0";


    document
        .getElementById("startScreen")
        .classList.add("hidden");


    document
        .getElementById("gameScreen")
        .classList.remove("hidden");


    render();

}


/* =========================================================
   PLAY AUDIO
========================================================= */

function playAudio(){

    const base =
        rounds[current].audio;


    const files = [

        base + ".mp3",

        base + ".wav"

    ];


    let index = 0;


    function tryNext(){

        if(index >= files.length){

            const feedback =
                document.getElementById(
                    "feedback"
                );


            feedback.textContent =
                "⚠️ Audio not found.";


            feedback.style.color =
                "#b42318";


            return;

        }


        const audio =
            new Audio(
                files[index]
            );


        let failed = false;


        audio.addEventListener(
            "error",
            () => {

                if(!failed){

                    failed = true;

                    index++;

                    tryNext();

                }

            }
        );


        audio
            .play()
            .catch(() => {

                if(!failed){

                    failed = true;

                    index++;

                    tryNext();

                }

            });

    }


    tryNext();

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    if(
        current >=
        rounds.length
    ){

        showResults();

        return;

    }


    const round =
        rounds[current];


    const slots =
        round.answer
            .map(
                (_,index) => `

                    <div
                        class="slot"
                        data-index="${index}"
                    >
                        Drop here
                    </div>

                `
            )
            .join(
                '<span class="arrow">→</span>'
            );


    const choices =
        [...round.items]
            .sort(
                () =>
                    Math.random() - 0.5
            )
            .map(
                word => `

                    <div
                        class="choice"
                        draggable="true"
                        data-value="${word}"
                    >
                        ${word}
                    </div>

                `
            )
            .join("");


    document
        .getElementById("game")
        .innerHTML = `

            <div class="round">

                ROUND
                ${current + 1}
                /
                ${rounds.length}

            </div>


            <h2>
                ${round.title}
            </h2>


            <button
                class="audio"
                onclick="playAudio()"
            >

                🔊 Play Vietnamese Clue

            </button>


            <div class="hint">

                <strong>
                    🎧 Listen and think!
                </strong>

                <span class="small">
                    Listen to the clue, then
                    arrange the words.
                </span>

            </div>


            <div class="order-label">

                ORDER:
                <strong>
                    ${round.order.toUpperCase()}
                </strong>

            </div>


            <div class="target">

                ${slots}

            </div>


            <div class="small">

                <strong>
                    Drag the words into the
                    correct order.
                </strong>

            </div>


            <div class="choices">

                ${choices}

            </div>


            <div class="controls">

                <button
                    class="check"
                    onclick="checkAnswer()"
                >
                    ✓ Check
                </button>


                <button
                    class="clear"
                    onclick="clearSlots()"
                >
                    ↺ Clear
                </button>


                <button
                    class="next hidden"
                    id="next"
                    onclick="nextRound()"
                >
                    Next →
                </button>

            </div>


            <div
                class="feedback"
                id="feedback"
            ></div>

        `;


    setupDrag();

}


/* =========================================================
   DRAG & DROP
========================================================= */

function setupDrag(){

    document
        .querySelectorAll(".choice")
        .forEach(
            choice => {

                choice.addEventListener(
                    "dragstart",
                    event => {

                        event
                            .dataTransfer
                            .setData(
                                "text/plain",
                                choice.dataset.value
                            );

                    }
                );

            }
        );


    document
        .querySelectorAll(".slot")
        .forEach(
            slot => {

                slot.addEventListener(
                    "dragover",
                    event => {

                        event.preventDefault();


                        if(
                            !slot.dataset.value
                        ){

                            slot.classList.add(
                                "over"
                            );

                        }

                    }
                );


                slot.addEventListener(
                    "dragleave",
                    () => {

                        slot.classList.remove(
                            "over"
                        );

                    }
                );


                slot.addEventListener(
                    "drop",
                    event => {

                        event.preventDefault();


                        slot.classList.remove(
                            "over"
                        );


                        const value =
                            event
                                .dataTransfer
                                .getData(
                                    "text/plain"
                                );


                        if(
                            !value ||
                            slot.dataset.value
                        ){

                            return;

                        }


                        slot.textContent =
                            value;


                        slot.dataset.value =
                            value;


                        slot.classList.add(
                            "filled"
                        );


                        const choice =
                            [
                                ...document
                                    .querySelectorAll(
                                        ".choice"
                                    )
                            ]
                            .find(
                                element =>
                                    element
                                        .dataset
                                        .value ===
                                    value
                            );


                        if(choice){

                            choice.style.display =
                                "none";

                        }

                    }
                );

            }
        );

}


/* =========================================================
   CLEAR
========================================================= */

function clearSlots(){

    document
        .querySelectorAll(".slot")
        .forEach(
            slot => {

                slot.textContent =
                    "Drop here";


                delete slot.dataset.value;


                slot.classList.remove(
                    "filled"
                );

            }
        );


    document
        .querySelectorAll(".choice")
        .forEach(
            choice => {

                choice.style.display =
                    "";

            }
        );


    const feedback =
        document.getElementById(
            "feedback"
        );


    if(feedback){

        feedback.textContent = "";

    }

}


/* =========================================================
   CHECK ANSWER
========================================================= */

function checkAnswer(){

    const slots =
        [
            ...document
                .querySelectorAll(
                    ".slot"
                )
        ];


    const feedback =
        document.getElementById(
            "feedback"
        );


    /* ALL SLOTS MUST BE FILLED */

    if(
        slots.some(
            slot =>
                !slot.dataset.value
        )
    ){

        feedback.textContent =
            "⚠️ Fill all the boxes first.";

        feedback.style.color =
            "#b42318";

        return;

    }


    const answer =
        rounds[current].answer;


    const correct =
        slots.every(
            (slot,index) =>
                slot.dataset.value ===
                answer[index]
        );


    if(correct){

        score += 10;


        document
            .getElementById("score")
            .textContent =
            score;


        feedback.textContent =
            "🎉 Correct!";


        feedback.style.color =
            "#2d9b57";


        document
            .getElementById("next")
            .classList.remove(
                "hidden"
            );


        document
            .querySelector(".check")
            .disabled = true;

    }

    else{

        feedback.textContent =
            "❌ Not quite! Try again.";

        feedback.style.color =
            "#d95353";

    }

}


/* =========================================================
   NEXT ROUND
========================================================= */

function nextRound(){

    current++;

    render();

}


/* =========================================================
   SHOW RESULTS
========================================================= */

function showResults(){

    const percentage =
        score /
        (rounds.length * 10);


    let message;


    if(
        percentage === 1
    ){

        message =
            "Perfect! You mastered the comparison practice.";

    }

    else if(
        percentage >= 0.8
    ){

        message =
            "Excellent! Your Vietnamese comparison skills are strong.";

    }

    else if(
        percentage >= 0.6
    ){

        message =
            "Good job! Keep practicing these comparisons.";

    }

    else{

        message =
            "Keep practicing and try again.";

    }


    document
        .getElementById("game")
        .innerHTML = `

            <div class="final">

                <div class="final-icon">
                    🏆
                </div>


                <h2>
                    Great Job!
                </h2>


                <div class="final-score">

                    ⭐
                    ${score}
                    /
                    ${rounds.length * 10}

                </div>


                <p class="final-message">

                    ${message}

                </p>


                <button
                    class="reset"
                    onclick="restartGame()"
                >

                    Play Again

                </button>

            </div>

        `;

}


/* =========================================================
   RESTART
========================================================= */

function restartGame(){

    current = 0;

    score = 0;


    document
        .getElementById("score")
        .textContent =
        "0";


    render();

}

</script>
