<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vietnamese Directions Memory Match</title>

<meta name="game-title" content="Vietnamese Directions Memory Match">
<meta name="game-description" content="Match common Vietnamese direction words with their English meanings.">
<meta name="game-icon" content="🧭">
<meta name="game-category" content="Places, Directions & Transportation">
<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    background:linear-gradient(
        135deg,
        #73c8ff,
        #b6f3ff,
        #f8f9ff
    );

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    color:#234;

}


.hidden{
    display:none !important;
}


/* =========================================================
   MAIN WRAPPER
========================================================= */

.container{

    width:min(960px,95vw);

    position:relative;

}


/* =========================================================
   BACK TO LOBBY
========================================================= */

.back-lobby{

    display:inline-flex;

    align-items:center;

    gap:6px;

    margin-bottom:12px;

    padding:8px 14px;

    border:none;

    border-radius:10px;

    background:white;

    color:#555;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 5px 15px rgba(0,0,0,.12);

    transition:.2s;

}


.back-lobby:hover{

    background:#f3f8ff;

    color:#1976d2;

    transform:translateX(-2px);

}


/* =========================================================
   SCREEN
========================================================= */

.screen{

    background:white;

    border-radius:24px;

    padding:30px;

    box-shadow:
        0 18px 40px rgba(0,0,0,.18);

}


h1{

    text-align:center;

    font-size:2.2rem;

    margin-bottom:10px;

}


h2{

    text-align:center;

    margin-bottom:18px;

    color:#1976d2;

}


/* =========================================================
   INTRO
========================================================= */

#instructionScreen{

    text-align:center;

}


#instructionScreen h1{

    margin-bottom:18px;

}


.instructions{

    line-height:1.7;

    font-size:1.05rem;

    margin:15px auto;

    max-width:650px;

    color:#555;

}


.example{

    margin:20px auto 0;

    background:#f7fbff;

    border-radius:16px;

    padding:16px;

    max-width:600px;

}


.example h3{

    margin-bottom:10px;

}


.example-line{

    font-size:1.05rem;

    margin:7px 0;

}


.correct-example{

    color:#2e7d32;

    font-weight:bold;

}


.start-btn,
.play-btn{

    display:block;

    margin:25px auto 0;

    padding:14px 32px;

    font-size:1.15rem;

    border:none;

    border-radius:12px;

    cursor:pointer;

    background:#4caf50;

    color:white;

    font-weight:bold;

    transition:.2s;

}


.start-btn:hover,
.play-btn:hover{

    background:#388e3c;

    transform:translateY(-2px);

}


/* =========================================================
   HUD
========================================================= */

#hud{

    display:flex;

    justify-content:space-between;

    flex-wrap:wrap;

    gap:10px;

    margin-bottom:20px;

}


.hud-box{

    flex:1;

    min-width:130px;

    background:#f7fbff;

    border-radius:12px;

    padding:12px;

    text-align:center;

    font-weight:bold;

    border:1px solid #e1edf8;

}


/* =========================================================
   BOARD
========================================================= */

#board{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:18px;

}


/* =========================================================
   CARD
========================================================= */

.card{

    height:140px;

    perspective:1000px;

    cursor:pointer;

}


.card-inner{

    width:100%;

    height:100%;

    position:relative;

    transform-style:preserve-3d;

    transition:.6s;

}


.card.flipped .card-inner{

    transform:rotateY(180deg);

}


.face{

    position:absolute;

    width:100%;

    height:100%;

    backface-visibility:hidden;

    border-radius:18px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:1.35rem;

    font-weight:bold;

    user-select:none;

    box-shadow:
        0 10px 22px rgba(0,0,0,.16);

}


/* FRONT */

.front{

    background:
        linear-gradient(
            135deg,
            #1976d2,
            #42a5f5
        );

    color:white;

}


/* BACK */

.back{

    transform:rotateY(180deg);

    background:white;

    padding:10px;

    text-align:center;

    color:#234;

}


/* HOVER */

.card:hover .front{

    filter:brightness(1.08);

}


/* MATCHED */

.card.matched{

    cursor:default;

}


.card.matched .back{

    background:#81c784;

    color:white;

    animation:success .5s;

}


@keyframes success{

    0%{

        transform:
            rotateY(180deg)
            scale(.9);

    }

    50%{

        transform:
            rotateY(180deg)
            scale(1.08);

    }

    100%{

        transform:
            rotateY(180deg)
            scale(1);

    }

}


/* =========================================================
   ROUND MESSAGE
========================================================= */

#roundMessage{

    position:fixed;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    background:rgba(255,255,255,.75);

    font-size:3rem;

    font-weight:bold;

    color:#2e7d32;

    z-index:20;

}


/* =========================================================
   FINAL SCREEN
========================================================= */

#endScreen{

    text-align:center;

}


.final-score{

    font-size:34px;

    margin:25px 0 10px;

    color:#1976d2;

    font-weight:bold;

}


.performance{

    font-size:20px;

    color:#555;

    margin-bottom:25px;

}


/* =========================================================
   CONFETTI
========================================================= */

.confetti{

    position:fixed;

    width:12px;

    height:12px;

    top:-20px;

    animation:
        fall linear forwards;

    z-index:999;

}


@keyframes fall{

    to{

        transform:
            translateY(110vh)
            rotate(720deg);

    }

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:700px){

    #board{

        grid-template-columns:
            repeat(2,1fr);

    }


    .card{

        height:120px;

    }


    h1{

        font-size:1.8rem;

    }


    .face{

        font-size:1.1rem;

    }

}


@media(max-width:500px){

    body{

        padding:10px;

    }


    .screen{

        padding:20px 15px;

    }


    #board{

        grid-template-columns:
            repeat(2,1fr);

        gap:10px;

    }


    .card{

        height:110px;

    }


    .face{

        font-size:1rem;

    }


    #hud{

        gap:7px;

    }


    .hud-box{

        min-width:100px;

        font-size:13px;

        padding:9px;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- =====================================================
     BACK TO LOBBY
===================================================== -->

<button
    class="back-lobby"
    onclick="backToLobby()"
>

    ← Back to Lobby

</button>



<!-- =====================================================
     INTRO
===================================================== -->

<div
    id="instructionScreen"
    class="screen"
>


    <h1>
        🧭 Vietnamese Directions Memory Match
    </h1>


    <p class="instructions">

        Match each Vietnamese direction word
        with its English meaning.

    </p>


    <p class="instructions">

        🎯 8 rounds • 3 pairs per round

    </p>


    <div class="example">

        <h3>Example</h3>

        <div class="example-line correct-example">
            bên trái ↔ Left ✅
        </div>

        <div class="example-line">
            trên ↔ Right ❌
        </div>

    </div>


    <button
        class="start-btn"
        onclick="startGame()"
    >

        Start Game

    </button>


</div>



<!-- =====================================================
     GAME
===================================================== -->

<div
    id="gameScreen"
    class="screen hidden"
>


    <div id="hud">


        <div class="hud-box">

            Round:<br>

            <span id="roundDisplay">
                1 / 8
            </span>

        </div>


        <div class="hud-box">

            Score:<br>

            <span id="scoreDisplay">
                0 / 24
            </span>

        </div>


        <div class="hud-box">

            Moves:<br>

            <span id="moveDisplay">
                0
            </span>

        </div>


        <div class="hud-box">

            Timer:<br>

            <span id="timerDisplay">
                0s
            </span>

        </div>


    </div>


    <div id="board"></div>


</div>



<!-- =====================================================
     END
===================================================== -->

<div
    id="endScreen"
    class="screen hidden"
>


    <h1>
        🎉 Finished!
    </h1>


    <p>
        You completed all 8 rounds.
    </p>


    <div
        class="final-score"
        id="finalScore"
    >

        0 / 24

    </div>


    <div
        class="performance"
        id="performance"
    >

    </div>


    <button
        class="play-btn"
        onclick="playAgain()"
    >

        Play Again

    </button>


</div>


</div>



<!-- =====================================================
     ROUND MESSAGE
===================================================== -->

<div
    id="roundMessage"
    class="hidden"
>

    🎉 Great!

</div>



<script>

/* =========================================================
   VOCABULARY
========================================================= */

const vocabulary = [

    ["bên trái", "Left"],
    ["bên phải", "Right"],
    ["trên", "Above"],
    ["dưới", "Below"],
    ["bên cạnh", "Next to"],
    ["trong", "Inside"],
    ["giữa", "Between"],
    ["phía trước", "In front"],
    ["phía sau", "Behind"]

];


/* =========================================================
   SETTINGS
========================================================= */

const TOTAL_ROUNDS = 8;

const PAIRS_PER_ROUND = 3;

const TOTAL_PAIRS =
    TOTAL_ROUNDS * PAIRS_PER_ROUND;


/* =========================================================
   STATE
========================================================= */

let round = 1;

let score = 0;

let moves = 0;

let timer = 0;

let timerInterval = null;

let firstCard = null;

let secondCard = null;

let lock = false;

let matchedPairs = 0;


/* =========================================================
   DOM
========================================================= */

const instructionScreen =
    document.getElementById(
        "instructionScreen"
    );


const gameScreen =
    document.getElementById(
        "gameScreen"
    );


const endScreen =
    document.getElementById(
        "endScreen"
    );


const board =
    document.getElementById(
        "board"
    );


const roundDisplay =
    document.getElementById(
        "roundDisplay"
    );


const scoreDisplay =
    document.getElementById(
        "scoreDisplay"
    );


const moveDisplay =
    document.getElementById(
        "moveDisplay"
    );


const timerDisplay =
    document.getElementById(
        "timerDisplay"
    );


const roundMessage =
    document.getElementById(
        "roundMessage"
    );


const finalScore =
    document.getElementById(
        "finalScore"
    );


const performance =
    document.getElementById(
        "performance"
    );


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    const arr = [...array];

    for(
        let i = arr.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] = [
            arr[j],
            arr[i]
        ];

    }

    return arr;

}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    instructionScreen
        .classList
        .add("hidden");


    endScreen
        .classList
        .add("hidden");


    gameScreen
        .classList
        .remove("hidden");


    round = 1;

    score = 0;

    moves = 0;

    timer = 0;


    clearInterval(
        timerInterval
    );


    timerInterval =
        setInterval(
            () => {

                timer++;

                updateHUD();

            },
            1000
        );


    updateHUD();

    loadRound();

}


/* =========================================================
   LOAD ROUND
========================================================= */

function loadRound(){

    board.innerHTML = "";

    matchedPairs = 0;

    firstCard = null;

    secondCard = null;

    lock = false;


    const selectedPairs =
        shuffle(vocabulary)
        .slice(
            0,
            PAIRS_PER_ROUND
        );


    let cards = [];


    selectedPairs.forEach(
        (pair, pairIndex) => {


            cards.push({

                pair:pairIndex,

                text:pair[0],

                type:"vietnamese"

            });


            cards.push({

                pair:pairIndex,

                text:pair[1],

                type:"english"

            });

        }
    );


    cards =
        shuffle(cards);


    cards.forEach(
        (item,index) => {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            card.dataset.pair =
                item.pair;


            card.dataset.type =
                item.type;


            card.innerHTML = `

                <div class="card-inner">

                    <div class="face front">
                        ${index + 1}
                    </div>

                    <div class="face back">
                        ${item.text}
                    </div>

                </div>

            `;


            card.addEventListener(
                "click",
                () => flipCard(card)
            );


            board.appendChild(card);

        }
    );


    updateHUD();

}


/* =========================================================
   FLIP CARD
========================================================= */

function flipCard(card){

    if(lock) return;

    if(card === firstCard) return;


    if(
        card.classList.contains(
            "matched"
        )
    ){

        return;

    }


    card.classList.add(
        "flipped"
    );


    if(!firstCard){

        firstCard = card;

        return;

    }


    secondCard = card;

    lock = true;

    moves++;

    updateHUD();


    const samePair =
        firstCard.dataset.pair ===
        secondCard.dataset.pair;


    const differentType =
        firstCard.dataset.type !==
        secondCard.dataset.type;


    const isMatch =
        samePair &&
        differentType;


    /* =========================
       CORRECT
    ========================= */

    if(isMatch){

        firstCard.classList.add(
            "matched"
        );


        secondCard.classList.add(
            "matched"
        );


        score++;

        matchedPairs++;


        updateHUD();

        resetTurn();


        if(
            matchedPairs ===
            PAIRS_PER_ROUND
        ){

            setTimeout(
                nextRound,
                600
            );

        }

        return;

    }


    /* =========================
       WRONG
    ========================= */

    setTimeout(
        () => {

            firstCard.classList.remove(
                "flipped"
            );


            secondCard.classList.remove(
                "flipped"
            );


            resetTurn();

        },
        800
    );

}


/* =========================================================
   RESET TURN
========================================================= */

function resetTurn(){

    firstCard = null;

    secondCard = null;

    lock = false;

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    roundDisplay.textContent =
        `${round} / ${TOTAL_ROUNDS}`;


    scoreDisplay.textContent =
        `${score} / ${TOTAL_PAIRS}`;


    moveDisplay.textContent =
        moves;


    timerDisplay.textContent =
        timer + "s";

}


/* =========================================================
   NEXT ROUND
========================================================= */

function nextRound(){

    roundMessage
        .classList
        .remove("hidden");


    setTimeout(
        () => {

            roundMessage
                .classList
                .add("hidden");


            round++;


            if(
                round >
                TOTAL_ROUNDS
            ){

                finishGame();

            }else{

                loadRound();

            }

        },
        900
    );

}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

    clearInterval(
        timerInterval
    );


    gameScreen
        .classList
        .add("hidden");


    endScreen
        .classList
        .remove("hidden");


    finalScore.textContent =
        `${score} / ${TOTAL_PAIRS}`;


    const percentage =
        Math.round(
            score /
            TOTAL_PAIRS *
            100
        );


    let message;


    if(percentage === 100){

        message =
            "🏆 Perfect! Excellent memory!";


    }else if(percentage >= 80){

        message =
            "🎉 Excellent job!";


    }else if(percentage >= 60){

        message =
            "👍 Good job! Keep practicing!";


    }else{

        message =
            "📚 Keep practicing your Vietnamese directions!";

    }


    performance.textContent =
        message;


    createConfetti();

}


/* =========================================================
   PLAY AGAIN
========================================================= */

function playAgain(){

    removeConfetti();

    startGame();

}


/* =========================================================
   BACK TO LOBBY
========================================================= */

function backToLobby(){

    clearInterval(
        timerInterval
    );


    removeConfetti();


    window.location.href =
        "../../index.html";

}


/* =========================================================
   CONFETTI
========================================================= */

function createConfetti(){

    const colors = [

        "#ff5252",
        "#ff9800",
        "#ffeb3b",
        "#4caf50",
        "#2196f3",
        "#9c27b0"

    ];


    for(
        let i = 0;
        i < 150;
        i++
    ){

        const piece =
            document.createElement(
                "div"
            );


        piece.className =
            "confetti";


        piece.style.left =
            Math.random() * 100 +
            "vw";


        piece.style.background =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];


        piece.style.animationDuration =
            3 +
            Math.random() * 3 +
            "s";


        piece.style.opacity =
            .5 +
            Math.random() * .5;


        document.body.appendChild(
            piece
        );

    }

}


/* =========================================================
   REMOVE CONFETTI
========================================================= */

function removeConfetti(){

    document
        .querySelectorAll(
            ".confetti"
        )
        .forEach(
            element =>
                element.remove()
        );

}

</script>

</body>
</html>
