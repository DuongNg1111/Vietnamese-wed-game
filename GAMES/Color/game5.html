<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vietnamese Color Quiz</title>

<meta name="game-title" content="Vietnamese Color Quiz">
<meta
    name="game-description"
    content="Practice Vietnamese color words by matching each color with the correct Vietnamese word."
>
<meta name="game-icon" content="🎨">
<meta name="game-explanation" content="false">

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    box-sizing:border-box;
}

body{

    margin:0;

    padding:20px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#f7f9fc;

    min-height:100vh;

    color:#222;

}


/* =========================================================
   BACK TO LOBBY
========================================================= */

.back-btn-container{

    width:min(850px,95vw);

    margin:0 auto 15px;

}

.back-btn{

    display:inline-block;

    padding:10px 18px;

    background:white;

    color:#555;

    border:2px solid #ddd;

    border-radius:10px;

    text-decoration:none;

    font-weight:bold;

    transition:.2s;

}

.back-btn:hover{

    background:#f0f0f0;

    transform:translateY(-2px);

}


/* =========================================================
   GAME CONTAINER
========================================================= */

.game-box{

    width:min(850px,95vw);

    margin:0 auto;

    background:white;

    padding:35px;

    border-radius:24px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.10);

    text-align:center;

}


/* =========================================================
   SCREEN
========================================================= */

.screen{

    display:none;

}

.screen.active{

    display:block;

}


/* =========================================================
   INTRO
========================================================= */

.game-icon{

    font-size:70px;

    margin-bottom:10px;

}

#introScreen h1{

    margin:10px 0 15px;

    font-size:34px;

    color:#333;

}

.intro-description{

    max-width:600px;

    margin:0 auto 25px;

    color:#666;

    font-size:18px;

    line-height:1.6;

}


.game-info{

    display:flex;

    justify-content:center;

    gap:15px;

    flex-wrap:wrap;

    margin:25px 0;

}

.game-info div{

    background:#f4f8fb;

    border:1px solid #e1e8ee;

    border-radius:12px;

    padding:12px 18px;

    color:#555;

    font-size:16px;

}


/* =========================================================
   BUTTONS
========================================================= */

button{

    border:none;

    border-radius:12px;

    padding:13px 30px;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}

button:hover{

    transform:translateY(-2px);

}

button:disabled{

    cursor:default;

    opacity:.7;

    transform:none;

}


.primary-btn{

    background:#4779b8;

    color:white;

}

.primary-btn:hover{

    background:#3d6ba5;

}


/* =========================================================
   GAME TITLE
========================================================= */

.game-title{

    margin:0 0 20px;

    font-size:30px;

    color:#333;

}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    margin-bottom:15px;

    font-weight:bold;

    color:#555;

}

.question-count{

    color:#666;

}

.score{

    color:#4779b8;

    font-size:18px;

}


/* =========================================================
   PROGRESS
========================================================= */

.progress-wrap{

    width:100%;

    height:9px;

    background:#eee;

    border-radius:20px;

    overflow:hidden;

    margin-bottom:25px;

}

.progress{

    width:0%;

    height:100%;

    background:#4779b8;

    transition:.3s;

}


/* =========================================================
   QUESTION
========================================================= */

.instruction{

    margin:10px 0 20px;

    color:#666;

    font-size:18px;

}


/* =========================================================
   COLOR BOX
========================================================= */

#colorBox{

    width:230px;

    height:230px;

    margin:20px auto 30px;

    border:3px solid #ddd;

    border-radius:20px;

    box-shadow:
        0 5px 15px rgba(0,0,0,.08);

}


/* =========================================================
   OPTIONS
========================================================= */

#options{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:14px;

    max-width:650px;

    margin:0 auto;

}


.option{

    width:100%;

    padding:17px 15px;

    background:#fff3d6;

    border:2px solid #d8ad50;

    color:#333;

    font-size:21px;

    border-radius:12px;

    cursor:pointer;

    transition:.2s;

}

.option:hover{

    background:#ffe8b5;

    border-color:#c99425;

    transform:translateY(-2px);

}


.option.correct{

    background:#c8e6c9;

    border-color:#4caf50;

    color:#256b2a;

}

.option.wrong{

    background:#ffcdd2;

    border-color:#ef5350;

    color:#b71c1c;

}

.option.disabled{

    pointer-events:none;

}


/* =========================================================
   FEEDBACK
========================================================= */

#message{

    min-height:40px;

    margin:20px 0 5px;

    font-size:20px;

    font-weight:bold;

}


/* =========================================================
   RESULT
========================================================= */

#resultScreen{

    text-align:center;

    padding:20px 10px;

}

#resultScreen h2{

    margin:0 0 20px;

    color:#4779b8;

    font-size:32px;

}

.final-score{

    font-size:28px;

    margin:20px 0;

    color:#333;

}

.performance{

    font-size:21px;

    color:#666;

    margin-bottom:25px;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    body{

        padding:15px;

    }


    .game-box{

        width:100%;

        padding:25px 18px;

        border-radius:20px;

    }


    #introScreen h1{

        font-size:28px;

    }


    .intro-description{

        font-size:16px;

    }


    .game-info{

        flex-direction:column;

        align-items:stretch;

    }


    .game-info div{

        width:100%;

    }


    .game-title{

        font-size:25px;

    }


    .topbar{

        font-size:15px;

    }


    .score{

        font-size:16px;

    }


    #colorBox{

        width:190px;

        height:190px;

        margin:20px auto 25px;

    }


    #options{

        grid-template-columns:1fr;

    }


    .option{

        font-size:19px;

        padding:15px;

    }


    #message{

        font-size:18px;

    }

}

</style>

</head>


<body>


<!-- =========================================================
     BACK TO LOBBY
========================================================= -->

<div class="back-btn-container">

    <a
        href="../../index.html"
        class="back-btn"
    >
        ⬅ Back to Lobby
    </a>

</div>



<!-- =========================================================
     GAME BOX
========================================================= -->

<div class="game-box">


    <!-- =====================================================
         INTRO SCREEN
    ====================================================== -->

    <div
        id="introScreen"
        class="screen active"
    >

        <div class="game-icon">
            🎨
        </div>


        <h1>
            Vietnamese Color Quiz
        </h1>


        <p class="intro-description">

            Look at the color and choose
            the correct Vietnamese word.

        </p>


        <div class="game-info">

            <div>
                📝
                <strong>15 Questions</strong>
            </div>

            <div>
                🎯
                <strong>4 Choices</strong>
            </div>

        </div>


        <button
            class="primary-btn"
            onclick="startGame()"
        >
            Start Game →
        </button>

    </div>



    <!-- =====================================================
         GAME SCREEN
    ====================================================== -->

    <div
        id="gameScreen"
        class="screen"
    >


        <h1 class="game-title">

            🎨 Vietnamese Color Quiz

        </h1>


        <!-- TOP BAR -->

        <div class="topbar">


            <div class="question-count">

                Question

                <span id="question">
                    1
                </span>

                /15

            </div>


            <div class="score">

                Score:

                <span id="score">
                    0
                </span>

            </div>


        </div>



        <!-- PROGRESS -->

        <div class="progress-wrap">

            <div
                class="progress"
                id="progress"
            ></div>

        </div>



        <!-- QUESTION -->

        <p class="instruction">

            What is this color in Vietnamese?

        </p>



        <!-- COLOR -->

        <div id="colorBox"></div>



        <!-- OPTIONS -->

        <div
            id="options"
        ></div>



        <!-- FEEDBACK -->

        <div
            id="message"
        ></div>


    </div>



    <!-- =====================================================
         RESULT SCREEN
    ====================================================== -->

    <div
        id="resultScreen"
        class="screen"
    >


        <h2>

            🎉 Game Finished!

        </h2>


        <div class="final-score">

            Final Score:

            <strong>

                <span id="finalScore">
                    0
                </span>

                /15

            </strong>

        </div>


        <div
            class="performance"
            id="performance"
        ></div>


        <button
            class="primary-btn"
            onclick="restartGame()"
        >

            Play Again

        </button>


    </div>


</div>



<script>

/* =========================================================
   GAME DATA
========================================================= */

const colors = [

    {
        name:"màu đỏ",
        color:"#ff0000"
    },

    {
        name:"màu cam",
        color:"#ff8800"
    },

    {
        name:"màu vàng",
        color:"#ffd700"
    },

    {
        name:"màu xanh lá",
        color:"#00aa00"
    },

    {
        name:"màu hồng",
        color:"#ff69b4"
    },

    {
        name:"màu đen",
        color:"#000000"
    },

    {
        name:"màu trắng",
        color:"#ffffff"
    }

];


/* =========================================================
   SETTINGS
========================================================= */

const TOTAL_QUESTIONS = 15;

const TOTAL_OPTIONS = 4;


/* =========================================================
   STATE
========================================================= */

let questions = [];

let currentQuestion = 0;

let score = 0;

let currentAnswer = null;

let answered = false;


/* =========================================================
   DOM
========================================================= */

const introScreen =
    document.getElementById(
        "introScreen"
    );

const gameScreen =
    document.getElementById(
        "gameScreen"
    );

const resultScreen =
    document.getElementById(
        "resultScreen"
    );

const colorBox =
    document.getElementById(
        "colorBox"
    );

const optionsDiv =
    document.getElementById(
        "options"
    );

const message =
    document.getElementById(
        "message"
    );

const questionText =
    document.getElementById(
        "question"
    );

const scoreText =
    document.getElementById(
        "score"
    );

const progress =
    document.getElementById(
        "progress"
    );

const finalScore =
    document.getElementById(
        "finalScore"
    );

const performance =
    document.getElementById(
        "performance"
    );


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    const arr = [...array];


    for(
        let i = arr.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] = [
            arr[j],
            arr[i]
        ];

    }


    return arr;

}


/* =========================================================
   CREATE QUESTIONS
========================================================= */

function createQuestions(){

    /*
       Create 15 questions.

       Colors can appear more than once,
       but the same color will not appear
       twice in a row.
    */

    questions = [];

    let previousColor = null;


    for(
        let i = 0;
        i < TOTAL_QUESTIONS;
        i++
    ){

        let available =
            colors.filter(
                color =>
                    color !== previousColor
            );


        if(
            available.length === 0
        ){

            available = colors;

        }


        const selected =
            available[
                Math.floor(
                    Math.random() *
                    available.length
                )
            ];


        questions.push(selected);


        previousColor =
            selected;

    }

}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    currentQuestion = 0;

    score = 0;

    currentAnswer = null;

    answered = false;


    createQuestions();


    introScreen
        .classList
        .remove("active");


    resultScreen
        .classList
        .remove("active");


    gameScreen
        .classList
        .add("active");


    scoreText.textContent =
        "0";


    loadQuestion();

}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion(){

    answered = false;


    const question =
        questions[currentQuestion];


    currentAnswer =
        question;


    questionText.textContent =
        currentQuestion + 1;


    progress.style.width =
        (
            currentQuestion /
            TOTAL_QUESTIONS *
            100
        ) + "%";


    colorBox.style.backgroundColor =
        question.color;


    message.textContent =
        "";


    message.style.color =
        "";


    optionsDiv.innerHTML =
        "";


    /*
       Create wrong answers
    */

    const wrongAnswers =
        shuffle(

            colors.filter(
                color =>
                    color !== question
            )

        ).slice(
            0,
            TOTAL_OPTIONS - 1
        );


    /*
       1 correct + 3 wrong
    */

    const options =
        shuffle([

            question,

            ...wrongAnswers

        ]);


    options.forEach(
        option => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "option";


            button.textContent =
                option.name;


            button.onclick =
                () => {

                    chooseAnswer(
                        button,
                        option
                    );

                };


            optionsDiv.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   CHOOSE ANSWER
========================================================= */

function chooseAnswer(
    button,
    selected
){

    if(answered){

        return;

    }


    /*
       CORRECT
    */

    if(
        selected === currentAnswer
    ){

        answered = true;


        button.classList.add(
            "correct"
        );


        score++;


        scoreText.textContent =
            score;


        message.style.color =
            "#3b8b58";


        message.textContent =
            "✅ Correct!";


        disableOptions();


        setTimeout(
            nextQuestion,
            900
        );


        return;

    }


    /*
       WRONG

       Learner can try again.
    */

    button.classList.add(
        "wrong"
    );


    message.style.color =
        "#c54d4d";


    message.textContent =
        "❌ Try again!";


    setTimeout(
        () => {

            button.classList.remove(
                "wrong"
            );

            if(!answered){

                message.textContent =
                    "";

            }

        },
        600
    );

}


/* =========================================================
   DISABLE OPTIONS
========================================================= */

function disableOptions(){

    document
        .querySelectorAll(
            ".option"
        )
        .forEach(
            button => {

                button.classList.add(
                    "disabled"
                );

            }
        );

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion(){

    currentQuestion++;


    if(
        currentQuestion >=
        TOTAL_QUESTIONS
    ){

        finishGame();

        return;

    }


    loadQuestion();

}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

    progress.style.width =
        "100%";


    gameScreen
        .classList
        .remove("active");


    resultScreen
        .classList
        .add("active");


    finalScore.textContent =
        score;


    const percentage =
        Math.round(
            score /
            TOTAL_QUESTIONS *
            100
        );


    let resultMessage;


    if(
        percentage === 100
    ){

        resultMessage =
            "🏆 Perfect! Excellent!";

    }

    else if(
        percentage >= 80
    ){

        resultMessage =
            "🎉 Excellent job!";

    }

    else if(
        percentage >= 60
    ){

        resultMessage =
            "👍 Good job! Keep practicing!";

    }

    else{

        resultMessage =
            "📚 Keep practicing your colors!";

    }


    performance.textContent =
        resultMessage;

}


/* =========================================================
   RESTART
========================================================= */

function restartGame(){

    resultScreen
        .classList
        .remove("active");


    startGame();

}

</script>

</body>

</html>
