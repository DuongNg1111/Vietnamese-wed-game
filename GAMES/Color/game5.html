<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vietnamese Color Quiz</title>

<meta name="game-title" content="Vietnamese Color Quiz">
<meta
    name="game-description"
    content="Practice Vietnamese color words by matching each color with the correct Vietnamese word."
>
<meta name="game-icon" content="🎨">
<meta name="game-explanation" content="false">

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;

    font-family:Arial, Helvetica, sans-serif;

    background:#f7f9fc;

    min-height:100vh;

    color:#222;
}


/* =========================================================
   BACK TO LOBBY
========================================================= */

.back-btn-container{
    max-width:850px;
    margin:0 auto 15px;
}

.back-btn{
    display:inline-block;

    padding:10px 18px;

    background:white;
    color:#555;

    border:2px solid #ddd;
    border-radius:10px;

    text-decoration:none;
    font-weight:bold;

    transition:.2s;
}

.back-btn:hover{
    background:#f0f0f0;
    transform:translateY(-2px);
}


/* =========================================================
   GAME CONTAINER
========================================================= */

.game-box{
    width:min(850px, 95vw);

    margin:0 auto;

    background:white;

    border-radius:24px;

    padding:35px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.10);

    text-align:center;
}


/* =========================================================
   INTRO SCREEN
========================================================= */

#introScreen{
    padding:15px 10px 10px;
}

.game-icon{
    font-size:70px;
    margin-bottom:10px;
}

#introScreen h1{
    margin:10px 0 15px;

    font-size:34px;

    color:#333;
}

.intro-description{
    max-width:600px;

    margin:0 auto 25px;

    color:#666;

    font-size:18px;

    line-height:1.6;
}


/* =========================================================
   GAME INFO
========================================================= */

.game-info{
    display:flex;

    justify-content:center;

    gap:15px;

    flex-wrap:wrap;

    margin:25px 0;
}

.game-info div{
    background:#f4f8fb;

    border:1px solid #e1e8ee;

    border-radius:12px;

    padding:12px 18px;

    color:#555;

    font-size:16px;
}


/* =========================================================
   BUTTON
========================================================= */

button{
    border:none;

    border-radius:12px;

    padding:13px 30px;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
}

button:disabled{
    cursor:default;
    opacity:.5;
}


/* START / PLAY AGAIN */

.primary-btn{
    background:#4779b8;
    color:white;
}

.primary-btn:hover{
    background:#3d6ba5;
}


/* =========================================================
   GAME HEADER
========================================================= */

.game-title{
    margin:0 0 20px;

    font-size:30px;

    color:#333;
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    display:flex;

    justify-content:space-between;
    align-items:center;

    gap:15px;

    margin-bottom:20px;

    font-weight:bold;

    color:#555;
}

.round-text{
    color:#666;
}

.score-text{
    font-size:18px;
}


/* =========================================================
   COLOR BOX
========================================================= */

#colorBox{
    width:230px;
    height:230px;

    margin:25px auto;

    border:3px solid #ddd;

    border-radius:20px;

    box-shadow:
        0 5px 15px rgba(0,0,0,.08);
}


/* =========================================================
   QUESTION
========================================================= */

.instruction{
    margin:10px 0 20px;

    color:#666;

    font-size:17px;
}


/* =========================================================
   OPTIONS
========================================================= */

#options{
    display:flex;

    flex-direction:column;

    align-items:center;

    gap:12px;

    margin-top:20px;
}

.option{
    width:320px;

    max-width:90%;

    padding:16px 20px;

    background:#fff3d6;

    border:2px solid #d8ad50;

    color:#333;

    font-size:22px;

    border-radius:14px;
}

.option:hover{
    background:#ffe8b5;

    transform:translateY(-2px);
}


/* =========================================================
   FEEDBACK
========================================================= */

#message{
    min-height:40px;

    margin:20px 0 5px;

    font-size:20px;

    font-weight:bold;
}


/* =========================================================
   RESULT SCREEN
========================================================= */

#resultScreen{
    display:none;

    padding:20px 10px;
}

#resultScreen h2{
    margin:0 0 20px;

    color:#4779b8;

    font-size:32px;
}

.final-score{
    font-size:26px;

    margin:15px 0;
}

.performance{
    font-size:21px;

    margin:15px 0 25px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    body{
        padding:15px;
    }

    .game-box{
        width:100%;

        padding:25px 18px;

        border-radius:20px;
    }

    #introScreen h1{
        font-size:28px;
    }

    .intro-description{
        font-size:16px;
    }

    .game-info{
        flex-direction:column;

        align-items:stretch;
    }

    .game-info div{
        width:100%;
    }

    .game-title{
        font-size:25px;
    }

    .topbar{
        font-size:15px;
    }

    .score-text{
        font-size:16px;
    }

    #colorBox{
        width:190px;
        height:190px;

        margin:20px auto;
    }

    .option{
        width:100%;

        font-size:20px;

        padding:15px;
    }

    #message{
        font-size:18px;
    }

}

</style>

</head>


<body>


<!-- =========================================================
     BACK TO LOBBY
========================================================= -->

<div class="back-btn-container">

    <a
        href="../../../index.html"
        class="back-btn"
    >
        ⬅ Back to Lobby
    </a>

</div>


<!-- =========================================================
     GAME BOX
========================================================= -->

<div class="game-box">


    <!-- =====================================================
         INTRO SCREEN
    ====================================================== -->

    <div id="introScreen">

        <div class="game-icon">
            🎨
        </div>

        <h1>
            Vietnamese Color Quiz
        </h1>

        <p class="intro-description">

            Practice Vietnamese color words by
            matching each color with the correct
            Vietnamese word.

        </p>


        <div class="game-info">

            <div>
                📝
                <strong>15 Questions</strong>
            </div>

            <div>
                🎯
                <strong>Choose the correct answer</strong>
            </div>

        </div>


        <button
            class="primary-btn"
            onclick="startGame()"
        >
            Start Game →
        </button>

    </div>



    <!-- =====================================================
         GAME SCREEN
    ====================================================== -->

    <div
        id="gameScreen"
        style="display:none;"
    >

        <h1 class="game-title">
            🎨 Vietnamese Color Quiz
        </h1>


        <div class="topbar">

            <div class="round-text">

                Question
                <span id="question">
                    1
                </span>
                / 15

            </div>


            <div class="score-text">

                Score:
                <span id="score">
                    0
                </span>

            </div>

        </div>


        <p class="instruction">

            What is this color in Vietnamese?

        </p>


        <div id="colorBox"></div>


        <div id="options"></div>


        <div id="message"></div>

    </div>



    <!-- =====================================================
         RESULT SCREEN
    ====================================================== -->

    <div id="resultScreen">

        <h2>
            🎉 Game Finished!
        </h2>


        <div class="final-score">

            Final Score:
            <strong>
                <span id="finalScore">
                    0
                </span>
                / 15
            </strong>

        </div>


        <div
            class="performance"
            id="performance"
        >
        </div>


        <button
            class="primary-btn"
            onclick="restartGame()"
        >
            Play Again
        </button>

    </div>


</div>



<script>


/* =========================================================
   GAME DATA
========================================================= */

const colors = [

    {
        name:"màu đỏ",
        color:"#ff0000"
    },

    {
        name:"màu cam",
        color:"#ff8800"
    },

    {
        name:"màu vàng",
        color:"#ffd700"
    },

    {
        name:"màu xanh lá",
        color:"#00aa00"
    },

    {
        name:"màu hồng",
        color:"#ff69b4"
    },

    {
        name:"màu đen",
        color:"#000000"
    },

    {
        name:"màu trắng",
        color:"#ffffff"
    }

];


/* =========================================================
   GAME SETTINGS
========================================================= */

const TOTAL_QUESTIONS = 15;


/* =========================================================
   GAME STATE
========================================================= */

let currentQuestion = 0;

let score = 0;

let currentAnswer = null;

let previousAnswer = null;


/* =========================================================
   DOM
========================================================= */

const introScreen =
    document.getElementById("introScreen");

const gameScreen =
    document.getElementById("gameScreen");

const resultScreen =
    document.getElementById("resultScreen");

const colorBox =
    document.getElementById("colorBox");

const optionsDiv =
    document.getElementById("options");

const message =
    document.getElementById("message");

const questionText =
    document.getElementById("question");

const scoreText =
    document.getElementById("score");

const finalScore =
    document.getElementById("finalScore");

const performance =
    document.getElementById("performance");


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    const newArray = [...array];

    for(
        let i = newArray.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            newArray[i],
            newArray[j]
        ] = [
            newArray[j],
            newArray[i]
        ];

    }

    return newArray;

}


/* =========================================================
   GET RANDOM COLOR
   Avoid the same color twice in a row
========================================================= */

function getRandomColor(){

    let availableColors =
        colors.filter(
            color =>
                color !== previousAnswer
        );


    if(availableColors.length === 0){

        availableColors = colors;

    }


    const selected =
        availableColors[
            Math.floor(
                Math.random() *
                availableColors.length
            )
        ];


    previousAnswer = selected;


    return selected;

}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    currentQuestion = 0;

    score = 0;

    currentAnswer = null;

    previousAnswer = null;


    introScreen.style.display = "none";

    resultScreen.style.display = "none";

    gameScreen.style.display = "block";


    scoreText.textContent = "0";


    nextQuestion();

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion(){

    if(
        currentQuestion >= TOTAL_QUESTIONS
    ){

        finishGame();

        return;

    }


    currentQuestion++;


    questionText.textContent =
        currentQuestion;


    message.textContent = "";

    message.style.color = "";


    currentAnswer =
        getRandomColor();


    colorBox.style.backgroundColor =
        currentAnswer.color;


    /* =====================================================
       CREATE WRONG ANSWER
    ====================================================== */

    let wrongAnswer;


    do{

        wrongAnswer =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];

    }

    while(
        wrongAnswer === currentAnswer
    );


    /* =====================================================
       CREATE TWO OPTIONS
    ====================================================== */

    const choices =
        shuffle([
            currentAnswer,
            wrongAnswer
        ]);


    optionsDiv.innerHTML = "";


    choices.forEach(choice => {

        const button =
            document.createElement("button");


        button.className =
            "option";


        button.textContent =
            choice.name;


        button.onclick = function(){

            checkAnswer(
                choice,
                button
            );

        };


        optionsDiv.appendChild(button);

    });

}


/* =========================================================
   CHECK ANSWER
========================================================= */

function checkAnswer(
    choice,
    selectedButton
){

    const buttons =
        document.querySelectorAll(
            ".option"
        );


    /* Prevent multiple clicks */

    buttons.forEach(button => {

        button.disabled = true;

    });


    /* =====================================================
       CORRECT
    ====================================================== */

    if(
        choice.name ===
        currentAnswer.name
    ){

        score++;


        scoreText.textContent =
            score;


        selectedButton.style.background =
            "#4caf70";

        selectedButton.style.borderColor =
            "#4caf70";

        selectedButton.style.color =
            "white";


        message.style.color =
            "#3b8b58";


        message.textContent =
            "✅ Correct!";


        setTimeout(
            nextQuestion,
            1000
        );

    }


    /* =====================================================
       WRONG
    ====================================================== */

    else{

        selectedButton.style.background =
            "#ef5350";

        selectedButton.style.borderColor =
            "#ef5350";

        selectedButton.style.color =
            "white";


        message.style.color =
            "#c54d4d";


        message.textContent =
            "❌ Correct answer: " +
            currentAnswer.name;


        setTimeout(
            nextQuestion,
            1500
        );

    }

}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

    gameScreen.style.display = "none";

    resultScreen.style.display = "block";


    finalScore.textContent =
        score;


    const percent =
        Math.round(
            (score / TOTAL_QUESTIONS) * 100
        );


    if(score >= 14){

        performance.textContent =
            "🏆 Excellent!";

    }

    else if(score >= 11){

        performance.textContent =
            "🎉 Great Job!";

    }

    else if(score >= 8){

        performance.textContent =
            "👍 Good Work!";

    }

    else{

        performance.textContent =
            "📚 Keep Practicing!";

    }

}


/* =========================================================
   RESTART GAME
========================================================= */

function restartGame(){

    resultScreen.style.display = "none";

    gameScreen.style.display = "block";


    startGame();

}

</script>

</body>

</html>
