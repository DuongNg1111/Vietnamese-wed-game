<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Match Colors with Vietnamese Words</title>

<meta name="game-title" content="Colors Matching">
<meta name="game-description" content="Match colors with their Vietnamese words.">
<meta name="game-icon" content="🎨">

<style>

*{
    box-sizing:border-box;
}

body{

    font-family:Arial,sans-serif;

    background:#f4f6f8;

    margin:0;
    padding:20px;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

}

.game-box{

    background:white;

    width:90%;
    max-width:750px;

    padding:40px;

    border-radius:20px;

    box-shadow:0 8px 25px rgba(0,0,0,0.1);

    text-align:center;

}


/* =========================
   INTRO SCREEN
========================= */

#introScreen h1{

    color:#333;

    font-size:34px;

    margin-bottom:20px;

}

#introScreen h2{

    color:#444;

    margin-bottom:20px;

}

#introScreen p{

    font-size:18px;

    color:#555;

    line-height:1.6;

}

.start-btn{

    margin-top:20px;

    padding:14px 35px;

    border:none;

    border-radius:12px;

    font-size:20px;

    font-weight:bold;

    cursor:pointer;

    background:#2196f3;

    color:white;

    transition:0.2s;

}

.start-btn:hover{

    background:#1976d2;

    transform:scale(1.03);

}


/* =========================
   GAME SCREEN
========================= */

#gameScreen{

    display:none;

}

#gameScreen h1{

    color:#333;

}

#info{

    font-size:20px;

    font-weight:bold;

    margin-bottom:25px;

    color:#444;

}

#game{

    max-width:700px;

    margin:auto;

}

.row{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:20px;

    margin:15px 0;

}

.colorBox{

    width:100px;

    height:100px;

    border-radius:12px;

    border:2px solid #ddd;

}

select{

    width:220px;

    padding:10px;

    font-size:18px;

    border:1px solid #ccc;

    border-radius:8px;

    background:white;

}

.check-btn{

    margin-top:20px;

    padding:12px 24px;

    font-size:18px;

    border:none;

    border-radius:10px;

    cursor:pointer;

    background:#2196f3;

    color:white;

    transition:0.2s;

}

.check-btn:hover{

    background:#1976d2;

}

.check-btn:disabled{

    opacity:0.6;

    cursor:default;

}

#message{

    margin-top:20px;

    font-size:24px;

    font-weight:bold;

    min-height:40px;

}

#result{

    margin-top:30px;

    font-size:28px;

    font-weight:bold;

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .game-box{

        width:95%;

        padding:25px 20px;

    }

    #introScreen h1{

        font-size:28px;

    }

    .row{

        gap:12px;

    }

    .colorBox{

        width:75px;

        height:75px;

    }

    select{

        width:190px;

        font-size:16px;

    }

}

</style>

</head>


<body>


<div class="game-box">


    <!-- =========================
         INTRO SCREEN
    ========================= -->

    <div id="introScreen">

        <h1>
            🎨 Match Colors
        </h1>

        <h2>
            Hello 👋
        </h2>

        <p>
            Welcome to the Vietnamese color matching game!
        </p>

        <p>
            🎨 Match each color with the correct Vietnamese word.
        </p>

        <p>
            📝 15 Rounds &nbsp;•&nbsp; 4 Colors per Round
        </p>

        <p>
            🏆 Total: <b>60 Points</b>
        </p>

        <button
            class="start-btn"
            id="startBtn"
        >
            Start Game
        </button>

    </div>


    <!-- =========================
         GAME SCREEN
    ========================= -->

    <div id="gameScreen">

        <h1>
            🎨 Match Colors
        </h1>


        <div id="info">

            Round:
            <span id="round">1</span>/15

            &nbsp; | &nbsp;

            Score:
            <span id="score">0</span>

        </div>


        <div id="game"></div>


        <button
            class="check-btn"
            id="checkBtn"
            onclick="checkAnswers()"
        >
            Check Answers
        </button>


        <div id="message"></div>


        <div id="result"></div>

    </div>


</div>


<script>


/* =========================
   GAME DATA
========================= */

const colors = [

    {
        name:"màu đỏ",
        color:"#ff0000"
    },

    {
        name:"màu cam",
        color:"#ff8800"
    },

    {
        name:"màu vàng",
        color:"#ffd700"
    },

    {
        name:"màu xanh lá",
        color:"#00aa00"
    },

    {
        name:"màu hồng",
        color:"#ff69b4"
    },

    {
        name:"màu đen",
        color:"#000000"
    },

    {
        name:"màu trắng",
        color:"#ffffff"
    }

];


let round = 1;

let score = 0;

let currentColors = [];

let locked = false;


/* =========================
   SHUFFLE
========================= */

function shuffle(arr){

    return [...arr]
        .sort(() => Math.random() - 0.5);

}


/* =========================
   START GAME
========================= */

document.getElementById("startBtn").onclick = function(){

    document.getElementById("introScreen")
        .style.display = "none";

    document.getElementById("gameScreen")
        .style.display = "block";

    createRound();

};


/* =========================
   CREATE ROUND
========================= */

function createRound(){

    locked = false;

    document.getElementById("round")
        .textContent = round;

    document.getElementById("message")
        .textContent = "";

    document.getElementById("result")
        .innerHTML = "";

    document.getElementById("checkBtn")
        .disabled = false;


    currentColors =
        shuffle(colors).slice(0,4);


    const words =
        shuffle(
            currentColors.map(
                c => c.name
            )
        );


    const game =
        document.getElementById("game");


    game.innerHTML = "";


    currentColors.forEach(
        (item,index)=>{


        const row =
            document.createElement("div");


        row.className = "row";


        const box =
            document.createElement("div");


        box.className = "colorBox";


        box.style.background =
            item.color;


        const select =
            document.createElement("select");


        select.id =
            "answer" + index;


        select.innerHTML =
            '<option value="">Select a word</option>';


        words.forEach(word=>{


            const option =
                document.createElement("option");


            option.value =
                word;


            option.textContent =
                word;


            select.appendChild(option);

        });


        row.appendChild(box);

        row.appendChild(select);

        game.appendChild(row);

    });

}


/* =========================
   CHECK ANSWERS
========================= */

function checkAnswers(){

    if(locked) return;

    locked = true;


    let correct = 0;


    currentColors.forEach(
        (item,index)=>{


        const answer =
            document.getElementById(
                "answer"+index
            ).value;


        if(answer === item.name){

            correct++;

        }

    });


    score += correct;


    document.getElementById("score")
        .textContent = score;


    const message =
        document.getElementById("message");


    if(correct === 4){

        message.style.color =
            "green";

        message.textContent =
            "✓ Perfect! 4/4 Correct";

    }

    else{

        message.style.color =
            "orange";

        message.textContent =
            `You got ${correct}/4 correct`;

    }


    document.getElementById("checkBtn")
        .disabled = true;


    setTimeout(()=>{


        round++;


        if(round > 15){

            finishGame();

            return;

        }


        createRound();


    },2000);

}


/* =========================
   FINISH GAME
========================= */

function finishGame(){

    document.getElementById("game")
        .innerHTML = "";


    document.getElementById("checkBtn")
        .style.display = "none";


    document.getElementById("message")
        .innerHTML = "";


    let performance = "";


    if(score >= 55){

        performance =
            "Excellent!";

    }

    else if(score >= 40){

        performance =
            "Great Job!";

    }

    else if(score >= 25){

        performance =
            "Good Work!";

    }

    else{

        performance =
            "Keep Practicing!";

    }


    document.getElementById("result")
        .innerHTML = `

            🏆 Game Finished

            <br><br>

            Final Score:
            ${score}/60

            <br><br>

            ${performance}

            <br><br>

            <button
                class="start-btn"
                onclick="restartGame()"
            >
                Play Again
            </button>

        `;

}


/* =========================
   RESTART
========================= */

function restartGame(){

    round = 1;

    score = 0;

    locked = false;


    document.getElementById("score")
        .textContent = "0";


    document.getElementById("result")
        .innerHTML = "";


    document.getElementById("message")
        .innerHTML = "";


    document.getElementById("checkBtn")
        .style.display = "inline-block";


    createRound();

}


</script>

</body>

</html>
