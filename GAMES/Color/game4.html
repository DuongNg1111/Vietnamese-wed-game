<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Color Matching</title>

<meta name="game-title" content="Colors Matching">
<meta name="game-description" content="Match colors with their Vietnamese words.">
<meta name="game-icon" content="🎨">
<meta name="game-explanation" content="Choose the correct Vietnamese word for each color. Complete all four answers, then check your answers. A perfect round earns 1 point.">

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#f5f7fb;

    min-height:100vh;

    padding:18px;

    color:#333;

}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.game-box{

    width:760px;

    max-width:100%;

    margin:0 auto;

    background:white;

    border-radius:20px;

    padding:22px 26px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.08);

}


/* =========================================================
   BACK TO CATEGORY
========================================================= */

.lobby-btn{

    display:inline-block;

    background:white;

    color:#4b5563;

    border:2px solid #d9dee8;

    border-radius:10px;

    padding:8px 15px;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

    margin-bottom:15px;

}

.lobby-btn:hover{

    background:#4b5563;

    color:white;

}


/* =========================================================
   INTRO SCREEN
========================================================= */

#introScreen{

    text-align:center;

}

#introScreen h1{

    color:#374151;

    font-size:30px;

    margin-bottom:12px;

}

#introScreen h2{

    color:#4b5563;

    font-size:21px;

    margin-bottom:15px;

}

#introScreen p{

    color:#6b7280;

    font-size:16px;

    line-height:1.6;

    margin:7px 0;

}

.start-btn{

    margin-top:18px;

    padding:12px 28px;

    border:none;

    border-radius:11px;

    background:#4f46e5;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}

.start-btn:hover{

    background:#4338ca;

    transform:translateY(-2px);

}


/* =========================================================
   GAME SCREEN
========================================================= */

#gameScreen{

    display:none;

}

.game-header{

    text-align:center;

    margin-bottom:12px;

}

.game-header h1{

    color:#374151;

    font-size:27px;

    margin-bottom:5px;

}

.subtitle{

    color:#6b7280;

    font-size:15px;

}


/* =========================================================
   INFO
========================================================= */

#info{

    text-align:center;

    color:#6b7280;

    font-size:16px;

    font-weight:bold;

    margin-bottom:12px;

}


/* =========================================================
   GAME AREA
========================================================= */

#game{

    max-width:570px;

    margin:0 auto;

}

.row{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:22px;

    margin:9px 0;

}

.colorBox{

    width:70px;

    height:55px;

    border-radius:11px;

    border:3px solid #d1d5db;

    flex-shrink:0;

}

select{

    width:260px;

    height:46px;

    padding:8px 12px;

    font-size:16px;

    border:2px solid #d1d5db;

    border-radius:10px;

    background:white;

    color:#374151;

    cursor:pointer;

}

select:focus{

    outline:none;

    border-color:#6366f1;

}

select:disabled{

    background:#f3f4f6;

    cursor:default;

}


/* =========================================================
   BUTTONS
========================================================= */

.controls{

    display:flex;

    justify-content:center;

    gap:10px;

    margin-top:14px;

}

.action-btn{

    padding:10px 20px;

    border:none;

    border-radius:10px;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}

.clear-btn{

    background:#f1f3f5;

    color:#4b5563;

    border:2px solid #d9dee8;

}

.clear-btn:hover{

    background:#e5e7eb;

}

.check-btn,
.next-btn{

    background:#4f46e5;

    color:white;

}

.check-btn:hover,
.next-btn:hover{

    background:#4338ca;

}

.hidden{

    display:none !important;

}


/* =========================================================
   MESSAGE
========================================================= */

#message{

    min-height:30px;

    text-align:center;

    font-size:20px;

    font-weight:bold;

    margin-top:12px;

}

.correct-message{

    color:#16a34a;

}

.wrong-message{

    color:#dc2626;

}


/* =========================================================
   EXPLANATION
========================================================= */

#explanation{

    margin-top:10px;

    padding:11px 14px;

    background:#f8fafc;

    border-left:4px solid #6366f1;

    border-radius:8px;

    color:#4b5563;

    font-size:14px;

    line-height:1.6;

    text-align:left;

}

.explanation-title{

    color:#374151;

    font-weight:bold;

    margin-bottom:4px;

}


/* =========================================================
   RESULT SCREEN
========================================================= */

#resultScreen{

    display:none;

    text-align:center;

}

.result-title{

    color:#374151;

    font-size:29px;

    margin-bottom:12px;

}

.result-label{

    color:#6b7280;

    font-size:17px;

}

.score{

    color:#4f46e5;

    font-size:48px;

    font-weight:bold;

    margin:10px 0;

}

.performance{

    color:#6b7280;

    font-size:20px;

    margin-bottom:20px;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    body{

        padding:12px;

    }

    .game-box{

        padding:18px 14px;

    }

    .row{

        gap:12px;

    }

    .colorBox{

        width:62px;

        height:50px;

    }

    select{

        width:calc(100% - 74px);

        font-size:15px;

    }

    #game{

        width:100%;

    }

    .controls{

        flex-wrap:wrap;

    }

}

</style>

</head>


<body>


<div class="game-box">


<!-- =========================================================
     BACK TO COLOR CATEGORY
========================================================= -->

<button
    class="lobby-btn"
    onclick="goToCategory()">

    ← Back to Color Games

</button>


<!-- =========================================================
     INTRO SCREEN
========================================================= -->

<div id="introScreen">

    <h1>
        🎨 Match Colors
    </h1>

    <h2>
        Hello 👋
    </h2>

    <p>
        Match each color with the correct Vietnamese word.
    </p>

    <p>
        🎨 20 Rounds &nbsp;•&nbsp; 4 Colors per Round
    </p>

    <p>
        🏆 Each perfect round = 1 point
    </p>

    <p>
        <b>Total: 20 Points</b>
    </p>

    <button
        class="start-btn"
        id="startBtn">

        Start Game

    </button>

</div>


<!-- =========================================================
     GAME SCREEN
========================================================= -->

<div id="gameScreen">


    <div class="game-header">

        <h1>
            🎨 Match Colors
        </h1>

        <div class="subtitle">
            Choose the Vietnamese word for each color.
        </div>

    </div>


    <div id="info">

        Round:
        <span id="round">1</span>/20

        &nbsp; | &nbsp;

        Score:
        <span id="score">0</span>

    </div>


    <div id="game"></div>


    <!-- =====================================================
         CONTROLS
    ====================================================== -->

    <div class="controls">

        <button
            class="action-btn clear-btn"
            id="clearBtn">

            Clear

        </button>


        <button
            class="action-btn check-btn"
            id="checkBtn">

            Check Answers

        </button>


        <button
            class="action-btn next-btn hidden"
            id="nextBtn">

            Next Question →

        </button>

    </div>


    <!-- =====================================================
         MESSAGE
    ====================================================== -->

    <div id="message"></div>


    <!-- =====================================================
         EXPLANATION
    ====================================================== -->

    <div
        id="explanation"
        class="hidden">

        <div class="explanation-title">
            Explanation
        </div>

        <div id="explanationText"></div>

    </div>


</div>


<!-- =========================================================
     RESULT SCREEN
========================================================= -->

<div id="resultScreen">


    <div class="result-title">
        🎉 Game Finished!
    </div>


    <div class="result-label">
        Final Score
    </div>


    <div
        class="score"
        id="scoreText">
    </div>


    <div
        class="performance"
        id="performance">
    </div>


    <button
        class="start-btn"
        id="playAgain">

        Play Again

    </button>


</div>


</div>


<script>

/* =========================================================
   NAVIGATION
========================================================= */

function goToCategory(){

    window.location.href =
        "../../category.html?category=Color";

}


/* =========================================================
   VOCABULARY
========================================================= */

const COLORS = [

    {
        text:"đỏ",
        phonetics:"daw",
        english:"red",
        color:"#ef4444"
    },

    {
        text:"cam",
        phonetics:"kam",
        english:"orange",
        color:"#f97316"
    },

    {
        text:"vàng",
        phonetics:"vang",
        english:"yellow",
        color:"#facc15"
    },

    {
        text:"xanh lá",
        phonetics:"sanh la",
        english:"green",
        color:"#22c55e"
    },

    {
        text:"xanh dương",
        phonetics:"sanh zoong",
        english:"blue",
        color:"#3b82f6"
    },

    {
        text:"tím",
        phonetics:"tim",
        english:"purple",
        color:"#a855f7"
    },

    {
        text:"hồng",
        phonetics:"hong",
        english:"pink",
        color:"#ec4899"
    },

    {
        text:"nâu",
        phonetics:"nəw",
        english:"brown",
        color:"#92400e"
    },

    {
        text:"đen",
        phonetics:"den",
        english:"black",
        color:"#111827"
    },

    {
        text:"trắng",
        phonetics:"chang",
        english:"white",
        color:"#ffffff"
    },

    {
        text:"xám",
        phonetics:"sam",
        english:"gray",
        color:"#6b7280"
    }

];


/* =========================================================
   CONSTANTS
========================================================= */

const TOTAL_ROUNDS = 20;

const COLORS_PER_ROUND = 4;


/* =========================================================
   GAME STATE
========================================================= */

let round = 1;

let score = 0;

let currentColors = [];

let locked = false;


/* =========================================================
   DOM
========================================================= */

const introScreen =
    document.getElementById(
        "introScreen"
    );

const gameScreen =
    document.getElementById(
        "gameScreen"
    );

const resultScreen =
    document.getElementById(
        "resultScreen"
    );

const game =
    document.getElementById(
        "game"
    );

const roundText =
    document.getElementById(
        "round"
    );

const scoreText =
    document.getElementById(
        "score"
    );

const message =
    document.getElementById(
        "message"
    );

const explanation =
    document.getElementById(
        "explanation"
    );

const explanationText =
    document.getElementById(
        "explanationText"
    );

const clearBtn =
    document.getElementById(
        "clearBtn"
    );

const checkBtn =
    document.getElementById(
        "checkBtn"
    );

const nextBtn =
    document.getElementById(
        "nextBtn"
    );


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    const arr = [...array];

    for(
        let i = arr.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            arr[i],
            arr[j]
        ] = [
            arr[j],
            arr[i]
        ];

    }

    return arr;

}


/* =========================================================
   START GAME
========================================================= */

document.getElementById(
    "startBtn"
).onclick = function(){

    round = 1;

    score = 0;

    scoreText.textContent =
        "0";

    introScreen.style.display =
        "none";

    resultScreen.style.display =
        "none";

    gameScreen.style.display =
        "block";

    createRound();

};


/* =========================================================
   CREATE ROUND
========================================================= */

function createRound(){

    locked = false;

    message.textContent =
        "";

    message.className =
        "";

    explanation.classList.add(
        "hidden"
    );

    explanationText.innerHTML =
        "";

    clearBtn.classList.remove(
        "hidden"
    );

    checkBtn.classList.remove(
        "hidden"
    );

    nextBtn.classList.add(
        "hidden"
    );

    checkBtn.disabled =
        false;


    roundText.textContent =
        round;


    /* =====================================================
       SELECT 4 RANDOM COLORS
    ====================================================== */

    currentColors =
        shuffle(COLORS).slice(
            0,
            COLORS_PER_ROUND
        );


    /* =====================================================
       SHUFFLE WORDS
    ====================================================== */

    const words =
        shuffle(
            currentColors.map(
                color => color.text
            )
        );


    game.innerHTML =
        "";


    /* =====================================================
       CREATE ROWS
    ====================================================== */

    currentColors.forEach(
        (item,index)=>{

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "row";


            const colorBox =
                document.createElement(
                    "div"
                );

            colorBox.className =
                "colorBox";

            colorBox.style.background =
                item.color;


            if(
                item.color === "#ffffff"
            ){

                colorBox.style.border =
                    "3px solid #9ca3af";

            }


            const select =
                document.createElement(
                    "select"
                );

            select.id =
                `answer${index}`;


            const defaultOption =
                document.createElement(
                    "option"
                );

            defaultOption.value =
                "";

            defaultOption.textContent =
                "Select a word";

            select.appendChild(
                defaultOption
            );


            words.forEach(
                word=>{

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        word;

                    option.textContent =
                        word;

                    select.appendChild(
                        option
                    );

                }
            );


            row.appendChild(
                colorBox
            );

            row.appendChild(
                select
            );

            game.appendChild(
                row
            );

        }
    );

}


/* =========================================================
   CLEAR ANSWERS
========================================================= */

clearBtn.onclick = function(){

    if(locked){

        return;

    }


    document
        .querySelectorAll(
            "#game select"
        )
        .forEach(
            select=>{

                select.value =
                    "";

            }
        );


    message.textContent =
        "";

    message.className =
        "";

};


/* =========================================================
   CHECK ANSWERS
========================================================= */

checkBtn.onclick = function(){

    if(locked){

        return;

    }


    /* =====================================================
       REQUIRE ALL ANSWERS
    ====================================================== */

    const selects =
        document.querySelectorAll(
            "#game select"
        );


    const incomplete =
        [...selects].some(
            select =>
                select.value === ""
        );


    if(incomplete){

        message.textContent =
            "Please answer all 4 colors first.";

        message.className =
            "wrong-message";

        return;

    }


    /* =====================================================
       LOCK ROUND
    ====================================================== */

    locked = true;


    let correct = 0;


    currentColors.forEach(
        (item,index)=>{

            const answer =
                document.getElementById(
                    `answer${index}`
                ).value;


            if(
                answer === item.text
            ){

                correct++;

            }

        }
    );


    /* =====================================================
       SCORING RULE
       
       ONLY A PERFECT ROUND GETS 1 POINT.
       ANY WRONG ANSWER = 0 POINTS.
    ====================================================== */

    if(
        correct === COLORS_PER_ROUND
    ){

        score++;

        scoreText.textContent =
            score;

        message.textContent =
            "✅ Perfect! +1 point";

        message.className =
            "correct-message";

    }

    else{

        message.textContent =
            `❌ ${correct}/4 correct — 0 points`;

        message.className =
            "wrong-message";

    }


    /* =====================================================
       LOCK ANSWERS
    ====================================================== */

    selects.forEach(
        select=>{

            select.disabled =
                true;

        }
    );


    clearBtn.classList.add(
        "hidden"
    );

    checkBtn.classList.add(
        "hidden"
    );

    nextBtn.classList.remove(
        "hidden"
    );


    /* =====================================================
       SHOW EXPLANATION
    ====================================================== */

    showExplanation();

};


/* =========================================================
   EXPLANATION
========================================================= */

function showExplanation(){

    let html =
        "";


    currentColors.forEach(
        item=>{

            html += `

                <strong>
                    ${item.text}
                </strong>

                /${item.phonetics}/

                — ${item.english}

                <br>

            `;

        }
    );


    explanationText.innerHTML =
        html;


    explanation.classList.remove(
        "hidden"
    );

}


/* =========================================================
   NEXT ROUND
========================================================= */

nextBtn.onclick = function(){

    if(!locked){

        return;

    }


    round++;


    if(
        round > TOTAL_ROUNDS
    ){

        finishGame();

        return;

    }


    createRound();

};


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

    gameScreen.style.display =
        "none";

    resultScreen.style.display =
        "block";


    document.getElementById(
        "scoreText"
    ).textContent =
        `${score} / ${TOTAL_ROUNDS}`;


    let performanceText;


    if(
        score === TOTAL_ROUNDS
    ){

        performanceText =
            "Perfect! 🎉";

    }

    else if(
        score >= 17
    ){

        performanceText =
            "Excellent!";

    }

    else if(
        score >= 14
    ){

        performanceText =
            "Great Job!";

    }

    else if(
        score >= 10
    ){

        performanceText =
            "Good Job!";

    }

    else{

        performanceText =
            "Keep Practicing!";

    }


    document.getElementById(
        "performance"
    ).textContent =
        performanceText;

}


/* =========================================================
   PLAY AGAIN
========================================================= */

document.getElementById(
    "playAgain"
).onclick = function(){

    round = 1;

    score = 0;

    scoreText.textContent =
        "0";

    resultScreen.style.display =
        "none";

    gameScreen.style.display =
        "block";

    createRound();

};

</script>

</body>

</html>
