<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Match the Pictures with the Words</title>

<meta name="game-title" content="Match the Pictures">
<meta name="game-description" content="Match Vietnamese food and drink words with the correct pictures.">
<meta name="game-icon" content="🍉">
<meta name="game-explanation" content="false">

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f5f5f5;
    text-align:center;
    margin:0;
    padding:20px;
}

/* ============================= */
/* BACK TO LOBBY */
/* ============================= */

.back-btn-container{
    max-width:1000px;
    margin:0 auto 20px;
    text-align:left;
}

.back-btn{
    display:inline-block;
    padding:10px 18px;
    background:white;
    color:#555;
    border:2px solid #ddd;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
    transition:.2s;
}

.back-btn:hover{
    background:#f0f0f0;
    transform:translateY(-2px);
}

/* ============================= */
/* TITLE */
/* ============================= */

h1{
    margin:10px 0 10px;
    font-size:32px;
}

.subtitle{
    color:#666;
    font-size:18px;
    margin-bottom:30px;
}

/* ============================= */
/* GAME */
/* ============================= */

#game{
    max-width:1000px;
    margin:auto;
}

.question{
    background:white;
    margin-bottom:30px;
    padding:25px;
    border-radius:15px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.question h2{
    margin-top:0;
    margin-bottom:20px;
    color:#444;
}

/* ============================= */
/* IMAGES */
/* ============================= */

.images{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:25px;
}

.image-box{
    width:160px;
    padding:15px;
    border:2px dashed #ccc;
    border-radius:10px;
    background:#fafafa;
}

.image-box img{
    width:100px;
    height:100px;
    object-fit:contain;
}

/* ============================= */
/* DROP ZONE */
/* ============================= */

.drop-zone{
    margin-top:10px;
    min-height:35px;
    line-height:35px;
    border-radius:8px;
    background:#eeeeee;
    transition:0.3s;
    font-weight:bold;
}

.correct{
    background:#66bb6a !important;
    color:white;
}

.wrong{
    background:#ef5350 !important;
    color:white;
}

/* ============================= */
/* WORDS */
/* ============================= */

.words{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;
}

.word{
    background:#bbdefb;
    padding:10px 18px;
    border-radius:8px;
    cursor:grab;
    font-weight:bold;
    transition:0.3s;
    user-select:none;
}

.word:hover{
    transform:translateY(-3px);
}

.word:active{
    cursor:grabbing;
}

/* ============================= */
/* MOBILE */
/* ============================= */

@media(max-width:600px){

    body{
        padding:15px;
    }

    h1{
        font-size:26px;
    }

    .subtitle{
        font-size:16px;
    }

    .question{
        padding:18px;
    }

    .image-box{
        width:140px;
    }

    .image-box img{
        width:85px;
        height:85px;
    }

}

</style>

</head>

<body>

<!-- ============================= -->
<!-- BACK TO LOBBY -->
<!-- ============================= -->

<div class="back-btn-container">

    <a href="../../../index.html" class="back-btn">
        ⬅ Back to Lobby
    </a>

</div>


<!-- ============================= -->
<!-- TITLE -->
<!-- ============================= -->

<h1>🍉 Match the Pictures with the Words</h1>

<div class="subtitle">
    Match each Vietnamese word with the correct picture.
</div>


<!-- ============================= -->
<!-- GAME -->
<!-- ============================= -->

<div id="game"></div>


<script>

/* =====================================
   VOCABULARY
===================================== */

const items = [

    { name:"bo", vi:"Bò" },
    { name:"ca", vi:"Cá" },
    { name:"cam", vi:"Cam" },
    { name:"caphe", vi:"Cà phê" },
    { name:"chai", vi:"Chai" },
    { name:"chanh", vi:"Chanh" },
    { name:"chuoi", vi:"Chuối" },
    { name:"com", vi:"Cơm" },
    { name:"dia", vi:"Dĩa" },
    { name:"dua", vi:"Dừa" },
    { name:"ga", vi:"Gà" },
    { name:"heo", vi:"Heo" },
    { name:"ly", vi:"Ly" },
    { name:"mi", vi:"Mì" },
    { name:"nuoccam", vi:"Nước cam" },
    { name:"nuocloc", vi:"Nước lọc" },
    { name:"nuocmia", vi:"Nước mía" },
    { name:"nuocngot", vi:"Nước ngọt" },
    { name:"rau", vi:"Rau" },
    { name:"tao", vi:"Táo" },
    { name:"to", vi:"Tô" },
    { name:"xoai", vi:"Xoài" }

];


/* =====================================
   SHUFFLE
===================================== */

function shuffle(array){

    return array.sort(() => Math.random() - 0.5);

}


/* =====================================
   GAME CONTAINER
===================================== */

const game = document.getElementById("game");


/* =====================================
   QUESTIONS 1–15
   2 pictures + 2 words
===================================== */

for(let i = 0; i < 15; i++){

    const pair = shuffle([...items]).slice(0,2);

    createQuestion(
        pair,
        pair,
        i + 1
    );

}


/* =====================================
   QUESTIONS 16–20
   4 pictures + 5 words
===================================== */

for(let i = 15; i < 20; i++){

    const selected = shuffle([...items]).slice(0,4);

    const extra = items.find(
        item => !selected.includes(item)
    );

    const choices = shuffle([
        ...selected,
        extra
    ]);

    createQuestion(
        selected,
        choices,
        i + 1
    );

}


/* =====================================
   CREATE QUESTION
===================================== */

function createQuestion(
    imagesData,
    wordsData,
    number
){

    const question =
        document.createElement("div");

    question.className = "question";


    question.innerHTML =
        `<h2>Question ${number}</h2>`;


    /* ================================
       IMAGE AREA
    ================================= */

    const imagesDiv =
        document.createElement("div");

    imagesDiv.className = "images";


    imagesData.forEach(item => {

        const box =
            document.createElement("div");

        box.className = "image-box";


        box.innerHTML = `

            <img
                src="images/${item.name}.png"
                alt="${item.vi}"
            >

            <br>

            <div class="drop-zone">
                ?
            </div>

        `;


        const zone =
            box.querySelector(".drop-zone");


        /* ============================
           DRAG OVER
        ============================ */

        zone.ondragover = (e) => {

            e.preventDefault();

        };


        /* ============================
           DROP
        ============================ */

        zone.ondrop = (e) => {

            e.preventDefault();


            const draggedName =
                e.dataTransfer.getData("name");

            const draggedWord =
                e.dataTransfer.getData("word");

            const draggedId =
                e.dataTransfer.getData("id");


            zone.classList.remove("correct");
            zone.classList.remove("wrong");


            /* ========================
               CORRECT
            ======================== */

            if(draggedName === item.name){

                zone.innerText =
                    draggedWord;

                zone.classList.add("correct");


                const draggedElement =
                    document.getElementById(draggedId);

                if(draggedElement){

                    draggedElement.remove();

                }

            }


            /* ========================
               WRONG
            ======================== */

            else{

                zone.classList.add("wrong");


                setTimeout(() => {

                    zone.classList.remove("wrong");

                },700);

            }

        };


        imagesDiv.appendChild(box);

    });


    /* =================================
       WORD AREA
    ================================= */

    const wordsDiv =
        document.createElement("div");

    wordsDiv.className = "words";


    wordsData.forEach(item => {

        const word =
            document.createElement("div");

        word.className = "word";


        word.id =
            item.name +
            "-" +
            number +
            "-" +
            Math.random();


        word.innerText =
            item.vi;


        word.draggable = true;


        /* =============================
           DRAG START
        ============================= */

        word.ondragstart = (e) => {

            e.dataTransfer.setData(
                "name",
                item.name
            );

            e.dataTransfer.setData(
                "word",
                item.vi
            );

            e.dataTransfer.setData(
                "id",
                word.id
            );

        };


        wordsDiv.appendChild(word);

    });


    /* =================================
       APPEND
    ================================= */

    question.appendChild(imagesDiv);

    question.appendChild(wordsDiv);

    game.appendChild(question);

}

</script>

</body>
</html>
