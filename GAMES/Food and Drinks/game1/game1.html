<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Match the Pictures with the Words</title>

<meta
    name="game-title"
    content="Match the Pictures with the Words"
>

<meta
    name="game-description"
    content="Match Vietnamese food and drink words with the correct pictures."
>

<meta
    name="game-icon"
    content="🍉"
>

<meta
    name="game-explanation"
    content="false"
>


<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    box-sizing:border-box;
}

body{

    margin:0;

    padding:20px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#f7f9fc;

    min-height:100vh;

    color:#222;
}


/* =========================================================
   BACK TO LOBBY
========================================================= */

.back-btn-container{

    width:min(950px,95vw);

    margin:0 auto 15px;
}

.back-btn{

    display:inline-block;

    padding:10px 18px;

    background:white;

    color:#555;

    border:2px solid #ddd;

    border-radius:10px;

    text-decoration:none;

    font-weight:bold;

    transition:.2s;
}

.back-btn:hover{

    background:#f0f0f0;

    transform:translateY(-2px);
}


/* =========================================================
   GAME CONTAINER
========================================================= */

.game-box{

    width:min(950px,95vw);

    margin:0 auto;

    background:white;

    border-radius:24px;

    padding:35px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.10);

    text-align:center;
}


/* =========================================================
   INTRO SCREEN
========================================================= */

#introScreen{

    padding:15px 10px 10px;
}

.game-icon{

    font-size:70px;

    margin-bottom:10px;
}

#introScreen h1{

    margin:10px 0 15px;

    font-size:34px;

    color:#333;
}

.intro-description{

    max-width:620px;

    margin:0 auto 25px;

    color:#666;

    font-size:18px;

    line-height:1.6;
}


/* =========================================================
   GAME INFO
========================================================= */

.game-info{

    display:flex;

    justify-content:center;

    gap:15px;

    flex-wrap:wrap;

    margin:25px 0;
}

.game-info div{

    background:#f4f8fb;

    border:1px solid #e1e8ee;

    border-radius:12px;

    padding:12px 18px;

    color:#555;

    font-size:16px;
}


/* =========================================================
   BUTTON
========================================================= */

button{

    border:none;

    border-radius:12px;

    padding:13px 30px;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

button:hover{

    transform:translateY(-2px);
}

button:disabled{

    opacity:.5;

    cursor:default;

    transform:none;
}


/* =========================================================
   PRIMARY BUTTON
========================================================= */

.primary-btn{

    background:#4779b8;

    color:white;
}

.primary-btn:hover{

    background:#3d6ba5;
}


/* =========================================================
   SECONDARY BUTTON
========================================================= */

.secondary-btn{

    background:#eeeeee;

    color:#555;

    margin-top:10px;
}

.secondary-btn:hover{

    background:#e2e2e2;
}


/* =========================================================
   GAME SCREEN
========================================================= */

#gameScreen{

    display:none;
}

.game-title{

    margin:0 0 10px;

    font-size:30px;

    color:#333;
}

.instruction{

    margin:0 auto 25px;

    color:#666;

    font-size:17px;

    line-height:1.5;
}


/* =========================================================
   GAME STATUS
========================================================= */

.game-status{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    margin-bottom:25px;

    padding:12px 16px;

    background:#f4f8fb;

    border-radius:12px;

    font-weight:bold;

    color:#555;
}

.score-text{

    font-size:18px;
}


/* =========================================================
   QUESTION CARD
========================================================= */

.question{

    background:#fafcff;

    border:1px solid #e3eaf2;

    border-radius:18px;

    padding:25px;

    margin-bottom:20px;
}

.question-title{

    margin:0 0 22px;

    font-size:20px;

    color:#444;
}


/* =========================================================
   IMAGE AREA
========================================================= */

.images{

    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:20px;

    margin-bottom:25px;
}

.image-box{

    width:160px;

    padding:15px;

    background:white;

    border:2px dashed #cfd8e3;

    border-radius:14px;

    transition:.2s;
}

.image-box img{

    width:100px;

    height:100px;

    object-fit:contain;

    display:block;

    margin:0 auto;
}


/* =========================================================
   DROP ZONE
========================================================= */

.drop-zone{

    margin-top:12px;

    min-height:42px;

    padding:8px;

    display:flex;

    justify-content:center;

    align-items:center;

    border-radius:9px;

    background:#eeeeee;

    color:#777;

    font-size:15px;

    font-weight:bold;

    transition:.2s;
}

.drop-zone.over{

    background:#e3f2fd;

    border:2px solid #90caf9;
}

.drop-zone.filled{

    background:#fff3d6;

    color:#555;

    border:2px solid #d8ad50;
}

.drop-zone.correct{

    background:#4caf70;

    color:white;

    border:2px solid #4caf70;
}

.drop-zone.wrong{

    background:#ef5350;

    color:white;

    border:2px solid #ef5350;
}


/* =========================================================
   WORD AREA
========================================================= */

.words{

    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:12px;

    min-height:50px;

    padding-top:5px;
}

.word{

    background:#fff3d6;

    border:2px solid #d8ad50;

    padding:12px 20px;

    border-radius:10px;

    cursor:grab;

    font-size:17px;

    font-weight:bold;

    user-select:none;

    transition:.2s;
}

.word:hover{

    transform:translateY(-3px);

    background:#ffe8b5;
}

.word:active{

    cursor:grabbing;
}

.word.dragging{

    opacity:.5;
}

.word.used{

    opacity:.35;

    cursor:default;

    transform:none;
}


/* =========================================================
   CHECK AREA
========================================================= */

.check-area{

    margin-top:20px;
}

.check-btn{

    min-width:180px;
}


/* =========================================================
   MESSAGE
========================================================= */

.message{

    min-height:35px;

    margin:15px 0;

    font-size:18px;

    font-weight:bold;
}


/* =========================================================
   FINAL SCREEN
========================================================= */

#finalScreen{

    display:none;

    padding:20px 10px;
}

#finalScreen h2{

    margin:0 0 20px;

    color:#4779b8;

    font-size:32px;
}

.final-score{

    font-size:26px;

    font-weight:bold;

    margin:20px 0;
}

.final-message{

    font-size:21px;

    margin:15px 0 25px;

    color:#555;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    body{

        padding:15px;
    }

    .game-box{

        width:100%;

        padding:25px 18px;

        border-radius:20px;
    }

    .back-btn-container{

        width:100%;
    }

    #introScreen h1{

        font-size:28px;
    }

    .intro-description{

        font-size:16px;
    }

    .game-info{

        flex-direction:column;

        align-items:stretch;
    }

    .game-info div{

        width:100%;
    }

    .game-title{

        font-size:25px;
    }

    .instruction{

        font-size:15px;
    }

    .game-status{

        font-size:14px;
    }

    .score-text{

        font-size:16px;
    }

    .question{

        padding:18px 12px;
    }

    .question-title{

        font-size:18px;
    }

    .image-box{

        width:135px;

        padding:12px;
    }

    .image-box img{

        width:85px;

        height:85px;
    }

    .word{

        font-size:16px;

        padding:10px 16px;
    }

}

</style>

</head>


<body>


<!-- =========================================================
     BACK TO LOBBY
========================================================= -->

<div class="back-btn-container">

    <a
        href="../../../category.html?category=Food%20and%20Drinks"
        class="back-btn"
    >
        ⬅ Back 
    </a>

</div>


<!-- =========================================================
     GAME BOX
========================================================= -->

<div class="game-box">


    <!-- =====================================================
         INTRO SCREEN
    ====================================================== -->

    <div id="introScreen">

        <div class="game-icon">
            🍉
        </div>


        <h1>
            Match the Pictures with the Words
        </h1>


        <p class="intro-description">

            Match each Vietnamese food and drink
            word with the correct picture.

        </p>


        <div class="game-info">

            <div>

                📝

                <strong>
                    20 Questions
                </strong>

            </div>


            <div>

                🎯

                <strong>
                    Drag & Drop
                </strong>

            </div>

        </div>


        <button
            class="primary-btn"
            onclick="startGame()"
        >

            Start Game →

        </button>

    </div>



    <!-- =====================================================
         GAME SCREEN
    ====================================================== -->

    <div id="gameScreen">


        <h1 class="game-title">

            🍉 Match the Pictures with the Words

        </h1>


        <p class="instruction">

            Drag each Vietnamese word to
            the correct picture, then check your answers.

        </p>


        <div class="game-status">

            <div id="questionText">

                Question 1 / 20

            </div>


            <div class="score-text">

                Score:
                <span id="scoreText">
                    0
                </span>

            </div>

        </div>


        <div id="game"></div>


        <div
            class="message"
            id="message"
        >
        </div>


        <div class="check-area">

            <button
                id="checkButton"
                class="primary-btn check-btn"
                onclick="checkAnswers()"
            >

                Check Answers

            </button>

        </div>


    </div>



    <!-- =====================================================
         FINAL SCREEN
    ====================================================== -->

    <div id="finalScreen">


        <h2>

            🎉 Game Finished!

        </h2>


        <div
            class="final-score"
            id="finalScore"
        >
        </div>


        <div
            class="final-message"
            id="finalMessage"
        >
        </div>


        <button
            class="primary-btn"
            onclick="restartGame()"
        >

            Play Again

        </button>


    </div>


</div>



<script>

/* =========================================================
   IMAGE / VOCABULARY LIST
   Only words that have matching image files are used.
========================================================= */

const items = [

    {
        name:"bo",
        vi:"Bò"
    },

    {
        name:"ca",
        vi:"Cá"
    },

    {
        name:"cam",
        vi:"Cam"
    },

    {
        name:"caphe",
        vi:"Cà phê"
    },

    {
        name:"chanh",
        vi:"Chanh"
    },

    {
        name:"chuoi",
        vi:"Chuối"
    },

    {
        name:"com",
        vi:"Cơm"
    },

    {
        name:"dua",
        vi:"Dừa"
    },

    {
        name:"ga",
        vi:"Gà"
    },

    {
        name:"heo",
        vi:"Heo"
    },

    {
        name:"mi",
        vi:"Mì"
    },

    {
        name:"nuoccam",
        vi:"Nước cam"
    },

    {
        name:"nuocloc",
        vi:"Nước lọc"
    },

    {
        name:"rau",
        vi:"Rau"
    },

    {
        name:"tao",
        vi:"Táo"
    },

    {
        name:"xoai",
        vi:"Xoài"
    }

];


/* =========================================================
   GAME SETTINGS
========================================================= */

const TOTAL_QUESTIONS = 20;


/* =========================================================
   GAME STATE
========================================================= */

let currentQuestion = 0;

let score = 0;

let questionLocked = false;

let currentSelected = [];


/* =========================================================
   DOM
========================================================= */

const introScreen =
    document.getElementById("introScreen");

const gameScreen =
    document.getElementById("gameScreen");

const finalScreen =
    document.getElementById("finalScreen");

const game =
    document.getElementById("game");

const questionText =
    document.getElementById("questionText");

const scoreText =
    document.getElementById("scoreText");

const message =
    document.getElementById("message");

const checkButton =
    document.getElementById("checkButton");

const finalScore =
    document.getElementById("finalScore");

const finalMessage =
    document.getElementById("finalMessage");


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    const copy = [...array];

    for(
        let i = copy.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            copy[i],
            copy[j]
        ] =
        [
            copy[j],
            copy[i]
        ];

    }

    return copy;

}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    currentQuestion = 0;

    score = 0;

    questionLocked = false;

    currentSelected = [];


    introScreen.style.display =
        "none";

    finalScreen.style.display =
        "none";

    gameScreen.style.display =
        "block";


    updateStatus();

    loadQuestion();

}


/* =========================================================
   UPDATE STATUS
========================================================= */

function updateStatus(){

    questionText.textContent =
        `Question ${currentQuestion + 1} / ${TOTAL_QUESTIONS}`;


    scoreText.textContent =
        score;

}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion(){

    questionLocked = false;

    currentSelected = [];

    message.textContent = "";

    message.style.color = "";

    checkButton.disabled = false;

    checkButton.textContent =
        "Check Answers";


    game.innerHTML = "";


    /*
       Use 2 pictures for the first 15 questions.
       Use 4 pictures for the last 5 questions.
    */

    const numberOfItems =
        currentQuestion < 15
            ? 2
            : 4;


    currentSelected =
        shuffle(items).slice(
            0,
            numberOfItems
        );


    /* =====================================================
       QUESTION CARD
    ====================================================== */

    const question =
        document.createElement("div");

    question.className =
        "question";


    const title =
        document.createElement("h2");

    title.className =
        "question-title";

    title.textContent =
        "Match the words with the pictures";


    question.appendChild(title);


    /* =====================================================
       IMAGE AREA
    ====================================================== */

    const images =
        document.createElement("div");

    images.className =
        "images";


    currentSelected.forEach(item => {

        const imageBox =
            document.createElement("div");

        imageBox.className =
            "image-box";


        const img =
            document.createElement("img");

        img.src =
            `images/${item.name}.png`;

        img.alt =
            item.vi;


        img.onerror =
            function(){

                this.style.display =
                    "none";

            };


        /* =================================================
           DROP ZONE
        ================================================= */

        const dropZone =
            document.createElement("div");

        dropZone.className =
            "drop-zone";

        dropZone.textContent =
            "Drop word here";

        dropZone.dataset.answer =
            item.name;

        dropZone.dataset.selected =
            "";


        /* =================================================
           DRAG OVER
        ================================================= */

        dropZone.addEventListener(
            "dragover",
            event => {

                if(questionLocked){
                    return;
                }

                event.preventDefault();

                dropZone.classList.add(
                    "over"
                );

            }
        );


        /* =================================================
           DRAG LEAVE
        ================================================= */

        dropZone.addEventListener(
            "dragleave",
            () => {

                dropZone.classList.remove(
                    "over"
                );

            }
        );


        /* =================================================
           DROP
        ================================================= */

        dropZone.addEventListener(
            "drop",
            event => {

                event.preventDefault();

                dropZone.classList.remove(
                    "over"
                );


                if(questionLocked){
                    return;
                }


                const draggedName =
                    event.dataTransfer.getData(
                        "name"
                    );


                const draggedWord =
                    event.dataTransfer.getData(
                        "word"
                    );


                const draggedId =
                    event.dataTransfer.getData(
                        "id"
                    );


                const draggedElement =
                    document.getElementById(
                        draggedId
                    );


                /*
                   If this word is already placed
                   somewhere else, do nothing.
                */

                if(
                    draggedElement &&
                    draggedElement.classList.contains(
                        "used"
                    )
                ){

                    return;

                }


                /*
                   If this drop zone already has
                   a word, do nothing.
                */

                if(
                    dropZone.dataset.selected !== ""
                ){

                    return;

                }


                dropZone.dataset.selected =
                    draggedName;

                dropZone.textContent =
                    draggedWord;

                dropZone.classList.add(
                    "filled"
                );


                if(draggedElement){

                    draggedElement.classList.add(
                        "used"
                    );

                }

            }
        );


        imageBox.appendChild(img);

        imageBox.appendChild(dropZone);

        images.appendChild(imageBox);

    });


    /* =====================================================
       WORD AREA
    ====================================================== */

    const wordsContainer =
        document.createElement("div");

    wordsContainer.className =
        "words";


    shuffle(currentSelected).forEach(item => {

        const word =
            document.createElement("div");

        word.className =
            "word";

        word.textContent =
            item.vi;

        word.draggable =
            true;

        word.id =
            `word-${currentQuestion}-${item.name}`;


        /* =================================================
           DRAG START
        ================================================= */

        word.addEventListener(
            "dragstart",
            event => {

                if(
                    questionLocked ||
                    word.classList.contains("used")
                ){

                    event.preventDefault();

                    return;

                }


                event.dataTransfer.setData(
                    "name",
                    item.name
                );


                event.dataTransfer.setData(
                    "word",
                    item.vi
                );


                event.dataTransfer.setData(
                    "id",
                    word.id
                );


                word.classList.add(
                    "dragging"
                );

            }
        );


        /* =================================================
           DRAG END
        ================================================= */

        word.addEventListener(
            "dragend",
            () => {

                word.classList.remove(
                    "dragging"
                );

            }
        );


        wordsContainer.appendChild(word);

    });


    question.appendChild(
        images
    );


    question.appendChild(
        wordsContainer
    );


    game.appendChild(
        question
    );


    updateStatus();

}


/* =========================================================
   CHECK ANSWERS
========================================================= */

function checkAnswers(){

    if(questionLocked){
        return;
    }


    const zones =
        document.querySelectorAll(
            ".drop-zone"
        );


    /*
       Require every picture to have
       a word before checking.
    */

    const unanswered =
        [...zones].some(
            zone =>
                zone.dataset.selected === ""
        );


    if(unanswered){

        message.style.color =
            "#c58a2c";

        message.textContent =
            "⚠️ Match all pictures before checking.";

        return;

    }


    questionLocked = true;

    checkButton.disabled = true;


    let correctCount = 0;


    zones.forEach(zone => {

        const correctAnswer =
            zone.dataset.answer;

        const selectedAnswer =
            zone.dataset.selected;


        if(
            selectedAnswer ===
            correctAnswer
        ){

            zone.classList.remove(
                "filled"
            );

            zone.classList.add(
                "correct"
            );

            correctCount++;

        }

        else{

            zone.classList.remove(
                "filled"
            );

            zone.classList.add(
                "wrong"
            );


            /*
               Show the correct answer
               after checking.
            */

            const correctItem =
                currentSelected.find(
                    item =>
                        item.name ===
                        correctAnswer
                );


            if(correctItem){

                zone.textContent =
                    `✗ ${correctItem.vi}`;

            }

        }

    });


    /*
       One point per correctly matched picture.
       No points are removed for wrong matches.
    */

    score += correctCount;

    updateStatus();


    if(
        correctCount ===
        zones.length
    ){

        message.style.color =
            "#3b8b58";

        message.textContent =
            "🎉 Perfect!";

    }

    else{

        message.style.color =
            "#c54d4d";

        message.textContent =
            `${correctCount} / ${zones.length} correct.`;

    }


    /*
       Give the learner time to see
       the results before moving on.
    */

    setTimeout(
        nextQuestion,
        1200
    );

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion(){

    currentQuestion++;


    if(
        currentQuestion >=
        TOTAL_QUESTIONS
    ){

        finishGame();

        return;

    }


    loadQuestion();

}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

    gameScreen.style.display =
        "none";

    finalScreen.style.display =
        "block";


    /*
       Maximum score is 20 because
       each question is worth 1 point.
    */

    finalScore.textContent =
        `Final Score: ${score} / 20`;


    const percentage =
        Math.round(
            score / 20 * 100
        );


    let result;


    if(
        percentage >= 90
    ){

        result =
            "🏆 Excellent!";

    }

    else if(
        percentage >= 70
    ){

        result =
            "🎉 Great Job!";

    }

    else if(
        percentage >= 50
    ){

        result =
            "👍 Good Work!";

    }

    else{

        result =
            "📚 Keep Practicing!";

    }


    finalMessage.textContent =
        `${percentage}% — ${result}`;

}


/* =========================================================
   RESTART GAME
========================================================= */

function restartGame(){

    startGame();

}

</script>


</body>

</html>
