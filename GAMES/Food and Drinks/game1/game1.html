<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Match the Pictures with the Words</title>

<meta
    name="game-title"
    content="Match the Pictures with the Words"
>

<meta
    name="game-description"
    content="Match Vietnamese food and drink words with the correct pictures."
>

<meta
    name="game-icon"
    content="🍉"
>

<meta
    name="game-explanation"
    content="false"
>


<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    box-sizing:border-box;
}

body{

    margin:0;

    font-family:Arial, Helvetica, sans-serif;

    background:#f5f7fa;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    color:#333;
}


/* =========================================================
   GAME CONTAINER
========================================================= */

.game-box{

    width:100%;

    max-width:950px;

    background:white;

    border-radius:24px;

    padding:35px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.10);

    text-align:center;
}


/* =========================================================
   INTRO SCREEN
========================================================= */

#introScreen{

    padding:15px 10px 10px;
}

.game-icon{

    font-size:70px;

    margin-bottom:10px;
}

#introScreen h1{

    font-size:34px;

    margin:10px 0 15px;

    color:#2c3e50;
}

.intro-description{

    max-width:600px;

    margin:0 auto 25px;

    font-size:18px;

    line-height:1.6;

    color:#666;
}


/* =========================================================
   GAME INFO
========================================================= */

.game-info{

    display:flex;

    justify-content:center;

    gap:15px;

    flex-wrap:wrap;

    margin:25px 0;
}

.game-info div{

    background:#f4f8fb;

    border:1px solid #e1e8ee;

    border-radius:12px;

    padding:12px 18px;

    color:#555;

    font-size:16px;
}


/* =========================================================
   BUTTON
========================================================= */

button{

    border:none;

    border-radius:12px;

    cursor:pointer;

    font-weight:bold;

    transition:.2s;
}

#startBtn{

    margin-top:10px;

    padding:14px 35px;

    background:#2196f3;

    color:white;

    font-size:19px;
}

#startBtn:hover{

    background:#1976d2;

    transform:translateY(-2px);
}


/* =========================================================
   GAME HEADER
========================================================= */

#gameScreen h1{

    margin:0 0 10px;

    color:#2c3e50;

    font-size:30px;
}

.instruction{

    color:#666;

    font-size:17px;

    margin-bottom:25px;
}


/* =========================================================
   GAME INFO BAR
========================================================= */

.game-status{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:25px;

    padding:12px 16px;

    background:#f4f8fb;

    border-radius:12px;

    font-weight:bold;

    color:#555;
}


/* =========================================================
   QUESTION
========================================================= */

.question{

    background:#fafcff;

    border:1px solid #e3eaf2;

    border-radius:18px;

    padding:25px;

    margin-bottom:25px;
}

.question h2{

    margin:0 0 20px;

    font-size:20px;

    color:#444;
}


/* =========================================================
   IMAGES
========================================================= */

.images{

    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:20px;

    margin-bottom:25px;
}

.image-box{

    width:160px;

    padding:15px;

    border:2px dashed #cfd8e3;

    border-radius:14px;

    background:white;

    transition:.2s;
}

.image-box:hover{

    border-color:#90caf9;
}

.image-box img{

    width:100px;

    height:100px;

    object-fit:contain;
}


/* =========================================================
   DROP ZONE
========================================================= */

.drop-zone{

    margin-top:12px;

    min-height:40px;

    display:flex;

    justify-content:center;

    align-items:center;

    border-radius:9px;

    background:#eeeeee;

    color:#777;

    font-size:15px;

    font-weight:bold;

    transition:.2s;
}

.drop-zone.correct{

    background:#4caf70;

    color:white;
}

.drop-zone.wrong{

    background:#ef5350;

    color:white;

    animation:shake .3s;
}

@keyframes shake{

    25%{
        transform:translateX(-6px);
    }

    75%{
        transform:translateX(6px);
    }

}


/* =========================================================
   WORDS
========================================================= */

.words{

    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:12px;

    min-height:45px;
}

.word{

    background:#e3f2fd;

    border:2px solid #90caf9;

    padding:12px 20px;

    border-radius:10px;

    cursor:grab;

    font-size:17px;

    font-weight:bold;

    user-select:none;

    transition:.2s;
}

.word:hover{

    transform:translateY(-3px);

    background:#d4ebff;
}

.word:active{

    cursor:grabbing;
}


/* =========================================================
   FINAL SCREEN
========================================================= */

#finalScreen{

    display:none;

    padding:20px;
}

#finalScreen h2{

    font-size:32px;

    color:#2c3e50;

    margin-bottom:15px;
}

.final-score{

    font-size:26px;

    font-weight:bold;

    margin:20px 0;

    color:#444;
}

.final-message{

    font-size:20px;

    color:#666;

    margin-bottom:25px;
}

.restart-btn{

    padding:14px 30px;

    background:#2196f3;

    color:white;

    font-size:18px;
}

.restart-btn:hover{

    background:#1976d2;

    transform:translateY(-2px);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    body{

        padding:15px;
    }

    .game-box{

        padding:25px 15px;

        border-radius:20px;
    }

    #introScreen h1{

        font-size:28px;
    }

    .intro-description{

        font-size:16px;
    }

    .game-status{

        font-size:14px;
    }

    #gameScreen h1{

        font-size:25px;
    }

    .instruction{

        font-size:15px;
    }

    .question{

        padding:18px;
    }

    .image-box{

        width:135px;

        padding:12px;
    }

    .image-box img{

        width:85px;

        height:85px;
    }

    .word{

        font-size:16px;

        padding:10px 16px;
    }

}

</style>

</head>


<body>


<div class="game-box">


<!-- =======================================================
     INTRO SCREEN
======================================================= -->

<div id="introScreen">

    <div class="game-icon">
        🍉
    </div>

    <h1>
        Match the Pictures with the Words
    </h1>

    <p class="intro-description">

        Match each Vietnamese word with
        the correct picture.

    </p>


    <div class="game-info">

        <div>
            📝
            <strong>20 Questions</strong>
        </div>

        <div>
            🎯
            <strong>Drag & Drop</strong>
        </div>

    </div>


    <button
        id="startBtn"
        onclick="startGame()"
    >

        Start Game →

    </button>

</div>



<!-- =======================================================
     GAME SCREEN
======================================================= -->

<div
    id="gameScreen"
    style="display:none;"
>

    <h1>
        🍉 Match the Pictures with the Words
    </h1>

    <p class="instruction">

        Drag each Vietnamese word to the correct picture.

    </p>


    <div class="game-status">

        <div id="questionText">
            Question 1 / 20
        </div>

        <div id="scoreText">
            Score: 0
        </div>

    </div>


    <div id="game"></div>

</div>



<!-- =======================================================
     FINAL SCREEN
======================================================= -->

<div id="finalScreen">

    <h2>
        🎉 Great Job!
    </h2>

    <div
        class="final-score"
        id="finalScore"
    >
    </div>

    <div
        class="final-message"
        id="finalMessage"
    >
    </div>

    <button
        class="restart-btn"
        onclick="restartGame()"
    >

        Play Again

    </button>

</div>


</div>



<script>


/* =========================================================
   VOCABULARY
========================================================= */

const items = [

    {
        name:"bo",
        vi:"Bò"
    },

    {
        name:"ca",
        vi:"Cá"
    },

    {
        name:"cam",
        vi:"Cam"
    },

    {
        name:"caphe",
        vi:"Cà phê"
    },

    {
        name:"chai",
        vi:"Chai"
    },

    {
        name:"chanh",
        vi:"Chanh"
    },

    {
        name:"chuoi",
        vi:"Chuối"
    },

    {
        name:"com",
        vi:"Cơm"
    },

    {
        name:"dia",
        vi:"Dĩa"
    },

    {
        name:"dua",
        vi:"Dừa"
    },

    {
        name:"ga",
        vi:"Gà"
    },

    {
        name:"heo",
        vi:"Heo"
    },

    {
        name:"ly",
        vi:"Ly"
    },

    {
        name:"mi",
        vi:"Mì"
    },

    {
        name:"nuoccam",
        vi:"Nước cam"
    },

    {
        name:"nuocloc",
        vi:"Nước lọc"
    },

    {
        name:"nuocmia",
        vi:"Nước mía"
    },

    {
        name:"nuocngot",
        vi:"Nước ngọt"
    },

    {
        name:"rau",
        vi:"Rau"
    },

    {
        name:"tao",
        vi:"Táo"
    },

    {
        name:"to",
        vi:"Tô"
    },

    {
        name:"xoai",
        vi:"Xoài"
    }

];


/* =========================================================
   GAME SETTINGS
========================================================= */

const TOTAL_QUESTIONS = 20;

let currentQuestion = 0;

let score = 0;

let draggedWord = null;


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    const copy = [...array];

    for(
        let i = copy.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            copy[i],
            copy[j]
        ] =
        [
            copy[j],
            copy[i]
        ];

    }

    return copy;

}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    currentQuestion = 0;

    score = 0;

    document.getElementById(
        "introScreen"
    ).style.display = "none";

    document.getElementById(
        "finalScreen"
    ).style.display = "none";

    document.getElementById(
        "gameScreen"
    ).style.display = "block";

    updateStatus();

    loadQuestion();

}


/* =========================================================
   UPDATE STATUS
========================================================= */

function updateStatus(){

    document.getElementById(
        "questionText"
    ).textContent =
        `Question ${currentQuestion + 1} / ${TOTAL_QUESTIONS}`;

    document.getElementById(
        "scoreText"
    ).textContent =
        `Score: ${score}`;

}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion(){

    draggedWord = null;

    const game =
        document.getElementById("game");

    game.innerHTML = "";


    const question =
        document.createElement("div");

    question.className =
        "question";


    question.innerHTML =
        `<h2>Match the words with the pictures</h2>`;


    /* =====================================================
       SELECT ITEMS
    ===================================================== */

    let selected;

    let words;


    /*
       Questions 1–15:
       2 pictures + 2 words
    */

    if(currentQuestion < 15){

        selected =
            shuffle(items).slice(0,2);

        words =
            [...selected];

    }


    /*
       Questions 16–20:
       4 pictures + 5 words
    */

    else{

        selected =
            shuffle(items).slice(0,4);

        const extra =
            items.find(
                item =>
                    !selected.includes(item)
            );

        words =
            [
                ...selected,
                extra
            ];

    }


    /* =====================================================
       IMAGE AREA
    ===================================================== */

    const imagesDiv =
        document.createElement("div");

    imagesDiv.className =
        "images";


    selected.forEach(item => {

        const box =
            document.createElement("div");

        box.className =
            "image-box";


        const img =
            document.createElement("img");

        img.src =
            `images/${item.name}.png`;

        img.alt =
            item.vi;


        const zone =
            document.createElement("div");

        zone.className =
            "drop-zone";

        zone.textContent =
            "Drop word here";


        /* =================================================
           DRAG OVER
        ================================================= */

        zone.addEventListener(
            "dragover",
            e => {

                e.preventDefault();

            }
        );


        /* =================================================
           DROP
        ================================================= */

        zone.addEventListener(
            "drop",
            e => {

                e.preventDefault();


                if(
                    zone.classList.contains(
                        "correct"
                    )
                ){

                    return;

                }


                const draggedName =
                    e.dataTransfer.getData(
                        "name"
                    );

                const draggedText =
                    e.dataTransfer.getData(
                        "word"
                    );

                const draggedId =
                    e.dataTransfer.getData(
                        "id"
                    );


                /* =========================================
                   CORRECT
                ========================================= */

                if(
                    draggedName ===
                    item.name
                ){

                    zone.textContent =
                        draggedText;

                    zone.classList.add(
                        "correct"
                    );


                    const draggedElement =
                        document.getElementById(
                            draggedId
                        );


                    if(draggedElement){

                        draggedElement.remove();

                    }


                    score++;

                    updateStatus();


                    checkQuestionComplete();

                }


                /* =========================================
                   WRONG
                ========================================= */

                else{

                    zone.classList.add(
                        "wrong"
                    );


                    zone.textContent =
                        "Try again!";


                    setTimeout(
                        () => {

                            if(
                                !zone.classList.contains(
                                    "correct"
                                )
                            ){

                                zone.classList.remove(
                                    "wrong"
                                );

                                zone.textContent =
                                    "Drop word here";

                            }

                        },
                        700
                    );

                }

            }
        );


        box.appendChild(img);

        box.appendChild(zone);

        imagesDiv.appendChild(box);

    });


    /* =====================================================
       WORD AREA
    ===================================================== */

    const wordsDiv =
        document.createElement("div");

    wordsDiv.className =
        "words";


    shuffle(words).forEach(item => {

        const word =
            document.createElement("div");

        word.className =
            "word";

        word.textContent =
            item.vi;

        word.draggable =
            true;


        word.id =
            `word-${currentQuestion}-${item.name}-${Math.random()}`;


        /* =================================================
           DRAG START
        ================================================= */

        word.addEventListener(
            "dragstart",
            e => {

                draggedWord =
                    word;

                e.dataTransfer.setData(
                    "name",
                    item.name
                );

                e.dataTransfer.setData(
                    "word",
                    item.vi
                );

                e.dataTransfer.setData(
                    "id",
                    word.id
                );

            }
        );


        wordsDiv.appendChild(word);

    });


    question.appendChild(
        imagesDiv
    );

    question.appendChild(
        wordsDiv
    );


    game.appendChild(
        question
    );


    updateStatus();

}


/* =========================================================
   CHECK QUESTION
========================================================= */

function checkQuestionComplete(){

    const zones =
        document.querySelectorAll(
            ".drop-zone"
        );


    const completed =
        [...zones].every(
            zone =>
                zone.classList.contains(
                    "correct"
                )
        );


    if(completed){

        setTimeout(
            nextQuestion,
            700
        );

    }

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion(){

    currentQuestion++;


    if(
        currentQuestion >=
        TOTAL_QUESTIONS
    ){

        finishGame();

        return;

    }


    loadQuestion();

}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

    document.getElementById(
        "gameScreen"
    ).style.display = "none";


    document.getElementById(
        "finalScreen"
    ).style.display = "block";


    document.getElementById(
        "finalScore"
    ).textContent =
        `Final Score: ${score}`;


    const percentage =
        Math.round(
            score /
            TOTAL_QUESTIONS *
            100
        );


    let message;


    if(percentage >= 90){

        message =
            "🏆 Excellent!";

    }

    else if(percentage >= 70){

        message =
            "🎉 Great Job!";

    }

    else if(percentage >= 50){

        message =
            "👍 Good Work!";

    }

    else{

        message =
            "📚 Keep Practicing!";

    }


    document.getElementById(
        "finalMessage"
    ).textContent =
        `${percentage}% — ${message}`;

}


/* =========================================================
   RESTART
========================================================= */

function restartGame(){

    startGame();

}

</script>

</body>

</html>
