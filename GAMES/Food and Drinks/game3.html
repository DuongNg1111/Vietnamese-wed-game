<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="game-title" content="Vietnamese Food & Drinks Matching">
<meta name="game-description" content="Match common Vietnamese food and drink words with their English meanings.">
<meta name="game-icon" content="🍜">

<title>Vietnamese Food & Drinks Matching</title>


<style>

    body{
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #74ebd5, #ACB6E5);
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
        margin:0;
    }

    .game-box{
        background:white;
        width:90%;
        max-width:750px;
        padding:35px;
        border-radius:20px;
        box-shadow:0 10px 25px rgba(0,0,0,0.2);
        text-align:center;
    }

    h1{
        color:#333;
    }

    h2{
        color:#444;
    }

    p{
        font-size:18px;
        color:#555;
        line-height:1.6;
    }

    .question{
        font-size:30px;
        margin:25px 0;
        color:#222;
        font-weight:bold;
    }

    .options{
        display:grid;
        grid-template-columns:1fr 1fr 1fr;
        gap:15px;
        margin-top:20px;
    }

    button{
        padding:15px;
        border:none;
        border-radius:12px;
        font-size:18px;
        cursor:pointer;
        transition:0.3s;
    }

    .option-btn{
        background:#3498db;
        color:white;
    }

    .option-btn:hover{
        background:#2980b9;
    }

    .correct{
        background:green !important;
    }

    .wrong{
        background:red !important;
    }

    #message{
        margin-top:20px;
        font-size:22px;
        font-weight:bold;
        min-height:35px;
    }

    #nextBtn,
    #startBtn{
        margin-top:25px;
        padding:14px 35px;
        font-size:20px;
        border:none;
        border-radius:12px;
        background:#2ecc71;
        color:white;
        cursor:pointer;
    }

    #nextBtn:hover,
    #startBtn:hover{
        background:#27ae60;
    }

    #nextBtn{
        display:none;
    }

    #score{
        margin-top:20px;
        font-size:20px;
        color:#444;
    }

</style>
</head>

<body>

<div class="game-box" id="gameBox">

    <!-- INTRO SCREEN -->
    <div id="introScreen">

        <h1>🎮 Vietnamese - English Matching Game</h1>

        <p>
            Welcome to the vocabulary matching game!
        </p>

        <p>
	    📚 Match the Vietnamese word with the correct English meaning!
        </p>

        <p>
            📝 Total Questions: <b>20</b>
        </p>

        <button id="startBtn">Start Game</button>

    </div>

    <!-- GAME SCREEN -->
    <div id="gameScreen" style="display:none;">

        <h1>🎮 Matching Game</h1>

        <div class="question" id="question"></div>

        <div class="options" id="options"></div>

        <div id="message"></div>

        <button id="nextBtn">Next</button>

        <div id="score"></div>

    </div>

</div>

<script>

const originalQuestions = [

    {vn:"chai", en:"bottle"},
    {vn:"ly", en:"glass/cup"},
    {vn:"tô", en:"bowl"},
    {vn:"dĩa", en:"plate"},
    {vn:"nước lọc", en:"water"},
    {vn:"nước ngọt", en:"soda"},
    {vn:"trà", en:"tea"},
    {vn:"cà phê", en:"coffee"},
    {vn:"nước cam", en:"orange juice"},
    {vn:"nước chanh", en:"lemonade"},
    {vn:"mì", en:"noodles"},
    {vn:"gà", en:"chicken"},
    {vn:"bò", en:"beef"},
    {vn:"heo", en:"pork"},
    {vn:"rau", en:"vegetables"},
    {vn:"trứng", en:"egg"},
    {vn:"cá", en:"fish"}

];

const questions = [];

for(let i = 0; i < 20; i++){

    const randomQuestion =
        originalQuestions[
            Math.floor(Math.random() * originalQuestions.length)
        ];

    questions.push(randomQuestion);
}

let current = 0;
let score = 0;

function shuffle(array){
    return array.sort(() => Math.random() - 0.5);
}

document.getElementById("startBtn").onclick = function(){

    document.getElementById("introScreen").style.display = "none";
    document.getElementById("gameScreen").style.display = "block";

    loadQuestion();
};

function loadQuestion(){

    const q = questions[current];

    document.getElementById("question").innerHTML =
        `Question ${current + 1}: What is the meaning of "<span style="color:#e74c3c">${q.vn}</span>"?`;

    document.getElementById("message").innerHTML = "";
    document.getElementById("nextBtn").style.display = "none";

    let options = [q.en];

    while(options.length < 3){

        let random =
            questions[Math.floor(Math.random()*questions.length)].en;

        if(!options.includes(random)){
            options.push(random);
        }
    }

    options = shuffle(options);

    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    options.forEach(option => {

        const btn = document.createElement("button");

        btn.className = "option-btn";
        btn.innerText = option;

        btn.onclick = function(){

            if(option === q.en){

                btn.classList.add("correct");

                document.getElementById("message").innerHTML =
                    "✅ Tốt lắm! Well done!";

                score++;

                disableButtons();

                document.getElementById("nextBtn").style.display =
                    "inline-block";

            }else{

                btn.classList.add("wrong");

                document.getElementById("message").innerHTML =
                    "❌ Incorrect! Please choose again!";

                setTimeout(()=>{
                    btn.classList.remove("wrong");
                },500);
            }

            updateScore();
        };

        optionsDiv.appendChild(btn);
    });

    updateScore();
}

function disableButtons(){

    const buttons =
        document.querySelectorAll(".option-btn");

    buttons.forEach(btn=>{
        btn.disabled = true;
    });
}

function updateScore(){

    document.getElementById("score").innerHTML =
        `Score: ${score} / ${questions.length}`;
}

document.getElementById("nextBtn").onclick = function(){

    current++;

    if(current >= questions.length){

        document.getElementById("gameBox").innerHTML = `

            <h1>🎉 Congratulations Sean!</h1>

            <h2>You finished the game!</h2>

            <p>
                Final Score: <b>${score} / ${questions.length}</b>
            </p>

            <p>🌟 Excellent Job! 🌟</p>

        `;

    }else{
        loadQuestion();
    }
};

</script>

</body>
</html>
