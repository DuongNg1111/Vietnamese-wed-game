<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fast Choice - Vietnamese Vocabulary</title>

<meta name="game-title" content="Fast Choice">
<meta name="game-description" content="Choose the correct Vietnamese description for each picture.">
<meta name="game-icon" content="⚡">

<style>

/* =========================================================
   GENERAL
========================================================= */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    color:#333;
}


/* =========================================================
   BACK TO LOBBY
========================================================= */

.back-btn-container{
    max-width:850px;
    margin:0 auto 20px;
}

.back-btn{
    display:inline-block;
    padding:10px 18px;

    background:white;
    color:#555;

    border:2px solid #ddd;
    border-radius:10px;

    text-decoration:none;
    font-weight:bold;

    transition:.2s;
}

.back-btn:hover{
    background:#f0f0f0;
    transform:translateY(-2px);
}


/* =========================================================
   GAME CONTAINER
========================================================= */

.game-box{
    background:white;

    width:100%;
    max-width:850px;

    margin:auto;
    padding:35px;

    border-radius:20px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.1);

    text-align:center;
}


/* =========================================================
   INTRO / HOW TO PLAY
========================================================= */

#introScreen h1{
    font-size:34px;
    margin-bottom:20px;
}

#introScreen h2{
    font-size:24px;
    margin-bottom:15px;
}

#introScreen p{
    font-size:18px;
    color:#555;
    line-height:1.6;
}

.instructions{
    max-width:650px;
    margin:25px auto;

    padding:20px;

    background:#f5f9ff;

    border-radius:15px;

    text-align:left;
}

.instructions p{
    margin:10px 0;
}


/* =========================================================
   BUTTONS
========================================================= */

button{
    border:none;
    border-radius:12px;

    cursor:pointer;

    font-weight:bold;

    transition:.2s;
}

.start-btn{
    margin-top:20px;

    padding:14px 35px;

    font-size:20px;

    background:#2196f3;
    color:white;
}

.start-btn:hover{
    background:#1976d2;
    transform:scale(1.03);
}

.next-btn{
    margin-top:25px;

    padding:12px 30px;

    font-size:18px;

    background:#2196f3;
    color:white;
}

.next-btn:hover{
    background:#1976d2;
}


/* =========================================================
   GAME SCREEN
========================================================= */

#gameScreen{
    display:none;
}

.game-title{
    font-size:30px;
    margin-bottom:15px;
}

.info{
    font-size:19px;
    font-weight:bold;

    margin:20px 0;

    color:#555;
}


/* =========================================================
   PROGRESS
========================================================= */

.progress-container{
    width:100%;
    height:12px;

    background:#e0e0e0;

    border-radius:20px;

    overflow:hidden;

    margin-bottom:25px;
}

.progress-bar{
    height:100%;
    width:0%;

    background:#2196f3;

    transition:.3s;
}


/* =========================================================
   PICTURE
========================================================= */

#emoji{
    font-size:150px;

    margin:25px 0;
}


/* =========================================================
   OPTIONS
========================================================= */

.options{
    max-width:650px;
    margin:auto;
}

.option{
    display:block;

    width:100%;

    margin:15px auto;

    padding:18px;

    font-size:22px;

    background:#2196f3;
    color:white;
}

.option:hover{
    background:#1976d2;
    transform:scale(1.02);
}

.option:disabled{
    cursor:default;
    opacity:.95;
}

.option.correct{
    background:#4caf50 !important;
}

.option.wrong{
    background:#f44336 !important;
}


/* =========================================================
   MESSAGE
========================================================= */

#message{
    min-height:40px;

    margin-top:20px;

    font-size:23px;
    font-weight:bold;
}


/* =========================================================
   RESULT
========================================================= */

#result{
    display:none;

    padding:25px;

    font-size:24px;
    line-height:1.6;
}

.final-score{
    font-size:30px;
    font-weight:bold;

    margin:20px 0;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    body{
        padding:15px;
    }

    .game-box{
        padding:25px 20px;
    }

    #introScreen h1{
        font-size:28px;
    }

    .game-title{
        font-size:25px;
    }

    #emoji{
        font-size:110px;
    }

    .option{
        font-size:18px;
        padding:15px;
    }

    .info{
        font-size:17px;
    }

}

</style>

</head>


<body>


<!-- =========================================================
     BACK TO LOBBY
========================================================= -->

<div class="back-btn-container">

    <a
        href="../../../index.html"
        class="back-btn"
    >
        ⬅ Back to Lobby
    </a>

</div>


<!-- =========================================================
     GAME BOX
========================================================= -->

<div class="game-box">


<!-- =========================================================
     HOW TO PLAY
========================================================= -->

<div id="introScreen">

    <h1>
        ⚡ Fast Choice
    </h1>

    <h2>
        How to Play
    </h2>

    <div class="instructions">

        <p>
            🍌 Look at the picture.
        </p>

        <p>
            🎯 Choose the correct Vietnamese description.
        </p>

        <p>
            ✅ Choose carefully — each question has only one correct answer.
        </p>

        <p>
            📝 15 questions in total.
        </p>

    </div>

    <button
        class="start-btn"
        id="startBtn"
    >
        Start Game
    </button>

</div>


<!-- =========================================================
     GAME SCREEN
========================================================= -->

<div id="gameScreen">

    <h1 class="game-title">
        ⚡ Fast Choice
    </h1>


    <div class="info">

        Question
        <span id="question">1</span>
        / 15

        &nbsp; | &nbsp;

        Score
        <span id="score">0</span>

    </div>


    <div class="progress-container">

        <div
            class="progress-bar"
            id="progressBar"
        ></div>

    </div>


    <div id="emoji"></div>


    <div
        class="options"
        id="options"
    ></div>


    <div id="message"></div>


    <button
        class="next-btn"
        id="nextBtn"
        style="display:none;"
    >
        Next Question ➜
    </button>


    <div id="result"></div>

</div>


</div>


<script>


/* =========================================================
   GAME DATA
========================================================= */

const items = [

    {
        emoji:"🍌",
        answer:"trái chuối màu vàng",
        wrong:[
            "trái táo màu đỏ",
            "trái cam màu cam"
        ]
    },

    {
        emoji:"🥑",
        answer:"trái bơ màu xanh lá",
        wrong:[
            "trái dừa màu trắng",
            "trái chanh màu vàng"
        ]
    },

    {
        emoji:"🍎",
        answer:"trái táo màu đỏ",
        wrong:[
            "trái chuối màu vàng",
            "trái bơ màu xanh lá"
        ]
    },

    {
        emoji:"🥥",
        answer:"trái dừa màu trắng",
        wrong:[
            "trái cam màu cam",
            "trái táo màu đỏ"
        ]
    },

    {
        emoji:"🍋",
        answer:"trái chanh màu vàng",
        wrong:[
            "trái chuối màu vàng",
            "trái dừa màu trắng"
        ]
    },

    {
        emoji:"🍊",
        answer:"trái cam màu cam",
        wrong:[
            "trái chanh màu vàng",
            "trái bơ màu xanh lá"
        ]
    },

    {
        emoji:"🍉",
        answer:"trái dưa hấu màu xanh",
        wrong:[
            "trái táo màu đỏ",
            "trái cam màu cam"
        ]
    },

    {
        emoji:"🥕",
        answer:"củ cà rốt màu cam",
        wrong:[
            "trái chanh màu vàng",
            "trái bơ màu xanh lá"
        ]
    },

    {
        emoji:"🍅",
        answer:"quả cà chua màu đỏ",
        wrong:[
            "trái chuối màu vàng",
            "trái dừa màu trắng"
        ]
    },

    {
        emoji:"🥒",
        answer:"quả dưa leo màu xanh",
        wrong:[
            "quả cà chua màu đỏ",
            "trái cam màu cam"
        ]
    },

    {
        emoji:"🍓",
        answer:"quả dâu màu đỏ",
        wrong:[
            "trái chanh màu vàng",
            "trái bơ màu xanh lá"
        ]
    },

    {
        emoji:"🥭",
        answer:"trái xoài màu vàng",
        wrong:[
            "trái táo màu đỏ",
            "trái dưa hấu màu xanh"
        ]
    },

    {
        emoji:"🍍",
        answer:"trái thơm màu vàng",
        wrong:[
            "trái dừa màu trắng",
            "trái chuối màu vàng"
        ]
    },

    {
        emoji:"🍇",
        answer:"chùm nho màu tím",
        wrong:[
            "trái cam màu cam",
            "trái táo màu đỏ"
        ]
    },

    {
        emoji:"🥝",
        answer:"trái kiwi màu xanh",
        wrong:[
            "trái dâu màu đỏ",
            "trái xoài màu vàng"
        ]
    }

];


/* =========================================================
   GAME STATE
========================================================= */

const TOTAL_QUESTIONS = 15;

let question = 0;

let score = 0;

let currentItem = null;


/* =========================================================
   DOM
========================================================= */

const introScreen =
    document.getElementById("introScreen");

const gameScreen =
    document.getElementById("gameScreen");

const startBtn =
    document.getElementById("startBtn");

const nextBtn =
    document.getElementById("nextBtn");

const questionEl =
    document.getElementById("question");

const scoreEl =
    document.getElementById("score");

const emojiEl =
    document.getElementById("emoji");

const optionsEl =
    document.getElementById("options");

const messageEl =
    document.getElementById("message");

const resultEl =
    document.getElementById("result");

const progressBar =
    document.getElementById("progressBar");


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    return [...array].sort(
        () => Math.random() - 0.5
    );

}


/* =========================================================
   START GAME
========================================================= */

startBtn.onclick = function(){

    question = 0;

    score = 0;

    scoreEl.textContent = "0";

    introScreen.style.display = "none";

    gameScreen.style.display = "block";

    resultEl.style.display = "none";

    nextQuestion();

};


/* =========================================================
   LOAD NEXT QUESTION
========================================================= */

function nextQuestion(){

    if(question >= TOTAL_QUESTIONS){

        finishGame();

        return;

    }


    question++;


    questionEl.textContent =
        question;


    messageEl.textContent =
        "";


    messageEl.style.color =
        "";


    nextBtn.style.display =
        "none";


    currentItem =
        items[question - 1];


    emojiEl.style.display =
        "block";


    emojiEl.textContent =
        currentItem.emoji;


    progressBar.style.width =
        `${(question / TOTAL_QUESTIONS) * 100}%`;


    /* =====================================
       CREATE ANSWERS
    ===================================== */

    const choices = shuffle([

        currentItem.answer,

        ...currentItem.wrong

    ]);


    optionsEl.innerHTML = "";


    choices.forEach((choice,index) => {

        const button =
            document.createElement("button");


        button.className =
            "option";


        button.textContent =
            `${String.fromCharCode(65 + index)}. ${choice}`;


        button.onclick = function(){

            checkAnswer(
                button,
                choice
            );

        };


        optionsEl.appendChild(button);

    });

}


/* =========================================================
   CHECK ANSWER
========================================================= */

function checkAnswer(
    selectedButton,
    choice
){

    const buttons =
        document.querySelectorAll(".option");


    buttons.forEach(button => {

        button.disabled = true;

    });


    if(choice === currentItem.answer){

        selectedButton.classList.add(
            "correct"
        );


        score++;


        scoreEl.textContent =
            score;


        messageEl.style.color =
            "#2e7d32";


        messageEl.textContent =
            "✅ Correct!";


    }

    else{

        selectedButton.classList.add(
            "wrong"
        );


        buttons.forEach(button => {

            if(
                button.textContent
                .includes(currentItem.answer)
            ){

                button.classList.add(
                    "correct"
                );

            }

        });


        messageEl.style.color =
            "#c62828";


        messageEl.textContent =
            `❌ Correct answer: ${currentItem.answer}`;

    }


    nextBtn.style.display =
        "inline-block";

}


/* =========================================================
   NEXT BUTTON
========================================================= */

nextBtn.onclick = function(){

    nextQuestion();

};


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

    emojiEl.style.display =
        "none";

    optionsEl.innerHTML =
        "";

    messageEl.innerHTML =
        "";

    nextBtn.style.display =
        "none";

    progressBar.style.width =
        "100%";


    const percentage =
        Math.round(
            score / TOTAL_QUESTIONS * 100
        );


    let performance;


    if(percentage >= 90){

        performance =
            "🏆 Excellent!";

    }

    else if(percentage >= 70){

        performance =
            "🎉 Great Job!";

    }

    else if(percentage >= 50){

        performance =
            "👍 Good Work!";

    }

    else{

        performance =
            "📚 Keep Practicing!";

    }


    resultEl.innerHTML = `

        <div class="final-score">
            🎉 Game Finished!
        </div>

        <div>
            Final Score:
            <strong>
                ${score} / ${TOTAL_QUESTIONS}
            </strong>
        </div>

        <div>
            ${percentage}%
        </div>

        <div style="margin-top:15px;">
            ${performance}
        </div>

        <button
            class="start-btn"
            onclick="restartGame()"
        >
            Play Again
        </button>

    `;


    resultEl.style.display =
        "block";

}


/* =========================================================
   RESTART
========================================================= */

function restartGame(){

    question = 0;

    score = 0;

    scoreEl.textContent =
        "0";

    resultEl.innerHTML =
        "";

    resultEl.style.display =
        "none";

    emojiEl.style.display =
        "block";

    gameScreen.style.display =
        "block";

    nextQuestion();

}

</script>

</body>
</html>
