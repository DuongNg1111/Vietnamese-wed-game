<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily Activities Challenge</title>

<meta name="game-title" content="Daily Activities Challenge">
<meta name="game-description" content="Build Vietnamese sentences by arranging words in the correct order.">
<meta name="game-icon" content="🎯">

<style>

:root{
    --primary:#4779b8;
    --primary-dark:#365f91;
    --accent:#fff1c9;
    --accent-border:#d6a33c;

    --success:#2d9b57;
    --error:#d95353;

    --background:#eef4ff;
    --card:#ffffff;

    --text:#26354a;
    --muted:#7b8798;

    --shadow:0 10px 35px rgba(60,80,110,.18);
    --radius:24px;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    font-family:Arial, Helvetica, sans-serif;

    background:
        linear-gradient(135deg,#eef4ff,#fff8e8);

    color:var(--text);

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:70px 20px 30px;
}


/* =========================================================
   BACK TO LOBBY
========================================================= */

.back-lobby{
    position:fixed;

    top:22px;
    left:24px;

    display:inline-flex;
    align-items:center;
    gap:7px;

    padding:9px 15px;

    background:white;

    color:var(--primary);

    text-decoration:none;

    font-size:14px;
    font-weight:700;

    border-radius:10px;

    box-shadow:0 3px 12px rgba(0,0,0,.08);

    transition:.2s;

    z-index:100;
}

.back-lobby:hover{
    transform:translateX(-2px);
    background:#f5f8fc;
}


/* =========================================================
   GAME CONTAINER
========================================================= */

.game{
    width:760px;
    max-width:94%;

    background:var(--card);

    padding:30px;

    border-radius:var(--radius);

    box-shadow:var(--shadow);

    text-align:center;
}


/* =========================================================
   START SCREEN
========================================================= */

.start-screen{
    padding:10px 5px 5px;
}

.start-icon{
    font-size:60px;
    margin-bottom:10px;
}

.start-screen h1{
    font-size:32px;
    margin:8px 0 10px;
}

.start-screen p{
    color:#667085;
    font-size:17px;

    margin:0 0 20px;
}

.how-to-play{
    background:#f7f9fc;

    border:1px solid #e7ebf1;

    border-radius:15px;

    padding:16px 20px;

    margin:20px 0 25px;

    text-align:left;

    line-height:1.6;

    font-size:15px;
}

.how-to-play-title{
    font-weight:800;
    color:var(--text);

    margin-bottom:4px;
}

.how-to-play p{
    margin:0;

    font-size:15px;

    color:#667085;
}

.goal{
    margin-top:7px;

    font-weight:700;

    color:var(--primary);
}

.start-btn{
    border:none;

    background:var(--primary);

    color:white;

    padding:14px 32px;

    border-radius:12px;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.start-btn:hover{
    background:var(--primary-dark);

    transform:translateY(-2px);
}

.start-btn:active{
    transform:translateY(0);
}


/* =========================================================
   HEADER
========================================================= */

.header{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    margin-bottom:18px;
}

.title{
    font-size:26px;

    font-weight:800;
}

.target{
    background:#fff4cf;

    color:#9a6b00;

    padding:8px 14px;

    border-radius:20px;

    font-size:14px;

    font-weight:bold;

    white-space:nowrap;
}


/* =========================================================
   STATS
========================================================= */

.stats{
    display:flex;

    justify-content:center;

    gap:12px;

    flex-wrap:wrap;

    margin-bottom:20px;
}

.stat{
    padding:9px 17px;

    border-radius:13px;

    font-weight:bold;

    font-size:15px;
}

.time{
    background:#eaf4ff;
    color:#2868a8;
}

.score{
    background:#fff5d9;
    color:#a06a00;
}

.streak{
    background:#fff0f0;
    color:#d34b4b;
}


/* =========================================================
   PROGRESS
========================================================= */

.progress-container{
    height:8px;

    background:#edf1f6;

    border-radius:10px;

    overflow:hidden;

    margin-bottom:25px;
}

.progress{
    height:100%;

    width:0%;

    background:var(--primary);

    transition:.3s;
}


/* =========================================================
   QUESTION
========================================================= */

.round{
    font-size:15px;

    color:var(--muted);

    margin-bottom:10px;
}

.english{
    font-size:23px;

    font-weight:bold;

    margin:15px 0 25px;

    line-height:1.4;
}


/* =========================================================
   ANSWER AREA
========================================================= */

.answer{
    min-height:72px;

    border:3px dashed #89a9d6;

    border-radius:18px;

    padding:12px;

    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    align-items:center;

    gap:10px;

    margin-bottom:22px;

    background:#fbfdff;
}

.answer.empty::before{
    content:"Click the words to build the sentence";

    color:#aab4c3;

    font-size:15px;
}


/* =========================================================
   WORD BANK
========================================================= */

.words{
    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:10px;

    min-height:50px;
}

.word{
    background:var(--accent);

    border:2px solid var(--accent-border);

    padding:12px 17px;

    border-radius:13px;

    cursor:pointer;

    font-weight:bold;

    transition:.15s;

    user-select:none;
}

.word:hover{
    transform:translateY(-3px);

    background:#ffe7a1;
}

.word:active{
    transform:translateY(0);
}

.word.used{
    opacity:0;

    pointer-events:none;
}


/* =========================================================
   SELECTED WORD
========================================================= */

.answer-word{
    background:#eaf2ff;

    border:2px solid #7197c9;

    padding:10px 15px;

    border-radius:12px;

    font-weight:bold;

    cursor:pointer;

    transition:.15s;
}

.answer-word:hover{
    background:#dceaff;

    transform:translateY(-2px);
}


/* =========================================================
   CONTROLS
========================================================= */

.controls{
    margin-top:22px;

    display:flex;

    justify-content:center;

    gap:12px;

    flex-wrap:wrap;
}

button{
    border:none;

    border-radius:12px;

    padding:12px 24px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:.15s;
}

button:hover{
    transform:translateY(-2px);
}

button:active{
    transform:translateY(0);
}

.check{
    background:var(--primary);

    color:white;
}

.check:hover{
    background:var(--primary-dark);
}

.clear{
    background:#edf0f5;

    color:#566274;
}

.clear:hover{
    background:#e2e6ec;
}

.next{
    background:var(--primary);

    color:white;

    display:none;
}

.next:hover{
    background:var(--primary-dark);
}


/* =========================================================
   MESSAGE
========================================================= */

.message{
    min-height:30px;

    margin-top:16px;

    font-size:17px;

    font-weight:bold;
}

.message.correct{
    color:var(--success);
}

.message.wrong{
    color:var(--error);
}


/* =========================================================
   ANIMATIONS
========================================================= */

.pop{
    animation:pop .3s ease;
}

@keyframes pop{

    0%{
        transform:scale(.9);
    }

    70%{
        transform:scale(1.05);
    }

    100%{
        transform:scale(1);
    }

}

.shake{
    animation:shake .35s;
}

@keyframes shake{

    0%,100%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-6px);
    }

    75%{
        transform:translateX(6px);
    }

}


/* =========================================================
   FINISH SCREEN
========================================================= */

.finish-screen{
    padding:15px 5px;
}

.finish-icon{
    font-size:65px;

    margin-bottom:10px;
}

.finish-screen h1{
    margin:8px 0 18px;

    font-size:30px;
}

.final-score{
    font-size:30px;

    font-weight:bold;

    margin:15px;
}

.final-time{
    font-size:22px;

    color:var(--primary);

    margin:15px 0;
}

.rank{
    font-size:22px;

    font-weight:bold;

    margin:20px;
}

.best{
    background:#fff5d9;

    padding:13px;

    border-radius:14px;

    margin:15px 0;

    color:#956800;

    font-weight:bold;
}

.finish-message{
    color:#667085;

    margin:15px 0 22px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    body{
        padding:70px 12px 20px;
    }

    .back-lobby{
        top:15px;
        left:15px;
    }

    .game{
        padding:22px 18px;
    }

    .header{
        flex-direction:column;

        gap:10px;
    }

    .title{
        font-size:23px;
    }

    .target{
        font-size:13px;
    }

    .english{
        font-size:20px;
    }

    .word{
        padding:10px 13px;
    }

    .start-screen h1{
        font-size:27px;
    }

}

</style>
</head>


<body>


<!-- =========================================================
     BACK TO LOBBY
========================================================= -->

<a
    href="../../index.html"
    class="back-lobby">

    ← Back to Lobby

</a>


<!-- =========================================================
     GAME
========================================================= -->

<div
    class="game"
    id="game">

    <!-- Start screen is inserted by JavaScript -->

</div>


<script>

/* =========================================================
   QUESTIONS
========================================================= */

const questions = [

    {
        en:"Do you go to work?",
        words:[
            "Anh",
            "có",
            "đi làm",
            "không?"
        ],
        answer:"Anh có đi làm không?"
    },

    {
        en:"What do you eat?",
        words:[
            "Bạn",
            "ăn",
            "cái gì?"
        ],
        answer:"Bạn ăn cái gì?"
    },

    {
        en:"What do you drink in the morning?",
        words:[
            "Buổi sáng",
            "em",
            "uống",
            "cái gì?"
        ],
        answer:"Buổi sáng em uống cái gì?"
    },

    {
        en:"Where do you work, Dad?",
        words:[
            "Ba",
            "làm việc",
            "ở đâu?"
        ],
        answer:"Ba làm việc ở đâu?"
    },

    {
        en:"Has John eaten breakfast yet?",
        words:[
            "John",
            "ăn sáng",
            "chưa?"
        ],
        answer:"John ăn sáng chưa?"
    },

    {
        en:"Mom, do you drink coffee or orange juice?",
        words:[
            "Mẹ",
            "uống",
            "cà phê",
            "hay",
            "nước cam?"
        ],
        answer:"Mẹ uống cà phê hay nước cam?"
    },

    {
        en:"What do you do in the evening?",
        words:[
            "Buổi tối",
            "chị",
            "làm",
            "cái gì?"
        ],
        answer:"Buổi tối chị làm cái gì?"
    },

    {
        en:"I don't hang out today.",
        words:[
            "Hôm nay",
            "em",
            "không",
            "đi chơi."
        ],
        answer:"Hôm nay em không đi chơi."
    },

    {
        en:"Do you go to school on Friday?",
        words:[
            "Thứ sáu",
            "em",
            "có",
            "đi học",
            "không?"
        ],
        answer:"Thứ sáu em có đi học không?"
    },

    {
        en:"Have you done your homework yet?",
        words:[
            "Chị",
            "làm bài",
            "chưa?"
        ],
        answer:"Chị làm bài chưa?"
    },

    {
        en:"In the morning, he drinks coffee and eats bread.",
        words:[
            "Buổi sáng,",
            "anh",
            "uống",
            "cà phê",
            "và",
            "ăn",
            "bánh mì."
        ],
        answer:"Buổi sáng, anh uống cà phê và ăn bánh mì."
    },

    {
        en:"Do you go to school in the afternoon?",
        words:[
            "Buổi chiều",
            "anh",
            "có",
            "đi học",
            "không?"
        ],
        answer:"Buổi chiều anh có đi học không?"
    },

    {
        en:"Do you exercise or watch movies in the evening?",
        words:[
            "Buổi tối",
            "bạn",
            "tập thể dục",
            "hay",
            "xem phim?"
        ],
        answer:"Buổi tối bạn tập thể dục hay xem phim?"
    },

    {
        en:"Yesterday it was hot, I was tired.",
        words:[
            "Hôm qua",
            "trời",
            "nóng,",
            "anh",
            "mệt."
        ],
        answer:"Hôm qua trời nóng, anh mệt."
    },

    {
        en:"On Sunday evening, he plays volleyball at the park.",
        words:[
            "Buổi tối",
            "chủ nhật,",
            "anh",
            "tập",
            "bóng chuyền",
            "ở công viên."
        ],
        answer:"Buổi tối chủ nhật, anh tập bóng chuyền ở công viên."
    }

];


/* =========================================================
   VARIABLES
========================================================= */

let current = 0;

let selected = [];

let score = 0;

let streak = 0;

let startTime = null;

let timer = null;

let currentAnswered = false;

let bestTime =
    localStorage.getItem("dailyActivitiesBestTime");


/* =========================================================
   ELEMENT
========================================================= */

const game =
    document.getElementById("game");


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    const arr = [...array];

    for(
        let i = arr.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [arr[i],arr[j]] =
            [arr[j],arr[i]];

    }

    return arr;
}


/* =========================================================
   START SCREEN
========================================================= */

function showStartScreen(){

    game.innerHTML = `

        <div class="start-screen">

            <div class="start-icon">
                🎯
            </div>

            <h1>
                Daily Activities Challenge
            </h1>

            <p>
                Build Vietnamese sentences from English prompts.
            </p>

            <div class="how-to-play">

                <div class="how-to-play-title">
                    How to Play
                </div>

                <p>
                    Click the Vietnamese words in the correct order, then click <b>Check</b>.
                </p>

                <div class="goal">
                    🎯 Goal: Finish 15 questions in under 3:00.
                </div>

            </div>

            <button
                type="button"
                class="start-btn"
                id="startBtn">

                Start Challenge

            </button>

        </div>

    `;

    document
        .getElementById("startBtn")
        .addEventListener(
            "click",
            startGame
        );
}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    current = 0;

    selected = [];

    score = 0;

    streak = 0;

    currentAnswered = false;

    startTime = Date.now();

    clearInterval(timer);

    timer =
        setInterval(
            updateTimer,
            100
        );

    loadQuestion();
}


/* =========================================================
   TIMER
========================================================= */

function updateTimer(){

    if(!startTime){
        return;
    }

    const elapsed =
        Date.now() - startTime;

    const totalSeconds =
        Math.floor(elapsed / 1000);

    const minutes =
        Math.floor(totalSeconds / 60);

    const seconds =
        totalSeconds % 60;

    const timeText =
        `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;

    const element =
        document.getElementById("time");

    if(element){

        element.innerText =
            `⏱️ ${timeText}`;

    }
}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(milliseconds){

    const totalSeconds =
        Math.floor(
            milliseconds / 1000
        );

    const minutes =
        Math.floor(
            totalSeconds / 60
        );

    const seconds =
        totalSeconds % 60;

    return `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;
}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion(){

    selected = [];

    currentAnswered = false;

    const q =
        questions[current];

    game.innerHTML = `

        <div class="header">

            <div class="title">
                Daily Activities Challenge
            </div>

            <div class="target">
                Target: 3:00
            </div>

        </div>


        <div class="stats">

            <div
                class="stat time"
                id="time">

                ⏱️ 00:00

            </div>


            <div
                class="stat score"
                id="score">

                ⭐ Score: ${score}

            </div>


            <div
                class="stat streak"
                id="streak">

                🔥 Streak: ${streak}

            </div>

        </div>


        <div class="progress-container">

            <div
                class="progress"
                id="progress">
            </div>

        </div>


        <div class="round">

            Question ${current + 1} / ${questions.length}

        </div>


        <div class="english">

            ${q.en}

        </div>


        <div
            class="answer empty"
            id="answer">
        </div>


        <div
            class="words"
            id="words">
        </div>


        <div
            class="message"
            id="message">
        </div>


        <div class="controls">

            <button
                type="button"
                class="clear"
                id="clearBtn">

                Clear

            </button>


            <button
                type="button"
                class="check"
                id="checkBtn">

                Check

            </button>


            <button
                type="button"
                class="next"
                id="nextBtn">

                Next →

            </button>

        </div>

    `;


    /* Progress */

    document
        .getElementById("progress")
        .style.width =
            `${((current + 1) / questions.length) * 100}%`;


    /* Timer immediately */

    updateTimer();


    /* Word bank */

    const wordsBox =
        document.getElementById("words");

    const shuffledWords =
        shuffle(
            q.words.map(
                (word,index) => ({
                    word,
                    index
                })
            )
        );


    shuffledWords.forEach(item => {

        const button =
            document.createElement("div");

        button.className =
            "word";

        button.innerText =
            item.word;

        button.dataset.index =
            item.index;

        button.addEventListener(
            "click",
            () => {

                selectWord(
                    item.word,
                    button
                );

            }
        );

        wordsBox.appendChild(button);

    });


    /* Buttons */

    document
        .getElementById("clearBtn")
        .addEventListener(
            "click",
            clearAnswer
        );


    document
        .getElementById("checkBtn")
        .addEventListener(
            "click",
            checkAnswer
        );


    document
        .getElementById("nextBtn")
        .addEventListener(
            "click",
            nextQuestion
        );
}


/* =========================================================
   SELECT WORD
========================================================= */

function selectWord(word,button){

    if(currentAnswered){
        return;
    }

    selected.push(word);

    button.classList.add("used");

    const answer =
        document.getElementById("answer");

    answer.classList.remove("empty");


    const item =
        document.createElement("div");

    item.className =
        "answer-word pop";

    item.innerText =
        word;


    item.addEventListener(
        "click",
        () => {

            removeWord(
                word,
                item,
                button
            );

        }
    );


    answer.appendChild(item);
}


/* =========================================================
   REMOVE WORD
========================================================= */

function removeWord(
    word,
    item,
    button
){

    if(currentAnswered){
        return;
    }

    const index =
        selected.indexOf(word);

    if(index !== -1){

        selected.splice(
            index,
            1
        );

    }

    item.remove();

    button.classList.remove("used");


    const answer =
        document.getElementById("answer");

    if(selected.length === 0){

        answer.classList.add(
            "empty"
        );

    }
}


/* =========================================================
   CLEAR ANSWER
========================================================= */

function clearAnswer(){

    if(currentAnswered){
        return;
    }

    selected = [];


    document
        .querySelectorAll(".answer-word")
        .forEach(el => {

            el.remove();

        });


    document
        .querySelectorAll(".word")
        .forEach(el => {

            el.classList.remove(
                "used"
            );

        });


    document
        .getElementById("answer")
        .classList.add("empty");


    const message =
        document.getElementById("message");

    message.innerText = "";

    message.className =
        "message";
}


/* =========================================================
   CHECK ANSWER
========================================================= */

function checkAnswer(){

    if(currentAnswered){
        return;
    }

    const sentence =
        selected.join(" ");

    const q =
        questions[current];

    const message =
        document.getElementById("message");


    if(sentence === q.answer){

        currentAnswered = true;

        streak++;


        let points = 100;


        if(streak >= 3){
            points += 50;
        }

        if(streak >= 5){
            points += 50;
        }


        score += points;


        message.innerText =
            `Correct! +${points} points`;

        message.className =
            "message correct pop";


        document
            .getElementById("score")
            .innerText =
                `⭐ Score: ${score}`;


        document
            .getElementById("streak")
            .innerText =
                `🔥 Streak: ${streak}`;


        document
            .querySelectorAll(".word")
            .forEach(el => {

                el.style.pointerEvents =
                    "none";

            });


        document
            .getElementById("checkBtn")
            .style.display =
                "none";


        document
            .getElementById("clearBtn")
            .style.display =
                "none";


        document
            .getElementById("nextBtn")
            .style.display =
                "inline-block";


    }else{

        streak = 0;


        message.innerText =
            "Not quite! Try again.";

        message.className =
            "message wrong shake";


        document
            .getElementById("streak")
            .innerText =
                `🔥 Streak: ${streak}`;

    }
}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion(){

    if(!currentAnswered){
        return;
    }

    current++;

    if(current < questions.length){

        loadQuestion();

    }else{

        finishGame();

    }
}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

    clearInterval(timer);

    timer = null;


    const totalTime =
        Date.now() - startTime;


    const time =
        formatTime(totalTime);


    /* BEST TIME */

    let newBest = false;


    if(
        !bestTime ||
        totalTime < Number(bestTime)
    ){

        localStorage.setItem(
            "dailyActivitiesBestTime",
            totalTime
        );

        bestTime =
            totalTime;

        newBest = true;

    }


    /* RANK */

    let rank;


    if(totalTime <= 180000){

        rank =
            "Vietnamese Speed Master!";

    }
    else if(totalTime <= 240000){

        rank =
            "Excellent!";

    }
    else if(totalTime <= 300000){

        rank =
            "Great Job!";

    }
    else{

        rank =
            "Good Practice!";

    }


    game.innerHTML = `

        <div class="finish-screen">

            <div class="finish-icon">
                🎉
            </div>


            <h1>
                Challenge Complete!
            </h1>


            <div class="final-score">

                ⭐ ${score} Points

            </div>


            <div class="final-time">

                Your Time:
                <b>${time}</b>

            </div>


            <div class="rank">

                ${rank}

            </div>


            ${
                newBest

                ?

                `
                <div class="best">

                    🏆 NEW BEST TIME!

                </div>
                `

                :

                `
                <div class="best">

                    Best Time:
                    ${formatTime(Number(bestTime))}

                </div>
                `
            }


            <p class="finish-message">

                ${
                    totalTime <= 180000

                    ?

                    "You beat the 3-minute challenge!"

                    :

                    "Try again and beat your time!"

                }

            </p>


            <button
                type="button"
                class="start-btn"
                id="playAgainBtn">

                Play Again

            </button>

        </div>

    `;


    document
        .getElementById("playAgainBtn")
        .addEventListener(
            "click",
            startGame
        );
}


/* =========================================================
   INITIALIZE
========================================================= */

showStartScreen();

</script>
