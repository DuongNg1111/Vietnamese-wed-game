   GLOBAL
========================================================= */

========================================================= */

    font-weight:bold;

    transition:.2s;
}

.back-btn:hover{

}


/* =========================================================
   GAME CONTAINER
========================================================= */

/* =========================================================

========================================================= */

h1{

.instruction{

/* =========================================================
   TOP BAR
========================================================= */

.topbar{

    color:#555;

.round-text{
    color:#666;
}

.score-text{

/* =========================================================
   SECTION LABEL
========================================================= */

.section-title{
    margin:15px 0 10px;

    font-size:16px;

    font-weight:bold;

    color:#777;

    text-transform:uppercase;

    letter-spacing:.5px;
}


/* =========================================================
   TARGETS
========================================================= */

.targets{
    display:grid;

    gap:15px;
}

.target{

    min-height:115px;

    border-radius:16px;

    border:3px dashed #6b8fc4;

    background:#eaf2ff;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    padding:12px;

    font-size:21px;

    font-weight:bold;

    transition:.2s;

    user-select:none;
}

.target.over{

    transform:scale(1.03);

    background:#dcecff;
}

.target.has-word{

    border-style:solid;

    border-color:#6b8fc4;
}

.target.correct{

    background:#dff5e5;

    border-style:solid;

    border-color:#4caf70;

    color:#3b7650;
}

.target.incorrect{

    background:#ffe2e2;

    border-style:solid;

    border-color:#d65b5b;

    color:#a33d3d;
}

.target-label{

    margin-bottom:8px;
}

.target-word{

    min-height:30px;

    padding:6px 12px;

    border-radius:9px;

    background:#fff3d6;

    border:2px solid #d8ad50;

    color:#444;

    font-size:16px;

    font-weight:bold;
}

.target-word.empty{

    background:transparent;

    border:2px dashed #b8c7dc;

    color:#9aa8bb;

    font-weight:normal;
}


/* =========================================================
   ENGLISH WORDS
========================================================= */

.words{

    display:grid;

    gap:15px;

    margin-top:20px;
}

.word{

    min-height:80px;

    border-radius:16px;

    background:#fff3d6;

    border:3px solid #d8ad50;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:15px;

    font-size:20px;

    font-weight:bold;

    cursor:grab;

    user-select:none;

    touch-action:none;

    transition:.2s;
}

.word:hover{

    transform:translateY(-3px);

    background:#ffe8b5;
}

.word.dragging{

    opacity:.45;
}

.word.placed{

    background:#e8eef7;

    border-color:#9aaec7;
}

.word.checked-correct{

    background:#dff5e5;

    border-color:#4caf70;

    color:#3b7650;
}

.word.checked-incorrect{

    background:#ffe2e2;

    border-color:#d65b5b;

    color:#a33d3d;
}


/* =========================================================
   MESSAGE
========================================================= */

.message{

    margin:20px 0 10px;

    font-size:19px;

    font-weight:bold;

/* =========================================================
   EXPLANATION
========================================================= */

    border-radius:12px;

.explanation .related{

/* =========================================================
   BUTTON
========================================================= */

button{

    padding:13px 30px;

<script>

/* =========================================================

========================================================= */

const explanations = {

    "lớn":{
        meaning:
            "LỚN means big or large in Vietnamese.",

        related:
            "big, large"
    },

    "nhỏ":{
        meaning:
            "NHỎ means small or little in Vietnamese.",

        related:
            "small, tiny"
    },

    "bự":{
        meaning:
            "BỰ means big or huge. It is commonly used in casual Vietnamese.",

        related:

    },

    "dài":{
        meaning:

    "ngắn":{
        meaning:

        related:

        related:

    }

};


/* =========================================================
   GAME STATE
========================================================= */

let current = 0;

let score = 0;

let draggedWord = null;

let placements = {};

let checked = false;


/* =========================================================
   DOM
========================================================= */

const targetsEl =
    document.getElementById("targets");

const wordsEl =
    document.getElementById("words");

const messageEl =
    document.getElementById("message");

const explanationEl =
    document.getElementById("explanation");

const checkBtn =
    document.getElementById("checkBtn");

const nextBtn =
    document.getElementById("nextBtn");

const gameScreen =
    document.getElementById("gameScreen");

const finalScreen =
    document.getElementById("finalScreen");


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    const newArray = [...array];

    for(
        let i = newArray.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        [
            newArray[i],
            newArray[j]
        ] = [
            newArray[j],
            newArray[i]
        ];

    }

    return newArray;
}


/* =========================================================
   LOAD ROUND
========================================================= */

function loadRound(){

    placements = {};

    draggedWord = null;

    checked = false;


    messageEl.textContent = "";

    messageEl.style.color = "";


    explanationEl.classList.add(
        "hidden"
    );

    explanationEl.innerHTML = "";


    checkBtn.disabled = true;

    checkBtn.classList.remove(
        "hidden"
    );


    nextBtn.classList.add(
        "hidden"
    );


    const round =
        rounds[current];


    const pairs =
        round.pairs;


    const count =
        pairs.length;


    document.getElementById(
        "roundText"
    ).textContent =
        `Round ${current + 1} / ${rounds.length}`;


    document.getElementById(
        "scoreText"
    ).textContent =
        `Score: ${score}`;


    targetsEl.style.gridTemplateColumns =
        `repeat(${count}, 1fr)`;


    wordsEl.style.gridTemplateColumns =
        `repeat(${count}, 1fr)`;


    targetsEl.innerHTML = "";

    wordsEl.innerHTML = "";


    /* =====================================================
       CREATE VIETNAMESE TARGETS
    ====================================================== */

    shuffle(pairs).forEach(pair => {

        const vietnamese =
            pair[0];


        const box =
            document.createElement("div");


        box.className =
            "target";


        box.dataset.vi =
            vietnamese;


        const label =
            document.createElement("div");


        label.className =
            "target-label";


        label.textContent =
            vietnamese;


        const placed =
            document.createElement("div");


        placed.className =
            "target-word empty";


        placed.textContent =
            "Drop here";


        box.appendChild(label);

        box.appendChild(placed);


        /* =========================================
           DRAG OVER
        ========================================= */

        box.addEventListener(
            "dragover",
            event => {

                if(checked){

                    return;

                }


                event.preventDefault();


                box.classList.add(
                    "over"
                );

            }
        );


        /* =========================================
           DRAG LEAVE
        ========================================= */

        box.addEventListener(
            "dragleave",
            () => {

                box.classList.remove(
                    "over"
                );

            }
        );


        /* =========================================
           DROP
        ========================================= */

        box.addEventListener(
            "drop",
            event => {

                event.preventDefault();

                box.classList.remove(
                    "over"
                );


                if(
                    checked ||
                    !draggedWord
                ){

                    return;

                }


                const english =
                    draggedWord.dataset.word;


                /* =====================================
                   REMOVE WORD FROM PREVIOUS TARGET
                ===================================== */

                Object.keys(placements).forEach(
                    vi => {

                        if(
                            placements[vi] ===
                            english
                        ){

                            delete placements[vi];


                            const oldTarget =
                                document.querySelector(
                                    `.target[data-vi="${CSS.escape(vi)}"]`
                                );


                            if(oldTarget){

                                const oldPlaced =
                                    oldTarget.querySelector(
                                        ".target-word"
                                    );


                                oldPlaced.textContent =
                                    "Drop here";


                                oldPlaced.classList.add(
                                    "empty"
                                );


                                oldTarget.classList.remove(
                                    "has-word"
                                );

                            }

                        }

                    }
                );


                /* =====================================
                   REMOVE EXISTING WORD FROM THIS TARGET
                ===================================== */

                if(
                    placements[vietnamese]
                ){

                    const oldEnglish =
                        placements[vietnamese];


                    const oldCard =
                        document.querySelector(
                            `.word[data-word="${CSS.escape(oldEnglish)}"]`
                        );


                    if(oldCard){

                        oldCard.classList.remove(
                            "placed"
                        );

                    }

                }


                /* =====================================
                   SAVE PLACEMENT
                ===================================== */

                placements[vietnamese] =
                    english;


                placed.textContent =
                    english;


                placed.classList.remove(
                    "empty"
                );


                box.classList.add(
                    "has-word"
                );


                draggedWord.classList.add(
                    "placed"
                );


                draggedWord = null;


                updateCheckButton();

            }
        );


        targetsEl.appendChild(
            box
        );

    });


    /* =====================================================
       CREATE ENGLISH WORDS
    ====================================================== */

    shuffle(pairs).forEach(pair => {

        const english =
            pair[1];


        const card =
            document.createElement("div");


        card.className =
            "word";


        card.draggable =
            true;


        card.dataset.word =
            english;


        card.textContent =
            english;


        /* =========================================
           DRAG START
        ========================================= */

        card.addEventListener(
            "dragstart",
            () => {

                if(checked){

                    return;

                }


                draggedWord =
                    card;


                card.classList.add(
                    "dragging"
                );

            }
        );


        /* =========================================
           DRAG END
        ========================================= */

        card.addEventListener(
            "dragend",
            () => {

                card.classList.remove(
                    "dragging"
                );

            }
        );


        wordsEl.appendChild(
            card
        );

    });

}


/* =========================================================
   UPDATE CHECK BUTTON
========================================================= */

function updateCheckButton(){

    const total =
        rounds[current].pairs.length;


    const placed =
        Object.keys(placements).length;


    checkBtn.disabled =
        placed !== total;

}


/* =========================================================
   CHECK ANSWERS
========================================================= */

function checkAnswers(){

    if(checked){

        return;

    }


    const round =
        rounds[current];


    const total =
        round.pairs.length;


    let correctCount =
        0;


    /* =====================================================
       CHECK EVERY PAIR
    ====================================================== */

    round.pairs.forEach(pair => {

        const vietnamese =
            pair[0];


        const correctEnglish =
            pair[1];


        const selectedEnglish =
            placements[vietnamese];


        const target =
            document.querySelector(
                `.target[data-vi="${CSS.escape(vietnamese)}"]`
            );


        const card =
            document.querySelector(
                `.word[data-word="${CSS.escape(selectedEnglish)}"]`
            );


        if(
            selectedEnglish ===
            correctEnglish
        ){

            correctCount++;


            target.classList.add(
                "correct"
            );


            if(card){

                card.classList.add(
                    "checked-correct"
                );

            }

        }

        else{

            target.classList.add(
                "incorrect"
            );


            if(card){

                card.classList.add(
                    "checked-incorrect"
                );

            }

        }

    });


    /* =====================================================
       UPDATE SCORE
    ====================================================== */

    score += correctCount;


    document.getElementById(
        "scoreText"
    ).textContent =
        `Score: ${score}`;


    /* =====================================================
       LOCK ROUND
    ====================================================== */

    checked = true;


    document
        .querySelectorAll(".word")
        .forEach(word => {

            word.draggable = false;

            word.style.cursor =
                "default";

        });


    /* =====================================================
       RESULT MESSAGE
    ====================================================== */

    if(
        correctCount === total
    ){

        messageEl.textContent =
            "🎉 Perfect! All answers are correct.";

        messageEl.style.color =
            "#3b8b58";

    }

    else{

        messageEl.textContent =
            `You got ${correctCount} / ${total} correct.`;

        messageEl.style.color =
            "#c54d4d";

    }


    /* =====================================================
       SHOW EXPLANATION
    ====================================================== */

    showRoundExplanation();


    /* =====================================================
       CHECK → NEXT
    ====================================================== */

    checkBtn.classList.add(
        "hidden"
    );


    nextBtn.classList.remove(
        "hidden"
    );

}


/* =========================================================
   SHOW EXPLANATION
========================================================= */

function showRoundExplanation(){

    const round =
        rounds[current];


    const lines =
        round.pairs.map(pair => {

            const vietnamese =
                pair[0];


            const english =
                pair[1];


            const data =
                explanations[vietnamese];


            return `

                <div style="margin-bottom:12px;">

                    <strong>
                        ${english}
                    </strong>

                    →

                    <strong>
                        ${vietnamese}
                    </strong>

                    <br>

                    ${
                        data
                        ?
                        data.meaning
                        :
                        ""
                    }

                    ${
                        data
                        ?
                        `
                        <span class="related">

                            Related English words:
                            ${data.related}

                        </span>
                        `
                        :
                        ""
                    }

                </div>

            `;

        }).join("");


    explanationEl.innerHTML = `

        <strong>
            💡 Learn:
        </strong>

        <div style="margin-top:12px;">

            ${lines}

        </div>

    `;


    explanationEl.classList.remove(
        "hidden"
    );

}


/* =========================================================
   CHECK BUTTON
========================================================= */

checkBtn.addEventListener(
    "click",
    () => {

        checkAnswers();

    }
);


/* =========================================================
   NEXT ROUND
========================================================= */

nextBtn.addEventListener(
    "click",
    () => {

        current++;


        if(
            current <
            rounds.length
        ){

            loadRound();

        }

        else{

            finishGame();

        }

    }
);


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

    gameScreen.style.display =
        "none";


    finalScreen.style.display =
        "block";


    const totalPairs =
        getTotalPairs();


    document.getElementById(
        "finalScore"
    ).textContent =
        `Final Score: ${score} / ${totalPairs}`;


    const percentage =
        Math.round(
            score /
            totalPairs *
            100
        );


    let message = "";


    if(
        percentage >= 85
    ){

        message =
            "🏆 Excellent! You really know these words.";

    }

    else if(
        percentage >= 60
    ){

        message =
            "🎉 Good job! Keep practicing.";

    }

    else{

        message =
            "📚 Keep practicing. You'll get better.";

    }


    document.getElementById(
        "finalMessage"
    ).textContent =
        `${percentage}% — ${message}`;

}


/* =========================================================
   TOTAL PAIRS
========================================================= */

function getTotalPairs(){

    return rounds.reduce(
        (
            total,
            round
        ) =>

            total +
            round.pairs.length,

        0
    );

}


/* =========================================================
   RESTART
========================================================= */

function restartGame(){

    current = 0;

    score = 0;

    draggedWord = null;

    placements = {};

    checked = false;


    finalScreen.style.display =
        "none";


    gameScreen.style.display =
        "block";


    loadRound();

}


/* =========================================================
   START GAME
========================================================= */

loadRound();

</script>
