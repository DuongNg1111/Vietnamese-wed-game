========================================================= */

    text-transform:uppercase;

    letter-spacing:.5px;

/* =========================================================
   TARGETS
========================================================= */

.targets{

    display:grid;

    gap:15px;

}


.target{

    min-height:90px;

    border-radius:16px;

    border:3px dashed #6b8fc4;

    background:#eaf2ff;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:15px;

    font-size:23px;

    font-weight:bold;

    transition:.2s;

    user-select:none;

}


.target.over{

    transform:scale(1.03);

    background:#dcecff;

}


.target.correct{

    background:#dff5e5;

    border-style:solid;

    border-color:#4caf70;

    color:#3b7650;

}


.target.wrong{

    animation:shake .3s;

}


@keyframes shake{

    25%{

        transform:translateX(-7px);

    }

    75%{

        transform:translateX(7px);

    }

}



/* =========================================================
   ENGLISH WORDS
========================================================= */

.words{

    display:grid;

    gap:15px;

    margin-top:20px;

}


.word{

    min-height:80px;

    border-radius:16px;

    background:#fff3d6;

    border:3px solid #d8ad50;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:15px;

    font-size:21px;

    font-weight:bold;

    cursor:grab;

    user-select:none;

    touch-action:none;

    transition:.2s;

}


.word:hover{

    transform:translateY(-3px);

    background:#ffe8b5;

}


.word.dragging{

    opacity:.45;

}


.word.used{

    visibility:hidden;

    pointer-events:none;

}



/* =========================================================

========================================================= */

    margin:20px 0 10px;

    font-size:19px;

    font-weight:bold;

/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    const newArray = [
        ...array
    ];


    for(

        let i =
            newArray.length - 1;

        i > 0;

        i--

    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            newArray[i],
            newArray[j]

        ] = [

            newArray[j],
            newArray[i]

        ];

    }


    return newArray;

}



/* =========================================================
   LOAD ROUND
========================================================= */

function loadRound(){

    matched = 0;

    draggedWord = null;


    messageEl.textContent = "";

    messageEl.style.color = "";


    nextBtn.disabled = true;


    explanationEl.classList.add(
        "hidden"
    );


    explanationEl.innerHTML = "";


    const round =
        rounds[current];


    const count =
        round.vi.length;


    document.getElementById(
        "roundText"
    ).textContent =
        `Round ${current + 1} / ${rounds.length}`;


    document.getElementById(
        "scoreText"
    ).textContent =
        `Score: ${score}`;


    targetsEl.style.gridTemplateColumns =
        `repeat(${count}, 1fr)`;


    wordsEl.style.gridTemplateColumns =
        `repeat(${count}, 1fr)`;


    targetsEl.innerHTML = "";

    wordsEl.innerHTML = "";



    /* =====================================================
       VIETNAMESE TARGETS
    ===================================================== */

    shuffle(
        round.vi
    ).forEach(word => {


        const box =
            document.createElement(
                "div"
            );


        box.className =
            "target";


        box.textContent =
            word;


        box.dataset.vi =
            word;



        /* DRAG OVER */

        box.addEventListener(
            "dragover",
            event => {

                event.preventDefault();


                if(
                    !box.classList.contains(
                        "correct"
                    )
                ){

                    box.classList.add(
                        "over"
                    );

                }

            }
        );



        /* DRAG LEAVE */

        box.addEventListener(
            "dragleave",
            () => {

                box.classList.remove(
                    "over"
                );

            }
        );



        /* DROP */

        box.addEventListener(
            "drop",
            event => {

                event.preventDefault();


                box.classList.remove(
                    "over"
                );


                if(
                    !draggedWord ||
                    box.classList.contains(
                        "correct"
                    )
                ){

                    return;

                }


                const english =
                    draggedWord.dataset.word;


                /* =========================
                   CORRECT
                ========================= */

                if(
                    round.map[english] ===
                    box.dataset.vi
                ){

                    box.classList.add(
                        "correct"
                    );


                    draggedWord.classList.add(
                        "used"
                    );


                    matched++;

                    score++;


                    messageEl.textContent =
                        "✅ Correct!";


                    messageEl.style.color =
                        "#3b8b58";


                    document.getElementById(
                        "scoreText"
                    ).textContent =
                        `Score: ${score}`;


                    showExplanation(
                        english,
                        box.dataset.vi
                    );


                    if(
                        matched === count
                    ){

                        messageEl.textContent =
                            "🎉 Perfect!";


                        nextBtn.disabled =
                            false;

                    }

                }


                /* =========================
                   WRONG
                ========================= */

                else{

                    box.classList.add(
                        "wrong"
                    );


                    setTimeout(
                        () => {

                            box.classList.remove(
                                "wrong"
                            );

                        },
                        300
                    );


                    messageEl.textContent =
                        "❌ Try again!";


                    messageEl.style.color =
                        "#c54d4d";

                }


                draggedWord = null;

            }
        );


        targetsEl.appendChild(
            box
        );

    });



    /* =====================================================
       ENGLISH WORDS
    ===================================================== */

    shuffle(
        round.en
    ).forEach(word => {


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "word";


        card.draggable =
            true;


        card.dataset.word =
            word;


        card.textContent =
            word;



        /* DRAG START */

        card.addEventListener(
            "dragstart",
            () => {

                draggedWord =
                    card;


                card.classList.add(
                    "dragging"
                );

            }
        );



        /* DRAG END */

        card.addEventListener(
            "dragend",
            () => {

                card.classList.remove(
                    "dragging"
                );

            }
        );



        wordsEl.appendChild(
            card
        );

    });

}

function showExplanation(
    english,
    vietnamese
){

    const data =
        explanations[
            vietnamese
        ];


    if(!data){

        return;

    }


    explanationEl.innerHTML = `

        <strong>💡 Learn:</strong>

        <strong>
            ${english}
        </strong>

        →

        <strong>
            ${vietnamese}
        </strong>

        <br><br>

        ${data.meaning}

        <span class="related">

            Related English words:
            ${data.related}

        </span>

    `;


    explanationEl.classList.remove(
        "hidden"
    );

}

        else{

/* =========================================================

========================================================= */

function finishGame(){

    gameScreen.style.display =
        "none";


    finalScreen.style.display =
        "block";


    const totalPairs =
        getTotalPairs();


    document.getElementById(
        "finalScore"
    ).textContent =
        `Final Score: ${score} / ${totalPairs}`;


    const percentage =
        Math.round(
            score /
            totalPairs *
            100
        );


    let message = "";


    if(
        percentage >= 85

        message =
            "🏆 Excellent!";

    }

    else if(
        percentage >= 60
    ){

        message =
            "🎉 Good Job!";

    }

    else{

        message =
            "📚 Keep Practicing!";

    }


    document.getElementById(
        "finalMessage"
    ).textContent =
        `${percentage}% — ${message}`;

}



/* =========================================================
   TOTAL PAIRS
========================================================= */

function getTotalPairs(){

    return rounds.reduce(
        (
            total,
            round
        ) =>

            total +
            round.vi.length,

        0
    );

}



/* =========================================================
   RESTART
========================================================= */

function restartGame(){

    current = 0;

    score = 0;

    matched = 0;

    draggedWord = null;


    finalScreen.style.display =
        "none";


    gameScreen.style.display =
        "block";


    loadRound();

}



/* =========================================================
   START
========================================================= */

loadRound();
