<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Find The Same Meaning</title>

<!-- Game Metadata -->
<meta name="game-title" content="Find The Same Meaning">
<meta name="game-description" content="Match English words with Vietnamese words that have the same meaning.">
<meta name="game-icon" content="🔎">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f7f9fc;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #222;
}


/* =========================
   GAME CONTAINER
========================= */

.game {
    width: min(1200px, 95vw);
    background: white;
    border-radius: 24px;
    padding: 30px 40px 35px;
    box-shadow: 0 10px 35px rgba(0,0,0,.12);
    text-align: center;
}


/* =========================
   TITLE
========================= */

h1 {
    margin: 0 0 10px;
    font-size: 34px;
}

.instruction {
    color: #555;
    font-size: 17px;
    margin-bottom: 20px;
}


/* =========================
   TOP BAR
========================= */

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    font-weight: bold;
}

.round {
    color: #666;
}

.score {
    font-size: 18px;
}


/* =========================
   WORD AREA
========================= */

.labels,
.words {
    display: grid;
    gap: 20px;
}


/* =========================
   VIETNAMESE TARGET
========================= */

.target {
    min-height: 110px;
    border-radius: 18px;
    border: 3px dashed #6b8fc4;
    background: #eaf2ff;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 28px;
    font-weight: bold;

    transition: .2s;
}

.target.over {
    transform: scale(1.05);
    background: #dcecff;
}

.target.correct {
    background: #dff5e5;
    border-style: solid;
    border-color: #4caf70;
}

.target.wrong {
    animation: shake .3s;
}

@keyframes shake {

    25% {
        transform: translateX(-8px);
    }

    75% {
        transform: translateX(8px);
    }

}


/* =========================
   ENGLISH WORDS
========================= */

.words {
    margin-top: 25px;
}

.word {
    min-height: 100px;

    border-radius: 18px;

    background: #fff3d6;
    border: 3px solid #d8ad50;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 24px;
    font-weight: bold;

    cursor: grab;
    user-select: none;

    transition: .2s;
}

.word:hover {
    transform: translateY(-4px);
}

.word.dragging {
    opacity: .45;
}

.word.used {
    visibility: hidden;
    pointer-events: none;
}


/* =========================
   MESSAGE
========================= */

.message {
    min-height: 40px;
    margin: 20px 0 10px;
    font-size: 18px;
    font-weight: bold;
}


/* =========================
   EXPLANATION
========================= */

.explanation {
    margin: 15px auto 20px;
    padding: 16px 20px;

    max-width: 750px;

    background: #f0f7ff;

    border-left: 5px solid #4779b8;
    border-radius: 12px;

    color: #3d5066;

    font-size: 16px;
    line-height: 1.5;

    text-align: left;
}

.explanation strong {
    color: #4779b8;
}

.hidden {
    display: none;
}


/* =========================
   BUTTON
========================= */

button {
    background: #4779b8;
    color: white;

    border: none;
    border-radius: 12px;

    padding: 12px 30px;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;
}

button:hover {
    opacity: .9;
}

button:disabled {
    opacity: .45;
    cursor: default;
}


/* =========================
   FINAL SCREEN
========================= */

.final {
    display: none;
}

.final h2 {
    font-size: 32px;
}

.final-score {
    font-size: 26px;
    margin: 20px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

    .game {
        padding: 25px 15px;
    }

    .target {
        font-size: 20px;
        min-height: 80px;
    }

    .word {
        font-size: 18px;
        min-height: 80px;
    }

}

</style>

</head>


<body>


<div class="game">


<!-- =========================
     GAME SCREEN
========================= -->

<div id="gameScreen">


<h1>
🔎 FIND THE SAME MEANING
</h1>


<p class="instruction">

Drag each English word to the Vietnamese word with the same meaning.

</p>


<div class="topbar">

<div class="round" id="roundText">
Round 1 / 15
</div>

<div class="score" id="scoreText">
Score: 0
</div>

</div>


<div class="labels" id="targets">
</div>


<div class="words" id="words">
</div>


<div class="message" id="message">
</div>


<!-- Explanation appears after a correct match -->

<div id="explanation" class="explanation hidden">
</div>


<button id="nextBtn" disabled>
Next Round →
</button>


</div>


<!-- =========================
     FINAL SCREEN
========================= -->

<div class="final" id="finalScreen">

<h2>
🎉 Great job!
</h2>


<div class="final-score" id="finalScore">
</div>


<button onclick="restartGame()">
Play Again
</button>


</div>


</div>


<script>


// =====================================================
// GAME DATA
// =====================================================

const rounds = [

/* ROUND 1 */

{
    vi: ["TO", "NHỎ", "NHANH"],
    en: ["big", "small", "fast"],

    map: {
        big: "TO",
        small: "NHỎ",
        fast: "NHANH"
    }
},


/* ROUND 2 */

{
    vi: ["CHẬM", "XA", "GẦN"],
    en: ["slow", "far", "near"],

    map: {
        slow: "CHẬM",
        far: "XA",
        near: "GẦN"
    }
},


/* ROUND 3 */

{
    vi: ["TO", "NHỎ", "RẺ", "MẮC"],
    en: ["large", "tiny", "cheap", "expensive"],

    map: {
        large: "TO",
        tiny: "NHỎ",
        cheap: "RẺ",
        expensive: "MẮC"
    }
},


/* ROUND 4 */

{
    vi: ["NHANH", "CHẬM", "XA", "GẦN"],
    en: ["quick", "slow", "distant", "close"],

    map: {
        quick: "NHANH",
        slow: "CHẬM",
        distant: "XA",
        close: "GẦN"
    }
},


/* ROUND 5 */

{
    vi: ["TO", "NHỎ", "NHANH", "CHẬM"],
    en: ["huge", "little", "rapid", "slow"],

    map: {
        huge: "TO",
        little: "NHỎ",
        rapid: "NHANH",
        slow: "CHẬM"
    }
},


/* ROUND 6 */

{
    vi: ["XA", "GẦN", "RẺ", "MẮC"],
    en: ["far", "nearby", "cheap", "costly"],

    map: {
        far: "XA",
        nearby: "GẦN",
        cheap: "RẺ",
        costly: "MẮC"
    }
},


/* ROUND 7 */

{
    vi: ["CAO", "THẤP", "ĐẸP", "XẤU"],
    en: ["tall", "low", "beautiful", "ugly"],

    map: {
        tall: "CAO",
        low: "THẤP",
        beautiful: "ĐẸP",
        ugly: "XẤU"
    }
},


/* ROUND 8 */

{
    vi: ["TO", "CAO", "NHỎ", "THẤP"],
    en: ["huge", "high", "tiny", "low"],

    map: {
        huge: "TO",
        high: "CAO",
        tiny: "NHỎ",
        low: "THẤP"
    }
},


/* ROUND 9 */

{
    vi: ["ĐẸP", "XẤU", "NHANH", "CHẬM"],
    en: ["pretty", "ugly", "quick", "slow"],

    map: {
        pretty: "ĐẸP",
        ugly: "XẤU",
        quick: "NHANH",
        slow: "CHẬM"
    }
},


/* ROUND 10 */

{
    vi: ["TO", "NHỎ", "GẦN", "NHANH", "MẮC"],
    en: ["giant", "little", "near", "rapid", "expensive"],

    map: {
        giant: "TO",
        little: "NHỎ",
        near: "GẦN",
        rapid: "NHANH",
        expensive: "MẮC"
    }
},


/* ROUND 11 */

{
    vi: ["CAO", "THẤP", "XA", "GẦN", "RẺ"],
    en: ["tall", "short", "distant", "close", "cheap"],

    map: {
        tall: "CAO",
        short: "THẤP",
        distant: "XA",
        close: "GẦN",
        cheap: "RẺ"
    }
},


/* ROUND 12 */

{
    vi: ["ĐẸP", "XẤU", "TO", "NHỎ", "MẮC"],
    en: ["lovely", "unattractive", "large", "tiny", "pricey"],

    map: {
        lovely: "ĐẸP",
        unattractive: "XẤU",
        large: "TO",
        tiny: "NHỎ",
        pricey: "MẮC"
    }
},


/* ROUND 13 */

{
    vi: ["XA", "GẦN", "TO", "CAO", "THẤP", "RẺ"],
    en: ["far", "nearby", "big", "high", "low", "cheap"],

    map: {
        far: "XA",
        nearby: "GẦN",
        big: "TO",
        high: "CAO",
        low: "THẤP",
        cheap: "RẺ"
    }
},


/* ROUND 14 */

{
    vi: ["NHỎ", "CHẬM", "XẤU", "ĐẸP", "TO", "MẮC"],
    en: ["small", "slow", "ugly", "beautiful", "enormous", "costly"],

    map: {
        small: "NHỎ",
        slow: "CHẬM",
        ugly: "XẤU",
        beautiful: "ĐẸP",
        enormous: "TO",
        costly: "MẮC"
    }
},


/* ROUND 15 */

{
    vi: ["TO", "NHỎ", "NHANH", "CHẬM", "CAO", "THẤP"],
    en: ["massive", "tiny", "fast", "slow", "tall", "short"],

    map: {
        massive: "TO",
        tiny: "NHỎ",
        fast: "NHANH",
        slow: "CHẬM",
        tall: "CAO",
        short: "THẤP"
    }
}

];


// =====================================================
// EXPLANATIONS
// =====================================================

const explanations = {

    "TO": {
        meaning: "TO means big or large in Vietnamese.",
        related: "big, large, huge, giant, enormous, massive"
    },

    "NHỎ": {
        meaning: "NHỎ means small or little in Vietnamese.",
        related: "small, tiny, little"
    },

    "NHANH": {
        meaning: "NHANH means fast or quick in Vietnamese.",
        related: "fast, quick, rapid"
    },

    "CHẬM": {
        meaning: "CHẬM means slow in Vietnamese.",
        related: "slow"
    },

    "XA": {
        meaning: "XA means far or distant in Vietnamese.",
        related: "far, distant"
    },

    "GẦN": {
        meaning: "GẦN means near, nearby, or close in Vietnamese.",
        related: "near, nearby, close"
    },

    "RẺ": {
        meaning: "RẺ means cheap or inexpensive in Vietnamese.",
        related: "cheap"
    },

    "MẮC": {
        meaning: "MẮC means expensive or costly in Vietnamese.",
        related: "expensive, costly, pricey"
    },

    "CAO": {
        meaning: "CAO means tall when describing a person or high when describing a level, place, or object.",
        related: "tall, high"
    },

    "THẤP": {
        meaning: "THẤP means short when describing height, or low when describing a level or position.",
        related: "short, low"
    },

    "ĐẸP": {
        meaning: "ĐẸP means beautiful or pretty in Vietnamese.",
        related: "beautiful, pretty, lovely"
    },

    "XẤU": {
        meaning: "XẤU means ugly or unattractive in Vietnamese.",
        related: "ugly, unattractive"
    }

};


// =====================================================
// GAME STATE
// =====================================================

let current = 0;

let score = 0;

let matched = 0;

let draggedWord = null;


// =====================================================
// DOM
// =====================================================

const targetsEl =
document.getElementById("targets");

const wordsEl =
document.getElementById("words");

const messageEl =
document.getElementById("message");

const explanationEl =
document.getElementById("explanation");

const nextBtn =
document.getElementById("nextBtn");


// =====================================================
// SHUFFLE
// =====================================================

function shuffle(arr) {

    return [...arr].sort(
        () => Math.random() - 0.5
    );

}


// =====================================================
// TOTAL QUESTIONS
// =====================================================

const totalQuestions =
rounds.reduce(
    (sum, r) => sum + r.vi.length,
    0
);


// =====================================================
// LOAD ROUND
// =====================================================

function loadRound() {

    matched = 0;

    draggedWord = null;

    messageEl.textContent = "";

    messageEl.style.color = "";

    nextBtn.disabled = true;


    // Hide previous explanation

    explanationEl.classList.add("hidden");

    explanationEl.innerHTML = "";


    const round = rounds[current];

    const count = round.vi.length;


    document.getElementById("roundText").textContent =
        `Round ${current + 1} / ${rounds.length}`;


    document.getElementById("scoreText").textContent =
        `Score: ${score}`;


    targetsEl.style.gridTemplateColumns =
        `repeat(${count}, 1fr)`;


    wordsEl.style.gridTemplateColumns =
        `repeat(${count}, 1fr)`;


    targetsEl.innerHTML = "";

    wordsEl.innerHTML = "";


    // =================================================
    // VIETNAMESE TARGETS
    // =================================================

    round.vi.forEach(word => {

        const box = document.createElement("div");

        box.className = "target";

        box.textContent = word;

        box.dataset.vi = word;


        box.addEventListener("dragover", e => {

            e.preventDefault();

            box.classList.add("over");

        });


        box.addEventListener("dragleave", () => {

            box.classList.remove("over");

        });


        box.addEventListener("drop", e => {

            e.preventDefault();

            box.classList.remove("over");


            if (
                !draggedWord ||
                box.classList.contains("correct")
            ) {
                return;
            }


            const english =
                draggedWord.dataset.word;


            // =========================================
            // CORRECT
            // =========================================

            if (
                round.map[english] ===
                box.dataset.vi
            ) {

                box.classList.add("correct");

                draggedWord.classList.add("used");


                matched++;

                score++;


                messageEl.textContent =
                    "✅ Correct!";

                messageEl.style.color =
                    "#3b8b58";


                document.getElementById(
                    "scoreText"
                ).textContent =
                    `Score: ${score}`;


                // Show explanation

                showExplanation(
                    english,
                    box.dataset.vi
                );


                if (matched === count) {

                    messageEl.textContent =
                        "🎉 Perfect!";

                    nextBtn.disabled = false;

                }

            }


            // =========================================
            // WRONG
            // =========================================

            else {

                box.classList.add("wrong");


                setTimeout(() => {

                    box.classList.remove("wrong");

                }, 300);


                messageEl.textContent =
                    "❌ Try again!";

                messageEl.style.color =
                    "#c54d4d";

            }

        });


        targetsEl.appendChild(box);

    });


    // =================================================
    // ENGLISH WORDS
    // =================================================

    shuffle(round.en).forEach(word => {

        const card =
            document.createElement("div");


        card.className = "word";

        card.draggable = true;

        card.dataset.word = word;

        card.textContent = word;


        card.addEventListener(
            "dragstart",
            () => {

                draggedWord = card;

                card.classList.add(
                    "dragging"
                );

            }
        );


        card.addEventListener(
            "dragend",
            () => {

                card.classList.remove(
                    "dragging"
                );

            }
        );


        wordsEl.appendChild(card);

    });

}


// =====================================================
// SHOW EXPLANATION
// =====================================================

function showExplanation(
    english,
    vietnamese
) {

    const data =
        explanations[vietnamese];


    if (!data) {
        return;
    }


    explanationEl.innerHTML = `

        <strong>💡 Learn:</strong>

        <strong>${english}</strong>
        →
        <strong>${vietnamese}</strong>

        <br>

        ${data.meaning}

        <br>

        <span style="
            font-size:14px;
            color:#68788a;
        ">
            Related English words:
            ${data.related}
        </span>

    `;


    explanationEl.classList.remove(
        "hidden"
    );

}


// =====================================================
// NEXT ROUND
// =====================================================

nextBtn.addEventListener(
    "click",
    () => {

        current++;


        if (current < rounds.length) {

            loadRound();

        }

        else {

            document.getElementById(
                "gameScreen"
            ).style.display = "none";


            document.getElementById(
                "finalScreen"
            ).style.display = "block";


            document.getElementById(
                "finalScore"
            ).textContent =
                `Your score: ${score} / ${totalQuestions}`;

        }

    }
);


// =====================================================
// RESTART
// =====================================================

function restartGame() {

    current = 0;

    score = 0;

    matched = 0;

    draggedWord = null;


    document.getElementById(
        "finalScreen"
    ).style.display = "none";


    document.getElementById(
        "gameScreen"
    ).style.display = "block";


    loadRound();

}


// =====================================================
// START GAME
// =====================================================

loadRound();

</script>

</body>

</html>
