<style>

/* =========================================================
   THEME
========================================================= */

:root {

    --accent: #9669AA;

    --accent-dark: #714A82;

    --accent-light: #f6eef9;

    --accent-bg: #FAF5FB;

    --accent-border: #dfc9ec;

    --general-border: #ded7e2;

    --ink: #333333;

    --muted: #6b7280;

    --correct: #019b3f;

    --correct-light: #eaf3ff;

    --wrong: #d9536f;

    --wrong-light: #fff0f3;

    --white: #ffffff;

}


/* =========================================================
   RESET
========================================================= */

* {

    box-sizing: border-box;

    margin: 0;

    padding: 0;

}


/* =========================================================
   BODY
========================================================= */

body {

    margin: 0;

    padding: 28px 20px 45px;

            var(--accent-bg) 48%,
            var(--accent-light) 100%

}


/* =========================================================
   PAGE
========================================================= */

    margin: 0 auto;

}


/* =========================================================
   BACK BUTTON
========================================================= */

.back-btn-container {

    width: 100%;

    margin-bottom: 15px;

}


.back-btn {

    display: inline-flex;

    align-items: center;

    gap: 7px;

    padding: 9px 16px;

    background: var(--white);

    color: #555555;

    border: 1px solid var(--general-border);

    border-radius: 9px;

    text-decoration: none;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size: 22px;

    font-weight: 700;

    transition: 0.2s ease;

}


.back-btn:hover {

    background: var(--accent-light);

    color: var(--accent-dark);

    border-color: var(--accent-border);

    transform: translateX(-2px);

}


/* =========================================================
   MAIN CARD
========================================================= */

.card {

    position: relative;

    width: 100%;

    padding: 38px;

    background: var(--white);

    border: 1px solid var(--general-border);

    border-radius: 20px;

    box-shadow:
        0 14px 40px
        rgba(113, 74, 130, 0.10);

    overflow: hidden;

}


/* =========================================================
   ACCENT LINE ON CARD
========================================================= */

.card::before {

    content: "";

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 5px;

    background: var(--accent);

}


/* =========================================================
   TITLE AREA
========================================================= */

.title-area {

    text-align: center;

    margin-bottom: 28px;

}


.title-area h1 {

    margin: 0 0 8px;

    font-family:
        "Kalam",
        cursive;

    font-size: 44px;

    font-weight: 700;

    line-height: 1.2;

    color: var(--ink);

}


.title-area p {

    max-width: 720px;

    margin: 0 auto;

    color: var(--muted);

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size: 23px;

    line-height: 1.45;

}


/* =========================================================
   SCREEN
========================================================= */

.screen {

    display: none;

}


.screen.active {

    display: block;

}


/* =========================================================
   GAME BOX
========================================================= */

.game-box {

    width: 100%;

    padding: 25px;

    background: white;

    border: 1px solid var(--accent-border);

    border-radius: 16px;

}


/* =========================================================
   TOP BAR
========================================================= */

.topbar {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;

    margin-bottom: 15px;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size: 24px;

    font-weight: 700;

}


.question-count {

    color: var(--muted);

}


.score {

    color: var(--accent);

    font-size: 25px;

}


/* =========================================================
   PROGRESS BAR
========================================================= */

.progress-wrap {

    width: 100%;

    height: 9px;

    margin-bottom: 22px;

    background: #eee9f1;

    border-radius: 20px;

    overflow: hidden;

}


.progress {

    width: 0%;

    height: 100%;

    background: var(--accent);

    border-radius: 20px;

    transition: width 0.3s ease;

}


/* =========================================================
   QUESTION CARD
========================================================= */

.question-card {

    position: relative;

    overflow: hidden;

    width: 100%;

    min-height: 155px;

    display: flex;

    align-items: center;

    justify-content: center;

    margin: 20px 0;

    padding: 34px 25px;

    background: var(--white);

    border: 1px solid var(--accent-border);

    border-radius: 16px;

    color: var(--ink);

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size: 29px;

    font-weight: 700;

    line-height: 1.5;

    text-align: center;

}


/* =========================================================
   ACCENT LINE ON QUESTION CARD
========================================================= */

.question-card::before {

    content: "";

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 5px;

    background: var(--accent);

}


/* =========================================================
   OPTIONS
========================================================= */

.options {

    display: grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0, 1fr)
        );

    gap: 14px;

}


.option-btn {

    min-height: 68px;

    padding: 14px 18px;

    background: var(--white);

    color: var(--accent-dark);

    border: 2px solid var(--accent-border);

    border-radius: 12px;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size: 26px;

    font-weight: 700;

    cursor: pointer;

    transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;

}


.option-btn:hover:not(:disabled) {

    transform: translateY(-2px);

    border-color: var(--accent);

    background: var(--accent-light);

    box-shadow:
        0 6px 16px
        rgba(150, 105, 170, 0.12);

}


.option-btn:disabled {

    cursor: default;

}


/* =========================================================
   CORRECT
========================================================= */

.option-btn.correct {

    background: var(--correct-light);

    color: var(--correct);

    border-color: var(--correct);

}


/* =========================================================
   WRONG
========================================================= */

.option-btn.wrong {

    background: var(--wrong-light);

    color: var(--wrong);

    border-color: var(--wrong);

}


/* =========================================================
   RESULT MESSAGE
========================================================= */

.result-message {

    min-height: 70px;

    margin-top: 20px;

    text-align: center;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size: 27px;

    font-weight: 700;

    line-height: 1.5;

}


.correct-text {

    color: var(--correct);

}


.wrong-text {

    color: var(--wrong);

}


.explanation {

    display: block;

    margin-top: 6px;

    color: var(--muted);

    font-size: 23px;

    font-weight: 400;

    line-height: 1.5;

}


.correct-answer {

    display: block;

    margin-top: 5px;

    color: var(--accent-dark);

    font-size: 24px;

    font-weight: 700;

}


/* =========================================================
   NEXT BUTTON
========================================================= */

.next-area {

    display: flex;

    justify-content: center;

    margin-top: 5px;

}


.next-btn {

    display: none;

    font-size: 25px;

    font-weight: 700;

    transition: 0.2s ease;

}


.next-btn:hover {

    background: var(--accent-dark);

    border-color: var(--accent-dark);

    transform: translateY(-2px);

}


/* =========================================================
   FINAL / RESULTS
========================================================= */

#final {

    text-align: center;

    padding: 20px 10px 10px;

}


.final-title {

    margin: 0 0 15px;

    color: var(--ink);

    font-family:
        "Kalam",
        cursive;

    font-size: 43px;

    line-height: 1.25;

}


.final-message {

    max-width: 650px;

    margin: 0 auto 20px;

    color: var(--muted);

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size: 24px;

    line-height: 1.5;

}


.final-score {

    margin: 20px 0 10px;

    color: var(--accent);

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-weight: 700;

}


.final-percentage {

    margin-bottom: 20px;

    color: var(--muted);

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size: 28px;

    font-weight: 700;

}


/* =========================================================
   PLAY AGAIN
========================================================= */

.play-again-btn {

    min-width: 180px;

    padding: 13px 30px;

    background: var(--accent);

    color: var(--white);

        Calibri,
        'Segoe UI',
        sans-serif;

    font-size: 25px;

    font-weight: 700;

<script>

/* =========================================================
   APPROVED HEALTH VOCABULARY
========================================================= */

const vocabulary = [

    {
        en: "sick / illness",
        vi: "bệnh"
    },

    {
        en: "fever",

    },

    {

    {

    },

    {

    },

    {

    },

    {
        en: "pain / hurt",
        vi: "đau"
    },

    {
        en: "body ache",
        vi: "đau người"
    },

    {
        en: "headache",
        vi: "đau đầu"
    },

    {
        en: "arm / hand pain",
        vi: "đau tay"
    },

    {
        en: "leg / foot pain",
        vi: "đau chân"
    },

    {
        en: "stomachache",
        vi: "đau bụng"
    },

    {
        en: "head",

    },

    {

        vi: "tay"
    },

    {
        en: "leg / foot",
        vi: "chân"
    },

    {
        en: "stomach / belly",
        vi: "bụng"
    },

    {
        en: "body / person",

    }

];


/* =========================================================
   QUESTION DATABASE
========================================================= */

const database = [

    {
        q:
            "You are not feeling well. You are ______.",

        c: "bệnh",

        e:
            "Bệnh means sick or illness."
    },


    {
        q:
            "Your body temperature is high. You have ______.",

        c: "sốt",

        e:
            "Sốt means fever."
    },


    {
        q:
            "You have very little energy. You feel ______.",

        c: "mệt",

        e:
            "Mệt means tired."
    },


    {
        q:
            "You have a flu or cold. You have ______.",

        c: "cảm",

        e:
            "Cảm means flu or cold."
    },


    {
        q:
            "You make a sound from your throat because you are sick. You have a ______.",

        c: "ho",

        e:
            "Ho means cough."
    },


    {
        q:
            "Your head hurts. You have a ______.",

        c: "đau đầu",

        e:
            "Đau đầu means headache."
    },


    {
        q:
            "Something hurts. You have ______.",

        c: "đau",

        e:
            "Đau means pain or hurt."
    },


    {
        q:
            "Your whole body hurts. You have ______.",

        c: "đau người",

        e:
            "Đau người means body ache."
    },


    {
        q:
            "You have pain in your head. You have ______.",

        c: "đau đầu",

        e:
            "Đau đầu means headache."
    },


    {
        q:
            "Your arm or hand hurts. You have ______.",

        c: "đau tay",

        e:
            "Đau tay means arm or hand pain."
    },


    {
        q:
            "Your leg or foot hurts. You have ______.",

        c: "đau chân",

        e:
            "Đau chân means leg or foot pain."
    },


    {
        q:
            "Your stomach hurts. You have ______.",

        c: "đau bụng",

        e:
            "Đau bụng means stomachache."
    },


    {
        q:
            "The part of your body above your neck is your ______.",

        c: "đầu",

        e:
            "Đầu means head."
    },


    {
        q:
            "You use your ______ to hold things.",

        c: "tay",

        e:
            "Tay means hand or arm."
    },


    {
        q:
            "You use your ______ to walk.",

        c: "chân",

        e:
            "Chân means leg or foot."
    },


    {
        q:
            "The part of your body where your stomach is is your ______.",

        c: "bụng",

        e:
            "Bụng means stomach or belly."
    },


    {
        q:
            "Your head, arms, legs, and stomach are parts of your ______.",

        c: "người",

        e:
            "Người can mean body or person."
    },


    {
        q:
            "You are sick and your whole body hurts. You have ______.",

        c: "đau người",

        e:
            "Đau người means body ache."
    },


    {
        q:
            "You are sick and the pain is in your stomach. You have ______.",

        c: "đau bụng",

        e:
            "Đau bụng means stomachache."
    },


    {
        q:
            "You are sick and the pain is in your arm or hand. You have ______.",

        c: "đau tay",

        e:
            "Đau tay means arm or hand pain."
    }

];


/* =========================================================
   GAME SETTINGS
========================================================= */

const TOTAL_QUESTIONS = 20;


/* =========================================================
   STATE
========================================================= */

let questions = [];

let currentQuestion = 0;

let score = 0;

let answered = false;


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array) {

    const arr = [...array];

    for (
        let i = arr.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            arr[i],
            arr[j]
        ] = [
            arr[j],
            arr[i]
        ];

    }

    return arr;

}


/* =========================================================
   GET OPTIONS
========================================================= */

function getOptions(correctAnswer) {

    const otherWords =
        vocabulary
            .map(
                item => item.vi
            )
            .filter(
                word =>
                    word !== correctAnswer
            );


    const distractors =
        shuffle(otherWords)
            .slice(0, 3);


    return shuffle([

        correctAnswer,

        ...distractors

    ]);

}


/* =========================================================
   START GAME
========================================================= */

function startGame() {

    questions =
        shuffle(database)
            .slice(
                0,
                TOTAL_QUESTIONS
            );


    currentQuestion = 0;

    score = 0;

    answered = false;


    document
        .getElementById("game")
        .classList.add("active");


    document
        .getElementById("final")
        .classList.remove("active");


    document
        .getElementById("score")
        .textContent = "0";


    document
        .getElementById("totalQuestions")
        .textContent =
        TOTAL_QUESTIONS;


    loadQuestion();

}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion() {

    answered = false;


    const current =
        questions[currentQuestion];


    document
        .getElementById("questionNumber")
        .textContent =
        currentQuestion + 1;


    /*
       Progress:
       Question 1 = 0%
       Final question = 100%
    */

    const progress =
        (
            currentQuestion /
            (TOTAL_QUESTIONS - 1)
        ) * 100;


    document
        .getElementById("progress")
        .style.width =
        Math.max(
            0,
            progress
        ) + "%";


    document
        .getElementById("questionText")
        .textContent =
        current.q;


    const resultText =
        document.getElementById(
            "resultText"
        );


    resultText.innerHTML = "";

    resultText.className =
        "result-message";


    const nextBtn =
        document.getElementById(
            "nextBtn"
        );


    nextBtn.style.display =
        "none";


    nextBtn.textContent =
        currentQuestion ===
        TOTAL_QUESTIONS - 1

            ? "Finish 🎉"

            : "Next →";


    const container =
        document.getElementById(
            "optionsContainer"
        );


    container.innerHTML = "";


    const options =
        getOptions(
            current.c
        );


    options.forEach(
        option => {

            const btn =
                document.createElement(
                    "button"
                );


            btn.className =
                "option-btn";


            btn.textContent =
                option;


            btn.onclick =
                () =>
                    handleAnswer(
                        btn,
                        option
                    );


            container.appendChild(
                btn
            );

        }
    );

}


/* =========================================================
   HANDLE ANSWER
========================================================= */

function handleAnswer(
    button,
    selected
) {

    /*
       One attempt only.
    */

    if (answered) {

        return;

    }


    answered = true;


    const current =
        questions[currentQuestion];


    const resultText =
        document.getElementById(
            "resultText"
        );


    const allButtons =
        document.querySelectorAll(
            ".option-btn"
        );


    /*
       Lock every answer.
    */

    allButtons.forEach(
        btn => {

            btn.disabled = true;

        }
    );


    /* =====================================================
       CORRECT
    ====================================================== */

    if (
        selected === current.c
    ) {

        button.classList.add(
            "correct"
        );


        score++;


        document
            .getElementById("score")
            .textContent =
            score;


        resultText.innerHTML = `

            ✓ Correct!

            <span class="explanation">

                ${current.e}

            </span>

        `;


        resultText.className =
            "result-message correct-text";

    }


    /* =====================================================
       WRONG
    ====================================================== */

    else {

        /*
           Selected answer = RED
        */

        button.classList.add(
            "wrong"
        );


        /*
           Correct answer = GREEN
        */

        allButtons.forEach(
            btn => {

                if (
                    btn.textContent ===
                    current.c
                ) {

                    btn.classList.add(
                        "correct"
                    );

                }

            }
        );


        resultText.innerHTML = `

            ✕ Incorrect.

            <span class="correct-answer">

                Correct answer:
                ${current.c}

            </span>

            <span class="explanation">

                ${current.e}

            </span>

        `;


        resultText.className =
            "result-message wrong-text";

    }


    /*
       Show Next only after answering.
    */

    document
        .getElementById("nextBtn")
        .style.display =
        "inline-block";

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion() {

    if (!answered) {

        return;

    }


    currentQuestion++;


    if (
        currentQuestion <
        TOTAL_QUESTIONS
    ) {

        loadQuestion();

    }

    else {

        finishGame();

    }

}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame() {

    document
        .getElementById("game")
        .classList.remove(
            "active"
        );


    document
        .getElementById("final")
        .classList.add(
            "active"
        );


    document
        .getElementById("progress")
        .style.width =
        "100%";


    document
        .getElementById("finalScore")
        .textContent =
        score +
        " / " +
        TOTAL_QUESTIONS;


    const percentage =
        Math.round(
            score /
            TOTAL_QUESTIONS *
            100
        );


    document
        .getElementById("finalPercentage")
        .textContent =
        percentage +
        "%";


    let message;


    if (
        percentage >= 90
    ) {

        message =
            "🏆 Excellent! You know these health words very well.";

    }

    else if (
        percentage >= 70
    ) {

        message =
            "🎉 Good job! Keep practicing.";

    }

    else if (
        percentage >= 50
    ) {

        message =
            "👍 Good work! You're getting better.";

    }

    else {

        message =
            "📚 Keep practicing these useful health words.";

    }


    document
        .getElementById("finalMessage")
        .textContent =
        message;

}


/* =========================================================
   RESTART
========================================================= */

function restartGame() {

    startGame();

}


/* =========================================================
   INITIALIZE
========================================================= */

startGame();

</script>
