<style>

/* =========================================================

========================================================= */

/* =========================================================
   RESET
========================================================= */

}


/* =========================================================

========================================================= */

/* =========================================================
   PAGE
========================================================= */

========================================================= */

.word-grid {

    display:

    grid-template-columns:

            minmax(

    gap:

   WORD BUTTON
========================================================= */

    font-size:
        28px;

    font-weight:
        700;

    cursor:
        pointer;

    transition:

        background 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;

    user-select:
        none;

}


.word-btn:hover:not(:disabled) {

    background:

    border-color:

    transform:
        translateY(-3px);

    box-shadow:

    cursor:

/* =========================================================
   CORRECT
========================================================= */

.word-btn.correct {

    background:
        var(--correct-light);

    color:
        var(--correct);

    border-color:
        var(--correct);

}


/* =========================================================
   WRONG
========================================================= */

        var(--wrong);

/* =========================================================
   CORRECT ANSWER HIGHLIGHT
========================================================= */

.word-btn.answer-highlight {

    background:
        var(--correct-light);

    color:

    border-color:
        var(--correct);

.result-message {

/* =========================================================

========================================================= */

.next-btn {

    display:
        flex;

    width:

    margin:

    padding:

        var(--accent);

        #ffffff;

    border:
        2px solid
        var(--accent);

    border-radius:
        999px;

/* =========================================================

#final {

#final.active {

    font-size:

    font-weight:

}


.final-message {

    color:

.final-score {

.final-percentage {

/* =========================================================

========================================================= */

.start-btn {

    min-width:
        190px;

    margin-top:

/* =========================================================
   SCREEN
========================================================= */

.screen {

    display:
        none;

}


.screen.active {

    display:

<div class="page">


<!-- =========================================================
     BACK
========================================================= -->

<div class="lobby-btn-container">

        class="lobby-btn"

<script>

/* =========================================================
   APPROVED VOCABULARY
========================================================= */

const vocabulary = [

    "bệnh",

    "sốt",

    "mệt",

    "cảm",

    "ho",

    "đau đầu",

    "đau",

    "đau người",

    "đau tay",

    "đau chân",

    "đau bụng",

    "đầu",

    "tay",

    "chân",

    "bụng",

    "người"

];


/* =========================================================
   QUESTION DATABASE
========================================================= */

const database = [

    {
        words:[
            "đầu",
            "tay",
            "chân",
            "sốt"
        ],

        correct:
            "sốt",

        explanation:
            "Sốt is a health symptom. Đầu, tay, and chân are body parts."
    },


    {
        words:[
            "đầu",
            "bụng",
            "người",
            "ho"
        ],

        correct:
            "ho",

        explanation:
            "Ho is a health symptom. Đầu, bụng, and người are body-related words."
    },


    {
        words:[
            "tay",
            "chân",
            "bụng",
            "mệt"
        ],

        correct:
            "mệt",

        explanation:
            "Mệt describes how you feel. Tay, chân, and bụng are body parts."
    },


    {
        words:[
            "đầu",
            "tay",
            "bụng",
            "cảm"
        ],

        correct:
            "cảm",

        explanation:
            "Cảm is a health condition. Đầu, tay, and bụng are body parts."
    },


    {
        words:[
            "đầu",
            "chân",
            "người",
            "bệnh"
        ],

        correct:
            "bệnh",

        explanation:
            "Bệnh means sick or illness. Đầu, chân, and người are body-related words."
    },


    {
        words:[
            "đầu",
            "tay",
            "chân",
            "đau"
        ],

        correct:
            "đau",

        explanation:
            "Đau means pain or hurt. Đầu, tay, and chân are body parts."
    },


    {
        words:[
            "bụng",
            "tay",
            "đầu",
            "đau người"
        ],

        correct:
            "đau người",

        explanation:
            "Đau người describes body ache. Bụng, tay, and đầu are body parts."
    },


    {
        words:[
            "đầu",
            "tay",
            "chân",
            "đau đầu"
        ],

        correct:
            "đau đầu",

        explanation:
            "Đau đầu means headache. Đầu, tay, and chân are body parts."
    },


    {
        words:[
            "đầu",
            "tay",
            "bụng",
            "đau tay"
        ],

        correct:
            "đau tay",

        explanation:
            "Đau tay means arm or hand pain. Đầu, tay, and bụng are body parts."
    },


    {
        words:[
            "đầu",
            "chân",
            "bụng",
            "đau chân"
        ],

        correct:
            "đau chân",

        explanation:
            "Đau chân means leg or foot pain. Đầu, chân, and bụng are body parts."
    },


    {
        words:[

/* =========================================================
   GAME SETTINGS
========================================================= */

const TOTAL_QUESTIONS =
    20;


/* =========================================================
   GAME STATE
========================================================= */

let questions = [];

let currentQuestion = 0;

let score = 0;

let answered = false;


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    const arr =
        [...array];


    for(
        let i =
            arr.length - 1;

        i > 0;

        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] =
        [
            arr[j],
            arr[i]
        ];

    }


    return arr;

}


/* =========================================================
   INITIALIZE GAME
========================================================= */

function initializeGame(){

    questions =
        shuffle(database);


    currentQuestion =
        0;


    score =
        0;


    document
        .getElementById("score")
        .textContent =
        "0";


    document
        .getElementById("totalQuestions")
        .textContent =
        TOTAL_QUESTIONS;


    document
        .getElementById("game")
        .classList.add(
            "active"
        );


    document
        .getElementById("final")
        .classList.remove(
            "active"
        );


    loadQuestion();

}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion(){

    answered =
        false;


    const question =
        questions[
            currentQuestion
        ];


    document
        .getElementById("questionNumber")
        .textContent =
        currentQuestion + 1;


    document
        .getElementById("progress")
        .style.width =
        (
            (
                currentQuestion + 1
            ) /
            TOTAL_QUESTIONS *
            100
        ) + "%";


    document
        .getElementById("resultText")
        .innerHTML =
        "";


    document
        .getElementById("resultText")
        .className =
        "result-message";


    const nextBtn =
        document.getElementById(
            "nextBtn"
        );


    nextBtn.style.display =
        "none";


    nextBtn.textContent =
        currentQuestion ===
        TOTAL_QUESTIONS - 1

            ? "Finish 🎉"

            : "Next →";


    const grid =
        document.getElementById(
            "wordGrid"
        );


    grid.innerHTML =
        "";


    const words =
        shuffle(
            question.words
        );


    words.forEach(
        word => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "word-btn";


            button.textContent =
                word;


            button.onclick =
                () =>
                    handleAnswer(
                        button,
                        word
                    );


            grid.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   HANDLE ANSWER
========================================================= */

function handleAnswer(
    button,
    selected
){

    /*
       One attempt only.
    */

    if(answered){

        return;

    }


    answered =
        true;


    const question =
        questions[
            currentQuestion
        ];


    const resultText =
        document.getElementById(
            "resultText"
        );


    const allButtons =
        document.querySelectorAll(
            ".word-btn"
        );


    /*
       Lock all answers.
    */

    allButtons.forEach(
        btn => {

            btn.disabled =
                true;

        }
    );


    /* =====================================================
       CORRECT
    ===================================================== */

    if(
        selected ===
        question.correct
    ){

        button.classList.add(
            "correct"
        );


        score++;


        document
            .getElementById("score")
            .textContent =
            score;


        resultText.innerHTML =

            `
            ✓ Correct!

            <span class="explanation">
                ${question.explanation}
            </span>
            `;


        resultText.className =
            "result-message correct-text";

    }


    /* =====================================================
       WRONG
    ===================================================== */

    else{

        /*
           Selected answer = RED
        */

        button.classList.add(
            "wrong"
        );


        /*
           Correct answer = GREEN
        */

        allButtons.forEach(
            btn => {

                if(
                    btn.textContent ===
                    question.correct
                ){

                    btn.classList.add(
                        "answer-highlight"
                    );

                }

            }
        );


        resultText.innerHTML =

            `
            ✕ Incorrect.

            <span class="correct-answer">
                Correct answer: ${question.correct}
            </span>

            <span class="explanation">
                ${question.explanation}
            </span>
            `;


        resultText.className =
            "result-message wrong-text";

    }


    /*
       Show Next only after answering.
    */

    document
        .getElementById("nextBtn")
        .style.display =
        "flex";

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion(){

    if(!answered){

        return;

    }


    currentQuestion++;


    if(
        currentQuestion <
        TOTAL_QUESTIONS
    ){

        loadQuestion();

    }

    else{

        finishGame();

    }

}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

    document
        .getElementById("game")
        .classList.remove(
            "active"
        );


    document
        .getElementById("final")
        .classList.add(
            "active"
        );


    document
        .getElementById("finalScore")
        .textContent =

        score +
        " / " +
        TOTAL_QUESTIONS;


    const percentage =
        Math.round(
            score /
            TOTAL_QUESTIONS *
            100
        );


    document
        .getElementById("finalPercentage")
        .textContent =

        percentage +
        "%";


    let message;


    if(
        percentage >=
        90
    ){

        message =
            "🏆 Excellent! You can identify different health words very well.";

    }

    else if(
        percentage >=
        70
    ){

        message =
            "🎉 Good job! Keep practicing.";

    }

    else{

        message =
            "📚 Keep practicing these health words.";

    }


    document
        .getElementById("finalMessage")
        .textContent =
        message;


    if (
        typeof trackGameComplete ===
        "function"
    ) {
        trackGameComplete(
            "Health - Game 4",
            score,
            TOTAL_QUESTIONS
        );
    }

}

/* =========================================================
   RESTART
========================================================= */

function restartGame(){

    initializeGame();

}


/* =========================================================
   BACK TO LOBBY
========================================================= */

function backToLobby(){

    window.location.href =
        "../../category.html?category=Health";

}


/* =========================================================
   START
========================================================= */

window.trackGameStart(
        "Health - Game 4"
    );

initializeGame();
