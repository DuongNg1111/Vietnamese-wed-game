<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Match English with Vietnamese - Health</title>

<meta
    name="game-title"
    content="Match English with Vietnamese"
/>

<meta
    name="game-description"
    content="Match English health words with their correct Vietnamese meanings."
/>

<meta
    name="game-icon"
    content="🔤"
/>

<meta
    name="game-explanation"
    content="true"
/>

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #e8f3ff,
            #f7fbff
        );

    min-height:100vh;

    padding:20px;

    color:#333;
}


/* =========================================================
   CONTAINER
========================================================= */

.container{

    width:100%;
    max-width:950px;

    margin:0 auto;

    background:white;

    border-radius:22px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.12);

    padding:30px;

}


/* =========================================================
   BACK TO LOBBY
========================================================= */

.back-btn-container{

    text-align:left;

    margin-bottom:20px;

}

.back-btn{

    display:inline-block;

    padding:9px 16px;

    background:white;

    color:#555;

    border:2px solid #ddd;

    border-radius:10px;

    text-decoration:none;

    font-weight:bold;

    transition:.2s;

}

.back-btn:hover{

    background:#f0f0f0;

    transform:translateY(-2px);

}


/* =========================================================
   INTRO
========================================================= */

#introScreen{

    text-align:center;

    padding:10px;

}

.game-icon{

    font-size:80px;

    margin-bottom:10px;

}

#introScreen h1{

    color:#1976d2;

    font-size:44px;

    margin-bottom:15px;

}

.intro-description{

    max-width:620px;

    margin:0 auto 25px;

    font-size:28px;

    line-height:1.6;

    color:#666;

}


/* =========================================================
   GAME INFO
========================================================= */

.game-info{

    display:flex;

    justify-content:center;

    gap:15px;

    flex-wrap:wrap;

    margin:25px 0;

}

.game-info div{

    background:#f5f9ff;

    border:1px solid #d9e8ff;

    border-radius:12px;

    padding:13px 18px;

    color:#555;

    font-size:26px;

}


/* =========================================================
   BUTTON
========================================================= */

.main-btn{

    margin-top:10px;

    padding:14px 35px;

    border:none;

    background:#2196f3;

    color:white;

    border-radius:12px;

    cursor:pointer;

    font-size:29px;

    font-weight:bold;

    transition:.25s;

}

.main-btn:hover{

    background:#1976d2;

    transform:translateY(-2px);

}


/* =========================================================
   GAME AREA
========================================================= */

#gameArea{

    display:none;

}

.game-title{

    text-align:center;

    color:#1976d2;

    margin-bottom:20px;

    font-size:40px;

}


/* =========================================================
   INFO
========================================================= */

.info{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:15px;

    margin-bottom:18px;

}

.infoBox{

    background:#f5f9ff;

    border-radius:15px;

    padding:14px;

    text-align:center;

    font-weight:bold;

    box-shadow:
        0 5px 15px rgba(0,0,0,.06);

}


/* =========================================================
   PROGRESS
========================================================= */

.progressWrap{

    width:100%;

    height:14px;

    background:#ddd;

    border-radius:30px;

    overflow:hidden;

    margin-bottom:25px;

}

.progressBar{

    height:100%;

    width:100%;

    background:
        linear-gradient(
            90deg,
            #2196f3,
            #64b5f6
        );

    transition:width 1s linear;

}

.progressBar.timeout{

    background:#f44336;

}


/* =========================================================
   COLUMNS
========================================================= */

.columns{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:25px;

}

.column h2{

    text-align:center;

    margin-bottom:15px;

    color:#1976d2;

}


/* =========================================================
   CARDS
========================================================= */

.card{

    background:white;

    border:2px solid #d9e8ff;

    border-radius:15px;

    padding:18px;

    margin-bottom:12px;

    text-align:center;

    cursor:pointer;

    font-size:1.525rem;

    transition:.25s;

    user-select:none;

    box-shadow:
        0 5px 15px rgba(0,0,0,.06);

}

.card:hover{

    transform:translateY(-3px);

    background:#eef6ff;

}

.card.selected{

    border-color:#2196f3;

    background:#d8ecff;

}

.card.correct{

    background:#4caf50 !important;

    color:white;

    border-color:#4caf50;

    cursor:default;

    pointer-events:none;

}

.card.wrong{

    background:#f44336 !important;

    color:white;

}


/* =========================================================
   FINISH
========================================================= */

.finished{

    text-align:center;

    display:none;

    animation:fade .5s;

}

.finished h2{

    color:#1976d2;

    margin-bottom:15px;

    font-size:42px;

}

.finished p{

    font-size:1.675rem;

    margin:10px 0;

}

.finish-buttons{

    margin-top:20px;

    display:flex;

    justify-content:center;

}

.play-again{

    padding:14px 30px;

    border:none;

    background:#2196f3;

    color:white;

    border-radius:12px;

    cursor:pointer;

    font-size:28px;

    font-weight:bold;

}

.play-again:hover{

    background:#1976d2;

}


/* =========================================================
   ANIMATION
========================================================= */

@keyframes fade{

    from{

        opacity:0;

        transform:translateY(15px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    body{

        padding:15px;

    }

    .container{

        padding:25px 20px;

    }

    #introScreen h1{

        font-size:39px;

    }

    .intro-description{

        font-size:26px;

    }

    .game-info{

        flex-direction:column;

        align-items:center;

    }

    .game-info div{

        width:100%;

    }

    .info{

        grid-template-columns:1fr;

    }

    .columns{

        grid-template-columns:1fr;

    }

    .card{

        font-size:1.425rem;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- =========================================================
     BACK TO LOBBY
========================================================= -->

<div class="back-btn-container">

    <a
        href="../../category.html?category=Health"
        class="back-btn"
    >
        ⬅ Back
    </a>

</div>


<!-- =========================================================
     INTRO
========================================================= -->

<div id="introScreen">

    <div class="game-icon">
        🔤
    </div>

    <h1>
        Match English with Vietnamese
    </h1>

    <p class="intro-description">

        Match each English health word
        with its correct Vietnamese meaning.

    </p>


    <div class="game-info">

        <div>
            📝 <strong>9 Rounds</strong>
        </div>

        <div>
            🔤 <strong>3 Pairs / Round</strong>
        </div>

        <div>
            ⏱️ <strong>10 Seconds</strong>
        </div>

    </div>


    <button
        class="main-btn"
        id="startBtn"
    >
        Start Game →
    </button>

</div>


<!-- =========================================================
     GAME AREA
========================================================= -->

<div id="gameArea">

    <h1 class="game-title">

        🔤 Match English with Vietnamese

    </h1>


    <div class="info">


        <div class="infoBox">

            Round

            <br>

            <span id="round">
                1
            </span>

            / 9

        </div>


        <div class="infoBox">

            Score

            <br>

            <span id="score">
                0
            </span>

            / 27

        </div>


        <div class="infoBox">

            Time Left

            <br>

            <span id="time">
                10
            </span>

            s

        </div>

    </div>


    <div class="progressWrap">

        <div
            class="progressBar"
            id="progress"
        ></div>

    </div>


    <div class="columns">


        <!-- =================================================
             ENGLISH
        ================================================== -->

        <div class="column">

            <h2>
                English
            </h2>

            <div id="englishList"></div>

        </div>


        <!-- =================================================
             VIETNAMESE
        ================================================== -->

        <div class="column">

            <h2>
                Vietnamese
            </h2>

            <div id="vietnameseList"></div>

        </div>


    </div>

</div>


<!-- =========================================================
     FINISH SCREEN
========================================================= -->

<div
    class="finished"
    id="finishScreen"
>

    <div class="game-icon">
        🎉
    </div>

    <h2>
        Game Finished!
    </h2>


    <p>

        <strong>Final Score:</strong>

        <span id="finalScore"></span>

    </p>


    <p>

        <strong>Percentage:</strong>

        <span id="percent"></span>

    </p>


    <p id="message"></p>


    <div class="finish-buttons">

        <button
            class="play-again"
            id="playAgainBtn"
        >
            Play Again →
        </button>

    </div>

</div>


</div>


<script>

/* =========================================================
   HEALTH VOCABULARY
   ONLY APPROVED VOCABULARY
========================================================= */

const vocabulary = [

    /* =====================================================
       HEALTH SYMPTOMS
    ===================================================== */

    {
        id: 1,
        category: "symptoms",
        en: "sick / illness",
        vi: "bệnh"
    },

    {
        id: 2,
        category: "symptoms",
        en: "fever",
        vi: "sốt"
    },

    {
        id: 3,
        category: "symptoms",
        en: "tired",
        vi: "mệt"
    },

    {
        id: 4,
        category: "symptoms",
        en: "flu / cold",
        vi: "cảm"
    },

    {
        id: 5,
        category: "symptoms",
        en: "cough",
        vi: "ho"
    },

    {
        id: 6,
        category: "symptoms",
        en: "headache",
        vi: "nhức đầu"
    },

    {
        id: 7,
        category: "symptoms",
        en: "pain / hurt",
        vi: "đau"
    },

    {
        id: 8,
        category: "symptoms",
        en: "body ache",
        vi: "đau người"
    },

    {
        id: 9,
        category: "symptoms",
        en: "headache",
        vi: "đau đầu"
    },

    {
        id: 10,
        category: "symptoms",
        en: "arm / hand pain",
        vi: "đau tay"
    },

    {
        id: 11,
        category: "symptoms",
        en: "leg / foot pain",
        vi: "đau chân"
    },

    {
        id: 12,
        category: "symptoms",
        en: "stomachache",
        vi: "đau bụng"
    },


    /* =====================================================
       BODY PARTS
    ===================================================== */

    {
        id: 13,
        category: "body parts",
        en: "head",
        vi: "đầu"
    },

    {
        id: 14,
        category: "body parts",
        en: "hand / arm",
        vi: "tay"
    },

    {
        id: 15,
        category: "body parts",
        en: "leg / foot",
        vi: "chân"
    },

    {
        id: 16,
        category: "body parts",
        en: "stomach / belly",
        vi: "bụng"
    },

    {
        id: 17,
        category: "body parts",
        en: "body / person",
        vi: "người"
    }

];


/* =========================================================
   GAME SETTINGS
========================================================= */

const TOTAL_ROUNDS = 9;

const PAIRS_PER_ROUND = 3;

const TIME_PER_ROUND = 10;

const TOTAL_POINTS =
    TOTAL_ROUNDS *
    PAIRS_PER_ROUND;


/* =========================================================
   GAME STATE
========================================================= */

let round = 1;

let score = 0;

let timer = null;

let timeLeft =
    TIME_PER_ROUND;

let currentPairs = [];

let selectedEnglish = null;

let selectedVietnamese = null;

let matchedCount = 0;

let roundFinished = false;


/* =========================================================
   DOM
========================================================= */

const introScreen =
    document.getElementById(
        "introScreen"
    );

const gameArea =
    document.getElementById(
        "gameArea"
    );

const finishScreen =
    document.getElementById(
        "finishScreen"
    );

const startBtn =
    document.getElementById(
        "startBtn"
    );

const playAgainBtn =
    document.getElementById(
        "playAgainBtn"
    );

const roundEl =
    document.getElementById(
        "round"
    );

const scoreEl =
    document.getElementById(
        "score"
    );

const timeEl =
    document.getElementById(
        "time"
    );

const progressEl =
    document.getElementById(
        "progress"
    );

const englishList =
    document.getElementById(
        "englishList"
    );

const vietnameseList =
    document.getElementById(
        "vietnameseList"
    );

const finalScoreEl =
    document.getElementById(
        "finalScore"
    );

const percentEl =
    document.getElementById(
        "percent"
    );

const messageEl =
    document.getElementById(
        "message"
    );


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    const result =
        [...array];

    for(
        let i = result.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        [
            result[i],
            result[j]
        ] =
        [
            result[j],
            result[i]
        ];

    }

    return result;

}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    clearInterval(timer);

    round = 1;

    score = 0;

    currentPairs = [];

    selectedEnglish = null;

    selectedVietnamese = null;

    matchedCount = 0;

    roundFinished = false;

    scoreEl.textContent =
        "0";

    introScreen.style.display =
        "none";

    finishScreen.style.display =
        "none";

    gameArea.style.display =
        "block";

    loadRound();

}


/* =========================================================
   LOAD ROUND
========================================================= */

function loadRound(){

    clearInterval(timer);

    roundFinished = false;

    matchedCount = 0;

    selectedEnglish = null;

    selectedVietnamese = null;


    roundEl.textContent =
        round;


    timeLeft =
        TIME_PER_ROUND;

    timeEl.textContent =
        timeLeft;


    progressEl.style.width =
        "100%";

    progressEl.classList.remove(
        "timeout"
    );


    /* =====================================================
       RANDOM 3 VOCABULARY PAIRS
    ===================================================== */

    currentPairs =
        shuffle(vocabulary)
        .slice(
            0,
            PAIRS_PER_ROUND
        );


    /* =====================================================
       SHUFFLE BOTH SIDES
    ===================================================== */

    const english =
        shuffle(currentPairs);

    const vietnamese =
        shuffle(currentPairs);


    englishList.innerHTML =
        "";

    vietnameseList.innerHTML =
        "";


    /* =====================================================
       ENGLISH CARDS
    ===================================================== */

    english.forEach(pair => {

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "card";

        card.textContent =
            pair.en;

        /*
            Use unique ID instead of
            English text.

            This prevents the two
            "headache" entries from
            being confused.
        */

        card.dataset.id =
            pair.id;

        card.addEventListener(
            "click",
            function(){

                selectEnglish(card);

            }
        );

        englishList.appendChild(
            card
        );

    });


    /* =====================================================
       VIETNAMESE CARDS
    ===================================================== */

    vietnamese.forEach(pair => {

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "card";

        card.textContent =
            pair.vi;

        card.dataset.id =
            pair.id;

        card.addEventListener(
            "click",
            function(){

                selectVietnamese(card);

            }
        );

        vietnameseList.appendChild(
            card
        );

    });


    /* =====================================================
       TIMER
    ===================================================== */

    timer =
        setInterval(
            function(){

                timeLeft--;

                timeEl.textContent =
                    timeLeft;


                progressEl.style.width =
                    (
                        timeLeft /
                        TIME_PER_ROUND *
                        100
                    ) + "%";


                if(
                    timeLeft <= 0
                ){

                    clearInterval(
                        timer
                    );

                    handleTimeout();

                }

            },
            1000
        );

}


/* =========================================================
   SELECT ENGLISH
========================================================= */

function selectEnglish(card){

    if(roundFinished)
        return;


    if(
        card.classList.contains(
            "correct"
        )
    ){

        return;

    }


    /*
       Remove selection from
       other unmatched English cards.
    */

    document
        .querySelectorAll(
            "#englishList .card"
        )
        .forEach(
            function(other){

                if(
                    !other.classList.contains(
                        "correct"
                    )
                ){

                    other.classList.remove(
                        "selected"
                    );

                }

            }
        );


    selectedEnglish =
        card;

    card.classList.add(
        "selected"
    );


    checkMatch();

}


/* =========================================================
   SELECT VIETNAMESE
========================================================= */

function selectVietnamese(card){

    if(roundFinished)
        return;


    if(
        card.classList.contains(
            "correct"
        )
    ){

        return;

    }


    /*
       Remove selection from
       other unmatched Vietnamese cards.
    */

    document
        .querySelectorAll(
            "#vietnameseList .card"
        )
        .forEach(
            function(other){

                if(
                    !other.classList.contains(
                        "correct"
                    )
                ){

                    other.classList.remove(
                        "selected"
                    );

                }

            }
        );


    selectedVietnamese =
        card;

    card.classList.add(
        "selected"
    );


    checkMatch();

}


/* =========================================================
   CHECK MATCH
========================================================= */

function checkMatch(){

    if(
        !selectedEnglish ||
        !selectedVietnamese
    ){

        return;

    }


    /*
       IMPORTANT:

       Match using ID, not English text.

       This allows:

       headache → nhức đầu

       headache → đau đầu

       to exist without confusion.
    */

    const englishId =
        Number(
            selectedEnglish.dataset.id
        );

    const vietnameseId =
        Number(
            selectedVietnamese.dataset.id
        );


    /* =====================================================
       CORRECT
    ===================================================== */

    if(
        englishId === vietnameseId
    ){

        selectedEnglish.classList.remove(
            "selected"
        );

        selectedVietnamese.classList.remove(
            "selected"
        );


        selectedEnglish.classList.add(
            "correct"
        );

        selectedVietnamese.classList.add(
            "correct"
        );


        score++;

        matchedCount++;


        scoreEl.textContent =
            score;


        selectedEnglish =
            null;

        selectedVietnamese =
            null;


        /*
           All 3 pairs matched.
        */

        if(
            matchedCount ===
            PAIRS_PER_ROUND
        ){

            clearInterval(timer);

            endRound();

        }

    }


    /* =====================================================
       WRONG
    ===================================================== */

    else{

        const englishCard =
            selectedEnglish;

        const vietnameseCard =
            selectedVietnamese;


        englishCard.classList.add(
            "wrong"
        );

        vietnameseCard.classList.add(
            "wrong"
        );


        /*
           Reset selections immediately
           so the player cannot use the
           same wrong pair again while
           the animation is running.
        */

        selectedEnglish =
            null;

        selectedVietnamese =
            null;


        setTimeout(
            function(){

                englishCard.classList.remove(
                    "wrong",
                    "selected"
                );

                vietnameseCard.classList.remove(
                    "wrong",
                    "selected"
                );

            },
            500
        );

    }

}


/* =========================================================
   TIME OUT
========================================================= */

function handleTimeout(){

    if(roundFinished)
        return;


    roundFinished = true;


    progressEl.style.width =
        "0%";

    progressEl.classList.add(
        "timeout"
    );


    timeEl.textContent =
        "Time Out!";


    /*
       Lock all unmatched cards.

       Already matched cards remain
       green and keep their points.
    */

    document
        .querySelectorAll(
            "#englishList .card, #vietnameseList .card"
        )
        .forEach(
            function(card){

                if(
                    !card.classList.contains(
                        "correct"
                    )
                ){

                    card.style.pointerEvents =
                        "none";

                }

            }
        );


    setTimeout(
        function(){

            nextRound();

        },
        1000
    );

}


/* =========================================================
   END ROUND
========================================================= */

function endRound(){

    if(roundFinished)
        return;


    roundFinished = true;

    clearInterval(timer);


    setTimeout(
        function(){

            nextRound();

        },
        800
    );

}


/* =========================================================
   NEXT ROUND
========================================================= */

function nextRound(){

    round++;


    if(
        round >
        TOTAL_ROUNDS
    ){

        finishGame();

    }

    else{

        loadRound();

    }

}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

    clearInterval(timer);


    gameArea.style.display =
        "none";

    finishScreen.style.display =
        "block";


    finalScoreEl.textContent =
        score +
        " / " +
        TOTAL_POINTS;


    const percentage =
        Math.round(
            score /
            TOTAL_POINTS *
            100
        );


    percentEl.textContent =
        percentage +
        "%";


    let message;


    if(
        percentage >= 85
    ){

        message =
            "🏆 Excellent!";

    }

    else if(
        percentage >= 60
    ){

        message =
            "🎉 Good Job!";

    }

    else{

        message =
            "📚 Keep Practicing!";

    }


    messageEl.textContent =
        message;

}


/* =========================================================
   INITIAL STATE
========================================================= */

gameArea.style.display =
    "none";

finishScreen.style.display =
    "none";


/* =========================================================
   BUTTON EVENTS
========================================================= */

startBtn.addEventListener(
    "click",
    startGame
);


playAgainBtn.addEventListener(
    "click",
    startGame
);

</script>

</body>

</html>
