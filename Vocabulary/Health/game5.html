<style>

/* =========================================================
   DESIGN TOKENS
========================================================= */

:root{

    --accent:#9669AA;

    --accent-dark:#714A82;

    --accent-light:#f6eef9;

    --accent-bg:#FAF5FB;

    --accent-border:#dfc9ec;

    --ink:#333333;

    --muted:#5d7187;

    --correct:#019b3f;

    --correct-light:#eaf3ff;

    --wrong:#d9536f;

    --wrong-light:#fff0f3;

}


/* =========================================================
   RESET
========================================================= */

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}


/* =========================================================
   BODY
========================================================= */

body{

    font-family:
        Calibri,
        Arial,
        sans-serif;

    background:
         linear-gradient(
            180deg,
            #ffffff 0%,
            var(--accent-bg) 48%,
            var(--accent-light) 100%
        );


    min-height:100vh;

    padding:20px;

    color:var(--ink);

}


/* =========================================================
   SCREEN
========================================================= */

.screen{

    display:none;

}


.screen.active{

    display:block;

}


/* =========================================================
   BACK TO LOBBY
========================================================= */

.lobby-btn-container{

    width:100%;

    max-width:900px;

    margin:
        0 auto 15px;

    text-align:left;

}


.lobby-btn{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    padding:
        8px 15px;

    background:#ffffff;

    color:var(--accent-dark);

    border:
        1px solid
        var(--accent-border);

    border-radius:999px;

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.lobby-btn:hover{

    background:var(--accent-light);

    border-color:var(--accent);

    transform:translateY(-2px);

}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.container{

    position:relative;

    width:100%;

    max-width:900px;

    margin:0 auto;

    background:#ffffff;

    border:
        1px solid
        var(--accent-border);

    border-radius:18px;

    box-shadow:
        0 10px 30px
        rgba(113,74,130,.08);

    padding:30px;

}


.container::before{

    content:"";

    position:absolute;

    top:0;

    left:0;

    width:100%;

    height:4px;

    background:var(--accent);

    border-radius:
        18px 18px 0 0;

}


/* =========================================================
   GAME
========================================================= */

#game{

    display:block;

}


/* =========================================================
   GAME TITLE
========================================================= */

.title{

    text-align:center;

    font-family:
        Kalam,
        cursive;

    color:var(--ink);

    margin:
        0 0 5px;

    font-size:42px;

    font-weight:700;

    line-height:1.2;

}


.subtitle{

    text-align:center;

    font-family:
        Calibri,
        Arial,
        sans-serif;

    color:var(--muted);

    font-size:20px;

    margin-bottom:25px;

    line-height:1.5;

}


/* =========================================================
   GAME BOX
========================================================= */

.game-box{

    position:relative;

    background:#ffffff;

    padding:25px;

    border:
        1px solid
        var(--accent-border);

    border-radius:15px;

    text-align:center;

}


.game-box::before{

    content:"";

    position:absolute;

    top:0;

    left:0;

    width:100%;

    height:4px;

    background:var(--accent);

    border-radius:
        15px 15px 0 0;

}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:15px;

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-weight:bold;

}


.question-count{

    color:var(--muted);

    font-size:20px;

}


.score{

    color:var(--accent);

    font-size:24px;

}


/* =========================================================
   PROGRESS
========================================================= */

.progress-wrap{

    width:100%;

    height:10px;

    background:var(--accent-light);

    border:
        1px solid
        var(--accent-border);

    border-radius:20px;

    overflow:hidden;

    margin-bottom:22px;

}


.progress{

    width:0%;

    height:100%;

    background:var(--accent);

    border-radius:20px;

    transition:.3s;

}


/* =========================================================
   DETECTIVE CARD
========================================================= */

.card{

    background:var(--accent-light);

    border:
        1px dashed
        var(--accent-border);

    border-radius:12px;

    padding:
        25px
        20px;

    margin:
        20px 0;

    min-height:220px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

}


/* =========================================================
   CLUES
========================================================= */

.clues{

    width:100%;

    display:flex;

    flex-direction:column;

    gap:10px;

}


.clue{

    background:#ffffff;

    border-radius:9px;

    padding:
        12px
        15px;

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-size:21px;

    font-weight:600;

    color:var(--ink);

    border:
        1px solid
        var(--accent-border);

}


/* =========================================================
   OPTIONS
========================================================= */

.options{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:12px;

}


.option-btn{

    min-height:75px;

    padding:17px;

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-size:27px;

    font-weight:bold;

    background:#ffffff;

    color:var(--accent-dark);

    border:
        2px solid
        var(--accent);

    border-radius:10px;

    cursor:pointer;

    transition:.2s;

}


.option-btn:hover:not(:disabled){

    background:var(--accent-light);

    border-color:var(--accent-dark);

    transform:translateY(-2px);

}


.option-btn:disabled{

    cursor:default;

}


.option-btn.correct{

    background:var(--correct-light);

    color:var(--correct);

    border-color:var(--correct);

}


.option-btn.wrong{

    background:var(--wrong-light);

    color:var(--wrong);

    border-color:var(--wrong);

}


/* =========================================================
   RESULT
========================================================= */

.result-message{

    min-height:65px;

    margin-top:20px;

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-size:22px;

    font-weight:bold;

    line-height:1.5;

}


.correct-text{

    color:var(--correct);

}


.wrong-text{

    color:var(--wrong);

}


.explanation{

    display:block;

    margin-top:6px;

    color:var(--muted);

    font-size:19px;

    font-weight:500;

}


/* =========================================================
   NEXT BUTTON
   ALWAYS CENTERED
========================================================= */

.next-btn{

    display:none;

    width:max-content;

    margin:
        24px auto 0;

    padding:
        12px 28px;

    background:var(--accent);

    color:#ffffff;

    border:
        2px solid
        var(--accent);

    border-radius:999px;

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-size:22px;

    font-weight:700;

    cursor:pointer;

    transition:
        background .2s ease,
        border-color .2s ease,
        transform .2s ease;

}


.next-btn:hover{

    background:var(--accent-dark);

    border-color:var(--accent-dark);

    transform:translateY(-2px);

}


/*
   IMPORTANT:
   JavaScript changes display to "block",
   so the button remains centered because
   margin-left/right are auto.
*/

.next-btn.show{

    display:block;

}


/* =========================================================
   FINAL
========================================================= */

#final{

    text-align:center;

    padding:
        30px
        20px
        40px;

}


#final h2{

    font-family:
        Kalam,
        cursive;

    font-size:42px;

    color:var(--accent);

    margin-bottom:15px;

}


.final-score{

    font-family:
        Kalam,
        cursive;

    font-size:38px;

    margin:
        25px 0 10px;

    font-weight:bold;

    color:var(--accent-dark);

}


.final-message{

    color:var(--muted);

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-size:21px;

}


.final-score + .final-message{

}


/* =========================================================
   PLAY AGAIN
========================================================= */

.start-btn{

    margin-top:20px;

    padding:
        13px 28px;

    border:
        2px solid
        var(--accent);

    border-radius:999px;

    background:var(--accent);

    color:#ffffff;

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-size:21px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.start-btn:hover{

    background:var(--accent-dark);

    border-color:var(--accent-dark);

    transform:translateY(-2px);

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    body{

        padding:15px;

    }

            25px
            20px;

    }


    .title{

    }

    }


    .option-btn{

    }

    }

            24px auto 0;

    }

    }


    .final-score{

    }


    .final-message{

        font-size:19px;

    }

}

   VERY SMALL MOBILE
========================================================= */

@media(max-width:380px){

    body{

        padding:12px 10px 25px;

    }


    .title{

    }


    .subtitle{

    }


    .game-box{

        padding:15px;

    }


    .option-btn{

    }

        padding:
            11px 24px;

        font-size:20px;

    }

}

</style>

</head>

</div>

<script>

/* ==========================================================
   APPROVED VOCABULARY
========================================================== */

const vocabulary = [

    {
        word:"bệnh",
        meaning:"sick / illness"
    },

    {
        word:"sốt",
        meaning:"fever"
    },

    {
        word:"mệt",
        meaning:"tired"
    },

    {
        word:"cảm",
        meaning:"flu / cold"
    },

    {
        word:"ho",
        meaning:"cough"
    },

    {
        word:"đau",
        meaning:"pain / hurt"
    },

    {
        word:"đau người",
        meaning:"body ache"
    },

    {
        word:"đau đầu",
        meaning:"headache"
    },

    {
        word:"đau tay",
        meaning:"arm / hand pain"
    },

    {
        word:"đau chân",
        meaning:"leg / foot pain"
    },

    {
        word:"đau bụng",
        meaning:"stomachache"
    },

    {
        word:"đầu",
        meaning:"head"
    },

    {
        word:"tay",
        meaning:"hand / arm"
    },

    {
        word:"chân",
        meaning:"leg / foot"
    },

    {
        word:"bụng",
        meaning:"stomach / belly"
    },

    {
        word:"người",
        meaning:"body / person"
    }

];


/* ==========================================================
   QUESTION DATABASE
========================================================== */

const database = [

    {
        word:"bệnh",

        clues:[
            "It means sick or illness.",
            "It describes a health condition."
        ],

        answer:"bệnh",

        explanation:
            "Bệnh means sick / illness."
    },


    {
        word:"sốt",

        clues:[
            "It means fever.",
            "It is related to a high body temperature."
        ],

        answer:"sốt",

        explanation:
            "Sốt means fever."
    },


    {
        word:"mệt",

        clues:[
            "It means tired.",
            "You may feel this when you have little energy."
        ],

        answer:"mệt",

        explanation:
            "Mệt means tired."
    },


    {
        word:"cảm",

        clues:[
            "It means flu / cold.",
            "It describes a common illness."
        ],

        answer:"cảm",

        explanation:
            "Cảm means flu / cold."
    },


    {
        word:"ho",

        clues:[
            "It means cough.",
            "It describes an action you may do when you are sick."
        ],

        answer:"ho",

        explanation:
            "Ho means cough."
    },


    {
        word:"đau",

        clues:[
            "It means pain or hurt.",
            "It describes when something hurts."
        ],

        answer:"đau",

        explanation:
            "Đau means pain / hurt."
    },


    {
        word:"đau người",

        clues:[
            "It means body ache.",
            "The pain is in your body."
        ],

        answer:"đau người",

        explanation:
            "Đau người means body ache."
    },


    {
        word:"đau đầu",

        clues:[
            "It means headache.",
            "The pain is in your head."
        ],

        answer:"đau đầu",

        explanation:
            "Đau đầu means headache."
    },


    {
        word:"đau tay",

        clues:[
            "It means arm / hand pain.",
            "The pain is in your arm or hand."
        ],

        answer:"đau tay",

        explanation:
            "Đau tay means arm / hand pain."
    },


    {
        word:"đau chân",

        clues:[
            "It means leg / foot pain.",
            "The pain is in your leg or foot."
        ],

        answer:"đau chân",

        explanation:
            "Đau chân means leg / foot pain."
    },


    {
        word:"đau bụng",

        clues:[
            "It means stomachache.",
            "The pain is in your stomach or belly."
        ],

        answer:"đau bụng",

        explanation:
            "Đau bụng means stomachache."
    },


    {
        word:"đầu",

        clues:[
            "It means head.",
            "It is a body part."
        ],

        answer:"đầu",

        explanation:
            "Đầu means head."
    },


    {
        word:"tay",

        clues:[
            "It means hand / arm.",
            "It is a body part."
        ],

        answer:"tay",

        explanation:
            "Tay means hand / arm."
    },


    {
        word:"chân",

        clues:[
            "It means leg / foot.",
            "It is a body part."
        ],

        answer:"chân",

        explanation:
            "Chân means leg / foot."
    },


    {
        word:"bụng",

        clues:[
            "It means stomach / belly.",
            "It is a body part."
        ],

        answer:"bụng",

        explanation:
            "Bụng means stomach / belly."
    },


    {
        word:"người",

        clues:[
            "It means body / person.",
            "It can refer to the body or a person."
        ],

        answer:"người",

        explanation:
            "Người means body / person."
    }

];


/* ==========================================================
   GAME SETTINGS
========================================================== */

const TOTAL_QUESTIONS = 20;


/* ==========================================================
   STATE
========================================================== */

let questions = [];

let currentQuestion = 0;

let score = 0;

let answered = false;


/* ==========================================================
   SHUFFLE
========================================================== */

function shuffle(array){

    const arr = [...array];


    for(
        let i = arr.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] = [
            arr[j],
            arr[i]
        ];

    }


    return arr;

}


/* ==========================================================
   CREATE QUESTIONS
========================================================== */

function createQuestions(){

    const shuffled =
        shuffle(database);

    const result = [];


    /*
       Use every vocabulary item once.
    */

    result.push(...shuffled);


    /*
       Add extra questions until
       there are exactly 20.
    */

    while(
        result.length <
        TOTAL_QUESTIONS
    ){

        const randomQuestion =
            database[
                Math.floor(
                    Math.random() *
                    database.length
                )
            ];


        result.push(
            randomQuestion
        );

    }


    return shuffle(result);

}


/* ==========================================================
   START GAME
========================================================== */

function startGame(){

    questions =
        createQuestions();


    currentQuestion = 0;

    score = 0;


    document
        .getElementById("game")
        .classList.add(
            "active"
        );


    document
        .getElementById("final")
        .classList.remove(
            "active"
        );


    document
        .getElementById("score")
        .textContent =
        "0";


    document
        .getElementById("totalQuestions")
        .textContent =
        questions.length;


    loadQuestion();

}


/* ==========================================================
   LOAD QUESTION
========================================================== */

function loadQuestion(){

    answered = false;


    const question =
        questions[currentQuestion];


    document
        .getElementById("questionNumber")
        .textContent =
        currentQuestion + 1;


    document
        .getElementById("progress")
        .style.width =
        (
            (currentQuestion + 1) /
            questions.length *
            100
        ) + "%";


    const cluesContainer =
        document.getElementById(
            "cluesContainer"
        );


    cluesContainer.innerHTML =
        "";


    question.clues.forEach(
        function(clue){

            const clueElement =
                document.createElement(
                    "div"
                );


            clueElement.className =
                "clue";


            clueElement.textContent =
                "• " + clue;


            cluesContainer.appendChild(
                clueElement
            );

        }
    );


    document
        .getElementById("resultText")
        .innerHTML =
        "";


    document
        .getElementById("resultText")
        .className =
        "result-message";


    const nextBtn =
        document.getElementById(
            "nextBtn"
        );


    nextBtn.classList.remove(
        "show"
    );


    nextBtn.textContent =
        currentQuestion ===
        questions.length - 1

            ? "Finish 🎉"

            : "Next →";


    const container =
        document.getElementById(
            "optionsContainer"
        );


    container.innerHTML =
        "";


    /*
       Wrong answers come only
       from approved vocabulary.
    */

    const wrongAnswers =
        shuffle(
            vocabulary.filter(
                item =>
                    item.word !==
                    question.answer
            )
        )
        .slice(
            0,
            3
        )
        .map(
            item =>
                item.word
        );


    const options =
        shuffle([
            question.answer,
            ...wrongAnswers
        ]);


    options.forEach(
        function(option){

            const btn =
                document.createElement(
                    "button"
                );


            btn.className =
                "option-btn";


            btn.textContent =
                option;


            btn.onclick =
                function(){

                    handleAnswer(
                        btn,
                        option
                    );

                };


            container.appendChild(
                btn
            );

        }
    );

}


/* ==========================================================
   HANDLE ANSWER
========================================================== */

function handleAnswer(
    button,
    selected
){

    /*
       One attempt only.
    */

    if(answered){

        return;

    }


    answered = true;


    const question =
        questions[currentQuestion];


    const resultText =
        document.getElementById(
            "resultText"
        );


    /*
       Lock every answer.
    */

    document
        .querySelectorAll(
            ".option-btn"
        )
        .forEach(
            function(btn){

                btn.disabled = true;

            }
        );


    /* ======================================================
       CORRECT
    ====================================================== */

    if(
        selected ===
        question.answer
    ){

        button.classList.add(
            "correct"
        );


        score++;


        document
            .getElementById("score")
            .textContent =
            score;


        resultText.innerHTML =
            `
            🎉 Correct!

            <span class="explanation">
                ${question.explanation}
            </span>
            `;


        resultText.className =
            "result-message correct-text";

    }


    /* ======================================================
       WRONG
    ====================================================== */

    else{

        button.classList.add(
            "wrong"
        );


        /*
           Highlight correct answer.
        */

        document
            .querySelectorAll(
                ".option-btn"
            )
            .forEach(
                function(btn){

                    if(
                        btn.textContent ===
                        question.answer
                    ){

                        btn.classList.add(
                            "correct"
                        );

                    }

                }
            );


        resultText.innerHTML =
            `
            ❌ Wrong!

            <span class="explanation">
                Correct answer:
                <strong>
                    ${question.answer}
                </strong>
                <br>
                ${question.explanation}
            </span>
            `;


        resultText.className =
            "result-message wrong-text";

    }


    /*
       Show Next button.

       Use the .show class instead of
       inline-block so the CSS can keep
       the button centered.
    */

    document
        .getElementById("nextBtn")
        .classList.add(
            "show"
        );

}


/* ==========================================================
   NEXT QUESTION
========================================================== */

function nextQuestion(){

    if(!answered){

        return;

    }


    currentQuestion++;


    if(
        currentQuestion <
        questions.length
    ){

        loadQuestion();

    }

    else{

        finishGame();

    }

}


/* ==========================================================
   FINISH GAME
========================================================== */

function finishGame(){

    document
        .getElementById("game")
        .classList.remove(
            "active"
        );


    document
        .getElementById("final")
        .classList.add(
            "active"
        );


    document
        .getElementById("finalScore")
        .textContent =
        score +
        " / " +
        questions.length;


    const percent =
        Math.round(
            score /
            questions.length *
            100
        );


    let message;


    if(percent >= 90){

        message =
            "🏆 Excellent! You are a great health word detective.";

    }

    else if(percent >= 70){

        message =
            "🎉 Good job! Keep practicing your Vietnamese.";

    }

    else{

        message =
            "📚 Keep practicing these useful health words.";

    }


    document
        .getElementById("finalMessage")
        .textContent =
        message;

}


/* ==========================================================
   RESTART
========================================================== */

function restartGame(){

    startGame();

}


/* ==========================================================
   BACK TO LOBBY
========================================================== */

function backToLobby(){

    window.location.href =
        "../../category.html?category=Health";

}


/* ==========================================================
   START GAME
========================================================== */

startGame();

</script>
