/* =========================================================
   THEME
========================================================= */

:root{

    --accent:#9669AA;

    --accent-dark:#714A82;

    --accent-light:#f6eef9;

    --accent-bg:#FAF5FB;

    --accent-border:#dfc9ec;

    --heading-color:var(--ink);

    --correct:#019b3f;

    --correct-light:#eaf3ff;

    --wrong:#d9536f;

    --wrong-light:#fff0f3;

    --ink:#333333;

    --text:#333333;

    --muted:#6b7280;

    --general-border:#dfdfdf;

}


/* =========================================================
   GLOBAL
========================================================= */

*{

    box-sizing:border-box;

}


html{

    min-height:100%;

}


body{

    margin:0;

    min-height:100vh;

    padding:28px 20px 45px;

    font-family:
        Calibri,
        'Segoe UI',
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    color:var(--ink);

    display:flex;

    justify-content:center;

    align-items:center;

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            var(--accent-bg) 48%,
            var(--accent-light) 100%
        );

}


/* =========================================================
   PAGE WRAPPER
========================================================= */

.page-wrapper{

    width:100%;

}


/* =========================================================
   BACK BUTTON
========================================================= */

.back-btn-container{

    width:100%;

    max-width:900px;

    margin:0 auto 15px;

}


.back-btn{

    display:inline-block;

    padding:9px 16px;

    background:#ffffff;

    color:#555555;

    border:1px solid var(--accent-border);

    border-radius:9px;

    text-decoration:none;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:22px;

    font-weight:bold;

    transition:.2s ease;

}


.back-btn:hover{

    background:var(--accent-light);

    color:var(--accent-dark);

    border-color:var(--accent);

    transform:translateX(-2px);

}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.container{

    width:100%;

    max-width:900px;

    margin:0 auto;

    padding:30px;

    background:#ffffff;

    border:1px solid var(--accent-border);

    border-radius:20px;

    box-shadow:
        0 10px 30px rgba(113,74,130,.10);

    position:relative;

    overflow:hidden;

}


/* =========================================================
   CONTAINER ACCENT LINE
========================================================= */

.container::before{

    content:"";

    position:absolute;

    top:0;

    left:0;

    width:100%;

    height:5px;

    background:var(--accent);

}


/* =========================================================
   TITLE AREA
========================================================= */

.title-area{

    text-align:center;

    margin-bottom:28px;

}


.title-area h1{

    margin:0 0 8px;

    font-family:
        "Kalam",
        cursive;

    font-size:46px;

    line-height:1.2;

    font-weight:700;

    color:var(--heading-color);

}


.title-area p{

    margin:0;

    color:var(--muted);

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:23px;

    line-height:1.4;

}


/* =========================================================
   SCREEN
========================================================= */

.screen{

    display:none;

}


.screen.active{

    display:block;

}


/* =========================================================
   GAME BOX
========================================================= */

.game-box{

    width:100%;

    padding:25px;

    background:white;

    border:1px solid var(--accent-border);

    border-radius:16px;

}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:20px;

    margin-bottom:15px;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:24px;

    font-weight:bold;

}


.question-count{

    color:#6b7280;

}


.score{

    color:var(--accent-dark);

}


/* =========================================================
   PROGRESS BAR
========================================================= */

.progress-wrap{

    width:100%;

    height:9px;

    margin-bottom:22px;

    background:#eeeaf1;

    border-radius:20px;

    overflow:hidden;

}


.progress{

    width:0%;

    height:100%;

    background:var(--accent);

    border-radius:20px;

    transition:.3s ease;

}


/* =========================================================
   QUESTION CARD
========================================================= */

.question-card{

    position:relative;

    overflow:hidden;

    margin:20px 0;

    padding:34px 20px;

    min-height:155px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    gap:8px;

    background:var(--accent-light);

    border:1px solid var(--accent-border);

    border-radius:14px;

}


/* =========================================================
   QUESTION CARD ACCENT LINE
========================================================= */

.question-card::before{

    content:"";

    position:absolute;

    top:0;

    left:0;

    width:100%;

    height:5px;

    background:var(--accent);

}


/* =========================================================
   QUESTION TEXT
========================================================= */

.question-label{

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:22px;

    color:#6b7280;

    font-weight:600;

}


.question-word{

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:40px;

    font-weight:bold;

    color:var(--heading-color);

}


/* =========================================================
   OPTIONS
========================================================= */

.options{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:12px;

}


.option-btn{

    min-height:64px;

    padding:14px 16px;

    background:#ffffff;

    color:var(--ink);

    border:1px solid var(--accent-border);

    border-radius:10px;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:27px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s ease;

}


.option-btn:hover{

    background:var(--accent-light);

    color:var(--accent-dark);

    border-color:var(--accent);

    transform:translateY(-2px);

}


/* =========================================================
   CORRECT
========================================================= */

.option-btn.correct{

    background:var(--correct-light);

    color:var(--correct);

    border-color:var(--correct);

}


/* =========================================================
   WRONG
========================================================= */

.option-btn.wrong{

    background:var(--wrong-light);

    color:var(--wrong);

    border-color:var(--wrong);

}


/* =========================================================
   DISABLED
========================================================= */

.option-btn.disabled{

    pointer-events:none;

    cursor:default;

}


.option-btn.disabled:not(.correct):not(.wrong){

    opacity:.55;

}


/* =========================================================
   RESULT MESSAGE
========================================================= */

.result-message{

    min-height:48px;

    margin-top:20px;

    text-align:center;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:27px;

    font-weight:bold;

    line-height:1.4;

}


.correct-text{

    color:var(--correct);

}


.wrong-text{

    color:var(--wrong);

}


.explanation{

    display:block;

    margin-top:5px;

    color:#607d8b;

    font-size:23px;

    font-weight:normal;

}


/* =========================================================
   NEXT
========================================================= */

.next-area{

    display:flex;

    justify-content:center;

    margin-top:16px;

}


.next-btn{

    display:none;

    padding:12px 30px;

    background:var(--accent);

    color:#ffffff;

    border:2px solid var(--accent);

    border-radius:10px;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:26px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s ease;

}


.next-btn:hover{

    background:var(--accent-dark);

    border-color:var(--accent-dark);

    transform:translateY(-2px);

}


/* =========================================================
   FINAL / RESULTS
========================================================= */

#final{

    text-align:center;

    padding:20px 10px 10px;

}


.final-title{

    margin:0 0 15px;

    font-family:
        "Kalam",
        cursive;

    font-size:46px;

    color:var(--heading-color);

}


.final-score{

    margin:20px 0;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:38px;

    font-weight:bold;

    color:var(--accent-dark);

}


.final-percent{

    margin:10px 0;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:27px;

    color:#666666;

}


.final-message{

    margin:15px auto 25px;

    max-width:650px;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:26px;

    color:#666666;

    line-height:1.5;

}


/* =========================================================
   PLAY AGAIN
========================================================= */

.play-again-btn{

    padding:13px 32px;

    background:var(--accent);

    color:#ffffff;

    border:2px solid var(--accent);

    border-radius:10px;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:27px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s ease;

}


.play-again-btn:hover{

    background:var(--accent-dark);

    border-color:var(--accent-dark);

    transform:translateY(-2px);

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    body{

    .back-btn-container{

    .back-btn{

    .container{

        width:100%;

        border-radius:18px;

    }


    .title-area{

        margin-bottom:24px;

    .title-area h1{

        font-size:38px;

    }


    .title-area p{

        font-size:21px;

    }


    .game-box{

        padding:18px;

    }


    .topbar{

        font-size:21px;

    }


    .options{

        grid-template-columns:1fr;

    }


    .option-btn{

        font-size:25px;

    }


    .question-word{

        font-size:34px;

    }


    .question-label{

        font-size:21px;

    }


    .result-message{

        font-size:24px;

    }


    .explanation{

        font-size:21px;

    }


    .final-title{

        font-size:40px;

    }


    .final-score{

        font-size:34px;

    }


    .final-message{

        font-size:23px;

    }

}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media(max-width:400px){

    body{

        padding:15px 10px 25px;

    }


    .container{

        padding:28px 14px;

    }


    .title-area h1{

        font-size:34px;

    }


    .title-area p{

        font-size:20px;

    }


    .game-box{

        padding:15px;

    }


    .topbar{

        font-size:19px;

        gap:10px;

    }


    .option-btn{

    }


    .question-word{

    }


    .question-label{

    }


    .next-btn,
    .play-again-btn{

        font-size:23px;

        padding:11px 24px;

    }

}

</style>

>


<div class="game-box">


<!-- =========================================================

<div class="topbar">

        Question

        </span>

    ></div>

<div

    id="questionCard"
>

    </div>


    <div
        class="question-word"
        id="questionText"
    >
    </div>

</div>

     OPTIONS
========================================================= -->

<div
    class="options"
    id="optionsContainer"
>
</div>

========================================================= -->

    class="result-message"
    id="resultText"
>
</div>

</div>


</div>

     FINAL SCREEN
========================================================= -->

<div
    id="final"
    class="screen"
>


    <h2 class="final-title">

        🎉 Game Complete!

    </h2>


    <div class="final-score">

        Score:

        <span id="finalScore">
        </span>

    </div>


    <div
        class="final-percent"
        id="finalPercent"
    >
    </div>


    <p
        class="final-message"
        id="finalMessage"
    >
    </p>


    <button

        onclick="restartGame()"
    >

        Play Again

    </button>


</div>

<script>


/* =========================================================
   APPROVED HEALTH VOCABULARY
========================================================= */

const vocabulary = [

    {
        en:"sick / illness",
        vi:"bệnh"
    },

    {
        en:"fever",
        vi:"sốt"
    },

    {
        en:"tired",
        vi:"mệt"
    },

    {
        en:"flu / cold",
        vi:"cảm"
    },

    {
        en:"cough",
        vi:"ho"
    },

    {
        en:"headache",
        vi:"nhức đầu"
    },

    {
        en:"pain / hurt",
        vi:"đau"
    },

    {
        en:"body ache",
        vi:"đau người"
    },

    {
        en:"headache",
        vi:"đau đầu"
    },

    {
        en:"arm / hand pain",
        vi:"đau tay"
    },

    {
        en:"leg / foot pain",
        vi:"đau chân"
    },

    {
        en:"stomachache",
        vi:"đau bụng"
    },

    {
        en:"head",
        vi:"đầu"
    },

    {
        en:"hand / arm",
        vi:"tay"
    },

    {
        en:"leg / foot",
        vi:"chân"
    },

    {
        en:"stomach / belly",
        vi:"bụng"
    },

    {
        en:"body / person",
        vi:"người"
    }

];


/* =========================================================
   GAME SETTINGS
========================================================= */

const TOTAL_QUESTIONS = 20;

const OPTIONS_PER_QUESTION = 4;


/* =========================================================
   STATE
========================================================= */

let questions = [];

let currentQuestion = 0;

let score = 0;

let answered = false;


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    const arr = [...array];

    for(
        let i = arr.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            arr[i],
            arr[j]
        ] =
        [
            arr[j],
            arr[i]
        ];

    }

    return arr;

}


/* =========================================================
   CREATE QUESTIONS
========================================================= */

function createQuestions(){

    /*
       There are 17 approved vocabulary items.

       Use all 17 once,
       then randomly repeat 3 approved items
       to make exactly 20 questions.
    */

    const base =
        shuffle(vocabulary);


    const extra =
        shuffle(vocabulary).slice(
            0,
            TOTAL_QUESTIONS - base.length
        );


    questions =
        shuffle([
            ...base,
            ...extra
        ]);

}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    currentQuestion = 0;

    score = 0;

    answered = false;


    createQuestions();


    document
        .getElementById("game")
        .classList.add("active");


    document
        .getElementById("final")
        .classList.remove("active");


    document
        .getElementById("score")
        .textContent =
        "0";


    document
        .getElementById("totalQuestions")
        .textContent =
        TOTAL_QUESTIONS;


    loadQuestion();

}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion(){

    answered = false;


    const question =
        questions[currentQuestion];


    document
        .getElementById("questionNumber")
        .textContent =
        currentQuestion + 1;


    /*
       Progress bar
    */

    document
        .getElementById("progress")
        .style.width =
        (
            (currentQuestion + 1) /
            TOTAL_QUESTIONS *
            100
        ) + "%";


    /*
       English question
    */

    document
        .getElementById("questionText")
        .textContent =
        question.en;


    /*
       Clear result
    */

    const resultText =
        document.getElementById(
            "resultText"
        );


    resultText.textContent =
        "";


    resultText.className =
        "result-message";


    /*
       Hide Next button
    */

    const nextBtn =
        document.getElementById(
            "nextBtn"
        );


    nextBtn.style.display =
        "none";


    nextBtn.textContent =
        currentQuestion ===
        TOTAL_QUESTIONS - 1

        ? "Finish 🎉"

        : "Next →";


    /*
       Clear old answers
    */

    const container =
        document.getElementById(
            "optionsContainer"
        );


    container.innerHTML =
        "";


    /* =====================================================
       WRONG OPTIONS
    ===================================================== */

    const wrongOptions =
        shuffle(
            vocabulary.filter(
                item =>
                    item.vi !== question.vi
            )
        )
        .slice(
            0,
            OPTIONS_PER_QUESTION - 1
        )
        .map(
            item => item.vi
        );


    /*
       Correct answer + wrong answers
    */

    const options =
        shuffle([
            question.vi,
            ...wrongOptions
        ]);


    /*
       Create answer buttons
    */

    options.forEach(
        option => {

            const btn =
                document.createElement(
                    "button"
                );


            btn.className =
                "option-btn";


            btn.textContent =
                option;


            btn.onclick =
                function(){

                    handleAnswer(
                        btn,
                        option
                    );

                };


            container.appendChild(
                btn
            );

        }
    );

}


/* =========================================================
   HANDLE ANSWER
========================================================= */

function handleAnswer(
    button,
    selected
){

    /*
       Only one answer is allowed.
    */

    if(answered){

        return;

    }


    answered = true;


    const question =
        questions[currentQuestion];


    const allButtons =
        document.querySelectorAll(
            ".option-btn"
        );


    const resultText =
        document.getElementById(
            "resultText"
        );


    /* =====================================================
       CORRECT
    ===================================================== */

    if(
        selected === question.vi
    ){

        button.classList.add(
            "correct"
        );


        score++;


        document
            .getElementById("score")
            .textContent =
            score;


        resultText.innerHTML =

            `✓ Correct!

            <span class="explanation">

                ${question.en} = ${question.vi}

            </span>`;


        resultText.className =
            "result-message correct-text";

    }


    /* =====================================================
       WRONG
    ===================================================== */

    else{

        button.classList.add(
            "wrong"
        );


        /*
           Reveal correct answer.
        */

        allButtons.forEach(
            btn => {

                if(
                    btn.textContent ===
                    question.vi
                ){

                    btn.classList.add(
                        "correct"
                    );

                }

            }
        );


        resultText.innerHTML =

            `✗ Incorrect.

            <span class="explanation">

                Correct answer:
                ${question.vi}

            </span>`;


        resultText.className =
            "result-message wrong-text";

    }


    /* =====================================================
       LOCK ALL ANSWERS
    ===================================================== */

    allButtons.forEach(
        btn => {

            btn.classList.add(
                "disabled"
            );

        }
    );


    /* =====================================================
       SHOW NEXT
    ===================================================== */

    document
        .getElementById("nextBtn")
        .style.display =
        "inline-block";

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion(){

    if(!answered){

        return;

    }


    currentQuestion++;


    if(
        currentQuestion <
        TOTAL_QUESTIONS
    ){

        loadQuestion();

    }

    else{

        finishGame();

    }

}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

    document
        .getElementById("game")
        .classList.remove(
            "active"
        );


    document
        .getElementById("final")
        .classList.add(
            "active"
        );


    document
        .getElementById("finalScore")
        .textContent =

        score +
        " / " +
        TOTAL_QUESTIONS;


    const percent =
        Math.round(
            score /
            TOTAL_QUESTIONS *
            100
        );


    document
        .getElementById("finalPercent")
        .textContent =

        percent +
        "%";


    let message;


    if(percent >= 90){

        message =
            "🏆 Excellent! You really know your Vietnamese health vocabulary!";

    }

    else if(percent >= 70){

        message =
            "🎉 Great job! Keep practicing!";

    }

    else if(percent >= 50){

        message =
            "👍 Good work! You're getting better!";

    }

    else{

        message =
            "📚 Keep practicing. You will improve!";

    }


    document
        .getElementById("finalMessage")
        .textContent =
        message;


    if (
        typeof trackGameComplete ===
        "function"
    ) {
        trackGameComplete(
            "Health - Game 1",
            score,
            TOTAL_QUESTIONS
        );
    }

}

/* =========================================================
   PLAY AGAIN
========================================================= */

function restartGame(){

    startGame();

}


/* =========================================================
   BACK TO CATEGORY
========================================================= */

function backToLobby(){

    window.location.href =
        "../../category.html?category=Health";

}


/* =========================================================
   START GAME AUTOMATICALLY
   No intro screen
========================================================= */

window.trackGameStart(
    "Health - Game 1"
);

startGame();
