        }

        .progress {

        }

           SCORE

            margin-bottom:
                22px;

        }


        .score-box {

            min-width:

        .score-label {

            display:

            font-size:
                1.055rem;

            font-weight:
                700;

            text-transform:

        }


        .score-value {

            font-size:

            font-weight:
                800;

            color:

        }


        /* =====================================================
           INSTRUCTION
        ====================================================== */

        .instruction {

            margin-bottom:
                20px;

            color:
                #66809d;

            font-size:
                1.215rem;

            text-align:
                center;

        }


        /* =====================================================
           CARD GRID
        ====================================================== */

        .card-grid {

            width:
                min(650px, 100%);

            margin:
                0 auto;

            display:
                grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap:
                18px;

        }


        /* =====================================================
           CARD
        ====================================================== */

        .memory-card {

            position:
                relative;

            width:
                100%;

            aspect-ratio:
                1 / 1;

            perspective:
                1000px;

            cursor:
                pointer;

        }


        .memory-card.disabled {

            cursor:
                default;

        }


        .card-inner {

            position:
                absolute;

            inset:
                0;

            width:
                100%;

            height:
                100%;

            transition:
                transform 0.45s ease;

            transform-style:
                preserve-3d;

        }


        .memory-card.flipped .card-inner,
        .memory-card.matched .card-inner {

            transform:
                rotateY(180deg);

        }


        .card-face {

            position:
                absolute;

            inset:
                0;

            width:
                100%;

            height:
                100%;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                15px;

            border:
                2px solid #c4daf6;

            border-radius:
                18px;

            backface-visibility:
                hidden;

            -webkit-backface-visibility:
                hidden;

            text-align:
                center;

        }


        .card-front {

            background:
                #eaf3ff;

            color:
                #2f6fed;

            font-size:
                2.375rem;

            font-weight:
                800;

        }


        .card-back {

            transform:
                rotateY(180deg);

            background:
                #ffffff;

            color:
                #143a6b;

            font-size:
                clamp(
                    1.225rem,
                    2.3vw,
                    1.425rem
                );

            font-weight:
                800;

            line-height:
                1.3;

        }


        /* =====================================================
           MATCHED COLORS
        ====================================================== */

        .memory-card.matched .card-back {

            border-width:
                3px;

        }


        .memory-card.match-1 .card-back {
            border-color:
                #e05a42;
        }


        .memory-card.match-2 .card-back {
            border-color:
                #7657d9;
        }


        .memory-card.match-3 .card-back {
            border-color:
                #079b91;
        }


        .memory-card.match-4 .card-back {
            border-color:
                #d14f76;
        }


        .memory-card.match-5 .card-back {
            border-color:
                #3b82c4;
        }


        .memory-card.match-6 .card-back {
            border-color:
                #d14f9b;
        }


        /* =====================================================
           WRONG MARK
        ====================================================== */

        .wrong-mark {

            position:
                absolute;

            top:
                50%;

            left:
                50%;

            z-index:
                20;

            width:
                58px;

            height:
                58px;

    </style>

</head>

<script>


/* =========================================================

const vocabulary = [

    {

    },

    {

    },

    {
        vietnamese: "đi thẳng",
        phonetic: "dee tang",
        english: "Go straight"
    },


    {
        vietnamese: "xe máy",
        phonetic: "seh mai",
        english: "Motorbike"
    },

    {
        vietnamese: "xe đạp",
        phonetic: "seh dap",
        english: "Bicycle"
    },

    {
        vietnamese: "xe buýt",
        phonetic: "seh bwit",
        english: "Bus"
    },

    {
        vietnamese: "xe hơi",
        phonetic: "seh hoy",
        english: "Car"
    },

    {
        vietnamese: "taxi",
        phonetic: "tak-see",
        english: "Taxi"
    },

    {
        vietnamese: "xe lửa",
        phonetic: "seh lửa",
        english: "Train"
    },

    {
        vietnamese: "máy bay",
        phonetic: "mai bai",
        english: "Airplane"
    },

    {
        vietnamese: "tàu",
        phonetic: "tao",
        english: "Boat / Ship"
    },

    {
        vietnamese: "xe ôm",
        phonetic: "seh om",
        english: "Motorbike taxi"
    },

    {
        vietnamese: "đi bộ",
        phonetic: "dee boh",
        english: "Walk / On foot"
    }

];


/* =========================================================
   GAME SETTINGS
   ========================================================= */

const TOTAL_ROUNDS =
    20;

const PAIRS_PER_ROUND =
    3;

const CARDS_PER_ROUND =
    6;


/*
 * The delay is intentional.
 *
 * Players need enough time to see
 * both cards before the result appears.
 */

const WRONG_DISPLAY_TIME =
    900;

const CORRECT_DISPLAY_TIME =
    500;


/* =========================================================
   STATE
   ========================================================= */

let round =
    1;

let score =
    0;

let matchedPairs =
    0;

let selectedCards =
    [];

let lockBoard =
    false;

let currentPairs =
    [];

let availableVocabulary =
    [];


/* =========================================================
   ELEMENTS
   ========================================================= */

const cardGrid =
    document.getElementById(
        "card-grid"
    );

const progress =
    document.getElementById(
        "progress"
    );

const scoreElement =
    document.getElementById(
        "score"
    );

const matchesElement =
    document.getElementById(
        "matches"
    );

const roundMessage =
    document.getElementById(
        "round-message"
    );

const nextButton =
    document.getElementById(
        "next-btn"
    );

const gameArea =
    document.getElementById(
        "game-area"
    );

const resultScreen =
    document.getElementById(
        "result-screen"
    );

const finalScore =
    document.getElementById(
        "final-score"
    );

const resultText =
    document.getElementById(
        "result-text"
    );

const restartButton =
    document.getElementById(
        "restart-btn"
    );


/* =========================================================
   SHUFFLE
   ========================================================= */

function shuffle(
    array
) {

    const result =
        [...array];


    for (
        let i = result.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            result[i],
            result[j]
        ] =
        [
            result[j],
            result[i]
        ];

    }


    return result;

}


/* =========================================================
   GET ROUND VOCABULARY
   ========================================================= */

function getRoundPairs() {

    /*
     * Refill the pool when needed.
     */

    if (
        availableVocabulary.length <
        PAIRS_PER_ROUND
    ) {

        availableVocabulary =
            shuffle(
                vocabulary
            );

    }


    const selected =
        availableVocabulary.splice(
            0,
            PAIRS_PER_ROUND
        );


    return selected;

}


/* =========================================================
   CREATE CARD
   ========================================================= */

function createCard(
    pair,
    type
) {

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "memory-card";


    card.dataset.pairId =
        pair.id;


    card.dataset.type =
        type;


    const value =
        type === "vietnamese"
            ? pair.vietnamese
            : pair.english;


    card.innerHTML = `

        <div class="card-inner">

            <div class="card-face card-front">
                ?
            </div>


            <div class="card-face card-back">

                ${escapeHtml(
                    value
                )}

            </div>

        </div>


        <div class="wrong-mark">
            ✕
        </div>

    `;


    card.addEventListener(
        "click",
        () => {

            handleCardClick(
                card
            );

        }
    );


    return card;

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(
    value
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(
            value ?? ""
        );


    return div.innerHTML;

}


/* =========================================================
   START ROUND
   ========================================================= */

function startRound() {

    selectedCards =
        [];

    matchedPairs =
        0;

    lockBoard =
        false;

    nextButton.disabled =
        true;

    roundMessage.textContent =
        "";


    progress.textContent =
        `Round ${round} / ${TOTAL_ROUNDS}`;


    scoreElement.textContent =
        `${score} / ${TOTAL_ROUNDS}`;


    matchesElement.textContent =
        `${matchedPairs} / ${PAIRS_PER_ROUND}`;


    currentPairs =
        getRoundPairs();


    /*
     * Give every pair a unique ID.
     */

    currentPairs =
        currentPairs.map(
            (
                pair,
                index
            ) => ({
                ...pair,
                id:
                    `round-${round}-pair-${index}`
            })
        );


    let cards =
        [];


    currentPairs.forEach(
        pair => {

            cards.push(
                createCard(
                    pair,
                    "vietnamese"
                )
            );


            cards.push(
                createCard(
                    pair,
                    "english"
                )
            );

        }
    );


    cards =
        shuffle(
            cards
        );


    cardGrid.innerHTML =
        "";


    cards.forEach(
        card => {

            cardGrid.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   HANDLE CARD CLICK
   ========================================================= */

function handleCardClick(
    card
) {

    if (
        lockBoard
    ) {

        return;

    }


    if (
        card.classList.contains(
            "flipped"
        )
    ) {

        return;

    }


    if (
        card.classList.contains(
            "matched"
        )
    ) {

        return;

    }


    /*
     * Flip first.
     */

    card.classList.add(
        "flipped"
    );


    selectedCards.push(
        card
    );


    /*
     * Wait for two cards.
     */

    if (
        selectedCards.length !== 2
    ) {

        return;

    }


    lockBoard =
        true;


    checkMatch();

}


/* =========================================================
   CHECK MATCH
   ========================================================= */

function checkMatch() {

    const [
        first,
        second
    ] =
    selectedCards;


    const isMatch =
        first.dataset.pairId ===
        second.dataset.pairId;


    /*
     * CORRECT
     */

    if (
        isMatch
    ) {

        setTimeout(
            () => {

                markCorrect(
                    first,
                    second
                );

            },
            CORRECT_DISPLAY_TIME
        );


        return;

    }


    /*
     * WRONG
     *
     * The cards stay visible first.
     * The X appears only after both
     * cards have already been flipped.
     */

    setTimeout(
        () => {

            first.classList.add(
                "show-wrong"
            );

            second.classList.add(
                "show-wrong"
            );


            roundMessage.textContent =
                "✕ Not a match";


            setTimeout(
                () => {

                    first.classList.remove(
                        "show-wrong"
                    );

                    second.classList.remove(
                        "show-wrong"
                    );


                    first.classList.remove(
                        "flipped"
                    );

                    second.classList.remove(
                        "flipped"
                    );


                    selectedCards =
                        [];

                    lockBoard =
                        false;


                    if (
                        matchedPairs <
                        PAIRS_PER_ROUND
                    ) {

                        roundMessage.textContent =
                            "Try another pair.";

                    }

                },
                WRONG_DISPLAY_TIME
            );

        },
        650
    );

}


/* =========================================================
   MARK CORRECT
   ========================================================= */

function markCorrect(
    first,
    second
) {

    matchedPairs++;

    score++;


    const colorClass =
        `match-${
            (
                matchedPairs - 1
            ) % 6 + 1
        }`;


    first.classList.add(
        "matched",
        colorClass
    );


    second.classList.add(
        "matched",
        colorClass
    );


    first.classList.add(
        "disabled"
    );


    second.classList.add(
        "disabled"
    );


    selectedCards =
        [];


    lockBoard =
        false;


    scoreElement.textContent =
        `${score} / ${TOTAL_ROUNDS}`;


    matchesElement.textContent =
        `${matchedPairs} / ${PAIRS_PER_ROUND}`;


    roundMessage.textContent =
        "✓ Match!";


    /*
     * Round complete.
     */

    if (
        matchedPairs ===
        PAIRS_PER_ROUND
    ) {

        roundMessage.textContent =
            "🎉 Round complete!";


        if (
            round <
            TOTAL_ROUNDS
        ) {

            nextButton.disabled =
                false;

        }

        else {

            setTimeout(
                showResults,
                700
            );

        }

    }

}


/* =========================================================
   NEXT ROUND
   ========================================================= */

nextButton.addEventListener(
    "click",
    () => {

        if (
            matchedPairs !==
            PAIRS_PER_ROUND
        ) {

            return;

        }


        round++;


        startRound();

    }
);


/* =========================================================
   SHOW RESULTS
   ========================================================= */

function showResults() {

    gameArea.style.display =
        "none";


    resultScreen.style.display =
        "block";


    finalScore.textContent =
        `${score} / ${TOTAL_ROUNDS}`;


    if (
        score === TOTAL_ROUNDS
    ) {

        resultText.textContent =
            "Perfect score! Excellent vocabulary matching.";

    }

    else if (
        score >= 15
    ) {

        resultText.textContent =
            "Great job! You know these Vietnamese words well.";

    }

    else if (
        score >= 10
    ) {

        resultText.textContent =
            "Good work! Keep practicing these vocabulary words.";

    }

    else {

        resultText.textContent =
            "Keep practicing and try again!";

    }

}


/* =========================================================
   RESTART
   ========================================================= */

restartButton.addEventListener(
    "click",
    () => {

        round =
            1;

        score =
            0;

        matchedPairs =
            0;

        selectedCards =
            [];

        lockBoard =
            false;

        availableVocabulary =
            shuffle(
                vocabulary
            );


        gameArea.style.display =
            "block";


        resultScreen.style.display =
            "none";


        startRound();

    }
);


/* =========================================================
   INITIALIZE
   ========================================================= */

availableVocabulary =
    shuffle(
        vocabulary
    );


startRound();


</script>
