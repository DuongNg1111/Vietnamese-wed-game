    <style>

        /* =====================================================
           DESIGN TOKENS
        ====================================================== */

        :root {

            --accent:
                #5CA16E;

            --accent-dark:
                #42744F;

            --accent-light:
                #eaf6ee;

            --accent-bg:
                #F2FAF5;

            --accent-border:
                #c1e0cc;


            --ink:
                #143a6b;

            --ink-soft:
                #66809d;


            --correct:
                #019b3f;

            --correct-bg:
                #eaf3ff;

            --correct-border:
                #a9d9bc;


            --wrong:
                #d9536f;

            --wrong-bg:
                #fff0f3;

            --wrong-border:
                #efc4cd;


            --line:
                #d9e6f2;

            --white:
                #ffffff;

        }


        /* =====================================================
           RESET
        ====================================================== */

        * {

            box-sizing:
                border-box;

        }


        html {

            scroll-behavior:
                smooth;

        }


        body {

            min-height: 100vh;

            padding: 28px 20px 45px;

            font-family: Calibri, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            color: var(--ink);

            display:flex;

            justify-content:center;

            align-items:center;

            background:
                linear-gradient(
                    180deg,
                    #ffffff 0%,
                    var(--accent-bg) 48%,
                    var(--accent-light) 100%
                );

        }

        button {

            font-family:
                inherit;

        }


        /* =====================================================
           PAGE WRAPPER
        ====================================================== */

        .page-wrapper {

            width:
                min(
                    900px,
                    100%
                );

            margin:
                0 auto;

        }


        /* =====================================================
           BACK BUTTON
        ====================================================== */

        .top-bar {

            width:
                min(
                    900px,
                    100%
                );

            margin:
                0 auto 18px;

        }


        .back-btn {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                7px;

            padding:
                9px 17px;

            border:
                1px solid
                rgba(
                    20,
                    58,
                    107,
                    0.16
                );

            border-radius:
                999px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.96
                );

            color:
                var(--ink);

            text-decoration:
                none;

            font-size:
                1.15rem;

            font-weight:
                700;

            box-shadow:
                0 4px 12px
                rgba(
                    20,
                    58,
                    107,
                    0.08
                );

            transition:
                0.2s ease;

        }


        .back-btn:hover {

            transform:
                translateX(-3px);

            border-color:
                var(--accent);

            color:
                var(--accent-dark);

            background:
                var(--accent-light);

        }


        /* =====================================================
           MAIN GAME CONTAINER
        ====================================================== */

        .game-container {

            position:
                relative;

            width:
                100%;

            padding:
                32px 35px 38px;

            border:
                1px solid
                var(--accent-border);

            border-radius:
                24px;

            background:
                var(--white);

            box-shadow:
                0 12px 35px
                rgba(
                    20,
                    58,
                    107,
                    0.12
                );

            overflow:
                hidden;

        }


        /* =====================================================
           ACCENT LINE
        ====================================================== */

        .game-container::before {

            content:
                "";

            position:
                absolute;

            top:
                0;

            left:
                0;

            width:
                100%;

            height:
                6px;

            background:
                linear-gradient(
                    90deg,
                    var(--accent),
                    #79b987
                );

        }


        /* =====================================================
           HEADER
        ====================================================== */

        .game-header {

            margin:
                0 0 22px;

            text-align:
                center;

        }


        .game-title {

            margin:
                0 0 7px;

            font-family:
                'Kalam',
                cursive;

            color:
                var(--ink);

            font-size:
                clamp(
                    2.5rem,
                    5vw,
                    3.45rem
                );

            font-weight:
                700;

            line-height:
                1.05;

        }


        .game-description {

            max-width:
                650px;

            margin:
                0 auto;

            color:
                var(--ink-soft);

            font-size:
                1.22rem;

            line-height:
                1.45;

        }


        /* =====================================================
           TOP INFO
        ====================================================== */

        .top-info {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                15px;

            margin-bottom:
                20px;

        }


        .progress {

            color:
                var(--ink-soft);

            font-size:
                1.1rem;

            font-weight:
                700;

        }


        .score-value {

            color:
                var(--accent-dark);

            font-weight:
                800;

        }


        /* =====================================================
           PROGRESS BAR
        ====================================================== */

        .progress-bar {

            width:
                100%;

            height:
                8px;

            margin-top:
                7px;

            overflow:
                hidden;

            border-radius:
                999px;

            background:
                #e6edf2;

        }


        .progress-fill {

            width:
                0%;

            height:
                100%;

            border-radius:
                inherit;

            background:
                var(--accent);

            transition:
                width 0.3s ease;

        }


        /* =====================================================
           SCORE ROW
        ====================================================== */

        .score-row {

            display:
                flex;

            justify-content:
                center;

            gap:
                12px;

            margin-bottom:
                20px;

        }


        .score-box {

            min-width:
                120px;

            padding:
                9px 16px;

            border:
                1px solid
                var(--line);

            border-radius:
                14px;

            background:
                #ffffff;

            text-align:
                center;

        }


        .score-label {

            display:
                block;

            margin-bottom:
                3px;

            color:
                var(--ink-soft);

            font-size:
                1rem;

            font-weight:
                700;

            text-transform:
                uppercase;

            letter-spacing:
                0.04em;

        }


        .score-number {

            color:
                var(--accent-dark);

            font-size:
                1.4rem;

            font-weight:
                800;

        }


        /* =====================================================
           INSTRUCTION
        ====================================================== */

        .instruction {

            margin:
                0 0 17px;

            color:
                var(--ink);

            font-size:
                1.2rem;

            font-weight:
                700;

            text-align:
                center;

        }


        /* =====================================================
           CARD GRID
        ====================================================== */

        .card-grid {

            width:
                min(
                    650px,
                    100%
                );

            margin:
                0 auto;

            display:
                grid;

            grid-template-columns:
                repeat(
                    3,
                    1fr
                );

            gap:
                16px;

        }


        /* =====================================================
           MEMORY CARD
        ====================================================== */

        .memory-card {

            position:
                relative;

            width:
                100%;

            aspect-ratio:
                1 / 1;

            perspective:
                1000px;

            cursor:
                pointer;

        }


        .memory-card.disabled {

            cursor:
                default;

        }


        .card-inner {

            position:
                absolute;

            inset:
                0;

            width:
                100%;

            height:
                100%;

            transition:
                transform 0.45s ease;

            transform-style:
                preserve-3d;

        }


        .memory-card.flipped .card-inner,
        .memory-card.matched .card-inner {

            transform:
                rotateY(
                    180deg
                );

        }


        /* =====================================================
           CARD FACE
        ====================================================== */

        .card-face {

            position:
                absolute;

            inset:
                0;

            width:
                100%;

            height:
                100%;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                14px;

            border:
                2px solid
                var(--line);

            border-radius:
                17px;

            backface-visibility:
                hidden;

            -webkit-backface-visibility:
                hidden;

            text-align:
                center;

            overflow:
                hidden;

        }


        /* =====================================================
           CARD ACCENT LINE
        ====================================================== */

        .card-face::before {

            content:
                "";

            position:
                absolute;

            top:
                0;

            left:
                0;

            width:
                100%;

            height:
                4px;

            background:
                var(--accent);

        }


        /* =====================================================
           CARD FRONT
        ====================================================== */

        .card-front {

            background:
                var(--accent-light);

            border-color:
                var(--accent-border);

            color:
                var(--accent-dark);

            font-size:
                2.35rem;

            font-weight:
                800;

        }


        /* =====================================================
           CARD BACK
        ====================================================== */

        .card-back {

            transform:
                rotateY(
                    180deg
                );

            background:
                #ffffff;

            color:
                var(--ink);

            font-size:
                clamp(
                    1.15rem,
                    2.3vw,
                    1.4rem
                );

            font-weight:
                800;

            line-height:
                1.3;

        }


        /* =====================================================
           MATCHED
        ====================================================== */

        .memory-card.matched
        .card-back {

            border:
                3px solid
                var(--correct);

            background:
                var(--correct-bg);

            color:
                var(--correct);

        }


        .memory-card.matched
        .card-back::before {

            background:
                var(--correct);

        }


        /* =====================================================
           WRONG
        ====================================================== */

        .memory-card.show-wrong
        .card-back {

            border:
                3px solid
                var(--wrong);

            background:
                var(--wrong-bg);

            color:
                var(--wrong);

        }


        .memory-card.show-wrong
        .card-back::before {

            background:
                var(--wrong);

        }


        /* =====================================================
           WRONG MARK
        ====================================================== */

        .wrong-mark {

            position:
                absolute;

            top:
                50%;

            left:
                50%;

            z-index:
                20;

            width:
                56px;

            height:
                56px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            transform:
                translate(
                    -50%,
                    -50%
                );

            border:
                3px solid
                var(--wrong);

            border-radius:
                50%;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.97
                );

            color:
                var(--wrong);

            font-size:
                2.15rem;

            font-weight:
                900;

            opacity:
                0;

            pointer-events:
                none;

        }


        .memory-card.show-wrong
        .wrong-mark {

            opacity:
                1;

        }


        /* =====================================================
           ROUND MESSAGE
        ====================================================== */

        .round-message {

            min-height:
                30px;

            margin:
                19px 0 0;

            color:
                var(--ink-soft);

            font-size:
                1.18rem;

            font-weight:
                700;

            text-align:
                center;

        }


        /* =====================================================
           NEXT BUTTON
        ====================================================== */

        .next-btn {

            display:
                block;

            margin:
                16px auto 0;

            padding:
                11px 23px;

            border:
                0;

            border-radius:
                999px;

            background:
                var(--accent);

            color:
                #ffffff;

            font-size:
                1.16rem;

            font-weight:
                800;

            cursor:
                pointer;

            box-shadow:
                0 6px 14px
                rgba(
                    66,
                    116,
                    79,
                    0.18
                );

            transition:
                0.2s ease;

        }


        .next-btn:hover:not(:disabled) {

            transform:
                translateY(-2px);

            background:
                var(--accent-dark);

        }


        .next-btn:disabled {

            opacity:
                0.4;

            cursor:
                default;

            box-shadow:
                none;

        }


        /* =====================================================
           RESULT
        ====================================================== */

        .result-screen {

            display:
                none;

            padding:
                42px 25px 35px;

            text-align:
                center;

        }


        .result-screen.show {

            display:
                block;

        }


        .result-icon {

            margin-bottom:
                8px;

            font-size:
                3.4rem;

        }


        .result-title {

            margin:
                0 0 8px;

            font-family:
                'Kalam',
                cursive;

            color:
                var(--ink);

            font-size:
                3rem;

        }


        .final-score {

            margin:
                14px 0;

            color:
                var(--accent-dark);

            font-size:
                3.2rem;

            font-weight:
                900;

        }


        .result-text {

            max-width:
                580px;

            margin:
                0 auto;

            color:
                var(--ink-soft);

            font-size:
                1.2rem;

            line-height:
                1.5;

        }


        .restart-btn {

            margin-top:
                23px;

            padding:
                12px 25px;

            border:
                0;

            border-radius:
                999px;

            background:
                var(--accent);

            color:
                #ffffff;

            font-size:
                1.16rem;

            font-weight:
                800;

            cursor:
                pointer;

            transition:
                0.2s ease;

        }


        .restart-btn:hover {

            transform:
                translateY(-2px);

            background:
                var(--accent-dark);

        }


        /* =====================================================
           FOOTER
        ====================================================== */

        footer {

            width:
                min(
                    900px,
                    100%
                );

            margin:
                18px auto 0;

            color:
                #6f777d;

            font-size:
                1rem;

            text-align:
                center;

        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (
            max-width: 650px
        ) {

            body {

                padding:
                    18px 12px 30px;

            }


            .game-container {

                padding:
                    28px 18px 30px;

                border-radius:
                    20px;

            }


            .game-title {

                font-size:
                    2.55rem;

            }


            .game-description {

                font-size:
                    1.1rem;

            }


            .top-info {

                flex-direction:
                    column;

                align-items:
                    stretch;

                text-align:
                    center;

                gap:
                    5px;

            }


            .score-row {

                gap:
                    8px;

            }


            .score-box {

                min-width:
                    105px;

            }


            .card-grid {

                gap:
                    10px;

            }


            .card-face {

                border-radius:
                    14px;

                padding:
                    7px;

            }


            .card-front {

                font-size:
                    1.85rem;

            }


            .card-back {

                font-size:
                    1rem;

            }


            .wrong-mark {

                width:
                    43px;

                height:
                    43px;

                font-size:
                    1.65rem;

            }

        }

    </style>

</head>

                vietnamese: "máy bay",
                phonetic: "mai bai",
                english: "Airplane"
            },

            {
                vietnamese: "tàu",
                phonetic: "tao",
                english: "Boat / Ship"
            },

            {
                vietnamese: "xe ôm",
                phonetic: "seh om",
                english: "Motorbike taxi"
            },

            {
                vietnamese: "đi bộ",
                phonetic: "dee boh",
                english: "Walk / On foot"
            }

        ];


        /* =====================================================
           GAME SETTINGS
        ====================================================== */

        const TOTAL_ROUNDS =
            20;

        const PAIRS_PER_ROUND =
            3;

        const WRONG_DISPLAY_TIME =
            900;

        const CORRECT_DISPLAY_TIME =
            500;


        /* =====================================================
           STATE
        ====================================================== */

        let round =
            1;

        let score =
            0;

        let matchedPairs =
            0;

        let selectedCards =
            [];

        let lockBoard =
            false;

        let currentPairs =
            [];

        let availableVocabulary =
            [];


        /* =====================================================
           ELEMENTS
        ====================================================== */

        const cardGrid =
            document.getElementById(
                "card-grid"
            );

        const progress =
            document.getElementById(
                "progress"
            );

        const progressFill =
            document.getElementById(
                "progress-fill"
            );

        const scoreElement =
            document.getElementById(
                "score"
            );

        const scoreTop =
            document.getElementById(
                "score-top"
            );

        const matchesElement =
            document.getElementById(
                "matches"
            );

        const roundMessage =
            document.getElementById(
                "round-message"
            );

        const nextButton =
            document.getElementById(
                "next-btn"
            );

        const gameArea =
            document.getElementById(
                "game-area"
            );

        const resultScreen =
            document.getElementById(
                "result-screen"
            );

        const finalScore =
            document.getElementById(
                "final-score"
            );

        const resultText =
            document.getElementById(
                "result-text"
            );

        const restartButton =
            document.getElementById(
                "restart-btn"
            );


        /* =====================================================
           SHUFFLE
        ====================================================== */

        function shuffle(
            array
        ) {

            const result =
                [...array];


            for (
                let i = result.length - 1;
                i > 0;
                i--
            ) {

                const j =
                    Math.floor(
                        Math.random() *
                        (i + 1)
                    );


                [
                    result[i],
                    result[j]
                ] =
                [
                    result[j],
                    result[i]
                ];

            }


            return result;

        }


        /* =====================================================
           GET ROUND VOCABULARY
        ====================================================== */

        function getRoundPairs() {

            if (
                availableVocabulary.length <
                PAIRS_PER_ROUND
            ) {

                availableVocabulary =
                    shuffle(
                        vocabulary
                    );

            }


            return availableVocabulary.splice(
                0,
                PAIRS_PER_ROUND
            );

        }


        /* =====================================================
           ESCAPE HTML
        ====================================================== */

        function escapeHtml(
            value
        ) {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                String(
                    value ?? ""
                );


            return div.innerHTML;

        }


        /* =====================================================
           CREATE CARD
        ====================================================== */

        function createCard(
            pair,
            type
        ) {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "memory-card";


            card.dataset.pairId =
                pair.id;


            card.dataset.type =
                type;


            const value =
                type === "vietnamese"
                    ? pair.vietnamese
                    : pair.english;


            card.innerHTML = `

                <div class="card-inner">

                    <div class="card-face card-front">
                        ?
                    </div>

                    <div class="card-face card-back">
                        ${escapeHtml(value)}
                    </div>

                </div>

                <div class="wrong-mark">
                    ✕
                </div>

            `;


            card.addEventListener(
                "click",
                () => {

                    handleCardClick(
                        card
                    );

                }
            );


            return card;

        }


        /* =====================================================
           START ROUND
        ====================================================== */

        function startRound() {

            selectedCards =
                [];

            matchedPairs =
                0;

            lockBoard =
                false;


            nextButton.disabled =
                true;


            roundMessage.textContent =
                "";


            progress.textContent =
                `Round ${round} / ${TOTAL_ROUNDS}`;


            scoreElement.textContent =
                `${score} / ${TOTAL_ROUNDS}`;


            scoreTop.textContent =
                score;


            matchesElement.textContent =
                `${matchedPairs} / ${PAIRS_PER_ROUND}`;


            progressFill.style.width =
                `${(
                    (round - 1) /
                    TOTAL_ROUNDS
                ) * 100}%`;


            currentPairs =
                getRoundPairs();


            currentPairs =
                currentPairs.map(
                    (
                        pair,
                        index
                    ) => ({

                        ...pair,

                        id:
                            `round-${round}-pair-${index}`

                    })
                );


            let cards =
                [];


            currentPairs.forEach(
                pair => {

                    cards.push(
                        createCard(
                            pair,
                            "vietnamese"
                        )
                    );


                    cards.push(
                        createCard(
                            pair,
                            "english"
                        )
                    );

                }
            );


            cards =
                shuffle(
                    cards
                );


            cardGrid.innerHTML =
                "";


            cards.forEach(
                card => {

                    cardGrid.appendChild(
                        card
                    );

                }
            );

        }


        /* =====================================================
           HANDLE CARD CLICK
        ====================================================== */

        function handleCardClick(
            card
        ) {

            if (
                lockBoard
            ) {

                return;

            }


            if (
                card.classList.contains(
                    "flipped"
                )
            ) {

                return;

            }


            if (
                card.classList.contains(
                    "matched"
                )
            ) {

                return;

            }


            card.classList.add(
                "flipped"
            );


            selectedCards.push(
                card
            );


            if (
                selectedCards.length !== 2
            ) {

                return;

            }


            lockBoard =
                true;


            checkMatch();

        }


        /* =====================================================
           CHECK MATCH
        ====================================================== */

        function checkMatch() {

            const [
                first,
                second
            ] =
            selectedCards;


            const isMatch =
                first.dataset.pairId ===
                second.dataset.pairId;


            if (
                isMatch
            ) {

                setTimeout(
                    () => {

                        markCorrect(
                            first,
                            second
                        );

                    },
                    CORRECT_DISPLAY_TIME
                );


                return;

            }


            setTimeout(
                () => {

                    first.classList.add(
                        "show-wrong"
                    );

                    second.classList.add(
                        "show-wrong"
                    );


                    roundMessage.textContent =
                        "✕ Not a match";


                    setTimeout(
                        () => {

                            first.classList.remove(
                                "show-wrong"
                            );

                            second.classList.remove(
                                "show-wrong"
                            );


                            first.classList.remove(
                                "flipped"
                            );

                            second.classList.remove(
                                "flipped"
                            );


                            selectedCards =
                                [];

                            lockBoard =
                                false;


                            roundMessage.textContent =
                                "Try another pair.";

                        },
                        WRONG_DISPLAY_TIME
                    );

                },
                650
            );

        }


        /* =====================================================
           MARK CORRECT
        ====================================================== */

        function markCorrect(
            first,
            second
        ) {

            matchedPairs++;

            score++;


            first.classList.add(
                "matched",
                "disabled"
            );


            second.classList.add(
                "matched",
                "disabled"
            );


            selectedCards =
                [];

            lockBoard =
                false;


            scoreElement.textContent =
                `${score} / ${TOTAL_ROUNDS}`;


            scoreTop.textContent =
                score;


            matchesElement.textContent =
                `${matchedPairs} / ${PAIRS_PER_ROUND}`;


            roundMessage.textContent =
                "✓ Match!";


            if (
                matchedPairs ===
                PAIRS_PER_ROUND
            ) {

                roundMessage.textContent =
                    "🎉 Round complete!";


                progressFill.style.width =
                    `${(
                        round /
                        TOTAL_ROUNDS
                    ) * 100}%`;


                if (
                    round <
                    TOTAL_ROUNDS
                ) {

                    nextButton.disabled =
                        false;

                }

                else {

                    setTimeout(
                        showResults,
                        700
                    );

                }

            }

        }


        /* =====================================================
           NEXT ROUND
        ====================================================== */

        nextButton.addEventListener(
            "click",
            () => {

                if (
                    matchedPairs !==
                    PAIRS_PER_ROUND
                ) {

                    return;

                }


                round++;


                startRound();

            }
        );


        /* =====================================================
           SHOW RESULTS
        ====================================================== */

        function showResults() {

            gameArea.style.display =
                "none";


            resultScreen.classList.add(
                "show"
            );


            progressFill.style.width =
                "100%";


            progress.textContent =
                "Complete";


            finalScore.textContent =
                `${score} / ${TOTAL_ROUNDS}`;


            if (
                score ===
                TOTAL_ROUNDS
            ) {

                resultText.textContent =
                    "Perfect score! Excellent vocabulary matching.";

            }

            else if (
                score >= 15
            ) {

                resultText.textContent =
                    "Great job! You know these Vietnamese words well.";

            }

            else if (
                score >= 10
            ) {

                resultText.textContent =
                    "Good work! Keep practicing these vocabulary words.";

            }

            else {

                resultText.textContent =
                    "Keep practicing and try again!";

            }


            if (
                typeof trackGameComplete ===
                "function"
            ) {
                trackGameComplete(
                    "Places - Game 5",
                    score,
                    TOTAL_ROUNDS
                );
            }

        }
        
        /* =====================================================
           RESTART
        ====================================================== */

        restartButton.addEventListener(
            "click",
            () => {

                round =
                    1;

                score =
                    0;

                matchedPairs =
                    0;

                selectedCards =
                    [];

                lockBoard =
                    false;

                availableVocabulary =
                    shuffle(
                        vocabulary
                    );


                gameArea.style.display =
                    "block";


                resultScreen.classList.remove(
                    "show"
                );


                startRound();


                window.scrollTo(
                    {
                        top:
                            0,

                        behavior:
                            "smooth"
                    }
                );

            }
        );


        /* =====================================================
           INITIALIZE
        ====================================================== */

        availableVocabulary =
            shuffle(
                vocabulary
            );
        
        window.trackGameStart(
            "Places - Game 5"
        );

        startRound();

    </script>


</body>

</html>
