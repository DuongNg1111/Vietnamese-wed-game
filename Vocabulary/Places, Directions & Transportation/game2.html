    {

        english: "Bus",
        phonetics: "seh bwit"
    },

    {
        vietnamese: "xe hơi",
        english: "Car",
        phonetics: "seh hoy"
    },

    {
        vietnamese: "taxi",
        english: "Taxi",
        phonetics: "tak-see"
    },

    {
        vietnamese: "xe lửa",
        english: "Train",
        phonetics: "sh lu-ah"
    },

    {
        vietnamese: "máy bay",
        english: "Airplane",
        phonetics: "mai bai"
    },

    {
        vietnamese: "tàu",
        english: "Boat / Ship",
        phonetics: "tao"
    },

    {
        vietnamese: "xe ôm",
        english: "Motorbike taxi",
        phonetics: "seh om"
    },

    {
        vietnamese: "đi bộ",
        english: "Walk / On foot",
        phonetics: "dee boh"
    }

];


/* =========================================================
   GAME SETTINGS
========================================================= */

const TOTAL_QUESTIONS =
    20;


const ANSWERS_PER_QUESTION =
    4;


/* =========================================================
   GAME STATE
========================================================= */

let questions =
    [];


let currentQuestionIndex =
    0;


let score =
    0;


let questionAnswered =
    false;


/* =========================================================
   ELEMENTS
========================================================= */

const questionNumber =
    document.getElementById(
        "question-number"
    );


const scoreDisplay =
    document.getElementById(
        "score-display"
    );


const progressBar =
    document.getElementById(
        "progress-bar"
    );


const questionCard =
    document.getElementById(
        "question-card"
    );


const questionText =
    document.getElementById(
        "question-text"
    );


const answersContainer =
    document.getElementById(
        "answers"
    );


const feedback =
    document.getElementById(
        "feedback"
    );


const nextButton =
    document.getElementById(
        "next-btn"
    );


const results =
    document.getElementById(
        "results"
    );


const finalScoreNumber =
    document.getElementById(
        "final-score-number"
    );


const resultsMessage =
    document.getElementById(
        "results-message"
    );


const resultsIcon =
    document.getElementById(
        "results-icon"
    );


const restartButton =
    document.getElementById(
        "restart-btn"
    );


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array) {

    const copy =
        [...array];


    for (
        let i = copy.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            copy[i],
            copy[j]
        ] =
        [
            copy[j],
            copy[i]
        ];

    }


    return copy;

}


/* =========================================================
   CREATE QUESTIONS
========================================================= */

function createQuestions() {

    const selected =
        shuffle(
            vocabulary
        )
        .slice(
            0,
            TOTAL_QUESTIONS
        );


    return selected.map(
        word => {

            const distractors =
                shuffle(
                    vocabulary.filter(
                        item =>
                            item.vietnamese !==
                            word.vietnamese
                    )
                )
                .slice(
                    0,
                    ANSWERS_PER_QUESTION - 1
                );


            return {

                correct:
                    word,

                options:
                    shuffle(
                        [
                            word,
                            ...distractors
                        ]
                    )

            };

        }
    );

}


/* =========================================================
   RENDER QUESTION
========================================================= */

function renderQuestion() {

    questionAnswered =
        false;


    const question =
        questions[
            currentQuestionIndex
        ];


    questionNumber.textContent =
        `Question ${
            currentQuestionIndex + 1
        } of ${
            TOTAL_QUESTIONS
        }`;


    scoreDisplay.textContent =
        `Score: ${
            score
        }`;


    progressBar.style.width =
        `${
            (
                currentQuestionIndex /
                TOTAL_QUESTIONS
            ) *
            100
        }%`;


    questionText.innerHTML =
        `Which Vietnamese word means <strong>"${
            escapeHtml(
                question.correct.english
            )
        }"</strong>?`;


    answersContainer.innerHTML =
        "";


    feedback.className =
        "feedback";


    feedback.innerHTML =
        "";


    nextButton.className =
        "next-btn";


    const letters =
        [
            "A",
            "B",
            "C",
            "D"
        ];


    question.options.forEach(
        (
            option,
            index
        ) => {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "answer-btn";


            button.dataset.answer =
                option.vietnamese;


            button.innerHTML = `

                <span class="answer-letter">
                    ${
                        letters[index]
                    }
                </span>

                ${
                    escapeHtml(
                        option.vietnamese
                    )
                }

            `;


            button.addEventListener(
                "click",
                () => {

                    handleAnswer(
                        button,
                        option,
                        question.correct
                    );

                }
            );


            answersContainer.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   HANDLE ANSWER
========================================================= */

function handleAnswer(
    selectedButton,
    selectedOption,
    correctOption
) {

    if (
        questionAnswered
    ) {

        return;

    }


    questionAnswered =
        true;


    const answerButtons =
        answersContainer.querySelectorAll(
            ".answer-btn"
        );


    answerButtons.forEach(
        button => {

            button.disabled =
                true;

        }
    );


    const isCorrect =
        selectedOption.vietnamese ===
        correctOption.vietnamese;


    /* =====================================================
       CORRECT
    ====================================================== */

    if (
        isCorrect
    ) {

        score +=
            1;


        selectedButton.classList.add(
            "correct"
        );


        feedback.className =
            "feedback correct show";


        feedback.innerHTML = `
            <strong>✓ Correct!</strong>
            Great job.
            <strong>${
                escapeHtml(
                    correctOption.vietnamese
                )
            }</strong>
            means
            <strong>${
                escapeHtml(
                    correctOption.english
                )
            }</strong>.
        `;

    }


    /* =====================================================
       WRONG
    ====================================================== */

    else {

        selectedButton.classList.add(
            "wrong"
        );


        answerButtons.forEach(
            button => {

                if (
                    button.dataset.answer ===
                    correctOption.vietnamese
                ) {

                    button.classList.add(
                        "revealed"
                    );

                }

            }
        );


        feedback.className =
            "feedback wrong show";


        feedback.innerHTML = `
            <strong>✗ Not quite.</strong>
            The correct answer is
            <strong>${
                escapeHtml(
                    correctOption.vietnamese
                )
            }</strong>
            —
            <strong>${
                escapeHtml(
                    correctOption.english
                )
            }</strong>.
        `;

    }


    scoreDisplay.textContent =
        `Score: ${
            score
        }`;


    nextButton.className =
        "next-btn show";


    nextButton.textContent =
        currentQuestionIndex ===
        TOTAL_QUESTIONS - 1
            ? "See Results →"
            : "Next Question →";

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion() {

    if (
        !questionAnswered
    ) {

        return;

    }


    currentQuestionIndex +=
        1;


    if (
        currentQuestionIndex >=
        TOTAL_QUESTIONS
    ) {

        showResults();

        return;

    }


    renderQuestion();

}


/* =========================================================
   SHOW RESULTS
========================================================= */

function showResults() {

    questionCard.style.display =
        "none";


    document.getElementById(
        "progress-area"
    ).style.display =
        "none";


    results.classList.add(
        "show"
    );


    finalScoreNumber.textContent =
        score;


    progressBar.style.width =
        "100%";


    if (
        score ===
        TOTAL_QUESTIONS
    ) {

        resultsIcon.textContent =
            "🏆";


        resultsMessage.textContent =
            "Perfect score! You know these Vietnamese vocabulary words very well.";

    }


    else if (
        score >=
        16
    ) {

        resultsIcon.textContent =
            "🎉";


        resultsMessage.textContent =
            "Excellent work! You have a strong understanding of these vocabulary words.";

    }


    else if (
        score >=
        12
    ) {

        resultsIcon.textContent =
            "👏";


        resultsMessage.textContent =
            "Good job! Keep practicing and these words will become easier to remember.";

    }


    else {

        resultsIcon.textContent =
            "💪";


        resultsMessage.textContent =
            "Keep practicing! Review the vocabulary and try the game again.";

    }


    createConfetti();


    if (
        typeof trackGameComplete ===
        "function"
    ) {
        trackGameComplete(
            "Places - Game 2",
            score,
            TOTAL_QUESTIONS
        );
    }

}


/* =========================================================
   RESTART
========================================================= */

function restartGame() {

    removeConfetti();


    score =
        0;


    currentQuestionIndex =
        0;


    questionAnswered =
        false;


    questions =
        createQuestions();


    questionCard.style.display =
        "block";


    document.getElementById(
        "progress-area"
    ).style.display =
        "block";


    results.classList.remove(
        "show"
    );


    renderQuestion();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(
            value ?? ""
        );


    return div.innerHTML;

}


/* =========================================================
   CONFETTI
========================================================= */

function createConfetti() {

    const colors = [

        "#5CA16E",
        "#42744F",
        "#c1e0cc",
        "#019b3f",
        "#d9536f",
        "#f4c95d"

    ];


    for (
        let i = 0;
        i < 120;
        i++
    ) {

        const piece =
            document.createElement(
                "div"
            );


        piece.className =
            "confetti";


        piece.style.left =
            Math.random() * 100 +
            "vw";


        piece.style.background =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];


        piece.style.animationDuration =
            3 +
            Math.random() * 3 +
            "s";


        piece.style.opacity =
            0.5 +
            Math.random() * 0.5;


        document.body.appendChild(
            piece
        );

    }

}


/* =========================================================
   REMOVE CONFETTI
========================================================= */

function removeConfetti() {

    document
        .querySelectorAll(
            ".confetti"
        )
        .forEach(
            element =>
                element.remove()
        );

}


/* =========================================================
   EVENTS
========================================================= */

nextButton.addEventListener(
    "click",
    nextQuestion
);


restartButton.addEventListener(
    "click",
    restartGame
);


/* =========================================================
   START GAME
========================================================= */

window.trackGameStart(
    "Places - Game 2"
);

restartGame()

</script>
