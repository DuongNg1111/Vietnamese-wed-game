<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Vietnamese Number Challenge 1–999</title>

<meta
    name="game-title"
    content="Vietnamese Number Challenge 1–999"
>

<meta
    name="game-description"
    content="Practice reading Vietnamese numbers from 1 to 999."
>

<meta
    name="game-icon"
    content="🔢"
>

<meta
    name="game-explanation"
    content="true"
>

<link
    href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap"
    rel="stylesheet"
>

<style>

/* ==========================================================
   THEME
========================================================== */

:root{

    --accent:#7DA15C;

    --accent-dark:#5A7442;

    --accent-light:#f0f7e8;

    --accent-bg:#F6FAF1;

    --accent-border:#d5e6b8;

    --correct:#019b3f;

    --correct-bg:#eaf3ff;

    --wrong:#d9536f;

    --wrong-bg:#fff0f3;

    --general-border:#d9e6f2;

        --ink: #143a6b;
    --ink-soft: #66809d; 


}


/* ==========================================================
   RESET
========================================================== */

*{

    box-sizing:border-box;

}


/* ==========================================================
   BODY
========================================================== */

body{

    margin:0;

    padding:30px 20px;

    background:  linear-gradient(
            180deg,
            #ffffff 0%,
            var(--accent-bg) 48%,
            var(--accent-light) 100%
        );


    min-height:100vh;

    font-family:
        Calibri,
        Arial,
        Helvetica,
        sans-serif;

    display:flex;

    justify-content:center;

    align-items:center;

    color:#222;

}


/* ==========================================================
   PAGE WRAPPER
========================================================== */

.page{

    width:min(900px, 96vw);

}


/* ==========================================================
   BACK TO LOBBY
========================================================== */

.lobby-btn{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    margin-bottom:12px;

    padding:
        7px
        13px;

    border:none;

    border-radius:8px;

    background:#eef5fc;

    color:#34495e;

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-size:22px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.lobby-btn:hover{

    background:#dcecff;

    transform:translateX(-2px);

}


/* ==========================================================
   GAME CONTAINER
========================================================== */

.game-container{

    position:relative;

    width:100%;

    background:#ffffff;

    padding:
        30px
        35px
        35px;

    border-radius:20px;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.08);

}


/* ==========================================================
   TITLE
========================================================== */

h1{

    margin:
        0
        0
        6px;

    text-align:center;

    font-family:
        "Kalam",
        cursive;

    font-size:44px;

    line-height:1.2;

    color:var(--ink);

}


/* ==========================================================
   INTRODUCTION
========================================================== */

.instruction{

    margin:
        0
        0
        25px;

    text-align:center;

    color:#666;

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-size:22px;

    line-height:1.4;

}


/* ==========================================================
   TOP BAR
========================================================== */

.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:15px;

    font-size:20px;

    font-weight:bold;

}


.question-count{

    color:#666;

}


.score{

    color:var(--accent-dark);

    font-size:22px;

}


/* ==========================================================
   PROGRESS
========================================================== */

.progress-wrap{

    width:100%;

    height:9px;

    background:#e5e5e5;

    border-radius:20px;

    overflow:hidden;

    margin-bottom:22px;

}


.progress{

    width:0%;

    height:100%;

    background:var(--accent);

    transition:.3s;

}


/* ==========================================================
   QUESTION CARD
========================================================== */

.question-card{

    position:relative;

    background:#fff;

    border:
        1px solid
        var(--general-border);

    border-radius:15px;

    padding:
        28px
        25px
        25px;

    text-align:center;

    overflow:hidden;

}


/* ==========================================================
   ACCENT LINE
========================================================== */

.question-card::before{

    content:"";

    position:absolute;

    top:0;

    left:0;

    width:100%;

    height:6px;

    background:var(--accent);

}


/* ==========================================================
   QUESTION LABEL
========================================================== */

.question-label{

    margin-bottom:12px;

    color:#777;

    font-size:21px;

    font-weight:bold;

}


/* ==========================================================
   NUMBER DISPLAY
========================================================== */

.number{

    max-width:600px;

    margin:
        0
        auto
        25px;

    padding:
        22px
        20px;

    background:var(--accent-bg);

    border:
        1px solid
        var(--accent-border);

    border-radius:13px;

    color:var(--accent-dark);

    font-size:64px;

    font-weight:bold;

    line-height:1.15;

}


/* ==========================================================
   ANSWERS
========================================================== */

.answers{

    display:grid;

    grid-template-columns:
        repeat(
            2,
            1fr
        );

    gap:12px;

    width:100%;

    max-width:700px;

    margin:
        0
        auto;

}


.answer-btn{

    min-height:70px;

    padding:
        15px
        10px;

    background:#fff;

    border:
        1px solid
        #ccc;

    border-radius:10px;

    color:#222;

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-size:28px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.answer-btn:hover{

    transform:translateY(-2px);

    border-color:var(--accent);

    background:var(--accent-light);

}


.answer-btn.correct{

    background:var(--correct-bg);

    border-color:var(--correct);

    color:var(--correct);

    cursor:default;

}


.answer-btn.wrong{

    background:var(--wrong-bg);

    border-color:var(--wrong);

    color:var(--wrong);

    cursor:default;

}


.answer-btn.disabled{

    cursor:default;

    pointer-events:none;

}


/* ==========================================================
   RESULT
========================================================== */

.result{

    min-height:40px;

    margin:
        15px
        0
        4px;

    font-size:38px;

    text-align:center;

}


.result.correct{

    color:var(--correct);

}


.result.wrong{

    color:var(--wrong);

}


/* ==========================================================
   EXPLANATION
========================================================== */

.explanation{

    display:block;

    margin-top:4px;

    color:#666;

    font-size:20px;

    font-weight:normal;

    line-height:1.5;

}


.explanation strong{

    color:inherit;

}


/* ==========================================================
   NEXT BUTTON
========================================================== */

.next-btn{

    margin-top:10px;

    padding:
        11px
        27px;

    border:none;

    border-radius:9px;

    background:var(--accent);

    color:#fff;

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-size:22px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.next-btn:hover{

    background:var(--accent-dark);

    transform:translateY(-2px);

}


/* ==========================================================
   NEXT CONTAINER
========================================================== */

.next-container{

    text-align:center;

}


/* ==========================================================
   FINAL SCREEN
========================================================== */

#finalScreen{

    text-align:center;

}


#finalScreen h1{

    margin-bottom:10px;

}


.end-description{

    margin:
        0
        0
        20px;

    color:#666;

    font-size:22px;

}


.final-score{

    margin:
        20px
        0;

    color:var(--accent-dark);

    font-size:40px;

    font-weight:bold;

}


.final-message{

    margin-bottom:25px;

    color:#555;

    font-size:24px;

    line-height:1.4;

}


.play-again-btn{

    padding:
        11px
        27px;

    border:none;

    border-radius:9px;

    background:var(--accent);

    color:#fff;

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-size:22px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.play-again-btn:hover{

    background:var(--accent-dark);

    transform:translateY(-2px);

}


/* ==========================================================
   SCREEN
========================================================== */

.screen{

    display:none;

}


.screen.active{

    display:block;

}


/* ==========================================================
   MOBILE
========================================================== */

@media(max-width:650px){

    body{

        padding:
            20px
            10px;

        align-items:flex-start;

    }


    .page{

        width:100%;

    }


    .game-container{

        padding:
            25px
            15px
            25px;

        border-radius:16px;

    }


    .lobby-btn{

        font-size:20px;

        margin-bottom:10px;

    }


    h1{

        font-size:36px;

    }


    .instruction{

        font-size:19px;

        margin-bottom:20px;

    }


    .topbar{

        font-size:18px;

    }


    .score{

        font-size:20px;

    }


    .question-card{

        padding:
            25px
            15px
            20px;

    }


    .question-label{

        font-size:19px;

    }


    .number{

        font-size:52px;

        padding:
            20px
            15px;

    }


    .answers{

        grid-template-columns:
            1fr;

        gap:10px;

    }


    .answer-btn{

        font-size:27px;

        min-height:auto;

        padding:
            14px
            8px;

    }


    .result{

        font-size:34px;

    }


    .explanation{

        font-size:19px;

    }


    .final-score{

        font-size:36px;

    }


    .final-message{

        font-size:21px;

    }

}

</style>

</head>


<body>


<div class="page">


<!-- ========================================================
     BACK TO LOBBY
========================================================= -->

<button
    class="lobby-btn"
    onclick="backToLobby()"
>

    ← Back

</button>



<!-- ========================================================
     GAME CONTAINER
========================================================= -->

<div class="game-container">


<!-- ========================================================
     GAME
========================================================= -->

<div
    id="game"
    class="screen active"
>


    <h1>

        🔢 Vietnamese Number 1-999

    </h1>


    <p class="instruction">

        Practice reading Vietnamese numbers from 1 to 999.

    </p>



    <!-- TOP BAR -->

    <div class="topbar">


        <div class="question-count">

            Question

            <span id="qnum">
                1
            </span>

            /15

        </div>


        <div class="score">

            Score:

            <span id="score">
                0
            </span>

        </div>


    </div>



    <!-- PROGRESS -->

    <div class="progress-wrap">

        <div
            class="progress"
            id="progress"
        ></div>

    </div>



    <!-- QUESTION CARD -->

    <div class="question-card">



        <div
            class="number"
            id="numberDisplay"
        >
        </div>



        <!-- ANSWERS -->

        <div
            class="answers"
            id="answers"
        ></div>



        <!-- RESULT -->

        <div
            class="result"
            id="resultIcon"
        ></div>



        <!-- FEEDBACK -->

        <div
            class="explanation"
            id="explanation"
        ></div>



        <!-- NEXT -->

        <div class="next-container">

            <button
                class="next-btn"
                id="nextBtn"
                onclick="nextQuestion()"
                style="display:none;"
            >

                Next →

            </button>

        </div>


    </div>


</div>



<!-- ========================================================
     END
========================================================= -->

<div
    id="finalScreen"
    class="screen"
>


    <h1>

        🎉 Game Complete!

    </h1>


    <p class="end-description">

        You completed all 15 questions.

    </p>


    <div
        class="final-score"
        id="finalScore"
    >

        0 / 15

    </div>


    <div
        class="final-message"
        id="finalMessage"
    ></div>


    <button
        class="play-again-btn"
        onclick="restartGame()"
    >

        Play Again

    </button>


</div>


</div>

</div>



<script>

/* ==========================================================
   SETTINGS
========================================================== */

const TOTAL_QUESTIONS = 15;


/* ==========================================================
   GAME STATE
========================================================== */

let currentQuestion = 0;

let score = 0;

let answered = false;


/* ==========================================================
   DOM
========================================================== */

const game =
    document.getElementById(
        "game"
    );


const finalScreen =
    document.getElementById(
        "finalScreen"
    );


const numberDisplay =
    document.getElementById(
        "numberDisplay"
    );


const answers =
    document.getElementById(
        "answers"
    );


const qnum =
    document.getElementById(
        "qnum"
    );


const scoreDisplay =
    document.getElementById(
        "score"
    );


const resultIcon =
    document.getElementById(
        "resultIcon"
    );


const explanation =
    document.getElementById(
        "explanation"
    );


const nextBtn =
    document.getElementById(
        "nextBtn"
    );


const progress =
    document.getElementById(
        "progress"
    );


/* ==========================================================
   NUMBER WORDS
========================================================== */

const ones = [

    "không",
    "một",
    "hai",
    "ba",
    "bốn",
    "năm",
    "sáu",
    "bảy",
    "tám",
    "chín"

];


const tens = [

    "",
    "",
    "hai",
    "ba",
    "bốn",
    "năm",
    "sáu",
    "bảy",
    "tám",
    "chín"

];


/* ==========================================================
   NUMBER → VIETNAMESE
========================================================== */

function numberToVietnamese(number){

    if(number === 0){

        return "không";

    }


    let result = "";


    /* ==========================
       20–99
    ========================== */

    if(number >= 20){

        const ten =
            Math.floor(
                number / 10
            );


        result =
            tens[ten] +
            " mươi";


        const one =
            number % 10;


        if(one === 0){

            return result;

        }


        if(one === 1){

            return result +
                " mốt";

        }


        if(one === 5){

            return result +
                " lăm";

        }


        return result +
            " " +
            ones[one];

    }


    /* ==========================
       10–19
    ========================== */

    if(number >= 10){

        const one =
            number % 10;


        if(one === 0){

            return "mười";

        }


        if(one === 5){

            return "mười lăm";

        }


        return (
            "mười " +
            ones[one]
        );

    }


    /* ==========================
       1–9
    ========================== */

    return ones[number];

}


/* ==========================================================
   NUMBER → VIETNAMESE 1–999
========================================================== */

function numberToVietnameseFull(number){

    if(number < 100){

        return numberToVietnamese(
            number
        );

    }


    const hundred =
        Math.floor(
            number / 100
        );


    const remainder =
        number % 100;


    let result =
        ones[hundred] +
        " trăm";


    /* ==========================
       EXACT HUNDRED
    ========================== */

    if(remainder === 0){

        return result;

    }


    /* ==========================
       101–109, 201–209...
    ========================== */

    if(remainder < 10){

        return (
            result +
            " lẻ " +
            ones[remainder]
        );

    }


    /* ==========================
       110–119, 210–219...
    ========================== */

    if(remainder < 20){

        return (
            result +
            " " +
            numberToVietnamese(
                remainder
            )
        );

    }


    /* ==========================
       120–999
    ========================== */

    const ten =
        Math.floor(
            remainder / 10
        );


    const one =
        remainder % 10;


    result +=
        " " +
        tens[ten] +
        " mươi";


    if(one === 0){

        return result;

    }


    if(one === 1){

        return result +
            " mốt";

    }


    if(one === 5){

        return result +
            " lăm";

    }


    return (
        result +
        " " +
        ones[one]
    );

}


/* ==========================================================
   QUESTIONS
========================================================== */

const questions = [

    7,
    14,
    21,
    35,
    48,
    52,
    69,
    101,
    115,
    126,
    204,
    350,
    507,
    721,
    999

];


/* ==========================================================
   SHUFFLE
========================================================== */

function shuffle(array){

    const arr = [...array];


    for(
        let i = arr.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] =
        [
            arr[j],
            arr[i]
        ];

    }


    return arr;

}


/* ==========================================================
   WRONG ANSWERS
========================================================== */

function generateWrongAnswers(
    correctNumber
){

    const wrongNumbers =
        new Set();


    while(
        wrongNumbers.size < 3
    ){

        const variation =
            Math.floor(
                Math.random() * 80
            ) + 1;


        let randomNumber;


        if(
            Math.random() < 0.5
        ){

            randomNumber =
                correctNumber +
                variation;

        }else{

            randomNumber =
                correctNumber -
                variation;

        }


        if(
            randomNumber < 1 ||
            randomNumber > 999 ||
            randomNumber === correctNumber
        ){

            continue;

        }


        wrongNumbers.add(
            randomNumber
        );

    }


    return [
        ...wrongNumbers
    ];

}


/* ==========================================================
   START GAME
========================================================== */

function startGame(){

    currentQuestion = 0;

    score = 0;

    answered = false;


    game.classList.add(
        "active"
    );


    finalScreen.classList.remove(
        "active"
    );


    scoreDisplay.innerText =
        "0";


    loadQuestion();

}


/* ==========================================================
   LOAD QUESTION
========================================================== */

function loadQuestion(){

    answered = false;


    resultIcon.innerText =
        "";


    resultIcon.className =
        "result";


    explanation.innerHTML =
        "";


    nextBtn.style.display =
        "none";


    qnum.innerText =
        currentQuestion + 1;


    progress.style.width =
        (
            currentQuestion /
            TOTAL_QUESTIONS *
            100
        ) + "%";


    const correctNumber =
        questions[
            currentQuestion
        ];


    const correctAnswer =
        numberToVietnameseFull(
            correctNumber
        );


    numberDisplay.innerText =
        correctNumber;


    const wrongNumbers =
        generateWrongAnswers(
            correctNumber
        );


    const options = [

        {
            number:
                correctNumber,

            text:
                correctAnswer,

            correct:
                true

        },

        ...wrongNumbers.map(
            number => ({

                number:
                    number,

                text:
                    numberToVietnameseFull(
                        number
                    ),

                correct:
                    false

            })
        )

    ];


    const shuffledOptions =
        shuffle(options);


    answers.innerHTML =
        "";


    shuffledOptions.forEach(
        option => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "answer-btn";


            button.textContent =
                option.text;


            button.onclick =
                () => {

                    checkAnswer(
                        button,
                        option.correct,
                        correctAnswer
                    );

                };


            answers.appendChild(
                button
            );

        }
    );

}


/* ==========================================================
   CHECK ANSWER
========================================================== */

function checkAnswer(
    button,
    isCorrect,
    correctAnswer
){

    if(answered){

        return;

    }


    answered = true;


    const buttons =
        document.querySelectorAll(
            ".answer-btn"
        );


    buttons.forEach(
        btn => {

            btn.classList.add(
                "disabled"
            );

        }
    );


    if(isCorrect){

        score++;


        button.classList.add(
            "correct"
        );


        resultIcon.innerText =
            "✔";


        resultIcon.className =
            "result correct";


        explanation.innerHTML =

            `Correct! 🎉
            <span class="explanation">
                ${correctAnswer} means
                ${questions[currentQuestion]}.
            </span>`;

    }

    else{

        button.classList.add(
            "wrong"
        );


        buttons.forEach(
            btn => {

                if(
                    btn.textContent ===
                    correctAnswer
                ){

                    btn.classList.add(
                        "correct"
                    );

                }

            }
        );


        resultIcon.innerText =
            "❌";


        resultIcon.className =
            "result wrong";


        explanation.innerHTML =

            `Wrong!
            <span class="explanation">
                The correct answer is
                <strong>${correctAnswer}</strong>.
                ${correctAnswer} means
                ${questions[currentQuestion]}.
            </span>`;

    }


    scoreDisplay.innerText =
        score;


    showExplanation(
        correctAnswer
    );


    nextBtn.style.display =
        "inline-block";


    if(
        currentQuestion ===
        TOTAL_QUESTIONS - 1
    ){

        nextBtn.innerText =
            "Finish 🎉";

    }else{

        nextBtn.innerText =
            "Next →";

    }

}


/* ==========================================================
   EXPLANATION
========================================================== */

function showExplanation(
    correctAnswer
){

    const number =
        questions[
            currentQuestion
        ];


    let tip = "";


    /* 21, 31, 41... */

    if(
        number % 100 >= 20 &&
        number % 10 === 1
    ){

        tip = `

            <span class="explanation">

                💡 Tip:
                After <strong>mươi</strong>,
                1 is often pronounced
                <strong>mốt</strong>.

            </span>

        `;

    }


    /* 25, 35, 45... */

    else if(
        number % 100 >= 20 &&
        number % 10 === 5
    ){

        tip = `

            <span class="explanation">

                💡 Tip:
                After <strong>mươi</strong>,
                5 is pronounced
                <strong>lăm</strong>.

            </span>

        `;

    }


    /* 101, 102... */

    else if(
        number >= 100 &&
        number % 100 < 10 &&
        number % 100 > 0
    ){

        tip = `

            <span class="explanation">

                💡 Tip:
                When the tens place is zero,
                use <strong>lẻ</strong>
                before the final digit.

            </span>

        `;

    }


    explanation.innerHTML = `

        <span class="explanation">

            <strong>Answer:</strong>
            ${number}
            =
            <strong>${correctAnswer}</strong>

        </span>

        ${tip}

    `;

}


/* ==========================================================
   NEXT QUESTION
========================================================== */

function nextQuestion(){

    currentQuestion++;


    if(
        currentQuestion >=
        TOTAL_QUESTIONS
    ){

        finishGame();

        return;

    }


    loadQuestion();

}


/* ==========================================================
   FINISH GAME
========================================================== */

function finishGame(){

    game.classList.remove(
        "active"
    );


    finalScreen.classList.add(
        "active"
    );


    progress.style.width =
        "100%";


    document
        .getElementById("finalScore")
        .innerText =
        score +
        " / " +
        TOTAL_QUESTIONS;


    const percentage =
        Math.round(
            score /
            TOTAL_QUESTIONS *
            100
        );


    let message;


    if(
        percentage === 100
    ){

        message =
            "🏆 Perfect! You can read Vietnamese numbers like a pro!";

    }

    else if(
        percentage >= 80
    ){

        message =
            "🌟 Great job! Your Vietnamese number skills are getting strong.";

    }

    else if(
        percentage >= 50
    ){

        message =
            "👍 Good work! Keep practicing numbers from 1 to 999.";

    }

    else{

        message =
            "💪 Keep practicing! Vietnamese numbers will get easier with repetition.";

    }


    document
        .getElementById("finalMessage")
        .innerText =
        message;

}

    startGame();

}
