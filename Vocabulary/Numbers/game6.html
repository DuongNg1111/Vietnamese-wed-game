<script>

/* ==========================================================
   GAME SETTINGS
========================================================== */

const totalQuestions = 20;


/* ==========================================================
   GAME STATE
========================================================== */

let currentQuestion = 0;

let score = 0;

let currentNumber = 0;

let answered = false;


/* ==========================================================
   DOM
========================================================== */

const gameScreen =
    document.getElementById("gameScreen");

const finalScreen =
    document.getElementById("finalScreen");

const vietnameseNumber =
    document.getElementById("vietnameseNumber");

const answers =
    document.getElementById("answers");

const feedback =
    document.getElementById("feedback");

const explanation =
    document.getElementById("explanation");

const nextBtn =
    document.getElementById("nextBtn");

const questionInfo =
    document.getElementById("questionInfo");

const scoreInfo =
    document.getElementById("scoreInfo");

const progress =
    document.getElementById("progress");


/* ==========================================================
   VIETNAMESE NUMBER WORDS
========================================================== */

const ones = [

    "không",
    "một",
    "hai",
    "ba",
    "bốn",
    "năm",
    "sáu",
    "bảy",
    "tám",
    "chín"

];


/* ==========================================================
   READ TWO DIGITS
========================================================== */

function readTwoDigits(number) {

    const tens =
        Math.floor(number / 10);

    const unit =
        number % 10;


    if (tens === 1) {

        if (unit === 0) {

            return "mười";

        }


        if (unit === 5) {

            return "mười lăm";

        }


        return (
            "mười " +
            ones[unit]
        );

    }


    let result =
        ones[tens] +
        " mươi";


    if (unit === 0) {

        return result;

    }


    if (unit === 1) {

        return (
            result +
            " mốt"
        );

    }


    if (unit === 5) {

        return (
            result +
            " lăm"
        );

    }


    return (
        result +
        " " +
        ones[unit]
    );

}


/* ==========================================================
   NUMBER TO VIETNAMESE
========================================================== */

function numberToVietnamese(number) {

    const hundreds =
        Math.floor(number / 100);

    const remainder =
        number % 100;


    let result =
        ones[hundreds] +
        " trăm";


    if (remainder === 0) {

        return result;

    }


    if (remainder < 10) {

        return (
            result +
            " lẻ " +
            ones[remainder]
        );

    }


    return (
        result +
        " " +
        readTwoDigits(remainder)
    );

}


/* ==========================================================
   ENGLISH NUMBER WORDS
========================================================== */

const englishOnes = [

    "zero",
    "one",
    "two",
    "three",
    "four",
    "five",
    "six",
    "seven",
    "eight",
    "nine",
    "ten",
    "eleven",
    "twelve",
    "thirteen",
    "fourteen",
    "fifteen",
    "sixteen",
    "seventeen",
    "eighteen",
    "nineteen"

];


const englishTens = [

    "",
    "",
    "twenty",
    "thirty",
    "forty",
    "fifty",
    "sixty",
    "seventy",
    "eighty",
    "ninety"

];


/* ==========================================================
   NUMBER TO ENGLISH
========================================================== */

function numberToEnglish(number) {

    if (number < 20) {

        return englishOnes[number];

    }


    if (number < 100) {

        const tens =
            Math.floor(number / 10);

        const unit =
            number % 10;


        if (unit === 0) {

            return englishTens[tens];

        }


        return (
            englishTens[tens] +
            "-" +
            englishOnes[unit]
        );

    }


    const hundreds =
        Math.floor(number / 100);

    const remainder =
        number % 100;


    let result =
        englishOnes[hundreds] +
        " hundred";


    if (remainder === 0) {

        return result;

    }


    return (
        result +
        " " +
        numberToEnglish(remainder)
    );

}


/* ==========================================================
   RANDOM NUMBER
========================================================== */

function randomNumber() {

    return (
        Math.floor(
            Math.random() * 900
        ) + 100
    );

}


/* ==========================================================
   SHUFFLE
========================================================== */

function shuffle(array) {

    const arr = [...array];


    for (
        let i = arr.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] =
        [
            arr[j],
            arr[i]
        ];

    }


    return arr;

}


/* ==========================================================
   GENERATE CHOICES
========================================================== */

function generateChoices(correct) {

    const choices =
        new Set();


    choices.add(correct);


    const candidates = [];


    const correctHundred =
        Math.floor(correct / 100);

    const correctRemainder =
        correct % 100;


    /* DIFFERENT HUNDREDS */

    for (
        let hundred = 1;
        hundred <= 9;
        hundred++
    ) {

        if (
            hundred !==
            correctHundred
        ) {

            candidates.push(
                hundred * 100 +
                correctRemainder
            );

        }

    }


    /* DIFFERENT TENS */

    const correctTens =
        Math.floor(
            correctRemainder / 10
        );

    const unit =
        correct % 10;


    for (
        let tens = 0;
        tens <= 9;
        tens++
    ) {

        if (
            tens !==
            correctTens
        ) {

            const candidate =
                correctHundred * 100 +
                tens * 10 +
                unit;


            if (
                candidate >= 100 &&
                candidate <= 999
            ) {

                candidates.push(
                    candidate
                );

            }

        }

    }


    /* DIFFERENT UNITS */

    const tensPart =
        Math.floor(
            correctRemainder / 10
        ) * 10;


    for (
        let newUnit = 0;
        newUnit <= 9;
        newUnit++
    ) {

        if (
            newUnit !== unit
        ) {

            const candidate =
                correctHundred * 100 +
                tensPart +
                newUnit;


            if (
                candidate >= 100 &&
                candidate <= 999
            ) {

                candidates.push(
                    candidate
                );

            }

        }

    }


    /* SHUFFLE */

    const shuffledCandidates =
        shuffle(candidates);


    /* ADD DISTRACTORS */

    for (
        const candidate of
        shuffledCandidates
    ) {

        if (
            choices.size >= 4
        ) {

            break;

        }


        choices.add(candidate);

    }


    /* FALLBACK */

    while (
        choices.size < 4
    ) {

        const candidate =
            randomNumber();


        if (
            candidate !== correct
        ) {

            choices.add(candidate);

        }

    }


    return shuffle(
        [...choices]
    );

}


/* ==========================================================
   START GAME
========================================================== */

function startGame() {

    currentQuestion = 0;

    score = 0;

    currentNumber = 0;

    answered = false;


    gameScreen.style.display =
        "block";

    finalScreen.style.display =
        "none";


    scoreInfo.textContent =
        "Score: 0";


    loadQuestion();

}


/* ==========================================================
   LOAD QUESTION
========================================================== */

function loadQuestion() {

    answered = false;


    feedback.textContent =
        "";

    feedback.className =
        "feedback";


    explanation.innerHTML =
        "";

    explanation.classList.add(
        "hidden"
    );


    nextBtn.style.display =
        "none";


    currentNumber =
        randomNumber();


    vietnameseNumber.textContent =
        numberToVietnamese(
            currentNumber
        );


    questionInfo.textContent =
        `Question ${
            currentQuestion + 1
        } / ${totalQuestions}`;


    scoreInfo.textContent =
        `Score: ${score}`;


    progress.style.width =
        (
            (currentQuestion + 1) /
            totalQuestions *
            100
        ) + "%";


    const choices =
        generateChoices(
            currentNumber
        );


    answers.innerHTML =
        "";


    choices.forEach(
        number => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "answer-btn";


            button.textContent =
                numberToEnglish(
                    number
                );


            button.dataset.number =
                number;


            button.onclick =
                () =>
                    checkAnswer(
                        button,
                        number
                    );


            answers.appendChild(
                button
            );

        }
    );

}


/* ==========================================================
   CHECK ANSWER
========================================================== */

function checkAnswer(
    button,
    selected
) {

    if (answered) {

        return;

    }


    answered = true;


    const buttons =
        document.querySelectorAll(
            ".answer-btn"
        );


    buttons.forEach(
        btn => {

            btn.disabled =
                true;

        }
    );


    /* CORRECT */

    if (
        selected ===
        currentNumber
    ) {

        button.classList.add(
            "correct"
        );


        score++;


        feedback.className =
            "feedback correct-text";


        feedback.textContent =
            "✅ Correct! +1 point";

    }


    /* WRONG */

    else {

        button.classList.add(
            "wrong"
        );


        buttons.forEach(
            btn => {

                if (
                    Number(
                        btn.dataset.number
                    ) ===
                    currentNumber
                ) {

                    btn.classList.add(
                        "correct"
                    );

                }

            }
        );


        feedback.className =
            "feedback wrong-text";


        feedback.textContent =
            "❌ Incorrect. 0 points.";

    }


    scoreInfo.textContent =
        `Score: ${score}`;


    showExplanation();


    nextBtn.style.display =
        "block";


    if (
        currentQuestion ===
        totalQuestions - 1
    ) {

        nextBtn.textContent =
            "Finish 🎉";

    }

    else {

        nextBtn.textContent =
            "Next Question ➜";

    }

}


/* ==========================================================
   EXPLANATION
========================================================== */

function showExplanation() {

    const english =
        numberToEnglish(
            currentNumber
        );


    const vietnamese =
        numberToVietnamese(
            currentNumber
        );


    const remainder =
        currentNumber % 100;


    let tip = "";


    /* MỐT */

    if (
        remainder >= 20 &&
        currentNumber % 10 === 1
    ) {

        tip = `

            <br><br>

            <strong>💡 Tip:</strong>

            After <strong>mươi</strong>,
            1 is commonly pronounced
            <strong>mốt</strong>.

        `;

    }


    /* LĂM */

    else if (
        remainder >= 20 &&
        currentNumber % 10 === 5
    ) {

        tip = `

            <br><br>

            <strong>💡 Tip:</strong>

            After <strong>mươi</strong>,
            5 is commonly pronounced
            <strong>lăm</strong>.

        `;

    }


    /* LẺ */

    else if (
        remainder > 0 &&
        remainder < 10
    ) {

        tip = `

            <br><br>

            <strong>💡 Tip:</strong>

            When the tens digit is zero,
            use <strong>lẻ</strong>
            before the final digit.

        `;

    }


    explanation.innerHTML = `

        <strong>💡 Learn:</strong>

        <br><br>

        <strong>
            ${vietnamese}
        </strong>

        =

        <strong>
            ${english}
        </strong>

        ${tip}

    `;


    explanation.classList.remove(
        "hidden"
    );

}


/* ==========================================================
   NEXT QUESTION
========================================================== */

function nextQuestion() {

    currentQuestion++;


    if (
        currentQuestion >=
        totalQuestions
    ) {

        finishGame();

        return;

    }


    loadQuestion();

}


/* ==========================================================
   FINISH GAME
========================================================== */

function finishGame() {

    gameScreen.style.display =
        "none";


    finalScreen.style.display =
        "block";


    progress.style.width =
        "100%";


    document.getElementById(
        "finalScore"
    ).textContent =
        `🎯 Score: ${score} / ${totalQuestions}`;


    let message;


    if (
        score ===
        totalQuestions
    ) {

        message =
            "🏆 Perfect! You mastered these numbers!";

    }

    else if (
        score >= 16
    ) {

        message =
            "🌟 Excellent! Your Vietnamese number skills are strong!";

    }

    else if (
        score >= 10
    ) {

        message =
            "👍 Good job! Keep practicing numbers from 100 to 999.";

    }

    else {

        message =
            "💪 Keep practicing! Review the numbers and try again.";

    }


    document.getElementById(
        "finalMessage"
    ).textContent =
        message;


    if (
        typeof trackGameComplete ===
        "function"
    ) {
        trackGameComplete(
            "Numbers - Game 6",
            score,
            totalQuestions
        );
    }

}

/* ==========================================================
   RESTART GAME
========================================================== */

function restartGame() {

    startGame();

}


/* ==========================================================
   START
========================================================== */

window.trackGameStart(
    "Numbers - Game 6"
);

startGame();

</script>
