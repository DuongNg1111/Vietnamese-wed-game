<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Vietnamese Number Multiple Choice</title>

<meta
    name="game-title"
    content="Vietnamese Number Multiple Choice"
>

<meta
    name="game-description"
    content="Choose the correct English number for Vietnamese numbers from 100 to 999."
>

<meta
    name="game-icon"
    content="🔢"
>

<meta
    name="game-explanation"
    content="true"
>


<style>

/* ==========================================================
   RESET
========================================================== */

*{
    box-sizing:border-box;
}


body{

    margin:0;

    padding:20px;

    font-family:
        Arial,
        sans-serif;

    background:#f4f6f8;

    color:#333;

}


/* ==========================================================
   BACK TO LOBBY
========================================================== */

.back-btn-container{

    max-width:900px;

    margin:0 auto 20px;

    text-align:left;

}


.back-btn{

    display:inline-block;

    padding:10px 18px;

    background:white;

    color:#555;

    border:2px solid #ddd;

    border-radius:10px;

    text-decoration:none;

    font-weight:bold;

    transition:.2s;

}


.back-btn:hover{

    background:#f0f0f0;

    transform:translateY(-2px);

}


/* ==========================================================
   MAIN CONTAINER
========================================================== */

.container{

    max-width:900px;

    margin:auto;

}


/* ==========================================================
   INTRO
========================================================== */

.intro{

    background:white;

    padding:35px;

    border-radius:18px;

    box-shadow:
        0 4px 12px
        rgba(0,0,0,.1);

    text-align:center;

}


.intro h1{

    margin-top:0;

    font-size:42px;

}


.intro h2{

    font-size:35px;

}


.intro p{

    font-size:28px;

    line-height:1.6;

    color:#555;

}


.start-btn{

    margin-top:20px;

    padding:13px 30px;

    border:none;

    border-radius:10px;

    font-size:28px;

    cursor:pointer;

    background:#2196f3;

    color:white;

    font-weight:bold;

}


.start-btn:hover{

    opacity:.9;

}


/* ==========================================================
   GAME CARD
========================================================== */

.game-card{

    background:white;

    padding:30px;

    border-radius:18px;

    box-shadow:
        0 4px 12px
        rgba(0,0,0,.1);

}


.game-title{

    text-align:center;

    font-size:40px;

    margin-top:0;

}


.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:25px;

    font-weight:bold;

    color:#555;

}


/* ==========================================================
   QUESTION
========================================================== */

.question{

    text-align:center;

    margin:35px 0;

}


.question-label{

    font-size:28px;

    color:#777;

    margin-bottom:12px;

}


.vietnamese-number{

    font-size:44px;

    font-weight:bold;

    color:#1565c0;

    line-height:1.4;

}


/* ==========================================================
   ANSWERS
========================================================== */

.answers{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:15px;

    max-width:650px;

    margin:30px auto;

}


.answer-btn{

    min-height:75px;

    padding:15px;

    background:#f8f9fa;

    border:2px solid #ddd;

    border-radius:12px;

    font-size:31px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.answer-btn:hover:not(:disabled){

    background:#eef6ff;

    border-color:#2196f3;

    transform:translateY(-2px);

}


.answer-btn:disabled{

    cursor:default;

}


.answer-btn.correct{

    background:#c8e6c9;

    border-color:#4caf50;

    color:#2e7d32;

}


.answer-btn.wrong{

    background:#ffcdd2;

    border-color:#f44336;

    color:#c62828;

}


/* ==========================================================
   FEEDBACK
========================================================== */

.feedback{

    min-height:50px;

    text-align:center;

    font-size:29px;

    font-weight:bold;

    margin:20px 0;

}


/* ==========================================================
   EXPLANATION
========================================================== */

.explanation{

    margin:20px auto;

    padding:18px 20px;

    max-width:700px;

    background:#f0f7ff;

    border-left:5px solid #4779b8;

    border-radius:12px;

    color:#3d5066;

    font-size:26px;

    line-height:1.6;

    text-align:left;

}


.hidden{

    display:none;

}


/* ==========================================================
   NEXT BUTTON
========================================================== */

.next-btn{

    display:none;

    margin:20px auto 0;

    padding:12px 28px;

    border:none;

    border-radius:10px;

    background:#2196f3;

    color:white;

    font-size:27px;

    font-weight:bold;

    cursor:pointer;

}


.next-btn:hover{

    opacity:.9;

}


/* ==========================================================
   FINAL
========================================================== */

.final{

    display:none;

    background:white;

    padding:40px 30px;

    border-radius:18px;

    box-shadow:
        0 4px 12px
        rgba(0,0,0,.1);

    text-align:center;

}


.final h2{

    font-size:42px;

    color:#2e7d32;

}


.final-score{

    font-size:40px;

    margin:20px 0;

}


.final-message{

    font-size:29px;

    color:#555;

    line-height:1.5;

}


.play-again-btn{

    margin-top:20px;

    padding:13px 30px;

    border:none;

    border-radius:10px;

    background:#2196f3;

    color:white;

    font-size:28px;

    font-weight:bold;

    cursor:pointer;

}


.play-again-btn:hover{

    opacity:.9;

}


/* ==========================================================
   MOBILE
========================================================== */

@media(max-width:700px){

    body{

        padding:15px;

    }


    .intro,
    .game-card,
    .final{

        padding:20px;

    }


    .intro h1{

        font-size:37px;

    }


    .game-title{

        font-size:36px;

    }


    .topbar{

        font-size:25px;

    }


    .vietnamese-number{

        font-size:37px;

    }


    .answers{

        grid-template-columns:1fr;

    }


    .answer-btn{

        font-size:29px;

        min-height:68px;

    }

}

</style>

</head>


<body>


<!-- ==========================================================
     BACK TO LOBBY
========================================================== -->

<div class="back-btn-container">

    <a
        href="../../category.html?category=Numbers"
        class="back-btn"
    >
        ⬅ Back
    </a>

</div>


<div class="container">


<!-- ==========================================================
     INTRO SCREEN
========================================================== -->

<div
    class="intro"
    id="introScreen"
>

    <h1>
        🔢 Vietnamese Number Multiple Choice
    </h1>


    <h2>
        How to Play
    </h2>

    <p>
        🎯 Choose the correct English number.
    </p>

    <button
        class="start-btn"
        onclick="startGame()"
    >
        Start Game
    </button>

</div>


<!-- ==========================================================
     GAME SCREEN
========================================================== -->

<div
    class="game-card"
    id="gameScreen"
    style="display:none;"
>

    <h1 class="game-title">
        🔢 Vietnamese Number Multiple Choice
    </h1>


    <div class="topbar">

        <div id="questionInfo">
            Question 1 / 20
        </div>


        <div id="scoreInfo">
            Score: 0
        </div>

    </div>


    <div class="question">

        <div class="question-label">
            What number is this in English?
        </div>


        <div
            class="vietnamese-number"
            id="vietnameseNumber"
        >
        </div>

    </div>


    <div
        class="answers"
        id="answers"
    >
    </div>


    <div
        class="feedback"
        id="feedback"
    >
    </div>


    <div
        id="explanation"
        class="explanation hidden"
    >
    </div>


    <button
        class="next-btn"
        id="nextBtn"
        onclick="nextQuestion()"
    >
        Next Question ➜
    </button>

</div>


<!-- ==========================================================
     FINAL SCREEN
========================================================== -->

<div
    class="final"
    id="finalScreen"
>

    <h2>
        🎉 Finished!
    </h2>


    <div
        class="final-score"
        id="finalScore"
    >
    </div>


    <div
        class="final-message"
        id="finalMessage"
    >
    </div>


    <button
        class="play-again-btn"
        onclick="restartGame()"
    >
        Play Again
    </button>

</div>


</div>


<script>

/* ==========================================================
   GAME SETTINGS
========================================================== */

const totalQuestions = 20;

let currentQuestion = 0;

let score = 0;

let currentNumber = 0;

let answered = false;


/* ==========================================================
   DOM
========================================================== */

const introScreen =
    document.getElementById(
        "introScreen"
    );


const gameScreen =
    document.getElementById(
        "gameScreen"
    );


const finalScreen =
    document.getElementById(
        "finalScreen"
    );


const vietnameseNumber =
    document.getElementById(
        "vietnameseNumber"
    );


const answers =
    document.getElementById(
        "answers"
    );


const feedback =
    document.getElementById(
        "feedback"
    );


const explanation =
    document.getElementById(
        "explanation"
    );


const nextBtn =
    document.getElementById(
        "nextBtn"
    );


const questionInfo =
    document.getElementById(
        "questionInfo"
    );


const scoreInfo =
    document.getElementById(
        "scoreInfo"
    );


/* ==========================================================
   VIETNAMESE NUMBER WORDS
========================================================== */

const ones = [

    "không",
    "một",
    "hai",
    "ba",
    "bốn",
    "năm",
    "sáu",
    "bảy",
    "tám",
    "chín"

];


/* ==========================================================
   READ TWO DIGITS
========================================================== */

function readTwoDigits(number){

    const tens =
        Math.floor(
            number / 10
        );


    const unit =
        number % 10;


    if(tens === 1){

        if(unit === 0){

            return "mười";

        }


        if(unit === 5){

            return "mười lăm";

        }


        return (
            "mười " +
            ones[unit]
        );

    }


    let result =
        ones[tens] +
        " mươi";


    if(unit === 0){

        return result;

    }


    if(unit === 1){

        return (
            result +
            " mốt"
        );

    }


    if(unit === 5){

        return (
            result +
            " lăm"
        );

    }


    return (
        result +
        " " +
        ones[unit]
    );

}


/* ==========================================================
   NUMBER TO VIETNAMESE
========================================================== */

function numberToVietnamese(number){

    const hundreds =
        Math.floor(
            number / 100
        );


    const remainder =
        number % 100;


    let result =
        ones[hundreds] +
        " trăm";


    if(remainder === 0){

        return result;

    }


    if(remainder < 10){

        return (
            result +
            " lẻ " +
            ones[remainder]
        );

    }


    return (
        result +
        " " +
        readTwoDigits(
            remainder
        )
    );

}


/* ==========================================================
   ENGLISH NUMBER WORDS
========================================================== */

const englishOnes = [

    "zero",
    "one",
    "two",
    "three",
    "four",
    "five",
    "six",
    "seven",
    "eight",
    "nine",
    "ten",
    "eleven",
    "twelve",
    "thirteen",
    "fourteen",
    "fifteen",
    "sixteen",
    "seventeen",
    "eighteen",
    "nineteen"

];


const englishTens = [

    "",
    "",
    "twenty",
    "thirty",
    "forty",
    "fifty",
    "sixty",
    "seventy",
    "eighty",
    "ninety"

];


/* ==========================================================
   NUMBER TO ENGLISH
========================================================== */

function numberToEnglish(number){

    if(number < 20){

        return englishOnes[number];

    }


    if(number < 100){

        const tens =
            Math.floor(
                number / 10
            );


        const unit =
            number % 10;


        if(unit === 0){

            return englishTens[tens];

        }


        return (
            englishTens[tens] +
            "-" +
            englishOnes[unit]
        );

    }


    const hundreds =
        Math.floor(
            number / 100
        );


    const remainder =
        number % 100;


    let result =
        englishOnes[hundreds] +
        " hundred";


    if(remainder === 0){

        return result;

    }


    return (
        result +
        " " +
        numberToEnglish(
            remainder
        )
    );

}


/* ==========================================================
   RANDOM NUMBER
========================================================== */

function randomNumber(){

    return (
        Math.floor(
            Math.random() * 900
        ) + 100
    );

}


/* ==========================================================
   START GAME
========================================================== */

function startGame(){

    currentQuestion = 0;

    score = 0;


    introScreen.style.display =
        "none";


    finalScreen.style.display =
        "none";


    gameScreen.style.display =
        "block";


    loadQuestion();

}


/* ==========================================================
   LOAD QUESTION
========================================================== */

function loadQuestion(){

    answered = false;


    feedback.textContent =
        "";


    feedback.style.color =
        "";


    explanation.innerHTML =
        "";


    explanation.classList.add(
        "hidden"
    );


    nextBtn.style.display =
        "none";


    questionInfo.textContent =
        `Question ${
            currentQuestion + 1
        } / ${totalQuestions}`;


    scoreInfo.textContent =
        `Score: ${score}`;


    /* ------------------------------------------------------
       Generate new number
    ------------------------------------------------------ */

    currentNumber =
        randomNumber();


    vietnameseNumber.textContent =
        numberToVietnamese(
            currentNumber
        );


    /* ------------------------------------------------------
       Generate answer choices
    ------------------------------------------------------ */

    const choices =
        generateChoices(
            currentNumber
        );


    answers.innerHTML =
        "";


    choices.forEach(
        number => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "answer-btn";


            button.textContent =
                numberToEnglish(
                    number
                );


            button.dataset.number =
                number;


            button.onclick =
                () => checkAnswer(
                    button,
                    number
                );


            answers.appendChild(
                button
            );

        }
    );

}


/* ==========================================================
   GENERATE CHOICES
========================================================== */

function generateChoices(correct){

    const choices =
        new Set();


    choices.add(correct);


    /*
     * Create distractors with different
     * hundreds / tens / units.
     *
     * This makes the choices clear
     * instead of using extremely similar
     * numbers that may confuse beginners.
     */

    const candidates = [];


    const correctHundred =
        Math.floor(
            correct / 100
        );


    const correctRemainder =
        correct % 100;


    /* Different hundreds */

    for(
        let hundred = 1;
        hundred <= 9;
        hundred++
    ){

        if(
            hundred !==
            correctHundred
        ){

            candidates.push(
                hundred * 100 +
                correctRemainder
            );

        }

    }


    /* Different tens */

    const correctTens =
        Math.floor(
            correctRemainder / 10
        );


    const unit =
        correct % 10;


    for(
        let tens = 0;
        tens <= 9;
        tens++
    ){

        if(
            tens !==
            correctTens
        ){

            const candidate =
                correctHundred * 100 +
                tens * 10 +
                unit;


            if(
                candidate >= 100 &&
                candidate <= 999
            ){

                candidates.push(
                    candidate
                );

            }

        }

    }


    /* Different units */

    const tensPart =
        Math.floor(
            correctRemainder / 10
        ) * 10;


    for(
        let newUnit = 0;
        newUnit <= 9;
        newUnit++
    ){

        if(
            newUnit !== unit
        ){

            const candidate =
                correctHundred * 100 +
                tensPart +
                newUnit;


            if(
                candidate >= 100 &&
                candidate <= 999
            ){

                candidates.push(
                    candidate
                );

            }

        }

    }


    /* Shuffle candidates */

    shuffle(
        candidates
    );


    /* Add unique distractors */

    for(
        const candidate of candidates
    ){

        if(
            choices.size >= 4
        ){

            break;

        }


        choices.add(
            candidate
        );

    }


    /*
     * Safety fallback.
     */

    while(
        choices.size < 4
    ){

        const candidate =
            randomNumber();


        choices.add(
            candidate
        );

    }


    return shuffle(
        [...choices]
    );

}


/* ==========================================================
   SHUFFLE
========================================================== */

function shuffle(array){

    for(
        let i = array.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }


    return array;

}


/* ==========================================================
   CHECK ANSWER
========================================================== */

function checkAnswer(
    button,
    selected
){

    /*
     * Prevent changing the answer
     * after the question has been checked.
     */

    if(answered){

        return;

    }


    answered = true;


    const buttons =
        document.querySelectorAll(
            ".answer-btn"
        );


    buttons.forEach(
        btn => {

            btn.disabled =
                true;

        }
    );


    /* ------------------------------------------------------
       Correct
    ------------------------------------------------------ */

    if(
        selected ===
        currentNumber
    ){

        button.classList.add(
            "correct"
        );


        score++;


        feedback.textContent =
            "✅ Correct!";


        feedback.style.color =
            "#2e7d32";

    }


    /* ------------------------------------------------------
       Wrong
    ------------------------------------------------------ */

    else{

        button.classList.add(
            "wrong"
        );


        buttons.forEach(
            btn => {

                if(
                    Number(
                        btn.dataset.number
                    ) ===
                    currentNumber
                ){

                    btn.classList.add(
                        "correct"
                    );

                }

            }
        );


        feedback.textContent =
            "❌ Incorrect.";


        feedback.style.color =
            "#c62828";

    }


    scoreInfo.textContent =
        `Score: ${score}`;


    showExplanation();


    nextBtn.style.display =
        "block";

}


/* ==========================================================
   EXPLANATION
========================================================== */

function showExplanation(){

    const english =
        numberToEnglish(
            currentNumber
        );


    const vietnamese =
        numberToVietnamese(
            currentNumber
        );


    explanation.innerHTML = `

        <strong>💡 Learn:</strong>

        <br><br>

        <strong>
            ${vietnamese}
        </strong>

        =

        <strong>
            ${english}
        </strong>

        <br><br>

        Read the Vietnamese number
        from hundreds to tens and units.

    `;


    explanation.classList.remove(
        "hidden"
    );

}


/* ==========================================================
   NEXT QUESTION
========================================================== */

function nextQuestion(){

    currentQuestion++;


    if(
        currentQuestion >=
        totalQuestions
    ){

        finishGame();

        return;

    }


    loadQuestion();

}


/* ==========================================================
   FINISH GAME
========================================================== */

function finishGame(){

    gameScreen.style.display =
        "none";


    finalScreen.style.display =
        "block";


    document.getElementById(
        "finalScore"
    ).textContent =
        `🎯 Score: ${score} / ${totalQuestions}`;


    let message;


    if(
        score ===
        totalQuestions
    ){

        message =
            "Perfect! You mastered these numbers! 🎉";

    }

    else if(
        score >= 16
    ){

        message =
            "Excellent! Your Vietnamese number skills are strong! 👏";

    }

    else if(
        score >= 10
    ){

        message =
            "Good job! Keep practicing numbers from 100 to 999.";

    }

    else{

        message =
            "Keep practicing! Review the numbers and try again.";

    }


    document.getElementById(
        "finalMessage"
    ).textContent =
        message;

}


/* ==========================================================
   RESTART GAME
========================================================== */

function restartGame(){

    startGame();

}

</script>

</body>

</html>
