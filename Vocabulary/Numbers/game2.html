
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vietnamese Number Challenge</title>

<meta
    name="game-title"
    content="Vietnamese Number Challenge"
>

<meta
    name="game-description"
    content="Read Vietnamese number words and choose the correct number sequence."
>

<meta
    name="game-icon"
    content="🔢"
>

<style>

/* ==========================================================
   VARIABLES
========================================================== */

:root{

    --accent:#7DA15C;

    --accent-dark:#5A7442;

    --accent-light:#f0f7e8;

    --accent-bg:#F6FAF1;

    --accent-border:#d5e6b8;

    --correct:#019b3f;

    --correct-bg:#eaf3ff;

    --wrong:#d9536f;

    --wrong-bg:#fff0f3;

    --general-border:#d9e6f2;

    --ink: #143a6b;

    --ink-soft: #66809d; 

}


/* ==========================================================
   RESET
========================================================== */

*{

    box-sizing:border-box;

}


/* ==========================================================
   BODY
========================================================== */

body{

    margin:0;

    padding:30px 20px;

    background:linear-gradient(
            180deg,
            #ffffff 0%,
            var(--accent-bg) 48%,
            var(--accent-light) 100%
        );


    min-height:100vh;

    font-family:
        Calibri,
        Arial,
        Helvetica,
        sans-serif;

    display:flex;

    justify-content:center;

    align-items:center;

    color:#222;

}


/* ==========================================================
   PAGE WRAPPER
========================================================== */

.page{

    width:min(900px,100%);

    margin:0 auto;

}


/* ==========================================================
   BACK BUTTON
   OUTSIDE GAME CONTAINER
========================================================== */

.lobby-btn{

    display:inline-block;

    margin:
        0
        0
        12px
        2px;

    padding:
        7px
        13px;

    border:none;

    border-radius:8px;

    background:#eef5fc;

    color:#333;

    font-family:Calibri, Arial, sans-serif;

    font-size:22px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.lobby-btn:hover{

    color:var(--accent-dark);

    transform:translateX(-3px);

}


/* ==========================================================
   MAIN CONTAINER
========================================================== */

.container{

    width:100%;

    background:#ffffff;

    padding:
        32px
        35px
        35px;

    border-radius:20px;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.08);

}


/* ==========================================================
   GAME
========================================================== */

#game{

    display:block;

}


/* ==========================================================
   TITLE
========================================================== */

h1{

    margin:
        0
        0
        6px;

    text-align:center;

    font-family:
        "Kalam",
        cursive;

    font-size:42px;

    font-weight:700;

    color:var(--ink);

}


.subtitle{

    margin:
        0
        0
        25px;

    text-align:center;

    color:#666;

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-size:22px;

    line-height:1.45;

}


/* ==========================================================
   TOP BAR
========================================================== */

.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:12px;

    font-size:20px;

    font-weight:bold;

    color:#555;

}


.score{

    color:var(--accent-dark);

}


/* ==========================================================
   PROGRESS
========================================================== */

.progress-wrap{

    width:100%;

    height:8px;

    background:#e6e6e6;

    border-radius:20px;

    overflow:hidden;

    margin:
        0
        0
        22px;

}


.progress{

    width:0%;

    height:100%;

    background:var(--accent);

    border-radius:20px;

    transition:.3s;

}


/* ==========================================================
   GAME CARD
========================================================== */

.game-card{

    position:relative;

    background:#fff;

    border:
        1px solid
        var(--general-border);

    border-radius:15px;

    padding:
        25px
        25px
        28px;

    overflow:hidden;

}


/* ==========================================================
   ACCENT LINE
========================================================== */

.game-card::before{

    content:"";

    position:absolute;

    top:0;

    left:0;

    width:100%;

    height:5px;

    background:var(--accent);

}


/* ==========================================================
   QUESTION LABEL
========================================================== */

.instruction{

    margin:
        0
        0
        12px;

    text-align:center;

    color:#555;

    font-size:23px;

    font-weight:bold;

}


/* ==========================================================
   NUMBER WORDS CARD
========================================================== */

.number-words{

    width:100%;

    max-width:680px;

    margin:
        0
        auto
        25px;

    padding:
        25px
        20px;

    background:var(--accent-bg);

    border:
        2px solid
        var(--accent-border);

    border-radius:14px;

    text-align:center;

    font-size:38px;

    font-weight:bold;

    color:var(--accent-dark);

}


/* ==========================================================
   ANSWERS
========================================================== */

.answers{

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:14px;

    width:100%;

    max-width:680px;

    margin:
        0
        auto
        22px;

}


/* ==========================================================
   ANSWER BUTTON
========================================================== */

.answer{

    min-height:68px;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:
        14px
        18px;

    background:#fff;

    border:
        2px solid
        var(--general-border);

    border-radius:12px;

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-size:28px;

    font-weight:bold;

    color:#333;

    cursor:pointer;

    transition:
        background .2s,
        border-color .2s,
        transform .2s;

}


.answer:hover{

    background:var(--accent-light);

    border-color:var(--accent);

    transform:translateY(-2px);

}


/* ==========================================================
   CORRECT
========================================================== */

.answer.correct{

    background:var(--correct-bg);

    border-color:var(--correct);

    color:var(--correct);

    cursor:default;

}


/* ==========================================================
   WRONG
========================================================== */

.answer.wrong{

    background:var(--wrong-bg);

    border-color:var(--wrong);

    color:var(--wrong);

    cursor:default;

}


/* ==========================================================
   DISABLED
========================================================== */

.answer.disabled{

    pointer-events:none;

}


/* ==========================================================
   RESULT
========================================================== */

.result{

    min-height:38px;

    margin:
        8px
        0
        5px;

    text-align:center;

    font-size:29px;

    font-weight:bold;

}


.correct-text{

    color:var(--correct);

}


.wrong-text{

    color:var(--wrong);

}


/* ==========================================================
   CORRECT ANSWER
========================================================== */

.correct-answer{

    min-height:30px;

    margin:
        4px
        0
        6px;

    text-align:center;

    font-size:23px;

    font-weight:bold;

    color:#555;

}


/* ==========================================================
   EXPLANATION
========================================================== */

.explanation{

    min-height:28px;

    margin:
        0
        0
        14px;

    text-align:center;

    font-size:20px;

    line-height:1.45;

    color:#666;

}


/* ==========================================================
   NEXT BUTTON
========================================================== */

.next-btn{

    display:block;

    margin:
        5px
        auto
        0;

    padding:
        11px
        25px;

    border:none;

    border-radius:10px;

    background:var(--accent);

    color:#fff;

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-size:23px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.next-btn:hover{

    background:var(--accent-dark);

    transform:translateY(-2px);

}


/* ==========================================================
   END SCREEN
========================================================== */

#end{

    display:none;

    text-align:center;

}


#end h1{

    margin-bottom:10px;

}


.end-description{

    margin:
        0
        0
        20px;

    font-size:22px;

    color:#666;

}


.final-score{

    margin:
        20px
        0
        12px;

    font-size:42px;

    font-weight:bold;

    color:var(--accent-dark);

}


.performance{

    margin-bottom:25px;

    font-size:24px;

    color:#555;

    line-height:1.5;

}


/* ==========================================================
   PLAY AGAIN
========================================================== */

.restart-btn{

    padding:
        12px
        26px;

    border:none;

    border-radius:10px;

    background:var(--accent);

    color:#fff;

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-size:23px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.restart-btn:hover{

    background:var(--accent-dark);

    transform:translateY(-2px);

}


/* ==========================================================
   MOBILE
========================================================== */

@media(max-width:650px){

    body{

        padding:
            20px
            10px;

    }


    .container{

        padding:
            28px
            15px
            20px;

        border-radius:16px;

    }


    h1{

        font-size:35px;

    }


    .subtitle{

        font-size:20px;

    }


    .topbar{

        font-size:18px;

    }


    .game-card{

        padding:
            23px
            14px
            22px;

    }


    .instruction{

        font-size:21px;

    }


    .number-words{

        padding:
            22px
            12px;

        font-size:31px;

    }


    .answers{

        grid-template-columns:1fr;

        gap:11px;

    }


    .answer{

        width:100%;

        min-height:62px;

        font-size:27px;

    }


    .result{

        font-size:27px;

    }


    .correct-answer{

        font-size:21px;

    }


    .explanation{

        font-size:19px;

    }


    .lobby-btn{

        margin-left:0;

        font-size:21px;

    }

}

</style>

     GOOGLE FONT
========================================================== -->

    href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap"

</head>


<body>


<div class="page">


<!-- ========================================================
     BACK TO LOBBY
========================================================= -->

<button
    class="lobby-btn"
    onclick="backToLobby()"
>

    ← Back

</button>


<!-- ========================================================
     GAME CONTAINER
========================================================= -->

<div class="container">


<!-- ========================================================
     GAME
========================================================= -->

<div id="game">


    <!-- TITLE -->

    <h1>

        🔢 Vietnamese Number Challenge

    </h1>


    <!-- SHORT INTRO -->

    <p class="subtitle">

        Read the Vietnamese number words
        and choose the correct number sequence.

    </p>


    <!-- TOP BAR -->

    <div class="topbar">


        <div>

            Question

            <span id="qnum">

                1

            </span>

            / 15

        </div>


        <div class="score">

            Score:

            <span id="score">

                0

            </span>

            / 15

        </div>


    </div>


    <!-- PROGRESS -->

    <div class="progress-wrap">

        <div
            class="progress"
            id="progress"
        ></div>

    </div>


    <!-- ====================================================
         CARD
    ===================================================== -->

    <div class="game-card">


        <!-- INSTRUCTION -->

        <div class="instruction">

            What numbers do these Vietnamese
            words represent?

        </div>


        <!-- VIETNAMESE WORDS -->

        <div
            class="number-words"
            id="numberWords"
        >

            một - năm - tám

        </div>


        <!-- ANSWERS -->

        <div
            class="answers"
            id="answers"
        >

            <!-- JavaScript inserts 4 answers here -->

        </div>


        <!-- RESULT -->

        <div
            class="result"
            id="resultIcon"
        ></div>


        <!-- CORRECT ANSWER -->

        <div
            class="correct-answer"
            id="correctAnswer"
        ></div>


        <!-- EXPLANATION -->

        <div
            class="explanation"
            id="explanation"
        ></div>


        <!-- NEXT -->

        <button
            class="next-btn"
            id="nextBtn"
            onclick="nextQuestion()"
            style="display:none;"
        >

            Next Question →

        </button>


    </div>


</div>


<!-- ========================================================
     END
========================================================= -->

<div id="end">


    <h1>

        🎉 Game Complete!

    </h1>


    <p class="end-description">

        You completed all 15 questions.

    </p>


    <div
        class="final-score"
        id="finalScore"
    >

        0 / 15

    </div>


    <div
        class="performance"
        id="performance"
    ></div>


    <button
        class="restart-btn"
        onclick="restart()"
    >

        Play Again

    </button>


</div>


</div>

</div>


<script>


/* ==========================================================
   NUMBER DATA
   ONLY USE APPROVED VOCABULARY
========================================================== */

const numbers = [

    "không",
    "một",
    "hai",
    "ba",
    "bốn",
    "năm",
    "sáu",
    "bảy",
    "tám",
    "chín",
    "mười"

];


/* ==========================================================
   GAME SETTINGS
========================================================== */

const TOTAL_QUESTIONS = 15;

const NUMBERS_PER_QUESTION = 3;

const TOTAL_OPTIONS = 4;


/* ==========================================================
   GAME STATE
========================================================== */

let questions = [];

let current = 0;

let score = 0;

let answered = false;


/* ==========================================================
   SHUFFLE
========================================================== */

function shuffle(array){

    const arr = [...array];


    for(
        let i = arr.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] =
        [
            arr[j],
            arr[i]
        ];

    }


    return arr;

}


/* ==========================================================
   CREATE RANDOM SEQUENCE
========================================================== */

function createSequence(){

    return [

        Math.floor(
            Math.random() * numbers.length
        ),

        Math.floor(
            Math.random() * numbers.length
        ),

        Math.floor(
            Math.random() * numbers.length
        )

    ];

}


/* ==========================================================
   SEQUENCE KEY
========================================================== */

function sequenceKey(sequence){

    return sequence.join("-");

}


/* ==========================================================
   CREATE UNIQUE QUESTIONS
========================================================== */

function generateQuestions(){

    const result = [];

    const used = new Set();


    while(
        result.length <
        TOTAL_QUESTIONS
    ){

        const sequence =
            createSequence();


        const key =
            sequenceKey(sequence);


        if(
            !used.has(key)
        ){

            used.add(key);

            result.push(sequence);

        }

    }


    return shuffle(result);

}


/* ==========================================================
   CREATE ANSWER OPTIONS
========================================================== */

function generateOptions(correct){

    const options = [];

    const used = new Set();


    const correctKey =
        sequenceKey(correct);


    options.push(correct);

    used.add(correctKey);


    while(
        options.length <
        TOTAL_OPTIONS
    ){

        const sequence =
            createSequence();


        const key =
            sequenceKey(sequence);


        if(
            !used.has(key)
        ){

            used.add(key);

            options.push(sequence);

        }

    }


    return shuffle(options);

}


/* ==========================================================
   START GAME
========================================================== */

function startGame(){

    document
        .getElementById("game")
        .style.display =
        "block";


    document
        .getElementById("end")
        .style.display =
        "none";


    questions =
        generateQuestions();


    current = 0;

    score = 0;

    answered = false;


    document
        .getElementById("score")
        .innerText =
        score;


    loadQuestion();

}


/* ==========================================================
   LOAD QUESTION
========================================================== */

function loadQuestion(){

    answered = false;


    const resultIcon =
        document.getElementById(
            "resultIcon"
        );


    const correctAnswer =
        document.getElementById(
            "correctAnswer"
        );


    const explanation =
        document.getElementById(
            "explanation"
        );


    const nextBtn =
        document.getElementById(
            "nextBtn"
        );


    resultIcon.innerText = "";

    resultIcon.className =
        "result";


    correctAnswer.innerText =
        "";


    explanation.innerText =
        "";


    nextBtn.style.display =
        "none";


    if(
        current >=
        questions.length
    ){

        endGame();

        return;

    }


    /* ======================================================
       QUESTION NUMBER
    ====================================================== */

    document
        .getElementById("qnum")
        .innerText =
        current + 1;


    /* ======================================================
       PROGRESS
    ====================================================== */

    document
        .getElementById("progress")
        .style.width =
        (
            (current + 1) /
            TOTAL_QUESTIONS *
            100
        ) + "%";


    /* ======================================================
       CURRENT QUESTION
    ====================================================== */

    const correct =
        questions[current];


    /* ======================================================
       SHOW VIETNAMESE WORDS
    ====================================================== */

    document
        .getElementById("numberWords")
        .innerText =
        correct
            .map(
                index =>
                    numbers[index]
            )
            .join(" - ");


    /* ======================================================
       CREATE ANSWERS
    ====================================================== */

    const options =
        generateOptions(correct);


    const container =
        document.getElementById(
            "answers"
        );


    /*
       IMPORTANT:
       Clear previous answers before creating
       the new 4 answer choices.
    */

    container.innerHTML =
        "";


    options.forEach(
        sequence => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "answer";


            div.innerText =
                sequence.join(" - ");


            div.dataset.sequence =
                sequenceKey(sequence);


            div.onclick =
                function(){

                    chooseAnswer(
                        div,
                        sequenceKey(sequence)
                        ===
                        sequenceKey(correct)
                    );

                };


            container.appendChild(
                div
            );

        }
    );

}


/* ==========================================================
   CHOOSE ANSWER

   RULE:
   - Correct = +1
   - Wrong = 0
   - One attempt only
   - Lock all answers
   - Show correct answer
   - No retry
========================================================== */

function chooseAnswer(
    element,
    isCorrect
){

    if(answered){

        return;

    }


    answered = true;


    const correct =
        questions[current];


    const correctKey =
        sequenceKey(correct);


    const allAnswers =
        document.querySelectorAll(
            ".answer"
        );


    /* ======================================================
       LOCK ALL ANSWERS
    ====================================================== */

    allAnswers.forEach(
        answer => {

            answer.classList.add(
                "disabled"
            );

        }
    );


    /* ======================================================
       FIND CORRECT ANSWER
    ====================================================== */

    let correctElement = null;


    allAnswers.forEach(
        answer => {

            if(
                answer.dataset.sequence ===
                correctKey
            ){

                correctElement =
                    answer;

            }

        }
    );


    const resultIcon =
        document.getElementById(
            "resultIcon"
        );


    const correctAnswer =
        document.getElementById(
            "correctAnswer"
        );


    const explanation =
        document.getElementById(
            "explanation"
        );


    /* ======================================================
       CORRECT
    ====================================================== */

    if(isCorrect){

        element.classList.add(
            "correct"
        );


        score++;


        resultIcon.innerText =
            "✔ Correct!";


        resultIcon.className =
            "result correct-text";


        explanation.innerText =
            "The number sequence is correct.";

    }


    /* ======================================================
       WRONG
    ====================================================== */

    else{

        element.classList.add(
            "wrong"
        );


        if(correctElement){

            correctElement.classList.add(
                "correct"
            );

        }


        resultIcon.innerText =
            "❌ Wrong!";


        resultIcon.className =
            "result wrong-text";


        correctAnswer.innerText =
            "Correct answer: " +
            correctKey.replaceAll(
                "-",
                " - "
            );


        explanation.innerText =
            "The correct answer is the sequence shown in green.";

    }


    /* ======================================================
       UPDATE SCORE
    ====================================================== */

    document
        .getElementById("score")
        .innerText =
        score;


    /* ======================================================
       NEXT BUTTON
    ====================================================== */

    const nextBtn =
        document.getElementById(
            "nextBtn"
        );


    nextBtn.style.display =
        "block";


    if(
        current ===
        TOTAL_QUESTIONS - 1
    ){

        nextBtn.innerText =
            "Finish 🎉";

    }

    else{

        nextBtn.innerText =
            "Next Question →";

    }

}


/* ==========================================================
   NEXT QUESTION
========================================================== */

function nextQuestion(){

    current++;

    loadQuestion();

}


/* ==========================================================
   END GAME
========================================================== */

function endGame(){

    document
        .getElementById("game")
        .style.display =
        "none";


    document
        .getElementById("end")
        .style.display =
        "block";


    document
        .getElementById("progress")
        .style.width =
        "100%";


    document
        .getElementById("finalScore")
        .innerText =
        score +
        " / " +
        TOTAL_QUESTIONS;


    const percentage =
        Math.round(
            score /
            TOTAL_QUESTIONS *
            100
        );


    let text = "";


    if(
        percentage === 100
    ){

        text =
            "🏆 Perfect! Excellent number recognition!";

    }

    else if(
        percentage >= 80
    ){

        text =
            "🎉 Excellent job!";

    }

    else if(
        percentage >= 60
    ){

        text =
            "👍 Good job! Keep practicing!";

    }

    else{

        text =
            "📚 Keep practicing your Vietnamese numbers!";

    }


    document
        .getElementById("performance")
        .innerText =
        text;

}


/* ==========================================================
   RESTART
========================================================== */

function restart(){

    startGame();

}


/* ==========================================================
   BACK TO LOBBY
========================================================== */

function backToLobby(){

    window.location.href =
        "../../category.html?category=Numbers";

}


/* ==========================================================
   START IMMEDIATELY
   NO INTRO SCREEN
========================================================== */

startGame();


</script>
