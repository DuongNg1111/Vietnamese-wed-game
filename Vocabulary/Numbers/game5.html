<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Vietnamese Number Challenge</title>

<meta
    name="game-title"
    content="Vietnamese Number Challenge"
>

<meta
    name="game-description"
    content="Practice Vietnamese numbers from 100 to 999."
>

<meta
    name="game-icon"
    content="🔢"
>

<meta
    name="game-explanation"
    content="true"
>


<style>

/* ==========================================================
   RESET
========================================================== */

*{
    box-sizing:border-box;
}


body{

    margin:0;

    padding:20px;

    font-family:
        Arial,
        sans-serif;

    background:#f4f6f8;

    color:#333;

}


/* ==========================================================
   BACK TO LOBBY
========================================================== */

.back-btn-container{

    max-width:900px;

    margin:0 auto 20px;

    text-align:left;

}


.back-btn{

    display:inline-block;

    padding:10px 18px;

    background:white;

    color:#555;

    border:2px solid #ddd;

    border-radius:10px;

    text-decoration:none;

    font-weight:bold;

    transition:.2s;

}


.back-btn:hover{

    background:#f0f0f0;

    transform:translateY(-2px);

}


/* ==========================================================
   MAIN CONTAINER
========================================================== */

.container{

    max-width:900px;

    margin:auto;

}


/* ==========================================================
   INTRO
========================================================== */

.intro{

    background:white;

    padding:35px;

    border-radius:18px;

    box-shadow:
        0 4px 12px
        rgba(0,0,0,.1);

    text-align:center;

}


.intro h1{

    margin-top:0;

    font-size:42px;

}


.intro h2{

    font-size:35px;

}


.intro p{

    font-size:28px;

    line-height:1.6;

    color:#555;

}


.start-btn{

    margin-top:20px;

    padding:13px 30px;

    border:none;

    border-radius:10px;

    font-size:28px;

    cursor:pointer;

    background:#2196f3;

    color:white;

    font-weight:bold;

    transition:.2s;

}


.start-btn:hover{

    opacity:.9;

    transform:translateY(-1px);

}


/* ==========================================================
   GAME CARD
========================================================== */

.game-card{

    background:white;

    padding:30px;

    border-radius:18px;

    box-shadow:
        0 4px 12px
        rgba(0,0,0,.1);

}


.game-title{

    text-align:center;

    font-size:40px;

    margin-top:0;

}


/* ==========================================================
   TOP BAR
========================================================== */

.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;

    font-weight:bold;

    color:#555;

}


/* ==========================================================
   PROGRESS
========================================================== */

.progress-wrap{

    width:100%;

    height:10px;

    background:#e0e0e0;

    border-radius:20px;

    overflow:hidden;

    margin-bottom:25px;

}


.progress{

    height:100%;

    width:0%;

    background:#2196f3;

    transition:.3s;

}


/* ==========================================================
   QUESTION
========================================================== */

.question{

    text-align:center;

    margin:30px 0;

}


.question-label{

    font-size:28px;

    color:#777;

    margin-bottom:10px;

}


.number-word{

    font-size:44px;

    font-weight:bold;

    color:#1565c0;

}


/* ==========================================================
   ANSWERS
========================================================== */

.answers{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:15px;

    max-width:600px;

    margin:30px auto;

}


.answer-btn{

    padding:18px;

    background:#f8f9fa;

    border:2px solid #ddd;

    border-radius:12px;

    font-size:34px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.answer-btn:hover{

    background:#eef6ff;

    border-color:#2196f3;

    transform:translateY(-2px);

}


.answer-btn.correct{

    background:#c8e6c9;

    border-color:#4caf50;

    color:#2e7d32;

    cursor:default;

}


.answer-btn.wrong{

    background:#ffcdd2;

    border-color:#f44336;

    color:#c62828;

    cursor:default;

}


/* ==========================================================
   FEEDBACK
========================================================== */

.feedback{

    min-height:55px;

    text-align:center;

    font-size:29px;

    font-weight:bold;

    margin:20px 0;

}


.feedback.correct-text{

    color:#2e7d32;

}


.feedback.wrong-text{

    color:#c62828;

}


/* ==========================================================
   EXPLANATION
========================================================== */

.explanation{

    margin:20px auto;

    padding:18px 20px;

    max-width:700px;

    background:#f0f7ff;

    border-left:5px solid #4779b8;

    border-radius:12px;

    color:#3d5066;

    font-size:26px;

    line-height:1.6;

    text-align:left;

}


.explanation strong{

    color:#4779b8;

}


.hidden{

    display:none;

}


/* ==========================================================
   NEXT BUTTON
========================================================== */

.next-btn{

    display:none;

    margin:20px auto 0;

    padding:12px 28px;

    border:none;

    border-radius:10px;

    background:#2196f3;

    color:white;

    font-size:27px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.next-btn:hover{

    opacity:.9;

    transform:translateY(-1px);

}


/* ==========================================================
   FINAL
========================================================== */

.final{

    display:none;

    background:white;

    padding:40px 30px;

    border-radius:18px;

    box-shadow:
        0 4px 12px
        rgba(0,0,0,.1);

    text-align:center;

}


.final h2{

    font-size:42px;

    color:#2e7d32;

}


.final-score{

    font-size:40px;

    margin:20px 0;

    font-weight:bold;

}


.final-message{

    font-size:29px;

    color:#555;

    line-height:1.5;

}


.play-again-btn{

    margin-top:20px;

    padding:13px 30px;

    border:none;

    border-radius:10px;

    background:#2196f3;

    color:white;

    font-size:28px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.play-again-btn:hover{

    opacity:.9;

    transform:translateY(-1px);

}


/* ==========================================================
   MOBILE
========================================================== */

@media(max-width:700px){

    body{

        padding:15px;

    }


    .intro,
    .game-card,
    .final{

        padding:20px;

    }


    .intro h1{

        font-size:37px;

    }


    .game-title{

        font-size:36px;

    }


    .topbar{

        font-size:25px;

    }


    .number-word{

        font-size:38px;

    }


    .answers{

        grid-template-columns:1fr;

    }


    .answer-btn{

        font-size:31px;

        padding:16px;

    }

}

</style>

</head>


<body>


<!-- ==========================================================
     BACK TO LOBBY
========================================================== -->

<div class="back-btn-container">

    <a
        href="../../category.html?category=Numbers"
        class="back-btn"
    >
        ⬅ Back
    </a>

</div>


<div class="container">


<!-- ==========================================================
     INTRO SCREEN
========================================================== -->

<div
    class="intro"
    id="introScreen"
>

    <h1>
        🔢 Vietnamese Number Challenge
    </h1>


    <h2>
        Numbers 100–999
    </h2>

    <p>
        🎯 Choose the correct number.
    </p>

    <button
        class="start-btn"
        onclick="startGame()"
    >
        Start Game
    </button>

</div>


<!-- ==========================================================
     GAME SCREEN
========================================================== -->

<div
    class="game-card"
    id="gameScreen"
    style="display:none;"
>

    <h1 class="game-title">
        🔢 Vietnamese Number Challenge
    </h1>


    <div class="topbar">

        <div id="questionInfo">
            Question 1 / 15
        </div>


        <div id="scoreInfo">
            Score: 0
        </div>

    </div>


    <div class="progress-wrap">

        <div
            class="progress"
            id="progress"
        >
        </div>

    </div>


    <div class="question">

        <div class="question-label">
            What number is this?
        </div>


        <div
            class="number-word"
            id="numberWord"
        >
        </div>

    </div>


    <div
        class="answers"
        id="answers"
    >
    </div>


    <div
        class="feedback"
        id="feedback"
    >
    </div>


    <div
        id="explanation"
        class="explanation hidden"
    >
    </div>


    <button
        class="next-btn"
        id="nextBtn"
        onclick="nextQuestion()"
    >
        Next Question ➜
    </button>

</div>


<!-- ==========================================================
     FINAL SCREEN
========================================================== -->

<div
    class="final"
    id="finalScreen"
>

    <h2>
        🎉 Finished!
    </h2>


    <div
        class="final-score"
        id="finalScore"
    >
    </div>


    <div
        class="final-message"
        id="finalMessage"
    >
    </div>


    <button
        class="play-again-btn"
        onclick="restartGame()"
    >
        Play Again
    </button>

</div>


</div>


<script>

/* ==========================================================
   GAME SETTINGS
========================================================== */

const totalQuestions = 15;


/* ==========================================================
   GAME STATE
========================================================== */

let currentQuestion = 0;

let score = 0;

let currentNumber = 0;

let answered = false;


/* ==========================================================
   DOM
========================================================== */

const introScreen =
    document.getElementById(
        "introScreen"
    );


const gameScreen =
    document.getElementById(
        "gameScreen"
    );


const finalScreen =
    document.getElementById(
        "finalScreen"
    );


const numberWord =
    document.getElementById(
        "numberWord"
    );


const answers =
    document.getElementById(
        "answers"
    );


const feedback =
    document.getElementById(
        "feedback"
    );


const explanation =
    document.getElementById(
        "explanation"
    );


const nextBtn =
    document.getElementById(
        "nextBtn"
    );


const questionInfo =
    document.getElementById(
        "questionInfo"
    );


const scoreInfo =
    document.getElementById(
        "scoreInfo"
    );


const progress =
    document.getElementById(
        "progress"
    );


/* ==========================================================
   VIETNAMESE NUMBER DATA
========================================================== */

const ones = [

    "không",
    "một",
    "hai",
    "ba",
    "bốn",
    "năm",
    "sáu",
    "bảy",
    "tám",
    "chín"

];


/* ==========================================================
   READ TWO DIGITS
========================================================== */

function readTwoDigits(number){

    const tens =
        Math.floor(
            number / 10
        );


    const unit =
        number % 10;


    if(tens === 0){

        return ones[unit];

    }


    if(tens === 1){

        if(unit === 0){

            return "mười";

        }


        if(unit === 5){

            return "mười lăm";

        }


        return (
            "mười " +
            ones[unit]
        );

    }


    let result =
        ones[tens] +
        " mươi";


    if(unit === 0){

        return result;

    }


    if(unit === 1){

        return (
            result +
            " mốt"
        );

    }


    if(unit === 5){

        return (
            result +
            " lăm"
        );

    }


    return (
        result +
        " " +
        ones[unit]
    );

}


/* ==========================================================
   NUMBER → VIETNAMESE
========================================================== */

function numberToVietnamese(number){

    const hundreds =
        Math.floor(
            number / 100
        );


    const remainder =
        number % 100;


    let result =
        ones[hundreds] +
        " trăm";


    if(remainder === 0){

        return result;

    }


    /*
     * 101–109, 201–209, etc.
     */

    if(remainder < 10){

        return (
            result +
            " lẻ " +
            ones[remainder]
        );

    }


    /*
     * 110–119, 210–219, etc.
     */

    return (
        result +
        " " +
        readTwoDigits(
            remainder
        )
    );

}


/* ==========================================================
   RANDOM NUMBER
========================================================== */

function randomNumber(){

    return Math.floor(
        Math.random() * 900
    ) + 100;

}


/* ==========================================================
   GENERATE CHOICES
========================================================== */

function generateChoices(correct){

    const choices =
        new Set();


    choices.add(correct);


    while(
        choices.size < 4
    ){

        const difference =
            Math.floor(
                Math.random() * 100
            ) + 10;


        let candidate;


        if(
            Math.random() < 0.5
        ){

            candidate =
                correct +
                difference;

        }else{

            candidate =
                correct -
                difference;

        }


        if(
            candidate < 100 ||
            candidate > 999 ||
            candidate === correct
        ){

            continue;

        }


        choices.add(
            candidate
        );

    }


    return shuffle(
        [...choices]
    );

}


/* ==========================================================
   SHUFFLE
========================================================== */

function shuffle(array){

    const arr = [...array];


    for(
        let i = arr.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] =
        [
            arr[j],
            arr[i]
        ];

    }


    return arr;

}


/* ==========================================================
   START GAME
========================================================== */

function startGame(){

    currentQuestion = 0;

    score = 0;

    currentNumber = 0;

    answered = false;


    introScreen.style.display =
        "none";


    finalScreen.style.display =
        "none";


    gameScreen.style.display =
        "block";


    scoreInfo.textContent =
        "Score: 0";


    loadQuestion();

}


/* ==========================================================
   LOAD QUESTION
========================================================== */

function loadQuestion(){

    answered = false;


    feedback.textContent =
        "";


    feedback.className =
        "feedback";


    explanation.innerHTML =
        "";


    explanation.classList.add(
        "hidden"
    );


    nextBtn.style.display =
        "none";


    currentNumber =
        randomNumber();


    numberWord.textContent =
        numberToVietnamese(
            currentNumber
        );


    questionInfo.textContent =
        `Question ${
            currentQuestion + 1
        } / ${totalQuestions}`;


    scoreInfo.textContent =
        `Score: ${score}`;


    progress.style.width =
        (
            (currentQuestion + 1) /
            totalQuestions *
            100
        ) + "%";


    const choices =
        generateChoices(
            currentNumber
        );


    answers.innerHTML =
        "";


    choices.forEach(
        number => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "answer-btn";


            button.textContent =
                number;


            button.onclick =
                () =>
                    checkAnswer(
                        button,
                        number
                    );


            answers.appendChild(
                button
            );

        }
    );

}


/* ==========================================================
   CHECK ANSWER
========================================================== */

function checkAnswer(
    button,
    selected
){

    /*
     * Once an answer is selected,
     * the question is locked.
     *
     * No Try Again.
     */

    if(answered){

        return;

    }


    answered = true;


    const buttons =
        document.querySelectorAll(
            ".answer-btn"
        );


    /*
     * Disable every option.
     */

    buttons.forEach(
        btn => {

            btn.disabled =
                true;

        }
    );


    if(
        selected === currentNumber
    ){

        /*
         * CORRECT
         */

        button.classList.add(
            "correct"
        );


        score++;


        feedback.className =
            "feedback correct-text";


        feedback.textContent =
            "✅ Correct! +1 point";

    }

    else{

        /*
         * WRONG
         *
         * No retry.
         * No score.
         */

        button.classList.add(
            "wrong"
        );


        /*
         * Highlight correct answer.
         */

        buttons.forEach(
            btn => {

                if(
                    Number(
                        btn.textContent
                    ) === currentNumber
                ){

                    btn.classList.add(
                        "correct"
                    );

                }

            }
        );


        feedback.className =
            "feedback wrong-text";


        feedback.textContent =
            `❌ Wrong! The correct answer is ${currentNumber}.`;

    }


    scoreInfo.textContent =
        `Score: ${score}`;


    showExplanation();


    nextBtn.style.display =
        "block";


    if(
        currentQuestion ===
        totalQuestions - 1
    ){

        nextBtn.textContent =
            "Finish 🎉";

    }else{

        nextBtn.textContent =
            "Next Question ➜";

    }

}


/* ==========================================================
   EXPLANATION
========================================================== */

function showExplanation(){

    const answer =
        numberToVietnamese(
            currentNumber
        );


    const remainder =
        currentNumber % 100;


    let tip = "";


    /*
     * Explain "mốt"
     */

    if(
        remainder >= 20 &&
        currentNumber % 10 === 1
    ){

        tip = `

            <br><br>

            <strong>💡 Tip:</strong>

            After <strong>mươi</strong>,
            1 is pronounced
            <strong>mốt</strong>.

        `;

    }


    /*
     * Explain "lăm"
     */

    else if(
        remainder >= 20 &&
        currentNumber % 10 === 5
    ){

        tip = `

            <br><br>

            <strong>💡 Tip:</strong>

            After <strong>mươi</strong>,
            5 is pronounced
            <strong>lăm</strong>.

        `;

    }


    /*
     * Explain "lẻ"
     */

    else if(
        remainder > 0 &&
        remainder < 10
    ){

        tip = `

            <br><br>

            <strong>💡 Tip:</strong>

            When the tens digit is zero,
            use <strong>lẻ</strong>
            before the final digit.

        `;

    }


    explanation.innerHTML = `

        <strong>💡 Answer:</strong>

        <br><br>

        <strong>
            ${currentNumber}
        </strong>
        =
        <strong>
            ${answer}
        </strong>

        ${tip}

    `;


    explanation.classList.remove(
        "hidden"
    );

}


/* ==========================================================
   NEXT QUESTION
========================================================== */

function nextQuestion(){

    currentQuestion++;


    if(
        currentQuestion >=
        totalQuestions
    ){

        finishGame();

        return;

    }


    loadQuestion();

}


/* ==========================================================
   FINISH GAME
========================================================== */

function finishGame(){

    gameScreen.style.display =
        "none";


    finalScreen.style.display =
        "block";


    progress.style.width =
        "100%";


    document.getElementById(
        "finalScore"
    ).textContent =
        `🎯 Score: ${score} / ${totalQuestions}`;


    const percentage =
        score /
        totalQuestions;


    let message;


    if(
        percentage === 1
    ){

        message =
            "🏆 Perfect! You can read Vietnamese numbers from 100 to 999 very well!";

    }

    else if(
        percentage >= 0.8
    ){

        message =
            "🌟 Excellent! Your Vietnamese number skills are getting strong!";

    }

    else if(
        percentage >= 0.5
    ){

        message =
            "👍 Good job! Keep practicing numbers from 100 to 999.";

    }

    else{

        message =
            "💪 Keep practicing! Vietnamese numbers will get easier with repetition.";

    }


    document.getElementById(
        "finalMessage"
    ).textContent =
        message;

}


/* ==========================================================
   RESTART
========================================================== */

function restartGame(){

    startGame();

}

</script>

</body>

</html>
