<body>

    <!-- ======================================================

    <h1 class="game-title">

    </div>


    <!-- ======================================================

        </div>

    ====================================================== -->

    <div class="progress-wrap">

            id="progress"

        </div>

    </div>

    ====================================================== -->

        </button>

</div>

     FINAL SCREEN
========================================================== -->

<div

        🎉 Finished!
    </h2>

        onclick="restartGame()"
    >

    </button>

<script>

/* ==========================================================
   GAME SETTINGS
========================================================== */

const totalQuestions = 15;


/* ==========================================================
   GAME STATE
========================================================== */

let currentQuestion = 0;

let score = 0;

let currentNumber = 0;

let answered = false;


/* ==========================================================
   DOM
========================================================== */

const gameScreen =
    document.getElementById(
        "gameScreen"
    );


const finalScreen =
    document.getElementById(
        "finalScreen"
    );


const numberWord =
    document.getElementById(
        "numberWord"
    );


const answers =
    document.getElementById(
        "answers"
    );


const feedback =
    document.getElementById(
        "feedback"
    );


const explanation =
    document.getElementById(
        "explanation"
    );


const nextBtn =
    document.getElementById(
        "nextBtn"
    );


const questionInfo =
    document.getElementById(
        "questionInfo"
    );


const scoreInfo =
    document.getElementById(
        "scoreInfo"
    );


const progress =
    document.getElementById(
        "progress"
    );


/* ==========================================================
   VIETNAMESE NUMBER DATA
========================================================== */

const ones = [

    "không",
    "một",
    "hai",
    "ba",
    "bốn",
    "năm",
    "sáu",
    "bảy",
    "tám",
    "chín"

];


/* ==========================================================
   READ TWO DIGITS
========================================================== */

function readTwoDigits(number){

    const tens =
        Math.floor(
            number / 10
        );


    const unit =
        number % 10;


    if(tens === 0){

        return ones[unit];

    }


    if(tens === 1){

        if(unit === 0){

            return "mười";

        }


        if(unit === 5){

            return "mười lăm";

        }


        return (
            "mười " +
            ones[unit]
        );

    }


    let result =
        ones[tens] +
        " mươi";


    if(unit === 0){

        return result;

    }


    if(unit === 1){

        return (
            result +
            " mốt"
        );

    }


    if(unit === 5){

        return (
            result +
            " lăm"
        );

    }


    return (
        result +
        " " +
        ones[unit]
    );

}


/* ==========================================================
   NUMBER → VIETNAMESE
========================================================== */

function numberToVietnamese(number){

    const hundreds =
        Math.floor(
            number / 100
        );


    const remainder =
        number % 100;


    let result =
        ones[hundreds] +
        " trăm";


    if(remainder === 0){

        return result;

    }


    /*
     * 101–109, 201–209, etc.
     */

    if(remainder < 10){

        return (
            result +
            " lẻ " +
            ones[remainder]
        );

    }


    /*
     * 110–999
     */

    return (
        result +
        " " +
        readTwoDigits(
            remainder
        )
    );

}


/* ==========================================================
   RANDOM NUMBER
========================================================== */

function randomNumber(){

    return Math.floor(
        Math.random() * 900
    ) + 100;

}


/* ==========================================================
   GENERATE CHOICES
========================================================== */

function generateChoices(correct){

    const choices =
        new Set();


    choices.add(correct);


    while(
        choices.size < 4
    ){

        const difference =
            Math.floor(
                Math.random() * 100
            ) + 10;


        let candidate;


        if(
            Math.random() < 0.5
        ){

            candidate =
                correct +
                difference;

        }else{

            candidate =
                correct -
                difference;

        }


        if(
            candidate < 100 ||
            candidate > 999 ||
            candidate === correct
        ){

            continue;

        }


        choices.add(
            candidate
        );

    }


    return shuffle(
        [...choices]
    );

}


/* ==========================================================
   SHUFFLE
========================================================== */

function shuffle(array){

    const arr =
        [...array];


    for(
        let i = arr.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] =
        [
            arr[j],
            arr[i]
        ];

    }


    return arr;

}


/* ==========================================================
   START GAME
========================================================== */

function startGame(){

    currentQuestion = 0;

    score = 0;

    currentNumber = 0;

    answered = false;


    gameScreen.style.display =
        "block";


    finalScreen.style.display =
        "none";


    scoreInfo.textContent =
        "Score: 0";


    loadQuestion();

}


/* ==========================================================
   LOAD QUESTION
========================================================== */

function loadQuestion(){

    answered = false;


    feedback.textContent =
        "";


    feedback.className =
        "feedback";


    explanation.innerHTML =
        "";


    explanation.classList.add(
        "hidden"
    );


    nextBtn.style.display =
        "none";


    currentNumber =
        randomNumber();


    numberWord.textContent =
        numberToVietnamese(
            currentNumber
        );


    questionInfo.textContent =
        `Question ${
            currentQuestion + 1
        } / ${totalQuestions}`;


    scoreInfo.textContent =
        `Score: ${score}`;


    progress.style.width =
        (
            (currentQuestion + 1) /
            totalQuestions *
            100
        ) + "%";


    const choices =
        generateChoices(
            currentNumber
        );


    answers.innerHTML =
        "";


    choices.forEach(
        number => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "answer-btn";


            button.textContent =
                number;


            button.onclick =
                () =>
                    checkAnswer(
                        button,
                        number
                    );


            answers.appendChild(
                button
            );

        }
    );

}


/* ==========================================================
   CHECK ANSWER
========================================================== */

function checkAnswer(
    button,
    selected
){

    /*
     * Each question can only
     * be answered once.
     */

    if(answered){

        return;

    }


    answered = true;


    const buttons =
        document.querySelectorAll(
            ".answer-btn"
        );


    /*
     * Lock every option.
     */

    buttons.forEach(
        btn => {

            btn.disabled =
                true;

            btn.classList.add(
                "disabled"
            );

        }
    );


    /*
     * CORRECT
     */

    if(
        selected === currentNumber
    ){

        button.classList.add(
            "correct"
        );


        score++;


        feedback.className =
            "feedback correct-text";


        feedback.textContent =
            "✓ Correct! +1 point";

    }


    /*
     * WRONG
     */

    else{

        button.classList.add(
            "wrong"
        );


        buttons.forEach(
            btn => {

                if(
                    Number(
                        btn.textContent
                    ) === currentNumber
                ){

                    btn.classList.add(
                        "correct"
                    );

                }

            }
        );


        feedback.className =
            "feedback wrong-text";


        feedback.textContent =
            "✕ Wrong! 0 points.";

    }


    scoreInfo.textContent =
        `Score: ${score}`;


    showExplanation();


    nextBtn.style.display =
        "inline-block";


    if(
        currentQuestion ===
        totalQuestions - 1
    ){

        nextBtn.textContent =
            "Finish →";

    }else{

        nextBtn.textContent =
            "Next Question →";

    }

}


/* ==========================================================
   EXPLANATION
========================================================== */

function showExplanation(){

    const answer =
        numberToVietnamese(
            currentNumber
        );


    const remainder =
        currentNumber % 100;


    let tip = "";


    /*
     * Explain "mốt"
     */

    if(
        remainder >= 20 &&
        currentNumber % 10 === 1
    ){

        tip = `

            <br><br>

            <strong>Tip:</strong>

            After <strong>mươi</strong>,
            1 is pronounced
            <strong>mốt</strong>.

        `;

    }


    /*
     * Explain "lăm"
     */

    else if(
        remainder >= 20 &&
        currentNumber % 10 === 5
    ){

        tip = `

            <br><br>

            <strong>Tip:</strong>

            After <strong>mươi</strong>,
            5 is pronounced
            <strong>lăm</strong>.

        `;

    }


    /*
     * Explain "lẻ"
     */

    else if(
        remainder > 0 &&
        remainder < 10
    ){

        tip = `

            <br><br>

            <strong>Tip:</strong>

            When the tens digit is zero,
            use <strong>lẻ</strong>
            before the final digit.

        `;

    }


    explanation.innerHTML = `

        <strong>Answer:</strong>

        <br><br>

        <strong>
            ${currentNumber}
        </strong>
        =
        <strong>
            ${answer}
        </strong>

        ${tip}

    `;


    explanation.classList.remove(
        "hidden"
    );

}


/* ==========================================================
   NEXT QUESTION
========================================================== */

function nextQuestion(){

    currentQuestion++;


    if(
        currentQuestion >=
        totalQuestions
    ){

        finishGame();

        return;

    }


    loadQuestion();

}


/* ==========================================================
   FINISH GAME
========================================================== */

function finishGame(){

    gameScreen.style.display =
        "none";


    finalScreen.style.display =
        "block";


    progress.style.width =
        "100%";


    document.getElementById(
        "finalScore"
    ).textContent =
        `Score: ${score} / ${totalQuestions}`;


    const percentage =
        score /
        totalQuestions;


    let message;


    if(
        percentage === 1
    ){

        message =
            "🏆 Perfect! You can read Vietnamese numbers from 100 to 999 very well!";

    }

    else if(
        percentage >= 0.8
    ){

        message =
            "🌟 Excellent! Your Vietnamese number skills are getting strong!";

    }

    else if(
        percentage >= 0.5
    ){

        message =
            "👍 Good job! Keep practicing numbers from 100 to 999.";

    }

    else{

        message =
            "💪 Keep practicing! Vietnamese numbers will get easier with repetition.";

    }


    document.getElementById(
        "finalMessage"
    ).textContent =
        message;


    if (
        typeof trackGameComplete ===
        "function"
    ) {
        trackGameComplete(
            "Numbers - Game 5",
            score,
            totalQuestions
        );
    }

}


/* ==========================================================
   RESTART
========================================================== */

function restartGame(){

    startGame();

}


/* ==========================================================
   INITIAL LOAD
========================================================== */

/*
 * Game 5 has no intro screen.
 * It starts directly on the game screen.
 */

window.trackGameStart(
    "Numbers - Game 5"
);

startGame();
