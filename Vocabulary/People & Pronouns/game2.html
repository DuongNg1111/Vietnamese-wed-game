<style>

/* ==========================================================
   COLOR VARIABLES
========================================================== */

:root{

    --accent:#5F79B4;

    --accent-dark:#41588B;

    --accent-light:#eaf0fa;

    --accent-bg:#F2F6FC;

    --accent-border:#c3d4ef;

    --correct:#019b3f;

    --correct-bg:#eaf3ff;

    --wrong:#d9536f;

    --wrong-bg:#fff0f3;

    --general-border:#d9e6f2;

    --ink:#344054;

    --muted:#667085;
    --ink: #143a6b;
    --ink-soft: #66809d;

}


/* ==========================================================
   RESET
========================================================== */

*{

    box-sizing:border-box;

}


body{

    margin:0;

    min-height:100vh;

    padding:28px 20px 45px;

    font-family:
        Calibri,
        'Segoe UI',
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    color:var(--ink);

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            var(--accent-bg) 48%,
            var(--accent-light) 100%
        );

}


/* ==========================================================
   BACK TO LOBBY
========================================================== */

.back-btn-container{

    width:min(900px, 100%);

    margin:0 auto 18px;

    text-align:left;

}


.lobby-btn{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    padding:9px 16px;

    background:#ffffff;

    color:var(--accent-dark);

    border:1px solid var(--accent-border);

    border-radius:10px;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:20px;

    font-weight:bold;

    text-decoration:none;

    cursor:pointer;

    transition:.2s;

}


.lobby-btn:hover{

    background:var(--accent-light);

    border-color:var(--accent);

    transform:translateX(-2px);

}


/* ==========================================================
   MAIN CONTAINER
========================================================== */

.container{

    width:min(900px, 100%);

    margin:0 auto;

    background:#ffffff;

    padding:32px;

    border-radius:20px;

    box-shadow:
        0 8px 24px
        rgba(65,88,139,.10);

}


/* ==========================================================
   GAME SCREEN
========================================================== */

#game{

    display:block;

}


/* ==========================================================
   TITLE
========================================================== */

.title{

    margin:0;

    text-align:center;

    font-family:
        'Kalam',
        cursive;

    font-size:42px;

    line-height:1.2;

    color:var(--ink);

}


.subtitle{

    margin:7px 0 26px;

    text-align:center;

    color:var(--muted);

    font-size:22px;

    line-height:1.4;

}


/* ==========================================================
   GAME BOX
========================================================== */

.game-box{

    position:relative;

    background:#ffffff;

    padding:28px;

    border-radius:15px;

    border:1px solid var(--general-border);

    box-shadow:
        0 3px 10px
        rgba(65,88,139,.05);

    text-align:center;

    overflow:hidden;

}


/* ==========================================================
   TOP BAR
========================================================== */

.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:20px;

    margin-bottom:18px;

    font-size:20px;

    font-weight:bold;

}


.question-count{

    color:var(--muted);

}


.score{

    color:var(--accent-dark);

    font-size:22px;

}


/* ==========================================================
   PROGRESS
========================================================== */

.progress-wrap{

    width:100%;

    height:9px;

    background:#edf1f6;

    border-radius:20px;

    overflow:hidden;

    margin-bottom:25px;

}


.progress{

    width:0%;

    height:100%;

    background:var(--accent);

    transition:.3s;

}


/* ==========================================================
   QUESTION CARD
========================================================== */

.card{

    position:relative;

    background:var(--accent-bg);

    border:1px solid var(--accent-border);

    border-radius:12px;

    padding:35px 25px;

    margin:20px 0;

    min-height:190px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    font-size:32px;

    font-weight:600;

    line-height:1.5;

    gap:12px;

    overflow:hidden;

}



/* ==========================================================
   QUESTION CARD ACCENT LINE
========================================================== */

.card::before{

    content:"";

    position:absolute;

    top:0;

    left:0;

    right:0;

    height:4px;

    background:var(--accent);

}


/* ==========================================================
   OPTIONS
========================================================== */

.options{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:13px;

}


.option-btn{

    min-height:65px;

    padding:15px 18px;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:25px;

    font-weight:bold;

    color:var(--accent-dark);

    background:#ffffff;

    border:1px solid var(--accent-border);

    border-radius:11px;

    cursor:pointer;

    transition:.2s;

}


.option-btn:hover:not(:disabled){

    background:var(--accent-light);

    border-color:var(--accent);

    transform:translateY(-2px);

}


.option-btn:disabled{

    cursor:default;

}


/* ==========================================================
   CORRECT
========================================================== */

.option-btn.correct{

    background:var(--correct-bg);

    border-color:var(--correct);

    color:var(--correct);

}


/* ==========================================================
   WRONG
========================================================== */

.option-btn.wrong{

    background:var(--wrong-bg);

    border-color:var(--wrong);

    color:var(--wrong);

}


/* ==========================================================
   FEEDBACK
========================================================== */

.result-message{

    min-height:42px;

    margin-top:20px;

    font-size:24px;

    font-weight:bold;

    line-height:1.5;

}


.correct-text{

    color:var(--correct);

}


.wrong-text{

    color:var(--wrong);

}


/* ==========================================================
   EXPLANATION
========================================================== */

.explanation{

    display:none;

    margin-top:18px;

    padding:17px 19px;

    background:var(--accent-bg);

    border:1px solid var(--accent-border);

    border-left:5px solid var(--accent);

    border-radius:11px;

    color:var(--ink);

    text-align:left;

    font-size:21px;

    line-height:1.6;

}


.explanation.show{

    display:block;

}


.explanation strong{

    color:var(--accent-dark);

}


/* ==========================================================
   NEXT BUTTON
========================================================== */

.next-btn{

    display:none;

    margin-top:19px;

    padding:11px 27px;

    border:none;

    border-radius:10px;

    background:var(--accent);

    color:#ffffff;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:22px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.next-btn:hover{

    background:var(--accent-dark);

    transform:translateY(-2px);

}


/* ==========================================================
   FINAL SCREEN
========================================================== */

#final{

    display:none;

    text-align:center;

    padding:20px 10px 10px;

}


#final h2{

    margin:0 0 12px;

    font-family:
        'Kalam',
        cursive;

    font-size:43px;

    color:var(--accent-dark);

}


.final-message{

    color:var(--muted);

    font-size:23px;

    line-height:1.6;

}


.final-score{

    margin:25px 0;

    font-size:38px;

    font-weight:bold;

    color:var(--accent);

}


.play-again-btn{

    margin-top:12px;

    padding:12px 28px;

    border:none;

    border-radius:10px;

    background:var(--accent);

    color:#ffffff;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:22px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.play-again-btn:hover{

    background:var(--accent-dark);

    transform:translateY(-2px);

}


/* ==========================================================
   MOBILE
========================================================== */

@media(max-width:700px){

    body{

        padding:
            18px 12px 30px;

    }


    .back-btn-container{

        margin-bottom:13px;

    }


    .lobby-btn{

        font-size:18px;

        padding:8px 13px;

    }


    .container{

        padding:
            23px 15px 20px;

        border-radius:18px;

    }


    .title{

        font-size:35px;

    }


    .subtitle{

        font-size:20px;

        margin-bottom:20px;

    }


    .game-box{

        padding:20px 15px;

        border-radius:14px;

    }


    .topbar{

        font-size:18px;

        gap:10px;

    }


    .score{

        font-size:20px;

    }


    .card{

        font-size:25px;

        min-height:145px;

        padding:
            28px 15px;

    }


    .options{

        grid-template-columns:1fr;

        gap:10px;

    }


    .option-btn{

        font-size:23px;

        min-height:59px;

        padding:14px;

    }


    .result-message{

        font-size:21px;

    }


    .explanation{

        font-size:19px;

    }


    .next-btn{

        font-size:20px;

    }


    #final h2{

        font-size:38px;

    }


    .final-score{

        font-size:34px;

    }


    .final-message{

        font-size:21px;

    }

}

</style>

</head>


<body>


<!-- ==========================================================
     BACK TO LOBBY
========================================================== -->

<div class="back-btn-container">

    <button
        class="lobby-btn"
        onclick="backToLobby()"
    >

        ← Back

    </button>

</div>


<!-- ==========================================================
     MAIN CONTAINER
========================================================== -->

<div class="container">


<!-- ==========================================================
     GAME
========================================================== -->

<div
    id="game"
>


    <h1 class="title">

        👤 Vietnamese Pronouns Challenge

    </h1>


    <p class="subtitle">

        Choose the correct Vietnamese pronoun.

    </p>


    <div class="game-box">


        <!-- ==================================================
             TOP BAR
        ================================================== -->

        <div class="topbar">


            <div class="question-count">

                Question

                <span id="questionNumber">
                    1
                </span>

                /

                <span id="totalQuestions">
                    20
                </span>

            </div>


            <div class="score">

                Score:

                <span id="score">
                    0
                </span>

            </div>


        </div>


        <!-- ==================================================
             PROGRESS
        ================================================== -->

        <div class="progress-wrap">

            <div
                class="progress"
                id="progress"
            ></div>

        </div>


        <!-- ==================================================
             QUESTION
        ================================================== -->

        <div
            class="card"
            id="questionText"
        ></div>


        <!-- ==================================================
             OPTIONS
        ================================================== -->

            class="options"

        ></div>


        <!-- ==================================================
             RESULT
        ================================================== -->

        <!-- ==================================================

</div>


<!-- ==========================================================
     FINAL
========================================================== -->

<div
    id="final"
>


    <h2>

        🎉 Game Complete!

    </h2>


    <p class="final-message">

        You completed the Vietnamese Pronouns Challenge.

    </p>


    <div class="final-score">

        Score:

        <span id="finalScore"></span>

    </div>


    <p
        class="final-message"
        id="finalMessage"
    ></p>


    <button
        class="play-again-btn"
        onclick="restartGame()"
    >

        Play Again

    </button>


</div>


</div>


<script>


/* ==========================================================
   QUESTION DATABASE
========================================================== */

const database = [

    {
        q:
        "You are talking to your father. What do you call him?",

        a:[
            "Ba",
            "Ông",
            "Chú",
            "Bác"
        ],

        c:"Ba",

        e:
        "\"Ba\" means father or dad. It is commonly used to address your father."
    },


    {
        q:
        "You are talking to your mother. What do you call her?",

        a:[
            "Mẹ",
            "Bà",
            "Dì",
            "Chị"
        ],

        c:"Mẹ",

        e:
        "\"Mẹ\" means mother or mom."
    },


    {
        q:
        "You meet a man from the grandparents' generation. What do you call him?",

        a:[
            "Ông",
            "Bà",
            "Chú",
            "Bác"
        ],

        c:"Ông",

        e:
        "\"Ông\" is used for a grandfather or an older man from the grandparents' generation."
    },


    {
        q:
        "You meet a woman from the grandparents' generation. What do you call her?",

        a:[
            "Bà",
            "Ông",
            "Dì",
            "Chị"
        ],

        c:"Bà",

        e:
        "\"Bà\" is used for a grandmother or an older woman from the grandparents' generation."
    },


    {
        q:
        "You meet a man from the parents' generation who is younger than your parents. What do you call him?",

        a:[
            "Chú",
            "Bác",
            "Anh",
            "Ông"
        ],

        c:"Chú",

        e:
        "\"Chú\" is commonly used for a younger male relative of your parents' generation, especially your father's younger brother."
    },


    {
        q:
        "You meet a woman from the parents' generation who is younger than your parents. What do you call her?",

        a:[
            "Dì",
            "Bác",
            "Chị",
            "Bà"
        ],

        c:"Dì",

        e:
        "\"Dì\" is commonly used for a maternal aunt or a woman from the parents' generation who is younger than your parents."
    },


    {
        q:
        "You meet someone from the parents' generation who is older than your parents. What do you call them?",

        a:[
            "Bác",
            "Chú",
            "Dì",
            "Ông"
        ],

        c:"Bác",

        e:
        "\"Bác\" is commonly used for an older person from the parents' generation."
    },


    {
        q:
        "You talk to a man of your generation who is older than you. What do you call him?",

        a:[
            "Anh",
            "Em",
            "Chú",
            "Bác"
        ],

        c:"Anh",

        e:
        "\"Anh\" is used for an older male sibling or an older man around your generation."
    },


    {
        q:
        "You talk to a woman of your generation who is older than you. What do you call her?",

        a:[
            "Chị",
            "Em",
            "Anh",
            "Bà"
        ],

        c:"Chị",

        e:
        "\"Chị\" is used for an older female sibling or an older woman around your generation."
    },


    {
        q:
        "You talk to someone of your generation who is younger than you. What do you call them?",

        a:[
            "Em",
            "Anh",
            "Chị",
            "Bác"
        ],

        c:"Em",

        e:
        "\"Em\" is used for a younger sibling or a younger person around your generation."
    },


    {
        q:
        "You talk to a young child from the younger generation. What do you call them?",

        a:[
            "Cháu",
            "Em",
            "Bác",
            "Chú"
        ],

        c:"Cháu",

        e:
        "\"Cháu\" can be used for a grandchild, niece, nephew, or a much younger person."
    },


    {
        q:
        "Your father's younger brother is talking to you. What do you call him?",

        a:[
            "Chú",
            "Bác",
            "Anh",
            "Ông"
        ],

        c:"Chú",

        e:
        "\"Chú\" is the common term for your father's younger brother."
    },


    {
        q:
        "Your father's older brother is talking to you. What do you call him?",

        a:[
            "Bác",
            "Chú",
            "Anh",
            "Ông"
        ],

        c:"Bác",

        e:
        "\"Bác\" is used for an older sibling of your parent, such as your father's older brother."
    },


    {
        q:
        "Your mother's sister is talking to you. What do you call her?",

        a:[
            "Dì",
            "Bác",
            "Chị",
            "Bà"
        ],

        c:"Dì",

        e:
        "\"Dì\" is commonly used for your mother's sister."
    },


    {
        q:
        "Your older brother is talking to you. What do you call him?",

        a:[
            "Anh",
            "Em",
            "Chú",
            "Cháu"
        ],

        c:"Anh",

        e:
        "\"Anh\" means older brother and can also be used for an older male around your generation."
    },


    {
        q:
        "Your older sister is talking to you. What do you call her?",

        a:[
            "Chị",
            "Em",
            "Dì",
            "Bà"
        ],

        c:"Chị",

        e:
        "\"Chị\" means older sister and can also be used for an older female around your generation."
    },


    {
        q:
        "Your younger brother is talking to you. What do you call him?",

        a:[
            "Em trai",
            "Anh",
            "Chú",
            "Cháu trai"
        ],

        c:"Em trai",

        e:
        "\"Em trai\" means younger brother. When addressing him directly, you can simply use \"Em\"."
    },


    {
        q:
        "Your younger sister is talking to you. What do you call her?",

        a:[
            "Em gái",
            "Chị",
            "Dì",
            "Cháu gái"
        ],

        c:"Em gái",

        e:
        "\"Em gái\" means younger sister. When addressing her directly, you can simply use \"Em\"."
    },


    {
        q:
        "A boy who is your son is being introduced. What is he called?",

        a:[
            "Con trai",
            "Con gái",
            "Cháu trai",
            "Em trai"
        ],

        c:"Con trai",

        e:
        "\"Con trai\" means son or boy. \"Con\" can also be used when addressing your own child."
    },


    {
        q:
        "A girl who is your daughter is being introduced. What is she called?",

        a:[
            "Con gái",
            "Con trai",
            "Cháu gái",
            "Em gái"
        ],

        c:"Con gái",

        e:
        "\"Con gái\" means daughter or girl. \"Con\" can also be used when addressing your own child."
    }

];


/* ==========================================================
   STATE
========================================================== */

let questions = [];

let currentQuestion = 0;

let score = 0;

let answered = false;


/* ==========================================================
   DOM
========================================================== */

const game =
    document.getElementById(
        "game"
    );


const final =
    document.getElementById(
        "final"
    );


const questionNumber =
    document.getElementById(
        "questionNumber"
    );


const totalQuestions =
    document.getElementById(
        "totalQuestions"
    );


const scoreElement =
    document.getElementById(
        "score"
    );


const progress =
    document.getElementById(
        "progress"
    );


const questionText =
    document.getElementById(
        "questionText"
    );


const optionsContainer =
    document.getElementById(
        "optionsContainer"
    );


const resultText =
    document.getElementById(
        "resultText"
    );


const explanation =
    document.getElementById(
        "explanation"
    );


const nextBtn =
    document.getElementById(
        "nextBtn"
    );


const finalScore =
    document.getElementById(
        "finalScore"
    );


const finalMessage =
    document.getElementById(
        "finalMessage"
    );


/* ==========================================================
   SHUFFLE
========================================================== */

function shuffle(array){

    const arr = [...array];


    for(
        let i = arr.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] = [
            arr[j],
            arr[i]
        ];

    }


    return arr;

}


/* ==========================================================
   START GAME
========================================================== */

function startGame(){

    questions =
        shuffle(database);


    currentQuestion = 0;

    score = 0;


    game.style.display =
        "block";


    final.style.display =
        "none";


    scoreElement.textContent =
        "0";


    totalQuestions.textContent =
        questions.length;


    loadQuestion();

}


/* ==========================================================
   LOAD QUESTION
========================================================== */

function loadQuestion(){

    answered = false;


    const question =
        questions[currentQuestion];


    questionNumber.textContent =
        currentQuestion + 1;


    progress.style.width =
        (
            currentQuestion /
            questions.length *
            100
        ) + "%";


    questionText.textContent =
        question.q;


    resultText.textContent =
        "";


    resultText.className =
        "result-message";


    explanation.innerHTML =
        "";


    explanation.classList.remove(
        "show"
    );


    nextBtn.style.display =
        "none";


    nextBtn.textContent =
        currentQuestion ===
        questions.length - 1
            ? "Finish 🎉"
            : "Next →";


    const options =
        shuffle(question.a);


    optionsContainer.innerHTML =
        "";


    options.forEach(
        option => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "option-btn";


            button.textContent =
                option;


            button.onclick =
                () =>
                    handleAnswer(
                        button,
                        option
                    );


            optionsContainer.appendChild(
                button
            );

        }
    );

}


/* ==========================================================
   HANDLE ANSWER
========================================================== */

function handleAnswer(
    button,
    selected
){

    if(answered){

        return;

    }


    answered = true;


    const question =
        questions[currentQuestion];


    const buttons =
        document.querySelectorAll(
            ".option-btn"
        );


    /*
     * Lock the entire question.
     */

    buttons.forEach(
        btn => {

            btn.disabled =
                true;

        }
    );


    /*
     * Correct answer.
     */

    if(
        selected ===
        question.c
    ){

        button.classList.add(
            "correct"
        );


        score++;


        scoreElement.textContent =
            score;


        resultText.textContent =
            "🎉 Correct!";


        resultText.className =
            "result-message correct-text";

    }


    /*
     * Wrong answer.
     */

    else{

        button.classList.add(
            "wrong"
        );


        buttons.forEach(
            btn => {

                if(
                    btn.textContent ===
                    question.c
                ){

                    btn.classList.add(
                        "correct"
                    );

                }

            }
        );


        resultText.textContent =
            `❌ Incorrect. The correct answer is "${question.c}".`;


        resultText.className =
            "result-message wrong-text";

    }


    /*
     * Show explanation.
     */

    showExplanation(
        question
    );


    /*
     * Show next button.
     */

    nextBtn.style.display =
        "inline-block";

}


/* ==========================================================
   EXPLANATION
========================================================== */

function showExplanation(
    question
){

    explanation.innerHTML = `

        <strong>💡 Learn:</strong>

        <br><br>

        ${question.e}

    `;


    explanation.classList.add(
        "show"
    );

}


/* ==========================================================
   NEXT QUESTION
========================================================== */

function nextQuestion(){

    currentQuestion++;


    if(
        currentQuestion <
        questions.length
    ){

        loadQuestion();

    }

    else{

        finishGame();

    }

}


/* ==========================================================
   FINISH GAME
========================================================== */

function finishGame(){

    game.style.display =
        "none";


    final.style.display =
        "block";


    progress.style.width =
        "100%";


    finalScore.textContent =
        score +
        " / " +
        questions.length;


    const percent =
        Math.round(
            score /
            questions.length *
            100
        );


    let message;


    if(
        percent === 100
    ){

        message =
            "🏆 Perfect! You really understand Vietnamese pronouns and family terms.";

    }

    else if(
        percent >= 90
    ){

        message =
            "🌟 Excellent! You have a strong understanding of Vietnamese pronouns.";

    }

    else if(
        percent >= 70
    ){

        message =
            "👏 Good job! Keep practicing how Vietnamese pronouns change with age and relationship.";

    }

    else if(
        percent >= 50
    ){

        message =
            "📚 Nice effort! Review the family and pronoun vocabulary and try again.";

    }

    else{

        message =
            "💪 Keep practicing! Vietnamese pronouns take time to become natural.";

    }


    finalMessage.textContent =
        message;


    if (
        typeof trackGameComplete ===
        "function"
    ) {
        trackGameComplete(
            "People - Game 2",
            score,
            questions.length
        );
    }

}

/* ==========================================================
   RESTART
========================================================== */

function restartGame(){

    startGame();

}


/* ==========================================================
   BACK TO LOBBY
========================================================== */

function backToLobby(){

    window.location.href =
        "../../category.html?category=People%20%26%20Pronouns";

}


/* ==========================================================
   START IMMEDIATELY
========================================================== */

window.trackGameStart(
    "People - Game 2"
);

startGame();

</script>
