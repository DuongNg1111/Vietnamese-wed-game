<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Vietnamese Pronouns Challenge</title>

<meta
    name="game-title"
    content="Vietnamese Pronouns Challenge"
>

<meta
    name="game-description"
    content="Practice Vietnamese pronouns and family terms based on age, gender, and relationship."
>

<meta
    name="game-icon"
    content="👤"
>

<meta
    name="game-explanation"
    content="true"
>


<style>

/* ==========================================================
   RESET
========================================================== */

*{
    box-sizing:border-box;
}


body{

    margin:0;

    font-family:
        'Segoe UI',
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    background:#f4f7f6;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    color:#2c3e50;

}


/* ==========================================================
   SCREEN
========================================================== */

.screen{
    display:none;
}


.screen.active{
    display:block;
}


/* ==========================================================
   CONTAINER
========================================================== */

.container{

    position:relative;

    width:min(750px,96vw);

    margin:0 auto;

    background:white;

    padding:65px 30px 30px;

    border-radius:20px;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.08);

}


/* ==========================================================
   BACK TO LOBBY
========================================================== */

.lobby-btn{

    position:absolute;

    top:20px;
    left:22px;

    padding:8px 14px;

    border:none;

    border-radius:8px;

    background:#eef5fc;

    color:#34495e;

    font-size:24px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.lobby-btn:hover{

    background:#dcecff;

    transform:translateX(-2px);

}


/* ==========================================================
   INTRO
========================================================== */

#intro{

    text-align:center;

    padding:20px 20px 30px;

}


#intro .emoji{

    font-size:70px;

    margin-bottom:10px;

}


#intro h1{

    margin:0 0 15px;

    font-size:44px;

}


#intro p{

    color:#7f8c8d;

    font-size:27px;

    line-height:1.6;

    margin:8px 0;

}


.start-btn{

    margin-top:20px;

    padding:14px 35px;

    border:none;

    border-radius:12px;

    background:#34495e;

    color:white;

    font-size:28px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.start-btn:hover{

    background:#2c3e50;

    transform:translateY(-2px);

}


/* ==========================================================
   TITLE
========================================================== */

.title{

    text-align:center;

    margin:0 0 5px;

}


.subtitle{

    text-align:center;

    color:#7f8c8d;

    margin-bottom:25px;

}


/* ==========================================================
   GAME BOX
========================================================== */

.game-box{

    background:#fff;

    padding:25px;

    border-radius:15px;

    border:1px solid #eee;

    text-align:center;

}


.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:15px;

    font-weight:bold;

}


.question-count{

    color:#7f8c8d;

}


.score{

    color:#27ae60;

    font-size:28px;

}


/* ==========================================================
   PROGRESS
========================================================== */

.progress-wrap{

    width:100%;

    height:9px;

    background:#eee;

    border-radius:20px;

    overflow:hidden;

    margin-bottom:20px;

}


.progress{

    width:0%;

    height:100%;

    background:#34495e;

    transition:.3s;

}


/* ==========================================================
   QUESTION
========================================================== */

.card{

    background:#fffde7;

    border:2px dashed #f1c40f;

    border-radius:12px;

    padding:35px 20px;

    margin:20px 0;

    min-height:150px;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:31px;

    font-weight:600;

    line-height:1.5;

}


/* ==========================================================
   OPTIONS
========================================================== */

.options{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:12px;

}


.option-btn{

    padding:17px;

    min-height:62px;

    font-size:28px;

    font-weight:bold;

    background:#34495e;

    color:white;

    border:none;

    border-radius:9px;

    cursor:pointer;

    transition:.2s;

}


.option-btn:hover:not(:disabled){

    background:#2c3e50;

    transform:translateY(-2px);

}


.option-btn.correct{

    background:#27ae60;

}


.option-btn.wrong{

    background:#e74c3c;

}


.option-btn:disabled{

    cursor:default;

}


/* ==========================================================
   FEEDBACK
========================================================== */

.result-message{

    min-height:40px;

    margin-top:20px;

    font-size:28px;

    font-weight:bold;

    line-height:1.5;

}


.correct-text{

    color:#27ae60;

}


.wrong-text{

    color:#e74c3c;

}


/* ==========================================================
   EXPLANATION
========================================================== */

.explanation{

    margin-top:18px;

    padding:16px 18px;

    background:#f0f7ff;

    border-left:5px solid #4779b8;

    border-radius:10px;

    color:#3d5066;

    text-align:left;

    font-size:26px;

    line-height:1.6;

}


.explanation strong{

    color:#2c3e50;

}


/* ==========================================================
   NEXT BUTTON
========================================================== */

.next-btn{

    padding:12px 28px;

    border:none;

    border-radius:10px;

    background:#34495e;

    color:white;

    font-size:27px;

    font-weight:bold;

    cursor:pointer;

    margin-top:18px;

    transition:.2s;

}


.next-btn:hover{

    background:#2c3e50;

    transform:translateY(-2px);

}


/* ==========================================================
   FINAL
========================================================== */

#final{

    text-align:center;

    padding:30px 20px 40px;

}


#final h2{

    font-size:45px;

    color:#27ae60;

}


.final-score{

    font-size:40px;

    margin:25px 0;

    font-weight:bold;

    color:#1976d2;

}


.final-message{

    color:#7f8c8d;

    font-size:28px;

    line-height:1.6;

}


#final .start-btn{

    margin-top:10px;

}


/* ==========================================================
   MOBILE
========================================================== */

@media(max-width:600px){

    body{

        padding:10px;

    }


    .container{

        width:100%;

        padding:
            60px 15px 20px;

    }


    #intro{

        padding:
            20px 10px 25px;

    }


    #intro h1{

        font-size:38px;

    }


    #intro p{

        font-size:26px;

    }


    .game-box{

        padding:18px;

    }


    .options{

        grid-template-columns:1fr;

    }


    .card{

        font-size:28px;

        min-height:130px;

        padding:25px 15px;

    }


    .option-btn{

        font-size:27px;

        min-height:58px;

    }


    .lobby-btn{

        top:16px;

        left:16px;

        font-size:23px;

        padding:7px 12px;

    }


    #final h2{

        font-size:40px;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- ========================================================
     BACK TO LOBBY
========================================================= -->

<button
    class="lobby-btn"
    onclick="backToLobby()"
>

    ← Back

</button>



<!-- ========================================================
     INTRO
========================================================= -->

<div
    id="intro"
    class="screen active"
>

    <div class="emoji">

        👤

    </div>


    <h1>

        Vietnamese Pronouns Challenge

    </h1>


    <p>

        Choose the correct Vietnamese pronoun
        based on age, gender, and relationship.

    </p>

    <button
        class="start-btn"
        onclick="startGame()"
    >

        Start Game

    </button>

</div>



<!-- ========================================================
     GAME
========================================================= -->

<div
    id="game"
    class="screen"
>


    <h1 class="title">

        👤 Vietnamese Pronouns Challenge

    </h1>


    <p class="subtitle">

        Choose the correct Vietnamese pronoun.

    </p>



    <div class="game-box">


        <!-- TOP BAR -->

        <div class="topbar">

            <div class="question-count">

                Question

                <span id="questionNumber">
                    1
                </span>

                /

                <span id="totalQuestions">
                    20
                </span>

            </div>


            <div class="score">

                Score:

                <span id="score">
                    0
                </span>

            </div>

        </div>



        <!-- PROGRESS -->

        <div class="progress-wrap">

            <div
                class="progress"
                id="progress"
            ></div>

        </div>



        <!-- QUESTION -->

        <div
            class="card"
            id="questionText"
        ></div>



        <!-- OPTIONS -->

        <div
            class="options"
            id="optionsContainer"
        ></div>



        <!-- RESULT -->

        <div
            class="result-message"
            id="resultText"
        ></div>



        <!-- EXPLANATION -->

        <div
            class="explanation"
            id="explanation"
            style="display:none;"
        ></div>



        <!-- NEXT -->

        <button
            class="next-btn"
            id="nextBtn"
            onclick="nextQuestion()"
            style="display:none;"
        >

            Next →

        </button>


    </div>


</div>



<!-- ========================================================
     FINAL
========================================================= -->

<div
    id="final"
    class="screen"
>


    <h2>

        🎉 Game Complete!

    </h2>


    <p class="final-message">

        You completed the Vietnamese Pronouns Challenge.

    </p>


    <div class="final-score">

        Score:

        <span id="finalScore"></span>

    </div>


    <p
        class="final-message"
        id="finalMessage"
    ></p>


    <button
        class="start-btn"
        onclick="restartGame()"
    >

        Play Again

    </button>


</div>


</div>



<script>


/* ==========================================================
   QUESTION DATABASE
========================================================== */

const database = [

    {
        q:
        "You are talking to your father. What do you call him?",

        a:[
            "Ba",
            "Ông",
            "Chú",
            "Bác"
        ],

        c:"Ba",

        e:
        "\"Ba\" means father or dad. It is commonly used to address your father."
    },


    {
        q:
        "You are talking to your mother. What do you call her?",

        a:[
            "Mẹ",
            "Bà",
            "Dì",
            "Chị"
        ],

        c:"Mẹ",

        e:
        "\"Mẹ\" means mother or mom."
    },


    {
        q:
        "You meet a man from the grandparents' generation. What do you call him?",

        a:[
            "Ông",
            "Bà",
            "Chú",
            "Bác"
        ],

        c:"Ông",

        e:
        "\"Ông\" is used for a grandfather or an older man from the grandparents' generation."
    },


    {
        q:
        "You meet a woman from the grandparents' generation. What do you call her?",

        a:[
            "Bà",
            "Ông",
            "Dì",
            "Chị"
        ],

        c:"Bà",

        e:
        "\"Bà\" is used for a grandmother or an older woman from the grandparents' generation."
    },


    {
        q:
        "You meet a man from the parents' generation who is younger than your parents. What do you call him?",

        a:[
            "Chú",
            "Bác",
            "Anh",
            "Ông"
        ],

        c:"Chú",

        e:
        "\"Chú\" is commonly used for a younger male relative of your parents' generation, especially your father's younger brother."
    },


    {
        q:
        "You meet a woman from the parents' generation who is younger than your parents. What do you call her?",

        a:[
            "Dì",
            "Bác",
            "Chị",
            "Bà"
        ],

        c:"Dì",

        e:
        "\"Dì\" is commonly used for a maternal aunt or a woman from the parents' generation who is younger than your parents."
    },


    {
        q:
        "You meet someone from the parents' generation who is older than your parents. What do you call them?",

        a:[
            "Bác",
            "Chú",
            "Dì",
            "Ông"
        ],

        c:"Bác",

        e:
        "\"Bác\" is commonly used for an older person from the parents' generation."
    },


    {
        q:
        "You talk to a man of your generation who is older than you. What do you call him?",

        a:[
            "Anh",
            "Em",
            "Chú",
            "Bác"
        ],

        c:"Anh",

        e:
        "\"Anh\" is used for an older male sibling or an older man around your generation."
    },


    {
        q:
        "You talk to a woman of your generation who is older than you. What do you call her?",

        a:[
            "Chị",
            "Em",
            "Anh",
            "Bà"
        ],

        c:"Chị",

        e:
        "\"Chị\" is used for an older female sibling or an older woman around your generation."
    },


    {
        q:
        "You talk to someone of your generation who is younger than you. What do you call them?",

        a:[
            "Em",
            "Anh",
            "Chị",
            "Bác"
        ],

        c:"Em",

        e:
        "\"Em\" is used for a younger sibling or a younger person around your generation."
    },


    {
        q:
        "You talk to a young child from the younger generation. What do you call them?",

        a:[
            "Cháu",
            "Em",
            "Bác",
            "Chú"
        ],

        c:"Cháu",

        e:
        "\"Cháu\" can be used for a grandchild, niece, nephew, or a much younger person."
    },


    {
        q:
        "Your father's younger brother is talking to you. What do you call him?",

        a:[
            "Chú",
            "Bác",
            "Anh",
            "Ông"
        ],

        c:"Chú",

        e:
        "\"Chú\" is the common term for your father's younger brother."
    },


    {
        q:
        "Your father's older brother is talking to you. What do you call him?",

        a:[
            "Bác",
            "Chú",
            "Anh",
            "Ông"
        ],

        c:"Bác",

        e:
        "\"Bác\" is used for an older sibling of your parent, such as your father's older brother."
    },


    {
        q:
        "Your mother's sister is talking to you. What do you call her?",

        a:[
            "Dì",
            "Bác",
            "Chị",
            "Bà"
        ],

        c:"Dì",

        e:
        "\"Dì\" is commonly used for your mother's sister."
    },


    {
        q:
        "Your older brother is talking to you. What do you call him?",

        a:[
            "Anh",
            "Em",
            "Chú",
            "Cháu"
        ],

        c:"Anh",

        e:
        "\"Anh\" means older brother and can also be used for an older male around your generation."
    },


    {
        q:
        "Your older sister is talking to you. What do you call her?",

        a:[
            "Chị",
            "Em",
            "Dì",
            "Bà"
        ],

        c:"Chị",

        e:
        "\"Chị\" means older sister and can also be used for an older female around your generation."
    },


    {
        q:
        "Your younger brother is talking to you. What do you call him?",

        a:[
            "Em trai",
            "Anh",
            "Chú",
            "Cháu trai"
        ],

        c:"Em trai",

        e:
        "\"Em trai\" means younger brother. When addressing him directly, you can simply use \"Em\"."
    },


    {
        q:
        "Your younger sister is talking to you. What do you call her?",

        a:[
            "Em gái",
            "Chị",
            "Dì",
            "Cháu gái"
        ],

        c:"Em gái",

        e:
        "\"Em gái\" means younger sister. When addressing her directly, you can simply use \"Em\"."
    },


    {
        q:
        "A boy who is your son is being introduced. What is he called?",

        a:[
            "Con trai",
            "Con gái",
            "Cháu trai",
            "Em trai"
        ],

        c:"Con trai",

        e:
        "\"Con trai\" means son or boy. \"Con\" can also be used when addressing your own child."
    },


    {
        q:
        "A girl who is your daughter is being introduced. What is she called?",

        a:[
            "Con gái",
            "Con trai",
            "Cháu gái",
            "Em gái"
        ],

        c:"Con gái",

        e:
        "\"Con gái\" means daughter or girl. \"Con\" can also be used when addressing your own child."
    }

];


/* ==========================================================
   STATE
========================================================== */

let questions = [];

let currentQuestion = 0;

let score = 0;

let answered = false;


/* ==========================================================
   DOM
========================================================== */

const intro =
    document.getElementById("intro");


const game =
    document.getElementById("game");


const final =
    document.getElementById("final");


const questionNumber =
    document.getElementById("questionNumber");


const totalQuestions =
    document.getElementById("totalQuestions");


const scoreElement =
    document.getElementById("score");


const progress =
    document.getElementById("progress");


const questionText =
    document.getElementById("questionText");


const optionsContainer =
    document.getElementById("optionsContainer");


const resultText =
    document.getElementById("resultText");


const explanation =
    document.getElementById("explanation");


const nextBtn =
    document.getElementById("nextBtn");


const finalScore =
    document.getElementById("finalScore");


const finalMessage =
    document.getElementById("finalMessage");


/* ==========================================================
   SHUFFLE
========================================================== */

function shuffle(array){

    const arr = [...array];


    for(
        let i = arr.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] = [
            arr[j],
            arr[i]
        ];

    }


    return arr;

}


/* ==========================================================
   START GAME
========================================================== */

function startGame(){

    questions =
        shuffle(database);


    currentQuestion = 0;

    score = 0;


    intro.classList.remove("active");

    final.classList.remove("active");

    game.classList.add("active");


    scoreElement.textContent =
        "0";


    totalQuestions.textContent =
        questions.length;


    loadQuestion();

}


/* ==========================================================
   LOAD QUESTION
========================================================== */

function loadQuestion(){

    answered = false;


    const question =
        questions[currentQuestion];


    questionNumber.textContent =
        currentQuestion + 1;


    progress.style.width =
        (
            currentQuestion /
            questions.length *
            100
        ) + "%";


    questionText.textContent =
        question.q;


    resultText.textContent =
        "";


    resultText.className =
        "result-message";


    explanation.innerHTML =
        "";


    explanation.style.display =
        "none";


    nextBtn.style.display =
        "none";


    const options =
        shuffle(question.a);


    optionsContainer.innerHTML =
        "";


    options.forEach(option => {

        const button =
            document.createElement(
                "button"
            );


        button.className =
            "option-btn";


        button.textContent =
            option;


        button.onclick = () =>
            handleAnswer(
                button,
                option
            );


        optionsContainer.appendChild(
            button
        );

    });

}


/* ==========================================================
   HANDLE ANSWER
========================================================== */

function handleAnswer(
    button,
    selected
){

    if(answered){

        return;

    }


    answered = true;


    const question =
        questions[currentQuestion];


    const buttons =
        document.querySelectorAll(
            ".option-btn"
        );


    /*
     * Lock the entire question immediately.
     */

    buttons.forEach(btn => {

        btn.disabled = true;

    });


    /*
     * Correct answer.
     */

    if(
        selected === question.c
    ){

        button.classList.add(
            "correct"
        );


        score++;


        scoreElement.textContent =
            score;


        resultText.textContent =
            "🎉 Correct!";


        resultText.className =
            "result-message correct-text";

    }


    /*
     * Wrong answer.
     */

    else{

        button.classList.add(
            "wrong"
        );


        buttons.forEach(btn => {

            if(
                btn.textContent ===
                question.c
            ){

                btn.classList.add(
                    "correct"
                );

            }

        });


        resultText.textContent =
            `❌ Incorrect. The correct answer is "${question.c}".`;


        resultText.className =
            "result-message wrong-text";

    }


    /*
     * Show explanation after grading.
     */

    showExplanation(question);


    /*
     * Show next button.
     */

    nextBtn.style.display =
        "inline-block";


    if(
        currentQuestion ===
        questions.length - 1
    ){

        nextBtn.textContent =
            "Finish 🎉";

    }
    else{

        nextBtn.textContent =
            "Next →";

    }

}


/* ==========================================================
   EXPLANATION
========================================================== */

function showExplanation(question){

    explanation.innerHTML = `

        <strong>💡 Learn:</strong>

        <br><br>

        ${question.e}

    `;


    explanation.style.display =
        "block";

}


/* ==========================================================
   NEXT QUESTION
========================================================== */

function nextQuestion(){

    currentQuestion++;


    if(
        currentQuestion <
        questions.length
    ){

        loadQuestion();

    }
    else{

        finishGame();

    }

}


/* ==========================================================
   FINISH GAME
========================================================== */

function finishGame(){

    game.classList.remove(
        "active"
    );


    final.classList.add(
        "active"
    );


    progress.style.width =
        "100%";


    finalScore.textContent =
        score +
        " / " +
        questions.length;


    const percent =
        Math.round(
            score /
            questions.length *
            100
        );


    let message;


    if(
        percent === 100
    ){

        message =
            "🏆 Perfect! You really understand Vietnamese pronouns and family terms.";

    }

    else if(
        percent >= 90
    ){

        message =
            "🌟 Excellent! You have a strong understanding of Vietnamese pronouns.";

    }

    else if(
        percent >= 70
    ){

        message =
            "👏 Good job! Keep practicing how Vietnamese pronouns change with age and relationship.";

    }

    else if(
        percent >= 50
    ){

        message =
            "📚 Nice effort! Review the family and pronoun vocabulary and try again.";

    }

    else{

        message =
            "💪 Keep practicing! Vietnamese pronouns take time to become natural.";

    }


    finalMessage.textContent =
        message;

}


/* ==========================================================
   RESTART
========================================================== */

function restartGame(){

    startGame();

}


/* ==========================================================
   BACK TO LOBBY
========================================================== */

function backToLobby(){

    window.location.href =
        "../../category.html?category=People%20%26%20Pronouns";

}

</script>


</body>

</html>
