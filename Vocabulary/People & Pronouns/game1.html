<html lang="en">

<head>

>

<meta

    content="Practice Vietnamese family and people vocabulary."
>

<meta

>

    name="game-explanation"
    content="true"

<style>

/* ==========================================================
   RESET
========================================================== */

*{
    box-sizing:border-box;
}


:root{

    --accent:#5F79B4;

    --accent-dark:#41588B;

    --accent-light:#eaf0fa;

    --accent-bg:#F2F6FC;

    --accent-border:#c3d4ef;

    --correct:#019b3f;

    --correct-bg:#eaf3ff;

    --wrong:#d9536f;

    --wrong-bg:#fff0f3;

    --general-border:#d9e6f2;

    --ink: #143a6b;
    --ink-soft: #66809d;

    --muted:#6f7b89;

}


/* ==========================================================
   BODY
========================================================== */

body{

    margin:0;

    min-height:100vh;

    padding:28px 20px 45px;

    font-family:
        Calibri,
        'Segoe UI',
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    color:var(--ink);

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            var(--accent-bg) 48%,
            var(--accent-light) 100%
        );

}


/* ==========================================================
   BACK TO LOBBY
========================================================== */

.back-btn-container{

    width:min(900px, 100%);

    margin:0 auto 18px;

}


.back-btn{

    display:inline-flex;

    align-items:center;

    gap:6px;

    padding:9px 16px;

    background:#ffffff;

    color:var(--accent-dark);

    border:1px solid var(--accent-border);

    border-radius:10px;

    text-decoration:none;

    font-size:20px;

    font-weight:bold;

    transition:.2s;

}


.back-btn:hover{

    background:var(--accent-light);

    border-color:var(--accent);

    transform:translateX(-2px);

}


/* ==========================================================
   MAIN CONTAINER
========================================================== */

.container{

    position:relative;

    width:min(900px, 100%);

    margin:0 auto;

    background:#ffffff;

    padding:32px;

    border-radius:20px;

    box-shadow:
        0 8px 24px rgba(0,0,0,.08);

}


/* ==========================================================
   TITLE
========================================================== */

.title{

    margin:0;

    text-align:center;

    font-family:Kalam, cursive;

    font-size:42px;

    line-height:1.2;

    color:var(--ink);

}


.subtitle{

    margin:
        8px 0 26px;

    text-align:center;

    color:var(--muted);

    font-size:22px;

    line-height:1.5;

}


/* ==========================================================
   GAME BOX
========================================================== */

.game-box{

    position:relative;

    background:#ffffff;

    padding:25px;

    border:1px solid var(--general-border);

    border-radius:15px;

    text-align:center;

    overflow:hidden;

}




/* ==========================================================
   TOP BAR
========================================================== */

.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:18px;

    font-size:20px;

    font-weight:bold;

}


.question-count{

    color:var(--muted);

}


.score{

    color:var(--accent-dark);

    font-size:23px;

}


/* ==========================================================
   PROGRESS
========================================================== */

.progress-wrap{

    width:100%;

    height:9px;

    background:var(--accent-light);

    border-radius:20px;

    overflow:hidden;

    margin-bottom:22px;

}


.progress{

    width:0%;

    height:100%;

    background:var(--accent);

    transition:.3s;

}


/* ==========================================================
   QUESTION CARD
========================================================== */

.card{

    position:relative;

    background:var(--accent-bg);

    border:1px solid var(--accent-border);

    border-radius:12px;

    padding:35px 25px;

    margin:20px 0;

    min-height:190px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    font-size:32px;

    font-weight:600;

    line-height:1.5;

    gap:12px;

    overflow:hidden;

}



/* Accent line */

.card::before{

    content:"";

    position:absolute;

    top:0;

    left:0;

    right:0;

    height:4px;

    background:var(--accent);

}


/* ==========================================================
   OPTIONS
========================================================== */

.options{

    display:grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap:12px;

    margin-top:22px;

}


.option-btn{

    padding:17px;

    min-height:64px;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:27px;

    font-weight:bold;

    background:#ffffff;

    color:var(--accent-dark);

    border:1px solid var(--general-border);

    border-radius:10px;

    cursor:pointer;

    transition:.2s;

}


.option-btn:hover:not(.disabled){

    background:var(--accent-light);

    border-color:var(--accent);

    transform:translateY(-2px);

}


.option-btn.correct{

    background:var(--correct-bg);

    border-color:var(--correct);

    color:var(--correct);

}


.option-btn.wrong{

    background:var(--wrong-bg);

    border-color:var(--wrong);

    color:var(--wrong);

}


.option-btn.disabled{

    pointer-events:none;

    cursor:default;

}


/* ==========================================================
   RESULT
========================================================== */

.result-message{

    min-height:40px;

    margin-top:20px;

    font-size:25px;

    font-weight:bold;

    line-height:1.4;

}


.correct-text{

    color:var(--correct);

}


.wrong-text{

    color:var(--wrong);

}


/* ==========================================================
   EXPLANATION
========================================================== */

.explanation{

    display:none;

    margin-top:15px;

    padding:16px 18px;

    background:var(--accent-bg);

    border:1px solid var(--accent-border);

    border-left:5px solid var(--accent);

    border-radius:10px;

    color:#46556b;

    font-size:22px;

    line-height:1.6;

    text-align:left;

}


.explanation.show{

    display:block;

}


.explanation strong{

    color:var(--accent-dark);

}


/* ==========================================================
   NEXT BUTTON
========================================================== */

.next-btn{

    padding:12px 28px;

    border:none;

    border-radius:10px;

    background:var(--accent);

    color:#ffffff;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:24px;

    font-weight:bold;

    cursor:pointer;

    margin-top:18px;

    transition:.2s;

}


.next-btn:hover{

    background:var(--accent-dark);

    transform:translateY(-2px);

}


/* ==========================================================
   FINAL
========================================================== */

#final{

    display:none;

    text-align:center;

    padding:25px 15px 15px;

}


#final h2{

    margin:
        0 0 15px;

    font-family:Kalam, cursive;

    font-size:42px;

    color:var(--accent-dark);

}


.final-message{

    color:var(--muted);

    font-size:24px;

    line-height:1.5;

}


.final-score{

    font-size:38px;

    margin:22px 0;

    font-weight:bold;

    color:var(--accent-dark);

}


.play-again-btn{

    margin-top:10px;

    padding:13px 30px;

    border:none;

    border-radius:10px;

    background:var(--accent);

    color:#ffffff;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:25px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.play-again-btn:hover{

    background:var(--accent-dark);

    transform:translateY(-2px);

}


/* ==========================================================
   MOBILE
========================================================== */

@media(max-width:600px){

    body{

        padding:
            18px 12px 30px;

    }


    .back-btn-container{

        margin-bottom:14px;

    }


    .back-btn{

        font-size:18px;

        padding:8px 13px;

    }


    .container{

        width:100%;

        padding:24px 16px;

        border-radius:20px;

    }


    .title{

        font-size:36px;

    }


    .subtitle{

        font-size:20px;

        margin-bottom:20px;

    }


    .game-box{

        padding:18px;

    }


    .topbar{

        font-size:18px;

    }


    .score{

        font-size:21px;

    }


    .options{

        grid-template-columns:1fr;

        gap:10px;

    }


    .card{

        font-size:28px;

        min-height:140px;

        padding:27px 15px;

    }


    .option-btn{

        font-size:25px;

        padding:15px;

        min-height:60px;

    }


    .result-message{

        font-size:23px;

    }


    .explanation{

        font-size:20px;

    }


    .next-btn{

        font-size:22px;

        width:100%;

    }


    #final h2{

        font-size:38px;

    }


    .final-score{

        font-size:34px;

    }


    .final-message{

        font-size:22px;

    }

}

</style>

</head>


<body>

     BACK TO LOBBY
========================================================== -->

<div class="back-btn-container">

    <a
        href="../../category.html?category=People%20%26%20Pronouns"

    >

        ← Back

<!-- ==========================================================
     MAIN CONTAINER
========================================================== -->

<div class="container">


<!-- ==========================================================
     GAME
========================================================== -->

<div
    id="game"
>


    <h1 class="title">

        👨‍👩‍👧‍👦 Vietnamese Family Vocabulary

    </h1>


    <p class="subtitle">

        Choose the correct Vietnamese word.

    </p>



    <div class="game-box">


        <!-- TOP BAR -->

        <div class="topbar">

            <div class="question-count">

                Question

                <span id="questionNumber">
                    1
                </span>

                /

                <span id="totalQuestions">
                    20
                </span>

            </div>


            <div class="score">

                Score:

                <span id="score">
                    0
                </span>

            </div>

        </div>



        <!-- PROGRESS -->

        <div class="progress-wrap">

            <div

                id="progress"
            ></div>

<!-- ==========================================================
     FINAL
========================================================== -->

<div
    id="final"
>


    <h2>

        🎉 Game Complete!

    </h2>


    <p class="final-message">

        You completed Vietnamese Family Vocabulary.

    </p>


    <div class="final-score">

        Score:

        <span id="finalScore"></span>

    </div>


    <p
        class="final-message"
        id="finalMessage"
    ></p>


    <button
        class="play-again-btn"
        onclick="restartGame()"
    >

        Play Again

    </button>


</div>


</div>



<script>

/* ==========================================================
   QUESTION DATABASE
========================================================== */

const database = [

    {
        q: "family",
        c: "gia đình",
        a: [
            "gia đình",
            "người",
            "vợ",
            "chồng"
        ],
        e: "Gia đình means family."
    },

    {
        q: "person / people",
        c: "người",
        a: [
            "người",
            "gia đình",
            "em",
            "cháu"
        ],
        e: "Người means person or people."
    },

    {
        q: "father",
        c: "ba",
        a: [
            "ba",
            "mẹ",
            "ông",
            "bác"
        ],
        e: "Ba means father."
    },

    {
        q: "mother",
        c: "mẹ",
        a: [
            "mẹ",
            "ba",
            "bà",
            "dì"
        ],
        e: "Mẹ means mother."
    },

    {
        q: "wife",
        c: "vợ",
        a: [
            "vợ",
            "chồng",
            "mẹ",
            "chị"
        ],
        e: "Vợ means wife."
    },

    {
        q: "husband",
        c: "chồng",
        a: [
            "chồng",
            "vợ",
            "ba",
            "anh"
        ],
        e: "Chồng means husband."
    },

    {
        q: "son / boy",
        c: "con trai",
        a: [
            "con trai",
            "con gái",
            "em trai",
            "cháu trai"
        ],
        e: "Con trai means son or boy."
    },

    {
        q: "daughter / girl",
        c: "con gái",
        a: [
            "con gái",
            "con trai",
            "em gái",
            "cháu gái"
        ],
        e: "Con gái means daughter or girl."
    },

    {
        q: "nephew / grandson / male grandchild",
        c: "cháu trai",
        a: [
            "cháu trai",
            "cháu gái",
            "con trai",
            "em trai"
        ],
        e: "Cháu trai can mean nephew, grandson, or male grandchild."
    },

    {
        q: "niece / granddaughter / female grandchild",
        c: "cháu gái",
        a: [
            "cháu gái",
            "cháu trai",
            "con gái",
            "em gái"
        ],
        e: "Cháu gái can mean niece, granddaughter, or female grandchild."
    },

    {
        q: "younger brother",
        c: "em trai",
        a: [
            "em trai",
            "anh",
            "con trai",
            "cháu trai"
        ],
        e: "Em trai means younger brother."
    },

    {
        q: "younger sister",
        c: "em gái",
        a: [
            "em gái",
            "chị",
            "con gái",
            "cháu gái"
        ],
        e: "Em gái means younger sister."
    },

    {
        q: "grandfather / older man",
        c: "ông",
        a: [
            "ông",
            "bà",
            "bác",
            "chú"
        ],
        e: "Ông means grandfather and can also be used for an older man."
    },

    {
        q: "grandmother / older woman",
        c: "bà",
        a: [
            "bà",
            "ông",
            "dì",
            "chị"
        ],
        e: "Bà means grandmother and can also be used for an older woman."
    },

    {
        q: "paternal younger uncle",
        c: "chú",
        a: [
            "chú",
            "bác",
            "dì",
            "ông"
        ],
        e: "Chú means your father's younger brother."
    },

    {
        q: "maternal aunt",
        c: "dì",
        a: [
            "dì",
            "chú",
            "bác",
            "bà"
        ],
        e: "Dì means your mother's sister."
    },

    {
        q: "older aunt / uncle",
        c: "bác",
        a: [
            "bác",
            "chú",
            "dì",
            "ông"
        ],
        e: "Bác is used for an older aunt or uncle in the family."
    },

    {
        q: "older brother / older male",
        c: "anh",
        a: [
            "anh",
            "chị",
            "em",
            "chú"
        ],
        e: "Anh means older brother and can also be used for an older male."
    },

    {
        q: "older sister / older female",
        c: "chị",
        a: [
            "chị",
            "anh",
            "em",
            "dì"
        ],
        e: "Chị means older sister and can also be used for an older female."
    },

    {
        q: "younger sibling / younger person",
        c: "em",
        a: [
            "em",
            "anh",
            "chị",
            "cháu"
        ],
        e: "Em means a younger sibling or a younger person."
    },

    {
        q: "niece / nephew / grandchild / younger person",
        c: "cháu",
        a: [
            "cháu",
            "em",
            "anh",
            "bác"
        ],
        e: "Cháu can mean niece, nephew, grandchild, or a younger person."
    }

];


/* ==========================================================
   GAME SETTINGS
========================================================== */

const totalQuestions = 20;


/* ==========================================================
   STATE
========================================================== */

let questions = [];

let currentQuestion = 0;

let score = 0;

let answered = false;


/* ==========================================================
   SHUFFLE
========================================================== */

function shuffle(array){

    const arr = [...array];


    for(
        let i = arr.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] = [
            arr[j],
            arr[i]
        ];

    }


    return arr;

}


/* ==========================================================
   START GAME
========================================================== */

function startGame(){

    questions =
        shuffle(database);


    currentQuestion = 0;

    score = 0;


    document
        .getElementById("game")
        .style.display =
        "block";


    document
        .getElementById("final")
        .style.display =
        "none";


    document
        .getElementById("score")
        .textContent =
        "0";


    document
        .getElementById("totalQuestions")
        .textContent =
        totalQuestions;


    loadQuestion();

}


/* ==========================================================
   LOAD QUESTION
========================================================== */

function loadQuestion(){

    answered = false;


    const question =
        questions[currentQuestion];


    document
        .getElementById("questionNumber")
        .textContent =
        currentQuestion + 1;


    document
        .getElementById("progress")
        .style.width =
        (
            (currentQuestion + 1) /
            totalQuestions *
            100
        ) + "%";


    document
        .getElementById("questionText")
        .textContent =
        question.q;


    document
        .getElementById("resultText")
        .textContent =
        "";


    document
        .getElementById("resultText")
        .className =
        "result-message";


    document
        .getElementById("explanation")
        .innerHTML =
        "";


    document
        .getElementById("explanation")
        .classList.remove(
            "show"
        );


    const nextBtn =
        document.getElementById(
            "nextBtn"
        );


    nextBtn.style.display =
        "none";


    nextBtn.textContent =
        currentQuestion ===
        totalQuestions - 1
            ? "Finish 🎉"
            : "Next →";


    const container =
        document.getElementById(
            "optionsContainer"
        );


    container.innerHTML =
        "";


    const options =
        shuffle(question.a);


    options.forEach(option => {

        const btn =
            document.createElement(
                "button"
            );


        btn.className =
            "option-btn";


        btn.textContent =
            option;


        btn.onclick = () =>
            handleAnswer(
                btn,
                option
            );


        container.appendChild(
            btn
        );

    });

}


/* ==========================================================
   HANDLE ANSWER
========================================================== */

function handleAnswer(
    button,
    selected
){

    if(answered){

        return;

    }


    answered = true;


    const question =
        questions[currentQuestion];


    const buttons =
        document.querySelectorAll(
            ".option-btn"
        );


    buttons.forEach(btn => {

        btn.classList.add(
            "disabled"
        );

    });


    if(
        selected === question.c
    ){

        button.classList.add(
            "correct"
        );


        score++;


        document
            .getElementById("score")
            .textContent =
            score;


        document
            .getElementById("resultText")
            .textContent =
            "🎉 Correct!";


        document
            .getElementById("resultText")
            .className =
            "result-message correct-text";

    }

    else{

        button.classList.add(
            "wrong"
        );


        buttons.forEach(btn => {

            if(
                btn.textContent ===
                question.c
            ){

                btn.classList.add(
                    "correct"
                );

            }

        });


        document
            .getElementById("resultText")
            .textContent =
            `❌ Incorrect. The correct answer is "${question.c}".`;


        document
            .getElementById("resultText")
            .className =
            "result-message wrong-text";

    }


    showExplanation(
        question
    );


    document
        .getElementById("nextBtn")
        .style.display =
        "inline-block";

}


/* ==========================================================
   EXPLANATION
========================================================== */

function showExplanation(
    question
){

    const explanation =
        document.getElementById(
            "explanation"
        );


    explanation.innerHTML = `

        <strong>💡 Learn:</strong>

        <br><br>

        <strong>
            ${question.c}
        </strong>

        =

        ${question.q}

        <br><br>

        ${question.e}

    `;


    explanation.classList.add(
        "show"
    );

}


/* ==========================================================
   NEXT QUESTION
========================================================== */

function nextQuestion(){

    currentQuestion++;


    if(
        currentQuestion <
        totalQuestions
    ){

        loadQuestion();

    }

    else{

        finishGame();

    }

}


/* ==========================================================
   FINISH GAME
========================================================== */

function finishGame(){

    document
        .getElementById("game")
        .style.display =
        "none";


    document
        .getElementById("final")
        .style.display =
        "block";


    document
        .getElementById("progress")
        .style.width =
        "100%";


    document
        .getElementById("finalScore")
        .textContent =
        score +
        " / " +
        totalQuestions;


    const percent =
        Math.round(
            score /
            totalQuestions *
            100
        );


    let message;


    if(
        percent === 100
    ){

        message =
            "🏆 Perfect! You mastered the family vocabulary!";

    }

    else if(
        percent >= 80
    ){

        message =
            "👏 Excellent! Your Vietnamese family vocabulary is strong.";

    }

    else if(
        percent >= 60
    ){

        message =
            "🎉 Good job! Keep practicing these family words.";

    }

    else{

        message =
            "📚 Keep practicing! Review the vocabulary and try again.";

    }


    document
        .getElementById("finalMessage")
        .textContent =
        message;

}


/* ==========================================================
   RESTART
========================================================== */
