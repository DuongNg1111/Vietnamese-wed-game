<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Who Is This Person?</title>

<meta
    name="game-title"
    content="Who Is This Person?"
>

<meta
    name="game-description"
    content="Practice Vietnamese family vocabulary by identifying people in everyday situations."
>

<meta
    name="game-icon"
    content="👨‍👩‍👧‍👦"
>


<style>

/* ==========================================================
   RESET
========================================================== */

*{
    box-sizing:border-box;
}


body{

    margin:0;

    font-family:
        'Segoe UI',
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    background:#f4f7f6;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    color:#2c3e50;

}


/* ==========================================================
   SCREEN
========================================================== */

.screen{
    display:none;
}


.screen.active{
    display:block;
}


/* ==========================================================
   CONTAINER
========================================================== */

.container{

    position:relative;

    width:min(900px,96vw);

    margin:0 auto;

    background:white;

    padding:65px 30px 30px;

    border-radius:20px;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.08);

}


/* ==========================================================
   BACK TO LOBBY
========================================================== */

.lobby-btn{

    position:absolute;

    top:20px;

    left:22px;

    padding:8px 14px;

    border:none;

    border-radius:8px;

    background:#eef5fc;

    color:#34495e;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.lobby-btn:hover{

    background:#dcecff;

    transform:translateX(-2px);

}


/* ==========================================================
   INTRO
========================================================== */

#intro{

    text-align:center;

    padding:20px 20px 30px;

}


#intro .emoji{

    font-size:60px;

    margin-bottom:10px;

}


#intro h1{

    margin:0 0 10px;

    font-size:34px;

}


#intro p{

    color:#7f8c8d;

    font-size:18px;

    line-height:1.6;

}


.start-btn{

    margin-top:20px;

    padding:14px 35px;

    border:none;

    border-radius:12px;

    background:#34495e;

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.start-btn:hover{

    background:#2c3e50;

    transform:translateY(-2px);

}


/* ==========================================================
   TITLE
========================================================== */

.title{

    text-align:center;

    margin:0 0 5px;

}


.subtitle{

    text-align:center;

    color:#7f8c8d;

    margin-bottom:25px;

}


/* ==========================================================
   GAME BOX
========================================================== */

.game-box{

    background:#fff;

    padding:25px;

    border-radius:15px;

    border:1px solid #eee;

    text-align:center;

}


.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:15px;

    font-weight:bold;

}


.question-count{

    color:#7f8c8d;

}


.score{

    color:#27ae60;

    font-size:18px;

}


/* ==========================================================
   PROGRESS
========================================================== */

.progress-wrap{

    width:100%;

    height:9px;

    background:#eee;

    border-radius:20px;

    overflow:hidden;

    margin-bottom:20px;

}


.progress{

    width:0%;

    height:100%;

    background:#34495e;

    transition:.3s;

}


/* ==========================================================
   QUESTION CARD
========================================================== */

.card{

    background:#f8fbff;

    border:2px dashed #3498db;

    border-radius:12px;

    padding:35px 25px;

    margin:20px 0;

    min-height:190px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    gap:12px;

}


.question-label{

    color:#7f8c8d;

    font-size:15px;

}


.scenario{

    font-size:21px;

    font-weight:600;

    line-height:1.6;

    color:#2c3e50;

}


/* ==========================================================
   OPTIONS
========================================================== */

.options{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:12px;

}


.option-btn{

    padding:17px;

    font-size:18px;

    font-weight:bold;

    background:#34495e;

    color:white;

    border:none;

    border-radius:9px;

    cursor:pointer;

    transition:.2s;

}


.option-btn:hover{

    background:#2c3e50;

    transform:translateY(-2px);

}


/* Correct answer */

.option-btn.correct{

    background:#27ae60;

    color:white;

}


/* Wrong selected answer */

.option-btn.wrong{

    background:#e74c3c;

    color:white;

}


/* Correct answer revealed after wrong choice */

.option-btn.reveal{

    background:#27ae60;

    color:white;

    box-shadow:
        0 0 0 3px
        rgba(39,174,96,.2);

}


/* Locked buttons */

.option-btn.disabled{

    pointer-events:none;

    cursor:default;

}


/* ==========================================================
   RESULT
========================================================== */

.result-message{

    min-height:40px;

    margin-top:20px;

    font-size:18px;

    font-weight:bold;

}


.correct-text{

    color:#27ae60;

}


.wrong-text{

    color:#e74c3c;

}


/* ==========================================================
   EXPLANATION
========================================================== */

.explanation{

    min-height:25px;

    margin-top:0;

    color:#7f8c8d;

    font-size:15px;

    line-height:1.5;

}


/* ==========================================================
   NEXT BUTTON
========================================================== */

.next-btn{

    padding:12px 28px;

    border:none;

    border-radius:10px;

    background:#34495e;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    margin-top:10px;

    transition:.2s;

}


.next-btn:hover{

    background:#2c3e50;

    transform:translateY(-2px);

}


/* ==========================================================
   FINAL
========================================================== */

#final{

    text-align:center;

    padding:30px 20px 40px;

}


#final h2{

    font-size:35px;

    color:#27ae60;

}


.final-score{

    font-size:30px;

    margin:25px 0;

    font-weight:bold;

    color:#1976d2;

}


.final-message{

    color:#7f8c8d;

    font-size:18px;

}


/* ==========================================================
   MOBILE
========================================================== */

@media(max-width:600px){

    body{

        padding:10px;

    }


    .container{

        width:100%;

        padding:
            60px 15px 20px;

    }


    .game-box{

        padding:18px;

    }


    .options{

        grid-template-columns:1fr;

    }


    .card{

        min-height:160px;

        padding:25px 15px;

    }


    .scenario{

        font-size:18px;

    }


    #intro h1{

        font-size:28px;

    }


    #final h2{

        font-size:30px;

    }


    .lobby-btn{

        top:16px;

        left:16px;

        font-size:13px;

        padding:7px 12px;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- ========================================================
     BACK TO LOBBY
========================================================= -->

<button
    class="lobby-btn"
    onclick="backToLobby()"
>

    ← Back

</button>



<!-- ========================================================
     INTRO
========================================================= -->

<div
    id="intro"
    class="screen active"
>

    <div class="emoji">

        👨‍👩‍👧‍👦

    </div>


    <h1>

        Who Is This Person?

    </h1>


    <p>

        Read the situation and choose
        the correct Vietnamese word.

    </p>

    <button
        class="start-btn"
        onclick="startGame()"
    >

        Start Game

    </button>

</div>



<!-- ========================================================
     GAME
========================================================= -->

<div
    id="game"
    class="screen"
>


    <h1 class="title">

        👨‍👩‍👧‍👦 Who Is This Person?

    </h1>


    <p class="subtitle">

        Choose the correct Vietnamese word.

    </p>



    <div class="game-box">


        <!-- TOP BAR -->

        <div class="topbar">

            <div class="question-count">

                Question

                <span id="questionNumber">
                    1
                </span>

                /

                <span id="totalQuestions">
                    10
                </span>

            </div>


            <div class="score">

                Score:

                <span id="score">
                    0
                </span>

            </div>

        </div>



        <!-- PROGRESS -->

        <div class="progress-wrap">

            <div
                class="progress"
                id="progress"
            ></div>

        </div>



        <!-- QUESTION -->

        <div class="card">


            <div class="question-label">

                Who is this person?

            </div>


            <div
                class="scenario"
                id="questionText"
            ></div>


        </div>



        <!-- OPTIONS -->

        <div
            class="options"
            id="optionsContainer"
        ></div>



        <!-- RESULT -->

        <div
            class="result-message"
            id="resultText"
        ></div>


        <div
            class="explanation"
            id="explanation"
        ></div>



        <!-- NEXT -->

        <button
            class="next-btn"
            id="nextBtn"
            onclick="nextQuestion()"
            style="display:none;"
        >

            Next →

        </button>


    </div>


</div>



<!-- ========================================================
     FINAL
========================================================= -->

<div
    id="final"
    class="screen"
>


    <h2>

        🎉 Game Complete!

    </h2>


    <p class="final-message">

        You completed the
        Who Is This Person? challenge.

    </p>


    <div class="final-score">

        Score:

        <span id="finalScore"></span>

    </div>


    <p
        class="final-message"
        id="finalMessage"
    ></p>


    <button
        class="start-btn"
        onclick="restartGame()"
    >

        Play Again

    </button>


</div>


</div>



<script>


/* ==========================================================
   QUESTION DATABASE
   ONLY VOCABULARY FROM THE FAMILY VOCAB LIST
========================================================== */

const database = [

    {
        q:
        "This person is your father's or mother's father.",

        a:[
            "ông",
            "bà",
            "ba",
            "chú"
        ],

        c:"ông",

        explanation:
        "Ông means grandfather / older man."
    },


    {
        q:
        "This person is your father's or mother's mother.",

        a:[
            "bà",
            "ông",
            "mẹ",
            "dì"
        ],

        c:"bà",

        explanation:
        "Bà means grandmother / older woman."
    },


    {
        q:
        "This person is your male parent.",

        a:[
            "ba",
            "mẹ",
            "chồng",
            "con"
        ],

        c:"ba",

        explanation:
        "Ba means father / dad."
    },


    {
        q:
        "This person is your female parent.",

        a:[
            "mẹ",
            "ba",
            "vợ",
            "bà"
        ],

        c:"mẹ",

        explanation:
        "Mẹ means mother / mom."
    },


    {
        q:
        "This person is your child, but the person is male.",

        a:[
            "con trai",
            "con gái",
            "em trai",
            "cháu trai"
        ],

        c:"con trai",

        explanation:
        "Con trai means son / boy."
    },


    {
        q:
        "This person is your child, but the person is female.",

        a:[
            "con gái",
            "con trai",
            "em gái",
            "cháu gái"
        ],

        c:"con gái",

        explanation:
        "Con gái means daughter / girl."
    },


    {
        q:
        "This person is your younger male sibling.",

        a:[
            "em trai",
            "em gái",
            "con trai",
            "anh"
        ],

        c:"em trai",

        explanation:
        "Em trai means younger brother."
    },


    {
        q:
        "This person is your younger female sibling.",

        a:[
            "em gái",
            "em trai",
            "con gái",
            "chị"
        ],

        c:"em gái",

        explanation:
        "Em gái means younger sister."
    },


    {
        q:
        "This person is your mother's younger sister.",

        a:[
            "dì",
            "chú",
            "bác",
            "chị"
        ],

        c:"dì",

        explanation:
        "Dì means maternal aunt."
    },


    {
        q:
        "This person is your father's younger brother.",

        a:[
            "chú",
            "dì",
            "bác",
            "anh"
        ],

        c:"chú",

        explanation:
        "Chú means paternal younger uncle."
    }

];



/* ==========================================================
   STATE
========================================================== */

let questions = [];

let currentQuestion = 0;

let score = 0;

let answered = false;



/* ==========================================================
   SHUFFLE
========================================================== */

function shuffle(array){

    const arr = [...array];


    for(
        let i = arr.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] = [
            arr[j],
            arr[i]
        ];

    }


    return arr;

}



/* ==========================================================
   START GAME
========================================================== */

function startGame(){

    questions =
        shuffle(database);


    currentQuestion = 0;

    score = 0;


    document
        .getElementById("intro")
        .classList.remove("active");


    document
        .getElementById("final")
        .classList.remove("active");


    document
        .getElementById("game")
        .classList.add("active");


    document
        .getElementById("score")
        .textContent =
        "0";


    document
        .getElementById("totalQuestions")
        .textContent =
        questions.length;


    loadQuestion();

}



/* ==========================================================
   LOAD QUESTION
========================================================== */

function loadQuestion(){

    answered = false;


    const question =
        questions[currentQuestion];


    document
        .getElementById("questionNumber")
        .textContent =
        currentQuestion + 1;


    document
        .getElementById("progress")
        .style.width =
        (
            currentQuestion /
            questions.length *
            100
        ) + "%";


    document
        .getElementById("questionText")
        .textContent =
        question.q;


    document
        .getElementById("resultText")
        .textContent =
        "";


    document
        .getElementById("resultText")
        .className =
        "result-message";


    document
        .getElementById("explanation")
        .textContent =
        "";


    document
        .getElementById("nextBtn")
        .style.display =
        "none";


    const container =
        document.getElementById(
            "optionsContainer"
        );


    container.innerHTML =
        "";


    const options =
        shuffle(question.a);


    options.forEach(option => {

        const btn =
            document.createElement(
                "button"
            );


        btn.className =
            "option-btn";


        btn.textContent =
            option;


        btn.dataset.answer =
            option;


        btn.onclick = () =>
            handleAnswer(
                btn,
                option
            );


        container.appendChild(btn);

    });

}



/* ==========================================================
   HANDLE ANSWER
========================================================== */

function handleAnswer(
    button,
    selected
){

    if(answered){

        return;

    }


    const question =
        questions[currentQuestion];


    const buttons =
        document.querySelectorAll(
            ".option-btn"
        );


    /*
       CORRECT ANSWER
    */

    if(selected === question.c){

        answered = true;

        score++;


        button.classList.add(
            "correct"
        );


        document
            .getElementById("score")
            .textContent =
            score;


        document
            .getElementById("resultText")
            .textContent =
            "🎉 Correct!";


        document
            .getElementById("resultText")
            .className =
            "result-message correct-text";


        document
            .getElementById("explanation")
            .textContent =
            question.explanation;


        buttons.forEach(btn => {

            btn.classList.add(
                "disabled"
            );

        });


        showNextButton();

        return;

    }



    /*
       WRONG ANSWER
       Lock the question immediately
       and reveal the correct answer.
    */

    answered = true;


    button.classList.add(
        "wrong"
    );


    buttons.forEach(btn => {

        btn.classList.add(
            "disabled"
        );


        if(
            btn.dataset.answer ===
            question.c
        ){

            btn.classList.add(
                "reveal"
            );

        }

    });


    document
        .getElementById("resultText")
        .textContent =
        "❌ Incorrect!";


    document
        .getElementById("resultText")
        .className =
        "result-message wrong-text";


    document
        .getElementById("explanation")
        .textContent =
        question.explanation;


    /*
       No point is awarded.
       The player cannot retry this question.
    */

    showNextButton();

}



/* ==========================================================
   SHOW NEXT BUTTON
========================================================== */

function showNextButton(){

    const nextBtn =
        document.getElementById(
            "nextBtn"
        );


    nextBtn.style.display =
        "inline-block";


    if(
        currentQuestion ===
        questions.length - 1
    ){

        nextBtn.textContent =
            "Finish 🎉";

    }else{

        nextBtn.textContent =
            "Next →";

    }

}



/* ==========================================================
   NEXT QUESTION
========================================================== */

function nextQuestion(){

    currentQuestion++;


    if(
        currentQuestion <
        questions.length
    ){

        loadQuestion();

    }else{

        finishGame();

    }

}



/* ==========================================================
   FINISH GAME
========================================================== */

function finishGame(){

    document
        .getElementById("game")
        .classList.remove(
            "active"
        );


    document
        .getElementById("final")
        .classList.add(
            "active"
        );


    document
        .getElementById("finalScore")
        .textContent =
        score +
        " / " +
        questions.length;


    const percent =
        Math.round(
            score /
            questions.length *
            100
        );


    let message;


    if(percent >= 90){

        message =
            "🏆 Excellent! You know your Vietnamese family vocabulary.";

    }else if(percent >= 70){

        message =
            "🎉 Good job! Keep practicing.";

    }else{

        message =
            "📚 Keep practicing your family vocabulary.";

    }


    document
        .getElementById("finalMessage")
        .textContent =
        message;

}



/* ==========================================================
   RESTART
========================================================== */

function restartGame(){

    startGame();

}



/* ==========================================================
   BACK TO LOBBY
========================================================== */

function backToLobby(){

    window.location.href =
        "../../category.html?category=People%20%26%20Pronouns";

}

</script>


</body>

</html>
