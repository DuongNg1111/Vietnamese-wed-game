<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Who Is This Person?</title>

<meta
    name="game-title"
    content="Who Is This Person?"
>

<meta
    name="game-description"
    content="Practice Vietnamese family vocabulary by identifying people in everyday situations."
>

<meta
    name="game-icon"
    content="👨‍👩‍👧‍👦"
>


<!-- ==========================================================
     GOOGLE FONT
========================================================== -->

<link
    href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap"
    rel="stylesheet"
>

<!-- =====================================================
     SUPABASE & ANALYTICS
====================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../../BACKEND/supabase.js"></script>

<script src="../../BACKEND/analytics.js"></script>

<style>

/* ==========================================================
   ROOT COLORS
========================================================== */

:root{

    --accent:#5F79B4;

    --accent-dark:#41588B;

    --accent-light:#eaf0fa;

    --accent-bg:#F2F6FC;

    --accent-border:#c3d4ef;

    --correct:#019b3f;

    --correct-light:#eaf3ff;

    --wrong:#d9536f;

    --wrong-light:#fff0f3;

    --ink: #143a6b;
    --ink-soft: #66809d;

    --muted:#7b8797;

    --general-border:#d9e0e8;

}


/* ==========================================================
   RESET
========================================================== */

*{

    box-sizing:border-box;

}


html{

    min-height:100%;

}


/* ==========================================================
   BODY
========================================================== */

body {

    min-height: 100vh;

    padding: 28px 20px 45px;

    font-family: Calibri, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

    color: var(--ink);

    display:flex;

    justify-content:center;

    align-items:center;

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            var(--accent-bg) 48%,
            var(--accent-light) 100%
        );

}


/* ==========================================================
   PAGE
========================================================== */

.page{

    width:min(900px,96vw);

    margin:0 auto;

}


/* ==========================================================
   BACK TO LOBBY
   OUTSIDE GAME CONTAINER
========================================================== */

.lobby-btn{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    margin-bottom:12px;

    padding:7px 13px;

    border:1px solid var(--accent-border);

    border-radius:8px;

    background:var(--accent-light);

    color:var(--accent-dark);

    font-family:Calibri, 'Segoe UI', sans-serif;

    font-size:20px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.lobby-btn:hover{

    background:#dfe8f7;

    transform:translateX(-2px);

}


/* ==========================================================
   CONTAINER
========================================================== */

.container{

    position:relative;

    width:100%;

    margin:0 auto;

    background:#ffffff;

    padding:35px 30px 30px;

    border-radius:20px;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.08);

}


/* ==========================================================
   TITLE
========================================================== */

.title{

    margin:0 0 6px;

    text-align:center;

    font-family:'Kalam', cursive;

    font-size:44px;

    font-weight:700;

    line-height:1.2;

    color:var(--ink);

}


.subtitle{

    margin:0 0 25px;

    text-align:center;

    color:var(--muted);

    font-family:Calibri, 'Segoe UI', sans-serif;

    font-size:21px;

    line-height:1.4;

}


/* ==========================================================
   GAME BOX
========================================================== */

.game-box{

    background:#ffffff;

    padding:25px;

    border-radius:15px;

    border:1px solid var(--general-border);

    text-align:center;

}


/* ==========================================================
   TOP BAR
========================================================== */

.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:15px;

    font-weight:bold;

}


.question-count{

    color:var(--muted);

    font-size:20px;

}


.score{

    color:var(--accent-dark);

    font-size:24px;

}


/* ==========================================================
   PROGRESS
========================================================== */

.progress-wrap{

    width:100%;

    height:9px;

    background:#e8edf3;

    border-radius:20px;

    overflow:hidden;

    margin-bottom:20px;

}


.progress{

    width:0%;

    height:100%;

    background:var(--accent);

    transition:.3s;

}


/* ==========================================================
   QUESTION CARD
========================================================== */

.card{

    position:relative;

    background:var(--accent-bg);

    border:1px solid var(--accent-border);

    border-radius:12px;

    padding:35px 25px;

    margin:20px 0;

    min-height:190px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    gap:12px;

    overflow:hidden;

}


/* Accent line */

.card::before{

    content:"";

    position:absolute;

    top:0;

    left:0;

    right:0;

    height:6px;

    background:var(--accent);

}


.question-label{

    color:var(--muted);

    font-size:22px;

    line-height:1.4;

}


.scenario{

    font-size:31px;

    font-weight:600;

    line-height:1.6;

    color:var(--ink);

}


/* ==========================================================
   OPTIONS
========================================================== */

.options{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

}


.option-btn{

    padding:17px;

    min-height:62px;

    font-family:Calibri, 'Segoe UI', sans-serif;

    font-size:27px;

    font-weight:bold;

    background:var(--accent);

    color:#ffffff;

    border:1px solid var(--accent);

    border-radius:9px;

    cursor:pointer;

    transition:.2s;

}


.option-btn:hover:not(.disabled){

    background:var(--accent-dark);

    border-color:var(--accent-dark);

    transform:translateY(-2px);

}


/* ==========================================================
   CORRECT
========================================================== */

.option-btn.correct{

    background:var(--correct);

    border-color:var(--correct);

    color:#ffffff;

}


/* ==========================================================
   WRONG
========================================================== */

.option-btn.wrong{

    background:var(--wrong);

    border-color:var(--wrong);

    color:#ffffff;

}


/* ==========================================================
   REVEAL CORRECT
========================================================== */

.option-btn.reveal{

    background:var(--correct);

    border-color:var(--correct);

    color:#ffffff;

    box-shadow:
        0 0 0 3px
        rgba(1,155,63,.12);

}


/* ==========================================================
   DISABLED
========================================================== */

.option-btn.disabled{

    pointer-events:none;

    cursor:default;

}


/* ==========================================================
   RESULT
========================================================== */

.result-message{

    min-height:40px;

    margin-top:20px;

    font-family:Calibri, 'Segoe UI', sans-serif;

    font-size:27px;

    font-weight:bold;

    line-height:1.4;

}


.correct-text{

    color:var(--correct);

}


.wrong-text{

    color:var(--wrong);

}


/* ==========================================================
   EXPLANATION
========================================================== */

.explanation{

    min-height:25px;

    margin-top:0;

    color:var(--muted);

    font-family:Calibri, 'Segoe UI', sans-serif;

    font-size:22px;

    line-height:1.5;

}


/* ==========================================================
   NEXT BUTTON
========================================================== */

.next-btn{

    padding:12px 28px;

    border:1px solid var(--accent-dark);

    border-radius:10px;

    background:var(--accent-dark);

    color:#ffffff;

    font-family:Calibri, 'Segoe UI', sans-serif;

    font-size:25px;

    font-weight:bold;

    cursor:pointer;

    margin-top:10px;

    transition:.2s;

}


.next-btn:hover{

    background:#344a78;

    border-color:#344a78;

    transform:translateY(-2px);

}


/* ==========================================================
   FINAL SCREEN
========================================================== */

#final{

    text-align:center;

    padding:30px 20px 40px;

}


#final h2{

    margin:0 0 15px;

    font-family:'Kalam', cursive;

    font-size:45px;

    color:var(--accent-dark);

}


.final-score{

    font-size:40px;

    margin:25px 0;

    font-weight:bold;

    color:var(--accent-dark);

}


.final-message{

    color:var(--muted);

    font-size:24px;

    line-height:1.6;

}


/* ==========================================================
   PLAY AGAIN
========================================================== */

.start-btn{

    margin-top:10px;

    padding:13px 30px;

    border:1px solid var(--accent-dark);

    border-radius:10px;

    background:var(--accent-dark);

    color:#ffffff;

    font-family:Calibri, 'Segoe UI', sans-serif;

    font-size:25px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.start-btn:hover{

    background:#344a78;

    border-color:#344a78;

    transform:translateY(-2px);

}


/* ==========================================================
   MOBILE
========================================================== */

@media(max-width:600px){

    body{

        padding:18px 10px 30px;

        align-items:flex-start;

    }


    .page{

        width:100%;

    }


    .lobby-btn{

        margin-bottom:10px;

        font-size:19px;

        padding:7px 11px;

    }


    .container{

        width:100%;

        padding:28px 15px 20px;

        border-radius:16px;

    }


    .title{

        font-size:36px;

    }


    .subtitle{

        font-size:19px;

        margin-bottom:20px;

    }


    .game-box{

        padding:18px;

    }


    .topbar{

        gap:10px;

    }


    .question-count{

        font-size:18px;

    }


    .score{

        font-size:22px;

    }


    .options{

        grid-template-columns:1fr;

    }


    .card{

        min-height:160px;

        padding:28px 15px;

    }


    .question-label{

        font-size:20px;

    }


    .scenario{

        font-size:28px;

    }


    .option-btn{

        font-size:25px;

        min-height:58px;

    }


    .result-message{

        font-size:24px;

    }


    .explanation{

        font-size:20px;

    }


    #final h2{

        font-size:40px;

    }


    .final-score{

        font-size:36px;

    }


    .final-message{

        font-size:22px;

    }

}

</style>

</head>


<body>


<div class="page">


<!-- ========================================================
     BACK TO LOBBY
========================================================= -->

<button
    class="lobby-btn"
    onclick="backToLobby()"
>

    ← Back

</button>



<!-- ========================================================
     MAIN CONTAINER
========================================================= -->

<div class="container">


<!-- ========================================================
     GAME
========================================================= -->

<div id="game">


    <h1 class="title">

        👨‍👩‍👧‍👦 Who Is This Person?

    </h1>


    <p class="subtitle">

        Choose the correct Vietnamese word.

    </p>



    <div class="game-box">


        <!-- ==================================================
             TOP BAR
        =================================================== -->

        <div class="topbar">


            <div class="question-count">

                Question

                <span id="questionNumber">
                    1
                </span>

                /

                <span id="totalQuestions">
                    10
                </span>

            </div>


            <div class="score">

                Score:

                <span id="score">
                    0
                </span>

            </div>


        </div>



        <!-- ==================================================
             PROGRESS
        =================================================== -->

        <div class="progress-wrap">

            <div
                class="progress"
                id="progress"
            ></div>

        </div>



        <!-- ==================================================
             QUESTION
        =================================================== -->

        <div class="card">


            <div class="question-label">

                Who is this person?

            </div>


            <div
                class="scenario"
                id="questionText"
            ></div>


        </div>



        <!-- ==================================================
             OPTIONS
        =================================================== -->

        <div
            class="options"
            id="optionsContainer"
        ></div>



        <!-- ==================================================
             RESULT
        =================================================== -->

        <div
            class="result-message"
            id="resultText"
        ></div>


        <div
            class="explanation"
            id="explanation"
        ></div>



        <!-- ==================================================
             NEXT
        =================================================== -->

        <button
            class="next-btn"
            id="nextBtn"
            onclick="nextQuestion()"
            style="display:none;"
        >

            Next →

        </button>


    </div>


</div>



<!-- ========================================================
     FINAL
========================================================= -->

<div
    id="final"
    style="display:none;"
>


    <h2>

        🎉 Game Complete!

    </h2>


    <p class="final-message">

        You completed the
        Who Is This Person? challenge.

    </p>


    <div class="final-score">

        Score:

        <span id="finalScore"></span>

    </div>


    <p
        class="final-message"
        id="finalMessage"
    ></p>


    <button
        class="start-btn"
        onclick="restartGame()"
    >

        Play Again

    </button>


</div>


</div>

</div>



<script>


/* ==========================================================
   QUESTION DATABASE
   ONLY VOCABULARY FROM THE FAMILY VOCAB LIST
========================================================== */

const database = [

    {
        q:
        "This person is your father's or mother's father.",

        a:[
            "ông",
            "bà",
            "ba",
            "chú"
        ],

        c:"ông",

        explanation:
        "Ông means grandfather / older man."
    },


    {
        q:
        "This person is your father's or mother's mother.",

        a:[
            "bà",
            "ông",
            "mẹ",
            "dì"
        ],

        c:"bà",

        explanation:
        "Bà means grandmother / older woman."
    },


    {
        q:
        "This person is your male parent.",

        a:[
            "ba",
            "mẹ",
            "chồng",
            "con"
        ],

        c:"ba",

        explanation:
        "Ba means father / dad."
    },


    {
        q:
        "This person is your female parent.",

        a:[
            "mẹ",
            "ba",
            "vợ",
            "bà"
        ],

        c:"mẹ",

        explanation:
        "Mẹ means mother / mom."
    },


    {
        q:
        "This person is your child, but the person is male.",

        a:[
            "con trai",
            "con gái",
            "em trai",
            "cháu trai"
        ],

        c:"con trai",

        explanation:
        "Con trai means son / boy."
    },


    {
        q:
        "This person is your child, but the person is female.",

        a:[
            "con gái",
            "con trai",
            "em gái",
            "cháu gái"
        ],

        c:"con gái",

        explanation:
        "Con gái means daughter / girl."
    },


    {
        q:
        "This person is your younger male sibling.",

        a:[
            "em trai",
            "em gái",
            "con trai",
            "anh"
        ],

        c:"em trai",

        explanation:
        "Em trai means younger brother."
    },


    {
        q:
        "This person is your younger female sibling.",

        a:[
            "em gái",
            "em trai",
            "con gái",
            "chị"
        ],

        c:"em gái",

        explanation:
        "Em gái means younger sister."
    },


    {
        q:
        "This person is your mother's younger sister.",

        a:[
            "dì",
            "chú",
            "bác",
            "chị"
        ],

        c:"dì",

        explanation:
        "Dì means maternal aunt."
    },


    {
        q:
        "This person is your father's younger brother.",

        a:[
            "chú",
            "dì",
            "bác",
            "anh"
        ],

        c:"chú",

        explanation:
        "Chú means paternal younger uncle."
    }

];



/* ==========================================================
   STATE
========================================================== */

let questions = [];

let currentQuestion = 0;

let score = 0;

let answered = false;



/* ==========================================================
   SHUFFLE
========================================================== */

function shuffle(array){

    const arr = [...array];


    for(
        let i = arr.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] = [
            arr[j],
            arr[i]
        ];

    }


    return arr;

}



/* ==========================================================
   START GAME
========================================================== */

function startGame(){

    questions =
        shuffle(database);


    currentQuestion = 0;

    score = 0;


    document
        .getElementById("game")
        .style.display =
        "block";


    document
        .getElementById("final")
        .style.display =
        "none";


    document
        .getElementById("score")
        .textContent =
        "0";


    document
        .getElementById("totalQuestions")
        .textContent =
        questions.length;


    loadQuestion();

}



/* ==========================================================
   LOAD QUESTION
========================================================== */

function loadQuestion(){

    answered = false;


    const question =
        questions[currentQuestion];


    document
        .getElementById("questionNumber")
        .textContent =
        currentQuestion + 1;


    document
        .getElementById("progress")
        .style.width =
        (
            currentQuestion /
            questions.length *
            100
        ) + "%";


    document
        .getElementById("questionText")
        .textContent =
        question.q;


    document
        .getElementById("resultText")
        .textContent =
        "";


    document
        .getElementById("resultText")
        .className =
        "result-message";


    document
        .getElementById("explanation")
        .textContent =
        "";


    document
        .getElementById("nextBtn")
        .style.display =
        "none";


    const container =
        document.getElementById(
            "optionsContainer"
        );


    container.innerHTML =
        "";


    const options =
        shuffle(question.a);


    options.forEach(option => {


        const btn =
            document.createElement(
                "button"
            );


        btn.className =
            "option-btn";


        btn.textContent =
            option;


        btn.dataset.answer =
            option;


        btn.onclick = () =>
            handleAnswer(
                btn,
                option
            );


        container.appendChild(btn);

    });

}



/* ==========================================================
   HANDLE ANSWER
========================================================== */

function handleAnswer(
    button,
    selected
){

    if(answered){

        return;

    }


    const question =
        questions[currentQuestion];


    const buttons =
        document.querySelectorAll(
            ".option-btn"
        );


    /* ======================================================
       CORRECT ANSWER
    ======================================================= */

    if(selected === question.c){

        answered = true;

        score++;


        button.classList.add(
            "correct"
        );


        document
            .getElementById("score")
            .textContent =
            score;


        document
            .getElementById("resultText")
            .textContent =
            "🎉 Correct!";


        document
            .getElementById("resultText")
            .className =
            "result-message correct-text";


        document
            .getElementById("explanation")
            .textContent =
            question.explanation;


        buttons.forEach(btn => {

            btn.classList.add(
                "disabled"
            );

        });


        showNextButton();

        return;

    }



    /* ======================================================
       WRONG ANSWER
    ======================================================= */

    answered = true;


    button.classList.add(
        "wrong"
    );


    buttons.forEach(btn => {

        btn.classList.add(
            "disabled"
        );


        if(
            btn.dataset.answer ===
            question.c
        ){

            btn.classList.add(
                "reveal"
            );

        }

    });


    document
        .getElementById("resultText")
        .textContent =
        "❌ Incorrect!";


    document
        .getElementById("resultText")
        .className =
        "result-message wrong-text";


    document
        .getElementById("explanation")
        .textContent =
        question.explanation;


    showNextButton();

}



/* ==========================================================
   SHOW NEXT BUTTON
========================================================== */

function showNextButton(){

    const nextBtn =
        document.getElementById(
            "nextBtn"
        );


    nextBtn.style.display =
        "inline-block";


    if(
        currentQuestion ===
        questions.length - 1
    ){

        nextBtn.textContent =
            "Finish 🎉";

    }
    else{

        nextBtn.textContent =
            "Next →";

    }

}



/* ==========================================================
   NEXT QUESTION
========================================================== */

function nextQuestion(){

    currentQuestion++;


    if(
        currentQuestion <
        questions.length
    ){

        loadQuestion();

    }
    else{

        finishGame();

    }

}



/* ==========================================================
   FINISH GAME
========================================================== */

function finishGame(){

    document
        .getElementById("game")
        .style.display =
        "none";


    document
        .getElementById("final")
        .style.display =
        "block";


    document
        .getElementById("progress")
        .style.width =
        "100%";


    document
        .getElementById("finalScore")
        .textContent =
        score +
        " / " +
        questions.length;


    const percent =
        Math.round(
            score /
            questions.length *
            100
        );


    let message;


    if(percent >= 90){

        message =
            "🏆 Excellent! You know your Vietnamese family vocabulary.";

    }
    else if(percent >= 70){

        message =
            "🎉 Good job! Keep practicing.";

    }
    else{

        message =
            "📚 Keep practicing your family vocabulary.";

    }


    document
        .getElementById("finalMessage")
        .textContent =
        message;


    if (
        typeof trackGameComplete ===
        "function"
    ) {
        trackGameComplete(
            "People - Game 4",
            score,
            questions.length
        );
    }

}


/* ==========================================================
   RESTART
========================================================== */

function restartGame(){

    startGame();

}



/* ==========================================================
   BACK TO LOBBY
========================================================== */

function backToLobby(){

    window.location.href =
        "../../category.html?category=People%20%26%20Pronouns";

}



/* ==========================================================
   START IMMEDIATELY
   NO INTRO SCREEN
========================================================== */

window.trackGameStart(
    "People - Game 4"
);

startGame();

</script>


</body>

</html>
