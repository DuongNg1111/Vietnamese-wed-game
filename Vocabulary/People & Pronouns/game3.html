<style>

/* ==========================================================
   VARIABLES
========================================================== */

:root{

    --accent:#5F79B4;

    --accent-dark:#41588B;

    --accent-light:#eaf0fa;

    --accent-bg:#F2F6FC;

    --accent-border:#c3d4ef;


    --correct:#019b3f;

    --correct-bg:#eaf3ff;


    --wrong:#d9536f;

    --wrong-bg:#fff0f3;


    --ink: #143a6b;
    --ink-soft: #66809d;

    --muted:#7f8c8d;

    --general-border:#d9e6f2;

}


/* ==========================================================
   RESET
========================================================== */

*{

    box-sizing:border-box;

}


/* ==========================================================
   BODY
========================================================== */

body {

    min-height: 100vh;

    padding: 28px 20px 45px;

    font-family: Calibri, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

    color: var(--ink);

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            var(--accent-bg) 48%,
            var(--accent-light) 100%
        );

}



/* ==========================================================
   PAGE
========================================================== */

.page{

    width:min(900px,96vw);

    margin:0 auto;

}


/* ==========================================================
   BACK BUTTON
========================================================== */

.lobby-btn{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    margin-bottom:14px;

    padding:8px 14px;

    border:1px solid var(--accent-border);

    border-radius:8px;

    background:#ffffff;

    color:var(--accent-dark);

    font-family:Calibri, sans-serif;

    font-size:22px;

    font-weight:bold;

    cursor:pointer;

    transition:
        background .2s,
        transform .2s;

}


.lobby-btn:hover{

    background:var(--accent-light);

    transform:translateX(-2px);

}


/* ==========================================================
   GAME CONTAINER
========================================================== */

.container{

    position:relative;

    width:100%;

    margin:0 auto;

    padding:32px 30px 30px;

    background:#ffffff;

    border:1px solid var(--general-border);

    border-radius:20px;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.08);

}


/* ==========================================================
   TITLE AREA
========================================================== */

.title-area{

    text-align:center;

    margin-bottom:24px;

}


.title{

    margin:0;

    font-family:'Kalam', cursive;

    font-size:42px;

    font-weight:700;

    line-height:1.25;

    color:var(--ink);

}


.subtitle{

    margin:8px 0 0;

    color:var(--muted);

    font-size:20px;

    line-height:1.5;

}


/* ==========================================================
   GAME BOX
========================================================== */

.game-box{

    background:#ffffff;

    padding:25px;

    border:1px solid var(--general-border);

    border-radius:15px;

    text-align:center;

}


/* ==========================================================
   TOP BAR
========================================================== */

.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:15px;

    font-weight:bold;

}


.question-count{

    color:var(--muted);

    font-size:20px;

}


.score{

    color:var(--accent-dark);

    font-size:27px;

}


/* ==========================================================
   PROGRESS
========================================================== */

.progress-wrap{

    width:100%;

    height:9px;

    background:var(--accent-light);

    border-radius:20px;

    overflow:hidden;

    margin-bottom:20px;

}


.progress{

    width:0%;

    height:100%;

    background:var(--accent);

    transition:.3s;

}


/* ==========================================================
   QUESTION CARD
========================================================== */

.card{

    position:relative;

    overflow:hidden;

    background:var(--accent-bg);

    border:1px solid var(--accent-border);

    border-radius:12px;

    padding:35px 25px;

    margin:20px 0;

    min-height:190px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    gap:14px;

}


/* Accent line */

.card::before{

    content:"";

    position:absolute;

    top:0;

    left:0;

    width:100%;

    height:6px;

    background:var(--accent);

}


.scenario{

    color:var(--muted);

    font-size:24px;

    line-height:1.5;

}


.statement{

    font-size:34px;

    font-weight:700;

    color:var(--ink);

    line-height:1.45;

}


/* ==========================================================
   TRUE / FALSE OPTIONS
========================================================== */

.options{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:12px;

}


.option-btn{

    padding:17px;

    min-height:64px;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:27px;

    font-weight:bold;

    background:#ffffff;

    color:var(--accent-dark);

    border:1px solid var(--general-border);

    border-radius:10px;

    cursor:pointer;

    transition:.2s;

}

.true-btn,
.false-btn{

    background:var(--accent);

    color:#ffffff;

    border-color:var(--accent);

}


.true-btn:hover:not(:disabled),
.false-btn:hover:not(:disabled){

    background:var(--accent-dark);

    border-color:var(--accent-dark);

    transform:translateY(-2px);

}


.option-btn.correct{

    background:var(--correct-bg);

    color:var(--correct);

    border-color:var(--correct);

}


.option-btn.wrong{

    background:var(--wrong-bg);

    color:var(--wrong);

    border-color:var(--wrong);

}


.option-btn:disabled{

    cursor:default;

}


/* ==========================================================
   RESULT
========================================================== */

.result-message{

    min-height:40px;

    margin-top:20px;

    font-size:28px;

    font-weight:bold;

    line-height:1.5;

}


.correct-text{

    color:var(--correct);

}


.wrong-text{

    color:var(--wrong);

}


/* ==========================================================
   EXPLANATION
========================================================== */

.explanation{

    margin-top:18px;

    padding:16px 18px;

    background:var(--accent-light);

    border-left:5px solid var(--accent);

    border-radius:10px;

    color:#3d5066;

    text-align:left;

    font-size:24px;

    line-height:1.6;

}


.explanation strong{

    color:var(--accent-dark);

}


/* ==========================================================
   NEXT BUTTON
========================================================== */

.next-btn{

    padding:12px 28px;

    border:1px solid var(--accent);

    border-radius:10px;

    background:var(--accent);

    color:#ffffff;

    font-family:Calibri, sans-serif;

    font-size:27px;

    font-weight:bold;

    cursor:pointer;

    margin-top:18px;

    transition:.2s;

}


.next-btn:hover{

    background:var(--accent-dark);

    border-color:var(--accent-dark);

    transform:translateY(-2px);

}


/* ==========================================================
   FINAL SCREEN
========================================================== */

#final{

    text-align:center;

    padding:30px 20px 40px;

}


#final h2{

    margin:0 0 15px;

    font-family:'Kalam', cursive;

    font-size:45px;

    color:var(--accent-dark);

}


.final-score{

    font-size:40px;

    margin:25px 0;

    font-weight:bold;

    color:var(--accent);

}


.final-message{

    color:var(--muted);

    font-size:26px;

    line-height:1.6;

}


.play-again-btn{

    margin-top:10px;

    padding:14px 35px;

    border:1px solid var(--accent);

    border-radius:12px;

    background:var(--accent);

    color:#ffffff;

    font-family:Calibri, sans-serif;

    font-size:28px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.play-again-btn:hover{

    background:var(--accent-dark);

    border-color:var(--accent-dark);

    transform:translateY(-2px);

}


/* ==========================================================
   MOBILE
========================================================== */

@media(max-width:600px){

    body{

        padding:
            18px 10px 30px;

    }


    .page{

        width:100%;

    }


    .container{

        padding:
            25px 15px 20px;

        border-radius:16px;

    }


    .lobby-btn{

        font-size:21px;

        padding:7px 12px;

        margin-bottom:12px;

    }


    .title-area{

        margin-bottom:20px;

    }


    .title{

        font-size:36px;

    }


    .subtitle{

        font-size:18px;

    }


    .game-box{

        padding:18px;

    }


    .topbar{

        margin-bottom:14px;

    }


    .question-count{

        font-size:18px;

    }


    .score{

        font-size:25px;

    }


    .options{

        grid-template-columns:1fr;

    }


    .card{

        min-height:170px;

        padding:
            30px 15px 25px;

    }


    .scenario{

        font-size:22px;

    }


    .statement{

        font-size:29px;

    }


    .option-btn{

        font-size:26px;

        min-height:58px;

    }


    .result-message{

        font-size:25px;

    }


    .explanation{

        font-size:22px;

    }


    #final{

        padding:
            25px 10px 35px;

    }


    #final h2{

        font-size:40px;

    }


    .final-score{

        font-size:36px;

    }


    .final-message{

        font-size:23px;

    }

}

</style>

</head>

<div

>


    <!-- TITLE -->

    <div class="title-area">

        </h1>

                <span id="totalQuestions">

            ></div>

        <div class="options">

                class="option-btn true-btn"
                id="trueBtn"
                onclick="handleAnswer(true)"
            >

                onclick="handleAnswer(false)"
            >

     FINAL

<div
    id="final"

>


    <h2>

        🎉 Game Complete!

    </h2>


    <p class="final-message">

        Vietnamese People & Pronouns True or False challenge.

    </p>


    <div class="final-score">

        Score:

        <span id="finalScore"></span>

    </div>


    <p
        class="final-message"
        id="finalMessage"

    <button

    >

        Play Again

</div>


</div>

<script>


/* ==========================================================
   QUESTION DATABASE
========================================================== */

const database = [

    {
        scenario:
        "In Vietnamese, you want to say “family.”",

        statement:
        "The word is “gia đình.”",

        answer:true,

        explanation:
        "Gia đình means “family.”"
    },


    {
        scenario:
        "You want to say “person” or “people.”",

        statement:
        "The word is “người.”",

        answer:true,

        explanation:
        "Người means “person” or “people.”"
    },


    {
        scenario:
        "You want to say “father” in Vietnamese.",

        statement:
        "The word is “ba.”",

        answer:true,

        explanation:
        "Ba means “father” and is very common in Southern Vietnamese."
    },


    {
        scenario:
        "You want to say “mother” in Vietnamese.",

        statement:
        "The word is “mẹ.”",

        answer:true,

        explanation:
        "Mẹ means “mother.”"
    },


    {
        scenario:
        "You want to say “wife.”",

        statement:
        "The word is “chồng.”",

        answer:false,

        explanation:
        "Chồng means “husband.” Vợ means “wife.”"
    },


    {
        scenario:
        "You want to say “husband.”",

        statement:
        "The word is “chồng.”",

        answer:true,

        explanation:
        "Chồng means “husband.”"
    },


    {
        scenario:
        "You want to say “son” or “boy.”",

        statement:
        "The expression is “con trai.”",

        answer:true,

        explanation:
        "Con trai means “son” or “boy.”"
    },


    {
        scenario:
        "You want to say “daughter” or “girl.”",

        statement:
        "The expression is “con gái.”",

        answer:true,

        explanation:
        "Con gái means “daughter” or “girl.”"
    },


    {
        scenario:
        "You are talking about a younger brother.",

        statement:
        "You can say “em trai.”",

        answer:true,

        explanation:
        "Em trai means “younger brother.”"
    },


    {
        scenario:
        "You are talking about a younger sister.",

        statement:
        "You can say “em gái.”",

        answer:true,

        explanation:
        "Em gái means “younger sister.”"
    },


    {
        scenario:
        "You meet a man from the grandparents' generation.",

        statement:
        "You can call him “ông.”",

        answer:true,

        explanation:
        "Ông is commonly used for a grandfather or an older man in the grandparents' generation."
    },


    {
        scenario:
        "You meet a woman from the grandparents' generation.",

        statement:
        "You can call her “bà.”",

        answer:true,

        explanation:
        "Bà is commonly used for a grandmother or an older woman in the grandparents' generation."
    },


    {
        scenario:
        "You meet your mother's younger brother.",

        statement:
        "You call him “chú.”",

        answer:false,

        explanation:
        "For a mother's younger brother, the usual term is Cậu. Chú is normally used for a father's younger brother."
    },


    {
        scenario:
        "You meet your father's younger brother.",

        statement:
        "You can call him “chú.”",

        answer:true,

        explanation:
        "Chú is commonly used for a father's younger brother."
    },


    {
        scenario:
        "You meet your mother's younger sister.",

        statement:
        "You can call her “dì.”",

        answer:true,

        explanation:
        "Dì is commonly used for a mother's sister, especially a younger maternal aunt."
    },


    {
        scenario:
        "You meet an older aunt or uncle from the parents' generation.",

        statement:
        "You can call them “bác.”",

        answer:true,

        explanation:
        "Bác is used for an older person in the parents' generation, including an older aunt or uncle."
    },


    {
        scenario:
        "You talk to a man of your generation who is older than you.",

        statement:
        "You can call him “anh.”",

        answer:true,

        explanation:
        "Anh is commonly used for an older male in your generation."
    },


    {
        scenario:
        "You talk to a woman of your generation who is older than you.",

        statement:
        "You can call her “chị.”",

        answer:true,

        explanation:
        "Chị is commonly used for an older female in your generation."
    },


    {
        scenario:
        "You talk to someone younger than you in your generation.",

        statement:
        "You can call them “em.”",

        answer:true,

        explanation:
        "Em is commonly used for someone younger than you."
    },


    {
        scenario:
        "You talk to a child from a younger generation.",

        statement:
        "You can call the child “cháu.”",

        answer:true,

        explanation:
        "Cháu can be used for someone from a younger generation, such as a niece, nephew, or grandchild."
    }

];


/* ==========================================================
   STATE
========================================================== */

let questions = [];

let currentQuestion = 0;

let score = 0;

let answered = false;


/* ==========================================================
   DOM
========================================================== */

const game =
    document.getElementById("game");


const final =
    document.getElementById("final");


const questionNumber =
    document.getElementById("questionNumber");


const totalQuestions =
    document.getElementById("totalQuestions");


const scoreElement =
    document.getElementById("score");


const progress =
    document.getElementById("progress");


const scenarioElement =
    document.getElementById("scenario");


const statementElement =
    document.getElementById("statement");


const trueBtn =
    document.getElementById("trueBtn");


const falseBtn =
    document.getElementById("falseBtn");


const resultText =
    document.getElementById("resultText");


const explanation =
    document.getElementById("explanation");


const nextBtn =
    document.getElementById("nextBtn");


const finalScore =
    document.getElementById("finalScore");


const finalMessage =
    document.getElementById("finalMessage");


/* ==========================================================
   SHUFFLE
========================================================== */

function shuffle(array){

    const arr = [...array];


    for(
        let i = arr.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] = [
            arr[j],
            arr[i]
        ];

    }


    return arr;

}


/* ==========================================================
   START GAME
========================================================== */

function startGame(){

    questions =
        shuffle(database);


    currentQuestion = 0;

    score = 0;


    game.style.display =
        "block";


    final.style.display =
        "none";


    scoreElement.textContent =
        "0";


    totalQuestions.textContent =
        questions.length;


    loadQuestion();

}


/* ==========================================================
   LOAD QUESTION
========================================================== */

function loadQuestion(){

    answered = false;


    const question =
        questions[currentQuestion];


    questionNumber.textContent =
        currentQuestion + 1;


    progress.style.width =
        (
            currentQuestion /
            questions.length *
            100
        ) + "%";


    scenarioElement.textContent =
        question.scenario;


    statementElement.textContent =
        question.statement;


    resultText.textContent =
        "";


    resultText.className =
        "result-message";


    explanation.innerHTML =
        "";


    explanation.style.display =
        "none";


    nextBtn.style.display =
        "none";


    nextBtn.textContent =
        "Next →";


    trueBtn.className =
        "option-btn true-btn";


    falseBtn.className =
        "option-btn false-btn";


    trueBtn.disabled =
        false;


    falseBtn.disabled =
        false;

}


/* ==========================================================
   HANDLE ANSWER
========================================================== */

function handleAnswer(selected){

    if(answered){

        return;

    }


    answered = true;


    const question =
        questions[currentQuestion];


    const selectedButton =
        selected
            ? trueBtn
            : falseBtn;


    const correctButton =
        question.answer
            ? trueBtn
            : falseBtn;


    const isCorrect =
        selected === question.answer;


    /*
     * Lock both buttons immediately.
     */

    trueBtn.disabled =
        true;


    falseBtn.disabled =
        true;


    /*
     * CORRECT
     */

    if(isCorrect){

        score++;


        selectedButton.classList.add(
            "correct"
        );


        scoreElement.textContent =
            score;


        resultText.textContent =
            "🎉 Correct!";


        resultText.className =
            "result-message correct-text";

    }


    /*
     * WRONG
     */

    else{

        selectedButton.classList.add(
            "wrong"
        );


        correctButton.classList.add(
            "correct"
        );


        resultText.textContent =
            "❌ Incorrect";


        resultText.className =
            "result-message wrong-text";

    }


    /*
     * Show explanation.
     */

    explanation.innerHTML = `

        <strong>💡 Learn:</strong>

        <br><br>

        ${question.explanation}

    `;


    explanation.style.display =
        "block";


    /*
     * Show next button.
     */

    nextBtn.style.display =
        "inline-block";


    if(
        currentQuestion ===
        questions.length - 1
    ){

        nextBtn.textContent =
            "Finish 🎉";

    }
    else{

        nextBtn.textContent =
            "Next →";

    }

}


/* ==========================================================
   NEXT QUESTION
========================================================== */

function nextQuestion(){

    currentQuestion++;


    if(
        currentQuestion <
        questions.length
    ){

        loadQuestion();

    }
    else{

        finishGame();

    }

}


/* ==========================================================
   FINISH GAME
========================================================== */

function finishGame(){

    game.style.display =
        "none";


    final.style.display =
        "block";


    progress.style.width =
        "100%";


    finalScore.textContent =
        score +
        " / " +
        questions.length;


    const percent =
        Math.round(
            score /
            questions.length *
            100
        );


    let message;


    if(
        percent === 100
    ){

        message =
            "🏆 Perfect! You really understand Vietnamese people and pronouns.";

    }

    else if(
        percent >= 90
    ){

        message =
            "🌟 Excellent! You have a strong understanding of Vietnamese people and pronouns.";

    }

    else if(
        percent >= 70
    ){

        message =
            "👏 Good job! Keep practicing Vietnamese people and family vocabulary.";

    }

    else if(
        percent >= 50
    ){

        message =
