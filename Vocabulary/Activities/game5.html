/* ==========================================================

========================================================== */

const TOTAL_QUESTIONS =

/* ==========================================================
   GAME STATE
========================================================== */

let questions =

let currentQuestion =
    0;

let score =
    0;

let answered =

/* ==========================================================

========================================================== */

const questionNumber =
    document.getElementById(

    );


const answers =

/* ==========================================================
   SHUFFLE
========================================================== */

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }


    return array;

}


/* ==========================================================
   GET RANDOM ITEM
========================================================== */

function randomItem(array) {

    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];

}


/* ==========================================================
   GET THREE DIFFERENT CATEGORY WORDS
========================================================== */

function getDistractors() {

    const shuffled =
        shuffle(
            [...OTHER_WORDS]
        );


    const selected =
        [];


    const categories =
        new Set();


    for (
        const word of shuffled
    ) {

        if (
            !categories.has(
                word.category
            )
        ) {

            selected.push(
                word
            );

            categories.add(
                word.category
            );

        }


        if (
            selected.length === 3
        ) {

            break;

        }

    }


    return selected;

}


/* ==========================================================
   GENERATE QUESTIONS
========================================================== */

function generateQuestions() {

    questions = [];


    const usedActivities =
        [];


    while (
        questions.length <
        TOTAL_QUESTIONS
    ) {

        const activity =
            randomItem(
                ACTIVITIES
            );


        /*
         * Avoid repeating the same activity
         * until the whole vocabulary has been used.
         */

        if (
            usedActivities.includes(
                activity.text
            )
        ) {

            continue;

        }


        usedActivities.push(
            activity.text
        );


        const distractors =
            getDistractors();


        const options = [

            {
                ...activity,
                isActivity:
                    true
            },

            ...distractors.map(
                word => ({

                    ...word,

                    isActivity:
                        false

                })
            )

        ];


        shuffle(
            options
        );


        questions.push({

            options:
                options,

            correct:
                activity

        });

    }

}


/* ==========================================================
   START GAME
========================================================== */

function startGame() {

    generateQuestions();


    currentQuestion =
        0;


    score =
        0;


    gameScreen.classList.remove(
        "hidden"
    );


    resultScreen.classList.add(
        "hidden"
    );


    loadQuestion();

}


/* ==========================================================
   LOAD QUESTION
========================================================== */

function loadQuestion() {

    answered =
        false;


    message.textContent =
        "";


    message.className =
        "message";


    explanations.classList.add(
        "hidden"
    );


    explanationList.innerHTML =
        "";


    nextBtn.classList.add(
        "hidden"
    );


    const question =
        questions[
            currentQuestion
        ];


    questionNumber.textContent =
        `Question ${
            currentQuestion + 1
        } / ${
            TOTAL_QUESTIONS
        }`;


    answers.innerHTML =
        "";


    question.options.forEach(
        (option, index) => {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "answer-btn";


            button.textContent =
                option.text;


            button.dataset.index =
                index;


            button.addEventListener(
                "click",
                () =>
                    handleAnswer(
                        button,
                        option
                    )
            );


            answers.appendChild(
                button
            );

        }
    );

}


/* ==========================================================
   HANDLE ANSWER
========================================================== */

function handleAnswer(
    selectedButton,
    selectedOption
) {

    if (
        answered
    ) {

        return;

    }


    answered =
        true;


    const question =
        questions[
            currentQuestion
        ];


    const buttons =
        document.querySelectorAll(
            ".answer-btn"
        );


    /*
     * Lock every answer.
     */

    buttons.forEach(
        button => {

            button.classList.add(
                "disabled"
            );

        }
    );


    /*
     * Find the correct answer.
     */

    const correctIndex =
        question.options.findIndex(
            option =>
                option.isActivity ===
                true
        );


    /*
     * Highlight correct answer.
     */

    buttons[
        correctIndex
    ].classList.add(
        "correct"
    );


    /*
     * Check selected answer.
     */

    if (
        selectedOption.isActivity
    ) {

        score++;


        message.textContent =
            "✓ Correct!";

        message.classList.add(
            "correct-text"
        );

    }

    else {

        selectedButton.classList.add(
            "wrong"
        );


        message.textContent =
            "✕ Wrong!";

        message.classList.add(
            "wrong-text"
        );

    }


    showExplanations(
        question
    );


    nextBtn.classList.remove(
        "hidden"
    );


    if (
        currentQuestion ===
        TOTAL_QUESTIONS - 1
    ) {

        nextBtn.textContent =
            "Finish";

    }

    else {

        nextBtn.textContent =
            "Next Question →";

    }

}


/* ==========================================================
   SHOW EXPLANATIONS
========================================================== */

function showExplanations(
    question
) {

    explanationList.innerHTML =
        "";


    question.options.forEach(
        option => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "explanation-item";


            const icon =
                document.createElement(
                    "div"
                );


            icon.className =
                "explanation-icon";


            const content =
                document.createElement(
                    "div"
                );


            const word =
                document.createElement(
                    "div"
                );


            word.className =
                "explanation-word";


            word.textContent =
                `${option.text} — ${option.english}`;


            const text =
                document.createElement(
                    "div"
                );


            text.className =
                "explanation-text";


            if (
                option.isActivity
            ) {

                icon.textContent =
                    "✓";


                text.textContent =
                    "This is an activity.";

            }

            else {

                icon.textContent =
                    "•";


                text.textContent =
                    `This word belongs to ${option.category}, not the Activity category.`;

            }


            content.appendChild(
                word
            );


            content.appendChild(
                text
            );


            item.appendChild(
                icon
            );


            item.appendChild(
                content
            );


            explanationList.appendChild(
                item
            );

        }
    );


    explanations.classList.remove(
        "hidden"
    );

}


/* ==========================================================
   NEXT QUESTION
========================================================== */

nextBtn.addEventListener(
    "click",
    () => {

        currentQuestion++;


        if (
            currentQuestion >=
            TOTAL_QUESTIONS
        ) {

            showResults();

        }

        else {

            loadQuestion();

        }

    }
);


/* ==========================================================
   SHOW RESULTS
========================================================== */

function showResults() {

    gameScreen.classList.add(
        "hidden"
    );


    resultScreen.classList.remove(
        "hidden"
    );


    scoreText.textContent =
        `${score} / ${TOTAL_QUESTIONS}`;


    if (
        score ===
        TOTAL_QUESTIONS
    ) {

        performance.textContent =
            "Perfect! 🎯";

    }

    else if (
        score >= 16
    ) {

        performance.textContent =
            "Excellent!";

    }

    else if (
        score >= 12
    ) {

        performance.textContent =
            "Good Job!";

    }

    else {

        performance.textContent =
            "Keep Practicing!";

    }

}


/* ==========================================================
   PLAY AGAIN
========================================================== */

playAgain.addEventListener(
    "click",
    startGame
);


/* ==========================================================
   INITIALIZE
========================================================== */

startGame();

</script>
