<script>

/* ==========================================================
   ACTIVITY VOCABULARY
========================================================== */

const ACTIVITIES = [

    {
        text:
            "chơi game",

        english:
            "play games",

        image:
            "images/choi-game.png",

        explanation:
            "Chơi game means “play games.” The picture shows someone playing a game."
    },

    {
        text:
            "chụp hình",

        english:
            "take photos",

        image:
            "images/chup-hinh.png",

        explanation:
            "Chụp hình means “take photos.” The person is using a camera or phone to take a picture."
    },

    {
        text:
            "đi biển",

        english:
            "go to the beach",

        image:
            "images/di-bien.png",

        explanation:
            "Đi biển means “go to the beach.” The picture shows someone at the beach."
    },

    {
        text:
            "đi công tác",

        english:
            "go on a business trip",

        image:
            "images/di-cong-tac.png",

        explanation:
            "Đi công tác means “go on a business trip.” The person is traveling for work."
    },

    {
        text:
            "đi học",

        english:
            "go to school",

        image:
            "images/di-hoc.png",

        explanation:
            "Đi học means “go to school.” The picture shows someone going to school."
    },

    {
        text:
            "đi làm",

        english:
            "go to work",

        explanation:

    },

    {
        text:
            "du lịch",

        english:
            "travel",

        image:
            "images/du-lich.png",

        explanation:
            "Du lịch means “travel.” The picture shows someone traveling and exploring a place."
    },

    {
        text:
            "học ngoại ngữ",

        english:
            "learn a foreign language",

        image:
            "images/hoc-ngoai-ngu.png",

        explanation:
            "Học ngoại ngữ means “learn a foreign language.” The person is studying another language."
    },

    {
        text:
            "họp",

        english:
            "have a meeting",

        image:
            "images/hop.png",

        explanation:
            "Họp means “have a meeting.” The picture shows people having a meeting."
    },

    {
        text:
            "làm việc",

        english:
            "work",

        image:
            "images/lam-viec.png",

        explanation:
            "Làm việc means “work.” The person is working."
    },

    {
        text:
            "mua sắm",

        english:
            "go shopping",

        image:
            "images/mua-sam.png",

        explanation:
            "Mua sắm means “go shopping.” The person is shopping for things."
    },

    {
        text:
            "nấu ăn",

        english:
            "cook",

        image:
            "images/nau-an.png",

        explanation:
            "Nấu ăn means “cook.” The person is preparing food."
    },

    {
        text:
            "nghe nhạc",

        english:
            "listen to music",

        image:
            "images/nghe-nhac.png",

        explanation:
            "Nghe nhạc means “listen to music.” The person is listening to music."
    },

    {
        text:
            "ngủ",

        english:
            "sleep",

        image:
            "images/ngu.png",

        explanation:
            "Ngủ means “sleep.” The person is sleeping."
    },

    {
        text:
            "nhắn tin",

        english:
            "text / send messages",

        image:
            "images/nhan-tin.png",

        explanation:
            "Nhắn tin means “text” or “send messages.” The person is using a phone to send a message."
    },

    {
        text:
            "tập thể dục",

        english:
            "exercise / work out",

        image:
            "images/tap-the-duc.png",

        explanation:
            "Tập thể dục means “exercise” or “work out.” The person is exercising."
    },

    {
        text:
            "xem phim",

        english:
            "watch a movie",

        image:
            "images/xem-phim.png",

        explanation:
            "Xem phim means “watch a movie.” The person is watching a movie."
    }

];


/* ==========================================================
   GAME SETTINGS
========================================================== */

const TOTAL_QUESTIONS =
    20;


/* ==========================================================
   GAME STATE
========================================================== */

let questions =
    [];

let currentQuestion =
    0;

let score =
    0;

let answered =
    false;


/* ==========================================================
   DOM ELEMENTS
========================================================== */

const questionNumber =
    document.getElementById(
        "questionNumber"
    );


const activityImage =
    document.getElementById(
        "activityImage"
    );


const answers =
    document.getElementById(
        "answers"
    );


const message =
    document.getElementById(
        "message"
    );


const explanation =
    document.getElementById(
        "explanation"
    );


const nextBtn =
    document.getElementById(
        "nextBtn"
    );


const gameScreen =
    document.getElementById(
        "gameScreen"
    );


const resultScreen =
    document.getElementById(
        "resultScreen"
    );


const scoreText =
    document.getElementById(
        "scoreText"
    );


const performance =
    document.getElementById(
        "performance"
    );


const playAgain =
    document.getElementById(
        "playAgain"
    );


/* ==========================================================
   RANDOM INDEX
========================================================== */

function randomIndex(max) {

    return Math.floor(
        Math.random() * max
    );

}


/* ==========================================================
   SHUFFLE
========================================================== */

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }


    return array;

}


/* ==========================================================
   CREATE UNIQUE QUESTION ACTIVITIES
========================================================== */

function getQuestionActivities() {

    const pool =
        shuffle(
            [
                ...ACTIVITIES
            ]
        );


    /*
     * Use all 17 activities once,
     * then add 3 random activities
     * to make 20 questions.
     */

    const extra =
        shuffle(
            [
                ...ACTIVITIES
            ]
        ).slice(
            0,
            TOTAL_QUESTIONS -
            ACTIVITIES.length
        );


    return [
        ...pool,
        ...extra
    ];

}


/* ==========================================================
   GET WRONG ANSWER
========================================================== */

function getWrongAnswer(
    correct
) {

    /*
     * Try to choose an answer
     * that is visually and semantically
     * different from the correct activity.
     */

    let candidates =
        ACTIVITIES.filter(
            activity =>
                activity.text !==
                correct.text
        );


    /*
     * Avoid activities that are
     * especially close in meaning.
     */

    const avoidPairs = {

        "đi học":
            [
                "học ngoại ngữ"
            ],

        "học ngoại ngữ":
            [
                "đi học"
            ],

        "đi làm":
            [
                "làm việc"
            ],

        "làm việc":
            [
                "đi làm"
            ],

        "đi biển":
            [
                "du lịch"
            ],

        "du lịch":
            [
                "đi biển"
            ]

    };


    if (
        avoidPairs[
            correct.text
        ]
    ) {

        candidates =
            candidates.filter(
                activity =>
                    !avoidPairs[
                        correct.text
                    ].includes(
                        activity.text
                    )
            );

    }


    return candidates[
        randomIndex(
            candidates.length
        )
    ];

}


/* ==========================================================
   GENERATE QUESTIONS
========================================================== */

function generateQuestions() {

    questions =
        [];


    const activityPool =
        getQuestionActivities();


    activityPool.forEach(
        correct => {

            const wrong =
                getWrongAnswer(
                    correct
                );


            const options = [

                correct,

                wrong

            ];


            shuffle(
                options
            );


            questions.push({

                correct:
                    correct,

                options:
                    options

            });

        }
    );

}


/* ==========================================================
   START GAME
========================================================== */

function startGame() {

    generateQuestions();


    currentQuestion =
        0;


    score =
        0;


    gameScreen.classList.remove(
        "hidden"
    );


    resultScreen.classList.add(
        "hidden"
    );


    loadQuestion();

}


/* ==========================================================
   LOAD QUESTION
========================================================== */

function loadQuestion() {

    answered =
        false;


    message.textContent =
        "";


    message.className =
        "message";


    explanation.textContent =
        "";


    explanation.classList.add(
        "hidden"
    );


    nextBtn.classList.add(
        "hidden"
    );


    const question =
        questions[
            currentQuestion
        ];


    questionNumber.textContent =
        `Question ${
            currentQuestion + 1
        } / ${
            TOTAL_QUESTIONS
        }`;


    activityImage.src =
        question.correct.image;


    activityImage.alt =
        question.correct.english;


    answers.innerHTML =
        "";


    question.options.forEach(
        option => {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "answer-btn";


            button.textContent =
                option.text;


            button.dataset.correct =
                (
                    option.text ===
                    question.correct.text
                );


            button.addEventListener(
                "click",
                () =>
                    handleAnswer(
                        button
                    )
            );


            answers.appendChild(
                button
            );

        }
    );

}


/* ==========================================================
   HANDLE ANSWER
========================================================== */

function handleAnswer(
    selected
) {

    if (
        answered
    ) {

        return;

    }


    answered =
        true;


    const question =
        questions[
            currentQuestion
        ];


    const buttons =
        document.querySelectorAll(
            ".answer-btn"
        );


    buttons.forEach(
        button => {

            button.classList.add(
                "disabled"
            );


            button.disabled =
                true;

        }
    );


    const correctButton =
        [
            ...buttons
        ].find(
            button =>
                button.dataset.correct ===
                "true"
        );


    if (
        selected.dataset.correct ===
        "true"
    ) {

        score++;


        selected.classList.add(
            "correct"
        );


        message.textContent =
            "✓ Correct!";


        message.classList.add(
            "correct-text"
        );

    }

    else {

        selected.classList.add(
            "wrong"
        );


        correctButton.classList.add(
            "correct"
        );


        message.textContent =
            "✕ Wrong!";


        message.classList.add(
            "wrong-text"
        );

    }


    /*
     * Always show explanation
     * after the answer is checked.
     */

    explanation.innerHTML =
        `<strong>${
            question.correct.text
        }</strong> — ${
            question.correct.english
        }.<br>${
            question.correct.explanation
        }`;


    explanation.classList.remove(
        "hidden"
    );


    nextBtn.classList.remove(
        "hidden"
    );


    if (
        currentQuestion ===
        TOTAL_QUESTIONS - 1
    ) {

        nextBtn.textContent =
            "Finish";

    }

    else {

        nextBtn.textContent =
            "Next Question →";

    }

}


/* ==========================================================
   NEXT QUESTION
========================================================== */

nextBtn.addEventListener(
    "click",
    () => {

        currentQuestion++;


        if (
            currentQuestion >=
            TOTAL_QUESTIONS
        ) {

            showResults();

        }

        else {

            loadQuestion();

        }

    }
);


/* ==========================================================
   SHOW RESULTS
========================================================== */

function showResults() {

    gameScreen.classList.add(
        "hidden"
    );


    resultScreen.classList.remove(
        "hidden"
    );


    scoreText.textContent =
        `${score} / ${TOTAL_QUESTIONS}`;


    if (
        score ===
        TOTAL_QUESTIONS
    ) {

        performance.textContent =
            "Perfect! 🎯";

    }

    else if (
        score >= 16
    ) {

        performance.textContent =
            "Excellent!";

    }

    else if (
        score >= 12
    ) {

        performance.textContent =
            "Good Job!";

    }

    else {

        performance.textContent =
            "Keep Practicing!";

    }

}


/* ==========================================================
   PLAY AGAIN
========================================================== */

playAgain.addEventListener(
    "click",
    startGame
);


/* ==========================================================
   INITIALIZE
========================================================== */

startGame();

</script>
