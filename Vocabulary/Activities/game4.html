            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }


    return array;

}


/* =========================================================
   GENERATE QUESTIONS
========================================================= */

function generateQuestions() {

    const shuffled =
        shuffle(
            [
                ...QUESTION_BANK
            ]
        );


    questions =
        shuffled.slice(
            0,
            TOTAL_QUESTIONS
        );

}


/* =========================================================
   START GAME
========================================================= */

function startGame() {

    generateQuestions();


    currentQuestion =
        0;


    score =
        0;


    gameScreen.classList.remove(
        "hidden"
    );


    resultScreen.classList.add(
        "hidden"
    );


    loadQuestion();

}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion() {

    answered =
        false;


    message.textContent =
        "";

    message.className =
        "message";


    explanation.textContent =
        "";


    nextBtn.classList.add(
        "hidden"
    );


    nextBtn.textContent =
        "";


    const question =
        questions[
            currentQuestion
        ];


    questionNumber.textContent =
        `Question ${
            currentQuestion + 1
        } / ${
            TOTAL_QUESTIONS
        }`;


    description.textContent =
        question.description;


    answers.innerHTML =
        "";


    const options = [

        {
            text:
                question.correct,

            correct:
                true
        },

        {
            text:
                question.wrong,

            correct:
                false
        }

    ];


    shuffle(
        options
    );


    options.forEach(
        option => {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "answer-btn";


            button.textContent =
                option.text;


            button.dataset.correct =
                option.correct;


            button.setAttribute(
                "aria-label",
                option.text
            );


            button.addEventListener(
                "click",
                () =>
                    handleAnswer(
                        button,
                        question
                    )
            );


            answers.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   HANDLE ANSWER
========================================================= */

function handleAnswer(
    selected,
    question
) {

    /*
     * One answer only.
     * No retry.
     */

    if (
        answered
    ) {

        return;

    }


    answered =
        true;


    const buttons =
        document.querySelectorAll(
            ".answer-btn"
        );


    /*
     * Lock all answers.
     */

    buttons.forEach(
        button => {

            button.disabled =
                true;

        }
    );


    /*
     * Find correct answer.
     */

    const correctButton =
        [
            ...buttons
        ].find(
            button =>
                button.dataset.correct ===
                "true"
        );


    /*
     * Correct answer.
     */

    if (
        selected.dataset.correct ===
        "true"
    ) {

        score++;


        selected.classList.add(
            "correct-answer"
        );


        message.textContent =
            "✓ Correct!";


        message.classList.add(
            "correct-text"
        );

    }


    /*
     * Wrong answer.
     */

    else {

        selected.classList.add(
            "wrong-answer"
        );


        correctButton.classList.add(
            "correct-answer"
        );


        message.textContent =
            "✕ Wrong!";


        message.classList.add(
            "wrong-text"
        );

    }


    /*
     * Explanation.
     */

    explanation.textContent =
        `${question.correct} — ${getEnglishMeaning(question.correct)}. ${question.explanation}`;


    /*
     * Show next button.
     */

    nextBtn.classList.remove(
        "hidden"
    );


    /*
     * Last question.
     */

    if (
        currentQuestion ===
        TOTAL_QUESTIONS - 1
    ) {

        nextBtn.textContent =
            "Finish";

    }

    else {

        nextBtn.textContent =
            "Next Question →";

    }

}


/* =========================================================
   GET ENGLISH MEANING
========================================================= */

function getEnglishMeaning(
    vietnamese
) {

    const item =
        ACTIVITIES.find(
            activity =>
                activity.text ===
                vietnamese
        );


    return item
        ? item.english
        : "";

}


/* =========================================================
   NEXT QUESTION
========================================================= */

nextBtn.addEventListener(
    "click",
    () => {

        currentQuestion++;


        if (
            currentQuestion >=
            TOTAL_QUESTIONS
        ) {

            showResults();

        }

        else {

            loadQuestion();

        }

    }
);


/* =========================================================
   SHOW RESULTS
========================================================= */

function showResults() {

    gameScreen.classList.add(
        "hidden"
    );


    resultScreen.classList.remove(
        "hidden"
    );


    scoreText.textContent =
        `${score} / ${TOTAL_QUESTIONS}`;


    if (
        score ===
        TOTAL_QUESTIONS
    ) {

        performance.textContent =
            "Perfect! ✨";

    }

    else if (
        score >= 16
    ) {

        performance.textContent =
            "Excellent!";

    }

    else if (
        score >= 12
    ) {

        performance.textContent =
            "Good Job!";

    }

    else {

        performance.textContent =
            "Keep Practicing!";

    }


    /* ======================================================
       ANALYTICS — GAME COMPLETE
    ====================================================== */

    if (
        typeof trackGameComplete ===
        "function"
    ) {

        trackGameComplete(
            "Activities - Game 4",
            score,
            TOTAL_QUESTIONS
        );

    }

}

/* =========================================================
   PLAY AGAIN
========================================================= */

playAgain.addEventListener(
    "click",
    startGame
);


/* =========================================================
   INITIALIZE
========================================================= */

window.trackGameStart(
    "Activities - Game 4"
);

startGame();

</script>
