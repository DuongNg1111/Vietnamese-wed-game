<script>

/* ==========================================================

========================================================== */

const ACTIVITIES = [

    {

            "/dee hok/",

        english:

    },

    {

            "learn a foreign language"
    },

    {

            "làm việc",

        phonetic:
            "/lam viek/",

        english:
            "work"
    },

    {

            "đi làm",

            "/dee lam/",

        english:
            "go to work"
    },

    {

            "họp",

            "have a meeting"
    },

    {

    },

    {

    },


    /* ------------------------------------------------------

    {
        vietnamese:

            "/ngoo/",

            "sleep"
    },

    {

            "watch a movie"
    },

    {
        vietnamese:
            "nghe nhạc",

        phonetic:
            "/nge nyak/",

        english:
            "listen to music"
    },

    {
        vietnamese:
            "đọc sách",

        phonetic:
            "/dok sak/",

        english:
            "read books"
    },

    {
        vietnamese:
            "chơi game",

        phonetic:

        english:
            "play games"
    },

    {
        vietnamese:
            "đi chơi",

        phonetic:
            "/dee choi/",

        english:
            "hang out / go out"
    },

    {
        vietnamese:
            "đi dạo",

        phonetic:
            "/dee zao/",

        english:
            "go for a walk"
    },

    {
        vietnamese:
            "tập thể dục",

        phonetic:
            "/tap thay zook/",

        english:
            "exercise / work out"
    },

    {
        vietnamese:
            "đi biển",

        phonetic:
            "/dee bien/",

        english:
            "go to the beach"
    },

    {
        vietnamese:
            "du lịch",

        phonetic:
            "/zoo lik/",

        english:
            "travel"
    },

    {
        vietnamese:
            "chụp hình",

        phonetic:
            "/choop hin/",

        english:
            "take photos"
    },

    {
        vietnamese:
            "gặp bạn",

        phonetic:
            "/gap ban/",

        english:
            "meet friends"
    },


    /* ------------------------------------------------------
       DAILY LIFE
    ------------------------------------------------------ */

    {
        vietnamese:
            "ăn",

        phonetic:
            "/an/",

        english:
            "eat"
    },

    {
        vietnamese:
            "uống",

        phonetic:
            "/uong/",

        english:
            "drink"
    },

    {
        vietnamese:
            "nấu ăn",

        phonetic:
            "/nəw an/",

        english:
            "cook"
    },

    {
        vietnamese:
            "mua sắm",

        phonetic:
            "/mua sam/",

        english:
            "go shopping"
    },

    {
        vietnamese:
            "gọi điện",

        phonetic:
            "/goy dien/",

        english:
            "make a phone call"
    },

    {
        vietnamese:
            "nhắn tin",

        phonetic:
            "/nyan tin/",

        english:
            "text / send messages"
    },

    {
        vietnamese:
            "nói chuyện",

        phonetic:
            "/noy chuyen/",

        english:
            "talk / chat"
    }

];


/* ==========================================================
   GAME SETTINGS
========================================================== */

const TOTAL_QUESTIONS =
    20;

const ANSWERS_PER_QUESTION =
    4;


/* ==========================================================
   GAME STATE
========================================================== */

let questions =
    [];

let currentQuestion =
    0;

let score =
    0;

let answered =
    false;


/* ==========================================================
   DOM ELEMENTS
========================================================== */

const questionNumber =
    document.getElementById(
        "questionNumber"
    );


const questionText =
    document.getElementById(
        "questionText"
    );


const answers =
    document.getElementById(
        "answers"
    );


const message =
    document.getElementById(
        "message"
    );


const nextBtn =
    document.getElementById(
        "nextBtn"
    );


const gameScreen =
    document.getElementById(
        "gameScreen"
    );


const resultScreen =
    document.getElementById(
        "resultScreen"
    );


const scoreText =
    document.getElementById(
        "scoreText"
    );


const performance =
    document.getElementById(
        "performance"
    );


const playAgain =
    document.getElementById(
        "playAgain"
    );


/* ==========================================================
   RANDOM INDEX
========================================================== */

function randomIndex(max) {

    return Math.floor(
        Math.random() * max
    );

}


/* ==========================================================
   SHUFFLE
========================================================== */

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }


    return array;

}


/* ==========================================================
   GET WRONG ANSWERS
========================================================== */

function getWrongAnswers(
    correct
) {

    const available =
        ACTIVITIES.filter(
            activity =>
                activity.vietnamese !==
                correct.vietnamese
        );


    shuffle(
        available
    );


    return available.slice(
        0,
        ANSWERS_PER_QUESTION - 1
    );

}


/* ==========================================================
   GENERATE QUESTIONS
========================================================== */

function generateQuestions() {

    questions = [];


    const shuffledActivities =
        shuffle(
            [
                ...ACTIVITIES
            ]
        );


    /*
     * Use 20 different vocabulary items
     * in every game.
     */

    const selectedActivities =
        shuffledActivities.slice(
            0,
            TOTAL_QUESTIONS
        );


    selectedActivities.forEach(
        correct => {

            const wrongAnswers =
                getWrongAnswers(
                    correct
                );


            const options = [

                correct,
                ...wrongAnswers

            ];


            shuffle(
                options
            );


            questions.push({

                correct:
                    correct,

                options:
                    options

            });

        }
    );

}


/* ==========================================================
   START GAME
========================================================== */

function startGame() {

    generateQuestions();


    currentQuestion =
        0;


    score =
        0;


    gameScreen.classList.remove(
        "hidden"
    );


    resultScreen.classList.add(
        "hidden"
    );


    loadQuestion();

}


/* ==========================================================
   LOAD QUESTION
========================================================== */

function loadQuestion() {

    answered =
        false;


    message.textContent =
        "";


    message.className =
        "message";


    nextBtn.classList.add(
        "hidden"
    );


    const question =
        questions[
            currentQuestion
        ];


    questionNumber.textContent =
        `Question ${
            currentQuestion + 1
        } / ${
            TOTAL_QUESTIONS
        }`;


    questionText.textContent =
        question.correct.english;


    answers.innerHTML =
        "";


    question.options.forEach(
        option => {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "answer-btn";


            button.textContent =
                option.vietnamese;


            button.dataset.correct =
                (
                    option.vietnamese ===
                    question.correct.vietnamese
                );


            button.addEventListener(
                "click",
                () =>
                    handleAnswer(
                        button
                    )
            );


            answers.appendChild(
                button
            );

        }
    );

}


/* ==========================================================
   HANDLE ANSWER
========================================================== */

function handleAnswer(
    selected
) {

    if (
        answered
    ) {

        return;

    }


    answered =
        true;


    const buttons =
        document.querySelectorAll(
            ".answer-btn"
        );


    buttons.forEach(
        button => {

            button.classList.add(
                "disabled"
            );

        }
    );


    const correctButton =
        [
            ...buttons
        ].find(
            button =>
                button.dataset.correct ===
                "true"
        );


    if (
        selected.dataset.correct ===
        "true"
    ) {

        score++;


        selected.classList.add(
            "correct-answer"
        );


        message.textContent =
            "✓ Correct!";


        message.classList.add(
            "correct-text"
        );

    }

    else {

        selected.classList.add(
            "wrong-answer"
        );


        correctButton.classList.add(
            "correct-answer"
        );


        message.textContent =
            "✕ Wrong!";

        
        message.classList.add(
            "wrong-text"
        );

    }


    nextBtn.classList.remove(
        "hidden"
    );


    if (
        currentQuestion ===
        TOTAL_QUESTIONS - 1
    ) {

        nextBtn.textContent =
            "Finish";

    }

    else {

        nextBtn.textContent =
            "Next Question →";

    }

}


/* ==========================================================
   NEXT QUESTION
========================================================== */

nextBtn.addEventListener(
    "click",
    () => {

        currentQuestion++;


        if (
            currentQuestion >=
            TOTAL_QUESTIONS
        ) {

            showResults();

        }

        else {

            loadQuestion();

        }

    }
);


/* ==========================================================
   SHOW RESULTS
========================================================== */

function showResults() {

    gameScreen.classList.add(
        "hidden"
    );


    resultScreen.classList.remove(
        "hidden"
    );


    scoreText.textContent =
        `${score} / ${TOTAL_QUESTIONS}`;


    if (
        score ===
        TOTAL_QUESTIONS
    ) {

        performance.textContent =
            "Perfect! 🎯";

    }

    else if (
        score >= 16
    ) {

        performance.textContent =
            "Excellent!";

    }

    else if (
        score >= 12
    ) {

        performance.textContent =
            "Good Job!";

    }

    else {

        performance.textContent =
            "Keep Practicing!";

    }

}


/* ==========================================================
   PLAY AGAIN
========================================================== */

playAgain.addEventListener(
    "click",
    startGame
);

startGame();
