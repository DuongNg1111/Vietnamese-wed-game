<script>

/* =========================================================
   ACTIVITIES VOCABULARY
========================================================= */

const ACTIVITIES = [

    {
        vietnamese:"học bài",
        phonetic:"/hok bai/",
        english:"study"
    },

    {
        vietnamese:"làm bài",
        phonetic:"/lam bai/",
        english:"do homework / do exercises"
    },

    {
        vietnamese:"đi học",
        phonetic:"/dee hok/",
        english:"go to school"
    },

    {
        vietnamese:"học ngoại ngữ",
        phonetic:"/hok ngwai ngư/",
        english:"learn a foreign language"
    },

    {
        vietnamese:"làm việc",
        phonetic:"/lam viek/",
        english:"work"
    },

    {
        vietnamese:"đi làm",
        phonetic:"/dee lam/",
        english:"go to work"
    },

    {
        vietnamese:"họp",
        phonetic:"/hop/",
        english:"have a meeting"
    },

    {
        vietnamese:"thi",
        phonetic:"/thi/",
        english:"take an exam"
    },

    {
        vietnamese:"đi công tác",
        phonetic:"/dee cong tak/",
        english:"go on a business trip"
    },

    {
        vietnamese:"ngủ",
        phonetic:"/ngoo/",
        english:"sleep"
    },

    {
        vietnamese:"xem phim",
        phonetic:"/sem fim/",
        english:"watch a movie"
    },

    {
        vietnamese:"nghe nhạc",
        phonetic:"/nge nyak/",
        english:"listen to music"
    },

    {
        vietnamese:"đọc sách",
        phonetic:"/dok sak/",
        english:"read books"
    },

    {
        vietnamese:"chơi game",
        phonetic:"/choi game/",
        english:"play games"
    },

    {
        vietnamese:"đi chơi",
        phonetic:"/dee choi/",
        english:"hang out / go out"
    },

    {
        vietnamese:"đi dạo",
        phonetic:"/dee zao/",
        english:"go for a walk"
    },

    {
        vietnamese:"tập thể dục",
        phonetic:"/tap thay zook/",
        english:"exercise / work out"
    },

    {
        vietnamese:"đi biển",
        phonetic:"/dee bien/",
        english:"go to the beach"
    },

    {
        vietnamese:"du lịch",
        phonetic:"/zoo lik/",
        english:"travel"
    },

    {
        vietnamese:"chụp hình",
        phonetic:"/choop hin/",
        english:"take photos"
    },

    {
        vietnamese:"gặp bạn",
        phonetic:"/gap ban/",
        english:"meet friends"
    },

    {
        vietnamese:"ăn",
        phonetic:"/an/",
        english:"eat"
    },

    {
        vietnamese:"uống",
        phonetic:"/uong/",
        english:"drink"
    },

    {
        vietnamese:"nấu ăn",
        phonetic:"/nəw an/",
        english:"cook"
    },

    {
        vietnamese:"mua sắm",
        phonetic:"/mua sam/",
        english:"go shopping"
    },

    {
        vietnamese:"gọi điện",
        phonetic:"/goy dien/",
        english:"make a phone call"
    },

    {
        vietnamese:"nhắn tin",
        phonetic:"/nyan tin/",
        english:"text / send messages"
    },

    {
        vietnamese:"nói chuyện",
        phonetic:"/noy chuyen/",
        english:"talk / chat"
    }

];


/* =========================================================
   GAME SETTINGS
========================================================= */

const TOTAL_QUESTIONS =
    20;

const ANSWERS_PER_QUESTION =
    4;


/* =========================================================
   GAME STATE
========================================================= */

let questions =
    [];

let currentQuestion =
    0;

let score =
    0;

let answered =
    false;


/* =========================================================
   DOM ELEMENTS
========================================================= */

const questionNumber =
    document.getElementById(
        "questionNumber"
    );

const questionText =
    document.getElementById(
        "questionText"
    );

const answers =
    document.getElementById(
        "answers"
    );

const message =
    document.getElementById(
        "message"
    );

const nextBtn =
    document.getElementById(
        "nextBtn"
    );

const gameScreen =
    document.getElementById(
        "gameScreen"
    );

const resultScreen =
    document.getElementById(
        "resultScreen"
    );

const scoreText =
    document.getElementById(
        "scoreText"
    );

const performance =
    document.getElementById(
        "performance"
    );

const playAgain =
    document.getElementById(
        "playAgain"
    );


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array) {

    const arr =
        [...array];


    for (
        let i = arr.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] =
        [
            arr[j],
            arr[i]
        ];

    }


    return arr;

}


/* =========================================================
   GET WRONG ANSWERS
========================================================= */

function getWrongAnswers(correct) {

    const available =
        ACTIVITIES.filter(
            activity =>
                activity.vietnamese !==
                correct.vietnamese
        );


    return shuffle(
        available
    ).slice(
        0,
        ANSWERS_PER_QUESTION - 1
    );

}


/* =========================================================
   GENERATE QUESTIONS
========================================================= */

function generateQuestions() {

    const shuffledActivities =
        shuffle(
            ACTIVITIES
        );


    const selectedActivities =
        shuffledActivities.slice(
            0,
            TOTAL_QUESTIONS
        );


    questions =
        selectedActivities.map(
            correct => {

                const wrongAnswers =
                    getWrongAnswers(
                        correct
                    );


                const options = [
                    correct,
                    ...wrongAnswers
                ];


                return {

                    correct:
                        correct,

                    options:
                        shuffle(
                            options
                        )

                };

            }
        );

}


/* =========================================================
   START GAME
========================================================= */

function startGame() {

    generateQuestions();


    currentQuestion =
        0;

    score =
        0;


    gameScreen.classList.remove(
        "hidden"
    );


    resultScreen.classList.add(
        "hidden"
    );


    loadQuestion();

}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion() {

    answered =
        false;


    message.textContent =
        "";

    message.className =
        "message";


    nextBtn.textContent =
        "";

    nextBtn.classList.add(
        "hidden"
    );


    const question =
        questions[
            currentQuestion
        ];


    questionNumber.textContent =
        `Question ${
            currentQuestion + 1
        } / ${
            TOTAL_QUESTIONS
        }`;


    questionText.textContent =
        question.correct.english;


    answers.innerHTML =
        "";


    question.options.forEach(
        option => {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "answer-btn";


            button.textContent =
                option.vietnamese;


            button.dataset.correct =
                (
                    option.vietnamese ===
                    question.correct.vietnamese
                );


            button.setAttribute(
                "aria-label",
                option.vietnamese
            );


            button.addEventListener(
                "click",
                () =>
                    handleAnswer(
                        button
                    )
            );


            answers.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   HANDLE ANSWER
========================================================= */

function handleAnswer(
    selected
) {

    if (
        answered
    ) {

        return;

    }


    answered =
        true;


    const buttons =
        document.querySelectorAll(
            ".answer-btn"
        );


    buttons.forEach(
        button => {

            button.disabled =
                true;

        }
    );


    const correctButton =
        [
            ...buttons
        ].find(
            button =>
                button.dataset.correct ===
                "true"
        );


    if (
        selected.dataset.correct ===
        "true"
    ) {

        score++;


        selected.classList.add(
            "correct-answer"
        );


        message.textContent =
            "✓ Correct!";


        message.classList.add(
            "correct-text"
        );

    }

    else {

        selected.classList.add(
            "wrong-answer"
        );


        correctButton.classList.add(
            "correct-answer"
        );


        message.textContent =
            "✕ Wrong!";


        message.classList.add(
            "wrong-text"
        );

    }


    nextBtn.classList.remove(
        "hidden"
    );


    if (
        currentQuestion ===
        TOTAL_QUESTIONS - 1
    ) {

        nextBtn.textContent =
            "Finish";

    }

    else {

        nextBtn.textContent =
            "Next Question →";

    }

}


/* =========================================================
   NEXT QUESTION
========================================================= */

nextBtn.addEventListener(
    "click",
    () => {

        if (!answered) {

            return;

        }


        currentQuestion++;


        if (
            currentQuestion >=
            TOTAL_QUESTIONS
        ) {

            showResults();

        }

        else {

            loadQuestion();

        }

    }
);


/* =========================================================
   SHOW RESULTS
========================================================= */

function showResults() {

    gameScreen.classList.add(
        "hidden"
    );


    resultScreen.classList.remove(
        "hidden"
    );


    scoreText.textContent =
        `${score} / ${TOTAL_QUESTIONS}`;


    if (
        score ===
        TOTAL_QUESTIONS
    ) {

        performance.textContent =
            "Perfect! 🎯";

    }

    else if (
        score >= 16
    ) {

        performance.textContent =
            "Excellent!";

    }

    else if (
        score >= 12
    ) {

        performance.textContent =
            "Good Job!";

    }

    else {

        performance.textContent =
            "Keep Practicing!";

    }


    /* ======================================================
       ANALYTICS — GAME COMPLETE
    ====================================================== */

    if (
        typeof trackGameComplete ===
        "function"
    ) {

        trackGameComplete(
            "Activities - Game 3",
            score,
            TOTAL_QUESTIONS
        );

    }

}


/* =========================================================
   PLAY AGAIN
========================================================= */

playAgain.addEventListener(
    "click",
    startGame
);


/* =========================================================
   INITIALIZE
========================================================= */
window.trackGameStart(
    "Activities - Game 2"
);

startGame();

</script>
