/* =========================================================
   RESET

/* =========================================================
   BODY
========================================================= */

/* =========================================================

========================================================= */

.page {

/* =========================================================
   BACK BUTTON
========================================================= */

.back-btn-container {

}


.back-btn {

    display:

    align-items:
        center;

        7px;

    padding:
        9px 16px;

    border:
        1px solid
        var(--border);

    border-radius:
        999px;

    background:
        rgba(
            255,
            255,
            255,
            0.95
        );

    color:
        var(--accent-dark);

    text-decoration:
        none;

    font-size:
        1.05rem;

    font-weight:
        700;

    box-shadow:
        0 4px 14px
        rgba(
            20,
            58,
            107,
            0.06
        );

    transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease,
        color 0.2s ease;

}


.back-btn:hover {

    transform:
        translateY(-2px);

    background:
        var(--accent);

    border-color:
        var(--accent);

    color:
        white;

}


/* =========================================================
   MAIN CARD
========================================================= */

.card {

    position:

        42px;

    overflow:
        hidden;

    background:
        var(--white);

    border:
        1px solid
        var(--border);

    border-radius:
        24px;

    box-shadow:
        0 18px 50px

    text-align:
        center;

}


/* =========================================================
   HEADER ACCENT LINE
========================================================= */

.card::before {

    content:
        "";

    position:
        absolute;

    top:
        0;

    left:
        0;

    width:
        100%;

    height:
        5px;

    background:

            90deg,
            var(--accent),

}


/* =========================================================
   GAME ICON
========================================================= */

.game-icon {

}


/* =========================================================
   TITLE
========================================================= */

h1 {

/* =========================================================

========================================================= */

.subtitle {

}


/* =========================================================
   QUESTION NUMBER
========================================================= */

.question-number {

}


/* =========================================================
   CHOOSE TEXT
========================================================= */

.choose-text {

}


/* =========================================================
   QUESTION BOX
========================================================= */

.question {

        1.7rem;

}


/* =========================================================
   ANSWERS
========================================================= */

.answers {

    display:
        grid;

    grid-template-columns:

            2,

                0,
                1fr
            )

    gap:
        14px;

        720px;

}


/* =========================================================
   ANSWER BUTTON
========================================================= */

.answer-btn {

    min-height:
        70px;

    padding:

    border:
        2px solid

    border-radius:
        16px;

    background:
        var(--white);

    color:
        var(--ink);

    font-family:
        inherit;

    font-size:
        1.18rem;

    font-weight:
        700;

    line-height:
        1.35;

    cursor:
        pointer;

    box-shadow:
        0 5px 14px
        rgba(
            20,
            58,
            107,
            0.05
        );

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease;

}


.answer-btn:hover:not(:disabled) {

    transform:

    border-color:
        var(--accent);

        var(--accent-light);

}


.answer-btn:disabled {

}


/* =========================================================
   CORRECT ANSWER
========================================================= */

.answer-btn.correct-answer {

    border-color:

    background:
        var(--correct-light) !important;

/* =========================================================

========================================================= */

.answer-btn.wrong-answer {

    color:

}


/* =========================================================

========================================================= */

.message {

/* =========================================================

========================================================= */

.action-btn:hover {

    }

    }

}

</style>

<body>

<script>

/* =========================================================
   ACTIVITIES VOCABULARY
========================================================= */

const ACTIVITIES = [

    /* WORK & STUDY */

    {
        vietnamese: "học bài",
        phonetic: "/hok bai/",
        english: "study"
    },

    {
        vietnamese: "làm bài",
        phonetic: "/lam bai/",
        english: "do homework / do exercises"
    },

    {
        vietnamese: "đi học",
        phonetic: "/dee hok/",
        english: "go to school"
    },

    {
        vietnamese: "học ngoại ngữ",
        phonetic: "/hok ngwai ngư/",
        english: "learn a foreign language"
    },

    {
        vietnamese: "làm việc",
        phonetic: "/lam viek/",
        english: "work"
    },

    {
        vietnamese: "đi làm",
        phonetic: "/dee lam/",
        english: "go to work"
    },

    {
        vietnamese: "họp",
        phonetic: "/hop/",
        english: "have a meeting"
    },

    {
        vietnamese: "thi",
        phonetic: "/thi/",
        english: "take an exam"
    },

    {
        vietnamese: "đi công tác",
        phonetic: "/dee kong tak/",
        english: "go on a business trip"
    },


    /* FREE TIME */

    {
        vietnamese: "ngủ",
        phonetic: "/ngoo/",
        english: "sleep"
    },

    {
        vietnamese: "xem phim",
        phonetic: "/sem fim/",
        english: "watch a movie"
    },

    {
        vietnamese: "nghe nhạc",
        phonetic: "/nge nyak/",
        english: "listen to music"
    },

    {
        vietnamese: "đọc sách",
        phonetic: "/dok sak/",
        english: "read books"
    },

    {
        vietnamese: "chơi game",
        phonetic: "/choi game/",
        english: "play games"
    },

    {
        vietnamese: "đi chơi",
        phonetic: "/dee choi/",
        english: "hang out / go out"
    },

    {
        vietnamese: "đi dạo",
        phonetic: "/dee zao/",
        english: "go for a walk"
    },

    {
        vietnamese: "tập thể dục",
        phonetic: "/tap thay zook/",
        english: "exercise / work out"
    },

    {
        vietnamese: "đi biển",
        phonetic: "/dee bien/",
        english: "go to the beach"
    },

    {
        vietnamese: "du lịch",
        phonetic: "/zoo lik/",
        english: "travel"
    },

    {
        vietnamese: "chụp hình",
        phonetic: "/choop hin/",
        english: "take photos"
    },

    {
        vietnamese: "gặp bạn",
        phonetic: "/gap ban/",
        english: "meet friends"
    },


    /* DAILY LIFE */

    {
        vietnamese: "ăn",
        phonetic: "/an/",
        english: "eat"
    },

    {
        vietnamese: "uống",
        phonetic: "/uong/",
        english: "drink"
    },

    {
        vietnamese: "nấu ăn",
        phonetic: "/nəw an/",
        english: "cook"
    },

    {
        vietnamese: "mua sắm",
        phonetic: "/mua sam/",
        english: "go shopping"
    },

    {
        vietnamese: "gọi điện",
        phonetic: "/goy dien/",
        english: "make a phone call"
    },

    {
        vietnamese: "nhắn tin",
        phonetic: "/nyan tin/",
        english: "text / send messages"
    },

    {
        vietnamese: "nói chuyện",
        phonetic: "/noy chuyen/",
        english: "talk / chat"
    }

];


/* =========================================================
   GAME SETTINGS
========================================================= */

const TOTAL_QUESTIONS =
    20;

const ANSWERS_PER_QUESTION =
    4;


/* =========================================================
   GAME STATE
========================================================= */

let questions =
    [];

let currentQuestion =
    0;

let score =
    0;

let answered =
    false;


/* =========================================================
   DOM ELEMENTS
========================================================= */

const questionNumber =
    document.getElementById(
        "questionNumber"
    );


const questionText =
    document.getElementById(
        "questionText"
    );


const answers =
    document.getElementById(
        "answers"
    );


const message =
    document.getElementById(
        "message"
    );


const nextBtn =
    document.getElementById(
        "nextBtn"
    );


const gameScreen =
    document.getElementById(
        "gameScreen"
    );


const resultScreen =
    document.getElementById(
        "resultScreen"
    );


const scoreText =
    document.getElementById(
        "scoreText"
    );


const performance =
    document.getElementById(
        "performance"
    );


const playAgain =
    document.getElementById(
        "playAgain"
    );


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }


    return array;

}


/* =========================================================
   GET WRONG ANSWERS
========================================================= */

function getWrongAnswers(correct) {

    const available =
        ACTIVITIES.filter(
            activity =>
                activity.vietnamese !==
                correct.vietnamese
        );


    shuffle(
        available
    );


    return available.slice(
        0,
        ANSWERS_PER_QUESTION - 1
    );

}


/* =========================================================
   GENERATE QUESTIONS
========================================================= */

function generateQuestions() {

    const shuffledActivities =
        shuffle(
            [
                ...ACTIVITIES
            ]
        );


    const selectedActivities =
        shuffledActivities.slice(
            0,
            TOTAL_QUESTIONS
        );


    questions =
        selectedActivities.map(
            correct => {

                const wrongAnswers =
                    getWrongAnswers(
                        correct
                    );


                const options = [
                    correct,
                    ...wrongAnswers
                ];


                shuffle(
                    options
                );


                return {

                    correct:
                        correct,

                    options:
                        options

                };

            }
        );

}


/* =========================================================
   START GAME
========================================================= */

function startGame() {

    generateQuestions();


    currentQuestion =
        0;


    score =
        0;


    gameScreen.classList.remove(
        "hidden"
    );


    resultScreen.classList.add(
        "hidden"
    );


    loadQuestion();

}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion() {

    answered =
        false;


    message.textContent =
        "";

    message.className =
        "message";


    nextBtn.textContent =
        "";

    nextBtn.classList.add(
        "hidden"
    );


    const question =
        questions[
            currentQuestion
        ];


    questionNumber.textContent =
        `Question ${
            currentQuestion + 1
        } / ${
            TOTAL_QUESTIONS
        }`;


    questionText.textContent =
        question.correct.english;


    answers.innerHTML =
        "";


    question.options.forEach(
        option => {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "answer-btn";


            button.textContent =
                option.vietnamese;


            button.dataset.correct =
                (
                    option.vietnamese ===
                    question.correct.vietnamese
                );


            button.setAttribute(
                "aria-label",
                option.vietnamese
            );


            button.addEventListener(
                "click",
                () =>
                    handleAnswer(
                        button
                    )
            );


            answers.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   HANDLE ANSWER
========================================================= */

function handleAnswer(selected) {

    /*
     * One answer only.
     * No retry.
     */

    if (
        answered
    ) {

        return;

    }


    answered =
        true;


    const buttons =
        document.querySelectorAll(
            ".answer-btn"
        );


    /*
     * Lock all answer buttons.
     */

    buttons.forEach(
        button => {

            button.disabled =
                true;

        }
    );


    /*
     * Find correct answer.
     */

    const correctButton =
        [
            ...buttons
        ].find(
            button =>
                button.dataset.correct ===
                "true"
        );


    /*
     * Correct.
     */

    if (
        selected.dataset.correct ===
        "true"
    ) {

        score++;


        selected.classList.add(
            "correct-answer"
        );


        message.textContent =
            "✓ Correct!";


        message.classList.add(
            "correct-text"
        );

    }


    /*
     * Wrong.
     */

    else {

        selected.classList.add(
            "wrong-answer"
        );


        correctButton.classList.add(
            "correct-answer"
        );


        message.textContent =
            "✕ Wrong!";


        message.classList.add(
            "wrong-text"
        );

    }


    /*
     * Show next button.
     */

    nextBtn.classList.remove(
        "hidden"
    );


    /*
     * Last question.
     */

    if (
        currentQuestion ===
        TOTAL_QUESTIONS - 1
    ) {

        nextBtn.textContent =
            "Finish";

    }

    else {

        nextBtn.textContent =
            "Next Question →";

    }

}


/* =========================================================
   NEXT QUESTION
========================================================= */

nextBtn.addEventListener(
    "click",
    () => {

        currentQuestion++;


        if (
            currentQuestion >=
            TOTAL_QUESTIONS
        ) {

            showResults();

        }

        else {

            loadQuestion();

        }

    }
);


/* =========================================================
   SHOW RESULTS
========================================================= */

function showResults() {

    gameScreen.classList.add(
        "hidden"
    );


    resultScreen.classList.remove(
        "hidden"
    );


    scoreText.textContent =
        `${score} / ${TOTAL_QUESTIONS}`;


    if (
        score ===
        TOTAL_QUESTIONS
    ) {

        performance.textContent =
            "Perfect! 🎯";

    }

    else if (
        score >= 16
    ) {

        performance.textContent =
            "Excellent!";

    }

    else if (
        score >= 12
    ) {

        performance.textContent =
            "Good Job!";

    }

    else {

        performance.textContent =
            "Keep Practicing!";

    }

}


/* =========================================================
   PLAY AGAIN
========================================================= */

playAgain.addEventListener(
    "click",
    startGame
);


/* =========================================================
   INITIALIZE
========================================================= */

startGame();

</script>
