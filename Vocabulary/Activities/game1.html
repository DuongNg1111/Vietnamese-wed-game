<style>

========================================================= */

/* =========================================================

========================================================= */

/* =========================================================

========================================================= */

body {

    min-height: 100vh;

    padding: 28px 20px 45px;

    color: var(--ink);

}

/* =========================================================
   PAGE
========================================================= */

.page {

    width:

            900px,
            96vw
        );

    position:
        relative;

}


/* =========================================================
   BACK BUTTON
   OUTSIDE GAME CARD
========================================================= */

.back-btn-container {

    margin-bottom:
        12px;

}


.back-btn {

    display:
        inline-flex;

    align-items:
        center;

    gap:
        6px;

    padding:
        8px 14px;

    border:
        1px solid
        var(--general-border);

    border-radius:
        9px;

    background:
        #ffffff;

    color:
        #665c59;

    text-decoration:
        none;

        Calibri,
        sans-serif;

    font-size:
        22px;

    font-weight:
        bold;

    cursor:
        pointer;

    box-shadow:
        0 4px 12px

            0,
            0,
            .08
        );

    transition:
        .2s;

}


.back-btn:hover {

    background:
        var(--accent-light);

    border-color:
        var(--accent-border);

    color:
        var(--accent-dark);

    transform:
        translateX(-2px);

}


/* =========================================================
   MAIN GAME CARD
========================================================= */

.card {

    width:
        100%;

    overflow:
        hidden;

    background:
        #ffffff;

    border:
        1px solid
        var(--general-border);

    border-radius:
        20px;

    box-shadow:

            0,

        );

    text-align:

}


/* =========================================================
   ACCENT LINE
========================================================= */

.card::before {

    content:
        "";

        absolute;

    top:
        0;

    left:
        0;

    width:

    height:

    background:

}


/* =========================================================
   GAME HEADER
========================================================= */

.game-icon {

    width:
        62px;

    height:
        62px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border:
        1px solid

    border-radius:

    background:

}


/* =========================================================
   TITLE
========================================================= */

h1 {

    margin:
        0 0 7px;

    color:
        var(--ink);

    font-family:
        'Kalam',
        cursive;

    font-size:
        40px;

    font-weight:
        700;

    line-height:
        1.25;

}


/* =========================================================
   SUBTITLE
========================================================= */

.subtitle {

    max-width:
        650px;

    margin:
        0 auto 28px;

    color:
        var(--muted);

    font-size:
        20px;

    line-height:
        1.5;

}


/* =========================================================
   QUESTION NUMBER
========================================================= */

.question-number {

    display:
        inline-flex;

    align-items:
        center;

    justify-content:
        center;

    margin:
        0 auto 18px;

    padding:
        7px 15px;

    border:
        1px solid
        var(--accent-border);

    border-radius:
        999px;

    background:
        var(--accent-bg);

    color:
        var(--accent-dark);

    font-size:
        17px;

    font-weight:
        800;

    letter-spacing:
        0.02em;

}


/* =========================================================
   QUESTION WORD
========================================================= */

.word {

    margin-bottom:
        28px;

    color:
        var(--accent);

    font-size:
        42px;

    font-weight:
        800;

    line-height:
        1.2;

}


/* =========================================================
   ANSWERS
========================================================= */

.answers {

    display:
        grid;

    grid-template-columns:
        repeat(
            2,
            minmax(
                0,
                1fr
            )
        );

    gap:
        14px;

    width:
        min(
            700px,
            100%
        );

    margin:
        0 auto 20px;

}


/* =========================================================
   ANSWER BUTTON
========================================================= */

.answer-btn {

    min-height:
        76px;

    padding:
        15px 20px;

    border:
        2px solid
        var(--general-border);

    border-radius:
        14px;

    background:
        #ffffff;

    color:
        var(--ink);

    font-family:
        inherit;

    font-size:
        19px;

    font-weight:
        700;

    line-height:
        1.4;

    cursor:
        pointer;

    box-shadow:
        0 5px 14px
        rgba(
            0,
            0,
            0,
            .06
        );

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        border-color .2s ease,
        background .2s ease;

}


.answer-btn:hover:not(:disabled) {

    transform:
        translateY(-2px);

    border-color:
        var(--accent-border);

    background:
        var(--accent-light);

    box-shadow:
        0 8px 18px
        rgba(
            0,
            0,
            0,
            .08
        );

}


.answer-btn:disabled {

    cursor:
        default;

}


/* =========================================================
   CORRECT ANSWER
========================================================= */

.correct-answer {

    border-color:
        var(--correct) !important;

    background:
        var(--correct-light) !important;

    color:
        var(--correct) !important;

    box-shadow:
        0 5px 16px

            1,
            155,
            63,

        ) !important;

}


/* =========================================================
   WRONG ANSWER
========================================================= */

.wrong-answer {

    border-color:
        var(--wrong) !important;

    background:
        var(--wrong-light) !important;

    color:
        var(--wrong) !important;

}


/* =========================================================
   MESSAGE
========================================================= */

.message {

    min-height:
        30px;

    margin-bottom:
        16px;

    font-size:
        20px;

    font-weight:
        800;

}


.correct-text {

    color:

}


.wrong-text {

}


/* =========================================================
   ACTION BUTTON
========================================================= */

.action-btn {

    min-width:

    padding:
        12px 24px;

    border:

    color:

    font-size:
        19px;

    font-weight:
        800;

    cursor:

    box-shadow:
        0 5px 14px

            145,
            68,
            59,
            .18
        );

    transition:
        transform .2s ease,
        background .2s ease,

}


.action-btn:hover {

    transform:
        translateY(-2px);

    background:
        var(--accent-dark);

    box-shadow:
        0 8px 18px
        rgba(
            145,
            68,
            59,
            .22
        );

}


.action-btn:active {

    transform:
        translateY(0);

}


/* =========================================================
   RESULT SCREEN
========================================================= */

.result-icon {

    width:
        68px;

    height:
        68px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    margin:
        2px auto 16px;

    border:
        1px solid

    border-radius:
        18px;

    background:
        var(--accent-light);

    font-size:

}


.result-title {

    margin-bottom:
        8px;

}


.score {

    margin:
        18px 0 8px;

    color:
        var(--accent);

    font-size:
        48px;

    font-weight:
        800;

}


.performance {

    margin-bottom:
        26px;

    color:

    font-size:
        21px;

}


/* =========================================================
   HIDDEN
========================================================= */

.hidden {

    display:
        none !important;

}


/* =========================================================
   MOBILE
========================================================= */

@media (
    max-width: 700px

    body {

        padding:

    .card {

    }


    h1 {

    }


    .subtitle {

        font-size:
            18px;

        margin-bottom:
            24px;

    }


    .word {

        font-size:
            36px;

        margin-bottom:
            24px;

    }


    .answers {

        grid-template-columns:
            1fr;

        gap:
            12px;

    }


    .answer-btn {

        min-height:
            68px;

        font-size:
            18px;

    }


    .back-btn {

        font-size:
            19px;

        padding:

    }

}


/* =========================================================
   VERY SMALL SCREENS
========================================================= */

@media (
    max-width: 380px
) {

    body {

        padding:
            14px 10px 25px;

    }


    .card {

        padding:

        border-radius:

    }


    .game-icon {

        width:

    }


    .answer-btn {

            64px;

        padding:
            12px 14px;

        font-size:
            17px;

    }


    .action-btn {

        font-size:
            18px;

    }

}

</style>

<script>

/* =========================================================
   ACTIVITIES VOCABULARY
========================================================= */

const ACTIVITIES = [

    {
        text:
            "học bài",

        english:
            "study"
    },

    {
        text:
            "làm bài",

        english:
            "do homework / do exercises"
    },

    {
        text:
            "đi học",

        english:
            "go to school"
    },

    {
        text:
            "học ngoại ngữ",

        english:
            "learn a foreign language"
    },

    {
        text:
            "làm việc",

        english:
            "work"
    },

    {
        text:
            "đi làm",

        english:
            "go to work"
    },

    {
        text:
            "họp",

        english:
            "have a meeting"
    },

    {
        text:
            "thi",

        english:
            "take an exam"
    },

    {
        text:
            "đi công tác",

        english:
            "go on a business trip"
    },

    {
        text:
            "ngủ",

        english:
            "sleep"
    },

    {
        text:
            "xem phim",

        english:
            "watch a movie"
    },

    {
        text:
            "nghe nhạc",

        english:
            "listen to music"
    },

    {
        text:
            "đọc sách",

        english:
            "read books"
    },

    {
        text:
            "chơi game",

        english:
            "play games"
    },

    {
        text:
            "đi chơi",

        english:
            "hang out / go out"
    },

    {
        text:
            "đi dạo",

        english:
            "go for a walk"
    },

    {
        text:
            "tập thể dục",

        english:
            "exercise / work out"
    },

    {
        text:
            "đi biển",

        english:
            "go to the beach"
    },

    {
        text:
            "du lịch",

        english:
            "travel"
    },

    {
        text:
            "chụp hình",

        english:
            "take photos"
    },

    {
        text:
            "gặp bạn",

        english:
            "meet friends"
    },

    {
        text:
            "ăn",

        english:
            "eat"
    },

    {
        text:
            "uống",

        english:
            "drink"
    },

    {
        text:
            "nấu ăn",

        english:
            "cook"
    },

    {
        text:
            "mua sắm",

        english:
            "go shopping"
    },

    {
        text:
            "gọi điện",

        english:
            "make a phone call"
    },

    {
        text:
            "nhắn tin",

        english:
            "text / send messages"
    },

    {
        text:
            "nói chuyện",

        english:
            "talk / chat"
    }

];


/* =========================================================
   GAME SETTINGS
========================================================= */

const TOTAL_QUESTIONS =
    20;

const OPTIONS_PER_QUESTION =
    4;


/* =========================================================
   GAME STATE
========================================================= */

let questions =
    [];

let currentQuestion =
    0;

let score =
    0;

let answered =
    false;


/* =========================================================
   DOM ELEMENTS
========================================================= */

const questionNumber =
    document.getElementById(
        "questionNumber"
    );


const questionWord =
    document.getElementById(
        "questionWord"
    );


const answers =
    document.getElementById(
        "answers"
    );


const message =
    document.getElementById(
        "message"
    );


const nextBtn =
    document.getElementById(
        "nextBtn"
    );


const gameScreen =
    document.getElementById(
        "gameScreen"
    );


const resultScreen =
    document.getElementById(
        "resultScreen"
    );


const scoreText =
    document.getElementById(
        "scoreText"
    );


const performance =
    document.getElementById(
        "performance"
    );


const playAgain =
    document.getElementById(
        "playAgain"
    );


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }


    return array;

}


/* =========================================================
   GET RANDOM WRONG ANSWERS
========================================================= */

function getWrongAnswers(
    correct
) {

    const candidates =
        ACTIVITIES.filter(
            activity =>
                activity.text !==
                correct.text
        );


    shuffle(
        candidates
    );


    return candidates.slice(
        0,
        OPTIONS_PER_QUESTION - 1
    );

}


/* =========================================================
   GENERATE QUESTIONS
========================================================= */

function generateQuestions() {

    const pool =
        shuffle(
            [
                ...ACTIVITIES
            ]
        );


    const selectedActivities =
        pool.slice(
            0,
            TOTAL_QUESTIONS
        );


    questions =
        selectedActivities.map(
            correct => {

                const wrongAnswers =
                    getWrongAnswers(
                        correct
                    );


                const options = [

                    correct,

                    ...wrongAnswers

                ];


                shuffle(
                    options
                );


                return {

                    correct:
                        correct,

                    options:
                        options

                };

            }
        );

}


/* =========================================================
   START GAME
========================================================= */

function startGame() {

    generateQuestions();


    currentQuestion =
        0;


    score =
        0;


    gameScreen.classList.remove(
        "hidden"
    );


    resultScreen.classList.add(
        "hidden"
    );


    loadQuestion();

}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion() {

    answered =
        false;


    message.textContent =
        "";


    message.className =
        "message";


    nextBtn.textContent =
        "";


    nextBtn.classList.add(
        "hidden"
    );


    const question =
        questions[
            currentQuestion
        ];


    questionNumber.textContent =
        `Question ${
            currentQuestion + 1
        } / ${
            TOTAL_QUESTIONS
        }`;


    questionWord.textContent =
        question.correct.text;


    answers.innerHTML =
        "";


    question.options.forEach(
        option => {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "answer-btn";


            button.textContent =
                option.english;


            button.dataset.correct =
                (
                    option.text ===
                    question.correct.text
                );


            button.setAttribute(
                "aria-label",
                option.english
            );


            button.addEventListener(
                "click",
                () =>
                    handleAnswer(
                        button
                    )
            );


            answers.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   HANDLE ANSWER
========================================================= */

function handleAnswer(
    selected
) {

    /*
     * A question can only be answered once.
     */

    if (
        answered
    ) {

        return;

    }


    answered =
        true;


    const buttons =
        document.querySelectorAll(
            ".answer-btn"
        );


    /*
     * Lock every answer button.
     */

    buttons.forEach(
        button => {

            button.disabled =
                true;

        }
    );


    /*
     * Find the correct answer.
     */

    const correctButton =
        [
            ...buttons
        ].find(
            button =>
                button.dataset.correct ===
                "true"
        );


    /*
     * Correct answer.
     */

    if (
        selected.dataset.correct ===
        "true"
    ) {

        score++;


        selected.classList.add(
            "correct-answer"
        );


        message.textContent =
            "✓ Correct!";


        message.classList.add(
            "correct-text"
        );

    }


    /*
     * Wrong answer.
     */

    else {

        selected.classList.add(
            "wrong-answer"
        );


        correctButton.classList.add(
            "correct-answer"
        );


        message.textContent =
            "✕ Wrong!";


        message.classList.add(
            "wrong-text"
        );

    }


    /*
     * Show Next button.
     */

    nextBtn.classList.remove(
        "hidden"
    );


    if (
        currentQuestion ===
        TOTAL_QUESTIONS - 1
    ) {

        nextBtn.textContent =
            "Finish";

    }

    else {

        nextBtn.textContent =
            "Next Question →";

    }

}


/* =========================================================
   NEXT QUESTION
========================================================= */

nextBtn.addEventListener(
    "click",
    () => {

        currentQuestion++;


        if (
            currentQuestion >=
            TOTAL_QUESTIONS
        ) {

            showResults();

        }

        else {

            loadQuestion();

        }

    }
);


/* =========================================================
   SHOW RESULTS
========================================================= */

function showResults() {

    gameScreen.classList.add(
        "hidden"
    );


    resultScreen.classList.remove(
        "hidden"
    );


    scoreText.textContent =
        `${score} / ${TOTAL_QUESTIONS}`;


    if (
        score ===
        TOTAL_QUESTIONS
    ) {

        performance.textContent =
            "Perfect! 🏃";

    }

    else if (
        score >= 16
    ) {

        performance.textContent =
            "Excellent!";

    }

    else if (
        score >= 12
    ) {

        performance.textContent =
            "Good Job!";

    }

    else {

        performance.textContent =
            "Keep Practicing!";

    }

}


/* =========================================================
   PLAY AGAIN
========================================================= */

playAgain.addEventListener(
    "click",
    startGame
);


/* =========================================================
   INITIALIZE
========================================================= */

startGame();
