/* =========================================================

========================================================= */

function shuffle(array) {

    const newArray =
        [...array];


    for (
        let i =
            newArray.length - 1;

        i > 0;

        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            newArray[i],
            newArray[j]
        ] =
        [
            newArray[j],
            newArray[i]
        ];

    }


    return newArray;

}

    );


    const round =
        rounds[current];


    const pairs =
        round.pairs;


    const count =
        pairs.length;


    roundText.textContent =
        `Round ${current + 1} / ${rounds.length}`;


    scoreText.textContent =
        `Score: ${score}`;


    targetsEl.style.gridTemplateColumns =
        `repeat(${count}, minmax(0, 1fr))`;


    wordsEl.style.gridTemplateColumns =
        `repeat(${count}, minmax(0, 1fr))`;


    targetsEl.innerHTML =
        "";

    wordsEl.innerHTML =
        "";


    /* =====================================================
       CREATE VIETNAMESE TARGETS
    ===================================================== */

    shuffle(pairs).forEach(
        pair => {

            const vietnamese =
                pair[0];


            const box =
                document.createElement(
                    "div"
                );


            box.className =
                "target";


            box.dataset.vi =
                vietnamese;


            const label =
                document.createElement(
                    "div"
                );


            label.className =
                "target-label";


            label.textContent =
                vietnamese;


            const placed =
                document.createElement(
                    "div"
                );


            placed.className =
                "target-word empty";


            placed.textContent =
                "Drop here";


            box.appendChild(
                label
            );


            box.appendChild(
                placed
            );


            /* =========================================
               DRAG OVER
            ========================================= */

            box.addEventListener(
                "dragover",
                event => {

                    if (checked) {
                        return;
                    }


                    event.preventDefault();


                    box.classList.add(
                        "over"
                    );

                }
            );


            /* =========================================
               DRAG LEAVE
            ========================================= */

            box.addEventListener(
                "dragleave",
                () => {

                    box.classList.remove(
                        "over"
                    );

                }
            );


            /* =========================================
               DROP
            ========================================= */

            box.addEventListener(
                "drop",
                event => {

                    event.preventDefault();


                    box.classList.remove(
                        "over"
                    );


                    if (
                        checked ||
                        !draggedWord
                    ) {

                        return;

                    }


                    const english =
                        draggedWord.dataset.word;


                    /* =================================
                       REMOVE FROM OLD TARGET
                    ================================= */

                    Object.keys(
                        placements
                    ).forEach(
                        vi => {

                            if (
                                placements[vi] ===
                                english
                            ) {

                                delete placements[vi];


                                const oldTarget =
                                    document.querySelector(
                                        `.target[data-vi="${CSS.escape(vi)}"]`
                                    );


                                if (oldTarget) {

                                    const oldPlaced =
                                        oldTarget.querySelector(
                                            ".target-word"
                                        );


                                    oldPlaced.textContent =
                                        "Drop here";


                                    oldPlaced.classList.add(
                                        "empty"
                                    );


                                    oldTarget.classList.remove(
                                        "has-word"
                                    );

                                }

                            }

                        }
                    );


                    /* =================================
                       REMOVE EXISTING WORD
                    ================================= */

                    if (
                        placements[vietnamese]
                    ) {

                        const oldEnglish =
                            placements[vietnamese];


                        const oldCard =
                            document.querySelector(
                                `.word[data-word="${CSS.escape(oldEnglish)}"]`
                            );


                        if (oldCard) {

                            oldCard.classList.remove(
                                "placed"
                            );

                        }

                    }


                    /* =================================
                       SAVE PLACEMENT
                    ================================= */

                    placements[vietnamese] =
                        english;


                    placed.textContent =
                        english;


                    placed.classList.remove(
                        "empty"
                    );


                    box.classList.add(
                        "has-word"
                    );


                    draggedWord.classList.add(
                        "placed"
                    );


                    draggedWord =
                        null;


                    updateCheckButton();

                }
            );


            targetsEl.appendChild(
                box
            );

        }
    );


    /* =====================================================
       CREATE ENGLISH WORDS
    ===================================================== */

    shuffle(pairs).forEach(
        pair => {

            const english =
                pair[1];


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "word";


            card.draggable =
                true;


            card.dataset.word =
                english;


            card.textContent =
                english;


            /* =========================================
               DRAG START
            ========================================= */

            card.addEventListener(
                "dragstart",
                () => {

                    if (checked) {
                        return;
                    }


                    draggedWord =
                        card;


                    card.classList.add(
                        "dragging"
                    );

                }
            );


            /* =========================================
               DRAG END
            ========================================= */

            card.addEventListener(
                "dragend",
                () => {

                    card.classList.remove(
                        "dragging"
                    );

                }
            );


            wordsEl.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   UPDATE CHECK BUTTON
========================================================= */

function updateCheckButton() {

    const total =
        rounds[current].pairs.length;


    const placed =
        Object.keys(
            placements
        ).length;


    checkBtn.disabled =
        placed !== total;

}


/* =========================================================
   CHECK ANSWERS
========================================================= */

function checkAnswers() {

    if (checked) {
        return;
    }


    const round =
        rounds[current];


    const total =
        round.pairs.length;


    let correctCount =
        0;


    round.pairs.forEach(
        pair => {

            const vietnamese =
                pair[0];


            const correctEnglish =
                pair[1];


            const selectedEnglish =
                placements[vietnamese];


            const target =
                document.querySelector(
                    `.target[data-vi="${CSS.escape(vietnamese)}"]`
                );


            const card =
                document.querySelector(
                    `.word[data-word="${CSS.escape(selectedEnglish)}"]`
                );


            if (
                selectedEnglish ===
                correctEnglish
            ) {

                correctCount++;


                target.classList.add(
                    "correct"
                );


                if (card) {

                    card.classList.add(
                        "checked-correct"
                    );

                }

            }

            else {

                target.classList.add(
                    "incorrect"
                );


                if (card) {

                    card.classList.add(
                        "checked-incorrect"
                    );

                }

            }

        }
    );


    /* =====================================================
       UPDATE SCORE
    ===================================================== */

    score +=
        correctCount;


    scoreText.textContent =
        `Score: ${score}`;


    /* =====================================================
       LOCK ROUND
    ===================================================== */

    checked =
        true;


    document
        .querySelectorAll(
            ".word"
        )
        .forEach(
            word => {

                word.draggable =
                    false;

                word.style.cursor =
                    "default";

            }
        );


    /* =====================================================
       MESSAGE
    ===================================================== */

    if (
        correctCount ===
        total
    ) {

        messageEl.textContent =
            "🎉 Perfect! All answers are correct.";

        messageEl.style.color =
            "var(--correct)";

    }

    else {

        messageEl.textContent =
            `You got ${correctCount} / ${total} correct.`;

        messageEl.style.color =
            "var(--wrong)";

    }


    /* =====================================================
       EXPLANATION
    ===================================================== */

    showRoundExplanation();


    /* =====================================================
       CHECK → NEXT
    ===================================================== */

    checkBtn.classList.add(
        "hidden"
    );


    nextBtn.classList.remove(
        "hidden"
    );

}


/* =========================================================
   SHOW EXPLANATION
========================================================= */

function showRoundExplanation() {

    const round =
        rounds[current];


    const lines =
        round.pairs.map(
            pair => {

                const vietnamese =
                    pair[0];


                const english =
                    pair[1];


                const data =
                    explanations[
                        vietnamese
                    ];


                return `

                    <div style="margin-bottom:12px;">

                        <strong>
                            ${english}
                        </strong>

                        →

                        <strong>
                            ${vietnamese}
                        </strong>

                        <br>

                        ${
                            data
                            ?
                            data.meaning
                            :
                            ""
                        }

                        ${
                            data
                            ?
                            `
                            <span class="related">

                                Related English words:
                                ${data.related}

                            </span>
                            `
                            :
                            ""
                        }

                    </div>

                `;

            }
        ).join("");


    explanationEl.innerHTML = `

        <strong>
            💡 Learn
        </strong>

        <div style="margin-top:10px;">

            ${lines}

        </div>

    `;


    explanationEl.classList.remove(
        "hidden"
    );

}


/* =========================================================
   CHECK BUTTON
========================================================= */

checkBtn.addEventListener(
    "click",
    checkAnswers
);


/* =========================================================
   NEXT ROUND
========================================================= */

nextBtn.addEventListener(
    "click",
    () => {

        current++;


        if (
            current <
            rounds.length
        ) {

            loadRound();

        }

        else {

            finishGame();

        }

    }
);


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame() {

    gameScreen.style.display =
        "none";


    finalScreen.style.display =
        "block";


    const totalPairs =
        getTotalPairs();


    document.getElementById(
        "finalScore"
    ).textContent =
        `Final Score: ${score} / ${totalPairs}`;


    const percentage =
        Math.round(
            score /
            totalPairs *
            100
        );


    let message =
        "";


    if (
        percentage >= 85
    ) {

        message =
            "🏆 Excellent! You really know these words.";

    }

    else if (
        percentage >= 60
    ) {

        message =
            "🎉 Good job! Keep practicing.";

    }

    else {

        message =
            "📚 Keep practicing. You'll get better.";

    }


    document.getElementById(
        "finalMessage"
    ).textContent =
        `${percentage}% — ${message}`;

}


/* =========================================================
   TOTAL PAIRS
========================================================= */

function getTotalPairs() {

    return rounds.reduce(
        (
            total,
            round
        ) => {

            return total +
                round.pairs.length;

        },
        0
    );

}


/* =========================================================
   RESTART
========================================================= */

function restartGame() {

    current =
        0;

    score =
        0;

    draggedWord =
        null;

    placements =
        {};

    checked =
        false;


    finalScreen.style.display =
        "none";


    gameScreen.style.display =
        "block";


    loadRound();

}


/* =========================================================
   RESTART BUTTON
========================================================= */

restartBtn.addEventListener(
    "click",
    restartGame
);


/* =========================================================
   START GAME
========================================================= */

loadRound();

</script>

</body>
