<style>

/* =========================================================
   COLOR SYSTEM
========================================================= */

:root{

    --accent:#2878df;

    --accent-dark:#1e5fba;

    --accent-light:#eaf3ff;

    --accent-border:#c4daf6;

    --general-border:#d9e6f2;

    --correct:#2878df;

    --correct-light:#eaf3ff;

    --wrong:#d9536f;

    --wrong-light:#fff0f3;

    --text:#263238;

    --muted:#667788;

    --background:#f6f9fc;

    --white:#ffffff;

}


/* =========================================================
   GLOBAL
========================================================= */

*{

    box-sizing:border-box;

}


body{

    margin:0;

    padding:20px;

    background:var(--background);

    min-height:100vh;

    color:var(--text);

    font-family:
        Calibri,
        Arial,
        sans-serif;

}


/* =========================================================
   BACK BUTTON
========================================================= */

.back-btn-container{

    width:min(900px,95vw);

    margin:0 auto 15px;

}


.back-btn{

    display:inline-block;

    padding:9px 17px;

    background:white;

    color:var(--accent);

    border:2px solid var(--accent-border);

    border-radius:10px;

    text-decoration:none;

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-size:21px;

    font-weight:bold;

    transition:.2s;

}


.back-btn:hover{

    background:var(--accent-light);

    border-color:var(--accent);

    color:var(--accent-dark);

    transform:translateY(-2px);

}


/* =========================================================
   MAIN CARD
========================================================= */

.game{

    position:relative;

    width:min(900px,95vw);

    margin:0 auto;

    padding:32px 38px 35px;

    background:var(--white);

    border:1px solid var(--general-border);

    border-radius:22px;

    box-shadow:
        0 8px 28px rgba(40,120,223,.08);

    text-align:center;

    overflow:hidden;

}


/* =========================================================
   ACCENT LINE
========================================================= */

.game::before{

    content:"";

    position:absolute;

    top:0;

    left:0;

    width:100%;

    height:6px;

    background:var(--accent);

}


/* =========================================================
   GAME SCREEN
========================================================= */

#gameScreen{

    display:block;

}


/* =========================================================
   TITLE
========================================================= */

h1{

    margin:0 0 7px;

    font-family:"Kalam", cursive;

    font-size:43px;

    font-weight:700;

    color:var(--accent-dark);

}


.instruction{

    margin:0 auto 24px;

    color:var(--muted);

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-size:24px;

    line-height:1.4;

}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    margin-bottom:18px;

    padding:11px 15px;

    background:#f8fbff;

    border:1px solid var(--general-border);

    border-radius:12px;

    font-size:22px;

    font-weight:bold;

}


.round-text{

    color:var(--muted);

}


.score-text{

    color:var(--accent);

    font-size:24px;

}


/* =========================================================
   SECTION TITLE
========================================================= */

.section-title{

    margin:18px 0 10px;

    color:var(--accent-dark);

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-size:22px;

    font-weight:bold;

}


/* =========================================================
   TARGETS
========================================================= */

.targets{

    display:grid;

    gap:13px;

}


.target{

    min-height:105px;

    padding:12px;

    background:var(--accent-light);

    border:2px dashed var(--accent-border);

    border-radius:14px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    font-size:28px;

    font-weight:bold;

    color:var(--text);

    transition:.2s;

    user-select:none;

}


.target.over{

    transform:scale(1.02);

    background:#deedff;

    border-color:var(--accent);

}


.target.has-word{

    border-style:solid;

    border-color:var(--accent-border);

}


.target.correct{

    background:var(--correct-light);

    border-style:solid;

    border-color:var(--correct);

    color:var(--accent-dark);

}


.target.incorrect{

    background:var(--wrong-light);

    border-style:solid;

    border-color:var(--wrong);

    color:#b53f58;

}


.target-label{

    margin-bottom:7px;

}


.target-word{

    min-height:30px;

    padding:5px 11px;

    border-radius:8px;

    background:white;

    border:2px solid var(--accent-border);

    color:var(--accent-dark);

    font-size:23px;

    font-weight:bold;

}


.target-word.empty{

    background:transparent;

    border:2px dashed #b9cce2;

    color:#91a2b5;

    font-weight:normal;

}


/* =========================================================
   ENGLISH WORDS
========================================================= */

.words{

    display:grid;

    gap:13px;

    margin-top:17px;

}


.word{

    min-height:70px;

    padding:13px;

    background:white;

    border:2px solid var(--accent-border);

    border-radius:14px;

    display:flex;

    align-items:center;

    justify-content:center;

    color:var(--accent-dark);

    font-size:27px;

    font-weight:bold;

    cursor:grab;

    user-select:none;

    touch-action:none;

    transition:.2s;

}


.word:hover{

    background:var(--accent-light);

    border-color:var(--accent);

    transform:translateY(-2px);

}


.word.dragging{

    opacity:.45;

}


.word.placed{

    background:#f5f8fb;

    border-color:#cbd9e6;

    color:#6d7d8c;

}


.word.checked-correct{

    background:var(--correct-light);

    border-color:var(--correct);

    color:var(--accent-dark);

}


.word.checked-incorrect{

    background:var(--wrong-light);

    border-color:var(--wrong);

    color:#b53f58;

}


/* =========================================================
   MESSAGE
========================================================= */

.message{

    min-height:35px;

    margin:19px 0 10px;

    font-size:26px;

    font-weight:bold;

}


/* =========================================================
   EXPLANATION
========================================================= */

.explanation{

    margin:15px auto 20px;

    padding:15px 18px;

    max-width:760px;

    background:#f8fbff;

    border:1px solid var(--accent-border);

    border-left:5px solid var(--accent);

    border-radius:11px;

    color:#4e6072;

    font-size:22px;

    line-height:1.5;

    text-align:left;

}


.explanation strong{

    color:var(--accent-dark);

}


.explanation .related{

    display:block;

    margin-top:4px;

    font-size:20px;

    color:#718293;

}


.hidden{

    display:none !important;

}


/* =========================================================
   BUTTONS
========================================================= */

button{

    border:none;

    border-radius:10px;

    padding:11px 25px;

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-size:23px;

    font-weight:bold;

    cursor:pointer;

    background:var(--accent);

    color:white;

    transition:.2s;

}


button:hover{

    background:var(--accent-dark);

    transform:translateY(-2px);

}


button:disabled{

    opacity:.45;

    cursor:default;

    transform:none;

}


#nextBtn{

    background:var(--accent);

}


/* =========================================================
   FINAL SCREEN
========================================================= */

.final{

    display:none;

    padding:20px 10px;

}


.final h2{

    margin:0 0 15px;

    font-family:"Kalam", cursive;

    font-size:43px;

    color:var(--accent-dark);

}


.final-score{

    font-size:32px;

    margin:15px 0;

    color:var(--text);

}


.final-message{

    font-size:25px;

    margin:15px 0 25px;

    color:var(--muted);

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    body{

        padding:14px;

    }


    .game{

        width:100%;

        padding:28px 18px 30px;

        border-radius:18px;

    }


    h1{

        font-size:37px;

    }


    .instruction{

        font-size:22px;

    }


    .topbar{

        font-size:20px;

    }


    .score-text{

        font-size:22px;

    }


    .target{

        min-height:90px;

        font-size:26px;

    }


    .word{

        min-height:65px;

        font-size:25px;

    }


    .explanation{

        font-size:21px;

    }

}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media(max-width:480px){

    .topbar{

        flex-direction:column;

        gap:5px;

        margin-bottom:18px;

    }


    .target{

        font-size:25px;

    }


    .word{

        font-size:24px;

    }


    button{

        width:100%;

    }

}

</style>

</head>

<script>


/* =========================================================
   GAME DATA
   Describe Things — Size
========================================================= */

const rounds = [

    {
        pairs:[
            ["to","big"],
            ["nhỏ","small"],
            ["dài","long"]
        ]
    },

    {
        pairs:[
            ["cao","tall"],
            ["thấp","short"],
            ["rộng","wide"]
        ]
    },

    {
        pairs:[
            ["chật","tight"],
            ["nặng","heavy"],
            ["nhẹ","light"]
        ]
    },

    {
        pairs:[
            ["to","large"],
            ["nhỏ","tiny"],
            ["cao","high"]
        ]
    },

    {
        pairs:[
            ["dài","long"],
            ["ngắn","short"],
            ["rộng","spacious"]
        ]
    },

    {
        pairs:[
            ["nặng","heavy"],
            ["nhẹ","light"],
            ["chật","cramped"]
        ]
    },

    {
        pairs:[
            ["to","big"],
            ["bự","huge"],
            ["nhỏ","small"]
        ]
    },

    {
        pairs:[
            ["cao","tall"],
            ["thấp","low"],
            ["dài","long"]
        ]
    },

    {
        pairs:[
            ["rộng","wide"],
            ["chật","tight"],
            ["nhẹ","light"]
        ]
    },

    {
        pairs:[
            ["bự","big"],
            ["nặng","heavy"],
            ["ngắn","short"]
        ]
    },

    {
        pairs:[
            ["to","large"],
            ["cao","high"],
            ["rộng","spacious"]
        ]
    },

    {
        pairs:[
            ["nhỏ","tiny"],
            ["thấp","short"],
            ["nhẹ","light"]
        ]
    },

    {
        pairs:[
            ["dài","long"],
            ["ngắn","short"],
            ["nặng","heavy"]
        ]
    },

    {
        pairs:[
            ["bự","huge"],
            ["chật","cramped"],
            ["rộng","wide"]
        ]
    },

    {
        pairs:[
            ["to","big"],
            ["nhỏ","small"],
            ["nặng","heavy"],
            ["nhẹ","light"]
        ]
    },

    {
        pairs:[
            ["cao","tall"],
            ["thấp","low"],
            ["dài","long"],
            ["ngắn","short"]
        ]
    },

    {
        pairs:[
            ["rộng","wide"],
            ["chật","tight"],
            ["to","large"],
            ["nhỏ","tiny"]
        ]
    },

    {
        pairs:[
            ["bự","huge"],
            ["cao","high"],
            ["nặng","heavy"],
            ["nhẹ","light"]
        ]
    },

    {
        pairs:[
            ["dài","long"],
            ["rộng","spacious"],
            ["chật","cramped"],
            ["thấp","low"]
        ]
    },

    {
        pairs:[
            ["to","big"],
            ["bự","huge"],
            ["nhỏ","tiny"],
            ["cao","tall"],
            ["thấp","short"]
        ]
    }

];


/* =========================================================
   EXPLANATIONS
========================================================= */

const explanations = {

    "to":{
        meaning:
            "to means big or large in Vietnamese.",
        related:
            "big, large"
    },

    "nhỏ":{
        meaning:
            "NHỎ means small or little in Vietnamese.",
        related:
            "small, tiny"
    },

    "bự":{
        meaning:
            "BỰ means big or huge. It is commonly used in casual Vietnamese.",
        related:
            "big, huge"
    },

    "dài":{
        meaning:
            "DÀI means long in Vietnamese.",
        related:
            "long"
    },

    "ngắn":{
        meaning:
            "NGẮN means short when talking about length.",
        related:
            "short"
    },

    "cao":{
        meaning:
            "CAO means tall when describing a person, or high when describing a level or position.",
        related:
            "tall, high"
    },

    "thấp":{
        meaning:
            "THẤP means short when describing height, or low when describing a level or position.",
        related:
            "short, low"
    },

    "rộng":{
        meaning:
            "RỘNG means wide, spacious, or having a lot of space.",
        related:
            "wide, spacious"
    },

    "chật":{
        meaning:
            "CHẬT means tight or cramped when there is not enough space.",
        related:
            "tight, cramped"
    },

    "nặng":{
        meaning:
            "NẶNG means heavy in Vietnamese.",
        related:
            "heavy"
    },

    "nhẹ":{
        meaning:
            "NHẸ means light when something does not weigh much.",
        related:
            "light"
    }

};


/* =========================================================
   GAME STATE
========================================================= */

let current = 0;

let score = 0;

let draggedWord = null;

let placements = {};

let checked = false;


/* =========================================================
   DOM
========================================================= */

const targetsEl =
    document.getElementById("targets");

const wordsEl =
    document.getElementById("words");

const messageEl =
    document.getElementById("message");

const explanationEl =
    document.getElementById("explanation");

const checkBtn =
    document.getElementById("checkBtn");

const nextBtn =
    document.getElementById("nextBtn");

const gameScreen =
    document.getElementById("gameScreen");

const finalScreen =
    document.getElementById("finalScreen");


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    const newArray = [...array];

    for(
        let i = newArray.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        [
            newArray[i],
            newArray[j]
        ] = [
            newArray[j],
            newArray[i]
        ];

    }

    return newArray;

}


/* =========================================================
   LOAD ROUND
========================================================= */

function loadRound(){

    placements = {};

    draggedWord = null;

    checked = false;


    messageEl.textContent = "";

    messageEl.style.color = "";


    explanationEl.classList.add(
        "hidden"
    );

    explanationEl.innerHTML = "";


    checkBtn.disabled = true;

    checkBtn.classList.remove(
        "hidden"
    );


    nextBtn.classList.add(
        "hidden"
    );


    const round =
        rounds[current];


    const pairs =
        round.pairs;


    const count =
        pairs.length;


    document.getElementById(
        "roundText"
    ).textContent =
        `Round ${current + 1} / ${rounds.length}`;


    document.getElementById(
        "scoreText"
    ).textContent =
        `Score: ${score}`;


    targetsEl.style.gridTemplateColumns =
        `repeat(${count}, 1fr)`;


    wordsEl.style.gridTemplateColumns =
        `repeat(${count}, 1fr)`;


    targetsEl.innerHTML = "";

    wordsEl.innerHTML = "";


    /* =====================================================
       CREATE VIETNAMESE TARGETS
    ====================================================== */

    shuffle(pairs).forEach(pair => {

        const vietnamese =
            pair[0];


        const box =
            document.createElement("div");


        box.className =
            "target";


        box.dataset.vi =
            vietnamese;


        const label =
            document.createElement("div");


        label.className =
            "target-label";


        label.textContent =
            vietnamese;


        const placed =
            document.createElement("div");


        placed.className =
            "target-word empty";


        placed.textContent =
            "Drop here";


        box.appendChild(label);

        box.appendChild(placed);


        /* =========================================
           DRAG OVER
        ========================================= */

        box.addEventListener(
            "dragover",
            event => {

                if(checked){

                    return;

                }


                event.preventDefault();


                box.classList.add(
                    "over"
                );

            }
        );


        /* =========================================
           DRAG LEAVE
        ========================================= */

        box.addEventListener(
            "dragleave",
            () => {

                box.classList.remove(
                    "over"
                );

            }
        );


        /* =========================================
           DROP
        ========================================= */

        box.addEventListener(
            "drop",
            event => {

                event.preventDefault();

                box.classList.remove(
                    "over"
                );


                if(
                    checked ||
                    !draggedWord
                ){

                    return;

                }


                const english =
                    draggedWord.dataset.word;


                /* =====================================
                   REMOVE WORD FROM PREVIOUS TARGET
                ===================================== */

                Object.keys(placements).forEach(
                    vi => {

                        if(
                            placements[vi] ===
                            english
                        ){

                            delete placements[vi];


                            const oldTarget =
                                document.querySelector(
                                    `.target[data-vi="${CSS.escape(vi)}"]`
                                );


                            if(oldTarget){

                                const oldPlaced =
                                    oldTarget.querySelector(
                                        ".target-word"
                                    );


                                oldPlaced.textContent =
                                    "Drop here";


                                oldPlaced.classList.add(
                                    "empty"
                                );


                                oldTarget.classList.remove(
                                    "has-word"
                                );

                            }

                        }

                    }
                );


                /* =====================================
                   REMOVE EXISTING WORD FROM TARGET
                ===================================== */

                if(
                    placements[vietnamese]
                ){

                    const oldEnglish =
                        placements[vietnamese];


                    const oldCard =
                        document.querySelector(
                            `.word[data-word="${CSS.escape(oldEnglish)}"]`
                        );


                    if(oldCard){

                        oldCard.classList.remove(
                            "placed"
                        );

                    }

                }


                /* =====================================
                   SAVE PLACEMENT
                ===================================== */

                placements[vietnamese] =
                    english;


                placed.textContent =
                    english;


                placed.classList.remove(
                    "empty"
                );


                box.classList.add(
                    "has-word"
                );


                draggedWord.classList.add(
                    "placed"
                );


                draggedWord = null;


                updateCheckButton();

            }
        );


        targetsEl.appendChild(
            box
        );

    });


    /* =====================================================
       CREATE ENGLISH WORDS
    ====================================================== */

    shuffle(pairs).forEach(pair => {

        const english =
            pair[1];


        const card =
            document.createElement("div");


        card.className =
            "word";


        card.draggable =
            true;


        card.dataset.word =
            english;


        card.textContent =
            english;


        /* =========================================
           DRAG START
        ========================================= */

        card.addEventListener(
            "dragstart",
            () => {

                if(checked){

                    return;

                }


                draggedWord =
                    card;


                card.classList.add(
                    "dragging"
                );

            }
        );


        /* =========================================
           DRAG END
        ========================================= */

        card.addEventListener(
            "dragend",
            () => {

                card.classList.remove(
                    "dragging"
                );

            }
        );


        wordsEl.appendChild(
            card
        );

    });

}


/* =========================================================
   UPDATE CHECK BUTTON
========================================================= */

function updateCheckButton(){

    const total =
        rounds[current].pairs.length;


    const placed =
        Object.keys(placements).length;


    checkBtn.disabled =
        placed !== total;

}


/* =========================================================
   CHECK ANSWERS
========================================================= */

function checkAnswers(){

    if(checked){

        return;

    }


    const round =
        rounds[current];


    const total =
        round.pairs.length;


    let correctCount =
        0;


    /* =====================================================
       CHECK EVERY PAIR
    ====================================================== */

    round.pairs.forEach(pair => {

        const vietnamese =
            pair[0];


        const correctEnglish =
            pair[1];


        const selectedEnglish =
            placements[vietnamese];


        const target =
            document.querySelector(
                `.target[data-vi="${CSS.escape(vietnamese)}"]`
            );


        const card =
            document.querySelector(
                `.word[data-word="${CSS.escape(selectedEnglish)}"]`
            );


        if(
            selectedEnglish ===
            correctEnglish
        ){

            correctCount++;


            target.classList.add(
                "correct"
            );


            if(card){

                card.classList.add(
                    "checked-correct"
                );

            }

        }

        else{

            target.classList.add(
                "incorrect"
            );


            if(card){

                card.classList.add(
                    "checked-incorrect"
                );

            }

        }

    });


    /* =====================================================
       UPDATE SCORE
    ====================================================== */

    score += correctCount;


    document.getElementById(
        "scoreText"
    ).textContent =
        `Score: ${score}`;


    /* =====================================================
       LOCK ROUND
    ====================================================== */

    checked = true;


    document
        .querySelectorAll(".word")
        .forEach(word => {

            word.draggable = false;

            word.style.cursor =
                "default";

        });


    /* =====================================================
       RESULT MESSAGE
    ====================================================== */

    if(
        correctCount === total
    ){

        messageEl.textContent =
            "🎉 Perfect! All answers are correct.";

        messageEl.style.color =
            "var(--correct)";

    }

    else{

        messageEl.textContent =
            `You got ${correctCount} / ${total} correct.`;

        messageEl.style.color =
            "var(--wrong)";

    }


    /* =====================================================
       SHOW EXPLANATION
    ====================================================== */

    showRoundExplanation();


    /* =====================================================
       CHECK → NEXT
    ====================================================== */

    checkBtn.classList.add(
        "hidden"
    );


    nextBtn.classList.remove(
        "hidden"
    );

}


/* =========================================================
   SHOW EXPLANATION
========================================================= */

function showRoundExplanation(){

    const round =
        rounds[current];


    const lines =
        round.pairs.map(pair => {

            const vietnamese =
                pair[0];


            const english =
                pair[1];


            const data =
                explanations[vietnamese];


            return `

                <div style="margin-bottom:12px;">

                    <strong>
                        ${english}
                    </strong>

                    →

                    <strong>
                        ${vietnamese}
                    </strong>

                    <br>

                    ${
                        data
                        ?
                        data.meaning
                        :
                        ""
                    }

                    ${
                        data
                        ?
                        `
                        <span class="related">

                            Related English words:
                            ${data.related}

                        </span>
                        `
                        :
                        ""
                    }

                </div>

            `;

        }).join("");


    explanationEl.innerHTML = `

        <strong>
            💡 Learn
        </strong>

        <div style="margin-top:10px;">

            ${lines}

        </div>

    `;


    explanationEl.classList.remove(
        "hidden"
    );

}


/* =========================================================
   CHECK BUTTON
========================================================= */

checkBtn.addEventListener(
    "click",
    () => {

        checkAnswers();

    }
);


/* =========================================================
   NEXT ROUND
========================================================= */

nextBtn.addEventListener(
    "click",
    () => {

        current++;


        if(
            current <
            rounds.length
        ){

            loadRound();

        }

        else{

            finishGame();

        }

    }
);


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

    gameScreen.style.display =
        "none";


    finalScreen.style.display =
        "block";


    const totalPairs =
        getTotalPairs();


    document.getElementById(
        "finalScore"
    ).textContent =
        `Final Score: ${score} / ${totalPairs}`;


    const percentage =
        Math.round(
            score /
            totalPairs *
            100
        );


    let message = "";


    if(
        percentage >= 85
    ){

        message =
            "🏆 Excellent! You really know these words.";

    }

    else if(
        percentage >= 60
    ){

        message =
            "🎉 Good job! Keep practicing.";

    }

    else{

        message =
            "📚 Keep practicing. You'll get better.";

    }


    document.getElementById(
        "finalMessage"
    ).textContent =
        `${percentage}% — ${message}`;

}


/* =========================================================
   TOTAL PAIRS
========================================================= */

function getTotalPairs(){

    return rounds.reduce(
        (
            total,
            round
        ) =>

            total +
            round.pairs.length,

        0
    );

}


/* =========================================================
   RESTART
========================================================= */

function restartGame(){

    current = 0;

    score = 0;

    draggedWord = null;

    placements = {};

    checked = false;


    finalScreen.style.display =
        "none";


    gameScreen.style.display =
        "block";


    loadRound();

}


/* =========================================================
   START
========================================================= */

loadRound();

</script>
