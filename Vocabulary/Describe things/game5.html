.next-btn{

<script>

/* =========================================================
   OPPOSITE PAIRS
   ONLY VOCABULARY FROM DESCRIBE THINGS
========================================================= */

const oppositePairs = [

    {
        words:["to","nhỏ"],
        explanation:"to means big or large. nhỏ means small."
    },

    {
        words:["dài","ngắn"],
        explanation:"dài means long. ngắn means short."
    },

    {
        words:["cao","thấp"],
        explanation:"cao means tall or high. thấp means low or short."
    },

    {
        words:["rộng","chật"],
        explanation:"rộng means wide or spacious. chật means tight or cramped."
    },

    {
        words:["nặng","nhẹ"],
        explanation:"nặng means heavy. nhẹ means light."
    },

    {
        words:["cứng","mềm"],
        explanation:"cứng means hard. mềm means soft."
    },

    {
        words:["nóng","lạnh"],
        explanation:"nóng means hot. lạnh means cold."
    },

    {
        words:["khô","ướt"],
        explanation:"khô means dry. ướt means wet."
    },

    {
        words:["mới","cũ"],
        explanation:"mới means new. cũ means old."
    },

    {
        words:["sạch","dơ"],
        explanation:"sạch means clean. dơ means dirty."
    },

    {
        words:["đẹp","xấu"],
        explanation:"đẹp means beautiful or pretty. xấu means ugly."
    },

    {
        words:["trẻ","già"],
        explanation:"trẻ means young. già means old."
    },

    {
        words:["ốm","mập"],
        explanation:"ốm means thin or skinny. mập means fat or chubby."
    },

    {
        words:["nhiều","ít"],
        explanation:"nhiều means many or much. ít means few or little."
    }

];


/* =========================================================
   CREATE QUESTION DATABASE
========================================================= */

const database = [];


oppositePairs.forEach(pair => {

    database.push({

        question:pair.words[0],

        answer:pair.words[1],

        explanation:pair.explanation

    });


    database.push({

        question:pair.words[1],

        answer:pair.words[0],

        explanation:pair.explanation

    });

});


/* =========================================================
   ALL VOCABULARY
========================================================= */

const allWords = [

    "to",
    "nhỏ",
    "bự",
    "dài",
    "ngắn",
    "cao",
    "thấp",
    "rộng",
    "chật",
    "nặng",
    "nhẹ",

    "cứng",
    "mềm",
    "nóng",
    "lạnh",
    "khô",
    "ướt",

    "mới",
    "cũ",
    "sạch",
    "dơ",

    "tròn",
    "vuông",
    "thẳng",
    "cong",
    "nhọn",
    "xoăn",

    "đẹp",
    "xấu",
    "dễ thương",
    "xinh",
    "dữ",
    "nghiêm túc",
    "trẻ",
    "già",
    "ốm",
    "mập",

    "nhiều",
    "ít"

];


/* =========================================================
   STATE
========================================================= */

let questions = [];

let currentQuestion = 0;

let score = 0;

let answered = false;


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    const arr = [...array];


    for(
        let i = arr.length - 1;

        i > 0;

        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] = [
            arr[j],
            arr[i]
        ];

    }


    return arr;

}


/* =========================================================
   CREATE OPTIONS
========================================================= */

function createOptions(correctWord){

    const wrongWords =

        shuffle(
            allWords.filter(
                word =>
                    word !== correctWord
            )
        )
        .slice(0,3);


    return shuffle([

        correctWord,

        ...wrongWords

    ]);

}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    questions =

        shuffle(database)
        .slice(0,20);


    currentQuestion = 0;

    score = 0;

    answered = false;


    document
        .getElementById("score")
        .textContent =
        "0";


    document
        .getElementById("totalQuestions")
        .textContent =
        questions.length;


    document
        .getElementById("game")
        .style.display =
        "block";


    document
        .getElementById("final")
        .style.display =
        "none";


    loadQuestion();

}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion(){

    answered = false;


    const question =
        questions[currentQuestion];


    document
        .getElementById("questionNumber")
        .textContent =
        currentQuestion + 1;


    document
        .getElementById("totalQuestions")
        .textContent =
        questions.length;


    document
        .getElementById("progress")
        .style.width =
        (
            currentQuestion /
            questions.length *
            100
        ) + "%";


    document
        .getElementById("questionText")
        .textContent =
        question.question;


    document
        .getElementById("resultText")
        .textContent =
        "";


    document
        .getElementById("resultText")
        .className =
        "result-message";


    document
        .getElementById("explanationBox")
        .classList.remove(
            "show"
        );


    document
        .getElementById("explanationText")
        .textContent =
        "";


    const nextBtn =
        document.getElementById(
            "nextBtn"
        );


    nextBtn.style.display =
        "none";


    nextBtn.textContent =

        currentQuestion ===
        questions.length - 1

        ? "Finish 🎉"

        : "Next →";


    /* =====================================================
       OPTIONS
    ====================================================== */

    const container =
        document.getElementById(
            "optionsContainer"
        );


    container.innerHTML =
        "";


    const options =
        createOptions(
            question.answer
        );


    options.forEach(option => {


        const button =
            document.createElement(
                "button"
            );


        button.className =
            "option-btn";


        button.textContent =
            option;


        button.onclick = () =>
            handleAnswer(
                button,
                option
            );


        container.appendChild(
            button
        );

    });

}


/* =========================================================
   HANDLE ANSWER
========================================================= */

function handleAnswer(
    button,
    selected
){

    if(answered){

        return;

    }


    answered = true;


    const question =
        questions[currentQuestion];


    const optionButtons =
        document.querySelectorAll(
            ".option-btn"
        );


    /* =====================================================
       CORRECT
    ====================================================== */

    if(
        selected ===
        question.answer
    ){

        button.classList.add(
            "correct"
        );


        score++;


        document
            .getElementById("score")
            .textContent =
            score;


        document
            .getElementById("resultText")
            .textContent =
            "✓ Correct!";


        document
            .getElementById("resultText")
            .className =
            "result-message correct-text";

    }


    /* =====================================================
       WRONG
    ====================================================== */

    else{

        button.classList.add(
            "wrong"
        );


        document
            .getElementById("resultText")
            .textContent =
            "✗ Wrong!";


        document
            .getElementById("resultText")
            .className =
            "result-message wrong-text";


        optionButtons.forEach(btn => {

            if(
                btn.textContent ===
                question.answer
            ){

                btn.classList.add(
                    "correct"
                );

            }

        });

    }


    /* =====================================================
       DISABLE ALL OPTIONS
    ====================================================== */

    optionButtons.forEach(btn => {

        btn.classList.add(
            "disabled"
        );

    });


    /* =====================================================
       EXPLANATION
    ====================================================== */

    document
        .getElementById("explanationText")
        .innerHTML =
        `
        <span class="correct-answer">
            ${question.question}
        </span>

        → opposite:

        <span class="correct-answer">
            ${question.answer}
        </span>

        <br>

        ${question.explanation}
        `;


    document
        .getElementById("explanationBox")
        .classList.add(
            "show"
        );


    /* =====================================================
       SHOW NEXT
    ====================================================== */

    document
        .getElementById("nextBtn")
        .style.display =
        "block";

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion(){

    if(!answered){

        return;

    }


    currentQuestion++;


    if(
        currentQuestion <
        questions.length
    ){

        loadQuestion();

    }

    else{

        finishGame();

    }

}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

    document
        .getElementById("progress")
        .style.width =
        "100%";


    document
        .getElementById("game")
        .style.display =
        "none";


    document
        .getElementById("final")
        .style.display =
        "block";


    document
        .getElementById("finalScore")
        .textContent =

        score +
        " / " +
        questions.length;


    const percent =
        Math.round(
            score /
            questions.length *
            100
        );


    let message;


    if(percent === 100){

        message =
            "🏆 Perfect! You know your Vietnamese opposites.";

    }

    else if(percent >= 80){

        message =
            "🎉 Excellent! Keep practicing your Vietnamese.";

    }

    else if(percent >= 60){

        message =
            "👍 Good job! You're getting better.";

    }

    else{

        message =
            "📚 Keep practicing these Vietnamese opposite words.";

    }


    document
        .getElementById("finalMessage")
        .textContent =
        message;


    if (
        typeof trackGameComplete ===
        "function"
    ) {
        trackGameComplete(
            "Describe Things - Game 5",
            score,
            questions.length
        );
    }

}

/* =========================================================
