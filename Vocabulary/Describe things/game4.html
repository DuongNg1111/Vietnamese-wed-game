<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Describe Things</title>

<meta
    name="game-title"
    content="Describe Things"
>

<meta
    name="game-description"
    content="Choose the Vietnamese word that best describes a person or thing."
>

<meta
    name="game-icon"
    content="✨"
>


<!-- =========================================================
     GOOGLE FONTS
========================================================= -->

<link
    href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap"
    rel="stylesheet"
>


<style>
/* =========================================================
   RESET
========================================================= */

*{

    box-sizing:border-box;

}
:root {

    --accent: #548C9F;
    --accent-dark: #3B6370;
    --accent-light: #e9f3f7;
    --accent-bg: #F2F8FA;
    --accent-border: #bcdae5;
    --general-border: #d9e6f2;

    --white: #ffffff;
    --ink:
        #143a6b;

    --ink-soft:
        #66809d;

}

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
}


body{

    margin:0;

    min-height:100vh;

    padding: 28px 20px 45px;

    font-family:
        Calibri, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

    background: linear-gradient(
            180deg,
            #ffffff 0%,
            var(--accent-bg) 48%,
            var(--accent-light) 100%
        );


    color:var(--text);

}

/* =========================================================
   BACK BUTTON
========================================================= */

.back-btn-container {

    width: min(900px, 95vw);

    margin: 0 auto 15px;

}


.back-btn {

    display: inline-block;

    padding: 9px 16px;

    background: var(--white);

    color: #3B6370;

    border: 2px solid #bcdae5;

    border-radius: 10px;

    text-decoration: none;

    font-size: 22px;

    font-weight: bold;

    transition: .2s;

}


.back-btn:hover {

    background:var(--white);

    border-color: #548C9F;

    color: #3B6370;

    transform: translateY(-2px);

}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.container {

    position: relative;

    width: min(900px, 95vw);

    margin: 0 auto;

    background: var(--white);

    border-radius: 22px;

    padding: 30px 35px 35px;

    box-shadow:
        0 8px 28px rgba(59, 99, 112, .12);

    overflow: hidden;

}


/* =========================================================
   ACCENT LINE
========================================================= */

.container::before {

    content: "";

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 6px;

    background: #548C9F;

}


/* =========================================================
   GAME
========================================================= */

.game {

    width: 100%;

}


/* =========================================================
   TITLE
========================================================= */

.title {

    margin: 5px 0 4px;

    text-align: center;

    font-family:
        "Kalam",
        cursive;

    font-size: 42px;

    font-weight: 700;

    color: var(--ink);

}


/* =========================================================
   SHORT GAME DESCRIPTION
========================================================= */

.instruction {

    max-width: 760px;

    margin: 0 auto 22px;

    text-align: center;

    color: #667085;

    font-size: 25px;

    line-height: 1.4;

}


/* =========================================================
   TOP BAR
========================================================= */

.topbar {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;

    margin-bottom: 12px;

    font-size: 24px;

    font-weight: bold;

}


.question-count {

    color: #667085;

}


.score {

    color: #3B6370;

    font-size: 27px;

}


/* =========================================================
   PROGRESS
========================================================= */

.progress-wrap {

    width: 100%;

    height: 8px;

    background: #e9f3f7;

    border-radius: 20px;

    overflow: hidden;

    margin-bottom: 25px;

    border: 1px solid #bcdae5;

}


.progress {

    width: 0%;

    height: 100%;

    background: #548C9F;

    transition: .3s;

}


/* =========================================================
   QUESTION LABEL
========================================================= */

.question-label {

    margin: 5px 0 8px;

    text-align: center;

    color: #548C9F;

    font-size: 21px;

    font-weight: bold;

    letter-spacing: .6px;

}


/* =========================================================
   QUESTION
========================================================= */

.question {

    max-width: 760px;

    margin: 0 auto;

    text-align: center;

    font-size: 32px;

    font-weight: bold;

    line-height: 1.5;

    color: #26354a;

}


/* =========================================================
   ANSWERS
========================================================= */

.answers {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 13px;

    margin-top: 28px;

}


.answer-btn {

    min-height: 66px;

    padding: 13px 16px;

    border: 2px solid #d9e6f2;

    border-radius: 12px;

    background: #F5F5F5;

    color: #26354a;

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-size: 28px;

    font-weight: bold;

    cursor: pointer;

    transition: .2s;

}


.answer-btn:hover:not(:disabled) {

    background: #e9f3f7;

    border-color: #548C9F;

    color: #3B6370;

    transform: translateY(-2px);

}


/* =========================================================
   CORRECT ANSWER
========================================================= */

.answer-btn.correct {

    background: #eaf3ff;

    border-color: #019b3f;

    color: #019b3f;

}


/* =========================================================
   WRONG ANSWER
========================================================= */

.answer-btn.wrong {

    background: #fff0f3;

    border-color: #d9536f;

    color: #d9536f;

}


.answer-btn:disabled {

    cursor: default;

}


/* =========================================================
   EXPLANATION / FEEDBACK
========================================================= */

.result-message {

    min-height: 38px;

    margin-top: 20px;

    text-align: center;

    font-size: 25px;

    font-weight: bold;

    line-height: 1.5;

}


.correct-text {

    color: #019b3f;

}


.wrong-text {

    color: #d9536f;

}


/* =========================================================
   NEXT BUTTON
========================================================= */

.next-btn {

    display: none;

    margin: 5px auto 0;

    padding: 11px 27px;

    border: none;

    border-radius: 11px;

    background: #548C9F;

    color: #F5F5F5;

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-size: 25px;

    font-weight: bold;

    cursor: pointer;

    transition: .2s;

}


.next-btn.show {

    display: block;

}


.next-btn:hover {

    background: #3B6370;

    transform: translateY(-2px);

}


/* =========================================================
   FINAL SCREEN
========================================================= */

#final {

    display: none;

    text-align: center;

    padding: 25px 10px 10px;

}


.finish-icon {

    font-size: 70px;

    margin-bottom: 5px;

}


#final h2 {

    margin: 5px 0 15px;

    font-family:
        "Kalam",
        cursive;

    font-size: 42px;

    color: #3B6370;

}


.final-score {

    font-size: 48px;

    font-weight: bold;

    color: #548C9F;

    margin: 20px 0;

}


.final-message {

    color: #667085;

    font-size: 26px;

    line-height: 1.5;

    margin-bottom: 25px;

}


.start-btn {

    padding: 12px 28px;

    border: none;

    border-radius: 11px;

    background: #548C9F;

    color: #F5F5F5;

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-size: 25px;

    font-weight: bold;

    cursor: pointer;

    transition: .2s;

}


.start-btn:hover {

    background: #3B6370;

    transform: translateY(-2px);

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width: 600px) {

    body {

        padding: 20px 12px;

    }


    .back-btn-container {

        width: 100%;

    }


    .container {

        width: 100%;

        padding: 25px 17px 25px;

        border-radius: 19px;

    }


    .back-btn {

        font-size: 21px;

    }


    .title {

        font-size: 36px;

        line-height: 1.2;

    }


    .instruction {

        font-size: 23px;

    }


    .topbar {

        font-size: 22px;

    }


    .score {

        font-size: 25px;

    }


    .question-label {

        font-size: 20px;

    }


    .question {

        font-size: 28px;

    }


    .answers {

        grid-template-columns: 1fr;

    }


    .answer-btn {

        min-height: 58px;

        font-size: 26px;

    }


    .result-message {

        font-size: 23px;

    }


    .next-btn {

        width: 100%;

    }


    #final h2 {

        font-size: 37px;

    }


    .final-score {

        font-size: 42px;

    }


    .final-message {

        font-size: 23px;

    }


    .start-btn {

        width: 100%;

    }

}

</style>

</head>


<body>


<!-- =========================================================
     BACK BUTTON
========================================================= -->

<div class="back-btn-container">

    <a
        href="../../category.html?category=Describe%20things"
        class="back-btn"
    >

        ← Back

    </a>

</div>



<!-- =========================================================
     MAIN CONTAINER
========================================================= -->

<div class="container">


<!-- =========================================================
     GAME SCREEN
========================================================= -->

<div
    id="game"
    class="game"
>


    <!-- =====================================================
         TITLE
    ====================================================== -->

    <h1 class="title">

        ✨ Describe Things

    </h1>


    <!-- =====================================================
         SHORT DESCRIPTION
    ====================================================== -->

    <p class="instruction">

        Read the situation and choose the
        Vietnamese word that best describes
        the person or thing.

    </p>


    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <div class="topbar">


        <div class="question-count">

            Question

            <span id="questionNumber">
                1
            </span>

            /

            <span id="totalQuestions">
                12
            </span>

        </div>


        <div class="score">

            Score:

            <span id="score">
                0
            </span>

        </div>


    </div>


    <!-- =====================================================
         PROGRESS
    ====================================================== -->

    <div class="progress-wrap">

        <div
            class="progress"
            id="progress"
        ></div>

    </div>


    <!-- =====================================================
         QUESTION LABEL
    ====================================================== -->

    <div class="question-label">

        CHOOSE THE BEST WORD

    </div>


    <!-- =====================================================
         QUESTION
    ====================================================== -->

    <div
        class="question"
        id="question"
    ></div>


    <!-- =====================================================
         ANSWERS
    ====================================================== -->

    <div
        class="answers"
        id="answers"
    ></div>


    <!-- =====================================================
         RESULT / EXPLANATION
    ====================================================== -->

    <div
        class="result-message"
        id="resultText"
    ></div>


    <!-- =====================================================
         NEXT
    ====================================================== -->

    <button
        class="next-btn"
        id="nextBtn"
        onclick="nextQuestion()"
    >

        Next →

    </button>


</div>



<!-- =========================================================
     FINAL SCREEN
========================================================= -->

<div
    id="final"
>


    <div class="finish-icon">

        🎉

    </div>


    <h2>

        Game Complete!

    </h2>


    <p class="final-message">

        You completed Describe Things.

    </p>


    <div class="final-score">

        Score:

        <span id="finalScore">

            0 / 12

        </span>

    </div>


    <p
        class="final-message"
        id="finalMessage"
    ></p>


    <button
        class="start-btn"
        onclick="restartGame()"
    >

        Play Again

    </button>


</div>


</div>



<script>

/* =========================================================
   QUESTION DATABASE
   12 QUESTIONS
========================================================= */

const questionBank = [

    /* ======================================================
       SIZE
    ====================================================== */

    {
        question:
            "The elephant is very big. Which Vietnamese word describes it?",

        answers: [
            "nhỏ",
            "to",
            "ngắn",
            "nhẹ"
        ],

        correct:
            "to",

        phonetic:
            "taw"
    },


    {
        question:
            "The phone is small. Which word describes the phone?",

        answers: [
            "rộng",
            "cao",
            "nhỏ",
            "nặng"
        ],

        correct:
            "nhỏ",

        phonetic:
            "nyo"
    },


    {
        question:
            "The table is long. Which Vietnamese word describes it?",

        answers: [
            "dài",
            "thấp",
            "chật",
            "mềm"
        ],

        correct:
            "dài",

        phonetic:
            "zai"
    },


    /* ======================================================
       FEEL & TEXTURE
    ====================================================== */

    {
        question:
            "The rock is hard. Which Vietnamese word describes it?",

        answers: [
            "mềm",
            "ướt",
            "cứng",
            "khô"
        ],

        correct:
            "cứng",

        phonetic:
            "koong"
    },


    {
        question:
            "The pillow is soft. Which word describes the pillow?",

        answers: [
            "cứng",
            "mềm",
            "nặng",
            "thẳng"
        ],

        correct:
            "mềm",

        phonetic:
            "mem"
    },


    {
        question:
            "The towel is wet. Which Vietnamese word describes it?",

        answers: [
            "khô",
            "ướt",
            "cứng",
            "nhọn"
        ],

        correct:
            "ướt",

        phonetic:
            "oot"
    },


    /* ======================================================
       CONDITION
    ====================================================== */

    {
        question:
            "This shirt was just bought. It is new. Which word describes it?",

        answers: [
            "cũ",
            "sạch",
            "mới",
            "dơ"
        ],

        correct:
            "mới",

        phonetic:
            "moi"
    },


    {
        question:
            "These shoes are dirty. Which Vietnamese word describes them?",

        answers: [
            "mới",
            "sạch",
            "dơ",
            "nhẹ"
        ],

        correct:
            "dơ",

        phonetic:
            "zơ"
    },


    {
        question:
            "The room is clean. Which word describes the room?",

        answers: [
            "dơ",
            "cũ",
            "sạch",
            "chật"
        ],

        correct:
            "sạch",

        phonetic:
            "sach"
    },


    /* ======================================================
       SHAPE
    ====================================================== */

    {
        question:
            "A ball is round. Which Vietnamese word describes its shape?",

        answers: [
            "vuông",
            "cong",
            "tròn",
            "thẳng"
        ],

        correct:
            "tròn",

        phonetic:
            "chon"
    },


    {
        question:
            "A window has four equal sides. It is square. Which word describes it?",

        answers: [
            "tròn",
            "vuông",
            "xoăn",
            "nhọn"
        ],

        correct:
            "vuông",

        phonetic:
            "voong"
    },


    {
        question:
            "A pencil is straight. Which Vietnamese word describes it?",

        answers: [
            "cong",
            "thẳng",
            "tròn",
            "chật"
        ],

        correct:
            "thẳng",

        phonetic:
            "tang"
    }

];


/* =========================================================
   STATE
========================================================= */

let questions = [];

let currentQuestion = 0;

let score = 0;

let answered = false;


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array) {

    const arr = [...array];


    for (
        let i = arr.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] = [
            arr[j],
            arr[i]
        ];

    }


    return arr;

}


/* =========================================================
   START GAME
========================================================= */

function startGame() {

    questions =
        shuffle(questionBank);


    currentQuestion = 0;

    score = 0;

    answered = false;


    document
        .getElementById("score")
        .textContent =
        "0";


    document
        .getElementById("totalQuestions")
        .textContent =
        questions.length;


    document
        .getElementById("game")
        .style.display =
        "block";


    document
        .getElementById("final")
        .style.display =
        "none";


    loadQuestion();

}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion() {

    answered = false;


    const question =
        questions[currentQuestion];


    document
        .getElementById("questionNumber")
        .textContent =
        currentQuestion + 1;


    document
        .getElementById("totalQuestions")
        .textContent =
        questions.length;


    document
        .getElementById("progress")
        .style.width =
        (
            currentQuestion /
            questions.length *
            100
        ) + "%";


    document
        .getElementById("question")
        .textContent =
        question.question;


    const resultText =
        document.getElementById(
            "resultText"
        );


    resultText.textContent =
        "";


    resultText.className =
        "result-message";


    const nextBtn =
        document.getElementById(
            "nextBtn"
        );


    nextBtn.classList.remove(
        "show"
    );


    nextBtn.textContent =

        currentQuestion ===
        questions.length - 1

        ? "Finish 🎉"

        : "Next →";


    /* =====================================================
       ANSWER BUTTONS
    ====================================================== */

    const answersContainer =
        document.getElementById(
            "answers"
        );


    answersContainer.innerHTML =
        "";


    const shuffledAnswers =
        shuffle(
            question.answers
        );


    shuffledAnswers.forEach(
        answer => {


            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "answer-btn";


            button.textContent =
                answer;


            button.onclick = () => {

                checkAnswer(
                    button,
                    answer,
                    question
                );

            };


            answersContainer.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   CHECK ANSWER
========================================================= */

function checkAnswer(
    selectedButton,
    selectedAnswer,
    question
) {

    if (answered) {

        return;

    }


    answered = true;


    const buttons =
        document.querySelectorAll(
            ".answer-btn"
        );


    /* =====================================================
       LOCK ALL ANSWERS
    ====================================================== */

    buttons.forEach(
        button => {

            button.disabled =
                true;

        }
    );


    /* =====================================================
       CORRECT
    ====================================================== */

    if (
        selectedAnswer ===
        question.correct
    ) {

        score++;


        document
            .getElementById("score")
            .textContent =
            score;


        selectedButton.classList.add(
            "correct"
        );


        document
            .getElementById("resultText")
            .textContent =
            `✓ Correct! ${question.correct} / ${question.phonetic}`;


        document
            .getElementById("resultText")
            .className =
            "result-message correct-text";

    }


    /* =====================================================
       WRONG
    ====================================================== */

    else {

        selectedButton.classList.add(
            "wrong"
        );


        buttons.forEach(
            button => {

                if (
                    button.textContent ===
                    question.correct
                ) {

                    button.classList.add(
                        "correct"
                    );

                }

            }
        );


        document
            .getElementById("resultText")
            .textContent =
            `✗ Not quite. The answer is ${question.correct} / ${question.phonetic}`;


        document
            .getElementById("resultText")
            .className =
            "result-message wrong-text";

    }


    /* =====================================================
       SHOW NEXT
    ====================================================== */

    document
        .getElementById("nextBtn")
        .classList.add(
            "show"
        );

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion() {

    currentQuestion++;


    if (
        currentQuestion <
        questions.length
    ) {

        loadQuestion();

    }

    else {

        finishGame();

    }

}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame() {

    document
        .getElementById("progress")
        .style.width =
        "100%";


    document
        .getElementById("game")
        .style.display =
        "none";


    document
        .getElementById("final")
        .style.display =
        "block";


    document
        .getElementById("finalScore")
        .textContent =

        score +
        " / " +
        questions.length;


    const percent =
        Math.round(
            score /
            questions.length *
            100
        );


    let message;


    if (percent === 100) {

        message =
            "🏆 Perfect! You can describe things in Vietnamese really well.";

    }

    else if (percent >= 80) {

        message =
            "🎉 Excellent! You have a great understanding of Vietnamese descriptive words.";

    }

    else if (percent >= 60) {

        message =
            "👍 Good job! Keep practicing these Vietnamese descriptive words.";

    }

    else {

        message =
            "📚 Keep practicing these descriptive words and their meanings.";

    }


    document
        .getElementById("finalMessage")
        .textContent =
        message;

}


/* =========================================================
   RESTART
========================================================= */

function restartGame() {

    startGame();

}


/* =========================================================
   INITIALIZE
========================================================= */

startGame();

</script>

</body>

</html>
