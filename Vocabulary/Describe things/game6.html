<script>

/* =========================================================
   QUESTION DATABASE
   ONLY DESCRIBE THINGS VOCABULARY
   WEATHER EXCLUDED
========================================================= */

const database = [

    /* =========================
       SIZE
    ========================= */

    {
        question:"The box is big.",
        answer:"to",
        meaning:"big, large"
    },

    {
        question:"The cup is small.",
        answer:"nhỏ",
        meaning:"small"
    },

    {
        question:"The table is very big.",
        answer:"bự",
        meaning:"big, huge"
    },

    {
        question:"The road is long.",
        answer:"dài",
        meaning:"long"
    },

    {
        question:"The pencil is short.",
        answer:"ngắn",
        meaning:"short"
    },

    {
        question:"The building is tall.",
        answer:"cao",
        meaning:"tall, high"
    },

    {
        question:"The table is low.",
        answer:"thấp",
        meaning:"low, short"
    },

    {
        question:"The room is spacious.",
        answer:"rộng",
        meaning:"wide, spacious"
    },

    {
        question:"The room is cramped.",
        answer:"chật",
        meaning:"tight, cramped"
    },

    {
        question:"The bag is heavy.",
        answer:"nặng",
        meaning:"heavy"
    },

    {
        question:"The box is light.",
        answer:"nhẹ",
        meaning:"light"
    },


    /* =========================
       FEEL & TEXTURE
    ========================= */

    {
        question:"The table is hard.",
        answer:"cứng",
        meaning:"hard"
    },

    {
        question:"The pillow is soft.",
        answer:"mềm",
        meaning:"soft"
    },

    {
        question:"The coffee is hot.",
        answer:"nóng",
        meaning:"hot"
    },

    {
        question:"The water is cold.",
        answer:"lạnh",
        meaning:"cold"
    },

    {
        question:"The towel is dry.",
        answer:"khô",
        meaning:"dry"
    },

    {
        question:"The floor is wet.",
        answer:"ướt",
        meaning:"wet"
    },


    /* =========================
       CONDITION
    ========================= */

    {
        question:"This shirt is new.",
        answer:"mới",
        meaning:"new"
    },

    {
        question:"This phone is old.",
        answer:"cũ",
        meaning:"old"
    },

    {
        question:"The room is clean.",
        answer:"sạch",
        meaning:"clean"
    },

    {
        question:"The shoes are dirty.",
        answer:"dơ",
        meaning:"dirty"
    },


    /* =========================
       SHAPE
    ========================= */

    {
        question:"The ball is round.",
        answer:"tròn",
        meaning:"round"
    },

    {
        question:"The window is square.",
        answer:"vuông",
        meaning:"square"
    },

    {
        question:"The road is straight.",
        answer:"thẳng",
        meaning:"straight"
    },

    {
        question:"The line is curved.",
        answer:"cong",
        meaning:"curved, bent"
    },

    {
        question:"The knife is sharp.",
        answer:"nhọn",
        meaning:"pointed, sharp"
    },

    {
        question:"Her hair is curly.",
        answer:"xoăn",
        meaning:"curly"
    },


    /* =========================
       APPEARANCE
    ========================= */

    {
        question:"The dress is beautiful.",
        answer:"đẹp",
        meaning:"beautiful, pretty"
    },

    {
        question:"The picture is ugly.",
        answer:"xấu",
        meaning:"ugly"
    },

    {
        question:"The baby is cute.",
        answer:"dễ thương",
        meaning:"cute"
    },

    {
        question:"She is pretty.",
        answer:"xinh",
        meaning:"pretty, lovely"
    },

    {
        question:"The dog looks fierce.",
        answer:"dữ",
        meaning:"fierce, mean"
    },

    {
        question:"He looks serious.",
        answer:"nghiêm túc",
        meaning:"serious"
    },

    {
        question:"The boy is young.",
        answer:"trẻ",
        meaning:"young"
    },

    {
        question:"The man is old.",
        answer:"già",
        meaning:"old"
    },

    {
        question:"He is skinny.",
        answer:"ốm",
        meaning:"thin, skinny"
    },

    {
        question:"The child is chubby.",
        answer:"mập",
        meaning:"fat, chubby"
    },


    /* =========================
       QUANTITY
    ========================= */

    {
        question:"There are many books.",
        answer:"nhiều",
        meaning:"many, much"
    },

    {
        question:"There are only a few apples.",
        answer:"ít",
        meaning:"few, little"
    }

];



/* =========================================================
   ALL VOCABULARY
========================================================= */

const allWords = [

    "to",
    "nhỏ",
    "bự",
    "dài",
    "ngắn",
    "cao",
    "thấp",
    "rộng",
    "chật",
    "nặng",
    "nhẹ",

    "cứng",
    "mềm",
    "nóng",
    "lạnh",
    "khô",
    "ướt",

    "mới",
    "cũ",
    "sạch",
    "dơ",

    "tròn",
    "vuông",
    "thẳng",
    "cong",
    "nhọn",
    "xoăn",

    "đẹp",
    "xấu",
    "dễ thương",
    "xinh",
    "dữ",
    "nghiêm túc",
    "trẻ",
    "già",
    "ốm",
    "mập",

    "nhiều",
    "ít"

];



/* =========================================================
   STATE
========================================================= */

let questions = [];

let currentQuestion = 0;

let score = 0;

let answered = false;



/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    const arr = [...array];


    for(
        let i = arr.length - 1;

        i > 0;

        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] = [
            arr[j],
            arr[i]
        ];

    }


    return arr;

}



/* =========================================================
   CREATE OPTIONS
========================================================= */

function createOptions(correctWord){

    const wrongWords =

        shuffle(
            allWords.filter(
                word =>
                    word !== correctWord
            )
        )
        .slice(0,3);


    return shuffle([

        correctWord,

        ...wrongWords

    ]);

}



/* =========================================================
   START GAME
========================================================= */

function startGame(){

    questions =

        shuffle(database)
        .slice(0,20);


    currentQuestion = 0;

    score = 0;

    answered = false;


    document
        .getElementById("score")
        .textContent =
        "0";


    document
        .getElementById("totalQuestions")
        .textContent =
        questions.length;


    document
        .getElementById("game")
        .style.display =
        "block";


    document
        .getElementById("final")
        .style.display =
        "none";


    loadQuestion();

}



/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion(){

    answered = false;


    const question =
        questions[currentQuestion];


    document
        .getElementById("questionNumber")
        .textContent =
        currentQuestion + 1;


    document
        .getElementById("totalQuestions")
        .textContent =
        questions.length;


    document
        .getElementById("progress")
        .style.width =
        (
            currentQuestion /
            questions.length *
            100
        ) + "%";


    document
        .getElementById("questionText")
        .textContent =
        question.question;


    document
        .getElementById("resultText")
        .textContent =
        "";


    document
        .getElementById("resultText")
        .className =
        "result-message";


    document
        .getElementById("explanationBox")
        .classList.remove(
            "show"
        );


    document
        .getElementById("explanationText")
        .textContent =
        "";


    const nextBtn =
        document.getElementById(
            "nextBtn"
        );


    nextBtn.style.display =
        "none";


    nextBtn.textContent =

        currentQuestion ===
        questions.length - 1

        ? "Finish 🎉"

        : "Next →";



    /* =====================================================
       OPTIONS
    ====================================================== */

    const container =
        document.getElementById(
            "optionsContainer"
        );


    container.innerHTML =
        "";


    const options =
        createOptions(
            question.answer
        );


    options.forEach(option => {


        const button =
            document.createElement(
                "button"
            );


        button.className =
            "option-btn";


        button.textContent =
            option;


        button.onclick = () =>
            handleAnswer(
                button,
                option
            );


        container.appendChild(
            button
        );

    });

}



/* =========================================================
   HANDLE ANSWER
========================================================= */

function handleAnswer(
    button,
    selected
){

    if(answered){

        return;

    }


    answered = true;


    const question =
        questions[currentQuestion];


    const optionButtons =
        document.querySelectorAll(
            ".option-btn"
        );


    /* =====================================================
       CORRECT
    ====================================================== */

    if(
        selected ===
        question.answer
    ){

        button.classList.add(
            "correct"
        );


        score++;


        document
            .getElementById("score")
            .textContent =
            score;


        document
            .getElementById("resultText")
            .textContent =
            "✓ Correct!";


        document
            .getElementById("resultText")
            .className =
            "result-message correct-text";

    }


    /* =====================================================
       WRONG
    ====================================================== */

    else{

        button.classList.add(
            "wrong"
        );


        document
            .getElementById("resultText")
            .textContent =
            "✗ Wrong!";


        document
            .getElementById("resultText")
            .className =
            "result-message wrong-text";


        optionButtons.forEach(btn => {

            if(
                btn.textContent ===
                question.answer
            ){

                btn.classList.add(
                    "correct"
                );

            }

        });

    }



    /* =====================================================
       DISABLE ALL OPTIONS
    ====================================================== */

    optionButtons.forEach(btn => {

        btn.classList.add(
            "disabled"
        );

    });



    /* =====================================================
       EXPLANATION
    ====================================================== */

    document
        .getElementById("explanationText")
        .innerHTML =
        `
        <span class="correct-answer">
            ${question.answer}
        </span>

        =

        ${question.meaning}
        `;


    document
        .getElementById("explanationBox")
        .classList.add(
            "show"
        );



    /* =====================================================
       SHOW NEXT
    ====================================================== */

    document
        .getElementById("nextBtn")
        .style.display =
        "block";

}



/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion(){

    if(!answered){

        return;

    }


    currentQuestion++;


    if(
        currentQuestion <
        questions.length
    ){

        loadQuestion();

    }

    else{

        finishGame();

    }

}



/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

    document
        .getElementById("progress")
        .style.width =
        "100%";


    document
        .getElementById("game")
        .style.display =
        "none";


    document
        .getElementById("final")
        .style.display =
        "block";


    document
        .getElementById("finalScore")
        .textContent =

        score +
        " / " +
        questions.length;


    const percent =
        Math.round(
            score /
            questions.length *
            100
        );


    let message;


    if(percent === 100){

        message =
            "🏆 Perfect! You know your Vietnamese describing words.";

    }

    else if(percent >= 80){

        message =
            "🎉 Excellent! Keep practicing your Vietnamese.";

    }

    else if(percent >= 60){

        message =
            "👍 Good job! You're getting better.";

    }

    else{

        message =
            "📚 Keep practicing these Vietnamese describing words.";

    }


    document
        .getElementById("finalMessage")
        .textContent =
        message;


    if (
        typeof trackGameComplete ===
        "function"
    ) {
        trackGameComplete(
            "Describe Things - Game 6",
            score,
            questions.length
        );
    }

}


/* =========================================================
   RESTART
========================================================= */

function restartGame(){

    startGame();

}



/* =========================================================
   INITIALIZE
========================================================= */

window.trackGameStart(
    "Describe Things -Game 6"
);

startGame();

</script>
