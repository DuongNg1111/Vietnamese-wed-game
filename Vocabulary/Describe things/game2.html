<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Vietnamese Weather Challenge</title>

<meta
    name="game-title"
    content="Vietnamese Weather Challenge"
>

<meta
    name="game-description"
    content="Practice common Vietnamese weather words through pictures."
>

<meta
    name="game-icon"
    content="🌤️"
>

<meta
    name="game-explanation"
    content="true"
>


<!-- =========================================================
     GOOGLE FONTS
========================================================= -->

<link
    href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap"
    rel="stylesheet"
>


<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    padding:25px 20px;

    font-family:
        Calibri,
        Arial,
        sans-serif;

    background:#f7faff;

    color:#26354a;

}


/* =========================================================
   BACK BUTTON
========================================================= */

.back-btn-container{

    width:min(900px,95vw);

    margin:0 auto 15px;

}

.back-btn{

    display:inline-block;

    padding:9px 16px;

    background:white;

    color:#2878df;

    border:2px solid #c4daf6;

    border-radius:10px;

    text-decoration:none;

    font-size:22px;

    font-weight:bold;

    transition:.2s;

}

.back-btn:hover{

    background:#eaf3ff;

    border-color:#2878df;

    transform:translateY(-2px);

}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.container{

    position:relative;

    width:min(900px,95vw);

    margin:0 auto;

    background:white;

    border-radius:22px;

    padding:30px 35px 35px;

    box-shadow:
        0 8px 28px rgba(40,120,223,.10);

    overflow:hidden;

}


/* =========================================================
   ACCENT LINE
========================================================= */

.container::before{

    content:"";

    position:absolute;

    top:0;

    left:0;

    width:100%;

    height:6px;

    background:#2878df;

}


/* =========================================================
   GAME
========================================================= */

.game{

    width:100%;

}


/* =========================================================
   TITLE
========================================================= */

.title{

    margin:5px 0 4px;

    text-align:center;

    font-family:
        "Kalam",
        cursive;

    font-size:42px;

    font-weight:700;

    color:#2878df;

}

.instruction{

    margin:0 auto 20px;

    text-align:center;

    color:#667085;

    font-size:25px;

    line-height:1.4;

}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    margin-bottom:12px;

    font-size:24px;

    font-weight:bold;

}

.question-count{

    color:#667085;

}

.score{

    color:#2878df;

    font-size:27px;

}


/* =========================================================
   PROGRESS
========================================================= */

.progress-wrap{

    width:100%;

    height:8px;

    background:#eaf3ff;

    border-radius:20px;

    overflow:hidden;

    margin-bottom:20px;

    border:1px solid #d9e6f2;

}

.progress{

    width:0%;

    height:100%;

    background:#2878df;

    transition:.3s;

}


/* =========================================================
   WEATHER CARD
========================================================= */

.weather-card{

    position:relative;

    background:#eaf3ff;

    border:2px solid #c4daf6;

    border-radius:16px;

    padding:25px 20px;

    margin:20px 0;

    min-height:220px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

}


/* =========================================================
   WEATHER CARD ACCENT LINE
========================================================= */

.weather-card::before{

    content:"";

    position:absolute;

    top:-2px;

    left:20px;

    right:20px;

    height:4px;

    background:#2878df;

    border-radius:0 0 5px 5px;

}


/* =========================================================
   WEATHER ICON
========================================================= */

.weather-icon{

    font-size:95px;

    line-height:1;

    margin-bottom:15px;

}


/* =========================================================
   WEATHER PROMPT
========================================================= */

.weather-prompt{

    color:#52657d;

    font-size:25px;

    font-weight:bold;

}


/* =========================================================
   OPTIONS
========================================================= */

.options{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:12px;

    margin-bottom:15px;

}


.option-btn{

    min-height:62px;

    padding:13px 15px;

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-size:28px;

    font-weight:bold;

    background:white;

    color:#26354a;

    border:2px solid #d9e6f2;

    border-radius:12px;

    cursor:pointer;

    transition:.2s;

}


.option-btn:hover:not(.disabled){

    background:#eaf3ff;

    border-color:#2878df;

    color:#1e5fba;

    transform:translateY(-2px);

}


/* =========================================================
   CORRECT
========================================================= */

.option-btn.correct{

    background:#eaf3ff;

    border-color:#2878df;

    color:#1e5fba;

}


/* =========================================================
   WRONG
========================================================= */

.option-btn.wrong{

    background:#fff0f3;

    border-color:#d9536f;

    color:#d9536f;

    animation:shake .3s;

}


/* =========================================================
   DISABLED
========================================================= */

.option-btn.disabled{

    pointer-events:none;

}


/* =========================================================
   FEEDBACK
========================================================= */

.result-message{

    min-height:35px;

    margin:8px 0 12px;

    text-align:center;

    font-size:27px;

    font-weight:bold;

}

.correct-text{

    color:#2878df;

}

.wrong-text{

    color:#d9536f;

}


/* =========================================================
   NEXT BUTTON
========================================================= */

.next-btn{

    display:none;

    margin:0 auto;

    padding:11px 27px;

    border:none;

    border-radius:11px;

    background:#2878df;

    color:white;

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-size:25px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.next-btn:hover{

    background:#1e5fba;

    transform:translateY(-2px);

}


/* =========================================================
   FINAL SCREEN
========================================================= */

#final{

    display:none;

    text-align:center;

    padding:25px 10px 10px;

}


.finish-icon{

    font-size:70px;

    margin-bottom:5px;

}


#final h2{

    margin:5px 0 15px;

    font-family:
        "Kalam",
        cursive;

    font-size:42px;

    color:#2878df;

}


.final-score{

    font-size:48px;

    font-weight:bold;

    color:#2878df;

    margin:20px 0;

}


.final-message{

    color:#667085;

    font-size:26px;

    line-height:1.5;

    margin-bottom:25px;

}


.start-btn{

    padding:12px 28px;

    border:none;

    border-radius:11px;

    background:#2878df;

    color:white;

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-size:25px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.start-btn:hover{

    background:#1e5fba;

    transform:translateY(-2px);

}


/* =========================================================
   ANIMATION
========================================================= */

@keyframes shake{

    0%,100%{

        transform:translateX(0);

    }

    25%{

        transform:translateX(-6px);

    }

    75%{

        transform:translateX(6px);

    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    body{

        padding:20px 12px;

    }


    .container{

        width:100%;

        padding:25px 17px 25px;

        border-radius:19px;

    }


    .back-btn{

        font-size:21px;

    }


    .title{

        font-size:36px;

    }


    .instruction{

        font-size:23px;

    }


    .topbar{

        font-size:22px;

    }


    .score{

        font-size:25px;

    }


    .weather-card{

        min-height:190px;

        padding:25px 15px;

    }


    .weather-icon{

        font-size:80px;

    }


    .weather-prompt{

        font-size:23px;

    }


    .options{

        grid-template-columns:1fr;

    }


    .option-btn{

        font-size:26px;

    }


    .next-btn{

        width:100%;

    }


    #final h2{

        font-size:37px;

    }


    .final-score{

        font-size:42px;

    }

}

</style>

</head>


<body>


<!-- =========================================================
     BACK
========================================================= -->

<div class="back-btn-container">

    <a
        href="../../category.html?category=Describe%20things"
        class="back-btn"
    >
        ← Back
    </a>

</div>


<!-- =========================================================
     MAIN CONTAINER
========================================================= -->

<div class="container">


<!-- =========================================================
     GAME SCREEN
========================================================= -->

<div
    id="game"
    class="game"
>


    <!-- TITLE -->

    <h1 class="title">

        🌤️ Vietnamese Weather Challenge

    </h1>


    <!-- SHORT INSTRUCTION -->

    <p class="instruction">

        Look at the picture and choose the correct Vietnamese word.

    </p>


    <!-- TOP BAR -->

    <div class="topbar">


        <div class="question-count">

            Question

            <span id="questionNumber">
                1
            </span>

            /

            <span id="totalQuestions">
                20
            </span>

        </div>


        <div class="score">

            Score:

            <span id="score">
                0
            </span>

        </div>


    </div>


    <!-- PROGRESS -->

    <div class="progress-wrap">

        <div
            class="progress"
            id="progress"
        ></div>

    </div>


    <!-- WEATHER -->

    <div class="weather-card">


        <div
            class="weather-icon"
            id="weatherIcon"
        >
            ☀️
        </div>


        <div class="weather-prompt">

            What is the weather?

        </div>


    </div>


    <!-- OPTIONS -->

    <div
        class="options"
        id="optionsContainer"
    ></div>


    <!-- FEEDBACK -->

    <div
        class="result-message"
        id="resultText"
    ></div>


    <!-- NEXT -->

    <button
        class="next-btn"
        id="nextBtn"
        onclick="nextQuestion()"
    >

        Next →

    </button>


</div>


<!-- =========================================================
     FINAL SCREEN
========================================================= -->

<div
    id="final"
>


    <div class="finish-icon">

        🎉

    </div>


    <h2>

        Game Complete!

    </h2>


    <p class="final-message">

        You completed the Vietnamese Weather Challenge.

    </p>


    <div class="final-score">

        <span id="finalScore">

            0 / 20

        </span>

    </div>


    <p
        class="final-message"
        id="finalMessage"
    ></p>


    <button
        class="start-btn"
        onclick="restartGame()"
    >

        Play Again

    </button>


</div>


</div>


<script>

/* =========================================================
   WEATHER VOCABULARY
========================================================= */

const weatherVocab = [

    "nóng",
    "lạnh",
    "ấm",
    "mát",
    "nắng",
    "mưa",
    "gió",
    "nhiều mây"

];


/* =========================================================
   QUESTION DATABASE
========================================================= */

const database = [

    {
        icon:"☀️",
        word:"nắng"
    },

    {
        icon:"🌧️",
        word:"mưa"
    },

    {
        icon:"💨",
        word:"gió"
    },

    {
        icon:"☁️",
        word:"nhiều mây"
    },

    {
        icon:"🥵",
        word:"nóng"
    },

    {
        icon:"🥶",
        word:"lạnh"
    },

    {
        icon:"🌤️",
        word:"ấm"
    },

    {
        icon:"🍃",
        word:"mát"
    },

    {
        icon:"🌞",
        word:"nắng"
    },

    {
        icon:"🌦️",
        word:"mưa"
    },

    {
        icon:"🌬️",
        word:"gió"
    },

    {
        icon:"🌥️",
        word:"nhiều mây"
    },

    {
        icon:"🔥",
        word:"nóng"
    },

    {
        icon:"❄️",
        word:"lạnh"
    },

    {
        icon:"🌤️",
        word:"ấm"
    },

    {
        icon:"🍃",
        word:"mát"
    },

    {
        icon:"🌞",
        word:"nắng"
    },

    {
        icon:"🌧️",
        word:"mưa"
    },

    {
        icon:"💨",
        word:"gió"
    },

    {
        icon:"☁️",
        word:"nhiều mây"
    }

];


/* =========================================================
   STATE
========================================================= */

let questions = [];

let currentQuestion = 0;

let score = 0;

let answered = false;


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    const arr = [...array];


    for(
        let i = arr.length - 1;

        i > 0;

        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] = [

            arr[j],
            arr[i]

        ];

    }


    return arr;

}


/* =========================================================
   CREATE OPTIONS
========================================================= */

function createOptions(correctWord){

    const wrongWords =
        shuffle(
            weatherVocab.filter(
                word =>
                    word !== correctWord
            )
        ).slice(0,3);


    return shuffle([

        correctWord,

        ...wrongWords

    ]);

}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    questions =
        shuffle(database);


    currentQuestion = 0;

    score = 0;

    answered = false;


    document
        .getElementById("score")
        .textContent =
        "0";


    document
        .getElementById("totalQuestions")
        .textContent =
        questions.length;


    document
        .getElementById("game")
        .style.display =
        "block";


    document
        .getElementById("final")
        .style.display =
        "none";


    loadQuestion();

}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion(){

    answered = false;


    const question =
        questions[currentQuestion];


    document
        .getElementById("questionNumber")
        .textContent =
        currentQuestion + 1;


    document
        .getElementById("totalQuestions")
        .textContent =
        questions.length;


    document
        .getElementById("progress")
        .style.width =

        (
            currentQuestion /
            questions.length *
            100
        ) + "%";


    document
        .getElementById("weatherIcon")
        .textContent =
        question.icon;


    const resultText =
        document.getElementById(
            "resultText"
        );


    resultText.textContent =
        "";


    resultText.className =
        "result-message";


    const nextBtn =
        document.getElementById(
            "nextBtn"
        );


    nextBtn.style.display =
        "none";


    nextBtn.textContent =

        currentQuestion ===
        questions.length - 1

        ? "Finish 🎉"

        : "Next →";


    const container =
        document.getElementById(
            "optionsContainer"
        );


    container.innerHTML =
        "";


    const options =
        createOptions(
            question.word
        );


    options.forEach(
        option => {


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "option-btn";


            button.textContent =
                option;


            button.addEventListener(
                "click",
                () => {

                    handleAnswer(
                        button,
                        option
                    );

                }
            );


            container.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   HANDLE ANSWER
========================================================= */

function handleAnswer(
    button,
    selected
){

    if(answered){

        return;

    }


    answered = true;


    const question =
        questions[currentQuestion];


    const allButtons =
        document.querySelectorAll(
            ".option-btn"
        );


    allButtons.forEach(
        btn => {

            btn.classList.add(
                "disabled"
            );

        }
    );


    /* =====================================================
       CORRECT
    ====================================================== */

    if(
        selected ===
        question.word
    ){

        button.classList.add(
            "correct"
        );


        score++;


        document
            .getElementById("score")
            .textContent =
            score;


        const resultText =
            document.getElementById(
                "resultText"
            );


        resultText.className =
            "result-message correct-text";


        resultText.textContent =
            "✓ Correct!";

    }


    /* =====================================================
       WRONG
    ====================================================== */

    else{

        button.classList.add(
            "wrong"
        );


        const resultText =
            document.getElementById(
                "resultText"
            );


        resultText.className =
            "result-message wrong-text";


        resultText.textContent =

            `✗ Incorrect. The answer is "${question.word}".`;


        /*
           Highlight correct answer.
        */

        allButtons.forEach(
            optionButton => {

                if(
                    optionButton.textContent ===
                    question.word
                ){

                    optionButton.classList.add(
                        "correct"
                    );

                }

            }
        );

    }


    /* =====================================================
       SHOW NEXT
    ====================================================== */

    document
        .getElementById("nextBtn")
        .style.display =
        "block";

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion(){

    currentQuestion++;


    if(
        currentQuestion <
        questions.length
    ){

        loadQuestion();

    }

    else{

        finishGame();

    }

}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

    document
        .getElementById("progress")
        .style.width =
        "100%";


    document
        .getElementById("game")
        .style.display =
        "none";


    document
        .getElementById("final")
        .style.display =
        "block";


    document
        .getElementById("finalScore")
        .textContent =

        score +
        " / " +
        questions.length;


    const percent =
        Math.round(
            score /
            questions.length *
            100
        );


    let message;


    if(percent === 100){

        message =
            "🏆 Perfect! You know these Vietnamese weather words very well.";

    }

    else if(percent >= 85){

        message =
            "🌟 Excellent! Your Vietnamese weather vocabulary is strong.";

    }

    else if(percent >= 70){

        message =
            "🎉 Good job! Keep practicing these weather words.";

    }

    else{

        message =
            "📚 Keep practicing the Vietnamese weather vocabulary.";

    }


    document
        .getElementById("finalMessage")
        .textContent =
        message;

}


/* =========================================================
   RESTART
========================================================= */

function restartGame(){

    currentQuestion = 0;

    score = 0;

    answered = false;


    document
        .getElementById("final")
        .style.display =
        "none";


    document
        .getElementById("game")
        .style.display =
        "block";


    startGame();

}


/* =========================================================
   INITIALIZE
========================================================= */

startGame();

</script>

</body>

</html>
