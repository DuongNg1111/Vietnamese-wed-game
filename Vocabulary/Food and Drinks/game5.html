<style>

/* =========================================================
   DESIGN SYSTEM
========================================================= */

:root{

    --accent:#A99959;

    --accent-dark:#7B6F40;

    --accent-light:#f9f6e6;

    --accent-bg:#FBFAF0;

    --accent-border:#e8dfb2;

    --heading-color:var(--ink);

    --correct:#019b3f;

    --correct-bg:#eaf3ff;

    --wrong:#d9536f;

    --wrong-bg:#fff0f3;

    --ink:#2f302b;

    --text:#333;

    --muted:#6f706b;

    --card:#ffffff;

    --general-border:#deddd5;

}


/* =========================================================
   GLOBAL
========================================================= */

*{

    box-sizing:border-box;

}


html{

    width:100%;

}


body{

    margin:0;

    min-height:100vh;

    padding:28px 20px 45px;

    font-family:
        Calibri,
        'Segoe UI',
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    color:var(--ink);

    display:flex;

    justify-content:center;

    align-items:center;

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            var(--accent-bg) 48%,
            var(--accent-light) 100%
        );

}


/* =========================================================
   PAGE WRAPPER
========================================================= */

.page{

    width:100%;

    max-width:900px;

}


/* =========================================================
   BACK BUTTON
   OUTSIDE GAME CARD
========================================================= */

.back-btn-container{

    width:100%;

    margin:0 auto 14px;

    text-align:left;

}


.back-btn{

    display:inline-block;

    padding:8px 16px;

    background:#ffffff;

    color:var(--accent-dark);

    border:1.5px solid var(--accent-border);

    border-radius:10px;

    text-decoration:none;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:18px;

    font-weight:bold;

    transition:
        background .2s ease,
        border-color .2s ease,
        transform .2s ease;

}


.back-btn:hover{

    background:var(--accent-light);

    border-color:var(--accent);

    transform:translateY(-2px);

}


/* =========================================================
   MAIN GAME CARD
========================================================= */

.game-box{

    position:relative;

    width:100%;

    max-width:900px;

    margin:0 auto;

    padding:34px 44px 40px;

    background:var(--card);

    border:1px solid var(--accent-border);

    border-radius:22px;

    box-shadow:
        0 10px 30px rgba(80,70,30,.08);

    overflow:hidden;

}


/* =========================================================
   ACCENT LINE
========================================================= */

.game-box::before{

    content:"";

    position:absolute;

    top:0;

    left:0;

    right:0;

    height:6px;

    background:var(--accent);

}


/* =========================================================
   GAME SCREEN
========================================================= */

#gameScreen{

    width:100%;

}


/* =========================================================
   TITLE
========================================================= */

#gameScreen h1{

    margin:4px 0 4px;

    text-align:center;

    font-family:
        Kalam,
        cursive;

    font-size:48px;

    font-weight:700;

    line-height:1.2;

    color:var(--heading-color);

}


/* =========================================================
   SHORT INTRO
========================================================= */

.instruction{

    margin:0 auto 25px;

    text-align:center;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:22px;

    line-height:1.4;

    color:var(--muted);

}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:20px;

    margin:0 0 10px;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:20px;

    font-weight:bold;

}


.round{

    color:var(--muted);

}


.score{

    color:var(--accent-dark);

}


/* =========================================================
   PROGRESS BAR
========================================================= */

.progress-container{

    width:100%;

    height:9px;

    margin:0 0 28px;

    background:var(--accent-light);

    border:1px solid var(--accent-border);

    border-radius:999px;

    overflow:hidden;

}


.progress-bar{

    width:0%;

    height:100%;

    background:var(--accent);

    border-radius:999px;

    transition:
        width .3s ease;

}


/* =========================================================
   QUESTION
========================================================= */

.question-title{

    margin:8px 0 23px;

    text-align:center;

    font-family:
        Kalam,
        cursive;

    font-size:34px;

    font-weight:700;

    line-height:1.3;

    color:var(--ink);

}


/* =========================================================
   GROUP
========================================================= */

.group{

    display:flex;

    justify-content:center;

    align-items:center;

    flex-wrap:wrap;

    gap:11px;

    max-width:750px;

    margin:0 auto 30px;

}


.group-word{

    min-width:140px;

    padding:17px 21px;

    background:#fcfcf9;

    border:1.5px solid var(--general-border);

    border-radius:14px;

    text-align:center;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:28px;

    font-weight:bold;

    color:var(--ink);

}


.group-missing{

    background:var(--accent-light);

    border:2px dashed var(--accent);

    color:var(--accent-dark);

}


/* =========================================================
   OPTIONS
========================================================= */

.options{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:14px;

    max-width:750px;

    margin:0 auto;

}


.option{

    min-height:70px;

    padding:13px 15px;

    background:#ffffff;

    color:var(--ink);

    border:1.5px solid var(--general-border);

    border-radius:14px;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:24px;

    font-weight:bold;

    cursor:pointer;

    transition:
        background .2s ease,
        border-color .2s ease,
        transform .2s ease;

}


.option:hover{

    background:var(--accent-light);

    border-color:var(--accent-border);

    color:var(--accent-dark);

    transform:translateY(-2px);

}


/* =========================================================
   CORRECT
========================================================= */

.option.correct{

    background:var(--correct-bg) !important;

    border:2px solid var(--correct) !important;

    color:var(--correct) !important;

    cursor:default;

}


/* =========================================================
   WRONG
========================================================= */

.option.wrong{

    background:var(--wrong-bg) !important;

    border:2px solid var(--wrong) !important;

    color:var(--wrong) !important;

    cursor:default;

}


/* =========================================================
   DISABLED
========================================================= */

.option.disabled{

    pointer-events:none;

    cursor:default;

}


/* =========================================================
   RESULT
========================================================= */

#result{

    min-height:55px;

    margin-top:23px;

    text-align:center;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:25px;

    font-weight:bold;

    line-height:1.5;

}


.answer{

    margin-top:5px;

    font-size:21px;

    font-weight:normal;

    color:var(--muted);

}


/* =========================================================
   EXPLANATION
========================================================= */

.explanation{

    max-width:750px;

    margin:18px auto 0;

    padding:16px 19px;

    background:var(--accent-light);

    border:1px solid var(--accent-border);

    border-left:5px solid var(--accent);

    border-radius:12px;

    color:#55564f;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:21px;

    line-height:1.55;

    text-align:left;

}


.explanation strong{

    color:var(--accent-dark);

}


.hidden{

    display:none;

}


/* =========================================================
   NEXT BUTTON
========================================================= */

.next-area{

    display:flex;

    justify-content:center;

    margin-top:22px;

}


#nextBtn{

    display:none;

    padding:11px 27px;

    background:var(--accent);

    color:#ffffff;

    border:none;

    border-radius:11px;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:21px;

    font-weight:bold;

    cursor:pointer;

    transition:
        background .2s ease,
        transform .2s ease;

}


#nextBtn:hover{

    background:var(--accent-dark);

    transform:translateY(-2px);

}


/* =========================================================
   FINAL SCREEN
========================================================= */

#finalScreen{

    display:none;

    padding:22px 10px 10px;

    text-align:center;

}


.final-icon{

    font-size:64px;

    margin-bottom:3px;

}


#finalScreen h1{

    margin:4px 0 18px;

    font-family:
        Kalam,
        cursive;

    font-size:48px;

    color:var(--heading-color);

}


.final-score{

    margin:15px 0;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:32px;

    font-weight:bold;

    color:var(--accent-dark);

}


.final-percent{

    margin:9px 0;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:27px;

    color:var(--muted);

}


.final-message{

    max-width:650px;

    margin:19px auto 27px;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:24px;

    font-weight:bold;

    color:var(--muted);

    line-height:1.5;

}


.play-again-btn{

    padding:12px 29px;

    background:var(--accent);

    color:#ffffff;

    border:none;

    border-radius:11px;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:21px;

    font-weight:bold;

    cursor:pointer;

    transition:
        background .2s ease,
        transform .2s ease;

}


.play-again-btn:hover{

    background:var(--accent-dark);

    transform:translateY(-2px);

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    body{

        padding:20px 14px 35px;

        align-items:flex-start;

    }


    .page{

        max-width:100%;

    }


    .game-box{

        padding:31px 21px 34px;

        border-radius:19px;

    }


    .back-btn{

        font-size:17px;

        padding:8px 14px;

    }


    #gameScreen h1{

        font-size:40px;

    }


    .instruction{

        font-size:21px;

        margin-bottom:23px;

    }


    .topbar{

        font-size:18px;

    }


    .question-title{

        font-size:30px;

        margin-bottom:21px;

    }


    .group{

        gap:8px;

        margin-bottom:27px;

    }


    .group-word{

        min-width:105px;

    }


    .options{

        grid-template-columns:1fr;

    }


    .option{

        min-height:62px;

        font-size:23px;

    }


    #result{

        font-size:23px;

    }


    .answer{

        font-size:20px;

    }


    .explanation{

        font-size:20px;

        padding:14px 15px;

    }


    #nextBtn{

        width:100%;

        font-size:20px;

    }


    #finalScreen h1{

        font-size:42px;

    }


    .final-score{

        font-size:29px;

    }


    .final-percent{

        font-size:25px;

    }


    .final-message{

        font-size:22px;

    }


    .play-again-btn{

        width:100%;

    }

}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media(max-width:400px){

    body{

        padding:16px 10px 30px;

    }


    .game-box{

        padding:28px 15px 31px;

    }


    #gameScreen h1{

        font-size:36px;

    }


    .instruction{

        font-size:20px;

    }


    .topbar{

        font-size:17px;

    }


    .question-title{

        font-size:28px;

    }


    .group-word{

        min-width:92px;

        font-size:23px;

    }


    .option{

        font-size:22px;

    }

}

</style>

</head>

        [...array];


    for(
        let i = shuffled.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            shuffled[i],
            shuffled[j]
        ] =
        [
            shuffled[j],
            shuffled[i]
        ];

    }


    return shuffled;

}


/* =========================================================
   UPDATE SCORE
========================================================= */

function updateScore(){

    scoreEl.textContent =
        `Score: ${score} / ${questions.length}`;

}


/* =========================================================
   UPDATE PROGRESS
========================================================= */

function updateProgress(){

    const progress =
        (
            currentQuestion /
            questions.length
        ) * 100;


    progressBar.style.width =
        `${progress}%`;

}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion(){

    locked = false;


    const question =
        questions[currentQuestion];


    questionNumberEl.textContent =
        `Question ${currentQuestion + 1} of ${questions.length}`;


    updateScore();

    updateProgress();


    groupEl.innerHTML =
        "";


    optionsEl.innerHTML =
        "";


    resultEl.innerHTML =
        "";


    explanationEl.innerHTML =
        "";


    explanationEl.classList.add(
        "hidden"
    );


    nextBtn.style.display =
        "none";


    nextBtn.textContent =
        "Next Question →";


    /* =====================================================
       GROUP WORDS
    ====================================================== */

    question.group.forEach(
        word => {

            const wordElement =
                document.createElement(
                    "div"
                );


            wordElement.className =
                "group-word";


            wordElement.textContent =
                word;


            groupEl.appendChild(
                wordElement
            );

        }
    );


    /* =====================================================
       MISSING WORD
    ====================================================== */

    const missingElement =
        document.createElement(
            "div"
        );


    missingElement.className =
        "group-word group-missing";


    missingElement.textContent =
        "?";


    groupEl.appendChild(
        missingElement
    );


    /* =====================================================
       ANSWER OPTIONS
    ====================================================== */

    const choices =
        shuffle([

            question.answer,

            ...question.wrong

        ]);


    choices.forEach(
        (choice,index) => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "option";


            button.textContent =
                `${String.fromCharCode(65 + index)}. ${choice}`;


            button.addEventListener(
                "click",
                () => {

                    checkAnswer(
                        button,
                        choice
                    );

                }
            );


            optionsEl.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   CHECK ANSWER
========================================================= */

function checkAnswer(
    selectedButton,
    selectedChoice
){

    if(locked){

        return;

    }


    locked = true;


    const question =
        questions[currentQuestion];


    const allButtons =
        document.querySelectorAll(
            ".option"
        );


    /* =====================================================
       CORRECT
    ====================================================== */

    if(
        selectedChoice ===
        question.answer
    ){

        selectedButton.classList.add(
            "correct"
        );


        score++;


        updateScore();


        resultEl.innerHTML = `

            <div style="color:var(--correct);">
                ✓ Correct!
            </div>

            <div class="answer">

                "${question.answer}"
                completes the group.

            </div>

        `;

    }


    /* =====================================================
       WRONG
    ====================================================== */

    else{

        selectedButton.classList.add(
            "wrong"
        );


        allButtons.forEach(
            button => {

                if(
                    button.textContent.includes(
                        question.answer
                    )
                ){

                    button.classList.add(
                        "correct"
                    );

                }

            }
        );


        resultEl.innerHTML = `

            <div style="color:var(--wrong);">
                ✕ Wrong!
            </div>

            <div class="answer">

                Correct answer:
                <b>${question.answer}</b>

            </div>

        `;

    }


    /* =====================================================
       LOCK OPTIONS
    ====================================================== */

    allButtons.forEach(
        button => {

            button.classList.add(
                "disabled"
            );

        }
    );


    /* =====================================================
       EXPLANATION
    ====================================================== */

    explanationEl.innerHTML = `

        <strong>Learn:</strong>

        <br>

        ${question.explanation}

    `;


    explanationEl.classList.remove(
        "hidden"
    );


    /* =====================================================
       NEXT BUTTON
    ====================================================== */

    nextBtn.style.display =
        "inline-block";


    if(
        currentQuestion ===
        questions.length - 1
    ){

        nextBtn.textContent =
            "See Results →";

    }

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion(){

    currentQuestion++;


    if(
        currentQuestion >=
        questions.length
    ){

        finishGame();

        return;

    }


    loadQuestion();

}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

    gameScreen.style.display =
        "none";


    finalScreen.style.display =
        "block";


    progressBar.style.width =
        "100%";


    const percentage =
        Math.round(
            score /
            questions.length *
            100
        );


    document.getElementById(
        "finalScore"
    ).textContent =
        `Final Score: ${score} / ${questions.length}`;


    document.getElementById(
        "finalPercent"
    ).textContent =
        `${percentage}%`;


    let message;


    if(
        percentage >= 85
    ){

        message =
            "Excellent! You really know your Vietnamese vocabulary!";

    }

    else if(
        percentage >= 60
    ){

        message =
            "Good job! Keep practicing!";

    }

    else{

        message =
            "Keep practicing. You will improve!";

    }


    document.getElementById(
        "finalMessage"
    ).textContent =
        message;

}


/* =========================================================
   RESTART GAME
========================================================= */

function restartGame(){

    currentQuestion = 0;

    score = 0;

    locked = false;


    finalScreen.style.display =
        "none";


    gameScreen.style.display =
        "block";


    loadQuestion();

}


/* =========================================================
   INITIALIZE
========================================================= */

loadQuestion();

</script>

</html>
