let currentQuestion = 0;

let score = 0;

let locked = false;

/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    const shuffled = [...array];

    for(
        let i = shuffled.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        [
            shuffled[i],
            shuffled[j]
        ] =
        [
            shuffled[j],
            shuffled[i]
        ];

    }

    return shuffled;

}


/* =========================================================
   UPDATE SCORE
========================================================= */

function updateScore(){

    scoreEl.textContent =
        `Score: ${score}`;

}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion(){

    locked = false;


    const question =
        questions[currentQuestion];


    questionNumberEl.textContent =
        `Question ${currentQuestion + 1} of ${questions.length}`;


    scoreEl.textContent =
        `Score: ${score}`;


    progressEl.style.width =
        `${currentQuestion / questions.length * 100}%`;


    wordsEl.innerHTML =
        "";

    resultEl.innerHTML =
        "";

    explanationEl.innerHTML =
        "";

    explanationEl.classList.remove(
        "show"
    );


    nextBtn.style.display =
        "none";


    nextBtn.textContent =
        "Next Question →";


    const shuffledWords =
        shuffle(
            question.words
        );


    shuffledWords.forEach(
        word => {

            const wordElement =
                document.createElement(
                    "div"
                );


            wordElement.className =
                "word";


            wordElement.textContent =
                word;


            wordElement.addEventListener(
                "click",
                () => {

                    checkAnswer(
                        wordElement,
                        word
                    );

                }
            );


            wordsEl.appendChild(
                wordElement
            );

        }
    );

}


/* =========================================================
   CHECK ANSWER
========================================================= */

function checkAnswer(
    element,
    selectedWord
){

    if(locked){

        return;

    }


    locked = true;


    const question =
        questions[currentQuestion];


    const allWords =
        document.querySelectorAll(
            ".word"
        );


    /* =====================================================
       CORRECT
    ====================================================== */

    if(
        selectedWord ===
        question.answer
    ){

        element.classList.add(
            "correct"
        );


        score++;


        updateScore();


        resultEl.innerHTML = `

            <span style="color:#2878df;">
                ✓ Correct!
            </span>

            <div class="answer">
                "${question.answer}" does not belong.
            </div>

        `;

    }


    /* =====================================================
       WRONG
    ====================================================== */

    else{

        element.classList.add(
            "wrong"
        );


        allWords.forEach(
            wordElement => {

                if(
                    wordElement.textContent ===
                    question.answer
                ){

                    wordElement.classList.add(
                        "correct"
                    );

                }

            }
        );


        resultEl.innerHTML = `

            <span style="color:#d9536f;">
                ✕ Wrong!
            </span>

            <div class="answer">
                Correct answer:
                <b>${question.answer}</b>
            </div>

        `;

    }


    /* =====================================================
       LOCK ALL WORDS
    ====================================================== */

    allWords.forEach(
        wordElement => {

            wordElement.classList.add(
                "disabled"
            );

        }
    );


    /* =====================================================
       EXPLANATION
    ====================================================== */

    explanationEl.innerHTML = `

        <strong>💡 Learn:</strong>

        <br>

        ${question.explanation}

    `;


    explanationEl.classList.add(
        "show"
    );


    /* =====================================================
       NEXT
    ====================================================== */

    nextBtn.style.display =
        "inline-block";


    if(
        currentQuestion ===
        questions.length - 1
    ){

        nextBtn.textContent =
            "See Results →";

    }

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion(){

    currentQuestion++;


    if(
        currentQuestion >=
        questions.length
    ){

        finishGame();

        return;

    }


    loadQuestion();

}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

    progressEl.style.width =
        "100%";


    gameScreen.style.display =
        "none";


    finalScreen.style.display =
        "block";


    const percentage =
        Math.round(
            score /
            questions.length *
            100
        );


    document.getElementById(
        "finalScore"
    ).textContent =
        `Final Score: ${score} / ${questions.length}`;


    document.getElementById(
        "finalPercent"
    ).textContent =
        `${percentage}%`;


    let message;


    if(
        percentage >= 85
    ){

        message =
            "🏆 Excellent! You really know your Vietnamese vocabulary!";

    }

    else if(
        percentage >= 60
    ){

        message =
            "🎉 Good job! Keep practicing!";

    }

    else{

        message =
            "📚 Keep practicing. You will improve!";

    }


    document.getElementById(
        "finalMessage"
    ).textContent =
        message;

}


/* =========================================================
   RESTART GAME
========================================================= */

function restartGame(){

    score = 0;

}
