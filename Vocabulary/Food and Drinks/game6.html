        .toLowerCase()
        .normalize("NFD")

            /[\u0300-\u036f]/g,

            "d"
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();

}


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    const shuffled =
        [...array];


    for(
        let i = shuffled.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            shuffled[i],
            shuffled[j]
        ] =
        [
            shuffled[j],
            shuffled[i]
        ];

    }


    return shuffled;

}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    currentQuestion = 0;

    score = 0;

    locked = false;


    /*
       Select 20 random words
       from the vocabulary list.
    */

    gameQuestions =
        shuffle(questions)
        .slice(
            0,
            TOTAL_QUESTIONS
        );


    gameScreen.style.display =
        "block";


    finalScreen.style.display =
        "none";


    updateScore();

    loadQuestion();

}


/* =========================================================
   UPDATE SCORE
========================================================= */

function updateScore(){

    scoreEl.textContent =
        `Score: ${score} / ${TOTAL_QUESTIONS}`;

}


/* =========================================================
   UPDATE PROGRESS
========================================================= */

function updateProgress(){

    const progress =
        (
            currentQuestion /
            TOTAL_QUESTIONS
        ) * 100;


    progressBar.style.width =
        `${progress}%`;

}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion(){

    locked = false;


    const question =
        gameQuestions[
            currentQuestion
        ];


    questionNumberEl.textContent =
        `Question ${
            currentQuestion + 1
        } of ${TOTAL_QUESTIONS}`;


    updateScore();

    updateProgress();


    /* SCRAMBLED WORD */

    scrambledWordEl.textContent =
        question.scramble;


    /* ENGLISH HINT */

    hintEl.innerHTML = `
        <strong>Hint:</strong>
        ${question.hint}
    `;


    /* INPUT */

    answerInput.value =
        "";


    answerInput.disabled =
        false;


    /* CHECK BUTTON */

    checkBtn.disabled =
        false;


    checkBtn.style.display =
        "inline-block";


    /* RESULT */

    resultEl.innerHTML =
        "";


    /* EXPLANATION */

    explanationEl.innerHTML =
        "";


    explanationEl.classList.add(
        "hidden"
    );


    /* NEXT BUTTON */

    nextBtn.style.display =
        "none";


    nextBtn.textContent =
        "Next Question →";


    /*
       Focus input automatically.
    */

    setTimeout(
        () => answerInput.focus(),
        50
    );

}


/* =========================================================
   CHECK ANSWER
========================================================= */

function checkAnswer(){

    if(locked){

        return;

    }


    const userAnswer =
        normalizeAnswer(
            answerInput.value
        );


    /*
       Empty answer is not counted.
    */

    if(userAnswer === ""){

        resultEl.innerHTML = `

            <span class="result-wrong">

                ⚠️ Please type an answer.

            </span>

        `;

        return;

    }


    locked = true;


    const question =
        gameQuestions[
            currentQuestion
        ];


    const correctAnswer =
        normalizeAnswer(
            question.word
        );


    /*
       Lock answer immediately.
    */

    answerInput.disabled =
        true;


    checkBtn.disabled =
        true;


    /* =====================================================
       CORRECT
    ====================================================== */

    if(
        userAnswer ===
        correctAnswer
    ){

        score++;

        updateScore();


        resultEl.innerHTML = `

            <div class="result-correct">

                ✅ Correct!

            </div>

            <div class="answer">

                The word is
                <b>${question.word}</b>.

            </div>

        `;

    }


    /* =====================================================
       WRONG
    ====================================================== */

    else{

        resultEl.innerHTML = `

            <div class="result-wrong">

                ❌ Wrong!

            </div>

            <div class="answer">

                Correct answer:
                <b>${question.word}</b>

            </div>

        `;

    }


    /* =====================================================
       EXPLANATION
    ====================================================== */

    explanationEl.innerHTML = `

        <strong>💡 Learn:</strong>

        <br>

        ${question.explanation}

    `;


    explanationEl.classList.remove(
        "hidden"
    );


    /* =====================================================
       NEXT BUTTON
    ====================================================== */

    nextBtn.style.display =
        "inline-block";


    if(
        currentQuestion ===
        TOTAL_QUESTIONS - 1
    ){

        nextBtn.textContent =
            "See Results →";

    }

}


/* =========================================================
   ENTER KEY
========================================================= */

answerInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            checkAnswer();

        }

    }
);


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion(){

    currentQuestion++;


    if(
        currentQuestion >=
        TOTAL_QUESTIONS
    ){

        finishGame();

        return;

    }


    loadQuestion();

}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

    gameScreen.style.display =
        "none";


    finalScreen.style.display =
        "block";


    progressBar.style.width =
        "100%";


    const percentage =
        Math.round(
            score /
            TOTAL_QUESTIONS *
            100
        );


    document.getElementById(
        "finalScore"
    ).textContent =
        `Final Score: ${score} / ${TOTAL_QUESTIONS}`;


    document.getElementById(
        "finalPercent"
    ).textContent =
        `${percentage}%`;


    let message;


    if(
        percentage >= 85
    ){

        message =
            "🏆 Excellent! You really know your Vietnamese vocabulary!";

    }

    else if(
        percentage >= 60
    ){

        message =
            "🎉 Good job! Keep practicing!";

    }

    else{

        message =
            "📚 Keep practicing. You will improve!";

    }


    document.getElementById(
        "finalMessage"
    ).textContent =
        message;

}


/* =========================================================
   RESTART GAME
========================================================= */

function restartGame(){

    currentQuestion = 0;

    score = 0;

    locked = false;


    finalScreen.style.display =
        "none";


    gameScreen.style.display =
        "block";


    startGame();

}


/* =========================================================
   START
========================================================= */

startGame();

</script>
