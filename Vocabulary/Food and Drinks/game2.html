/* =========================================================
   ROUND STRUCTURE
========================================================= */

const roundSizes = [

    2,
    2,
    2,
    2,

    3,
    3,
    3,
    3,
    3,
    3,

    4,
    4,

];


/* =========================================================
   TOTAL PAIRS
========================================================= */

const totalPairs =
    roundSizes.reduce(
        (total, size) =>
            total + size,
        0
    );


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    const copy = [...array];

    for(
        let i = copy.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        [
            copy[i],
            copy[j]
        ] =
        [
            copy[j],
            copy[i]
        ];

    }

    return copy;

}


/* =========================================================
   CREATE ROUNDS
========================================================= */

function createRounds(){

    const createdRounds = [];

    let pool =
        shuffle(vocabulary);

    let poolIndex = 0;


    roundSizes.forEach(
        size => {

            const selected = [];


            while(
                selected.length < size
            ){

                if(
                    poolIndex >= pool.length
                ){

                    pool =
                        shuffle(vocabulary);

                    poolIndex = 0;

                }


                const item =
                    pool[poolIndex];

                poolIndex++;


                const alreadySelected =
                    selected.some(
                        selectedItem =>
                            selectedItem.vi ===
                            item.vi
                    );


                if(
                    !alreadySelected
                ){

                    selected.push(item);

                }

            }


            createdRounds.push({

                pairs:selected

            });

        }
    );


    return createdRounds;

}


/* =========================================================
   GAME STATE
========================================================= */

let rounds =

let currentRound = 0;

let score = 0;

let draggedWord = null;

let roundChecked = false;


/* =========================================================

========================================================= */

const gameScreen =

const finalScreen =

/* =========================================================
   LOAD ROUND
========================================================= */

function loadRound(){

    draggedWord = null;

    roundChecked = false;


    messageEl.textContent =
        "";

    messageEl.style.color =
        "";


    explanationEl.innerHTML =
        "";

    explanationEl.classList.remove(
        "show"
    );


    checkBtn.disabled =
        false;


    nextBtn.style.display =
        "none";


    const round =
        rounds[currentRound];


    const pairs =
        round.pairs;


    roundText.textContent =
        `Round ${currentRound + 1} / ${rounds.length}`;


    scoreText.textContent =
        `Score: ${score}`;


    progress.style.width =
        `${currentRound / rounds.length * 100}%`;


    targetsEl.innerHTML =
        "";

    wordsEl.innerHTML =
        "";


    /* =====================================================
       CREATE VIETNAMESE TARGETS
    ====================================================== */

    shuffle(pairs).forEach(
        item => {

            const target =
                document.createElement(
                    "div"
                );


            target.className =
                "target";


            target.textContent =
                item.vi;


            target.dataset.vi =
                item.vi;


            target.dataset.selected =
                "";


            target.addEventListener(
                "dragover",
                event => {

                    if(roundChecked){

                        return;

                    }


                    if(
                        target.dataset.selected !== ""
                    ){

                        return;

                    }


                    event.preventDefault();


                    target.classList.add(
                        "over"
                    );

                }
            );


            target.addEventListener(
                "dragleave",
                () => {

                    target.classList.remove(
                        "over"
                    );

                }
            );


            target.addEventListener(
                "drop",
                event => {

                    event.preventDefault();


                    target.classList.remove(
                        "over"
                    );


                    if(roundChecked){

                        return;

                    }


                    if(!draggedWord){

                        return;

                    }


                    if(
                        target.dataset.selected !== ""
                    ){

                        return;

                    }


                    const english =
                        draggedWord.dataset.word;


                    const vietnamese =
                        draggedWord.dataset.vi;


                    target.dataset.selected =
                        vietnamese;


                    target.dataset.english =
                        english;


                    target.textContent =
                        `${target.dataset.vi}`;


                    target.classList.add(
                        "filled"
                    );


                    draggedWord.classList.add(
                        "used"
                    );


                    draggedWord = null;


                    updateCheckButton();

                }
            );


            targetsEl.appendChild(
                target
            );

        }
    );


    /* =====================================================
       CREATE ENGLISH WORDS
    ====================================================== */

    shuffle(pairs).forEach(
        item => {

            const word =
                document.createElement(
                    "div"
                );


            word.className =
                "word";


            word.textContent =
                item.en;


            word.draggable =
                true;


            word.dataset.word =
                item.en;


            word.dataset.vi =
                item.vi;


            word.addEventListener(
                "dragstart",
                event => {

                    if(
                        roundChecked ||
                        word.classList.contains(

                        )
                    ){

                        event.preventDefault();

                        return;

                    }


                    draggedWord =
                        word;


                    word.classList.add(
                        "dragging"
                    );

                }
            );


            word.addEventListener(
                "dragend",
                () => {

                    word.classList.remove(
                        "dragging"
                    );

                }
            );


            wordsEl.appendChild(
                word
            );

        }
    );


    updateCheckButton();

}


/* =========================================================
   CHECK BUTTON STATE
========================================================= */

function updateCheckButton(){

    const targets =
        document.querySelectorAll(
            ".target"
        );


    const allFilled =
        targets.length > 0 &&
        [...targets].every(
            target =>
                target.dataset.selected !== ""
        );


    checkBtn.disabled =
        !allFilled ||
        roundChecked;

}


/* =========================================================
   CHECK ANSWERS
========================================================= */

function checkAnswers(){

    if(roundChecked){

        return;

    }


    const targets =
        document.querySelectorAll(
            ".target"
        );


    const unanswered =
        [...targets].some(
            target =>
                target.dataset.selected === ""
        );


    if(unanswered){

        messageEl.textContent =
            "Please match all words first.";

        messageEl.style.color =
            "#d9536f";

        return;

    }


    roundChecked = true;

    checkBtn.disabled = true;


    let correctCount = 0;

    const explanationList = [];


    targets.forEach(
        target => {

            const targetVietnamese =
                target.dataset.vi;


            const selectedVietnamese =
                target.dataset.selected;


            const selectedEnglish =
                target.dataset.english;


            const item =
                vocabulary.find(
                    word =>
                        word.vi ===
                        selectedVietnamese &&
                        word.en ===
                        selectedEnglish
                );


            /* =============================================
               CORRECT
            ============================================= */

            if(
                selectedVietnamese ===
                targetVietnamese
            ){

                target.classList.remove(
                    "filled"
                );


                target.classList.add(
                    "correct"
                );


                correctCount++;


                explanationList.push(

                    item

                        ? `<strong>${item.en}</strong> → <strong>${item.vi}</strong><br>${item.explanation}`

                        : `<strong>${selectedEnglish}</strong> → <strong>${selectedVietnamese}</strong>`

                );

            }


            /* =============================================
               WRONG
            ============================================= */

            else{

                target.classList.remove(
                    "filled"
                );


                target.classList.add(
                    "wrong"
                );


                const correctItem =
                    vocabulary.find(
                        word =>
                            word.vi ===
                            targetVietnamese
                    );


                if(correctItem){

                    target.textContent =
                        `${targetVietnamese} — ${correctItem.en}`;


                    explanationList.push(

                        `<strong>${correctItem.en}</strong> → <strong>${correctItem.vi}</strong><br>${correctItem.explanation}`

                    );

                }

            }

        }
    );


    score +=
        correctCount;


    scoreText.textContent =
        `Score: ${score}`;


    /* =====================================================
       RESULT MESSAGE
    ====================================================== */

    if(
        correctCount ===
        targets.length
    ){

        messageEl.textContent =
            "✓ Perfect!";

        messageEl.style.color =
            "#2878df";

    }

    else{

        messageEl.textContent =
            `${correctCount} / ${targets.length} correct.`;

        messageEl.style.color =
            "#d9536f";

    }


    /* =====================================================
       EXPLANATION
    ====================================================== */

    explanationEl.innerHTML =
        explanationList.join(
            "<br><br>"
        );


    explanationEl.classList.add(
        "show"
    );


    /* =====================================================
       LOCK WORDS
    ====================================================== */

    document
        .querySelectorAll(
            ".word"
        )
        .forEach(
            word => {

                word.draggable =
                    false;

            }
        );


    /* =====================================================
       SHOW NEXT
    ====================================================== */

    nextBtn.style.display =
        "block";

}


/* =========================================================
   NEXT ROUND
========================================================= */

function nextRound(){

    if(!roundChecked){

        return;

    }


    currentRound++;


    if(
        currentRound >=
        rounds.length
    ){

        finishGame();

        return;

    }


    loadRound();

}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

    progress.style.width =
        "100%";


    gameScreen.style.display =
        "none";


    finalScreen.style.display =
        "block";


    const percentage =
        Math.round(
            score /
            totalPairs *
            100
        );


    document.getElementById(
        "finalScore"
    ).textContent =
        `Score: ${score} / ${totalPairs}`;


    let result;


    if(
        percentage === 100
    ){

        result =
            "🏆 Perfect! You know your Vietnamese food and drink vocabulary.";

    }

    else if(
        percentage >= 80
    ){

        result =
            "🎉 Excellent! Keep practicing your Vietnamese.";

    }

    else if(
        percentage >= 60
    ){

        result =
            "👍 Good job! You're getting better.";

    }

    else{

        result =
            "📚 Keep practicing your Vietnamese food and drink vocabulary.";

    }


    document.getElementById(
        "finalMessage"
    ).textContent =
        `${percentage}% — ${result}`;

}


/* =========================================================
   RESTART GAME
========================================================= */

function restartGame(){

    currentRound = 0;

    score = 0;

    draggedWord = null;

    roundChecked = false;


    rounds =
        createRounds();


    finalScreen.style.display =
        "none";


    gameScreen.style.display =
        "block";


    loadRound();

}


/* =========================================================
   INITIALIZE
========================================================= */

loadRound();

</script>
