<style>

/* =========================================================
   COLOR SYSTEM
========================================================= */

:root{

    --accent:#A99959;

    --accent-dark:#7B6F40;

    --accent-light:#f9f6e6;

    --accent-bg:#FBFAF0;

    --accent-border:#e8dfb2;

    --ink:#3f3d36;

    --muted:#706f68;

    --correct:#019b3f;

    --correct-bg:#eaf3ff;

    --wrong:#d9536f;

    --wrong-bg:#fff0f3;

/* =========================================================
   GLOBAL
========================================================= */

*{

    box-sizing:border-box;

}


body{

    margin:0;

    min-height:100vh;

    padding:28px 20px 45px;

    font-family:
        Calibri,
        'Segoe UI',
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            var(--accent-bg) 48%,
            var(--accent-light) 100%
        );

}


/* =========================================================
   PAGE WRAPPER
========================================================= */

.page{

    width:100%;

    max-width:900px;

}


/* =========================================================
   BACK BUTTON
========================================================= */

.back-btn-container{

    width:100%;

    margin:0 auto 15px;

}


.back-btn{

    display:inline-block;

    padding:9px 17px;

    background:#f5f5f5;

    color:#555;

    border:2px solid var(--general-border);

    border-radius:10px;

    text-decoration:none;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:21px;

    font-weight:bold;

    transition:.2s;

}


.back-btn:hover{

    background:var(--accent-light);

    border-color:var(--accent-border);

    color:var(--accent-dark);

    transform:translateY(-2px);

}


/* =========================================================
   MAIN GAME CARD
========================================================= */

.game{

    position:relative;

    width:100%;

    max-width:900px;

    margin:0 auto;

    padding:32px 38px 38px;

    background: #ffffff;

    border:1px solid var(--general-border);

    border-radius:22px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.08);

    text-align:center;

    overflow:hidden;

}


/* =========================================================
   ACCENT LINE
========================================================= */

.game::before{

    content:"";

    position:absolute;

    top:0;

    left:0;

    right:0;

    height:6px;

    background:var(--accent);

}


/* =========================================================
   GAME HEADER
========================================================= */

.game-header{

    margin-bottom:25px;

}


.game-header h1{

    margin:3px 0 6px;

    color:var(--ink);

    font-family:
        Kalam,
        Calibri,
        Arial,
        sans-serif;

    font-size:44px;

    font-weight:700;

    line-height:1.2;

}


.game-description{

    margin:0;

    color:var(--muted);

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:23px;

    line-height:1.45;

}


/* =========================================================
   GAME SCREEN
========================================================= */

#gameScreen{

    width:100%;

}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    margin-bottom:11px;

}


.round{

    color:#666;

    font-size:22px;

    font-weight:bold;

}


.score{

    color:var(--accent-dark);

    font-size:25px;

    font-weight:bold;

}


/* =========================================================
   PROGRESS BAR
========================================================= */

.progress-container{

    width:100%;

    height:8px;

    margin-bottom:25px;

    background:var(--accent-light);

    border:1px solid var(--accent-border);

    border-radius:999px;

    overflow:hidden;

}


.progress-bar{

    width:0%;

    height:100%;

    background:var(--accent);

    border-radius:999px;

    transition:
        width .3s ease;

}


/* =========================================================
   QUESTION
========================================================= */

.question{

    margin:22px 0 24px;

    color:var(--ink);

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:34px;

    font-weight:bold;

    line-height:1.4;

}


.question-word{

    color:var(--accent-dark);

}


/* =========================================================
   OPTIONS
========================================================= */

.options{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:14px;

    margin-top:15px;

}


.option-btn{

    min-height:70px;

    padding:14px 12px;

    background:#ffffff;

    color:var(--accent-dark);

    border:2px solid var(--accent-border);

    border-radius:13px;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:24px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.option-btn:hover{

    background:var(--accent-light);

    border-color:var(--accent);

    transform:translateY(-2px);

}


.option-btn.selected{

    background:var(--accent-light);

    color:var(--accent-dark);

    border-color:var(--accent);

    box-shadow:
        0 0 0 3px rgba(169,153,89,.12);

    transform:translateY(-2px);

}


.option-btn.correct{

    background:var(--correct-light) !important;

    color:var(--correct) !important;

    border-color:var(--correct) !important;

    cursor:default;

}


.option-btn.wrong{

    background:var(--wrong-light) !important;

    color:var(--wrong) !important;

    border-color:var(--wrong) !important;

    cursor:default;

}


.option-btn:disabled{

    cursor:default;

    transform:none;

}


/* =========================================================
   CHECK BUTTON
========================================================= */

#checkBtn{

    display:inline-block;

    margin-top:22px;

    padding:11px 27px;

    background:var(--accent);

    color:#f5f5f5;

    border:none;

    border-radius:11px;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:23px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


#checkBtn:hover{

    background:var(--accent-dark);

    transform:translateY(-2px);

}


#checkBtn:disabled{

    opacity:.45;

    cursor:default;

    transform:none;

}


/* =========================================================
   MESSAGE
========================================================= */

.message{

    min-height:36px;

    margin:17px 0 8px;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:25px;

    font-weight:bold;

    line-height:1.4;

}


/* =========================================================
   EXPLANATION
========================================================= */

.explanation{

    width:100%;

    margin:14px auto 18px;

    padding:15px 18px;

    background:var(--accent-bg);

    border:1px solid var(--accent-border);

    border-left:5px solid var(--accent);

    border-radius:12px;

    color:#4a4a4a;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:22px;

    line-height:1.5;

    text-align:left;

}


.explanation strong{

    color:var(--accent-dark);

}


.hidden{

    display:none;

}


/* =========================================================
   NEXT BUTTON
========================================================= */

#nextBtn{

    display:none;

    margin-top:4px;

    padding:11px 28px;

    background:var(--accent);

    color:#f5f5f5;

    border:none;

    border-radius:11px;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:23px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


#nextBtn:hover{

    background:var(--accent-dark);

    transform:translateY(-2px);

}


/* =========================================================
   FINAL SCREEN
========================================================= */

.final{

    display:none;

    padding:22px 10px 8px;

}


.final-icon{

    font-size:62px;

    margin-bottom:6px;

}


.final h2{

    margin:4px 0 17px;

    color:var(--ink);

    font-family:
        Kalam,
        Calibri,
        Arial,
        sans-serif;

    font-size:44px;

    font-weight:700;

    line-height:1.2;

}


.final-score{

    margin:17px 0;

    color:var(--ink);

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:32px;

    font-weight:bold;

}


.final-percent{

    margin:9px 0;

    color:#666;

    font-family:

}


.final-message{

    color:var(--accent-dark);

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:29px;

    font-weight:bold;

}


.restart-btn{

    margin-top:5px;

    padding:12px 29px;

    background:var(--accent);

    color:#f5f5f5;

    border:none;

    border-radius:11px;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:24px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.restart-btn:hover{

    background:var(--accent-dark);

    transform:translateY(-2px);

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    body{

        padding:20px 12px 35px;

        align-items:flex-start;

    }


    .page{

        width:100%;

    }


    .game{

        width:100%;

        padding:29px 18px 30px;

    }


    .back-btn{

        font-size:20px;

    }


    .game-header h1{

        font-size:38px;

    }


    .game-description{

        font-size:21px;

    }


    .topbar{

        gap:10px;

    }


    .round{

        font-size:20px;

    }


    .score{

        font-size:22px;

    }


    .question{

        font-size:30px;

    }


    .options{

        grid-template-columns:1fr;

        gap:12px;

    }


    .option-btn{

        min-height:62px;

        font-size:23px;

    }


    .message{

        font-size:24px;

    }


    .explanation{

        font-size:21px;

    }


    #checkBtn,
    #nextBtn{

    .final-score{

    }

}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media(max-width:400px){

}

<script>


/* =========================================================
   QUESTION DATA
========================================================= */

const originalQuestions = [

    {
        vn:"chai",
        en:"bottle"
    },

    {
        vn:"ly",
        en:"glass / cup"
    },

    {
        vn:"tô",
        en:"bowl"
    },

    {
        vn:"dĩa",
        en:"plate"
    },

    {
        vn:"nước lọc",
        en:"water"
    },

    {
        vn:"nước ngọt",
        en:"soda"
    },

    {
        vn:"trà",
        en:"tea"
    },

    {
        vn:"cà phê",
        en:"coffee"
    },

    {
        vn:"nước cam",
        en:"orange juice"
    },

    {
        vn:"nước chanh",
        en:"lemonade"
    },

    {
        vn:"mì",
        en:"noodles"
    },

    {
        vn:"gà",
        en:"chicken"
    },

    {
        vn:"bò",
        en:"beef"
    },

    {
        vn:"heo",
        en:"pork"
    },

    {
        vn:"rau",
        en:"vegetables"
    },

    {
        vn:"trứng",
        en:"egg"
    },

    {
        vn:"cá",
        en:"fish"
    }

];


/* =========================================================
   EXPLANATIONS
========================================================= */

const explanations = {

    "chai":{
        meaning:"Chai means bottle."
    },

    "ly":{
        meaning:"Ly means glass or cup."
    },

    "tô":{
        meaning:"Tô means bowl."
    },

    "dĩa":{
        meaning:"Dĩa means plate."
    },

    "nước lọc":{
        meaning:"Nước lọc means drinking water or plain water."
    },

    "nước ngọt":{
        meaning:"Nước ngọt means soda or soft drink."
    },

    "trà":{
        meaning:"Trà means tea."
    },

    "cà phê":{
        meaning:"Cà phê means coffee."
    },

    "nước cam":{
        meaning:"Nước cam means orange juice."
    },

    "nước chanh":{
        meaning:"Nước chanh means lemonade or lemon drink."
    },

    "mì":{
        meaning:"Mì means noodles."
    },

    "gà":{
        meaning:"Gà means chicken."
    },

    "bò":{
        meaning:"Bò means beef."
    },

    "heo":{
        meaning:"Heo means pork."
    },

    "rau":{
        meaning:"Rau means vegetables or leafy greens."
    },

    "trứng":{
        meaning:"Trứng means egg."
    },

    "cá":{
        meaning:"Cá means fish."
    }

};


/* =========================================================
   GAME SETTINGS
========================================================= */

const TOTAL_QUESTIONS = 20;


/* =========================================================
   GAME STATE
========================================================= */

let questions = [];

let currentQuestion = 0;

let score = 0;

let selectedAnswer = null;

let answered = false;


/* =========================================================
   DOM
========================================================= */

const questionNumberEl =
    document.getElementById(
        "questionNumber"
    );

const scoreEl =
    document.getElementById(
        "score"
    );

const questionEl =
    document.getElementById(
        "question"
    );

const optionsEl =
    document.getElementById(
        "options"
    );

const checkBtn =
    document.getElementById(
        "checkBtn"
    );

const messageEl =
    document.getElementById(
        "message"
    );

const explanationEl =
    document.getElementById(
        "explanation"
    );

const nextBtn =
    document.getElementById(
        "nextBtn"
    );

const progressBar =
    document.getElementById(
        "progressBar"
    );


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    const copy = [...array];


    for(
        let i = copy.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            copy[i],
            copy[j]
        ] =
        [
            copy[j],
            copy[i]
        ];

    }


    return copy;

}


/* =========================================================
   CREATE QUESTION SET
========================================================= */

function createQuestionSet(){

    questions = [];

    let previous = null;


    while(
        questions.length <
        TOTAL_QUESTIONS
    ){

        const batch =
            shuffle(originalQuestions);


        for(
            const question of batch
        ){

            if(
                questions.length >=
                TOTAL_QUESTIONS
            ){

                break;

            }


            if(
                previous &&
                previous.vn ===
                question.vn
            ){

                continue;

            }


            questions.push(
                question
            );


            previous =
                question;

        }

    }

}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    currentQuestion = 0;

    score = 0;

    selectedAnswer = null;

    answered = false;


    createQuestionSet();


    document.getElementById(
        "finalScreen"
    ).style.display =
        "none";


    document.getElementById(
        "gameScreen"
    ).style.display =
        "block";


    updateScore();

    loadQuestion();

}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion(){

    answered = false;

    selectedAnswer = null;


    const q =
        questions[
            currentQuestion
        ];


    questionNumberEl.textContent =
        currentQuestion + 1;


    scoreEl.textContent =
        score;


    /* =====================================================
       PROGRESS
    ====================================================== */

    const progress =
        (
            currentQuestion /
            TOTAL_QUESTIONS
        ) * 100;


    progressBar.style.width =
        `${progress}%`;


    /* =====================================================
       QUESTION
    ====================================================== */

    questionEl.innerHTML = `

        What is the meaning of

        "<span class="question-word">
            ${q.vn}
        </span>"?

    `;


    /* =====================================================
       RESET
    ====================================================== */

    messageEl.textContent =
        "";

    messageEl.style.color =
        "";


    explanationEl.innerHTML =
        "";

    explanationEl.classList.add(
        "hidden"
    );


    checkBtn.disabled =
        true;


    checkBtn.style.display =
        "inline-block";


    nextBtn.style.display =
        "none";


    createOptions(q);

}


/* =========================================================
   CREATE OPTIONS
========================================================= */

function createOptions(q){

    let options = [

        q.en

    ];


    while(
        options.length < 3
    ){

        const randomQuestion =
            originalQuestions[
                Math.floor(
                    Math.random() *
                    originalQuestions.length
                )
            ];


        const randomAnswer =
            randomQuestion.en;


        if(
            !options.includes(
                randomAnswer
            )
        ){

            options.push(
                randomAnswer
            );

        }

    }


    options =
        shuffle(options);


    optionsEl.innerHTML =
        "";


    options.forEach(
        option => {

            const btn =
                document.createElement(
                    "button"
                );


            btn.className =
                "option-btn";


            btn.textContent =
                option;


            btn.addEventListener(
                "click",
                () => {

                    selectAnswer(
                        btn,
                        option
                    );

                }
            );


            optionsEl.appendChild(
                btn
            );

        }
    );

}


/* =========================================================
   SELECT ANSWER
========================================================= */

function selectAnswer(
    btn,
    answer
){

    if(answered){

        return;

    }


    document
        .querySelectorAll(
            ".option-btn"
        )
        .forEach(
            option => {

                option.classList.remove(
                    "selected"
                );

            }
        );


    btn.classList.add(
        "selected"
    );


    selectedAnswer =
        answer;


    checkBtn.disabled =
        false;

}


/* =========================================================
   CHECK ANSWER
========================================================= */

function checkAnswer(){

    if(
        answered ||
        selectedAnswer === null
    ){

        return;

    }


    answered = true;


    const question =
        questions[
            currentQuestion
        ];


    const buttons =
        document.querySelectorAll(
            ".option-btn"
        );


    buttons.forEach(
        btn => {

            btn.disabled =
                true;

        }
    );


    checkBtn.disabled =
        true;


    /* =====================================================
       CORRECT
    ====================================================== */

    if(
        selectedAnswer ===
        question.en
    ){

        score++;


        scoreEl.textContent =
            score;


        messageEl.textContent =
            "✓ Correct!";


        messageEl.style.color =
            "var(--correct)";


        buttons.forEach(
            btn => {

                if(
                    btn.textContent ===
                    question.en
                ){

                    btn.classList.remove(
                        "selected"
                    );

                    btn.classList.add(
                        "correct"
                    );

                }

            }
        );

    }


    /* =====================================================
       WRONG
    ====================================================== */

    else{

        messageEl.innerHTML =
            `✕ Incorrect. The answer is <strong>${question.en}</strong>.`;


        messageEl.style.color =
            "var(--wrong)";


        buttons.forEach(
            btn => {

                if(
                    btn.textContent ===
                    selectedAnswer
                ){

                    btn.classList.remove(
                        "selected"
                    );

                    btn.classList.add(
                        "wrong"
                    );

                }


                if(
                    btn.textContent ===
                    question.en
                ){

                    btn.classList.add(
                        "correct"
                    );

                }

            }
        );

    }


    showExplanation(
        question
    );


    /* =====================================================
       UPDATE PROGRESS
    ====================================================== */

    const progress =
        (
            (currentQuestion + 1) /
            TOTAL_QUESTIONS
        ) * 100;


    progressBar.style.width =
        `${progress}%`;


    /* =====================================================
       NEXT BUTTON
    ====================================================== */

    if(
        currentQuestion ===
        TOTAL_QUESTIONS - 1
    ){

        nextBtn.textContent =
            "See Results →";

    }

    else{

        nextBtn.textContent =
            "Next →";

    }


    nextBtn.style.display =
        "inline-block";

}


/* =========================================================
   SHOW EXPLANATION
========================================================= */

function showExplanation(
    question
){

    const data =
        explanations[
            question.vn
        ];


    if(!data){

        return;

    }


    explanationEl.innerHTML = `

        <strong>💡 Learn:</strong>

        <strong>${question.vn}</strong>
        →
        <strong>${question.en}</strong>

        <br>

        ${data.meaning}

    `;


    explanationEl.classList.remove(
        "hidden"
    );

}


/* =========================================================
   UPDATE SCORE
========================================================= */

function updateScore(){

    scoreEl.textContent =
        score;

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion(){

    currentQuestion++;


    if(
        currentQuestion >=
        TOTAL_QUESTIONS
    ){

        finishGame();

        return;

    }


    loadQuestion();

}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

    document.getElementById(
        "gameScreen"
    ).style.display =
        "none";


    document.getElementById(
        "finalScreen"
    ).style.display =
        "block";


    progressBar.style.width =
        "100%";


    const percentage =
        Math.round(
            score /
            TOTAL_QUESTIONS *
            100
        );


    document.getElementById(
        "finalScore"
    ).textContent =
        `${score} / ${TOTAL_QUESTIONS}`;


    document.getElementById(
        "finalPercent"
    ).textContent =
        `${percentage}%`;


    let message;


    if(
        percentage >= 90
    ){

        message =
            "🏆 Excellent!";

    }

    else if(
        percentage >= 75
    ){

        message =
            "🎉 Great Job!";

    }

    else if(
        percentage >= 60
    ){

        message =
            "👍 Good Work!";

    }

    else{

        message =
            "📚 Keep Practicing!";

    }


    document.getElementById(
        "finalMessage"
    ).textContent =
        message;


    if (
        typeof trackGameComplete ===
        "function"
    ) {
        trackGameComplete(
            "Food - Game 3",
            score,
            TOTAL_QUESTIONS
        );
    }

}

/* =========================================================
   RESTART GAME
========================================================= */

function restartGame(){

    currentQuestion = 0;

    score = 0;

    selectedAnswer = null;

    answered = false;


    document.getElementById(
        "finalScreen"
    ).style.display =
        "none";


    document.getElementById(
        "gameScreen"
    ).style.display =
        "block";


    updateScore();

    createQuestionSet();

    loadQuestion();

}


/* =========================================================
   START AUTOMATICALLY
========================================================= */

window.trackGameStart(
    "Food - Game 3"
);

startGame();


</script>
