<style>

/* =========================================================
   COLOR SYSTEM
========================================================= */

:root{

    --accent:#2878df;

    --accent-dark:#1e5fba;

    --accent-light:#eaf3ff;

    --accent-border:#c4daf6;

    --general-border:#d9e6f2;

    --correct:#2878df;

    --correct-light:#eaf3ff;

/* =========================================================

*{

body{

   BACK BUTTON

.back-btn{

.progress-container{

.progress-bar{

.options{

}

.option-btn:hover{

button{

.explanation{

<script>


/* =========================================================
   QUESTION DATA
========================================================= */

const originalQuestions = [

    {
        vn:"chai",
        en:"bottle"
    },

    {
        vn:"ly",
        en:"glass / cup"
    },

    {
        vn:"tô",
        en:"bowl"
    },

    {
        vn:"dĩa",
        en:"plate"
    },

    {
        vn:"nước lọc",
        en:"water"
    },

    {
        vn:"nước ngọt",
        en:"soda"
    },

    {
        vn:"trà",
        en:"tea"
    },

    {
        vn:"cà phê",
        en:"coffee"
    },

    {
        vn:"nước cam",
        en:"orange juice"
    },

    {
        vn:"nước chanh",
        en:"lemonade"
    },

    {
        vn:"mì",
        en:"noodles"
    },

    {
        vn:"gà",
        en:"chicken"
    },

    {
        vn:"bò",
        en:"beef"
    },

    {
        vn:"heo",
        en:"pork"
    },

    {
        vn:"rau",
        en:"vegetables"
    },

    {
        vn:"trứng",
        en:"egg"
    },

    {
        vn:"cá",
        en:"fish"
    }

];


/* =========================================================
   EXPLANATIONS
========================================================= */

const explanations = {

    "chai":{
        meaning:"Chai means bottle."
    },

    "ly":{
        meaning:"Ly means glass or cup."
    },

    "tô":{
        meaning:"Tô means bowl."
    },

    "dĩa":{
        meaning:"Dĩa means plate."
    },

    "nước lọc":{
        meaning:"Nước lọc means drinking water or plain water."
    },

    "nước ngọt":{
        meaning:"Nước ngọt means soda or soft drink."
    },

    "trà":{
        meaning:"Trà means tea."
    },

    "cà phê":{
        meaning:"Cà phê means coffee."
    },

    "nước cam":{
        meaning:"Nước cam means orange juice."
    },

    "nước chanh":{
        meaning:"Nước chanh means lemonade or lemon drink."
    },

    "mì":{
        meaning:"Mì means noodles."
    },

    "gà":{
        meaning:"Gà means chicken."
    },

    "bò":{
        meaning:"Bò means beef."
    },

    "heo":{
        meaning:"Heo means pork."
    },

    "rau":{
        meaning:"Rau means vegetables or leafy greens."
    },

    "trứng":{
        meaning:"Trứng means egg."
    },

    "cá":{
        meaning:"Cá means fish."
    }

};


/* =========================================================
   GAME SETTINGS
========================================================= */

const TOTAL_QUESTIONS = 20;


/* =========================================================
   GAME STATE
========================================================= */

let questions = [];

let currentQuestion = 0;

let score = 0;

let selectedAnswer = null;

let answered = false;


/* =========================================================
   DOM
========================================================= */

const questionNumberEl =
    document.getElementById(
        "questionNumber"
    );

const scoreEl =
    document.getElementById(
        "score"
    );

const questionEl =
    document.getElementById(
        "question"
    );

const optionsEl =
    document.getElementById(
        "options"
    );

const checkBtn =
    document.getElementById(
        "checkBtn"
    );

const messageEl =
    document.getElementById(
        "message"
    );

const explanationEl =
    document.getElementById(
        "explanation"
    );

const nextBtn =
    document.getElementById(
        "nextBtn"
    );

const progressBar =
    document.getElementById(
        "progressBar"
    );


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    const copy = [...array];

    for(
        let i = copy.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        [
            copy[i],
            copy[j]
        ] =
        [
            copy[j],
            copy[i]
        ];

    }

    return copy;

}


/* =========================================================
   CREATE QUESTION SET
========================================================= */

function createQuestionSet(){

    questions = [];

    let previous = null;


    while(
        questions.length <
        TOTAL_QUESTIONS
    ){

        const batch =
            shuffle(originalQuestions);


        for(
            const question of batch
        ){

            if(
                questions.length >=
                TOTAL_QUESTIONS
            ){

                break;

            }


            if(
                previous &&
                previous.vn ===
                question.vn
            ){

                continue;

            }


            questions.push(
                question
            );


            previous =
                question;

        }

    }

}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    currentQuestion = 0;

    score = 0;

    selectedAnswer = null;

    answered = false;


    createQuestionSet();


    document.getElementById(
        "finalScreen"
    ).style.display =
        "none";


    document.getElementById(
        "gameScreen"
    ).style.display =
        "block";


    updateScore();

    loadQuestion();

}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion(){

    answered = false;

    selectedAnswer = null;


    const q =
        questions[
            currentQuestion
        ];


    questionNumberEl.textContent =
        currentQuestion + 1;


    scoreEl.textContent =
        score;


    /* =====================================================
       PROGRESS
    ===================================================== */

    const progress =
        (
            currentQuestion /
            TOTAL_QUESTIONS
        ) * 100;


    progressBar.style.width =
        `${progress}%`;


    /* =====================================================
       QUESTION
    ===================================================== */

    questionEl.innerHTML = `

        What is the meaning of

        "<span style="
            color:var(--accent);
        ">${q.vn}</span>"?

    `;


    /* =====================================================
       RESET
    ===================================================== */

    messageEl.textContent =
        "";

    messageEl.style.color =
        "";


    explanationEl.innerHTML =
        "";

    explanationEl.classList.add(
        "hidden"
    );


    checkBtn.disabled =
        true;


    checkBtn.style.display =
        "inline-block";


    nextBtn.style.display =
        "none";


    createOptions(q);

}


/* =========================================================
   CREATE OPTIONS
========================================================= */

function createOptions(q){

    let options = [
        q.en
    ];


    while(
        options.length < 3
    ){

        const randomQuestion =
            originalQuestions[
                Math.floor(
                    Math.random() *
                    originalQuestions.length
                )
            ];


        const randomAnswer =
            randomQuestion.en;


        if(
            !options.includes(
                randomAnswer
            )
        ){

            options.push(
                randomAnswer
            );

        }

    }


    options =
        shuffle(options);


    optionsEl.innerHTML =
        "";


    options.forEach(
        option => {

            const btn =
                document.createElement(
                    "button"
                );


            btn.className =
                "option-btn";


            btn.textContent =
                option;


            btn.addEventListener(
                "click",
                () => {

                    selectAnswer(
                        btn,
                        option
                    );

                }
            );


            optionsEl.appendChild(
                btn
            );

        }
    );

}


/* =========================================================
   SELECT ANSWER
========================================================= */

function selectAnswer(
    btn,
    answer
){

    if(answered){

        return;

    }


    document
        .querySelectorAll(".option-btn")
        .forEach(
            option => {

                option.classList.remove(
                    "selected"
                );

            }
        );


    btn.classList.add(
        "selected"
    );


    selectedAnswer =
        answer;


    checkBtn.disabled =
        false;

}


/* =========================================================
   CHECK ANSWER
========================================================= */

function checkAnswer(){

    if(
        answered ||
        selectedAnswer === null
    ){

        return;

    }


    answered = true;


    const question =
        questions[
            currentQuestion
        ];


    const buttons =
        document.querySelectorAll(
            ".option-btn"
        );


    buttons.forEach(
        btn => {

            btn.disabled =
                true;

        }
    );


    checkBtn.disabled =
        true;


    /* =====================================================
       CORRECT
    ===================================================== */

    if(
        selectedAnswer ===
        question.en
    ){

        score++;


        scoreEl.textContent =
            score;


        messageEl.textContent =
            "✅ Correct!";


        messageEl.style.color =
            "var(--correct)";


        buttons.forEach(
            btn => {

                if(
                    btn.textContent ===
                    question.en
                ){

                    btn.classList.remove(
                        "selected"
                    );

                    btn.classList.add(
                        "correct"
                    );

                }

            }
        );

    }


    /* =====================================================
       WRONG
    ===================================================== */

    else{

        messageEl.innerHTML =
            `❌ Incorrect. The answer is <strong>${question.en}</strong>.`;


        messageEl.style.color =
            "var(--wrong)";


        buttons.forEach(
            btn => {

                if(
                    btn.textContent ===
                    selectedAnswer
                ){

                    btn.classList.remove(
                        "selected"
                    );

                    btn.classList.add(
                        "wrong"
                    );

                }


                if(
                    btn.textContent ===
                    question.en
                ){

                    btn.classList.add(
                        "correct"
                    );

                }

            }
        );

    }


    showExplanation(
        question
    );


    /* =====================================================
       UPDATE PROGRESS AFTER ANSWER
    ===================================================== */

    const progress =
        (
            (currentQuestion + 1) /
            TOTAL_QUESTIONS
        ) * 100;


    progressBar.style.width =
        `${progress}%`;


    /* =====================================================
       NEXT BUTTON
    ===================================================== */

    if(
        currentQuestion ===
        TOTAL_QUESTIONS - 1
    ){

        nextBtn.textContent =
            "See Results →";

    }

    else{

        nextBtn.textContent =
            "Next →";

    }


    nextBtn.style.display =
        "inline-block";

}


/* =========================================================
   SHOW EXPLANATION
========================================================= */

function showExplanation(
    question
){

    const data =
        explanations[
            question.vn
        ];


    if(!data){

        return;

    }


    explanationEl.innerHTML = `

        <strong>💡 Learn:</strong>

        <strong>${question.vn}</strong>
        →
        <strong>${question.en}</strong>

        <br>

        ${data.meaning}

    `;


    explanationEl.classList.remove(
        "hidden"
    );

}


/* =========================================================
   UPDATE SCORE
========================================================= */

function updateScore(){

    scoreEl.textContent =
        score;

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion(){

    currentQuestion++;


    if(
        currentQuestion >=
        TOTAL_QUESTIONS
    ){

        finishGame();

        return;

    }


    loadQuestion();

}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

    document.getElementById(
        "gameScreen"
    ).style.display =
        "none";


    document.getElementById(
        "finalScreen"
    ).style.display =
        "block";


    progressBar.style.width =
        "100%";


    const percentage =
        Math.round(
            score /
            TOTAL_QUESTIONS *
            100
        );


    document.getElementById(
        "finalScore"
    ).textContent =
        `${score} / ${TOTAL_QUESTIONS}`;


    document.getElementById(
        "finalPercent"
    ).textContent =
        `${percentage}%`;


    let message;


    if(
        percentage >= 90
    ){

        message =
            "🏆 Excellent!";

    }

    else if(
        percentage >= 75
    ){

        message =
            "🎉 Great Job!";

    }

    else if(
        percentage >= 60
    ){

        message =
            "👍 Good Work!";

    }

    else{

        message =
            "📚 Keep Practicing!";

    }


    document.getElementById(
        "finalMessage"
    ).textContent =
        message;

}


/* =========================================================
   RESTART GAME
========================================================= */

function restartGame(){

    currentQuestion = 0;

    score = 0;

    selectedAnswer = null;

    answered = false;


    document.getElementById(
        "finalScreen"
    ).style.display =
        "none";


    document.getElementById(
        "gameScreen"
    ).style.display =
        "block";


    updateScore();

    createQuestionSet();

    loadQuestion();

}


/* =========================================================
   START AUTOMATICALLY
========================================================= */

startGame();

</script>
