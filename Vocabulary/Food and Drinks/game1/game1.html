<script>


/* =========================================================
   FOOD & DRINK VOCABULARY
   Only words with matching image files.
========================================================= */

const items = [

    {
        name:"bo",
        vi:"Bò",
        meaning:"beef"
    },

    {
        name:"ca",
        vi:"Cá",
        meaning:"fish"
    },

    {
        name:"cam",
        vi:"Cam",
        meaning:"orange"
    },

    {
        name:"caphe",
        vi:"Cà phê",
        meaning:"coffee"
    },

    {
        name:"chanh",
        vi:"Chanh",
        meaning:"lime"
    },

    {
        name:"chuoi",
        vi:"Chuối",
        meaning:"banana"
    },

    {
        name:"com",
        vi:"Cơm",
        meaning:"rice"
    },

    {
        name:"dua",
        vi:"Dừa",
        meaning:"coconut"
    },

    {
        name:"ga",
        vi:"Gà",
        meaning:"chicken"
    },

    {
        name:"heo",
        vi:"Heo",
        meaning:"pork / pig"
    },

    {
        name:"mi",
        vi:"Mì",
        meaning:"noodles"
    },

    {
        name:"nuoccam",
        vi:"Nước cam",
        meaning:"orange juice"
    },

    {
        name:"nuocloc",
        vi:"Nước lọc",
        meaning:"water"
    },

    {
        name:"rau",
        vi:"Rau",
        meaning:"vegetables"
    },

    {
        name:"tao",
        vi:"Táo",
        meaning:"apple"
    },

    {
        name:"xoai",
        vi:"Xoài",
        meaning:"mango"
    }

];


/* =========================================================
   SETTINGS
========================================================= */

const TOTAL_QUESTIONS = 20;


/* =========================================================
   STATE
========================================================= */

let currentQuestion = 0;

let score = 0;

let questionLocked = false;

let currentSelected = [];


/* =========================================================
   DOM
========================================================= */

const game =
    document.getElementById(
        "game"
    );


const final =
    document.getElementById(
        "final"
    );


const questionNumber =
    document.getElementById(
        "questionNumber"
    );


const totalQuestions =
    document.getElementById(
        "totalQuestions"
    );


const scoreElement =
    document.getElementById(
        "score"
    );


const progress =
    document.getElementById(
        "progress"
    );


const imagesContainer =
    document.getElementById(
        "imagesContainer"
    );


const wordsContainer =
    document.getElementById(
        "wordsContainer"
    );


const resultText =
    document.getElementById(
        "resultText"
    );


const explanationBox =
    document.getElementById(
        "explanationBox"
    );


const explanationText =
    document.getElementById(
        "explanationText"
    );


const nextBtn =
    document.getElementById(
        "nextBtn"
    );


const checkBtn =
    document.getElementById(
        "checkBtn"
    );


const finalScore =
    document.getElementById(
        "finalScore"
    );


const finalMessage =
    document.getElementById(
        "finalMessage"
    );


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    const copy =
        [...array];


    for(
        let i = copy.length - 1;

        i > 0;

        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            copy[i],
            copy[j]
        ] =
        [
            copy[j],
            copy[i]
        ];

    }


    return copy;

}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    currentQuestion = 0;

    score = 0;

    questionLocked = false;

    currentSelected = [];


    game.style.display =
        "block";


    final.style.display =
        "none";


    scoreElement.textContent =
        "0";


    totalQuestions.textContent =
        TOTAL_QUESTIONS;


    loadQuestion();

}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion(){

    questionLocked = false;

    currentSelected = [];


    resultText.textContent =
        "";

    resultText.className =
        "result-message";


    explanationBox.classList.remove(
        "show"
    );


    explanationText.innerHTML =
        "";


    nextBtn.style.display =
        "none";


    checkBtn.style.display =
        "block";


    checkBtn.disabled =
        false;


    nextBtn.textContent =

        currentQuestion ===
        TOTAL_QUESTIONS - 1

            ? "Finish 🎉"

            : "Next →";


    questionNumber.textContent =
        currentQuestion + 1;


    totalQuestions.textContent =
        TOTAL_QUESTIONS;


    progress.style.width =

        (
            currentQuestion /
            TOTAL_QUESTIONS *
            100
        ) + "%";


    imagesContainer.innerHTML =
        "";


    wordsContainer.innerHTML =
        "";


    /*
       First 15 questions:
       2 pictures.

       Last 5 questions:
       4 pictures.
    */

    const numberOfItems =

        currentQuestion < 15

            ? 2

            : 4;


    currentSelected =
        shuffle(items)
        .slice(
            0,
            numberOfItems
        );


    /* =====================================================
       CREATE IMAGE BOXES
    ====================================================== */

    currentSelected.forEach(
        item => {

            const imageBox =
                document.createElement(
                    "div"
                );


            imageBox.className =
                "image-box";


            const img =
                document.createElement(
                    "img"
                );


            img.src =
                `images/${item.name}.png`;


            img.alt =
                item.vi;


            img.onerror =
                function(){

                    this.style.display =
                        "none";

                };


            /* =============================================
               DROP ZONE
            ============================================== */

            const dropZone =
                document.createElement(
                    "div"
                );


            dropZone.className =
                "drop-zone";


            dropZone.textContent =
                "Drop word here";


            dropZone.dataset.answer =
                item.name;


            dropZone.dataset.selected =
                "";


            /* =============================================
               DRAG OVER
            ============================================== */

            dropZone.addEventListener(
                "dragover",
                event => {

                    if(questionLocked){

                        return;

                    }


                    event.preventDefault();


                    dropZone.classList.add(
                        "over"
                    );

                }
            );


            /* =============================================
               DRAG LEAVE
            ============================================== */

            dropZone.addEventListener(
                "dragleave",
                () => {

                    dropZone.classList.remove(
                        "over"
                    );

                }
            );


            /* =============================================
               DROP
            ============================================== */

            dropZone.addEventListener(
                "drop",
                event => {

                    event.preventDefault();


                    dropZone.classList.remove(
                        "over"
                    );


                    if(questionLocked){

                        return;

                    }


                    const draggedName =
                        event.dataTransfer.getData(
                            "name"
                        );


                    const draggedWord =
                        event.dataTransfer.getData(
                            "word"
                        );


                    const draggedId =
                        event.dataTransfer.getData(
                            "id"
                        );


                    const draggedElement =
                        document.getElementById(
                            draggedId
                        );


                    /*
                       Do not allow a word
                       already used.
                    */

                    if(
                        draggedElement &&
                        draggedElement.classList.contains(
                            "used"
                        )
                    ){

                        return;

                    }


                    /*
                       Do not overwrite
                       an existing answer.
                    */

                    if(
                        dropZone.dataset.selected !== ""
                    ){

                        return;

                    }


                    dropZone.dataset.selected =
                        draggedName;


                    dropZone.textContent =
                        draggedWord;


                    dropZone.classList.add(
                        "filled"
                    );


                    if(draggedElement){

                        draggedElement.classList.add(
                            "used"
                        );

                    }

                }
            );


            imageBox.appendChild(
                img
            );


            imageBox.appendChild(
                dropZone
            );


            imagesContainer.appendChild(
                imageBox
            );

        }
    );


    /* =====================================================
       CREATE WORDS
    ====================================================== */

    shuffle(currentSelected)
        .forEach(
            item => {

                const word =
                    document.createElement(
                        "div"
                    );


                word.className =
                    "word";


                word.textContent =
                    item.vi;


                word.draggable =
                    true;


                word.id =
                    `word-${currentQuestion}-${item.name}`;


                /* =========================================
                   DRAG START
                ========================================== */

                word.addEventListener(
                    "dragstart",
                    event => {

                        if(
                            questionLocked ||
                            word.classList.contains(
                                "used"
                            )
                        ){

                            event.preventDefault();

                            return;

                        }


                        event.dataTransfer.setData(
                            "name",
                            item.name
                        );


                        event.dataTransfer.setData(
                            "word",
                            item.vi
                        );


                        event.dataTransfer.setData(
                            "id",
                            word.id
                        );


                        word.classList.add(
                            "dragging"
                        );

                    }
                );


                /* =========================================
                   DRAG END
                ========================================== */

                word.addEventListener(
                    "dragend",
                    () => {

                        word.classList.remove(
                            "dragging"
                        );

                    }
                );


                wordsContainer.appendChild(
                    word
                );

            }
        );

}


/* =========================================================
   CHECK ANSWERS
========================================================= */

function checkAnswers(){

    if(questionLocked){

        return;

    }


    const zones =
        document.querySelectorAll(
            ".drop-zone"
        );


    /*
       Make sure every picture
       has a selected word.
    */

    const unanswered =
        [
            ...zones
        ].some(
            zone =>
                zone.dataset.selected === ""
        );


    if(unanswered){

        resultText.className =
            "result-message wrong-text";


        resultText.textContent =
            "Please match all pictures first.";

        return;

    }


    questionLocked = true;


    checkBtn.disabled =
        true;


    let correctCount = 0;


    zones.forEach(
        zone => {

            const correctAnswer =
                zone.dataset.answer;


            const selectedAnswer =
                zone.dataset.selected;


            /* =============================================
               CORRECT
            ============================================== */

            if(
                selectedAnswer ===
                correctAnswer
            ){

                zone.classList.remove(
                    "filled"
                );


                zone.classList.add(
                    "correct"
                );


                correctCount++;

            }


            /* =============================================
               WRONG
            ============================================== */

            else{

                zone.classList.remove(
                    "filled"
                );


                zone.classList.add(
                    "wrong"
                );


                const correctItem =
                    currentSelected.find(
                        item =>
                            item.name ===
                            correctAnswer
                    );


                if(correctItem){

                    zone.textContent =
                        `✗ ${correctItem.vi}`;

                }

            }

        }
    );


    /*
       One point for each
       correctly matched picture.
    */

    score +=
        correctCount;


    scoreElement.textContent =
        score;


    /* =====================================================
       RESULT MESSAGE
    ====================================================== */

    if(
        correctCount ===
        zones.length
    ){

        resultText.textContent =
            "✓ Perfect!";


        resultText.className =
            "result-message correct-text";

    }

    else{

        resultText.textContent =
            `${correctCount} / ${zones.length} correct.`;

        resultText.className =
            "result-message wrong-text";

    }


    /* =====================================================
       EXPLANATION
    ===================================================== */

    const explanations =
        currentSelected
            .map(
                item =>
                    `<strong>${item.vi}</strong> = ${item.meaning}`
            )
            .join("<br>");


    explanationText.innerHTML =
        explanations;


    explanationBox.classList.add(
        "show"
    );


    /* =====================================================
       SHOW NEXT
    ===================================================== */

    nextBtn.style.display =
        "block";

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion(){

    if(!questionLocked){

        return;

    }


    currentQuestion++;


    if(
        currentQuestion >=
        TOTAL_QUESTIONS
    ){

        finishGame();

        return;

    }


    loadQuestion();

}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

    progress.style.width =
        "100%";


    game.style.display =
        "none";


    final.style.display =
        "block";


    finalScore.textContent =

        `${score} / 20`;


    const percentage =
        Math.round(
            score / 20 * 100
        );


    let result;


    if(
        percentage === 100
    ){

        result =
            "🏆 Perfect! You know your Vietnamese food and drink words.";

    }

    else if(
        percentage >= 80
    ){

        result =
            "🎉 Excellent! Keep practicing your Vietnamese.";

    }

    else if(
        percentage >= 60
    ){

        result =
            "👍 Good job! You're getting better.";

    }

    else{

        result =
            "📚 Keep practicing your Vietnamese food and drink vocabulary.";

    }


    finalMessage.textContent =

        `${percentage}% — ${result}`;

}


/* =========================================================
   RESTART GAME
========================================================= */

function restartGame(){

    startGame();

}


/* =========================================================
   INITIALIZE
========================================================= */

startGame();

</script>
