/* =========================================================

*{

}


/* =========================================================
   DESIGN TOKENS
========================================================= */

:root{

    --accent:
        #A99959;

    --accent-dark:
        #7B6F40;

    --accent-light:
        #f9f6e6;

    --accent-bg:
        #FBFAF0;

    --accent-border:
        #e8dfb2;

    --ink:

    --text-soft:

    --general-border:
        #ddd8c7;

    --correct:
        #019b3f;

    --correct-bg:
        #eaf3ff;

    --wrong:

            var(--accent-light) 100%

}


/* =========================================================
   PAGE WRAPPER
========================================================= */

.page-wrapper{

    width:

    max-width:

}


/* =========================================================
   BACK BUTTON
========================================================= */

.back-btn-container{

    width:

    margin:

}


.back-btn{

    padding:

    background:
        var(--accent-light);

    color:
        var(--accent-dark);

    border:
        1px solid
        var(--accent-border);

    border-radius:
        11px;

    text-decoration:
        none;

    font-family:
        Calibri,
        'Segoe UI',

    font-size:
        22px;

    font-weight:
        700;

        .2s ease;

}


.back-btn:hover{

    border-color:

}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.container{

    position:
        relative;

    width:
        100%;

    margin:

        rgba(

            255,

    border-radius:
        22px;

    box-shadow:

            111,
            64,

        hidden;

}


/* =========================================================
   ACCENT LINE
========================================================= */

.container::before{

    top:

    left:

.question-label{

    font-weight:

    letter-spacing:

}


/* =========================================================

========================================================= */

.images{

    display:
        flex;

    justify-content:
        center;

    align-items:

    flex-wrap:

    gap:

/* =========================================================

.image-box{

        var(--white);

    display:

/* =========================================================

========================================================= */

.drop-zone{

    width:

    padding:

}

    border-color:

}


.drop-zone.filled{

    background:
        var(--accent-light);

    border:
        2px solid

    color:
        var(--accent-dark);

}


.drop-zone.correct{

    background:
        var(--correct-bg);

    border:
        2px solid

    color:

}


.drop-zone.wrong{

    background:

    border:

    color:

========================================================= */

.words{

    display:

========================================================= */

.word{

    padding:

    background:
        var(--white);

    border:
        2px solid
        var(--accent-border);

    border-radius:
        10px;

    color:
        var(--accent-dark);

    font-size:
        26px;

    font-weight:
        700;

    cursor:
        grab;

    user-select:
        none;

    transition:
        .2s ease;

}


.word:hover{

    transform:
        translateY(-2px);

    background:
        var(--accent-light);

    border-color:
        var(--accent);

}


.word:active{

    cursor:
        grabbing;

}


.word.dragging{

    opacity:
        .5;

}


.word.used{

    opacity:
        .35;

    cursor:
        default;

    transform:
        none;

}


/* =========================================================
   CHECK BUTTON
========================================================= */

.check-btn{

    display:
        block;

    margin:
        25px auto 0;

    padding:
        12px 28px;

    border:
        none;

    border-radius:
        11px;

    background:
        var(--accent);

    color:
        var(--white);

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:
        24px;

    font-weight:
        700;

    cursor:
        pointer;

    transition:
        .2s ease;

}


.check-btn:hover{

    background:
        var(--accent-dark);

    transform:
        translateY(-2px);

}


.check-btn:disabled{

    opacity:
        .5;

    cursor:
        default;

    transform:
        none;

}


/* =========================================================
   RESULT
========================================================= */

.result-message{

    min-height:

    margin-top:
        18px;

    text-align:
        center;

    font-size:
        26px;

    font-weight:
        700;

}


.correct-text{

    color:

}


.wrong-text{

    color:
        var(--wrong);

}


/* =========================================================
   EXPLANATION
========================================================= */

.explanation{

    display:
        none;

    margin-top:
        18px;

    padding:
        16px 18px;

    background:

}


.explanation.show{

    display:

}


.explanation-title{

    margin-bottom:

    color:
        var(--accent-dark);

    font-size:
        22px;

    font-weight:
        700;

}


.explanation-text{

    margin:

    font-size:

    line-height:
        1.6;

/* =========================================================
   NEXT BUTTON
========================================================= */

.next-btn{

    display:
        none;

    margin:
        20px auto 0;

    padding:
        11px 27px;

    border:
        none;

    border-radius:
        11px;

    background:
        var(--accent);

    color:
        var(--white);

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:
        24px;

    font-weight:
        700;

    cursor:
        pointer;

    transition:
        .2s ease;

}


.next-btn:hover{

    background:
        var(--accent-dark);

    transform:
        translateY(-2px);

}


/* =========================================================
   FINAL SCREEN
========================================================= */

#final{

    display:
        none;

    padding:
        25px 10px 10px;

    text-align:
        center;

}


.finish-icon{

    margin-bottom:
        5px;

    font-size:
        65px;

}


#final h2{

    margin:
        5px 0 15px;

    color:
        var(--ink);

    font-family:
        Kalam,
        cursive;

    font-size:
        42px;

}


.final-score{

    margin:
        20px 0;

    color:
        var(--accent-dark);

    font-size:
        48px;

    font-weight:
        700;

}


.final-message{

    margin-bottom:
        25px;

    color:
        var(--text-soft);

    font-size:
        25px;

    line-height:
        1.5;

}


.start-btn{

    padding:
        12px 28px;

    border:
        none;

    border-radius:
        11px;

    background:
        var(--accent);

    color:
        var(--white);

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:
        24px;

    font-weight:
        700;

    cursor:
        pointer;

    transition:
        .2s ease;

}


.start-btn:hover{

    background:
        var(--accent-dark);

    transform:

/* =========================================================

@media(max-width:600px){

    body{

</style>

/* =========================================================

========================================================= */

const TOTAL_QUESTIONS =
    20;


/* =========================================================

========================================================= */

let currentQuestion =
    0;

let score =
    0;

let questionLocked =
    false;

let currentSelected =
    [];


/* =========================================================

========================================================= */

const game =
    document.getElementById(
        "game"
    );


const final =
    document.getElementById(
        "final"
    );


const questionNumber =
    document.getElementById(
        "questionNumber"
    );

    );

    );

    );

/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    const copy =
        [...array];


    for(
        let i =
            copy.length - 1;

        i > 0;

        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            copy[i],
            copy[j]
        ] =
        [
            copy[j],
            copy[i]
        ];

    }


    return copy;

}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    currentQuestion =
        0;

    score =
        0;

    questionLocked =
        false;

    currentSelected =
        [];


    game.style.display =
        "block";


    final.style.display =
        "none";


    scoreElement.textContent =
        "0";


    totalQuestions.textContent =
        TOTAL_QUESTIONS;


    loadQuestion();

}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion(){

    questionLocked =
        false;

    currentSelected =
        [];


    resultText.textContent =
        "";

    resultText.className =
        "result-message";


    explanationBox.classList.remove(
        "show"
    );


    explanationText.innerHTML =
        "";


    nextBtn.style.display =
        "none";


    checkBtn.style.display =
        "block";


    checkBtn.disabled =
        false;


    nextBtn.textContent =

        currentQuestion ===
        TOTAL_QUESTIONS - 1

            ? "Finish 🎉"

            : "Next →";


    questionNumber.textContent =
        currentQuestion + 1;


    totalQuestions.textContent =
        TOTAL_QUESTIONS;


    progress.style.width =

        (
            currentQuestion /
            TOTAL_QUESTIONS *
            100
        ) + "%";


    imagesContainer.innerHTML =
        "";

    wordsContainer.innerHTML =
        "";


    /*
       First 15 questions:
       2 pictures.

       Last 5 questions:
       4 pictures.
    */

    const numberOfItems =

        currentQuestion < 15

            ? 2

            : 4;


    currentSelected =
        shuffle(items)
            .slice(
                0,
                numberOfItems
            );


    /* =====================================================
       CREATE IMAGE BOXES
    ====================================================== */

    currentSelected.forEach(
        item => {

            const imageBox =
                document.createElement(
                    "div"
                );


            imageBox.className =
                "image-box";


            const img =
                document.createElement(
                    "img"
                );


            img.src =
                `images/${item.name}.png`;


            img.alt =
                item.vi;


            img.onerror =
                function(){

                    this.style.display =
                        "none";

                };


            /* =============================================
               DROP ZONE
            ============================================== */

            const dropZone =
                document.createElement(
                    "div"
                );


            dropZone.className =
                "drop-zone";


            dropZone.textContent =
                "Drop word here";


            dropZone.dataset.answer =
                item.name;


            dropZone.dataset.selected =
                "";


            /* =============================================
               DRAG OVER
            ============================================== */

            dropZone.addEventListener(
                "dragover",
                event => {

                    if(
                        questionLocked
                    ){

                        return;

                    }


                    event.preventDefault();


                    dropZone.classList.add(
                        "over"
                    );

                }
            );


            /* =============================================
               DRAG LEAVE
            ============================================== */

            dropZone.addEventListener(
                "dragleave",
                () => {

                    dropZone.classList.remove(
                        "over"
                    );

                }
            );


            /* =============================================
               DROP
            ============================================== */

            dropZone.addEventListener(
                "drop",
                event => {

                    event.preventDefault();


                    dropZone.classList.remove(
                        "over"
                    );


                    if(
                        questionLocked
                    ){

                        return;

                    }


                    const draggedName =
                        event.dataTransfer.getData(
                            "name"
                        );


                    const draggedWord =
                        event.dataTransfer.getData(
                            "word"
                        );


                    const draggedId =
                        event.dataTransfer.getData(
                            "id"
                        );


                    const draggedElement =
                        document.getElementById(
                            draggedId
                        );


                    /*
                       Do not allow a word
                       already used.
                    */

                    if(
                        draggedElement &&
                        draggedElement.classList.contains(
                            "used"
                        )
                    ){

                        return;

                    }


                    /*
                       Do not overwrite
                       an existing answer.
                    */

                    if(
                        dropZone.dataset.selected !== ""
                    ){

                        return;

                    }


                    dropZone.dataset.selected =
                        draggedName;


                    dropZone.textContent =
                        draggedWord;


                    dropZone.classList.add(
                        "filled"
                    );


                    if(
                        draggedElement
                    ){

                        draggedElement.classList.add(
                            "used"
                        );

                    }

                }
            );


            imageBox.appendChild(
                img
            );


            imageBox.appendChild(
                dropZone
            );


            imagesContainer.appendChild(
                imageBox
            );

        }
    );


    /* =====================================================
       CREATE WORDS
    ====================================================== */

    shuffle(currentSelected)
        .forEach(
            item => {

                const word =
                    document.createElement(
                        "div"
                    );


                word.className =
                    "word";


                word.textContent =
                    item.vi;


                word.draggable =
                    true;


                word.id =
                    `word-${currentQuestion}-${item.name}`;


                /* =========================================
                   DRAG START
                ========================================== */

                word.addEventListener(
                    "dragstart",
                    event => {

                        if(
                            questionLocked ||
                            word.classList.contains(
                                "used"
                            )
                        ){

                            event.preventDefault();

                            return;

                        }


                        event.dataTransfer.setData(
                            "name",
                            item.name
                        );


                        event.dataTransfer.setData(
                            "word",
                            item.vi
                        );


                        event.dataTransfer.setData(
                            "id",
                            word.id
                        );


                        word.classList.add(
                            "dragging"
                        );

                    }
                );


                /* =========================================
                   DRAG END
                ========================================== */

                word.addEventListener(
                    "dragend",
                    () => {

                        word.classList.remove(
                            "dragging"
                        );

                    }
                );


                wordsContainer.appendChild(
                    word
                );

            }
        );

}


/* =========================================================
   CHECK ANSWERS
========================================================= */

function checkAnswers(){

    if(
        questionLocked
    ){

        return;

    }


    const zones =
        document.querySelectorAll(
            ".drop-zone"
        );


    /*
       Make sure every picture
       has a selected word.
    */

    const unanswered =
        [
            ...zones
        ].some(
            zone =>
                zone.dataset.selected === ""
        );


    if(
        unanswered
    ){

        resultText.className =
            "result-message wrong-text";


        resultText.textContent =
            "Please match all pictures first.";

        return;

    }


    questionLocked =
        true;


    checkBtn.disabled =
        true;


    let correctCount =
        0;


    zones.forEach(
        zone => {

            const correctAnswer =
                zone.dataset.answer;


            const selectedAnswer =
                zone.dataset.selected;


            /* =============================================
               CORRECT
            ============================================== */

            if(
                selectedAnswer ===
                correctAnswer
            ){

                zone.classList.remove(
                    "filled"
                );


                zone.classList.add(
                    "correct"
                );


                correctCount++;

            }


            /* =============================================
               WRONG
            ============================================== */

            else{

                zone.classList.remove(
                    "filled"
                );


                zone.classList.add(
                    "wrong"
                );


                const correctItem =
                    currentSelected.find(
                        item =>
                            item.name ===
                            correctAnswer
                    );


                if(
                    correctItem
                ){

                    zone.textContent =
                        `✗ ${correctItem.vi}`;

                }

            }

        }
    );


    /*
       One point for each
       correctly matched picture.
    */

    score +=
        correctCount;


    scoreElement.textContent =
        score;


    /* =====================================================
       RESULT MESSAGE
    ====================================================== */

    if(
        correctCount ===
        zones.length
    ){

        resultText.textContent =
            "✓ Perfect!";


        resultText.className =
            "result-message correct-text";

    }

    else{

        resultText.textContent =
            `${correctCount} / ${zones.length} correct.`;


        resultText.className =
            "result-message wrong-text";

    }


    /* =====================================================
       EXPLANATION
    ====================================================== */

    const explanations =
        currentSelected
            .map(
                item =>
                    `<strong>${item.vi}</strong> = ${item.meaning}`
            )
            .join(
                "<br>"
            );


    explanationText.innerHTML =
        explanations;


    explanationBox.classList.add(
        "show"
    );


    /* =====================================================
       SHOW NEXT
    ====================================================== */

    nextBtn.style.display =
        "block";

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion(){

    if(
        !questionLocked
    ){

        return;

    }


    currentQuestion++;


    if(
        currentQuestion >=
        TOTAL_QUESTIONS
    ){

        finishGame();

        return;

    }


    loadQuestion();

}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

    progress.style.width =
        "100%";


    game.style.display =
        "none";


    final.style.display =
        "block";


    finalScore.textContent =
        `${score} / 20`;


    const percentage =
        Math.round(
            score /
            20 *
            100
        );


    let result;


    if(
        percentage ===
        100
    ){

        result =
            "🏆 Perfect! You know your Vietnamese food and drink words.";

    }

    else if(
        percentage >=
        80
    ){

        result =
            "🎉 Excellent! Keep practicing your Vietnamese.";

    }

    else if(
        percentage >=
        60
    ){

        result =
            "👍 Good job! You're getting better.";

    }

    else{

        result =
            "📚 Keep practicing your Vietnamese food and drink vocabulary.";

    }


    finalMessage.textContent =
        `${percentage}% — ${result}`;


    if (
        typeof trackGameComplete ===
        "function"
    ) {
        trackGameComplete(
            "Food - Game 1",
            score,
            20
        );
    }

}

/* =========================================================
   RESTART GAME
========================================================= */

function restartGame(){

    startGame();

}


/* =========================================================
   INITIALIZE
========================================================= */
window.trackGameStart(
    "Food - Game 1"
);

startGame();

</script>
