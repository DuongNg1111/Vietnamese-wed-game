.card-grid{

}


/* =========================================================
   CARD
========================================================= */

.card{

    position:relative;

    height:140px;

    perspective:1000px;

    cursor:pointer;
}

.card::before{

    content:"";

    position:absolute;

    top:0;

    left:0;

    width:100%;

    height:5px;

    background:#2878df;

    border-radius:16px 16px 0 0;

    z-index:10;

    pointer-events:none;
}

.card-inner{

    position:relative;

    width:100%;

    height:100%;

    transition:
        transform .45s ease;

    transform-style:preserve-3d;
}

.card.flipped .card-inner,
.card.matched .card-inner,
.card.wrong .card-inner{

    transform:rotateY(180deg);
}


/* =========================================================
   CARD FRONT / BACK
========================================================= */

.card-front,
.card-back{

    position:absolute;

    width:100%;

    height:100%;

    backface-visibility:hidden;

    -webkit-backface-visibility:hidden;

    border-radius:16px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:15px;

    font-family:Calibri, Arial, sans-serif;

    overflow:hidden;
}

   CARD FRONT
========================================================= */

    color:white;

    border:2px solid #1e5fba;

}


/* =========================================================
   CARD BACK
========================================================= */

.card-back{

    background:white;

    color:#222;

    border:2px solid #2878df;

    transform:rotateY(180deg);

    word-break:break-word;
}

   CORRECT CARD
========================================================= */

}

<script>

/* =========================================================

const vocabulary = [

    },

    {

    },

    {

    },

    {
        english:"avocado",

    },

    {
        english:"orange",
        vietnamese:"cam"
    },

    {
        english:"lemon / lime",
        vietnamese:"chanh"
    },

    {
        english:"apple",
        vietnamese:"táo"
    },

    {
        english:"mango",
        vietnamese:"xoài"
    },

    {
        english:"tomato",
        vietnamese:"cà chua"
    },

    {
        english:"potato",
        vietnamese:"khoai tây"
    },

    {
        english:"carrot",
        vietnamese:"cà rốt"
    },

    {
        english:"cucumber",
        vietnamese:"dưa leo"
    },

    {
        english:"corn",
        vietnamese:"bắp"
    },

    {
        english:"lettuce",
        vietnamese:"xà lách"
    },

    {
        english:"delicious / tasty",
        vietnamese:"ngon"
    },

    {
        english:"salty",
        vietnamese:"mặn"
    },

    {
        english:"spicy",
        vietnamese:"cay"
    },

    {
        english:"sweet",
        vietnamese:"ngọt"
    },

    {
        english:"sour",
        vietnamese:"chua"
    },

    {
        english:"bitter",
        vietnamese:"đắng"
    },

    {
        english:"hot",
        vietnamese:"nóng"
    },

    {
        english:"cold",
        vietnamese:"lạnh"
    }

];


/* =========================================================
   GAME SETTINGS
========================================================= */

const TOTAL_ROUNDS = 12;

const PAIRS_PER_ROUND = 3;

const TOTAL_PAIRS =
    TOTAL_ROUNDS * PAIRS_PER_ROUND;


/* =========================================================
   GAME STATE
========================================================= */

let currentRound = 0;

let score = 0;

let roundMatches = 0;

let flippedCards = [];

let lockBoard = false;

let usedVocabulary = [];


/* =========================================================
   DOM
========================================================= */

const gameScreen =
    document.getElementById(
        "gameScreen"
    );

const finalScreen =
    document.getElementById(
        "finalScreen"
    );

const cardGrid =
    document.getElementById(
        "cardGrid"
    );

const roundNumberEl =
    document.getElementById(
        "roundNumber"
    );

const scoreEl =
    document.getElementById(
        "score"
    );

const matchInfoEl =
    document.getElementById(
        "matchInfo"
    );

const messageEl =
    document.getElementById(
        "message"
    );

const nextBtn =
    document.getElementById(
        "nextBtn"
    );

const progressBar =
    document.getElementById(
        "progressBar"
    );

const explanationEl =
    document.getElementById(
        "explanation"
    );


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    const shuffled = [...array];

    for(
        let i = shuffled.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            shuffled[i],
            shuffled[j]
        ] =
        [
            shuffled[j],
            shuffled[i]
        ];

    }

    return shuffled;

}


/* =========================================================
   GET ROUND PAIRS
========================================================= */

function getRoundPairs(){

    let available =
        vocabulary.filter(
            item =>
                !usedVocabulary.includes(
                    item.vietnamese
                )
        );


    if(
        available.length <
        PAIRS_PER_ROUND
    ){

        usedVocabulary = [];

        available = [
            ...vocabulary
        ];

    }


    const selected =
        shuffle(
            available
        ).slice(
            0,
            PAIRS_PER_ROUND
        );


    selected.forEach(
        item => {

            usedVocabulary.push(
                item.vietnamese
            );

        }
    );


    return selected;

}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    currentRound = 0;

    score = 0;

    roundMatches = 0;

    flippedCards = [];

    lockBoard = false;

    usedVocabulary = [];


    gameScreen.style.display =
        "block";

    finalScreen.style.display =
        "none";


    scoreEl.textContent =
        `Score: 0 / ${TOTAL_PAIRS}`;


    progressBar.style.width =
        "0%";


    loadRound();

}


/* =========================================================
   LOAD ROUND
========================================================= */

function loadRound(){

    currentRound++;

    roundMatches = 0;

    flippedCards = [];

    lockBoard = false;


    roundNumberEl.textContent =
        `Round ${currentRound} of ${TOTAL_ROUNDS}`;


    scoreEl.textContent =
        `Score: ${score} / ${TOTAL_PAIRS}`;


    matchInfoEl.textContent =
        `Matches: 0 / ${PAIRS_PER_ROUND}`;


    messageEl.textContent =
        "";

    messageEl.style.color =
        "#222";


    explanationEl.style.display =
        "none";

    explanationEl.innerHTML =
        "";


    nextBtn.style.display =
        "none";


    const pairs =
        getRoundPairs();


    const cards = [];


    pairs.forEach(
        (pair,index) => {

            cards.push({

                type:"english",

                text:pair.english,

                vietnamese:pair.vietnamese,

                id:index

            });


            cards.push({

                type:"vietnamese",

                text:pair.vietnamese,

                english:pair.english,

                id:index

            });

        }
    );


    const shuffledCards =
        shuffle(cards);


    cardGrid.innerHTML =
        "";


    shuffledCards.forEach(
        cardData => {

            createCard(
                cardData
            );

        }
    );


    progressBar.style.width =
        `${(
            currentRound /
            TOTAL_ROUNDS
        ) * 100}%`;

}


/* =========================================================
   CREATE CARD
========================================================= */

function createCard(cardData){

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "card";


    card.dataset.type =
        cardData.type;


    card.dataset.id =
        cardData.id;


    card.innerHTML = `

        <div class="card-inner">

            <div class="card-front">
                🃏
            </div>

            <div class="card-back">
                ${cardData.text}
            </div>

        </div>

    `;


    card.addEventListener(
        "click",
        () => {

            flipCard(card);

        }
    );


    cardGrid.appendChild(
        card
    );

}


/* =========================================================
   FLIP CARD
========================================================= */

function flipCard(card){

    if(lockBoard){

        return;

    }


    if(
        card.classList.contains(
            "flipped"
        ) ||
        card.classList.contains(
            "matched"
        ) ||
        card.classList.contains(
            "wrong"
        )
    ){

        return;

    }


    if(
        flippedCards.length >= 2
    ){

        return;

    }


    card.classList.add(
        "flipped"
    );


    flippedCards.push(
        card
    );


    if(
        flippedCards.length === 2
    ){

        checkMatch();

    }

}


/* =========================================================
   CHECK MATCH
========================================================= */

function checkMatch(){

    lockBoard = true;


    const firstCard =
        flippedCards[0];

    const secondCard =
        flippedCards[1];


    const samePair =
        firstCard.dataset.id ===
        secondCard.dataset.id;


    if(samePair){

        handleCorrectMatch();

    }

    else{

        handleWrongMatch();

    }

}


/* =========================================================
   CORRECT MATCH
========================================================= */

function handleCorrectMatch(){

    flippedCards.forEach(
        card => {

            card.classList.add(
                "matched"
            );

        }
    );


    score++;

    roundMatches++;


    scoreEl.textContent =
        `Score: ${score} / ${TOTAL_PAIRS}`;


    matchInfoEl.textContent =
        `Matches: ${roundMatches} / ${PAIRS_PER_ROUND}`;


    messageEl.style.color =
        "#2e7d32";


    messageEl.textContent =
        "✅ Correct match!";


    flippedCards = [];


    lockBoard = false;


    if(
        roundMatches ===
        PAIRS_PER_ROUND
    ){

        finishRound();

    }

}


/* =========================================================
   WRONG MATCH
========================================================= */

function handleWrongMatch(){

    flippedCards.forEach(
        card => {

            card.classList.add(
                "wrong"
            );

        }
    );


    messageEl.style.color =
        "#d9536f";


    messageEl.textContent =
        "❌ Not a match!";


    /*
       Keep the cards red briefly,
       then flip them back.
    */

    setTimeout(
        () => {

            flippedCards.forEach(
                card => {

                    card.classList.remove(
                        "wrong"
                    );

                    card.classList.remove(
                        "flipped"
                    );

                }
            );


            flippedCards = [];

            lockBoard = false;

            messageEl.textContent =
                "";

        },
        800
    );

}


/* =========================================================
   FINISH ROUND
========================================================= */

function finishRound(){

    lockBoard = true;


    if(
        currentRound ===
        TOTAL_ROUNDS
    ){

        messageEl.style.color =
            "#2e7d32";


        messageEl.textContent =
            "🎉 All rounds completed!";


        setTimeout(
            () => {

                finishGame();

            },
            700
        );


        return;

    }


    messageEl.style.color =
        "#2e7d32";


    messageEl.textContent =
        "🎉 Round complete!";


    nextBtn.style.display =
        "inline-block";

}


/* =========================================================
   NEXT ROUND
========================================================= */

function nextRound(){

    if(!lockBoard){

        return;

    }


    loadRound();

}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

    gameScreen.style.display =
        "none";


    finalScreen.style.display =
        "block";


    const percentage =
        Math.round(
            (
                score /
                TOTAL_PAIRS
            ) * 100
        );


    document.getElementById(
        "finalScore"
    ).textContent =
        `Final Score: ${score} / ${TOTAL_PAIRS}`;


    document.getElementById(
        "finalPercent"
    ).textContent =
        `${percentage}%`;


    let message;


    if(
        percentage >= 90
    ){

        message =
            "🏆 Excellent! You really know your Vietnamese vocabulary!";

    }

    else if(
        percentage >= 70
    ){

        message =
            "🎉 Great job! Keep practicing!";

    }

    else if(
        percentage >= 50
    ){

        message =
            "👍 Good work! You're getting better!";

    }

    else{

        message =
            "📚 Keep practicing. You will improve!";

    }


    document.getElementById(
        "finalMessage"
    ).textContent =
        message;

}


/* =========================================================
   RESTART GAME
========================================================= */

function restartGame(){

    currentRound = 0;

    score = 0;

    roundMatches = 0;

    flippedCards = [];

    lockBoard = false;

    usedVocabulary = [];


    finalScreen.style.display =
        "none";

    gameScreen.style.display =
        "block";


    scoreEl.textContent =
        `Score: 0 / ${TOTAL_PAIRS}`;


    progressBar.style.width =
        "0%";


    loadRound();

}


/* =========================================================
   AUTO START
   No intro screen
========================================================= */

startGame();

</script>
