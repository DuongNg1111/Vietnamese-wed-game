<script>

/* =========================================================
   VOCABULARY
========================================================= */

const COLORS = [

    {
        text:
            "đỏ",

        phonetics:
            "daw",

        english:
            "red",

        color:
            "#ef4444"
    },

    {
        text:
            "cam",

        phonetics:
            "kam",

    {

        phonetics:

    },

    {

            "tím",

        phonetics:
            "tim",

        english:
            "purple",

        color:
            "#a855f7"
    },

    {
        text:
            "hồng",

        phonetics:
            "hong",

        english:
            "pink",

        color:
            "#ec4899"
    },

    {
        text:
            "nâu",

        phonetics:
            "nəw",

        english:
            "brown",

        color:
            "#92400e"
    },

    {
        text:
            "đen",

        phonetics:
            "den",

        english:
            "black",

        color:
            "#111827"
    },

    {
        text:
            "trắng",

        phonetics:
            "chang",

        english:
            "white",

        color:
            "#ffffff"
    },

    {
        text:
            "xám",

        phonetics:
            "sam",

        english:
            "gray",

        color:
            "#6b7280"
    }

];


/* =========================================================
   CONSTANTS
========================================================= */

const TOTAL_ROUNDS =
    20;

const COLORS_PER_ROUND =
    4;


/* =========================================================
   GAME STATE
========================================================= */

let round =
    1;

let score =
    0;

let currentColors =
    [];

let locked =
    false;


/* =========================================================
   DOM
========================================================= */

const gameScreen =
    document.getElementById(
        "gameScreen"
    );

const resultScreen =
    document.getElementById(
        "resultScreen"
    );

const game =
    document.getElementById(
        "game"
    );

const roundText =
    document.getElementById(
        "round"
    );

const scoreText =
    document.getElementById(
        "score"
    );

const message =
    document.getElementById(
        "message"
    );

const explanation =
    document.getElementById(
        "explanation"
    );

const explanationText =
    document.getElementById(
        "explanationText"
    );

const clearBtn =
    document.getElementById(
        "clearBtn"
    );

const checkBtn =
    document.getElementById(
        "checkBtn"
    );

const nextBtn =
    document.getElementById(
        "nextBtn"
    );

const playAgain =
    document.getElementById(
        "playAgain"
    );


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array) {

    const arr =
        [...array];


    for (
        let i =
            arr.length - 1;

        i > 0;

        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] =
        [
            arr[j],
            arr[i]
        ];

    }


    return arr;

}


/* =========================================================
   CREATE ROUND
========================================================= */

function createRound() {

    locked =
        false;


    message.textContent =
        "";

    message.className =
        "";


    explanation.classList.add(
        "hidden"
    );


    explanationText.innerHTML =
        "";


    clearBtn.classList.remove(
        "hidden"
    );


    checkBtn.classList.remove(
        "hidden"
    );


    nextBtn.classList.add(
        "hidden"
    );


    roundText.textContent =
        round;


    /* =====================================================
       SELECT 4 COLORS
    ====================================================== */

    currentColors =
        shuffle(
            COLORS
        ).slice(
            0,
            COLORS_PER_ROUND
        );


    /* =====================================================
       SHUFFLE WORDS
    ====================================================== */

    const words =
        shuffle(
            currentColors.map(
                color =>
                    color.text
            )
        );


    game.innerHTML =
        "";


    /* =====================================================
       CREATE ROWS
    ====================================================== */

    currentColors.forEach(
        (
            item,
            index
        ) => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "row";


            /* =============================================
               COLOR BOX
            ============================================== */

            const colorBox =
                document.createElement(
                    "div"
                );


            colorBox.className =
                "colorBox";


            colorBox.style.background =
                item.color;


            /* Special border for white */

            if (
                item.color ===
                "#ffffff"
            ) {

                colorBox.style.border =
                    "3px solid #b8b3c8";

            }


            /* =============================================
               SELECT
            ============================================== */

            const select =
                document.createElement(
                    "select"
                );


            select.id =
                `answer${index}`;


            const defaultOption =
                document.createElement(
                    "option"
                );


            defaultOption.value =
                "";


            defaultOption.textContent =
                "Select a word";


            select.appendChild(
                defaultOption
            );


            words.forEach(
                word => {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        word;


                    option.textContent =
                        word;


                    select.appendChild(
                        option
                    );

                }
            );


            row.appendChild(
                colorBox
            );


            row.appendChild(
                select
            );


            game.appendChild(
                row
            );

        }
    );

}


/* =========================================================
   CLEAR ANSWERS
========================================================= */

clearBtn.onclick =
    function() {

        if (
            locked
        ) {

            return;

        }


        document
            .querySelectorAll(
                "#game select"
            )
            .forEach(
                select => {

                    select.value =
                        "";

                    select.classList.remove(
                        "correct-answer",
                        "wrong-answer"
                    );

                }
            );


        message.textContent =
            "";

        message.className =
            "";

    };


/* =========================================================
   CHECK ANSWERS
========================================================= */

checkBtn.onclick =
    function() {

        if (
            locked
        ) {

            return;

        }


        const selects =
            document.querySelectorAll(
                "#game select"
            );


        /* =================================================
           REQUIRE ALL ANSWERS
        ================================================== */

        const incomplete =
            [
                ...selects
            ].some(
                select =>
                    select.value === ""
            );


        if (
            incomplete
        ) {

            message.textContent =
                "Please answer all 4 colors first.";

            message.className =
                "wrong-message";

            return;

        }


        /* =================================================
           LOCK ROUND
        ================================================== */

        locked =
            true;


        let correct =
            0;


        /* =================================================
           CHECK EACH ANSWER
        ================================================== */

        currentColors.forEach(
            (
                item,
                index
            ) => {

                const select =
                    document.getElementById(
                        `answer${index}`
                    );


                const answer =
                    select.value;


                if (
                    answer ===
                    item.text
                ) {

                    correct++;


                    select.classList.add(
                        "correct-answer"
                    );

                }

                else {

                    select.classList.add(
                        "wrong-answer"
                    );

                }

            }
        );


        /* =================================================
           SCORING
           ONLY PERFECT ROUND = +1
        ================================================== */

        if (
            correct ===
            COLORS_PER_ROUND
        ) {

            score++;


            scoreText.textContent =
                score;


            message.textContent =
                "✓ Perfect! +1 point";


            message.className =
                "correct-message";

        }

        else {

            message.textContent =
                `✕ ${correct}/4 correct — 0 points`;


            message.className =
                "wrong-message";

        }


        /* =================================================
           DISABLE SELECTS
        ================================================== */

        selects.forEach(
            select => {

                select.disabled =
                    true;

            }
        );


        clearBtn.classList.add(
            "hidden"
        );


        checkBtn.classList.add(
            "hidden"
        );


        nextBtn.classList.remove(
            "hidden"
        );


        /* =================================================
           EXPLANATION
        ================================================== */

        showExplanation();

    };


/* =========================================================
   EXPLANATION
========================================================= */

function showExplanation() {

    let html =
        "";


    currentColors.forEach(
        item => {

            html += `
                <strong>
                    ${item.text}
                </strong>
                /${item.phonetics}/
                — ${item.english}
                <br>
            `;

        }
    );


    explanationText.innerHTML =
        html;


    explanation.classList.remove(
        "hidden"
    );

}


/* =========================================================
   NEXT ROUND
========================================================= */

nextBtn.onclick =
    function() {

        if (
            !locked
        ) {

            return;

        }


        round++;


        if (
            round >
            TOTAL_ROUNDS
        ) {

            finishGame();

            return;

        }


        createRound();

    };


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame() {

    gameScreen.classList.add(
        "hidden"
    );


    resultScreen.classList.remove(
        "hidden"
    );


    document.getElementById(
        "scoreText"
    ).textContent =
        `${score} / ${TOTAL_ROUNDS}`;


    let performanceText =
        "";


    if (
        score ===
        TOTAL_ROUNDS
    ) {

        performanceText =
            "Perfect!";

    }

    else if (
        score >=
        17
    ) {

        performanceText =
            "Excellent!";

    }

    else if (
        score >=
        14
    ) {

        performanceText =
            "Great Job!";

    }

    else if (
        score >=
        10
    ) {

        performanceText =
            "Good Job!";

    }

    else {

        performanceText =
            "Keep Practicing!";

    }


    document.getElementById(
        "performance"
    ).textContent =
        performanceText;

}


/* =========================================================
   PLAY AGAIN
========================================================= */

playAgain.onclick =
    function() {

        round =
            1;


        score =
            0;


        scoreText.textContent =
            "0";


        resultScreen.classList.add(
            "hidden"
        );


        gameScreen.classList.remove(
            "hidden"
        );


        createRound();

    };


/* =========================================================
   START GAME
========================================================= */

createRound();

</script>
