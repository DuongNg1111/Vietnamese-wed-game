<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta

>

<title>Color Matching</title>

     GOOGLE FONTS
========================================================= -->

>

<link

>

>

========================================================= -->

>

<meta
    name="game-description"
    content="Match colors with their Vietnamese words."
>

<meta

>

<meta
    name="game-explanation"
    content="Choose the correct Vietnamese word for each color."
>


<style>

/* =========================================================
   RESET
========================================================= */

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}


/* =========================================================
   DESIGN TOKENS
========================================================= */

:root{

    --accent:
        #2878df;

    --accent-dark:
        #1e5fba;

    --accent-light:
        #eaf3ff;

    --accent-border:
        #c4daf6;

    --general-border:
        #d9e6f2;

    --correct:
        #2878df;

    --correct-bg:
        #eaf3ff;

    --wrong:
        #d9536f;

    --wrong-bg:
        #fff0f3;

    --text:
        #243b53;

    --text-soft:
        #66809d;

    --white:
        #ffffff;

}


/* =========================================================
   BODY
========================================================= */

body{

    min-height:100vh;

    padding:24px 18px;

    font-family:
        Calibri,
        Arial,
        Helvetica,
        sans-serif;

    color:
        var(--text);

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #f7fbff 50%,
            #eef6fd 100%
        );

}


/* =========================================================
   BACK BUTTON
========================================================= */

.back-btn-container{

    width:
        900px;

    max-width:
        100%;

    margin:
        0 auto 14px;

}


.back-btn{

    display:
        inline-block;

    padding:
        9px 18px;

    border:
        1px solid
        var(--accent-border);

    border-radius:
        12px;

    background:
        var(--accent-light);

    color:
        var(--accent-dark);

    font-size:
        24px;

    font-weight:
        700;

    text-decoration:
        none;

    transition:
        .2s ease;

}


.back-btn:hover{

    background:
        var(--accent);

    border-color:
        var(--accent);

    color:
        white;

    transform:
        translateY(-2px);

}


/* =========================================================
   MAIN CARD
========================================================= */

.game-box{

    position:
        relative;

    width:
        900px;

    max-width:
        100%;

    margin:
        0 auto;

    padding:
        34px 42px;

    overflow:
        hidden;

    border:
        1px solid
        var(--general-border);

    border-radius:
        24px;

    background:
        rgba(
            255,
            255,
            255,
            .98
        );

    box-shadow:
        0 18px 45px
        rgba(
            40,
            120,
            223,
            .10
        );

}


/* =========================================================
   ACCENT LINE
========================================================= */

.game-box::before{

    content:
        "";

    position:
        absolute;

    top:
        0;

    left:
        0;

    width:
        100%;

    height:
        5px;

    background:
        var(--accent);

}


/* =========================================================
   HEADER
========================================================= */

.game-header{

    text-align:
        center;

    margin-bottom:
        18px;

}


.game-header h1{

    margin-bottom:
        4px;

    color:
        var(--accent-dark);

    font-family:
        Kalam,
        cursive;

    font-size:
        42px;

    font-weight:
        700;

}


.subtitle{

    color:
        var(--text-soft);

    font-size:
        22px;

    line-height:
        1.45;

}


/* =========================================================
   INFO
========================================================= */

#info{

    margin-bottom:
        22px;

    padding:
        10px 18px;

    border:
        1px solid
        var(--accent-border);

    border-radius:
        12px;

    background:
        var(--accent-light);

    color:
        var(--accent-dark);

    text-align:
        center;

    font-size:
        22px;

    font-weight:
        700;

}


#round,
#score{

    font-weight:
        800;

}


/* =========================================================
   GAME AREA
========================================================= */

#game{

    width:
        100%;

    max-width:
        650px;

    margin:
        0 auto;

}


/* =========================================================
   ROW
========================================================= */

.row{

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    gap:
        26px;

    margin:
        13px 0;

}


/* =========================================================
   COLOR BOX
========================================================= */

.colorBox{

    width:
        82px;

    height:
        60px;

    flex-shrink:
        0;

    border:
        2px solid
        var(--general-border);

    border-radius:
        12px;

    box-shadow:
        0 3px 8px
        rgba(
            36,
            59,
            83,
            .06
        );

}


/* =========================================================
   SELECT
========================================================= */

select{

    width:
        330px;

    height:
        52px;

    padding:
        8px 14px;

    border:
        2px solid
        var(--general-border);

    border-radius:
        12px;

    outline:
        none;

    background:
        white;

    color:
        var(--text);

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-size:
        23px;

    cursor:
        pointer;

    transition:
        .2s ease;

}


select:hover{

    border-color:
        var(--accent-border);

}


select:focus{

    border-color:
        var(--accent);

    box-shadow:
        0 0 0 3px
        var(--accent-light);

}


select:disabled{

    background:
        #f5f8fb;

    color:
        #6b7f93;

    cursor:
        default;

}


/* =========================================================
   RESULT STATES
========================================================= */

select.correct-answer{

    border-color:
        var(--correct);

    background:
        var(--correct-bg);

    color:
        var(--accent-dark);

}


select.wrong-answer{

    border-color:
        var(--wrong);

    background:
        var(--wrong-bg);

    color:
        var(--wrong);

}


/* =========================================================
   BUTTONS
========================================================= */

.controls{

    display:
        flex;

    justify-content:
        center;

    gap:
        12px;

    margin-top:
        22px;

}


.action-btn{

    padding:
        11px 24px;

    border:
        none;

    border-radius:
        12px;

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-size:
        22px;

    font-weight:
        700;

    cursor:
        pointer;

    transition:
        .2s ease;

}


/* =========================================================
   CLEAR
========================================================= */

.clear-btn{

    border:
        1px solid
        var(--general-border);

    background:
        white;

    color:
        var(--text-soft);

}


.clear-btn:hover{

    background:
        #f5f9fd;

    border-color:
        var(--accent-border);

}


/* =========================================================
   PRIMARY BUTTON
========================================================= */

.check-btn,
.next-btn{

    background:
        var(--accent);

    color:
        white;

    box-shadow:
        inset 0 -3px 0
        rgba(
            0,
            0,
            0,
            .10
        );

}


.check-btn:hover,
.next-btn:hover{

    background:
        var(--accent-dark);

    transform:
        translateY(-2px);

}


/* =========================================================
   MESSAGE
========================================================= */

#message{

    min-height:
        34px;

    margin-top:
        16px;

    text-align:
        center;

    font-size:
        25px;

    font-weight:
        700;

}


.correct-message{

    color:
        var(--correct);

}


.wrong-message{

    color:
        var(--wrong);

}


/* =========================================================
   EXPLANATION
========================================================= */

#explanation{

    margin-top:
        16px;

    padding:
        13px 17px;

    border:
        1px solid
        var(--accent-border);

    border-left:
        4px solid
        var(--accent);

    border-radius:
        10px;

    background:
        var(--accent-light);

    color:
        var(--text);

    text-align:
        left;

    font-size:
        20px;

    line-height:
        1.55;

}


.explanation-title{

    margin-bottom:
        4px;

    color:
        var(--accent-dark);

    font-weight:
        700;

}


/* =========================================================
   RESULT SCREEN
========================================================= */

#resultScreen{

    text-align:
        center;

}


.result-title{

    margin-bottom:
        8px;

    color:
        var(--accent-dark);

    font-family:
        Kalam,
        cursive;

    font-size:
        42px;

    font-weight:
        700;

}


.result-label{

    color:
        var(--text-soft);

    font-size:
        23px;

}


.score{

    margin:
        8px 0;

    color:
        var(--accent);

    font-size:
        58px;

    font-weight:
        800;

}


.performance{

    margin-bottom:
        24px;

    color:
        var(--text-soft);

    font-size:
        27px;

    font-weight:
        700;

}


/* =========================================================
   HIDDEN
========================================================= */

.hidden{

    display:
        none !important;

}


/* =========================================================
   MOBILE
========================================================= */

@media(
    max-width:600px
){

    body{

        padding:
            14px 10px;

    }


    .game-box{

        padding:
            28px 16px;

        border-radius:
            20px;

    }


    .game-header h1{

        font-size:
            36px;

    }


    .subtitle{

        font-size:
            19px;

    }


    #info{

        font-size:
            19px;

    }


    #game{

        width:
            100%;

    }


    .row{

        gap:
            10px;

    }


    .colorBox{

        width:
            62px;

        height:
            50px;

    }


    select{

        width:
            calc(
                100% - 72px
            );

        height:
            48px;

        font-size:
            20px;

    }


    .controls{

        flex-wrap:
            wrap;

    }


    .action-btn{

        font-size:
            20px;

    }


    #explanation{

        font-size:
            18px;

    }

}

</style>

</head>


<body>


<!-- =========================================================
     BACK
========================================================= -->

<div class="back-btn-container">

    <a
        href="../../category.html?category=Colors"
        class="back-btn"
    >

        ← Back

    </a>

</div>


<!-- =========================================================
     MAIN CARD
========================================================= -->

<div class="game-box">


<!-- =========================================================
     GAME SCREEN
========================================================= -->

<div id="gameScreen">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="game-header">

        <h1>
            Color Matching
        </h1>

        <div class="subtitle">

            Choose the Vietnamese word for each color.

        </div>

    </div>


    <!-- =====================================================
         INFO
    ====================================================== -->

    <div id="info">

        Round:
        <span id="round">
            1
        </span>

        /20

        &nbsp; | &nbsp;

        Score:
        <span id="score">
            0
        </span>

    </div>


    <!-- =====================================================
         GAME
    ====================================================== -->

    <div id="game"></div>


    <!-- =====================================================
         CONTROLS
    ====================================================== -->

    <div class="controls">

        <button
            class="action-btn clear-btn"
            id="clearBtn"
        >

            Clear

        </button>


        <button
            class="action-btn check-btn"
            id="checkBtn"
        >

            Check Answers

        </button>


        <button
            class="action-btn next-btn hidden"
            id="nextBtn"
        >

            Next Question →

        </button>

    </div>


    <!-- =====================================================
         MESSAGE
    ====================================================== -->

    <div id="message"></div>


    <!-- =====================================================
         EXPLANATION
    ====================================================== -->

    <div
        id="explanation"
        class="hidden"
    >

        <div class="explanation-title">

            Explanation

        </div>


        <div id="explanationText"></div>

    </div>

</div>


<!-- =========================================================
     RESULT SCREEN
========================================================= -->

<div
    id="resultScreen"
    class="hidden"
>


    <div class="result-title">

        Game Finished!

    </div>


    <div class="result-label">

        Final Score

    </div>


    <div
        class="score"
        id="scoreText"
    >

        0 / 20

    </div>


    <div
        class="performance"
        id="performance"
    ></div>


    <button
        class="action-btn next-btn"
        id="playAgain"
    >

        Play Again

    </button>

</div>


</div>


<script>

/* =========================================================
   VOCABULARY
========================================================= */

const COLORS = [

    {
        text:
            "đỏ",

        phonetics:
            "daw",

        english:
            "red",

        color:
            "#ef4444"
    },

    {
        text:
            "cam",

        phonetics:
            "kam",

        english:
            "orange",

        color:
            "#f97316"
    },

    {
        text:
            "vàng",

        phonetics:
            "vang",

        english:
            "yellow",

        color:
            "#facc15"
    },

    {
        text:
            "xanh lá",

        phonetics:
            "sanh la",

        english:
            "green",

        color:
            "#22c55e"
    },

    {
        text:
            "xanh dương",

        phonetics:
            "sanh zoong",

        english:
            "blue",

        color:
            "#3b82f6"
    },

    {
        text:
            "tím",

        phonetics:
            "tim",

        english:
            "purple",

        color:
            "#a855f7"
    },

    {
        text:
            "hồng",

        phonetics:
            "hong",

        english:
            "pink",

        color:
            "#ec4899"
    },

    {
        text:
            "nâu",

        phonetics:
            "nəw",

        english:
            "brown",

        color:
            "#92400e"
    },

    {
        text:
            "đen",

        phonetics:
            "den",

        english:
            "black",

        color:
            "#111827"
    },

    {
        text:
            "trắng",

        phonetics:
            "chang",

        english:
            "white",

        color:
            "#ffffff"
    },

    {
        text:
            "xám",

        phonetics:
            "sam",

        english:
            "gray",

        color:
            "#6b7280"
    }

];


/* =========================================================
   CONSTANTS
========================================================= */

const TOTAL_ROUNDS =
    20;

const COLORS_PER_ROUND =
    4;


/* =========================================================
   GAME STATE
========================================================= */

let round =
    1;

let score =
    0;

let currentColors =
    [];

let locked =
    false;


/* =========================================================
   DOM
========================================================= */

const gameScreen =
    document.getElementById(
        "gameScreen"
    );

const resultScreen =
    document.getElementById(
        "resultScreen"
    );

const game =
    document.getElementById(
        "game"
    );

const roundText =
    document.getElementById(
        "round"
    );

const scoreText =
    document.getElementById(
        "score"
    );

const message =
    document.getElementById(
        "message"
    );

const explanation =
    document.getElementById(
        "explanation"
    );

const explanationText =
    document.getElementById(
        "explanationText"
    );

const clearBtn =
    document.getElementById(
        "clearBtn"
    );

const checkBtn =
    document.getElementById(
        "checkBtn"
    );

const nextBtn =
    document.getElementById(
        "nextBtn"
    );


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    const arr =
        [...array];


    for(
        let i =
            arr.length - 1;

        i > 0;

        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] =
        [
            arr[j],
            arr[i]
        ];

    }


    return arr;

}


/* =========================================================
   CREATE ROUND
========================================================= */

function createRound(){

    locked =
        false;


    message.textContent =
        "";

    message.className =
        "";


    explanation.classList.add(
        "hidden"
    );


    explanationText.innerHTML =
        "";


    clearBtn.classList.remove(
        "hidden"
    );


    checkBtn.classList.remove(
        "hidden"
    );


    nextBtn.classList.add(
        "hidden"
    );


    roundText.textContent =
        round;


    /* =====================================================
       SELECT 4 COLORS
    ====================================================== */

    currentColors =
        shuffle(
            COLORS
        ).slice(
            0,
            COLORS_PER_ROUND
        );


    /* =====================================================
       SHUFFLE WORDS
    ====================================================== */

    const words =
        shuffle(
            currentColors.map(
                color =>
                    color.text
            )
        );


    game.innerHTML =
        "";


    /* =====================================================
       CREATE ROWS
    ====================================================== */

    currentColors.forEach(
        (
            item,
            index
        ) => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "row";


            /* =============================================
               COLOR
            ============================================== */

            const colorBox =
                document.createElement(
                    "div"
                );


            colorBox.className =
                "colorBox";


            colorBox.style.background =
                item.color;


            if(
                item.color ===
                "#ffffff"
            ){

                colorBox.style.border =
                    "3px solid #b8c7d8";

            }


            /* =============================================
               SELECT
            ============================================== */

            const select =
                document.createElement(
                    "select"
                );


            select.id =
                `answer${index}`;


            const defaultOption =
                document.createElement(
                    "option"
                );


            defaultOption.value =
                "";


            defaultOption.textContent =
                "Select a word";


            select.appendChild(
                defaultOption
            );


            words.forEach(
                word => {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        word;


                    option.textContent =
                        word;


                    select.appendChild(
                        option
                    );

                }
            );


            row.appendChild(
                colorBox
            );


            row.appendChild(
                select
            );


            game.appendChild(
                row
            );

        }
    );

}


/* =========================================================
   CLEAR ANSWERS
========================================================= */

clearBtn.onclick =
    function(){

        if(
            locked
        ){

            return;

        }


        document
            .querySelectorAll(
                "#game select"
            )
            .forEach(
                select => {

                    select.value =
                        "";

                    select.classList.remove(
                        "correct-answer",
                        "wrong-answer"
                    );

                }
            );


        message.textContent =
            "";

        message.className =
            "";

    };


/* =========================================================
   CHECK ANSWERS
========================================================= */

checkBtn.onclick =
    function(){

        if(
            locked
        ){

            return;

        }


        const selects =
            document.querySelectorAll(
                "#game select"
            );


        /* =================================================
           REQUIRE ALL ANSWERS
        ================================================== */

        const incomplete =
            [
                ...selects
            ].some(
                select =>
                    select.value === ""
            );


        if(
            incomplete
        ){

            message.textContent =
                "Please answer all 4 colors first.";

            message.className =
                "wrong-message";

            return;

        }


        /* =================================================
           LOCK
        ================================================== */

        locked =
            true;


        let correct =
            0;


        /* =================================================
           CHECK EACH ANSWER
        ================================================== */

        currentColors.forEach(
            (
                item,
                index
            ) => {

                const select =
                    document.getElementById(
                        `answer${index}`
                    );


                const answer =
                    select.value;


                if(
                    answer ===
                    item.text
                ){

                    correct++;

                    select.classList.add(
                        "correct-answer"
                    );

                }

                else{

                    select.classList.add(
                        "wrong-answer"
                    );

                }

            }
        );


        /* =================================================
           SCORING
           
           ONLY PERFECT ROUND = +1
        ================================================== */

        if(
            correct ===
            COLORS_PER_ROUND
        ){

            score++;


            scoreText.textContent =
                score;


            message.textContent =
                "✓ Perfect! +1 point";


            message.className =
                "correct-message";

        }

        else{

            message.textContent =
                `✕ ${correct}/4 correct — 0 points`;


            message.className =
                "wrong-message";

        }


        /* =================================================
           DISABLE SELECTS
        ================================================== */

        selects.forEach(
            select => {

                select.disabled =
                    true;

            }
        );


        clearBtn.classList.add(
            "hidden"
        );


        checkBtn.classList.add(
            "hidden"
        );


        nextBtn.classList.remove(
            "hidden"
        );


        /* =================================================
           EXPLANATION
        ================================================== */

        showExplanation();

    };


/* =========================================================
   EXPLANATION
========================================================= */

function showExplanation(){

    let html =
        "";


    currentColors.forEach(
        item => {

            html += `

                <strong>
                    ${item.text}
                </strong>

                /${item.phonetics}/

                — ${item.english}

                <br>

            `;

        }
    );


    explanationText.innerHTML =
        html;


    explanation.classList.remove(
        "hidden"
    );

}


/* =========================================================
   NEXT ROUND
========================================================= */

nextBtn.onclick =
    function(){

        if(
            !locked
        ){

            return;

        }


        round++;


        if(
            round >
            TOTAL_ROUNDS
        ){

            finishGame();

            return;

        }


        createRound();

    };


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

    gameScreen.classList.add(
        "hidden"
    );


    resultScreen.classList.remove(
        "hidden"
    );


    document.getElementById(
        "scoreText"
    ).textContent =
        `${score} / ${TOTAL_ROUNDS}`;


    let performanceText =
        "";


    if(
        score ===
        TOTAL_ROUNDS
    ){

        performanceText =
            "Perfect!";

    }

    else if(
        score >=
        17
    ){

        performanceText =
            "Excellent!";

    }

    else if(
        score >=
        14
    ){

        performanceText =
            "Great Job!";

    }

    else if(
        score >=
        10
    ){

        performanceText =
            "Good Job!";

    }

    else{

        performanceText =
            "Keep Practicing!";

    }


    document.getElementById(
        "performance"
    ).textContent =
        performanceText;

}


/* =========================================================
   PLAY AGAIN
========================================================= */

document.getElementById(
    "playAgain"
).onclick =
    function(){

        round =
            1;


        score =
            0;


        scoreText.textContent =
            "0";


        resultScreen.classList.add(
            "hidden"
        );


        gameScreen.classList.remove(
            "hidden"
        );


        createRound();

    };


/* =========================================================
   START GAME
========================================================= */

createRound();

</script>
