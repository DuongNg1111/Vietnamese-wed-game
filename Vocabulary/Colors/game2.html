<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Color Memory Challenge
    </title>

    <!-- =========================
         GAME METADATA
    ========================= -->

    <meta
        name="game-title"
        content="Color Memory"
    >

    <meta
        name="game-description"
        content="Memorize Vietnamese color positions, then find the requested color."
    >

    <meta
        name="game-icon"
        content="🧠"
    >


    <style>

        /* =====================================================
           RESET
        ====================================================== */

        * {

            margin:
                0;

            padding:
                0;

            box-sizing:
                border-box;

        }


        /* =====================================================
           DESIGN TOKENS
        ====================================================== */

        :root {

            --accent:
                #2878df;

            --accent-dark:
                #1e5fba;

            --background:
                #eaf3ff;

            --border:
                #c4daf6;

            --ink:
                #143a6b;

            --ink-soft:
                #66809d;

            --white:
                #ffffff;

            --success:
                #27ae60;

            --error:
                #e74c3c;

        }


        /* =====================================================
           BODY
        ====================================================== */

        body {

            min-height:
                100vh;

            display:
                flex;

            flex-direction:
                column;

            justify-content:
                center;

            align-items:
                center;

            padding:
                20px;

            font-family:
                'Be Vietnam Pro',
                Arial,
                Helvetica,
                sans-serif;

            color:
                var(--ink);

            background:
                linear-gradient(
                    180deg,
                    #ffffff 0%,
                    #f5f9fd 48%,
                    #edf5fc 100%
                );

        }


        /* =====================================================
           BACK TO LOBBY
        ====================================================== */

        .back-btn-container {

            width:
                100%;

            max-width:
                700px;

            margin-bottom:
                15px;

            text-align:
                left;

        }


        .back-btn {

            display:
                inline-block;

            padding:
                10px 20px;

            border:
                1px solid
                var(--border);

            border-radius:
                12px;

            background:
                var(--background);

            color:
                var(--accent-dark);

            font-size:
                15px;

            font-weight:
                700;

            text-decoration:
                none;

            transition:
                0.2s ease;

        }


        .back-btn:hover {

            background:
                var(--accent);

            border-color:
                var(--accent);

            color:
                white;

            transform:
                translateY(-2px);

        }


        /* =====================================================
           MAIN CARD
        ====================================================== */

        .container {

            position:
                relative;

            width:
                100%;

            max-width:
                700px;

            padding:
                32px;

            overflow:
                hidden;

            border:
                1px solid
                var(--border);

            border-radius:
                24px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.97
                );

            text-align:
                center;

            box-shadow:
                0 18px 45px
                rgba(
                    20,
                    58,
                    107,
                    0.10
                );

        }


        .container::before {

            content:
                "";

            position:
                absolute;

            top:
                0;

            left:
                0;

            width:
                100%;

            height:
                5px;

            background:
                var(--accent);

        }


        /* =====================================================
           HEADINGS
        ====================================================== */

        h1 {

            margin-bottom:
                10px;

            color:
                var(--accent-dark);

            font-size:
                2rem;

            font-weight:
                800;

        }


        .subtitle {

            margin-bottom:
                25px;

            color:
                var(--ink-soft);

            font-size:
                0.92rem;

            line-height:
                1.5;

        }


        /* =====================================================
           QUESTION
        ====================================================== */

        #questionNumber {

            margin-bottom:
                10px;

            color:
                var(--ink-soft);

            font-size:
                0.9rem;

            font-weight:
                700;

        }


        #instruction {

            min-height:
                40px;

            margin-bottom:
                15px;

            color:
                var(--accent-dark);

            font-size:
                1.35rem;

            font-weight:
                800;

            line-height:
                1.35;

        }


        #countdown {

            min-height:
                55px;

            margin-bottom:
                20px;

            color:
                var(--accent);

            font-size:
                2.5rem;

            font-weight:
                800;

        }


        /* =====================================================
           COLOR GRID
        ====================================================== */

        .grid {

            width:
                340px;

            max-width:
                100%;

            margin:
                0 auto 25px;

            display:
                grid;

            grid-template-columns:
                repeat(
                    2,
                    1fr
                );

            gap:
                18px;

        }


        .square {

            aspect-ratio:
                1;

            border:
                4px solid
                transparent;

            border-radius:
                22px;

            cursor:
                pointer;

            transition:
                0.25s ease;

        }


        .square.hiddenColor {

            background:
                #dce5ef !important;

            border-color:
                #c7d4e1;

        }


        .square.clickable:hover {

            transform:
                translateY(-4px)
                scale(1.03);

            box-shadow:
                0 8px 18px
                rgba(
                    20,
                    58,
                    107,
                    0.16
                );

        }


        /* =====================================================
           ANSWER BORDERS
        ====================================================== */

        .greenBorder {

            border-color:
                var(--success) !important;

        }


        .redBorder {

            border-color:
                var(--error) !important;

        }


        /* =====================================================
           MESSAGE
        ====================================================== */

        #message {

            min-height:
                34px;

            margin-bottom:
                20px;

            font-size:
                1.25rem;

            font-weight:
                800;

        }


        .correct {

            color:
                var(--success);

        }


        .wrong {

            color:
                var(--error);

        }


        /* =====================================================
           BUTTONS
        ====================================================== */

        button {

            padding:
                13px 28px;

            border:
                none;

            border-radius:
                14px;

            background:
                var(--accent);

            color:
                white;

            font-family:
                inherit;

            font-size:
                0.95rem;

            font-weight:
                800;

            cursor:
                pointer;

            box-shadow:
                inset 0 -3px 0
                rgba(
                    0,
                    0,
                    0,
                    0.12
                );

            transition:
                0.2s ease;

        }


        button:hover {

            background:
                var(--accent-dark);

            transform:
                translateY(-2px);

        }


        .hidden {

            display:
                none !important;

        }


        /* =====================================================
           RESULT
        ====================================================== */

        .score {

            margin:
                20px 0;

            color:
                var(--accent-dark);

            font-size:
                2.6rem;

            font-weight:
                800;

        }


        .performance {

            margin-bottom:
                30px;

            color:
                var(--ink-soft);

            font-size:
                1.35rem;

            font-weight:
                700;

        }


        .result-label {

            margin-top:
                20px;

            color:
                var(--ink-soft);

            font-size:
                1.05rem;

            font-weight:
                600;

        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (
            max-width: 600px
        ) {

            body {

                padding:
                    14px;

            }


            .container {

                padding:
                    24px 20px;

                border-radius:
                    20px;

            }


            h1 {

                font-size:
                    1.65rem;

            }


            .subtitle {

                font-size:
                    0.86rem;

            }


            #instruction {

                font-size:
                    1.15rem;

            }


            .grid {

                width:
                    280px;

                gap:
                    14px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         BACK TO LOBBY
    ====================================================== -->

    <div class="back-btn-container">

        <a
            href="../../category.html?category=Color"
            class="back-btn"
        >
            ⬅ Back
        </a>

    </div>


    <!-- =====================================================
         GAME CONTAINER
    ====================================================== -->

    <div class="container">


        <!-- =================================================
             GAME SCREEN
        ================================================== -->

        <div id="gameScreen">


            <h1>
                Color Memory Challenge
            </h1>


            <div class="subtitle">

                Memorize the colors, then choose
                the correct one after they disappear.

            </div>


            <div id="questionNumber"></div>


            <div id="instruction"></div>


            <div id="countdown"></div>


            <div
                class="grid"
                id="grid"
            ></div>


            <div id="message"></div>


            <button
                id="nextBtn"
                class="hidden"
            ></button>


        </div>


        <!-- =================================================
             RESULT SCREEN
        ================================================== -->

        <div
            id="resultScreen"
            class="hidden"
        >


            <h1>
                Great Job!
            </h1>


            <div class="result-label">
                Memory Score
            </div>


            <div
                class="score"
                id="scoreText"
            ></div>


            <div
                class="performance"
                id="performance"
            ></div>


            <button
                id="restartBtn"
            >
                Play Again
            </button>


        </div>


    </div>


    <script>


        /* =====================================================
           VOCABULARY
        ====================================================== */

        const COLORS = [

            {
                text:
                    "Màu đỏ",

                color:
                    "red"
            },

            {
                text:
                    "Màu cam",

                color:
                    "orange"
            },

            {
                text:
                    "Màu vàng",

                color:
                    "yellow"
            },

            {
                text:
                    "Màu xanh lá",

                color:
                    "limegreen"
            },

            {
                text:
                    "Màu xanh dương",

                color:
                    "blue"
            },

            {
                text:
                    "Màu tím",

                color:
                    "purple"
            },

            {
                text:
                    "Màu hồng",

                color:
                    "hotpink"
            },

            {
                text:
                    "Màu nâu",

                color:
                    "brown"
            },

            {
                text:
                    "Màu đen",

                color:
                    "black"
            },

            {
                text:
                    "Màu trắng",

                color:
                    "white"
            },

            {
                text:
                    "Màu xám",

                color:
                    "gray"
            }

        ];


        /* =====================================================
           CONSTANTS
        ====================================================== */

        const TOTAL_QUESTIONS =
            20;


        /* =====================================================
           GAME STATE
        ====================================================== */

        let questions = [];

        let currentQuestion =
            0;

        let score =
            0;

        let answered =
            false;


        /* =====================================================
           DOM
        ====================================================== */

        const grid =
            document.getElementById(
                "grid"
            );


        const instruction =
            document.getElementById(
                "instruction"
            );


        const countdown =
            document.getElementById(
                "countdown"
            );


        const questionNumber =
            document.getElementById(
                "questionNumber"
            );


        const message =
            document.getElementById(
                "message"
            );


        const nextBtn =
            document.getElementById(
                "nextBtn"
            );


        const gameScreen =
            document.getElementById(
                "gameScreen"
            );


        const resultScreen =
            document.getElementById(
                "resultScreen"
            );


        const scoreText =
            document.getElementById(
                "scoreText"
            );


        const performance =
            document.getElementById(
                "performance"
            );


        const restartBtn =
            document.getElementById(
                "restartBtn"
            );


        /* =====================================================
           SHUFFLE
        ====================================================== */

        function shuffle(array) {

            for (
                let i =
                    array.length - 1;

                i > 0;

                i--
            ) {

                const j =
                    Math.floor(
                        Math.random() *
                        (i + 1)
                    );


                [
                    array[i],
                    array[j]
                ] =
                [
                    array[j],
                    array[i]
                ];

            }


            return array;

        }


        /* =====================================================
           GENERATE QUESTIONS
        ====================================================== */

        function generateQuestions() {

            questions = [];


            for (
                let i = 0;

                i < TOTAL_QUESTIONS;

                i++
            ) {

                const pool =
                    [...COLORS];


                shuffle(pool);


                const four =
                    pool.slice(
                        0,
                        4
                    );


                shuffle(four);


                const answerIndex =
                    Math.floor(
                        Math.random() * 4
                    );


                questions.push({

                    colors:
                        four,

                    answerIndex:
                        answerIndex

                });

            }

        }


        /* =====================================================
           START GAME
        ====================================================== */

        function startGame() {

            generateQuestions();


            currentQuestion =
                0;


            score =
                0;


            resultScreen.classList.add(
                "hidden"
            );


            gameScreen.classList.remove(
                "hidden"
            );


            loadQuestion();

        }


        /* =====================================================
           LOAD QUESTION
        ====================================================== */

        function loadQuestion() {

            answered =
                false;


            message.textContent =
                "";


            message.className =
                "";


            nextBtn.classList.add(
                "hidden"
            );


            const q =
                questions[
                    currentQuestion
                ];


            questionNumber.textContent =
                `Question ${
                    currentQuestion + 1
                } / ${
                    TOTAL_QUESTIONS
                }`;


            instruction.textContent =
                "Remember these colors!";


            countdown.textContent =
                "";


            grid.innerHTML =
                "";


            q.colors.forEach(
                (item, index) => {

                    const square =
                        document.createElement(
                            "div"
                        );


                    square.className =
                        "square";


                    square.dataset.index =
                        index;


                    square.style.background =
                        item.color;


                    if (
                        item.color ===
                        "white"
                    ) {

                        square.style.border =
                            "4px solid #bbb";

                    }


                    grid.appendChild(
                        square
                    );

                }
            );


            startCountdown();

        }


        /* =====================================================
           COUNTDOWN
        ====================================================== */

        function startCountdown() {

            let count =
                3;


            countdown.textContent =
                count;


            const timer =
                setInterval(
                    () => {

                        count--;


                        if (
                            count > 0
                        ) {

                            countdown.textContent =
                                count;

                        }

                        else {

                            clearInterval(
                                timer
                            );


                            countdown.textContent =
                                "";


                            hideColors();

                        }

                    },
                    1000
                );

        }


        /* =====================================================
           HIDE COLORS
        ====================================================== */

        function hideColors() {

            const q =
                questions[
                    currentQuestion
                ];


            instruction.innerHTML =
                `Where is<br><br>
                <strong>
                    "${q.colors[q.answerIndex].text}"
                </strong>`;


            [
                ...grid.children
            ].forEach(
                square => {

                    square.classList.add(
                        "hiddenColor"
                    );


                    square.classList.add(
                        "clickable"
                    );


                    square.onclick =
                        () =>
                            selectAnswer(
                                square
                            );

                }
            );

        }


        /* =====================================================
           REVEAL COLORS
        ====================================================== */

        function revealColors() {

            const q =
                questions[
                    currentQuestion
                ];


            [
                ...grid.children
            ].forEach(
                (
                    square,
                    index
                ) => {

                    square.classList.remove(
                        "hiddenColor"
                    );


                    square.classList.remove(
                        "clickable"
                    );


                    square.style.background =
                        q.colors[
                            index
                        ].color;


                    if (
                        q.colors[
                            index
                        ].color ===
                        "white"
                    ) {

                        square.style.border =
                            "4px solid #bbb";

                    }

                }
            );

        }


        /* =====================================================
           SELECT ANSWER
        ====================================================== */

        function selectAnswer(
            square
        ) {

            if (
                answered
            ) {

                return;

            }


            answered =
                true;


            revealColors();


            const q =
                questions[
                    currentQuestion
                ];


            const chosen =
                Number(
                    square.dataset.index
                );


            const correctSquare =
                grid.children[
                    q.answerIndex
                ];


            if (
                chosen ===
                q.answerIndex
            ) {

                score++;


                message.textContent =
                    "✅ Correct!";


                message.className =
                    "correct";


                correctSquare.classList.add(
                    "greenBorder"
                );

            }

            else {

                message.textContent =
                    "❌ Wrong!";


                message.className =
                    "wrong";


                correctSquare.classList.add(
                    "greenBorder"
                );


                square.classList.add(
                    "redBorder"
                );

            }


            nextBtn.classList.remove(
                "hidden"
            );


            if (
                currentQuestion ===
                TOTAL_QUESTIONS - 1
            ) {

                nextBtn.textContent =
                    "Finish";

            }

            else {

                nextBtn.textContent =
                    "Next Question →";

            }

        }


        /* =====================================================
           NEXT QUESTION
        ====================================================== */

        nextBtn.addEventListener(
            "click",
            () => {

                currentQuestion++;


                if (
                    currentQuestion >=
                    TOTAL_QUESTIONS
                ) {

                    showResults();

                }

                else {

                    loadQuestion();

                }

            }
        );


        /* =====================================================
           RESULTS
        ====================================================== */

        function showResults() {

            gameScreen.classList.add(
                "hidden"
            );


            resultScreen.classList.remove(
                "hidden"
            );


            scoreText.textContent =
                `${score} / ${TOTAL_QUESTIONS}`;


            if (
                score ===
                TOTAL_QUESTIONS
            ) {

                performance.textContent =
                    "Perfect Memory!";

            }

            else if (
                score >= 17
            ) {

                performance.textContent =
                    "Excellent!";

            }

            else if (
                score >= 14
            ) {

                performance.textContent =
                    "Good Job!";

            }

            else {

                performance.textContent =
                    "Keep Practicing!";

            }

        }


        /* =====================================================
           RESTART
        ====================================================== */

        restartBtn.addEventListener(
            "click",
            startGame
        );


        /* =====================================================
           INITIALIZE
        ====================================================== */

        startGame();

    </script>

</body>

</html>
