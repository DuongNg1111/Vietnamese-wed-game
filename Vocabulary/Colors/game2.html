
<!DOCTYPE html>

<html lang="en">

<head>

<meta

    content="width=device-width, initial-scale=1.0"
>

<title>
    Color Memory Challenge
</title>


<!-- =========================
     GAME METADATA
========================= -->

<meta
    name="game-title"
    content="Color Memory"
>

<meta
    name="game-description"
    content="Memorize Vietnamese color positions, then find the requested color."
>

<meta
    name="game-icon"
    content="🧠"
>


<!-- =========================
     GOOGLE FONT
========================= -->

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap"
    rel="stylesheet"
>

<!-- =====================================================
     SUPABASE & ANALYTICS
====================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../../BACKEND/supabase.js"></script>

<script src="../../BACKEND/analytics.js"></script>

<style>

/* ==========================================================
   RESET
========================================================== */

* {

    margin:
        0;

    padding:
        0;

    box-sizing:
        border-box;

}


/* ==========================================================
   DESIGN TOKENS
========================================================== */

:root {

    --paper:
        #f7f8fc;

    --f5f5f5:
        #ffffff;

    --ink:
        #143a6b;

    --ink-soft:
        #66809d;

    --accent:
        #7569AA;

    --accent-dark:
        #544A82;

    --accent-light:
        #efedf9;

    --accent-bg:
        #F5F4FB;

    --accent-border:
        #d0c9ec;

    --general-border:
        #dedbea;

    --correct:
        #019b3f;

    --correct-bg:
        #eaf3ff;

    --wrong:
        #d9536f;

    --wrong-bg:
        #fff0f3;

}


/* ==========================================================
   BODY
========================================================== */

body {

    margin:
        0;

    min-height:
        100vh;

    padding:
        28px 20px 45px;

    font-family:
        Calibri,
        'Segoe UI',
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    color:
        var(--ink);

    display:
        flex;

    justify-content:
        center;

    align-items:
        center;

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            var(--accent-bg) 48%,
            var(--accent-light) 100%
        );

}


/* ==========================================================
   PAGE
========================================================== */

.page {

    width:
        min(
            900px,
            100%
        );

    margin:
        0 auto;

}


/* ==========================================================
   BACK BUTTON
========================================================== */

.back-btn-container {

    margin-bottom:
        18px;

}


.back-btn {

    display:
        inline-flex;

    align-items:
        center;

    gap:
        7px;

    padding:
        9px 16px;

    border:
        1px solid
        var(--accent-border);

    border-radius:
        999px;

    background:
        rgba(
            255,
            255,
            255,
            0.92
        );

    color:
        var(--accent-dark);

    text-decoration:
        none;

    font-size:
        1.15rem;

    font-weight:
        700;

    box-shadow:
        0 4px 14px
        rgba(
            84,
            74,
            130,
            0.08
        );

    transition:
        0.2s ease;

}


.back-btn:hover {

    transform:
        translateY(-2px);

    background:
        var(--accent);

    border-color:
        var(--accent);

    color:
        #ffffff;

}


/* ==========================================================
   MAIN CARD
========================================================== */

.container {

    position:
        relative;

    width:
        100%;

    max-width:
        900px;

    padding:
        42px 48px 45px;

    overflow:
        hidden;

    border:
        1px solid
        var(--general-border);

    border-radius:
        24px;

    background:
        rgba(
            255,
            255,
            255,
            0.98
        );

    text-align:
        center;

    box-shadow:
        0 18px 50px
        rgba(
            84,
            74,
            130,
            0.10
        );

}


/* ==========================================================
   ACCENT LINE
========================================================== */

.container::before {

    content:
        "";

    position:
        absolute;

    top:
        0;

    left:
        0;

    width:
        100%;

    height:
        5px;

    background:
        var(--accent);

}


/* ==========================================================
   HEADINGS
========================================================== */

h1 {

    margin:
        0 0 9px;

    color:
        var(--ink);

    font-family:
        Kalam,
        cursive;

    font-size:
        2.65rem;

    font-weight:
        700;

    line-height:
        1.2;

}


.subtitle {

    max-width:
        600px;

    margin:
        0 auto 34px;

    color:
        var(--ink-soft);

    font-size:
        1.22rem;

    line-height:
        1.55;

}


/* ==========================================================
   QUESTION
========================================================== */

#questionNumber {

    margin-bottom:
        18px;

    color:
        var(--accent);

    font-size:
        1.08rem;

    font-weight:
        800;

    letter-spacing:
        0.06em;

    text-transform:
        uppercase;

}


#instruction {

    min-height:
        40px;

    margin-bottom:
        15px;

    color:
        var(--ink-soft);

    font-size:
        1.45rem;

    font-weight:
        700;

    line-height:
        1.35;

}


#instruction strong {

    color:
        var(--accent);

    font-weight:
        800;

}


#countdown {

    min-height:
        55px;

    margin-bottom:
        20px;

    color:
        var(--accent);

    font-size:
        2.875rem;

    font-weight:
        800;

}


/* ==========================================================
   COLOR GRID
========================================================== */

.grid {

    width:
        360px;

    max-width:
        100%;

    margin:
        0 auto 26px;

    display:
        grid;

    grid-template-columns:
        repeat(
            2,
            1fr
        );

    gap:
        18px;

}


.square {

    aspect-ratio:
        1;

    border:
        4px solid
        transparent;

    border-radius:
        22px;

    cursor:
        pointer;

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;

}


.square.hiddenColor {

    background:
        #dce5ef !important;

    border-color:
        #c7d4e1;

}


.square.clickable:hover {

    transform:
        translateY(-5px)
        scale(1.03);

    box-shadow:
        0 12px 24px
        rgba(
            84,
            74,
            130,
            0.16
        );

}


/* ==========================================================
   ANSWER BORDERS
========================================================== */

.greenBorder {

    border-color:
        var(--correct) !important;

    box-shadow:
        0 0 0 3px
        var(--correct-bg),
        0 10px 24px
        rgba(
            1,
            155,
            63,
            0.20
        );

}


.redBorder {

    border-color:
        var(--wrong) !important;

    box-shadow:
        0 0 0 3px
        var(--wrong-bg),
        0 10px 24px
        rgba(
            217,
            83,
            111,
            0.18
        );

}


/* ==========================================================
   MESSAGE
========================================================== */

#message {

    min-height:
        34px;

    margin-bottom:
        18px;

    font-size:
        1.25rem;

    font-weight:
        800;

}


.correct {

    color:
        var(--correct);

}


.wrong {

    color:
        var(--wrong);

}


/* ==========================================================
   BUTTONS
========================================================== */

button {

    min-width:
        180px;

    padding:
        13px 24px;

    border:
        none;

    border-radius:
        999px;

    background:
        var(--accent);

    color:
        #ffffff;

    font-family:
        inherit;

    font-size:
        1.18rem;

    font-weight:
        800;

    cursor:
        pointer;

    box-shadow:
        inset 0 -3px 0
        rgba(
            0,
            0,
            0,
            0.12
        ),
        0 6px 14px
        rgba(
            84,
            74,
            130,
            0.22
        );

    transition:
        0.2s ease;

}


button:hover {

    background:
        var(--accent-dark);

    transform:
        translateY(-2px);

}


button:active {

    transform:
        translateY(0);

}


.hidden {

    display:
        none !important;

}


/* ==========================================================
   RESULT
========================================================== */

.result-label {

    margin:
        20px 0 0;

    color:
        var(--ink-soft);

    font-size:
        1.18rem;

    font-weight:
        600;

}


.score {

    margin:
        10px 0 8px;

    color:
        var(--accent);

    font-size:
        3rem;

    font-weight:
        800;

}


.performance {

    margin-bottom:
        28px;

    color:
        var(--ink-soft);

    font-size:
        1.3rem;

    font-weight:
        600;

}


/* ==========================================================
   MOBILE
========================================================== */

@media (
    max-width: 600px
) {

    body {

        padding:
            18px 14px 35px;

        align-items:
            flex-start;

    }


    .container {

        padding:
            32px 20px 35px;

        border-radius:
            20px;

    }


    h1 {

        font-size:
            2.15rem;

    }


    .subtitle {

        font-size:
            1.12rem;

        margin-bottom:
            28px;

    }


    #instruction {

        font-size:
            1.3rem;

    }


    #countdown {

        font-size:
            2.5rem;

    }


    .grid {

        width:
            300px;

        gap:
            15px;

    }


    .square {

        border-radius:
            18px;

    }

}


/* ==========================================================
   VERY SMALL SCREENS
========================================================== */

@media (
    max-width: 380px
) {

    .container {

        padding:
            30px 16px;

    }


    h1 {

        font-size:
            2rem;

    }


    .grid {

        width:
            260px;

        gap:
            12px;

    }


    .square {

        border-radius:
            16px;

    }

}

</style>


</head>

<body>


<div class="page">


    <!-- =================================================
         BACK
    ================================================== -->

    <div class="back-btn-container">

        <a
            href="../../category.html?category=Colors"
            class="back-btn"
        >
            ← Back
        </a>

    </div>


    <!-- =================================================
         MAIN CARD
    ================================================== -->

    <main class="container">


        <!-- =============================================
             GAME SCREEN
        ============================================== -->

        <div id="gameScreen">


            <h1>
                Color Memory Challenge
            </h1>


            <div class="subtitle">

                Memorize the colors, then choose
                the correct one after they disappear.

            </div>


            <div id="questionNumber"></div>


            <div id="instruction"></div>


            <div id="countdown"></div>


            <div
                class="grid"
                id="grid"
            ></div>


            <div id="message"></div>


            <button
                id="nextBtn"
                class="hidden"
                type="button"
            ></button>


        </div>


        <!-- =============================================
             RESULT SCREEN
        ============================================== -->

        <section
            id="resultScreen"
            class="hidden"
        >


            <h1>
                Great Job!
            </h1>


            <div class="result-label">
                Memory Score
            </div>


            <div
                class="score"
                id="scoreText"
            ></div>


            <div
                class="performance"
                id="performance"
            ></div>


            <button
                id="restartBtn"
                type="button"
            >
                Play Again
            </button>


        </section>


    </main>


</div>


<script>


/* ==========================================================
   VOCABULARY
========================================================== */

const COLORS = [

    {
        text:
            "Màu đỏ",

        color:
            "red"
    },

    {
        text:
            "Màu cam",

        color:
            "orange"
    },

    {
        text:
            "Màu vàng",

        color:
            "yellow"
    },

    {
        text:
            "Màu xanh lá",

        color:
            "limegreen"
    },

    {
        text:
            "Màu xanh dương",

        color:
            "blue"
    },

    {
        text:
            "Màu tím",

        color:
            "purple"
    },

    {
        text:
            "Màu hồng",

        color:
            "hotpink"
    },

    {
        text:
            "Màu nâu",

        color:
            "brown"
    },

    {
        text:
            "Màu đen",

        color:
            "black"
    },

    {
        text:
            "Màu trắng",

        color:
            "#f5f5f5"
    },

    {
        text:
            "Màu xám",

        color:
            "gray"
    }

];


/* ==========================================================
   GAME SETTINGS
========================================================== */

const TOTAL_QUESTIONS =
    20;


/* ==========================================================
   GAME STATE
========================================================== */

let questions =
    [];

let currentQuestion =
    0;

let score =
    0;

let answered =
    false;


/* ==========================================================
   DOM ELEMENTS
========================================================== */

const grid =
    document.getElementById(
        "grid"
    );


const instruction =
    document.getElementById(
        "instruction"
    );


const countdown =
    document.getElementById(
        "countdown"
    );


const questionNumber =
    document.getElementById(
        "questionNumber"
    );


const message =
    document.getElementById(
        "message"
    );


const nextBtn =
    document.getElementById(
        "nextBtn"
    );


const gameScreen =
    document.getElementById(
        "gameScreen"
    );


const resultScreen =
    document.getElementById(
        "resultScreen"
    );


const scoreText =
    document.getElementById(
        "scoreText"
    );


const performance =
    document.getElementById(
        "performance"
    );


const restartBtn =
    document.getElementById(
        "restartBtn"
    );


/* ==========================================================
   SHUFFLE
========================================================== */

function shuffle(
    array
) {

    for (
        let i =
            array.length - 1;

        i > 0;

        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }


    return array;

}


/* ==========================================================
   GENERATE QUESTIONS
========================================================== */

function generateQuestions() {

    questions =
        [];


    for (
        let i = 0;

        i < TOTAL_QUESTIONS;

        i++
    ) {

        const pool =
            [
                ...COLORS
            ];


        shuffle(
            pool
        );


        const four =
            pool.slice(
                0,
                4
            );


        shuffle(
            four
        );


        const answerIndex =
            Math.floor(
                Math.random() * 4
            );


        questions.push({

            colors:
                four,

            answerIndex:
                answerIndex

        });

    }

}


/* ==========================================================
   START GAME
========================================================== */

function startGame() {

    generateQuestions();


    currentQuestion =
        0;


    score =
        0;


    resultScreen.classList.add(
        "hidden"
    );


    gameScreen.classList.remove(
        "hidden"
    );


    loadQuestion();

}


/* ==========================================================
   LOAD QUESTION
========================================================== */

function loadQuestion() {

    answered =
        false;


    message.textContent =
        "";


    message.className =
        "";


    nextBtn.classList.add(
        "hidden"
    );


    const q =
        questions[
            currentQuestion
        ];


    questionNumber.textContent =
        `Question ${
            currentQuestion + 1
        } / ${
            TOTAL_QUESTIONS
        }`;


    instruction.textContent =
        "Remember these colors!";


    countdown.textContent =
        "";


    grid.innerHTML =
        "";


    q.colors.forEach(
        (
            item,
            index
        ) => {

            const square =
                document.createElement(
                    "div"
                );


            square.className =
                "square";


            square.dataset.index =
                index;


            square.style.background =
                item.color;


            /*
             * Give #f5f5f5 a visible
             * border during memorization.
             */

            if (
                item.color ===
                "#f5f5f5"
            ) {

                square.style.border =
                    "4px solid #c9d4df";

            }


            grid.appendChild(
                square
            );

        }
    );


    startCountdown();

}


/* ==========================================================
   COUNTDOWN
========================================================== */

function startCountdown() {

    let count =
        3;


    countdown.textContent =
        count;


    const timer =
        setInterval(
            () => {

                count--;


                if (
                    count > 0
                ) {

                    countdown.textContent =
                        count;

                }

                else {

                    clearInterval(
                        timer
                    );


                    countdown.textContent =
                        "";


                    hideColors();

                }

            },
            1000
        );

}


/* ==========================================================
   HIDE COLORS
========================================================== */

function hideColors() {

    const q =
        questions[
            currentQuestion
        ];


    instruction.innerHTML =
        `Where is<br><br>
        <strong>
            "${q.colors[q.answerIndex].text}"
        </strong>`;


    [
        ...grid.children
    ].forEach(
        square => {

            square.classList.add(
                "hiddenColor"
            );


            square.classList.add(
                "clickable"
            );


            square.onclick =
                () =>
                    selectAnswer(
                        square
                    );

        }
    );

}


/* ==========================================================
   REVEAL COLORS
========================================================== */

function revealColors() {

    const q =
        questions[
            currentQuestion
        ];


    [
        ...grid.children
    ].forEach(
        (
            square,
            index
        ) => {

            square.classList.remove(
                "hiddenColor"
            );


            square.classList.remove(
                "clickable"
            );


            square.style.background =
                q.colors[
                    index
                ].color;


            if (
                q.colors[
                    index
                ].color ===
                "#f5f5f5"
            ) {

                square.style.border =
                    "4px solid #c9d4df";

            }

        }
    );

}


/* ==========================================================
   SELECT ANSWER
========================================================== */

function selectAnswer(
    square
) {

    if (
        answered
    ) {

        return;

    }


    answered =
        true;


    revealColors();


    const q =
        questions[
            currentQuestion
        ];


    const chosen =
        Number(
            square.dataset.index
        );


    const correctSquare =
        grid.children[
            q.answerIndex
        ];


    if (
        chosen ===
        q.answerIndex
    ) {

        score++;


        message.textContent =
            "✓ Correct!";


        message.className =
            "correct";


        correctSquare.classList.add(
            "greenBorder"
        );

    }

    else {

        message.textContent =
            "✕ Wrong!";


        message.className =
            "wrong";


        correctSquare.classList.add(
            "greenBorder"
        );


        square.classList.add(
            "redBorder"
        );

    }


    nextBtn.classList.remove(
        "hidden"
    );


    if (
        currentQuestion ===
        TOTAL_QUESTIONS - 1
    ) {

        nextBtn.textContent =
            "Finish";

    }

    else {

        nextBtn.textContent =
            "Next Question →";

    }

}


/* ==========================================================
   NEXT QUESTION
========================================================== */

nextBtn.addEventListener(
    "click",
    () => {

        currentQuestion++;


        if (
            currentQuestion >=
            TOTAL_QUESTIONS
        ) {

            showResults();

        }

        else {

            loadQuestion();

        }

    }
);


/* ==========================================================
   RESULTS
========================================================== */

function showResults() {

    gameScreen.classList.add(
        "hidden"
    );


    resultScreen.classList.remove(
        "hidden"
    );


    scoreText.textContent =
        `${score} / ${TOTAL_QUESTIONS}`;


    if (
        score ===
        TOTAL_QUESTIONS
    ) {

        performance.textContent =
            "Perfect Memory!";

    }

    else if (
        score >= 17
    ) {

        performance.textContent =
            "Excellent!";

    }

    else if (
        score >= 14
    ) {

        performance.textContent =
            "Good Job!";

    }

    else {

        performance.textContent =
            "Keep Practicing!";

    }


    /* ======================================================
       ANALYTICS — GAME COMPLETE
    ====================================================== */

    if (
        typeof trackGameComplete ===
        "function"
    ) {

        trackGameComplete(
            "Colors - Game 2",
            score,
            TOTAL_QUESTIONS
        );

    }

}


/* ==========================================================
   RESTART
========================================================== */

restartBtn.addEventListener(
    "click",
    startGame
);


/* ==========================================================
   INITIALIZE
========================================================== */

window.trackGameStart(
    "Colors - Game 2"
);

startGame();

</script>


</body>

</html>
