<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vietnamese Color Quiz</title>

<meta name="game-title" content="Vietnamese Color Quiz">
<meta
    name="game-description"
    content="Practice Vietnamese color words by choosing the correct Vietnamese word."
>
<meta name="game-icon" content="🎨">
<meta
    name="game-explanation"
    content="Look at the color and choose the correct Vietnamese word. Each correct answer earns 1 point. Wrong answers cannot be changed."
>

<!-- =========================================================
     GOOGLE FONT
========================================================= -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   COLOR SYSTEM

   Accent:       #2878df
   Accent dark:  #1e5fba
   Accent light: #eaf3ff
   Accent border:#c4daf6
   General:      #d9e6f2
   Correct:      #2878df / #eaf3ff
   Wrong:        #d9536f / #fff0f3
========================================================= */


/* =========================================================
   GLOBAL
========================================================= */

*{
    box-sizing:border-box;
}

body{

    margin:0;

    padding:20px;

    background:#f7faff;

    min-height:100vh;

    color:#333;

    font-family:
        Calibri,
        Arial,
        Helvetica,
        sans-serif;

}


/* =========================================================
   BACK BUTTON
========================================================= */

.back-btn-container{

    width:min(900px,95vw);

    margin:0 auto 15px;

}

.back-btn{

    display:inline-block;

    padding:9px 17px;

    background:white;

    color:#1e5fba;

    border:2px solid #c4daf6;

    border-radius:10px;

    text-decoration:none;

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-size:22px;

    font-weight:bold;

    transition:.2s;

}

.back-btn:hover{

    background:#eaf3ff;

    border-color:#2878df;

    color:#1e5fba;

    transform:translateY(-1px);

}


/* =========================================================
   GAME CARD
========================================================= */

.game-box{

    position:relative;

    width:min(900px,95vw);

    margin:0 auto;

    background:white;

    border:1px solid #d9e6f2;

    border-radius:20px;

    padding:30px 38px 35px;

    box-shadow:
        0 8px 28px rgba(40,120,223,.08);

    text-align:center;

    overflow:hidden;

}


/* =========================================================
   ACCENT LINE
========================================================= */

.game-box::before{

    content:"";

    position:absolute;

    top:0;

    left:0;

    width:100%;

    height:6px;

    background:#2878df;

}


/* =========================================================
   GAME SCREEN
========================================================= */

#gameScreen{

    display:block;

}


/* =========================================================
   GAME TITLE
========================================================= */

.game-title{

    margin:5px 0 4px;

    font-family:"Kalam", cursive;

    font-size:44px;

    font-weight:700;

    color:#1e5fba;

}


/* =========================================================
   SHORT INSTRUCTION
========================================================= */

.instruction{

    margin:0 0 20px;

    color:#66788a;

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-size:25px;

}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:20px;

    margin-bottom:10px;

    color:#64748b;

    font-size:24px;

    font-weight:bold;

}

.question-count{

    color:#64748b;

}

.score{

    color:#1e5fba;

    font-size:26px;

}


/* =========================================================
   PROGRESS
========================================================= */

.progress-wrap{

    width:100%;

    height:8px;

    background:#eaf3ff;

    border-radius:20px;

    overflow:hidden;

    margin-bottom:25px;

}

.progress{

    width:0%;

    height:100%;

    background:#2878df;

    border-radius:20px;

    transition:.3s;

}


/* =========================================================
   COLOR BOX
========================================================= */

#colorBox{

    width:220px;

    height:220px;

    margin:20px auto 28px;

    border:3px solid #d9e6f2;

    border-radius:20px;

    box-shadow:
        0 5px 18px rgba(40,120,223,.10);

}


/* =========================================================
   OPTIONS
========================================================= */

#options{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:14px;

    max-width:680px;

    margin:0 auto;

}

.option{

    width:100%;

    padding:15px 18px;

    background:white;

    border:2px solid #c4daf6;

    color:#334155;

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-size:29px;

    font-weight:bold;

    border-radius:12px;

    cursor:pointer;

    transition:.2s;

}

.option:hover:not(.disabled){

    background:#eaf3ff;

    border-color:#2878df;

    color:#1e5fba;

    transform:translateY(-2px);

}


/* =========================================================
   CORRECT
========================================================= */

.option.correct{

    background:#eaf3ff;

    border-color:#2878df;

    color:#1e5fba;

}


/* =========================================================
   WRONG
========================================================= */

.option.wrong{

    background:#fff0f3;

    border-color:#d9536f;

    color:#d9536f;

}


/* =========================================================
   DISABLED
========================================================= */

.option.disabled{

    pointer-events:none;

}


/* =========================================================
   FEEDBACK
========================================================= */

#message{

    min-height:40px;

    margin:18px 0 0;

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-size:29px;

    font-weight:bold;

}


/* =========================================================
   CORRECT MESSAGE
========================================================= */

.correct-message{

    color:#2878df;

}


/* =========================================================
   WRONG MESSAGE
========================================================= */

.wrong-message{

    color:#d9536f;

}


/* =========================================================
   RESULT SCREEN
========================================================= */

#resultScreen{

    display:none;

    text-align:center;

    padding:20px 10px 10px;

}


/* =========================================================
   RESULT TITLE
========================================================= */

#resultScreen h2{

    margin:0 0 15px;

    font-family:"Kalam", cursive;

    font-size:45px;

    color:#1e5fba;

}


/* =========================================================
   FINAL SCORE
========================================================= */

.final-score{

    color:#64748b;

    font-size:29px;

    margin:15px 0;

}

.final-score strong{

    color:#2878df;

}


/* =========================================================
   PERFORMANCE
========================================================= */

.performance{

    font-size:30px;

    color:#64748b;

    margin-bottom:25px;

}


/* =========================================================
   BUTTON
========================================================= */

.primary-btn{

    border:none;

    border-radius:11px;

    padding:12px 28px;

    background:#2878df;

    color:white;

    font-family:
        Calibri,
        Arial,
        sans-serif;

    font-size:26px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}

.primary-btn:hover{

    background:#1e5fba;

    transform:translateY(-2px);

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    body{

        padding:12px;

    }


    .game-box{

        width:100%;

        padding:27px 16px 28px;

        border-radius:18px;

    }


    .game-title{

        font-size:37px;

    }


    .instruction{

        font-size:23px;

        line-height:1.35;

        margin-bottom:18px;

    }


    .topbar{

        font-size:22px;

    }


    .score{

        font-size:24px;

    }


    #colorBox{

        width:180px;

        height:180px;

        margin:18px auto 24px;

    }


    #options{

        grid-template-columns:1fr;

        gap:11px;

    }


    .option{

        font-size:27px;

        padding:14px;

    }


    #message{

        font-size:27px;

    }


    #resultScreen h2{

        font-size:39px;

    }

}

</style>

</head>

<body>

<!-- =========================================================
     BACK TO CATEGORY
========================================================= -->

<div class="back-btn-container">


<a
    href="../../category.html?category=Colors"
    class="back-btn"
>
    ⬅ Back
</a>


</div>

<!-- =========================================================
     GAME CARD
========================================================= -->

<div class="game-box">


<!-- =====================================================
     GAME SCREEN
====================================================== -->

<div id="gameScreen">


    <!-- TITLE -->

    <h1 class="game-title">

        🎨 Vietnamese Color Quiz

    </h1>


    <!-- SHORT INSTRUCTION -->

    <p class="instruction">

        Choose the correct Vietnamese word for the color.

    </p>


    <!-- TOP BAR -->

    <div class="topbar">


        <div class="question-count">

            Question

            <span id="question">
                1
            </span>

            /20

        </div>


        <div class="score">

            Score:

            <span id="score">
                0
            </span>

        </div>


    </div>


    <!-- PROGRESS -->

    <div class="progress-wrap">

        <div
            class="progress"
            id="progress"
        ></div>

    </div>


    <!-- COLOR -->

    <div id="colorBox"></div>


    <!-- OPTIONS -->

    <div id="options"></div>


    <!-- FEEDBACK -->

    <div id="message"></div>


</div>


<!-- =====================================================
     RESULT SCREEN
====================================================== -->

<div id="resultScreen">


    <h2>

        🎉 Game Finished!

    </h2>


    <div class="final-score">

        Final Score:

        <strong>

            <span id="finalScore">
                0
            </span>

            /20

        </strong>

    </div>


    <div
        class="performance"
        id="performance"
    ></div>


    <button
        class="primary-btn"
        onclick="restartGame()"
    >

        Play Again

    </button>


</div>


</div>

<script>


/* =========================================================
   VOCABULARY
========================================================= */

const colors = [

    {
        name:"màu đỏ",
        color:"#ff0000"
    },

    {
        name:"màu cam",
        color:"#ff9800"
    },

    {
        name:"màu vàng",
        color:"#ffd700"
    },

    {
        name:"màu xanh lá",
        color:"#4caf50"
    },

    {
        name:"màu xanh dương",
        color:"#2196f3"
    },

    {
        name:"màu tím",
        color:"#9c27b0"
    },

    {
        name:"màu hồng",
        color:"#ff69b4"
    },

    {
        name:"màu nâu",
        color:"#795548"
    },

    {
        name:"màu đen",
        color:"#000000"
    },

    {
        name:"màu trắng",
        color:"#ffffff"
    },

    {
        name:"màu xám",
        color:"#9e9e9e"
    }

];


/* =========================================================
   SETTINGS
========================================================= */

const TOTAL_QUESTIONS = 20;

const TOTAL_OPTIONS = 4;


/* =========================================================
   STATE
========================================================= */

let questions = [];

let currentQuestion = 0;

let score = 0;

let currentAnswer = null;

let answered = false;


/* =========================================================
   DOM
========================================================= */

const gameScreen =
    document.getElementById(
        "gameScreen"
    );

const resultScreen =
    document.getElementById(
        "resultScreen"
    );

const colorBox =
    document.getElementById(
        "colorBox"
    );

const optionsDiv =
    document.getElementById(
        "options"
    );

const message =
    document.getElementById(
        "message"
    );

const questionText =
    document.getElementById(
        "question"
    );

const scoreText =
    document.getElementById(
        "score"
    );

const progress =
    document.getElementById(
        "progress"
    );

const finalScore =
    document.getElementById(
        "finalScore"
    );

const performance =
    document.getElementById(
        "performance"
    );


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    const arr = [...array];

    for(
        let i = arr.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            arr[i],
            arr[j]
        ] = [
            arr[j],
            arr[i]
        ];

    }

    return arr;

}


/* =========================================================
   CREATE QUESTIONS
========================================================= */

function createQuestions(){

    questions = [];

    let previousColor = null;


    for(
        let i = 0;
        i < TOTAL_QUESTIONS;
        i++
    ){

        let available =
            colors.filter(
                color =>
                    color !== previousColor
            );


        if(
            available.length === 0
        ){

            available = colors;

        }


        const selected =
            available[
                Math.floor(
                    Math.random() *
                    available.length
                )
            ];


        questions.push(selected);

        previousColor =
            selected;

    }

}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    currentQuestion = 0;

    score = 0;

    currentAnswer = null;

    answered = false;


    createQuestions();


    gameScreen.style.display =
        "block";


    resultScreen.style.display =
        "none";


    scoreText.textContent =
        "0";


    loadQuestion();

}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion(){

    answered = false;


    const question =
        questions[currentQuestion];


    currentAnswer =
        question;


    questionText.textContent =
        currentQuestion + 1;


    progress.style.width =
        (
            currentQuestion /
            TOTAL_QUESTIONS *
            100
        ) + "%";


    colorBox.style.backgroundColor =
        question.color;


    /* =====================================================
       WHITE COLOR BORDER
    ====================================================== */

    if(
        question.color === "#ffffff"
    ){

        colorBox.style.border =
            "3px solid #9caec1";

    }

    else{

        colorBox.style.border =
            "3px solid #d9e6f2";

    }


    message.textContent =
        "";

    message.className =
        "";


    optionsDiv.innerHTML =
        "";


    /* =====================================================
       CREATE WRONG ANSWERS
    ====================================================== */

    const wrongAnswers =
        shuffle(

            colors.filter(
                color =>
                    color !== question
            )

        ).slice(
            0,
            TOTAL_OPTIONS - 1
        );


    /* =====================================================
       CREATE OPTIONS
    ====================================================== */

    const options =
        shuffle([

            question,

            ...wrongAnswers

        ]);


    options.forEach(
        option => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "option";


            button.textContent =
                option.name;


            button.onclick =
                () => {

                    chooseAnswer(
                        button,
                        option
                    );

                };


            optionsDiv.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   CHOOSE ANSWER
========================================================= */

function chooseAnswer(
    button,
    selected
){

    /*
       Each question can only be answered once.
    */

    if(answered){

        return;

    }


    answered = true;


    /* =====================================================
       CORRECT
    ====================================================== */

    if(
        selected === currentAnswer
    ){

        button.classList.add(
            "correct"
        );


        score++;


        scoreText.textContent =
            score;


        message.className =
            "correct-message";


        message.textContent =
            "✓ Correct!";


    }


    /* =====================================================
       WRONG
    ====================================================== */

    else{

        button.classList.add(
            "wrong"
        );


        message.className =
            "wrong-message";


        message.textContent =
            "✕ Wrong!";


        /*
           Show correct answer.
        */

        document
            .querySelectorAll(
                ".option"
            )
            .forEach(
                optionButton => {

                    if(
                        optionButton.textContent ===
                        currentAnswer.name
                    ){

                        optionButton.classList.add(
                            "correct"
                        );

                    }

                }
            );

    }


    /* =====================================================
       LOCK ALL OPTIONS
    ====================================================== */

    disableOptions();


    /* =====================================================
       NEXT QUESTION
    ====================================================== */

    setTimeout(
        nextQuestion,
        900
    );

}


/* =========================================================
   DISABLE OPTIONS
========================================================= */

function disableOptions(){

    document
        .querySelectorAll(
            ".option"
        )
        .forEach(
            button => {

                button.classList.add(
                    "disabled"
                );

            }
        );

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion(){

    currentQuestion++;


    if(
        currentQuestion >=
        TOTAL_QUESTIONS
    ){

        finishGame();

        return;

    }


    loadQuestion();

}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

    progress.style.width =
        "100%";


    gameScreen.style.display =
        "none";


    resultScreen.style.display =
        "block";


    finalScore.textContent =
        score;


    const percentage =
        Math.round(
            score /
            TOTAL_QUESTIONS *
            100
        );


    let resultMessage;


    if(
        percentage === 100
    ){

        resultMessage =
            "🏆 Perfect! Excellent!";

    }

    else if(
        percentage >= 80
    ){

        resultMessage =
            "🎉 Excellent job!";

    }

    else if(
        percentage >= 60
    ){

        resultMessage =
            "👍 Good job! Keep practicing!";

    }

    else{

        resultMessage =
            "📚 Keep practicing your colors!";

    }


    performance.textContent =
        resultMessage;

}


/* =========================================================
   RESTART
========================================================= */

function restartGame(){

    resultScreen.style.display =
        "none";


    gameScreen.style.display =
        "block";


    startGame();

}


/* =========================================================
   START
========================================================= */

startGame();


</script>

</body>

</html>
