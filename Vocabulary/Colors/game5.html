<style>

/* =========================================================
   RESET
========================================================= */

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}


/* =========================================================
   DESIGN TOKENS
========================================================= */

:root {

    --paper:
        #f7f8fc;

    --f5f5f5:
        #ffffff;

    --ink:
        #143a6b;

    --ink-soft:
        #66809d;

    --accent:
        #7569AA;

    --accent-dark:
        #544A82;

    --accent-light:
        #efedf9;

    --accent-bg:
        #F5F4FB;

    --accent-border:
        #d0c9ec;

    --general-border:
        #dedbea;

    --correct:
        #019b3f;

    --correct-bg:
        #eaf3ff;

    --wrong:
        #d9536f;

    --wrong-bg:
        #fff0f3;

}


/* =========================================================
   BODY
========================================================= */

body{

    min-height:100vh;

    padding:
         28px 20px 45px;

    background:
         linear-gradient(
            180deg,
            #ffffff 0%,
            var(--accent-bg) 48%,
            var(--accent-light) 100%
        );


    color:
        var(--ink);


    font-family:
        Calibri, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif

}


/* =========================================================
   BACK BUTTON
========================================================= */

.back-btn-container{

    width:
        900px;

    max-width:
        100%;

    margin:
        0 auto 14px;

}


.back-btn{

    display:
        inline-block;

    padding:
        9px 18px;

    border:
        1px solid
        var(--accent-border);

    border-radius:
        12px;

    background:
        var(--accent-bg);

    color:
        var(--accent-dark);

    font-family:
        Calibri,
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        23px;

    font-weight:
        700;

    text-decoration:
        none;

    transition:
        .2s ease;

}


.back-btn:hover{

    background:
        var(--accent);

    border-color:
        var(--accent);

    color:
        #ffffff;

    transform:
        translateY(-2px);

}


/* =========================================================
   MAIN GAME CARD
========================================================= */

.game-box{

    position:
        relative;

    width:
        900px;

    max-width:
        100%;

    margin:
        0 auto;

    padding:
        34px 42px 38px;

    overflow:
        hidden;

    border:
        1px solid
        var(--general-border);

    border-radius:
        24px;

    background:
        var(--white);

    box-shadow:
        0 14px 35px
        rgba(
            60,
            55,
            75,
            .12
        );

}


/* =========================================================
   ACCENT LINE
========================================================= */

.game-box::before{

    content:
        "";

    position:
        absolute;

    top:
        0;

    left:
        0;

    width:
        100%;

    height:
        5px;

    background:
        var(--accent);

}


/* =========================================================
   GAME SCREEN
========================================================= */

#gameScreen{

    display:
        block;

}


/* =========================================================
   HEADER
========================================================= */

.game-title{

    margin:
        2px 0 5px;

    text-align:
        center;

    color:
        var(--ink);

    font-family:
        Kalam,
        cursive;

    font-size:
        43px;

    font-weight:
        700;

}


.instruction{

    margin:
        0 0 22px;

    color:
        var(--text-soft);

    text-align:
        center;

    font-size:
        23px;

    line-height:
        1.45;

}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        20px;

    margin-bottom:
        10px;

    color:
        var(--text-soft);

    font-size:
        22px;

    font-weight:
        700;

}


.question-count{

    color:
        var(--text-soft);

}


.score{

    color:
        var(--accent-dark);

    font-size:
        24px;

}


#question,
#score{

    font-weight:
        800;

}


/* =========================================================
   PROGRESS BAR
========================================================= */

.progress-wrap{

    width:
        100%;

    height:
        8px;

    margin-bottom:
        25px;

    overflow:
        hidden;

    border-radius:
        20px;

    background:
        var(--accent-light);

}


.progress{

    width:
        0%;

    height:
        100%;

    border-radius:
        20px;

    background:
        var(--accent);

    transition:
        width .3s ease;

}


/* =========================================================
   COLOR BOX
========================================================= */

#colorBox{

    width:
        220px;

    height:
        220px;

    margin:
        20px auto 28px;

    border:
        3px solid
        var(--general-border);

    border-radius:
        20px;

    box-shadow:
        0 5px 18px
        rgba(
            60,
            55,
            75,
            .10
        );

}


/* =========================================================
   OPTIONS
========================================================= */

#options{

    display:
        grid;

    grid-template-columns:
        1fr 1fr;

    gap:
        14px;

    width:
        100%;

    max-width:
        680px;

    margin:
        0 auto;

}


.option{

    width:
        100%;

    padding:
        15px 18px;

    border:
        2px solid
        var(--accent-border);

    border-radius:
        12px;

    outline:
        none;

    background:
        var(--white);

    color:
        var(--text);

    font-family:
        Calibri,
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        27px;

    font-weight:
        700;

    cursor:
        pointer;

    transition:
        .2s ease;

}


.option:hover:not(.disabled){

    background:
        var(--accent-light);

    border-color:
        var(--accent);

    color:
        var(--accent-dark);

    transform:
        translateY(-2px);

}


/* =========================================================
   CORRECT ANSWER
========================================================= */

.option.correct{

    border-color:
        var(--correct);

    background:
        var(--correct-bg);

    color:
        var(--correct);

}


/* =========================================================
   WRONG ANSWER
========================================================= */

.option.wrong{

    border-color:
        var(--wrong);

    background:
        var(--wrong-bg);

    color:
        var(--wrong);

}


/* =========================================================
   DISABLED
========================================================= */

.option.disabled{

    pointer-events:
        none;

}


/* =========================================================
   FEEDBACK MESSAGE
========================================================= */

#message{

    min-height:
        40px;

    margin:
        18px 0 0;

    text-align:
        center;

    font-size:
        26px;

    font-weight:
        700;

}


.correct-message{

    color:
        var(--correct);

}


.wrong-message{

    color:
        var(--wrong);

}


/* =========================================================
   RESULT SCREEN
========================================================= */

#resultScreen{

    display:
        none;

    padding:
        20px 10px 10px;

    text-align:
        center;

}


/* =========================================================
   RESULT TITLE
========================================================= */

#resultScreen h2{

    margin:
        0 0 15px;

    color:
        var(--accent-dark);

    font-family:
        Kalam,
        cursive;

    font-size:
        43px;

    font-weight:
        700;

}


/* =========================================================
   FINAL SCORE
========================================================= */

.final-score{

    margin:
        15px 0;

    color:
        var(--text-soft);

    font-size:
        27px;

}


.final-score strong{

    color:
        var(--accent-dark);

}


/* =========================================================
   PERFORMANCE
========================================================= */

.performance{

    margin-bottom:
        25px;

    color:
        var(--text-soft);

    font-size:
        27px;

    font-weight:
        700;

}


/* =========================================================
   PRIMARY BUTTON
========================================================= */

.primary-btn{

    padding:
        11px 27px;

    border:
        none;

    border-radius:
        12px;

    background:
        var(--accent);

    color:
        #ffffff;

    font-family:
        Calibri,
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        23px;

    font-weight:
        700;

    cursor:
        pointer;

    box-shadow:
        inset 0 -3px 0
        rgba(
            0,
            0,
            0,
            .10
        );

    transition:
        .2s ease;

}


.primary-btn:hover{

    background:
        var(--accent-dark);

    transform:
        translateY(-2px);

}


/* =========================================================
   MOBILE
========================================================= */

@media(
    max-width:600px
){

    body{

        padding:
            14px 10px;

    }


    .back-btn-container{

        margin-bottom:
            12px;

    }


    .back-btn{

        font-size:
            20px;

        padding:
            8px 15px;

    }


    .game-box{

        padding:
            29px 16px 30px;

        border-radius:
            20px;

    }


    .game-title{

        font-size:
            36px;

        line-height:
            1.15;

    }


    .instruction{

        margin-bottom:
            18px;

        font-size:
            20px;

        line-height:
            1.4;

    }


    .topbar{

        font-size:
            20px;

    }


    .score{

        font-size:
            22px;

    }


    #colorBox{

        width:
            180px;

        height:
            180px;

        margin:
            18px auto 24px;

    }


    #options{

        grid-template-columns:
            1fr;

        gap:
            11px;

    }


    .option{

        padding:
            13px 14px;

        font-size:
            24px;

    }


    #message{

        font-size:
            24px;

    }


    #resultScreen h2{

        font-size:
            38px;

    }


    .final-score{

        font-size:
            25px;

    }


    .performance{

        font-size:
            24px;

    }


    .primary-btn{

        font-size:
            21px;

    }

}

</style>

</div>

<script>

/* =========================================================
   VOCABULARY
========================================================= */

const colors = [

    {
        name:
            "màu đỏ",

        phonetics:
            "maw daw",

        english:
            "red",

        color:
            "#ff0000"
    },

    {
        name:
            "màu cam",

        phonetics:
            "maw kam",

        english:
            "orange",

        color:
            "#ff9800"
    },

    {
        name:
            "màu vàng",

        phonetics:
            "maw vang",

        english:
            "yellow",

        color:
            "#ffd700"
    },

    {
        name:
            "màu xanh lá",

        phonetics:
            "maw sanh la",

        english:
            "green",

        color:
            "#4caf50"
    },

    {
        name:
            "màu xanh dương",

        phonetics:
            "maw sanh zoong",

        english:
            "blue",

        color:
            "#2196f3"
    },

    {
        name:
            "màu tím",

        phonetics:
            "maw tim",

        english:
            "purple",

        color:
            "#9c27b0"
    },

    {
        name:
            "màu hồng",

        phonetics:
            "maw hong",

        english:
            "pink",

        color:
            "#ff69b4"
    },

    {
        name:
            "màu nâu",

        phonetics:
            "maw nəw",

        english:
            "brown",

        color:
            "#795548"
    },

    {
        name:
            "màu đen",

        phonetics:
            "maw den",

        english:
            "black",

        color:
            "#000000"
    },

    {
        name:
            "màu trắng",

        phonetics:
            "maw chang",

        english:
            "white",

        color:
            "#ffffff"
    },

    {
        name:
            "màu xám",

        phonetics:
            "maw sam",

        english:
            "gray",

        color:
            "#9e9e9e"
    }

];


/* =========================================================
   SETTINGS
========================================================= */

const TOTAL_QUESTIONS =
    20;

const TOTAL_OPTIONS =
    4;


/* =========================================================
   GAME STATE
========================================================= */

let questions =
    [];

let currentQuestion =
    0;

let score =
    0;

let currentAnswer =
    null;

let answered =
    false;


/* =========================================================
   DOM ELEMENTS
========================================================= */

const gameScreen =
    document.getElementById(
        "gameScreen"
    );

const resultScreen =
    document.getElementById(
        "resultScreen"
    );

const colorBox =
    document.getElementById(
        "colorBox"
    );

const optionsDiv =
    document.getElementById(
        "options"
    );

const message =
    document.getElementById(
        "message"
    );

const questionText =
    document.getElementById(
        "question"
    );

const scoreText =
    document.getElementById(
        "score"
    );

const progress =
    document.getElementById(
        "progress"
    );

const finalScore =
    document.getElementById(
        "finalScore"
    );

const performance =
    document.getElementById(
        "performance"
    );

const playAgain =
    document.getElementById(
        "playAgain"
    );


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    const arr =
        [...array];


    for(
        let i =
            arr.length - 1;

        i > 0;

        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] =
        [
            arr[j],
            arr[i]
        ];

    }


    return arr;

}


/* =========================================================
   CREATE QUESTIONS
========================================================= */

function createQuestions(){

    questions =
        [];


    let previousColor =
        null;


    for(
        let i =
            0;

        i <
            TOTAL_QUESTIONS;

        i++
    ){

        let available =
            colors.filter(
                color =>
                    color !==
                    previousColor
            );


        if(
            available.length === 0
        ){

            available =
                colors;

        }


        const selected =
            available[
                Math.floor(
                    Math.random() *
                    available.length
                )
            ];


        questions.push(
            selected
        );


        previousColor =
            selected;

    }

}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    currentQuestion =
        0;

    score =
        0;

    currentAnswer =
        null;

    answered =
        false;


    createQuestions();


    gameScreen.style.display =
        "block";


    resultScreen.style.display =
        "none";


    scoreText.textContent =
        "0";


    loadQuestion();

}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion(){

    answered =
        false;


    const question =
        questions[
            currentQuestion
        ];


    currentAnswer =
        question;


    questionText.textContent =
        currentQuestion + 1;


    progress.style.width =
        (
            currentQuestion /
            TOTAL_QUESTIONS *
            100
        ) + "%";


    colorBox.style.backgroundColor =
        question.color;


    /* =====================================================
       WHITE COLOR BORDER
    ====================================================== */

    if(
        question.color ===
        "#ffffff"
    ){

        colorBox.style.border =
            "3px solid #a9a2bf";

    }

    else{

        colorBox.style.border =
            "3px solid var(--general-border)";

    }


    message.textContent =
        "";

    message.className =
        "";


    optionsDiv.innerHTML =
        "";


    /* =====================================================
       WRONG ANSWERS
    ====================================================== */

    const wrongAnswers =
        shuffle(

            colors.filter(
                color =>
                    color !==
                    question
            )

        ).slice(
            0,
            TOTAL_OPTIONS - 1
        );


    /* =====================================================
       OPTIONS
    ====================================================== */

    const options =
        shuffle([

            question,

            ...wrongAnswers

        ]);


    options.forEach(
        option => {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "option";


            button.textContent =
                option.name;


            button.addEventListener(
                "click",
                function(){

                    chooseAnswer(
                        button,
                        option
                    );

                }
            );


            optionsDiv.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   CHOOSE ANSWER
========================================================= */

function chooseAnswer(
    button,
    selected
){

    /*
       Each question can only be
       answered once.
    */

    if(
        answered
    ){

        return;

    }


    answered =
        true;


    /* =====================================================
       CORRECT
    ====================================================== */

    if(
        selected ===
        currentAnswer
    ){

        button.classList.add(
            "correct"
        );


        score++;


        scoreText.textContent =
            score;


        message.className =
            "correct-message";


        message.textContent =
            "✓ Correct!";

    }


    /* =====================================================
       WRONG
    ====================================================== */

    else{

        button.classList.add(
            "wrong"
        );


        message.className =
            "wrong-message";


        message.textContent =
            "✕ Wrong!";


        /*
           Reveal correct answer.
        */

        document
            .querySelectorAll(
                ".option"
            )
            .forEach(
                optionButton => {

                    if(
                        optionButton.textContent ===
                        currentAnswer.name
                    ){

                        optionButton.classList.add(
                            "correct"
                        );

                    }

                }
            );

    }


    /* =====================================================
       LOCK ALL OPTIONS
    ====================================================== */

    disableOptions();


    /*
       Small delay so the learner
       can see the result.
    */

    setTimeout(
        nextQuestion,
        900
    );

}


/* =========================================================
   DISABLE OPTIONS
========================================================= */

function disableOptions(){

    document
        .querySelectorAll(
            ".option"
        )
        .forEach(
            button => {

                button.classList.add(
                    "disabled"
                );

            }
        );

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion(){

    currentQuestion++;


    if(
        currentQuestion >=
        TOTAL_QUESTIONS
    ){

        finishGame();

        return;

    }


    loadQuestion();

}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

    progress.style.width =
        "100%";


    gameScreen.style.display =
        "none";


    resultScreen.style.display =
        "block";


    finalScore.textContent =
        score;


    const percentage =
        Math.round(
            score /
            TOTAL_QUESTIONS *
            100
        );


    let resultMessage =
        "";


    if(
        percentage ===
        100
    ){

        resultMessage =
            "Perfect! Excellent!";

    }

    else if(
        percentage >=
        80
    ){

        resultMessage =
            "Excellent job!";

    }

    else if(
        percentage >=
        60
    ){

        resultMessage =
            "Good job! Keep practicing!";

    }

    else{

        resultMessage =
            "Keep practicing your colors!";

    }


    performance.textContent =
        resultMessage;

}


/* =========================================================
   RESTART
========================================================= */

function restartGame(){

    startGame();

}


/* =========================================================
   PLAY AGAIN
========================================================= */

playAgain.addEventListener(
    "click",
    restartGame
);


/* =========================================================
   START
========================================================= */

startGame();

</script>
