<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Color Matching</title>

<meta
    name="game-title"
    content="Color Matching"
>

<meta
    name="game-description"
    content="Match Vietnamese color words with the correct colors."
>

<meta
    name="game-icon"
    content="🎨"
>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Kalam:wght@400;700&display=swap"
    rel="stylesheet"
>


<style>

/* ==========================================================
   DESIGN TOKENS
========================================================== */

:root {

    --paper:
        #f5f9fd;

    --white:
        #ffffff;

    --ink:
        #143a6b;

    --ink-soft:
        #66809d;

    --accent:
        #2878df;

    --accent-dark:
        #1e5fba;

    --accent-light:
        #eaf3ff;

    --border:
        #c4daf6;

    --green:
        #27ae60;

    --green-light:
        #eaf8f0;

    --red:
        #e05252;

    --red-light:
        #fff0f0;

}


/* ==========================================================
   RESET
========================================================== */

* {

    box-sizing:
        border-box;

    margin:
        0;

    padding:
        0;

}


/* ==========================================================
   BODY
========================================================== */

body {

    min-height:
        100vh;

    padding:
        28px 20px 45px;

    font-family:
        'Be Vietnam Pro',
        'Segoe UI',
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    color:
        var(--ink);

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #f5f9fd 48%,
            #edf5fc 100%
        );

}


/* ==========================================================
   PAGE
========================================================== */

.page {

    width:
        min(
            760px,
            100%
        );

    margin:
        0 auto;

}


/* ==========================================================
   BACK TO LOBBY
========================================================== */

.back-btn-container {

    margin-bottom:
        18px;

}


.back-btn {

    display:
        inline-flex;

    align-items:
        center;

    gap:
        7px;

    padding:
        9px 16px;

    border:
        1px solid
        var(--border);

    border-radius:
        999px;

    background:
        rgba(
            255,
            255,
            255,
            0.9
        );

    color:
        var(--accent-dark);

    text-decoration:
        none;

    font-size:
        0.82rem;

    font-weight:
        700;

    box-shadow:
        0 4px 14px
        rgba(
            20,
            58,
            107,
            0.07
        );

    transition:
        0.2s ease;

}


.back-btn:hover {

    transform:
        translateY(-2px);

    background:
        var(--accent);

    border-color:
        var(--accent);

    color:
        white;

}


/* ==========================================================
   GAME CARD
========================================================== */

.card {

    width:
        100%;

    padding:
        38px;

    background:
        rgba(
            255,
            255,
            255,
            0.97
        );

    border:
        1px solid
        var(--border);

    border-radius:
        24px;

    box-shadow:
        0 18px 50px
        rgba(
            20,
            58,
            107,
            0.10
        );

    text-align:
        center;

}


/* ==========================================================
   HEADER
========================================================== */

.game-icon {

    width:
        58px;

    height:
        58px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    margin:
        0 auto 16px;

    border:
        1px solid
        var(--border);

    border-radius:
        16px;

    background:
        var(--accent-light);

    font-size:
        1.8rem;

}


h1 {

    margin:
        0 0 9px;

    color:
        var(--ink);

    font-size:
        1.9rem;

    font-weight:
        800;

    line-height:
        1.25;

}


.subtitle {

    max-width:
        520px;

    margin:
        0 auto 30px;

    color:
        var(--ink-soft);

    font-size:
        0.9rem;

    line-height:
        1.55;

}


/* ==========================================================
   GAME SCREEN
========================================================== */

.question-number {

    margin-bottom:
        18px;

    color:
        var(--accent);

    font-size:
        0.78rem;

    font-weight:
        800;

    letter-spacing:
        0.05em;

    text-transform:
        uppercase;

}


.choose-text {

    margin-bottom:
        8px;

    color:
        var(--ink-soft);

    font-size:
        0.88rem;

    font-weight:
        600;

}


.word {

    margin-bottom:
        30px;

    color:
        var(--accent);

    font-size:
        2.35rem;

    font-weight:
        800;

    line-height:
        1.2;

}


/* ==========================================================
   ANSWERS
========================================================== */

.answers {

    display:
        flex;

    justify-content:
        center;

    align-items:
        center;

    gap:
        22px;

    flex-wrap:
        wrap;

    margin-bottom:
        24px;

}


.color-btn {

    width:
        170px;

    height:
        150px;

    border:
        4px solid
        transparent;

    border-radius:
        20px;

    cursor:
        pointer;

    box-shadow:
        0 7px 18px
        rgba(
            20,
            58,
            107,
            0.12
        );

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;

}


.color-btn:hover:not(.disabled) {

    transform:
        translateY(-5px);

    box-shadow:
        0 13px 25px
        rgba(
            20,
            58,
            107,
            0.18
        );

}


.color-btn.disabled {

    cursor:
        default;

}


/* ==========================================================
   FEEDBACK
========================================================== */

.message {

    min-height:
        32px;

    margin-bottom:
        18px;

    font-size:
        0.95rem;

    font-weight:
        800;

}


.correct-text {

    color:
        var(--green);

}


.wrong-text {

    color:
        var(--red);

}


.green-border {

    border-color:
        var(--green) !important;

}


.red-border {

    border-color:
        var(--red) !important;

}


/* ==========================================================
   BUTTON
========================================================== */

.action-btn {

    min-width:
        170px;

    padding:
        12px 22px;

    border:
        none;

    border-radius:
        999px;

    background:
        var(--accent);

    color:
        white;

    font-family:
        inherit;

    font-size:
        0.86rem;

    font-weight:
        800;

    cursor:
        pointer;

    box-shadow:
        inset 0 -3px 0
        rgba(
            0,
            0,
            0,
            0.12
        ),
        0 5px 12px
        rgba(
            40,
            120,
            223,
            0.20
        );

    transition:
        0.2s ease;

}


.action-btn:hover {

    background:
        var(--accent-dark);

    transform:
        translateY(-2px);

}


.action-btn:active {

    transform:
        translateY(0);

}


/* ==========================================================
   RESULT SCREEN
========================================================== */

.result-icon {

    width:
        64px;

    height:
        64px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    margin:
        0 auto 18px;

    border:
        1px solid
        var(--border);

    border-radius:
        18px;

    background:
        var(--accent-light);

    font-size:
        2rem;

}


.result-title {

    margin-bottom:
        10px;

}


.score {

    margin:
        20px 0 8px;

    color:
        var(--accent);

    font-size:
        2.6rem;

    font-weight:
        800;

}


.performance {

    margin-bottom:
        28px;

    color:
        var(--ink-soft);

    font-size:
        1rem;

    font-weight:
        600;

}


/* ==========================================================
   HIDDEN
========================================================== */

.hidden {

    display:
        none !important;

}


/* ==========================================================
   MOBILE
========================================================== */

@media (
    max-width: 600px
) {

    body {

        padding:
            18px 14px 35px;

    }


    .card {

        padding:
            28px 20px;

        border-radius:
            20px;

    }


    h1 {

        font-size:
            1.55rem;

    }


    .subtitle {

        font-size:
            0.84rem;

        margin-bottom:
            25px;

    }


    .word {

        font-size:
            2rem;

        margin-bottom:
            24px;

    }


    .answers {

        gap:
            14px;

    }


    .color-btn {

        width:
            135px;

        height:
            125px;

        border-radius:
            17px;

    }

}


/* ==========================================================
   VERY SMALL SCREENS
========================================================== */

@media (
    max-width: 380px
) {

    .color-btn {

        width:
            115px;

        height:
            110px;

    }

}

</style>

</head>


<body>


<div class="page">


    <!-- ======================================================
         BACK TO LOBBY
    ======================================================= -->

    <div class="back-btn-container">

        <a
            href="../../category.html?category=Color"
            class="back-btn"
        >
            ← Back
        </a>

    </div>


    <!-- ======================================================
         GAME CARD
    ======================================================= -->

    <main class="card">


        <!-- ==================================================
             GAME HEADER
        =================================================== -->

        <div
            class="game-icon"
            aria-hidden="true"
        >
            🎨
        </div>


        <h1>
            Color Matching
        </h1>


        <p class="subtitle">
            Match the Vietnamese color word with the
            correct color.
        </p>


        <!-- ==================================================
             GAME SCREEN
        =================================================== -->

        <section id="gameScreen">


            <div
                id="questionNumber"
                class="question-number"
            >
            </div>


            <div class="choose-text">
                Choose:
            </div>


            <div
                id="questionWord"
                class="word"
            >
            </div>


            <div
                id="answers"
                class="answers"
            >
            </div>


            <div
                id="message"
                class="message"
                aria-live="polite"
            >
            </div>


            <button
                id="nextBtn"
                class="action-btn hidden"
                type="button"
            >
            </button>


        </section>


        <!-- ==================================================
             RESULT SCREEN
        =================================================== -->

        <section
            id="resultScreen"
            class="hidden"
        >


            <div
                class="result-icon"
                aria-hidden="true"
            >
                🎉
            </div>


            <h1 class="result-title">
                Great Job!
            </h1>


            <div
                id="scoreText"
                class="score"
            >
            </div>


            <div
                id="performance"
                class="performance"
            >
            </div>


            <button
                id="playAgain"
                class="action-btn"
                type="button"
            >
                Play Again
            </button>


        </section>


    </main>

</div>


<script>

/* ==========================================================
   VOCABULARY
   Core Color Vocabulary
========================================================== */

const COLORS = [

    {
        text:
            "đỏ",

        phonetic:
            "/daw/",

        english:
            "red",

        color:
            "red"
    },

    {
        text:
            "cam",

        phonetic:
            "/kam/",

        english:
            "orange",

        color:
            "orange"
    },

    {
        text:
            "vàng",

        phonetic:
            "/vang/",

        english:
            "yellow",

        color:
            "yellow"
    },

    {
        text:
            "xanh lá",

        phonetic:
            "/sanh la/",

        english:
            "green",

        color:
            "limegreen"
    },

    {
        text:
            "xanh dương",

        phonetic:
            "/sanh zoong/",

        english:
            "blue",

        color:
            "royalblue"
    },

    {
        text:
            "tím",

        phonetic:
            "/tim/",

        english:
            "purple",

        color:
            "purple"
    },

    {
        text:
            "hồng",

        phonetic:
            "/hong/",

        english:
            "pink",

        color:
            "hotpink"
    },

    {
        text:
            "nâu",

        phonetic:
            "/nəw/",

        english:
            "brown",

        color:
            "saddlebrown"
    },

    {
        text:
            "đen",

        phonetic:
            "/den/",

        english:
            "black",

        color:
            "black"
    },

    {
        text:
            "trắng",

        phonetic:
            "/chang/",

        english:
            "white",

        color:
            "white"
    },

    {
        text:
            "xám",

        phonetic:
            "/sam/",

        english:
            "gray",

        color:
            "gray"
    }

];


/* ==========================================================
   GAME SETTINGS
========================================================== */

const TOTAL_QUESTIONS =
    20;


/* ==========================================================
   GAME STATE
========================================================== */

let questions =
    [];

let currentQuestion =
    0;

let score =
    0;

let answered =
    false;


/* ==========================================================
   DOM ELEMENTS
========================================================== */

const questionNumber =
    document.getElementById(
        "questionNumber"
    );


const questionWord =
    document.getElementById(
        "questionWord"
    );


const answers =
    document.getElementById(
        "answers"
    );


const message =
    document.getElementById(
        "message"
    );


const nextBtn =
    document.getElementById(
        "nextBtn"
    );


const gameScreen =
    document.getElementById(
        "gameScreen"
    );


const resultScreen =
    document.getElementById(
        "resultScreen"
    );


const scoreText =
    document.getElementById(
        "scoreText"
    );


const performance =
    document.getElementById(
        "performance"
    );


const playAgain =
    document.getElementById(
        "playAgain"
    );


/* ==========================================================
   RANDOM
========================================================== */

function randomIndex(max) {

    return Math.floor(
        Math.random() * max
    );

}


/* ==========================================================
   SHUFFLE
========================================================== */

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }


    return array;

}


/* ==========================================================
   GET RANDOM WRONG ANSWER
========================================================== */

function getWrongAnswer(correct) {

    let wrong;


    do {

        wrong =
            COLORS[
                randomIndex(
                    COLORS.length
                )
            ];

    }
    while (
        wrong.color ===
        correct.color
    );


    return wrong;

}


/* ==========================================================
   GENERATE QUESTIONS
========================================================== */

function generateQuestions() {

    questions = [];


    for (
        let i = 0;
        i < TOTAL_QUESTIONS;
        i++
    ) {

        const correct =
            COLORS[
                randomIndex(
                    COLORS.length
                )
            ];


        const wrong =
            getWrongAnswer(
                correct
            );


        const options = [

            correct,
            wrong

        ];


        shuffle(
            options
        );


        questions.push({

            correct:
                correct,

            options:
                options

        });

    }

}


/* ==========================================================
   START GAME
========================================================== */

function startGame() {

    generateQuestions();


    currentQuestion =
        0;


    score =
        0;


    gameScreen.classList.remove(
        "hidden"
    );


    resultScreen.classList.add(
        "hidden"
    );


    loadQuestion();

}


/* ==========================================================
   LOAD QUESTION
========================================================== */

function loadQuestion() {

    answered =
        false;


    message.textContent =
        "";


    message.className =
        "message";


    nextBtn.classList.add(
        "hidden"
    );


    const question =
        questions[
            currentQuestion
        ];


    questionNumber.textContent =
        `Question ${
            currentQuestion + 1
        } / ${
            TOTAL_QUESTIONS
        }`;


    questionWord.textContent =
        question.correct.text;


    answers.innerHTML =
        "";


    question.options.forEach(
        option => {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "color-btn";


            button.dataset.correct =
                (
                    option.color ===
                    question.correct.color
                );


            button.style.background =
                option.color;


            /*
             * White needs a visible border
             * before the user answers.
             */

            if (
                option.color ===
                "white"
            ) {

                button.style.borderColor =
                    "#c9d4df";

            }


            button.setAttribute(
                "aria-label",
                option.english
            );


            button.addEventListener(
                "click",
                () =>
                    handleAnswer(
                        button
                    )
            );


            answers.appendChild(
                button
            );

        }
    );

}


/* ==========================================================
   HANDLE ANSWER
========================================================== */

function handleAnswer(
    selected
) {

    if (
        answered
    ) {

        return;

    }


    answered =
        true;


    const buttons =
        document.querySelectorAll(
            ".color-btn"
        );


    buttons.forEach(
        button => {

            button.classList.add(
                "disabled"
            );

        }
    );


    const correctButton =
        [
            ...buttons
        ].find(
            button =>
                button.dataset.correct ===
                "true"
        );


    if (
        selected.dataset.correct ===
        "true"
    ) {

        score++;


        message.textContent =
            "✓ Correct!";


        message.classList.add(
            "correct-text"
        );


        correctButton.classList.add(
            "green-border"
        );

    }

    else {

        message.textContent =
            "✕ Wrong!";


        message.classList.add(
            "wrong-text"
        );


        selected.classList.add(
            "red-border"
        );


        correctButton.classList.add(
            "green-border"
        );

    }


    nextBtn.classList.remove(
        "hidden"
    );


    if (
        currentQuestion ===
        TOTAL_QUESTIONS - 1
    ) {

        nextBtn.textContent =
            "Finish";

    }

    else {

        nextBtn.textContent =
            "Next Question →";

    }

}


/* ==========================================================
   NEXT QUESTION
========================================================== */

nextBtn.addEventListener(
    "click",
    () => {

        currentQuestion++;


        if (
            currentQuestion >=
            TOTAL_QUESTIONS
        ) {

            showResults();

        }

        else {

            loadQuestion();

        }

    }
);


/* ==========================================================
   SHOW RESULTS
========================================================== */

function showResults() {

    gameScreen.classList.add(
        "hidden"
    );


    resultScreen.classList.remove(
        "hidden"
    );


    scoreText.textContent =
        `${score} / ${TOTAL_QUESTIONS}`;


    if (
        score ===
        TOTAL_QUESTIONS
    ) {

        performance.textContent =
            "Perfect! 🎨";

    }

    else if (
        score >= 16
    ) {

        performance.textContent =
            "Excellent!";

    }

    else if (
        score >= 12
    ) {

        performance.textContent =
            "Good Job!";

    }

    else {

        performance.textContent =
            "Keep Practicing!";

    }

}


/* ==========================================================
   PLAY AGAIN
========================================================== */

playAgain.addEventListener(
    "click",
    startGame
);


/* ==========================================================
   INITIALIZE
========================================================== */

startGame();

</script>


</body>

</html>
