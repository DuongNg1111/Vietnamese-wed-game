<script>

/* =========================================
   VOCABULARY
========================================= */

const COLORS = [

    {
        text:
            "đỏ",

        phonetics:
            "daw",

        english:
            "red",

        color:
            "#ef4444"
    },

    {
        text:
            "cam",

        phonetics:
            "kam",

        english:
            "orange",

        color:
            "#f97316"
    },

    {
        text:
            "vàng",

        phonetics:
            "vang",

        english:
            "yellow",

        color:
            "#facc15"
    },

    {
        text:
            "xanh lá",

        phonetics:
            "sanh la",

        english:
            "green",

        color:
            "#22c55e"
    },

    {
        text:
            "xanh dương",

        phonetics:
            "sanh zoong",

        english:
            "blue",

        color:
            "#3b82f6"
    },

    {
        text:
            "tím",

        phonetics:
            "tim",

        english:
            "purple",

        color:
            "#a855f7"
    },

    {
        text:
            "hồng",

        phonetics:
            "hong",

        english:
            "pink",

        color:
            "#ec4899"
    },

    {
        text:
            "nâu",

        phonetics:
            "nəw",

        english:
            "brown",

        color:
            "#92400e"
    },

    {
        text:
            "đen",

        phonetics:
            "den",

        english:
            "black",

        color:
            "#111827"
    },

    {
        text:
            "trắng",

        phonetics:
            "chang",

        english:
            "white",

        color:
            "#ffffff"
    },

    {
        text:
            "xám",

        phonetics:
            "sam",

        english:
            "gray",

        color:
            "#6b7280"
    }

];


/* =========================================
   CONSTANTS
========================================= */

const TOTAL_QUESTIONS =
    20;

const PAIRS_PER_QUESTION =
    4;


/* =========================================
   GAME STATE
========================================= */

let currentQuestion =
    0;

let score =
    0;

let currentPairs =
    [];

let selectedItem =
    null;

let connections =
    [];

let checked =
    false;


/* =========================================
   DOM
========================================= */

const gameScreen =
    document.getElementById(
        "gameScreen"
    );

const resultScreen =
    document.getElementById(
        "resultScreen"
    );

const left =
    document.getElementById(
        "left"
    );

const right =
    document.getElementById(
        "right"
    );

const canvas =
    document.getElementById(
        "canvas"
    );

const ctx =
    canvas.getContext(
        "2d"
    );

const questionNumber =
    document.getElementById(
        "questionNumber"
    );

const message =
    document.getElementById(
        "message"
    );

const explanation =
    document.getElementById(
        "explanation"
    );

const explanationText =
    document.getElementById(
        "explanationText"
    );

const clearBtn =
    document.getElementById(
        "clearBtn"
    );

const checkBtn =
    document.getElementById(
        "checkBtn"
    );

const nextBtn =
    document.getElementById(
        "nextBtn"
    );

const playAgain =
    document.getElementById(
        "playAgain"
    );


/* =========================================
   SHUFFLE
========================================= */

function shuffle(array) {

    for (
        let i =
            array.length - 1;

        i > 0;

        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }


    return array;

}


/* =========================================
   GENERATE QUESTION
========================================= */

function generateQuestion() {

    const pool =
        shuffle(
            [...COLORS]
        );


    currentPairs =
        pool.slice(
            0,
            PAIRS_PER_QUESTION
        );

}


/* =========================================
   LOAD QUESTION
========================================= */

function loadQuestion() {

    checked =
        false;

    selectedItem =
        null;

    connections =
        [];

    message.textContent =
        "";

    message.className =
        "";

    explanation.classList.add(
        "hidden"
    );

    explanationText.textContent =
        "";

    clearBtn.classList.remove(
        "hidden"
    );

    checkBtn.classList.remove(
        "hidden"
    );

    nextBtn.classList.add(
        "hidden"
    );

    left.innerHTML =
        "";

    right.innerHTML =
        "";

    clearCanvas();

    generateQuestion();


    questionNumber.textContent =
        `Question ${
            currentQuestion + 1
        } / ${
            TOTAL_QUESTIONS
        }`;


    /* =====================================
       CREATE COLOR ITEMS
    ====================================== */

    currentPairs.forEach(
        (
            pair,
            index
        ) => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "item";


            item.dataset.index =
                index;


            item.style.background =
                pair.color;


            if (
                pair.color ===
                "#ffffff"
            ) {

                item.style.border =
                    "4px solid #c9c4d8";

            }


            item.onclick =
                () =>
                    selectItem(
                        item
                    );


            left.appendChild(
                item
            );

        }
    );


    /* =====================================
       CREATE WORD TARGETS
    ====================================== */

    const shuffledWords =
        shuffle(
            [...currentPairs]
        );


    shuffledWords.forEach(
        pair => {

            const target =
                document.createElement(
                    "div"
                );


            target.className =
                "target";


            target.dataset.index =
                currentPairs.indexOf(
                    pair
                );


            target.textContent =
                pair.text;


            target.onclick =
                () =>
                    selectTarget(
                        target
                    );


            right.appendChild(
                target
            );

        }
    );


    resizeCanvas();

}


/* =========================================
   SELECT COLOR
========================================= */

function selectItem(
    item
) {

    if (
        checked
    ) {

        return;

    }


    if (
        item.classList.contains(
            "matched"
        )
    ) {

        return;

    }


    document
        .querySelectorAll(
            ".item"
        )
        .forEach(
            el => {

                el.classList.remove(
                    "selected"
                );

            }
        );


    item.classList.add(
        "selected"
    );


    selectedItem =
        item;

}


/* =========================================
   SELECT TARGET
========================================= */

function selectTarget(
    target
) {

    if (
        checked
    ) {

        return;

    }


    if (
        target.classList.contains(
            "matched"
        )
    ) {

        return;

    }


    if (
        !selectedItem
    ) {

        return;

    }


    const colorIndex =
        Number(
            selectedItem.dataset.index
        );


    const targetIndex =
        Number(
            target.dataset.index
        );


    /* =====================================
       REMOVE OLD CONNECTION
    ====================================== */

    connections =
        connections.filter(
            connection =>
                connection.colorIndex !==
                colorIndex
        );


    connections =
        connections.filter(
            connection =>
                connection.targetIndex !==
                targetIndex
        );


    /* =====================================
       ADD CONNECTION
    ====================================== */

    connections.push({

        colorIndex:
            colorIndex,

        targetIndex:
            targetIndex

    });


    selectedItem.classList.remove(
        "selected"
    );


    selectedItem =
        null;


    updateMatchedStates();

    drawConnections();

}


/* =========================================
   UPDATE MATCHED STATES
========================================= */

function updateMatchedStates() {

    document
        .querySelectorAll(
            ".item"
        )
        .forEach(
            item => {

                const index =
                    Number(
                        item.dataset.index
                    );


                const matched =
                    connections.some(
                        connection =>
                            connection.colorIndex ===
                            index
                    );


                item.classList.toggle(
                    "matched",
                    matched
                );

            }
        );


    document
        .querySelectorAll(
            ".target"
        )
        .forEach(
            target => {

                const index =
                    Number(
                        target.dataset.index
                    );


                const matched =
                    connections.some(
                        connection =>
                            connection.targetIndex ===
                            index
                    );


                target.classList.toggle(
                    "matched",
                    matched
                );

            }
        );

}


/* =========================================
   CLEAR
========================================= */

clearBtn.onclick =
    function() {

        if (
            checked
        ) {

            return;

        }


        connections =
            [];

        selectedItem =
            null;


        document
            .querySelectorAll(
                ".item"
            )
            .forEach(
                item => {

                    item.classList.remove(
                        "selected",
                        "matched"
                    );

                    item.style.outline =
                        "";

                }
            );


        document
            .querySelectorAll(
                ".target"
            )
            .forEach(
                target => {

                    target.classList.remove(
                        "matched"
                    );

                    target.style.border =
                        "2px solid var(--accent-border)";

                }
            );


        clearCanvas();

    };


/* =========================================
   CHECK ANSWERS
========================================= */

checkBtn.onclick =
    function() {

        if (
            checked
        ) {

            return;

        }


        if (
            connections.length <
            PAIRS_PER_QUESTION
        ) {

            message.textContent =
                `Connect all ${PAIRS_PER_QUESTION} pairs first.`;

            message.className =
                "wrong-message";

            return;

        }


        checked =
            true;


        let correctCount =
            0;


        connections.forEach(
            connection => {

                if (
                    connection.colorIndex ===
                    connection.targetIndex
                ) {

                    correctCount++;

                }

            }
        );


        /* =================================
           ALL CORRECT
        ================================== */

        if (
            correctCount ===
            PAIRS_PER_QUESTION
        ) {

            score++;


            message.textContent =
                "✓ Correct! +1 point";

            message.className =
                "correct-message";

        }


        /* =================================
           ANY WRONG
        ================================== */

        else {

            message.textContent =
                "✕ Not quite. 0 points.";

            message.className =
                "wrong-message";

        }


        showExplanation();


        clearBtn.classList.add(
            "hidden"
        );

        checkBtn.classList.add(
            "hidden"
        );

        nextBtn.classList.remove(
            "hidden"
        );


        highlightAnswers();

    };


/* =========================================
   EXPLANATION
========================================= */

function showExplanation() {

    let html =
        "";


    currentPairs.forEach(
        pair => {

            html +=
                `<strong>${pair.text}</strong> /${pair.phonetics}/ — ${pair.english}<br>`;

        }
    );


    explanationText.innerHTML =
        html;


    explanation.classList.remove(
        "hidden"
    );

}


/* =========================================
   HIGHLIGHT ANSWERS
========================================= */

function highlightAnswers() {

    const rootStyles =
        getComputedStyle(
            document.documentElement
        );


    const correctColor =
        rootStyles
            .getPropertyValue(
                "--correct"
            )
            .trim();


    const wrongColor =
        rootStyles
            .getPropertyValue(
                "--wrong"
            )
            .trim();


    connections.forEach(
        connection => {

            const colorItem =
                document.querySelector(
                    `.item[data-index="${connection.colorIndex}"]`
                );


            const target =
                document.querySelector(
                    `.target[data-index="${connection.targetIndex}"]`
                );


            if (
                !colorItem ||
                !target
            ) {

                return;

            }


            if (
                connection.colorIndex ===
                connection.targetIndex
            ) {

                colorItem.style.outline =
                    `4px solid ${correctColor}`;

                target.style.border =
                    `3px solid ${correctColor}`;

            }

            else {

                colorItem.style.outline =
                    `4px solid ${wrongColor}`;

                target.style.border =
                    `3px solid ${wrongColor}`;

            }

        }
    );

}


/* =========================================
   NEXT QUESTION
========================================= */

nextBtn.onclick =
    function() {

        currentQuestion++;


        if (
            currentQuestion >=
            TOTAL_QUESTIONS
        ) {

            showResults();

        }

        else {

            loadQuestion();

        }

    };


/* =========================================
   RESULTS
========================================= */

function showResults() {

    gameScreen.classList.add(
        "hidden"
    );


    resultScreen.classList.remove(
        "hidden"
    );


    document.getElementById(
        "scoreText"
    ).textContent =
        `${score} / ${TOTAL_QUESTIONS}`;


    let resultText;


    if (
        score ===
        TOTAL_QUESTIONS
    ) {

        resultText =
            "Perfect!";

    }

    else if (
        score >=
        17
    ) {

        resultText =
            "Excellent!";

    }

    else if (
        score >=
        14
    ) {

        resultText =
            "Great Job!";

    }

    else if (
        score >=
        10
    ) {

        resultText =
            "Good Job!";

    }

    else {

        resultText =
            "Keep Practicing!";

    }


    document.getElementById(
        "performance"
    ).textContent =
        resultText;

}


/* =========================================
   PLAY AGAIN
========================================= */

playAgain.onclick =
    function() {

        currentQuestion =
            0;

        score =
            0;


        resultScreen.classList.add(
            "hidden"
        );


        gameScreen.classList.remove(
            "hidden"
        );


        loadQuestion();

    };


/* =========================================
   DRAW CONNECTIONS
========================================= */

function drawConnections() {

    clearCanvas();


    const game =
        document.getElementById(
            "game"
        );


    const gameRect =
        game.getBoundingClientRect();


    connections.forEach(
        connection => {

            const item =
                document.querySelector(
                    `.item[data-index="${connection.colorIndex}"]`
                );


            const target =
                document.querySelector(
                    `.target[data-index="${connection.targetIndex}"]`
                );


            if (
                !item ||
                !target
            ) {

                return;

            }


            const itemRect =
                item.getBoundingClientRect();


            const targetRect =
                target.getBoundingClientRect();


            const x1 =
                itemRect.right -
                gameRect.left;


            const y1 =
                itemRect.top +
                itemRect.height / 2 -
                gameRect.top;


            const x2 =
                targetRect.left -
                gameRect.left;


            const y2 =
                targetRect.top +
                targetRect.height / 2 -
                gameRect.top;


            ctx.beginPath();


            ctx.moveTo(
                x1,
                y1
            );


            ctx.lineTo(
                x2,
                y2
            );


            ctx.lineWidth =
                4;


            ctx.strokeStyle =
                "#7569AA";


            ctx.lineCap =
                "round";


            ctx.stroke();

        }
    );

}


/* =========================================
   CLEAR CANVAS
========================================= */

function clearCanvas() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

}


/* =========================================
   RESIZE CANVAS
========================================= */

function resizeCanvas() {

    const game =
        document.getElementById(
            "game"
        );


    canvas.width =
        game.clientWidth;


    canvas.height =
        game.clientHeight;


    drawConnections();

}


/* =========================================
   WINDOW RESIZE
========================================= */

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================
   START GAME
========================================= */

loadQuestion();

</script>

</body>

</html>
