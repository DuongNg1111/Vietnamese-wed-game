/* ==========================================================

/* ==========================================================
   SHUFFLE
========================================================== */

function shuffle(array) {

    const copy =
        [...array];


    for (
        let i = copy.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            copy[i],
            copy[j]
        ] =
        [
            copy[j],
            copy[i]
        ];

    }


    return copy;

}


/* ==========================================================
   GENERATE QUESTIONS
========================================================== */

function generateQuestions() {

    questions =
        QUESTIONS.map(
            item => {

                const options = [

                    {
                        text:
                            item.correct,

                        correct:
                            true
                    },

                    {
                        text:
                            item.wrong,

                        correct:
                            false
                    }

                ];


                shuffle(
                    options
                );


                return {

                    question:
                        item.question,

                    options:
                        options,

                    correct:
                        item.correct,

                    explanation:
                        item.explanation

                };

            }
        );

}


/* ==========================================================
   START GAME
========================================================== */

function startGame() {

    generateQuestions();


    currentQuestion =
        0;


    score =
        0;


    gameScreen.classList.remove(
        "hidden"
    );


    resultScreen.classList.add(
        "hidden"
    );


    loadQuestion();

}


/* ==========================================================
   LOAD QUESTION
========================================================== */

function loadQuestion() {

    answered =
        false;


    message.textContent =
        "";

    message.className =
        "message";


    explanation.textContent =
        "";


    nextBtn.classList.add(
        "hidden"
    );


    const current =
        questions[
            currentQuestion
        ];


    questionNumber.textContent =
        `Question ${
            currentQuestion + 1
        } / ${
            TOTAL_QUESTIONS
        }`;


    question.textContent =
        current.question;


    answers.innerHTML =
        "";


    current.options.forEach(
        option => {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "answer-btn";


            button.textContent =
                option.text;


            button.dataset.correct =
                option.correct;


            button.addEventListener(
                "click",
                () =>
                    handleAnswer(
                        button,
                        current
                    )
            );


            answers.appendChild(
                button
            );

        }
    );

}


/* ==========================================================
   HANDLE ANSWER
========================================================== */

function handleAnswer(
    selected,
    current
) {

    if (
        answered
    ) {

        return;

    }


    answered =
        true;


    const buttons =
        document.querySelectorAll(
            ".answer-btn"
        );


    buttons.forEach(
        button => {

            button.classList.add(
                "disabled"
            );

            button.disabled =
                true;

        }
    );


    const correctButton =
        [
            ...buttons
        ].find(
            button =>
                button.dataset.correct ===
                "true"
        );


    if (
        selected.dataset.correct ===
        "true"
    ) {

        score++;


        selected.classList.add(
            "correct-answer"
        );


        message.textContent =
            "✓ Correct!";


        message.classList.add(
            "correct-text"
        );

    }

    else {

        selected.classList.add(
            "wrong-answer"
        );


        correctButton.classList.add(
            "correct-answer"
        );


        message.textContent =
            "✕ Wrong!";


        message.classList.add(
            "wrong-text"
        );

    }


    explanation.textContent =
        current.explanation;


    nextBtn.classList.remove(
        "hidden"
    );


    if (
        currentQuestion ===
        TOTAL_QUESTIONS - 1
    ) {

        nextBtn.textContent =
            "Finish";

    }

    else {

        nextBtn.textContent =
            "Next Question →";

    }

}


/* ==========================================================
   NEXT QUESTION
========================================================== */

nextBtn.addEventListener(
    "click",
    () => {

        currentQuestion++;


        if (
            currentQuestion >=
            TOTAL_QUESTIONS
        ) {

            showResults();

        }

        else {

            loadQuestion();

        }

    }
);


/* ==========================================================
   SHOW RESULTS
========================================================== */

function showResults() {

    gameScreen.classList.add(
        "hidden"
    );


    resultScreen.classList.remove(
        "hidden"
    );


    scoreText.textContent =
        `${score} / ${TOTAL_QUESTIONS}`;


    if (
        score ===
        TOTAL_QUESTIONS
    ) {

        performance.textContent =
            "Perfect! 👕";

    }

    else if (
        score >= 16
    ) {

        performance.textContent =
            "Excellent!";

    }

    else if (
        score >= 12
    ) {

        performance.textContent =
            "Good Job!";

    }

    else {

        performance.textContent =
            "Keep Practicing!";

    }


    /* ======================================================
       ANALYTICS — GAME COMPLETE
    ====================================================== */

    if (
        typeof trackGameComplete ===
        "function"
    ) {

        trackGameComplete(
            "Clothes - Game 2",
            score,
            TOTAL_QUESTIONS
        );

    }

}


/* ==========================================================
   PLAY AGAIN
========================================================== */

playAgain.addEventListener(
    "click",
    startGame
);


/* ==========================================================
   INITIALIZE
========================================================== */

/* =========================================================
   INITIALIZE
========================================================= */

window.trackGameStart(
    "Clothes - Game 2"
);

startGame();

</script>
