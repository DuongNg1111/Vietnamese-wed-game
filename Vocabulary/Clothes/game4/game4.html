<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Clothes Matching</title>

<meta
    name="game-title"
    content="Clothes Matching"
>

<meta
    name="game-description"
    content="Look at the picture and choose the correct Vietnamese clothing word."
>

<meta
    name="game-icon"
    content="👕"
>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap"
    rel="stylesheet"
>


<style>

/* ==========================================================
   DESIGN TOKENS
========================================================== */

:root {

    --paper:
        #FDF7F0;

    --f5f5f5:
        #ffffff;

    --ink:
        #3f352d;

    --ink-soft:
        #756a61;

    --accent:
        #B8885B;

    --accent-dark:
        #8E653E;

    --accent-light:
        #fbf1e6;

    --accent-bg:
        #FDF7F0;

    --accent-border:
        #ecdab6;

    --general-border:
        #d9d9d9;

    --correct:
        #019b3f;

    --correct-light:
        #eaf3ff;

    --wrong:
        #d9536f;

    --wrong-light:
        #fff0f3;

}


/* ==========================================================
   RESET
========================================================== */

* {

    box-sizing:
        border-box;

    margin:
        0;

    padding:
        0;

}


/* ==========================================================
   BODY
========================================================== */

body {

    min-height: 100vh;

    padding: 28px 20px 45px;

    font-family: Calibri, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

    color: var(--ink);

    display:flex;

    justify-content:center;

    align-items:center;

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            var(--accent-bg) 48%,
            var(--accent-light) 100%
        );

}
/* ==========================================================
   PAGE
========================================================== */

.page {

    width:
        min(
            900px,
            100%
        );

    margin:
        0 auto;

}


/* ==========================================================
   BACK BUTTON
========================================================== */

.back-btn-container {

    margin-bottom:
        18px;

}


.back-btn {

    display:
        inline-flex;

    align-items:
        center;

    gap:
        7px;

    padding:
        9px 17px;

    border:
        1px solid
        var(--accent-border);

    border-radius:
        999px;

    background:
        var(--white);

    color:
        var(--accent-dark);

    text-decoration:
        none;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:
        1.05rem;

    font-weight:
        700;

    box-shadow:
        0 4px 12px
        rgba(
            80,
            65,
            50,
            0.05
        );

    transition:
        0.2s ease;

}


.back-btn:hover {

    transform:
        translateY(-2px);

    border-color:
        var(--accent);

    background:
        var(--accent-light);

    color:
        var(--accent-dark);

}


/* ==========================================================
   CARD
========================================================== */

.card {

    position:
        relative;

    width:
        100%;

    padding:
        42px 48px 45px;

    background:
        #ffffff;

    border:
        1px solid
        var(--general-border);

    border-radius:
        24px;

    box-shadow:
        0 16px 40px
        rgba(
            70,
            60,
            50,
            0.10
        );

    text-align:
        center;

    overflow:
        hidden;

}

/* ==========================================================
   ACCENT LINE
========================================================== */

.card::before {

    content: "";

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 5px;

    background:
        var(--accent);

}

/* ==========================================================
   HEADER
========================================================== */

.game-icon {

    width:
        60px;

    height:
        60px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    margin:
        0 auto 15px;

    border:
        1px solid
        var(--accent-border);

    border-radius:
        16px;

    background:
        var(--accent-light);

    font-size:
        2.15rem;

}


h1 {

    margin:
        0 0 8px;

    color:
        var(--ink);

    font-family:
        Kalam,
        cursive;

    font-size:
        2.65rem;

    font-weight:
        700;

    line-height:
        1.2;

}


.subtitle {

    max-width:
        620px;

    margin:
        0 auto 32px;

    color:
        var(--ink-soft);

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:
        1.18rem;

    line-height:
        1.55;

}


/* ==========================================================
   QUESTION NUMBER
========================================================== */

.question-number {

    margin-bottom:
        17px;

    color:
        var(--accent);

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:
        1.05rem;

    font-weight:
        800;

    letter-spacing:
        0.06em;

    text-transform:
        uppercase;

}


/* ==========================================================
   INSTRUCTION
========================================================== */

.instruction {

    margin-bottom:
        15px;

    color:
        var(--ink-soft);

    font-size:
        1.15rem;

    font-weight:
        600;

}


/* ==========================================================
   IMAGE
========================================================== */

.image-box {

    width:
        min(
            340px,
            100%
        );

    height:
        270px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    margin:
        0 auto 28px;

    padding:
        18px;

    border:
        1px solid
        var(--general-border);

    border-radius:
        20px;

    background:
        var(--accent-bg);

    overflow:
        hidden;

}


.activity-image {

    display:
        block;

    max-width:
        100%;

    max-height:
        100%;

    width:
        auto;

    height:
        auto;

    object-fit:
        contain;

}


/* ==========================================================
   ANSWERS
========================================================== */

.answers {

    display:
        grid;

    grid-template-columns:
        repeat(
            2,
            minmax(
                0,
                1fr
            )
        );

    gap:
        14px;

    max-width:
        700px;

    margin:
        0 auto 22px;

}


.answer-btn {

    min-height:
        66px;

    padding:
        14px 18px;

    border:
        2px solid
        var(--general-border);

    border-radius:
        15px;

    background:
        var(--white);

    color:
        var(--ink);

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:
        1.28rem;

    font-weight:
        700;

    cursor:
        pointer;

    transition:
        0.2s ease;

}


.answer-btn:hover:not(.disabled) {

    transform:
        translateY(-2px);

    border-color:
        var(--accent-border);

    background:
        var(--accent-light);

    color:
        var(--accent-dark);

    box-shadow:
        0 7px 18px
        rgba(
            80,
            60,
            40,
            0.08
        );

}


.answer-btn.disabled {

    cursor:
        default;

}


/* ==========================================================
   CORRECT / WRONG
========================================================== */

.answer-btn.correct {

    border-color:
        var(--correct);

    background:
        var(--correct-light);

    color:
        var(--correct);

}


.answer-btn.wrong {

    border-color:
        var(--wrong);

    background:
        var(--wrong-light);

    color:
        var(--wrong);

}


/* ==========================================================
   MESSAGE
========================================================== */

.message {

    min-height:
        28px;

    margin-bottom:
        13px;

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:
        1.22rem;

    font-weight:
        800;

}


.correct-text {

    color:
        var(--correct);

}


.wrong-text {

    color:
        var(--wrong);

}


/* ==========================================================
   EXPLANATION
========================================================== */

.explanation {

    max-width:
        700px;

    margin:
        0 auto 21px;

    padding:
        15px 18px;

    border:
        1px solid
        var(--general-border);

    border-radius:
        14px;

    background:
        var(--accent-bg);

    color:
        var(--ink-soft);

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:
        1.12rem;

    line-height:
        1.6;

    text-align:
        left;

}


.explanation strong {

    color:
        var(--ink);

}


/* ==========================================================
   ACTION BUTTON
========================================================== */

.action-btn {

    min-width:
        180px;

    padding:
        12px 24px;

    border:
        none;

    border-radius:
        999px;

    background:
        var(--accent);

    color:
        var(--white);

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:
        1.12rem;

    font-weight:
        800;

    cursor:
        pointer;

    box-shadow:
        0 5px 13px
        rgba(
            120,
            85,
            50,
            0.18
        );

    transition:
        0.2s ease;

}


.action-btn:hover {

    background:
        var(--accent-dark);

    transform:
        translateY(-2px);

}


.action-btn:active {

    transform:
        translateY(0);

}


/* ==========================================================
   RESULT
========================================================== */

.result-icon {

    width:
        66px;

    height:
        66px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    margin:
        0 auto 18px;

    border:
        1px solid
        var(--accent-border);

    border-radius:
        18px;

    background:
        var(--accent-light);

    font-size:
        2.3rem;

}


.result-title {

    margin-bottom:
        10px;

}


.score {

    margin:
        20px 0 8px;

    color:
        var(--accent-dark);

    font-family:
        Kalam,
        cursive;

    font-size:
        3.15rem;

    font-weight:
        700;

}


.performance {

    margin-bottom:
        28px;

    color:
        var(--ink-soft);

    font-family:
        Calibri,
        'Segoe UI',
        sans-serif;

    font-size:
        1.25rem;

    font-weight:
        600;

}


/* ==========================================================
   HIDDEN
========================================================== */

.hidden {

    display:
        none !important;

}


/* ==========================================================
   MOBILE
========================================================== */

@media (
    max-width: 700px
) {

    body {

        padding:
            20px 14px 35px;

    }


    .card {

        padding:
            35px 20px 32px;

        border-radius:
            20px;

    }


    h1 {

        font-size:
            2.25rem;

    }


    .subtitle {

        font-size:
            1.08rem;

        margin-bottom:
            27px;

    }


    .image-box {

        height:
            230px;

        margin-bottom:
            24px;

    }


    .answers {

        grid-template-columns:
            1fr;

    }


    .answer-btn {

        min-height:
            60px;

    }

}


/* ==========================================================
   VERY SMALL SCREENS
========================================================== */

@media (
    max-width: 380px
) {

    .card {

        padding:
            32px 16px 28px;

    }


    h1 {

        font-size:
            2.05rem;

    }


    .image-box {

        height:
            210px;

    }


    .answer-btn {

        font-size:
            1.18rem;

    }

}

</style>

</head>


<body>


<div class="page">


    <!-- ======================================================
         BACK
    ======================================================= -->

    <div class="back-btn-container">

        <a
            href="../../../category.html?category=Clothes"
            class="back-btn"
        >
            ← Back
        </a>

    </div>


    <!-- ======================================================
         GAME CARD
    ======================================================= -->

    <main class="card">


        <!-- ==================================================
             HEADER
        =================================================== -->

        <div
            class="game-icon"
            aria-hidden="true"
        >
            👕
        </div>


        <h1>
            Clothes Matching
        </h1>


        <p class="subtitle">
            Look at the picture and choose the correct
            Vietnamese clothing word.
        </p>


        <!-- ==================================================
             GAME SCREEN
        =================================================== -->

        <section id="gameScreen">


            <div
                id="questionNumber"
                class="question-number"
            >
            </div>

            <div class="image-box">

                <img
                    id="activityImage"
                    class="activity-image"
                    src=""
                    alt="Clothing item"
                >

            </div>


            <div
                id="answers"
                class="answers"
            >
            </div>


            <div
                id="message"
                class="message"
                aria-live="polite"
            >
            </div>


            <div
                id="explanation"
                class="explanation hidden"
            >
            </div>


            <button
                id="nextBtn"
                class="action-btn hidden"
                type="button"
            >
            </button>


        </section>


        <!-- ==================================================
             RESULT SCREEN
        =================================================== -->

        <section
            id="resultScreen"
            class="hidden"
        >


            <div
                class="result-icon"
                aria-hidden="true"
            >
                🎉
            </div>


            <h1 class="result-title">
                Great Job!
            </h1>


            <div
                id="scoreText"
                class="score"
            >
            </div>


            <div
                id="performance"
                class="performance"
            >
            </div>


            <button
                id="playAgain"
                class="action-btn"
                type="button"
            >
                Play Again
            </button>


        </section>


    </main>

</div>


<script>

/* ==========================================================
   CLOTHES
========================================================== */

const CLOTHES = [

    {
        text:
            "áo đầm",

        english:
            "dress",

        image:
            "images/ao-dam.png"
    },

    {
        text:
            "áo khoác",

        english:
            "jacket / coat",

        image:
            "images/ao-khoac.png"
    },

    {
        text:
            "áo sơ mi",

        english:
            "shirt / dress shirt",

        image:
            "images/ao-so-mi.png"
    },

    {
        text:
            "áo thun",

        english:
            "T-shirt",

        image:
            "images/ao-thun.png"
    },

    {
        text:
            "dép",

        english:
            "sandals / slippers",

        image:
            "images/dep.png"
    },

    {
        text:
            "giày",

        english:
            "shoes",

        image:
            "images/giay.png"
    },

    {
        text:
            "nón",

        english:
            "hat / cap",

        image:
            "images/non.png"
    },

    {
        text:
            "quần short",

        english:
            "shorts",

        image:
            "images/quan-short.png"
    },

    {
        text:
            "quần",

        english:
            "pants / trousers",

        image:
            "images/quan.png"
    },

    {
        text:
            "túi",

        english:
            "bag",

        image:
            "images/tui.png"
    },

    {
        text:
            "váy",

        english:
            "skirt",

        image:
            "images/vay.png"
    },

    {
        text:
            "vớ",

        english:
            "socks",

        image:
            "images/vo.png"
    }

];


/* ==========================================================
   GAME SETTINGS
========================================================== */

const TOTAL_QUESTIONS =
    20;


/* ==========================================================
   GAME STATE
========================================================== */

let questions =
    [];

let currentQuestion =
    0;

let score =
    0;

let answered =
    false;


/* ==========================================================
   DOM ELEMENTS
========================================================== */

const questionNumber =
    document.getElementById(
        "questionNumber"
    );


const activityImage =
    document.getElementById(
        "activityImage"
    );


const answers =
    document.getElementById(
        "answers"
    );


const message =
    document.getElementById(
        "message"
    );


const explanation =
    document.getElementById(
        "explanation"
    );


const nextBtn =
    document.getElementById(
        "nextBtn"
    );


const gameScreen =
    document.getElementById(
        "gameScreen"
    );


const resultScreen =
    document.getElementById(
        "resultScreen"
    );


const scoreText =
    document.getElementById(
        "scoreText"
    );


const performance =
    document.getElementById(
        "performance"
    );


const playAgain =
    document.getElementById(
        "playAgain"
    );


/* ==========================================================
   SHUFFLE
========================================================== */

function shuffle(array) {

    const copy =
        [...array];


    for (
        let i = copy.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (
                    i + 1
                )
            );


        [
            copy[i],
            copy[j]
        ] =
        [
            copy[j],
            copy[i]
        ];

    }


    return copy;

}


/* ==========================================================
   GET WRONG ANSWERS
========================================================== */

function getWrongAnswers(
    correct
) {

    const others =
        CLOTHES.filter(
            item =>
                item.text !==
                correct.text
        );


    return shuffle(
        others
    ).slice(
        0,
        3
    );

}


/* ==========================================================
   GENERATE QUESTIONS
========================================================== */

function generateQuestions() {

    questions =
        [];


    for (
        let i = 0;
        i < TOTAL_QUESTIONS;
        i++
    ) {

        const correct =
            CLOTHES[
                Math.floor(
                    Math.random() *
                    CLOTHES.length
                )
            ];


        const wrongAnswers =
            getWrongAnswers(
                correct
            );


        const options =
            shuffle(
                [
                    correct,
                    ...wrongAnswers
                ]
            );


        questions.push({

            correct:
                correct,

            options:
                options

        });

    }

}


/* ==========================================================
   START GAME
========================================================== */

function startGame() {

    generateQuestions();


    currentQuestion =
        0;


    score =
        0;


    gameScreen.classList.remove(
        "hidden"
    );


    resultScreen.classList.add(
        "hidden"
    );


    loadQuestion();

}


/* ==========================================================
   LOAD QUESTION
========================================================== */

function loadQuestion() {

    answered =
        false;


    message.textContent =
        "";

    message.className =
        "message";


    explanation.textContent =
        "";

    explanation.classList.add(
        "hidden"
    );


    nextBtn.classList.add(
        "hidden"
    );


    const question =
        questions[
            currentQuestion
        ];


    questionNumber.textContent =
        `Question ${
            currentQuestion + 1
        } / ${
            TOTAL_QUESTIONS
        }`;


    activityImage.src =
        question.correct.image;


    activityImage.alt =
        question.correct.english;


    answers.innerHTML =
        "";


    question.options.forEach(
        option => {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "answer-btn";


            button.textContent =
                option.text;


            button.addEventListener(
                "click",
                () =>
                    handleAnswer(
                        button,
                        option,
                        question
                    )
            );


            answers.appendChild(
                button
            );

        }
    );

}


/* ==========================================================
   HANDLE ANSWER
========================================================== */

function handleAnswer(
    selected,
    selectedOption,
    question
) {

    if (
        answered
    ) {

        return;

    }


    answered =
        true;


    const buttons =
        document.querySelectorAll(
            ".answer-btn"
        );


    buttons.forEach(
        button => {

            button.classList.add(
                "disabled"
            );

            button.disabled =
                true;

        }
    );


    const correctButton =
        [
            ...buttons
        ].find(
            button =>
                button.textContent ===
                question.correct.text
        );


    if (
        selectedOption.text ===
        question.correct.text
    ) {

        score++;


        selected.classList.add(
            "correct"
        );


        message.textContent =
            "✓ Correct!";


        message.classList.add(
            "correct-text"
        );

    }

    else {

        selected.classList.add(
            "wrong"
        );


        correctButton.classList.add(
            "correct"
        );


        message.textContent =
            "✕ Wrong!";


        message.classList.add(
            "wrong-text"
        );

    }


    explanation.innerHTML =
        `<strong>Explanation:</strong> ${
            question.correct.text
        } means “${
            question.correct.english
        }.” This is the clothing item shown in the picture.`;


    explanation.classList.remove(
        "hidden"
    );


    nextBtn.classList.remove(
        "hidden"
    );


    if (
        currentQuestion ===
        TOTAL_QUESTIONS - 1
    ) {

        nextBtn.textContent =
            "Finish";

    }

    else {

        nextBtn.textContent =
            "Next Question →";

    }

}


/* ==========================================================
   NEXT QUESTION
========================================================== */

nextBtn.addEventListener(
    "click",
    () => {

        currentQuestion++;


        if (
            currentQuestion >=
            TOTAL_QUESTIONS
        ) {

            showResults();

        }

        else {

            loadQuestion();

        }

    }
);


/* ==========================================================
   SHOW RESULTS
========================================================== */

function showResults() {

    gameScreen.classList.add(
        "hidden"
    );


    resultScreen.classList.remove(
        "hidden"
    );


    scoreText.textContent =
        `${score} / ${TOTAL_QUESTIONS}`;


    if (
        score ===
        TOTAL_QUESTIONS
    ) {

        performance.textContent =
            "Perfect! 👕";

    }

    else if (
        score >= 16
    ) {

        performance.textContent =
            "Excellent!";

    }

    else if (
        score >= 12
    ) {

        performance.textContent =
            "Good Job!";

    }

    else {

        performance.textContent =
            "Keep Practicing!";

    }

}


/* ==========================================================
   PLAY AGAIN
========================================================== */

playAgain.addEventListener(
    "click",
    startGame
);


/* ==========================================================
   INITIALIZE
========================================================== */

startGame();

</script>


</body>

</html>
