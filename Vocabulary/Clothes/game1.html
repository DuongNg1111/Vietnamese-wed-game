<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Vietnamese Clothes Quiz</title>

<meta
name="game-title"
content="Vietnamese Clothes Quiz"
>

<meta
name="game-description"
content="Look at the English clothes word and choose the correct Vietnamese word."
>

<meta
name="game-icon"
content="👕"
>

<meta
name="game-explanation"
content="Choose the Vietnamese word that matches the English clothes word. Each question can only be answered once."
>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap"
    rel="stylesheet"
>

<style>

/* ==========================================================
   DESIGN TOKENS
========================================================== */

:root {

    --paper:
        #FDF7F0;

    --f5f5f5:
        #ffffff;

    --ink:
        #3f352d;

    --ink-soft:
        #756a61;

    --accent:
        #B8885B;

    --accent-dark:
        #8E653E;

    --accent-light:
        #fbf1e6;

    --accent-bg:
        #FDF7F0;

    --accent-border:
        #ecdab6;

    --general-border:
        #d9d9d9;

    --correct:
        #019b3f;

    --correct-light:
        #eaf3ff;

    --wrong:
        #d9536f;

    --wrong-light:
        #fff0f3;

}


/* ==========================================================
   RESET
========================================================== */

* {

    box-sizing:
        border-box;

    margin:
        0;

    padding:
        0;

}


/* ==========================================================
   BODY
========================================================== */

body {

    min-height: 100vh;

    padding: 28px 20px 45px;

    font-family: Calibri, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

    color: var(--ink);

    display:flex;

    justify-content:center;

    align-items:center;

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            var(--accent-bg) 48%,
            var(--accent-light) 100%
        );

}
/* ==========================================================
   PAGE
========================================================== */

.page {

    width:
        min(
            900px,
            100%
        );

    margin:
        0 auto;

}


/* ==========================================================
   BACK BUTTON
========================================================== */

.back-btn-container {

    margin-bottom:
        18px;

}


.back-btn {

    display:
        inline-flex;

    align-items:
        center;

    gap:
        7px;

    padding:
        9px 16px;

    border:
        1px solid
        var(--accent-border);

    border-radius:
        999px;

    background:
        #ffffff;

    color:
        var(--accent-dark);

    text-decoration:
        none;

    font-size:
        1.195rem;

    font-weight:
        700;

    box-shadow:
        0 4px 14px
        rgba(
            80,
            60,
            40,
            0.08
        );

    transition:
        0.2s ease;

}


.back-btn:hover {

    transform:
        translateY(-2px);

    background:
        var(--accent);

    border-color:
        var(--accent);

    color:
        #ffffff;

}


/* ==========================================================
   CARD
========================================================== */

.card {

    position:
        relative;

    width:
        100%;

    padding:
        42px;

    background:
        #ffffff;

    border:
        1px solid
        var(--general-border);

    border-radius:
        24px;

    box-shadow:
        0 18px 50px
        rgba(
            70,
            55,
            40,
            0.12
        );

    text-align:
        center;

    overflow:
        hidden;

}


/* ==========================================================
   ACCENT LINE
========================================================== */

.card::before {

    content:
        "";

    position:
        absolute;

    top:
        0;

    left:
        0;

    width:
        100%;

    height:
        5px;

    background:
        var(--accent);

}


/* ==========================================================
   HEADER
========================================================== */

.game-icon {

    width:
        58px;

    height:
        58px;

    display:
        none;

}


h1 {

    margin:
        0 0 9px;

    color:
        var(--ink);

    font-family:
        Kalam,
        cursive;

    font-size:
        2.55rem;

    font-weight:
        700;

    line-height:
        1.25;

}


.subtitle {

    max-width:
        560px;

    margin:
        0 auto 30px;

    color:
        var(--ink-soft);

    font-size:
        1.275rem;

    line-height:
        1.55;

}


/* ==========================================================
   QUESTION
========================================================== */

.question-number {

    margin-bottom:
        18px;

    color:
        var(--accent);

    font-size:
        1.155rem;

    font-weight:
        800;

    letter-spacing:
        0.05em;

    text-transform:
        uppercase;

}


.choose-text {

    margin-bottom:
        8px;

    color:
        var(--ink-soft);

    font-size:
        1.255rem;

    font-weight:
        600;

}


.english-word {

    margin-bottom:
        30px;

    color:
        var(--accent-dark);

    font-size:
        2.625rem;

    font-weight:
        800;

    line-height:
        1.25;

}


/* ==========================================================
   ANSWERS
========================================================== */

.answers {

    display:
        grid;

    grid-template-columns:
        repeat(
            2,
            minmax(
                0,
                1fr
            )
        );

    gap:
        16px;

    max-width:
        620px;

    margin:
        0 auto 24px;

}


.answer-btn {

    min-height:
        76px;

    padding:
        15px 18px;

    border:
        2px solid
        var(--general-border);

    border-radius:
        16px;

    background:
        #ffffff;

    color:
        var(--ink);

    font-family:
        inherit;

    font-size:
        1.425rem;

    font-weight:
        700;

    cursor:
        pointer;

    transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;

}


.answer-btn:hover:not(.disabled) {

    transform:
        translateY(-3px);

    border-color:
        var(--accent);

    background:
        var(--accent-light);

    box-shadow:
        0 8px 18px
        rgba(
            80,
            60,
            40,
            0.08
        );

}


.answer-btn.disabled {

    cursor:
        default;

}


/* ==========================================================
   CORRECT / WRONG
========================================================== */

.answer-btn.correct {

    border-color:
        var(--correct);

    background:
        var(--correct-light);

    color:
        var(--correct);

}


.answer-btn.wrong {

    border-color:
        var(--wrong);

    background:
        var(--wrong-light);

    color:
        var(--wrong);

}


/* ==========================================================
   FEEDBACK
========================================================== */

.message {

    min-height:
        32px;

    margin-bottom:
        8px;

    font-size:
        1.325rem;

    font-weight:
        800;

}


.correct-text {

    color:
        var(--correct);

}


.wrong-text {

    color:
        var(--wrong);

}


/* ==========================================================
   EXPLANATION
========================================================== */

.explanation {

    min-height:
        28px;

    max-width:
        620px;

    margin:
        0 auto 20px;

    padding:
        15px 18px;

    border:
        1px solid
        var(--accent-border);

    border-radius:
        14px;

    background:
        var(--accent-bg);

    color:
        var(--ink-soft);

    font-size:
        1.235rem;

    line-height:
        1.55;

    text-align:
        left;

}


/* ==========================================================
   ACTION BUTTON
========================================================== */

.action-btn {

    min-width:
        170px;

    padding:
        12px 22px;

    border:
        none;

    border-radius:
        999px;

    background:
        var(--accent);

    color:
        #ffffff;

    font-family:
        inherit;

    font-size:
        1.235rem;

    font-weight:
        800;

    cursor:
        pointer;

    box-shadow:
        inset 0 -3px 0
        rgba(
            0,
            0,
            0,
            0.12
        ),
        0 5px 12px
        rgba(
            120,
            80,
            40,
            0.16
        );

    transition:
        0.2s ease;

}


.action-btn:hover {

    background:
        var(--accent-dark);

    transform:
        translateY(-2px);

}


.action-btn:active {

    transform:
        translateY(0);

}


/* ==========================================================
   RESULT
========================================================== */

.result-icon {

    width:
        64px;

    height:
        64px;

    display:
        none;

}


.result-title {

    margin-bottom:
        10px;

}


.score {

    margin:
        20px 0 8px;

    color:
        var(--accent);

    font-size:
        2.975rem;

    font-weight:
        800;

}


.performance {

    margin-bottom:
        28px;

    color:
        var(--ink-soft);

    font-size:
        1.375rem;

    font-weight:
        600;

}


/* ==========================================================
   HIDDEN
========================================================== */

.hidden {

    display:
        none !important;

}


/* ==========================================================
   MOBILE
========================================================== */

@media (
    max-width: 600px
) {

    body {

        padding:
            18px 14px 35px;

    }


    .card {

        padding:
            34px 20px 28px;

        border-radius:
            20px;

    }


    h1 {

        font-size:
            2.15rem;

    }


    .subtitle {

        font-size:
            1.215rem;

        margin-bottom:
            25px;

    }


    .english-word {

        font-size:
            2.375rem;

        margin-bottom:
            24px;

    }


    .answers {

        grid-template-columns:
            1fr;

        gap:
            12px;

    }


    .answer-btn {

        min-height:
            68px;

    }


    .explanation {

        font-size:
            1.15rem;

    }

}

</style>

</head>

<body>

<div class="page">


<!-- ======================================================
     BACK
======================================================= -->

<div class="back-btn-container">

    <a
        href="../../category.html?category=Clothes"
        class="back-btn"
    >
        ← Back
    </a>

</div>


<!-- ======================================================
     GAME CARD
======================================================= -->

<main class="card">


    <!-- ==================================================
         HEADER
    =================================================== -->

    <div
        class="game-icon"
        aria-hidden="true"
    >
        👕
    </div>


    <h1>
        Vietnamese Clothes Quiz
    </h1>


    <p class="subtitle">
        Look at the English word and choose
        the correct Vietnamese word.
    </p>


    <!-- ==================================================
         GAME SCREEN
    =================================================== -->

    <section id="gameScreen">


        <div
            id="questionNumber"
            class="question-number"
        >
        </div>



        <div
            id="englishWord"
            class="english-word"
        >
        </div>


        <div
            id="answers"
            class="answers"
        >
        </div>


        <div
            id="message"
            class="message"
            aria-live="polite"
        >
        </div>


        <div
            id="explanation"
            class="explanation"
            aria-live="polite"
        >
        </div>


        <button
            id="nextBtn"
            class="action-btn hidden"
            type="button"
        >
        </button>


    </section>


    <!-- ==================================================
         RESULT SCREEN
    =================================================== -->

    <section
        id="resultScreen"
        class="hidden"
    >


        <div
            class="result-icon"
            aria-hidden="true"
        >
            🎉
        </div>


        <h1 class="result-title">
            Great Job!
        </h1>


        <div
            id="scoreText"
            class="score"
        >
        </div>


        <div
            id="performance"
            class="performance"
        >
        </div>


        <button
            id="playAgain"
            class="action-btn"
            type="button"
        >
            Play Again
        </button>


    </section>


</main>


</div>

<script>

/* ==========================================================
   VOCABULARY
========================================================== */

const CLOTHES = [

    {
        vietnamese:
            "áo",

        english:
            "shirt / top"
    },

    {
        vietnamese:
            "quần",

        english:
            "pants / trousers"
    },

    {
        vietnamese:
            "váy",

        english:
            "skirt"
    },

    {
        vietnamese:
            "áo đầm",

        english:
            "dress"
    },

    {
        vietnamese:
            "áo thun",

        english:
            "T-shirt"
    },

    {
        vietnamese:
            "áo sơ mi",

        english:
            "shirt / dress shirt"
    },

    {
        vietnamese:
            "áo khoác",

        english:
            "jacket / coat"
    },

    {
        vietnamese:
            "quần jean",

        english:
            "jeans"
    },

    {
        vietnamese:
            "quần short",

        english:
            "shorts"
    },

    {
        vietnamese:
            "giày",

        english:
            "shoes"
    },

    {
        vietnamese:
            "dép",

        english:
            "sandals / slippers / flip-flops"
    },

    {
        vietnamese:
            "vớ",

        english:
            "socks"
    },

    {
        vietnamese:
            "nón",

        english:
            "hat / cap"
    },

    {
        vietnamese:
            "túi",

        english:
            "bag"
    },

    {
        vietnamese:
            "mặc",

        english:
            "to wear / to put on"
    }

];


/* ==========================================================
   GAME SETTINGS
========================================================== */

const TOTAL_QUESTIONS =
    20;


/* ==========================================================
   GAME STATE
========================================================== */

let questions =
    [];

let currentQuestion =
    0;

let score =
    0;

let answered =
    false;


/* ==========================================================
   DOM ELEMENTS
========================================================== */

const questionNumber =
    document.getElementById(
        "questionNumber"
    );


const englishWord =
    document.getElementById(
        "englishWord"
    );


const answers =
    document.getElementById(
        "answers"
    );


const message =
    document.getElementById(
        "message"
    );


const explanation =
    document.getElementById(
        "explanation"
    );


const nextBtn =
    document.getElementById(
        "nextBtn"
    );


const gameScreen =
    document.getElementById(
        "gameScreen"
    );


const resultScreen =
    document.getElementById(
        "resultScreen"
    );


const scoreText =
    document.getElementById(
        "scoreText"
    );


const performance =
    document.getElementById(
        "performance"
    );


const playAgain =
    document.getElementById(
        "playAgain"
    );


/* ==========================================================
   SHUFFLE
========================================================== */

function shuffle(array) {

    const copy =
        [...array];


    for (
        let i = copy.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            copy[i],
            copy[j]
        ] =
        [
            copy[j],
            copy[i]
        ];

    }


    return copy;

}


/* ==========================================================
   RANDOM INDEX
========================================================== */

function randomIndex(max) {

    return Math.floor(
        Math.random() * max
    );

}


/* ==========================================================
   GENERATE QUESTIONS
========================================================== */

function generateQuestions() {

    questions =
        [];


    /*
     * Shuffle the vocabulary first so that
     * the 20 questions are varied.
     */

    const pool =
        shuffle(
            CLOTHES
        );


    for (
        let i = 0;
        i < TOTAL_QUESTIONS;
        i++
    ) {

        const correct =
            pool[
                i %
                pool.length
            ];


        let wrong;


        do {

            wrong =
                CLOTHES[
                    randomIndex(
                        CLOTHES.length
                    )
                ];

        }

        while (
            wrong.vietnamese ===
            correct.vietnamese
        );


        const options =
            shuffle(
                [
                    correct.vietnamese,
                    wrong.vietnamese
                ]
            );


        questions.push({

            correct:
                correct,

            options:
                options

        });

    }

}


/* ==========================================================
   START GAME
========================================================== */

function startGame() {

    generateQuestions();


    currentQuestion =
        0;


    score =
        0;


    gameScreen.classList.remove(
        "hidden"
    );


    resultScreen.classList.add(
        "hidden"
    );


    loadQuestion();

}


/* ==========================================================
   LOAD QUESTION
========================================================== */

function loadQuestion() {

    answered =
        false;


    message.textContent =
        "";


    message.className =
        "message";


    explanation.textContent =
        "";


    nextBtn.classList.add(
        "hidden"
    );


    const question =
        questions[
            currentQuestion
        ];


    questionNumber.textContent =
        `Question ${
            currentQuestion + 1
        } / ${
            TOTAL_QUESTIONS
        }`;


    englishWord.textContent =
        question.correct.english;


    answers.innerHTML =
        "";


    question.options.forEach(
        option => {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "answer-btn";


            button.textContent =
                option;


            button.addEventListener(
                "click",
                () =>
                    handleAnswer(
                        button,
                        question
                    )
            );


            answers.appendChild(
                button
            );

        }
    );

}


/* ==========================================================
   HANDLE ANSWER
========================================================== */

function handleAnswer(
    selected,
    question
) {

    if (
        answered
    ) {

        return;

    }


    answered =
        true;


    const buttons =
        document.querySelectorAll(
            ".answer-btn"
        );


    /*
     * Lock every answer.
     */

    buttons.forEach(
        button => {

            button.classList.add(
                "disabled"
            );


            button.disabled =
                true;

        }
    );


    const correctAnswer =
        question.correct.vietnamese;


    const isCorrect =
        selected.textContent ===
        correctAnswer;


    const correctButton =
        [
            ...buttons
        ].find(
            button =>
                button.textContent ===
                correctAnswer
        );


    /*
     * Correct answer.
     */

    if (
        isCorrect
    ) {

        score++;


        selected.classList.add(
            "correct"
        );


        message.textContent =
            "✓ Correct!";


        message.classList.add(
            "correct-text"
        );

    }


    /*
     * Wrong answer.
     */

    else {

        selected.classList.add(
            "wrong"
        );


        correctButton.classList.add(
            "correct"
        );


        message.textContent =
            "✕ Wrong!";


        message.classList.add(
            "wrong-text"
        );

    }


    /*
     * Explanation appears after every answer.
     */

    explanation.textContent =
        `"${correctAnswer}" means "${question.correct.english}."`;


    nextBtn.classList.remove(
        "hidden"
    );


    if (
        currentQuestion ===
        TOTAL_QUESTIONS - 1
    ) {

        nextBtn.textContent =
            "Finish";

    }

    else {

        nextBtn.textContent =
            "Next Question →";

    }

}


/* ==========================================================
   NEXT QUESTION
========================================================== */

nextBtn.addEventListener(
    "click",
    () => {

        currentQuestion++;


        if (
            currentQuestion >=
            TOTAL_QUESTIONS
        ) {

            showResults();

        }

        else {

            loadQuestion();

        }

    }
);


/* ==========================================================
   SHOW RESULTS
========================================================== */

function showResults() {

    gameScreen.classList.add(
        "hidden"
    );


    resultScreen.classList.remove(
        "hidden"
    );


    scoreText.textContent =
        `${score} / ${TOTAL_QUESTIONS}`;


    if (
        score ===
        TOTAL_QUESTIONS
    ) {

        performance.textContent =
            "Perfect! 👕";

    }

    else if (
        score >= 16
    ) {

        performance.textContent =
            "Excellent!";

    }

    else if (
        score >= 12
    ) {

        performance.textContent =
            "Good Job!";

    }

    else {

        performance.textContent =
            "Keep Practicing!";

    }

}


/* ==========================================================
   PLAY AGAIN
========================================================== */

playAgain.addEventListener(
    "click",
    startGame
);


/* ==========================================================
   INITIALIZE
========================================================== */

startGame();

</script>

</body>

</html>
