<style>

/* ==========================================================
   DESIGN TOKENS
========================================================== */

:root {

    --accent:
        #2878df;

    --accent-dark:
        #1e5fba;

    --accent-light:
        #eaf3ff;

    --accent-border:
        #c4daf6;

    --general-border:
        #d9e6f2;

    --correct:
        #2878df;

    --correct-light:
        #eaf3ff;

    --wrong:
        #d9536f;

    --wrong-light:
        #fff0f3;

    --ink:
        #18324f;

    --ink-soft:
        #6b8198;

    --white:
        #ffffff;

    --background:
        #f7fbff;

}


/* ==========================================================
   RESET
========================================================== */

* {

    box-sizing:
        border-box;

    margin:
        0;

    padding:
        0;

}


/* ==========================================================
   BODY
========================================================== */

body {

    min-height:
        100vh;

    padding:
        28px 20px 50px;

    font-family:
        Calibri,
        'Segoe UI',
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    color:
        var(--ink);

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #f7fbff 55%,
            #eef6fc 100%
        );

}


/* ==========================================================
   PAGE
========================================================== */

.page {

    width:
        min(
            900px,
            100%
        );

    margin:
        0 auto;

}


/* ==========================================================
   BACK BUTTON
========================================================== */

.back-btn-container {

    margin-bottom:
        18px;

}


.back-btn {

    display:
        inline-flex;

    align-items:
        center;

    gap:
        7px;

    padding:
        9px 16px;

    border:
        1px solid
        var(--accent-border);

    border-radius:
        999px;

    background:
        rgba(
            255,
            255,
            255,
            0.95
        );

    color:
        var(--accent-dark);

    text-decoration:
        none;

    font-size:
        1.1rem;

    font-weight:
        700;

    box-shadow:
        0 4px 14px
        rgba(
            24,
            50,
            79,
            0.06
        );

    transition:
        0.2s ease;

}


.back-btn:hover {

    transform:
        translateY(-2px);

    background:
        var(--accent);

    border-color:
        var(--accent);

    color:
        white;

}


/* ==========================================================
   CARD
========================================================== */

.card {

    position:
        relative;

    width:
        100%;

    padding:
        42px;

    overflow:
        hidden;

    background:
        rgba(
            255,
            255,
            255,
            0.98
        );

    border:
        1px solid
        var(--general-border);

    border-radius:
        24px;

    box-shadow:
        0 18px 50px
        rgba(
            24,
            50,
            79,
            0.08
        );

    text-align:
        center;

}


/* ==========================================================
   ACCENT LINE
========================================================== */

.card::before {

    content:
        "";

    position:
        absolute;

    top:
        0;

    left:
        0;

    width:
        100%;

    height:
        5px;

    background:
        var(--accent);

}


/* ==========================================================
   HEADER
========================================================== */

.game-icon {

    width:
        58px;

    height:
        58px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    margin:
        0 auto 16px;

    border:
        1px solid
        var(--accent-border);

    border-radius:
        16px;

    background:
        var(--accent-light);

    font-size:
        2.1rem;

}


h1 {

    margin:
        0 0 9px;

    color:
        var(--ink);

    font-family:
        Kalam,
        cursive;

    font-size:
        2.55rem;

    font-weight:
        700;

    line-height:
        1.25;

}


.subtitle {

    max-width:
        620px;

    margin:
        0 auto 32px;

    color:
        var(--ink-soft);

    font-size:
        1.2rem;

    line-height:
        1.55;

}


/* ==========================================================
   QUESTION
========================================================== */

.question-number {

    margin-bottom:
        18px;

    color:
        var(--accent);

    font-size:
        1.05rem;

    font-weight:
        800;

    letter-spacing:
        0.05em;

    text-transform:
        uppercase;

}


.choose-text {

    margin-bottom:
        10px;

    color:
        var(--ink-soft);

    font-size:
        1.12rem;

    font-weight:
        600;

}


.sentence {

    max-width:
        720px;

    min-height:
        105px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    margin:
        0 auto 28px;

    padding:
        22px 28px;

    border:
        1px solid
        var(--accent-border);

    border-radius:
        18px;

    background:
        var(--accent-light);

    color:
        var(--ink);

    font-size:
        1.5rem;

    font-weight:
        700;

    line-height:
        1.5;

}


/* ==========================================================
   ANSWERS
========================================================== */

.answers {

    display:
        grid;

    grid-template-columns:
        repeat(
            2,
            minmax(
                0,
                1fr
            )
        );

    gap:
        16px;

    max-width:
        720px;

    margin:
        0 auto 24px;

}


.answer-btn {

    min-height:
        72px;

    padding:
        16px 20px;

    border:
        2px solid
        var(--general-border);

    border-radius:
        16px;

    background:
        var(--white);

    color:
        var(--ink);

    font-family:
        inherit;

    font-size:
        1.3rem;

    font-weight:
        800;

    cursor:
        pointer;

    transition:
        0.2s ease;

}


.answer-btn:hover:not(.disabled) {

    transform:
        translateY(-3px);

    border-color:
        var(--accent);

    background:
        var(--accent-light);

    box-shadow:
        0 8px 20px
        rgba(
            40,
            120,
            223,
            0.12
        );

}


.answer-btn.disabled {

    cursor:
        default;

}


/* ==========================================================
   ANSWER STATES
========================================================== */

.correct-answer {

    border-color:
        var(--correct) !important;

    background:
        var(--correct-light) !important;

    color:
        var(--correct) !important;

}


.wrong-answer {

    border-color:
        var(--wrong) !important;

    background:
        var(--wrong-light) !important;

    color:
        var(--wrong) !important;

}


/* ==========================================================
   FEEDBACK
========================================================== */

.message {

    min-height:
        30px;

    margin-bottom:
        8px;

    font-size:
        1.2rem;

    font-weight:
        800;

}


.correct-text {

    color:
        var(--correct);

}


.wrong-text {

    color:
        var(--wrong);

}


.explanation {

    min-height:
        30px;

    max-width:
        720px;

    margin:
        0 auto 20px;

    color:
        var(--ink-soft);

    font-size:
        1.12rem;

    line-height:
        1.55;

}


/* ==========================================================
   ACTION BUTTON
========================================================== */

.action-btn {

    min-width:
        180px;

    padding:
        12px 22px;

    border:
        none;

    border-radius:
        999px;

    background:
        var(--accent);

    color:
        white;

    font-family:
        inherit;

    font-size:
        1.12rem;

    font-weight:
        800;

    cursor:
        pointer;

    box-shadow:
        inset 0 -3px 0
        rgba(
            0,
            0,
            0,
            0.12
        ),
        0 5px 12px
        rgba(
            40,
            120,
            223,
            0.18
        );

    transition:
        0.2s ease;

}


.action-btn:hover {

    background:
        var(--accent-dark);

    transform:
        translateY(-2px);

}


.action-btn:active {

    transform:
        translateY(0);

}


/* ==========================================================
   RESULT SCREEN
========================================================== */

.result-icon {

    width:
        64px;

    height:
        64px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    margin:
        0 auto 18px;

    border:
        1px solid
        var(--accent-border);

    border-radius:
        18px;

    background:
        var(--accent-light);

    font-size:
        2.3rem;

}


.result-title {

    margin-bottom:
        10px;

}


.score {

    margin:
        20px 0 8px;

    color:
        var(--accent);

    font-size:
        2.8rem;

    font-weight:
        800;

}


.performance {

    margin-bottom:
        28px;

    color:
        var(--ink-soft);

    font-size:
        1.2rem;

    font-weight:
        600;

}


/* ==========================================================
   HIDDEN
========================================================== */

.hidden {

    display:
        none !important;

}


/* ==========================================================
   MOBILE
========================================================== */

@media (
    max-width: 600px
) {

    body {

        padding:
            18px 14px 35px;

    }


    .card {

        padding:
            32px 20px;

        border-radius:
            20px;

    }


    h1 {

        font-size:
            2.15rem;

    }


    .subtitle {

        font-size:
            1.08rem;

        margin-bottom:
            25px;

    }


    .sentence {

        min-height:
            90px;

        padding:
            18px;

        font-size:
            1.3rem;

    }


    .answers {

        grid-template-columns:
            1fr;

    }


    .answer-btn {

        min-height:
            64px;

    }

}


/* ==========================================================
   VERY SMALL SCREENS
========================================================== */

@media (
    max-width: 380px
) {

    .card {

        padding:
            28px 16px;

    }


    h1 {

        font-size:
            2rem;

    }


    .sentence {

        font-size:
            1.22rem;

    }


    .answer-btn {

        font-size:
            1.22rem;

    }

}

</style>

</head>

<body>

<div class="page">

<!-- ======================================================
     BACK
======================================================= -->

<div class="back-btn-container">

    <a
        href="../../category.html?category=Clothes"
        class="back-btn"
    >
        ← Back
    </a>

</div>


<!-- ======================================================
     GAME CARD
======================================================= -->

<main class="card">


    <!-- ==================================================
         HEADER
    =================================================== -->

    <div
        class="game-icon"
        aria-hidden="true"
    >
        👕
    </div>


    <h1>
        Complete the Sentence
    </h1>


    <p class="subtitle">
        Choose the Vietnamese clothing word that
        best completes the sentence.
    </p>


    <!-- ==================================================
         GAME SCREEN
    =================================================== -->

    <section id="gameScreen">


        <div
            id="questionNumber"
            class="question-number"
        >
        </div>


        <div class="choose-text">
            Choose the best answer:
        </div>


        <div
            id="sentence"
            class="sentence"
        >
        </div>


        <div
            id="answers"
            class="answers"
        >
        </div>


        <div
            id="message"
            class="message"
            aria-live="polite"
        >
        </div>


        <div
            id="explanation"
            class="explanation"
        >
        </div>


        <button
            id="nextBtn"
            class="action-btn hidden"
            type="button"
        >
        </button>


    </section>


    <!-- ==================================================
         RESULT SCREEN
    =================================================== -->

    <section
        id="resultScreen"
        class="hidden"
    >


        <div
            class="result-icon"
            aria-hidden="true"
        >
            🎉
        </div>


        <h1 class="result-title">
            Great Job!
        </h1>


        <div
            id="scoreText"
            class="score"
        >
        </div>


        <div
            id="performance"
            class="performance"
        >
        </div>


        <button
            id="playAgain"
            class="action-btn"
            type="button"
        >
            Play Again
        </button>


    </section>


</main>


</div>

<script>

/* ==========================================================
   QUESTIONS
========================================================== */

const QUESTIONS = [

    {
        sentence:
            "I wear ___ on my feet when I go outside.",

        correct:
            "giày",

        wrong:
            "nón",

        explanation:
            "Giày means “shoes.” You wear shoes on your feet."
    },

    {
        sentence:
            "I wear ___ on my head when it is sunny.",

        correct:
            "nón",

        wrong:
            "vớ",

        explanation:
            "Nón means “hat / cap.” You wear a hat on your head."
    },

    {
        sentence:
            "I wear ___ inside my shoes.",

        correct:
            "vớ",

        wrong:
            "túi",

        explanation:
            "Vớ means “socks.” Socks are worn inside shoes."
    },

    {
        sentence:
            "I wear ___ when the weather is cold.",

        correct:
            "áo khoác",

        wrong:
            "quần short",

        explanation:
            "Áo khoác means “jacket / coat.” You wear it when it is cold."
    },

    {
        sentence:
            "I wear ___ when I want to wear denim pants.",

        correct:
            "quần jean",

        wrong:
            "áo thun",

        explanation:
            "Quần jean means “jeans,” which are denim pants."
    },

    {
        sentence:
            "I wear ___ when I want short pants.",

        correct:
            "quần short",

        wrong:
            "áo sơ mi",

        explanation:
            "Quần short means “shorts,” which are short pants."
    },

    {
        sentence:
            "I wear ___ as a casual T-shirt.",

        correct:
            "áo thun",

        wrong:
            "giày",

        explanation:
            "Áo thun means “T-shirt,” a common casual top."
    },

    {
        sentence:
            "I wear ___ for a more formal shirt.",

        correct:
            "áo sơ mi",

        wrong:
            "dép",

        explanation:
            "Áo sơ mi means “shirt / dress shirt.”"
    },

    {
        sentence:
            "She wears ___ as a one-piece dress.",

        correct:
            "áo đầm",

        wrong:
            "quần",

        explanation:
            "Áo đầm means “dress,” which is a one-piece outfit."
    },

    {
        sentence:
            "She wears a ___ instead of pants.",

        correct:
            "váy",

        wrong:
            "áo",

        explanation:
            "Váy means “skirt.” A skirt is worn instead of pants."
    },

    {
        sentence:
            "I wear ___ at home when I do not want to wear shoes.",

        correct:
            "dép",

        wrong:
            "vớ",

        explanation:
            "Dép means “sandals / slippers / flip-flops.”"
    },

    {
        sentence:
            "I carry my books in a ___.",

        correct:
            "túi",

        wrong:
            "giày",

        explanation:
            "Túi means “bag.” A bag can be used to carry books."
    },

    {
        sentence:
            "I ___ a jacket when it is cold.",

        correct:
            "mặc",

        wrong:
            "nón",

        explanation:
            "Mặc means “to wear / to put on.”"
    },

    {
        sentence:
            "He wears ___ with a shirt on his lower body.",

        correct:
            "quần",

        wrong:
            "nón",

        explanation:
            "Quần means “pants / trousers,” worn on the lower body."
    },

    {
        sentence:
            "She wears ___ for a casual summer outfit.",

        correct:
            "áo thun",

        wrong:
            "vớ",

        explanation:
            "Áo thun means “T-shirt,” a casual top often worn in warm weather."
    },

    {
        sentence:
            "He wears ___ with his jeans on his feet.",

        correct:
            "giày",

        wrong:
            "áo đầm",

        explanation:
            "Giày means “shoes,” which are worn on the feet."
    },

    {
        sentence:
            "She wears ___ on her lower body as a skirt.",

        correct:
            "váy",

        wrong:
            "áo khoác",

        explanation:
            "Váy means “skirt,” which is worn on the lower body."
    },

    {
        sentence:
            "I put my clothes on. I ___ my clothes.",

        correct:
            "mặc",

        wrong:
            "túi",

        explanation:
            "Mặc means “to wear / to put on,” so it fits this sentence."
    },

    {
        sentence:
            "He wears ___ when he wants to wear a dress shirt.",

        correct:
            "áo sơ mi",

        wrong:
            "quần short",

        explanation:
            "Áo sơ mi means “shirt / dress shirt.”"
    },

    {
        sentence:
            "She wears ___ when she wants a one-piece outfit.",

        correct:
            "áo đầm",

        wrong:
            "quần jean",

        explanation:
            "Áo đầm means “dress,” which is a one-piece outfit."
    }

];


/* ==========================================================
   SETTINGS
========================================================== */

const TOTAL_QUESTIONS =
    20;


/* ==========================================================
   STATE
========================================================== */

let questions =
    [];

let currentQuestion =
    0;

let score =
    0;

let answered =
    false;


/* ==========================================================
   DOM
========================================================== */

const questionNumber =
    document.getElementById(
        "questionNumber"
    );


const sentence =
    document.getElementById(
        "sentence"
    );


const answers =
    document.getElementById(
        "answers"
    );


const message =
    document.getElementById(
        "message"
    );


const explanation =
    document.getElementById(
        "explanation"
    );


const nextBtn =
    document.getElementById(
        "nextBtn"
    );


const gameScreen =
    document.getElementById(
        "gameScreen"
    );


const resultScreen =
    document.getElementById(
        "resultScreen"
    );


const scoreText =
    document.getElementById(
        "scoreText"
    );


const performance =
    document.getElementById(
        "performance"
    );


const playAgain =
    document.getElementById(
        "playAgain"
    );


/* ==========================================================
   SHUFFLE
========================================================== */

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }


    return array;

}


/* ==========================================================
   GENERATE QUESTIONS
========================================================== */

function generateQuestions() {

    questions =
        QUESTIONS.map(
            item => {

                const options = [

                    {
                        text:
                            item.correct,

                        correct:
                            true
                    },

                    {
                        text:
                            item.wrong,

                        correct:
                            false
                    }

                ];


                shuffle(
                    options
                );


                return {

                    sentence:
                        item.sentence,

                    options:
                        options,

                    explanation:
                        item.explanation

                };

            }
        );

}


/* ==========================================================
   START GAME
========================================================== */

function startGame() {

    generateQuestions();


    currentQuestion =
        0;


    score =
        0;


    gameScreen.classList.remove(
        "hidden"
    );


    resultScreen.classList.add(
        "hidden"
    );


    loadQuestion();

}


/* ==========================================================
   LOAD QUESTION
========================================================== */

function loadQuestion() {

    answered =
        false;


    message.textContent =
        "";

    message.className =
        "message";


    explanation.textContent =
        "";


    nextBtn.classList.add(
        "hidden"
    );


    const current =
        questions[
            currentQuestion
        ];


    questionNumber.textContent =
        `Question ${
            currentQuestion + 1
        } / ${
            TOTAL_QUESTIONS
        }`;


    sentence.textContent =
        current.sentence;


    answers.innerHTML =
        "";


    current.options.forEach(
        option => {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "answer-btn";


            button.textContent =
                option.text;


            button.dataset.correct =
                option.correct;


            button.addEventListener(
                "click",
                () =>
                    handleAnswer(
                        button,
                        current
                    )
            );


            answers.appendChild(
                button
            );

        }
    );

}


/* ==========================================================
   HANDLE ANSWER
========================================================== */

function handleAnswer(
    selected,
    current
) {

    if (
        answered
    ) {

        return;

    }


    answered =
        true;


    const buttons =
        document.querySelectorAll(
            ".answer-btn"
        );


    buttons.forEach(
        button => {

            button.classList.add(
                "disabled"
            );

        }
    );


    const correctButton =
        [
            ...buttons
        ].find(
            button =>
                button.dataset.correct ===
                "true"
        );


    if (
        selected.dataset.correct ===
        "true"
    ) {

        score++;


        selected.classList.add(
            "correct-answer"
        );


        message.textContent =
            "✓ Correct!";


        message.classList.add(
            "correct-text"
        );

    }

    else {

        selected.classList.add(
            "wrong-answer"
        );


        correctButton.classList.add(
            "correct-answer"
        );


        message.textContent =
            "✕ Wrong!";


        message.classList.add(
            "wrong-text"
        );

    }


    explanation.textContent =
        current.explanation;


    nextBtn.classList.remove(
        "hidden"
    );


    if (
        currentQuestion ===
        TOTAL_QUESTIONS - 1
    ) {

        nextBtn.textContent =
            "Finish";

    }

    else {

        nextBtn.textContent =
            "Next Question →";

    }

}


/* ==========================================================
   NEXT QUESTION
========================================================== */

nextBtn.addEventListener(
    "click",
    () => {

        currentQuestion++;


        if (
            currentQuestion >=
            TOTAL_QUESTIONS
        ) {

            showResults();

        }

        else {

            loadQuestion();

        }

    }
);


/* ==========================================================
   RESULTS
========================================================== */

function showResults() {

    gameScreen.classList.add(
        "hidden"
    );


    resultScreen.classList.remove(
        "hidden"
    );


    scoreText.textContent =
        `${score} / ${TOTAL_QUESTIONS}`;


    if (
        score ===
        TOTAL_QUESTIONS
    ) {

        performance.textContent =
            "Perfect! 👕";

    }

    else if (
        score >= 16
    ) {

        performance.textContent =
            "Excellent!";

    }

    else if (
        score >= 12
    ) {

        performance.textContent =
            "Good Job!";

    }

    else {

        performance.textContent =
            "Keep Practicing!";

    }

}


/* ==========================================================
   PLAY AGAIN
========================================================== */

playAgain.addEventListener(
    "click",
    startGame
);


/* ==========================================================
   INITIALIZE
========================================================== */

startGame();

</script>
