    <!-- =====================================================

    ====================================================== -->

    <script>


        /* =====================================================
           CONFIGURATION
        ====================================================== */

        const GAMES_BASE = "GAMES";


        /* =====================================================
           CATEGORY STYLE MAP
        ====================================================== */

        const categoryClasses = {

            "Color":
                "category-color",

            "Describe things":
                "category-describe",

            "Food and Drinks":
                "category-food",

            "Grammar":
                "category-grammar",

            "Health":
                "category-health",

            "Mix Practice":
                "category-mix",

            "Numbers":
                "category-numbers",

            "People & Pronouns":
                "category-pronouns",

            "Places & Locations":
                "category-places"

        };


        /* =====================================================
           LOAD CATEGORIES.JSON
        ====================================================== */

        async function loadCategories() {

            const response =
                await fetch(
                    "categories.json",
                    {
                        cache: "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    `Could not load categories.json (${response.status})`
                );

            }


            return await response.json();

        }


        /* =====================================================
           ESCAPE HTML
        ====================================================== */

        function escapeHtml(value) {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                String(
                    value ?? ""
                );


            return div.innerHTML;

        }


        /* =====================================================
           ENCODE PATH
        ====================================================== */

        function encodePath(path) {

            return path
                .split("/")
                .map(
                    part =>
                        encodeURIComponent(part)
                )
                .join("/");

        }


        /* =====================================================
           CREATE GAME CARD
        ====================================================== */

        function createGameCard(
            game,
            gameNumber
        ) {

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "game-card";


            const gamePath =
                game.path;


            const playUrl =
                `${GAMES_BASE}/${encodePath(gamePath)}`;


            card.innerHTML = `

                <div
                    class="game-thumb"
                    aria-hidden="true"
                >
                    ${gameNumber}
                </div>


                <div class="game-info">

                    <h3 class="game-title">

                        ${escapeHtml(
                            game.title ||
                            "Untitled Game"
                        )}

                    </h3>


                    <p class="game-desc">

                        ${escapeHtml(
                            game.description ||
                            "Practice Vietnamese with this interactive game."
                        )}

                    </p>


                    <a
                        href="${playUrl}"
                        class="play-btn"
                    >
                        Play Now →
                    </a>

                </div>

            `;


            return card;

        }


        /* =====================================================
           RENDER GAMES
        ====================================================== */

        async function renderGames() {

            const container =
                document.getElementById(
                    "game-container"
                );


            try {

                const categories =
                    await loadCategories();


                container.innerHTML =
                    "";


                let totalGames =
                    0;


                /* =============================================
                   LOOP THROUGH CATEGORIES
                ============================================== */

                for (
                    const categoryName
                    of Object.keys(categories)
                ) {


                    const category =
                        categories[
                            categoryName
                        ];


                    /* =========================================
                       SAFETY CHECK
                    ========================================== */

                    if (
                        !category ||
                        typeof category !== "object"
                    ) {

                        continue;

                    }


                    const games =
                        Array.isArray(
                            category.games
                        )
                            ? category.games
                            : [];


                    if (
                        games.length === 0
                    ) {

                        continue;

                    }


                    /* =========================================
                       CREATE CATEGORY SECTION
                    ========================================== */

                    const section =
                        document.createElement(
                            "section"
                        );


                    section.className =
                        "game-type-section";


                    const categoryClass =
                        categoryClasses[
                            categoryName
                        ];


                    if (categoryClass) {

                        section.classList.add(
                            categoryClass
                        );

                    }


                    /* =========================================
                       CATEGORY HEADER
                    ========================================== */

                    const categoryHeader =
                        document.createElement(
                            "div"
                        );


                    categoryHeader.className =
                        "category-header";


                    /* =========================================
                       CATEGORY MARKER
                    ========================================== */

                    const marker =
                        document.createElement(
                            "div"
                        );


                    marker.className =
                        "category-marker";


                    marker.setAttribute(
                        "aria-hidden",
                        "true"
                    );


                    /* =========================================
                       CATEGORY TEXT
                    ========================================== */

                    const categoryText =
                        document.createElement(
                            "div"
                        );


                    categoryText.className =
                        "category-text";


                    /* =========================================
                       CATEGORY LABEL
                    ========================================== */

                    const label =
                        document.createElement(
                            "div"
                        );


                    label.className =
                        "category-label";


                    label.textContent =
                        "Category";


                    /* =========================================
                       CATEGORY TITLE
                    ========================================== */

                    const title =
                        document.createElement(
                            "h2"
                        );


                    title.className =
                        "category-title";


                    title.textContent =
                        categoryName;


                    /* =========================================
                       CATEGORY SUBTITLE
                    ========================================== */

                    const subtitle =
                        document.createElement(
                            "p"
                        );


                    subtitle.className =
                        "category-subtitle";


                    subtitle.textContent =
                        category.subtitle ||
                        "Practice Vietnamese with interactive games.";


                    /* =========================================
                       BUILD CATEGORY TEXT
                    ========================================== */

                    categoryText.appendChild(
                        label
                    );


                    categoryText.appendChild(
                        title
                    );


                    categoryText.appendChild(
                        subtitle
                    );


                    /* =========================================
                       BUILD CATEGORY HEADER
                    ========================================== */

                    categoryHeader.appendChild(
                        marker
                    );


                    categoryHeader.appendChild(
                        categoryText
                    );


                    /* =========================================
                       GAME GRID
                    ========================================== */

                    const grid =
                        document.createElement(
                            "div"
                        );


                    grid.className =
                        "game-grid";


                    /* =========================================
                       ADD GAMES
                    ========================================== */

                    let gameNumber =
                        1;


                    for (
                        const game
                        of games
                    ) {


                        if (
                            !game ||
                            typeof game !== "object" ||
                            typeof game.path !== "string"
                        ) {

                            console.warn(
                                "Invalid game:",
                                game
                            );

                            continue;

                        }


                        const card =
                            createGameCard(
                                game,
                                gameNumber
                            );


                        grid.appendChild(
                            card
                        );


                        gameNumber++;

                        totalGames++;

                    }


                    /* =========================================
                       ADD CATEGORY TO PAGE
                    ========================================== */

                    if (
                        grid.children.length > 0
                    ) {

                        section.appendChild(
                            categoryHeader
                        );


                        section.appendChild(
                            grid
                        );


                        container.appendChild(
                            section
                        );

                    }

                }


                /* =============================================
                   NO GAMES
                ============================================== */

                if (
                    totalGames === 0
                ) {

                    container.innerHTML = `

                        <div class="error-message">

                            <strong>
                                No games found.
                            </strong>

                            <br><br>

                            Please check
                            <strong>
                                categories.json
                            </strong>.

                        </div>

                    `;

                }

            }


            catch (error) {

                console.error(
                    "Game loader error:",
                    error
                );


                container.innerHTML = `

                    <div class="error-message">

                        <strong>
                            Unable to load games.
                        </strong>

                        <br><br>

                        Please check that
                        <strong>
                            categories.json
                        </strong>
                        exists and contains valid JSON.

                        <br><br>

                        <small>
                            ${escapeHtml(
                                error.message
                            )}
                        </small>

                    </div>

                `;

            }

        }


        /* =====================================================
           START
        ====================================================== */

        renderGames();

    </script>


</body>

</html>
