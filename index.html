<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="Play free, interactive arcade mini-games to master survival Vietnamese vocabulary, pronunciation, and communication skills with Duong."
>

<meta
    name="keywords"
    content="learn vietnamese, vietnamese games, survival vietnamese, vietnamese vocabulary, vietnamese practice"
>

<meta
    name="author"
    content="Duong"
>

<title>
    Survival Vietnamese with Duong
</title>


<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Segoe+UI:wght@400;600;700&display=swap"
    rel="stylesheet"
>


<style>

/* ==========================================================
   RESET
========================================================== */

*{
    box-sizing:border-box;
}


html{
    scroll-behavior:smooth;
}


body{

    margin:0;

    min-height:100vh;

    font-family:
        'Segoe UI',
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    color:#263238;

    background:
        linear-gradient(
            180deg,
            #eefaff 0%,
            #f8fcff 48%,
            #fffaf2 100%
        );

}


/* ==========================================================
   HEADER
========================================================== */

header{

    position:relative;

    width:100%;

    min-height:330px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:65px 20px;

    overflow:hidden;

    border-bottom-left-radius:45px;

    border-bottom-right-radius:45px;

    box-shadow:
        0 8px 30px
        rgba(30,80,110,.12);

}


header::before{

    content:"";

    position:absolute;

    inset:0;

    background-image:
        url('banner.jpg');

    background-size:cover;

    background-position:center;

    filter:
        brightness(1.08)
        saturate(.9);

    transform:scale(1.03);

    z-index:0;

}


header::after{

    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.35),
            rgba(255,255,255,.58)
        );

    z-index:1;

}


header h1{

    position:relative;

    z-index:2;

    margin:0;

    font-family:
        'Kalam',
        cursive;

    font-size:
        clamp(
            2.8rem,
            6vw,
            4.6rem
        );

    line-height:1;

    font-weight:700;

    letter-spacing:1px;

    color:#183b56;

    text-shadow:
        0 2px 0
        rgba(255,255,255,.8);

}


header p{

    position:relative;

    z-index:2;

    margin:18px auto 0;

    max-width:650px;

    font-size:1.15rem;

    line-height:1.5;

    font-weight:600;

    color:#405a6d;

}


.header-line{

    position:relative;

    z-index:2;

    width:70px;

    height:5px;

    margin-top:20px;

    border-radius:10px;

    background:#1abc9c;

}


/* ==========================================================
   MAIN
========================================================== */

.container{

    width:
        min(
            1100px,
            92%
        );

    margin:
        45px auto 70px;

}


.section-title{

    margin:
        0 0 35px;

    text-align:center;

    font-size:2rem;

    font-weight:800;

    color:#263238;

}


.section-title::after{

    content:"";

    display:block;

    width:65px;

    height:5px;

    margin:
        10px auto 0;

    border-radius:10px;

    background:#1abc9c;

}


/* ==========================================================
   CATEGORY
========================================================== */

.game-type-section{

    margin-bottom:35px;

    padding:25px;

    background:
        rgba(
            255,
            255,
            255,
            .9
        );

    border:
        1px solid
        rgba(
            220,
            235,
            242,
            .9
        );

    border-radius:24px;

    box-shadow:
        0 8px 25px
        rgba(
            40,
            80,
            110,
            .07
        );

}


.category-title{

    margin:0;

    font-size:1.5rem;

    line-height:1.3;

    font-weight:800;

    color:#263238;

}


.category-subtitle{

    margin:
        6px 0 20px;

    color:#78909c;

    font-size:.95rem;

    line-height:1.45;

}


/* ==========================================================
   GAME GRID
========================================================== */

.game-grid{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(
                220px,
                1fr
            )
        );

    gap:18px;

}


/* ==========================================================
   GAME CARD
========================================================== */

.game-card{

    position:relative;

    min-height:235px;

    display:flex;

    flex-direction:column;

    overflow:hidden;

    background:#fff;

    border:
        1px solid
        #e5edf2;

    border-radius:18px;

    box-shadow:
        0 5px 15px
        rgba(0,0,0,.055);

    transition:
        transform .25s ease,
        box-shadow .25s ease;

}


.game-card:hover{

    transform:
        translateY(-6px);

    box-shadow:
        0 14px 28px
        rgba(0,0,0,.11);

}


.game-thumb{

    height:95px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:3rem;

    background:
        linear-gradient(
            135deg,
            #e4f8ff,
            #effff9
        );

    border-bottom:
        1px solid
        #edf3f6;

}


.game-info{

    flex:1;

    display:flex;

    flex-direction:column;

    padding:15px;

}


.game-title{

    margin:
        0 0 7px;

    color:#263238;

    font-size:1.05rem;

    font-weight:800;

    line-height:1.3;

    text-align:center;

}


.game-desc{

    flex:1;

    display:flex;

    align-items:center;

    justify-content:center;

    margin:
        0 0 12px;

    color:#78909c;

    font-size:.88rem;

    line-height:1.4;

    text-align:center;

}


.play-btn{

    display:block;

    width:100%;

    padding:10px 14px;

    border-radius:10px;

    background:#1abc9c;

    color:white;

    text-decoration:none;

    text-align:center;

    font-size:.9rem;

    font-weight:800;

    transition:
        background .2s ease,
        transform .2s ease;

}


.play-btn:hover{

    background:#159a80;

    transform:scale(1.02);

}


/* ==========================================================
   LOADING
========================================================== */

.loading{

    padding:50px;

    text-align:center;

    color:#78909c;

}


/* ==========================================================
   ERROR
========================================================== */

.error-message{

    padding:25px;

    background:#fff5f5;

    border:
        1px solid
        #f3cccc;

    border-radius:16px;

    color:#c0392b;

    text-align:center;

}


/* ==========================================================
   FOOTER
========================================================== */

footer{

    padding:
        30px 20px 40px;

    color:#90a4ae;

    font-size:.85rem;

    text-align:center;

}


/* ==========================================================
   MOBILE
========================================================== */

@media(max-width:640px){

    header{

        min-height:280px;

        padding:
            55px 18px 50px;

        border-bottom-left-radius:30px;

        border-bottom-right-radius:30px;

    }


    header h1{

        font-size:2.7rem;

    }


    header p{

        font-size:1rem;

    }


    .container{

        width:94%;

        margin-top:30px;

    }


    .section-title{

        font-size:1.7rem;

        margin-bottom:25px;

    }


    .game-type-section{

        padding:18px;

        border-radius:20px;

        margin-bottom:22px;

    }


    .category-title{

        font-size:1.3rem;

    }


    .category-subtitle{

        font-size:.88rem;

    }


    .game-grid{

        grid-template-columns:1fr;

        gap:14px;

    }


    .game-card{

        min-height:215px;

    }


    .game-thumb{

        height:80px;

        font-size:2.5rem;

    }

}

</style>

</head>


<body>


<!-- ==========================================================
     HEADER
========================================================== -->

<header>

    <h1>
        🌴 Survival Vietnamese
    </h1>

    <p>
        Learn Vietnamese. Play games.
        Survive real life.
    </p>

    <div class="header-line"></div>

</header>



<!-- ==========================================================
     MAIN
========================================================== -->

<main class="container">

    <div class="section-title">
        🎮 Choose Your Game
    </div>


    <div id="game-container">

        <div class="loading">
            Loading games...
        </div>

    </div>

</main>



<!-- ==========================================================
     FOOTER
========================================================== -->

<footer>

    © 2026 Created by
    Survival Vietnamese with Duong

</footer>



<script>

/* ==========================================================
   CONFIG
========================================================== */

const OWNER =
    "DuongNg1111";

const REPO =
    "Vietnamese-wed-game";

const BRANCH =
    "main";


const API_BASE =
    `https://api.github.com/repos/${OWNER}/${REPO}/contents`;


const RAW_BASE =
    `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}`;



/* ==========================================================
   CATEGORY INFORMATION
========================================================== */

const CATEGORY_INFO = {

    "Color":{
        icon:"🎨",
        subtitle:
            "Learn useful Vietnamese color words."
    },

    "Describe things":{
        icon:"🔎",
        subtitle:
            "Practice simple Vietnamese words for describing things."
    },

    "Food and Drinks":{
        icon:"🍜",
        subtitle:
            "Learn practical Vietnamese food and drink vocabulary."
    },

    "Health":{
        icon:"❤️",
        subtitle:
            "Practice useful Vietnamese words for health and everyday situations."
    },

    "Mix practice":{
        icon:"🎯",
        subtitle:
            "Mix different Vietnamese topics for overall practice."
    },

    "Numbers":{
        icon:"🔢",
        subtitle:
            "Practice Vietnamese numbers and number words."
    }

};



/* ==========================================================
   GITHUB API FETCH
========================================================== */

async function githubFetch(
    path
){

    const url =
        `${API_BASE}/${path}`;

    const response =
        await fetch(
            url,
            {
                headers:{
                    "Accept":
                        "application/vnd.github+json"
                }
            }
        );


    if(
        response.status === 403
    ){

        throw new Error(
            "GitHub API rate limit reached."
        );

    }


    if(
        !response.ok
    ){

        throw new Error(
            `GitHub API error ${response.status}`
        );

    }


    return await response.json();

}



/* ==========================================================
   GET HTML FILES
========================================================== */

async function findGames(
    categoryName
){

    const categoryPath =
        `GAMES/${categoryName}`;


    const items =
        await githubFetch(
            categoryPath
        );


    const games = [];


    for(
        const item
        of items
    ){

        /* ----------------------------------------------
           DIRECT HTML FILE
        ---------------------------------------------- */

        if(
            item.type === "file" &&
            item.name
                .toLowerCase()
                .endsWith(".html")
        ){

            games.push({

                path:
                    item.path,

                name:
                    item.name
                        .replace(
                            /\.html$/i,
                            ""
                        )

            });

            continue;

        }



        /* ----------------------------------------------
           FOLDER
        ---------------------------------------------- */

        if(
            item.type !== "dir"
        ){

            continue;

        }


        const folderName =
            item.name.toLowerCase();


        /* Ignore asset folders */

        const ignored = [

            "images",
            "image",
            "audio",
            "audios",
            "assets",
            "css",
            "js"

        ];


        if(
            ignored.includes(
                folderName
            )
        ){

            continue;

        }



        /*
         * Look for HTML files
         * directly inside folder.
         */

        try{

            const subItems =
                await githubFetch(
                    item.path
                );


            for(
                const subItem
                of subItems
            ){

                if(
                    subItem.type === "file" &&
                    subItem.name
                        .toLowerCase()
                        .endsWith(".html")
                ){

                    games.push({

                        path:
                            subItem.path,

                        name:
                            subItem.name
                                .replace(
                                    /\.html$/i,
                                    ""
                                )

                    });

                }

            }

        }

        catch(error){

            console.warn(
                "Could not read folder:",
                item.path
            );

        }

    }


    return games;

}



/* ==========================================================
   READ META TAG
========================================================== */

function getMeta(
    html,
    name
){

    const regex =
        new RegExp(
            `<meta\\s+name=["']${name}["']\\s+content=["']([^"']*)["']`,
            "i"
        );


    const match =
        html.match(
            regex
        );


    return match
        ? match[1]
        : "";

}



/* ==========================================================
   GET GAME METADATA
========================================================== */

async function getGameMetadata(
    game
){

    const encodedPath =
        game.path
            .split("/")
            .map(
                part =>
                    encodeURIComponent(
                        part
                    )
            )
            .join("/");


    const url =
        `${RAW_BASE}/${encodedPath}`;


    try{

        const response =
            await fetch(
                url
            );


        if(
            !response.ok
        ){

            throw new Error(
                "Could not load HTML"
            );

        }


        const html =
            await response.text();


        return {

            title:
                getMeta(
                    html,
                    "game-title"
                ) ||
                formatGameName(
                    game.name
                ),


            description:
                getMeta(
                    html,
                    "game-description"
                ) ||
                "Practice Vietnamese with this interactive game.",


            icon:
                getMeta(
                    html,
                    "game-icon"
                ) ||
                "🎮"

        };

    }

    catch(error){

        console.warn(
            "Could not read metadata:",
            game.path
        );


        return {

            title:
                formatGameName(
                    game.name
                ),

            description:
                "Practice Vietnamese with this interactive game.",

            icon:
                "🎮"

        };

    }

}



/* ==========================================================
   FORMAT GAME NAME
========================================================== */

function formatGameName(
    name
){

    return name

        .replace(
            /[-_]/g,
            " "
        )

        .replace(
            /\bgame\s*(\d+)\b/i,
            "Game $1"
        )

        .replace(
            /\b\w/g,
            char =>
                char.toUpperCase()
        );

}



/* ==========================================================
   CREATE GAME CARD
========================================================== */

async function createGameCard(
    game
){

    const metadata =
        await getGameMetadata(
            game
        );


    const encodedPath =
        game.path
            .split("/")
            .map(
                part =>
                    encodeURIComponent(
                        part
                    )
            )
            .join("/");


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "game-card";


    card.innerHTML = `

        <div class="game-thumb">

            ${escapeHtml(
                metadata.icon
            )}

        </div>


        <div class="game-info">

            <h3 class="game-title">

                ${escapeHtml(
                    metadata.title
                )}

            </h3>


            <p class="game-desc">

                ${escapeHtml(
                    metadata.description
                )}

            </p>


            <a
                href="${encodedPath}"
                class="play-btn"
            >

                Play Now →

            </a>

        </div>

    `;


    return card;

}



/* ==========================================================
   ESCAPE HTML
========================================================== */

function escapeHtml(
text
){

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}



/* ==========================================================
   RENDER
========================================================== */

async function renderGames(){

    const container =
        document.getElementById(
            "game-container"
        );


    container.innerHTML = `

        <div class="loading">

            Loading games...

        </div>

    `;


    try{

        /*
         * Get GAMES folders
         */

        const folders =
            await githubFetch(
                "GAMES"
            );


        const categories = [];


        for(
            const folder
            of folders
        ){

            if(
                folder.type !== "dir"
            ){

                continue;

            }


            const games =
                await findGames(
                    folder.name
                );


            if(
                games.length === 0
            ){

                continue;

            }


            categories.push({

                name:
                    folder.name,

                games:
                    games

            });

        }



        /* No games */

        if(
            categories.length === 0
        ){

            container.innerHTML = `

                <div class="error-message">

                    <strong>
                        No games found.
                    </strong>

                    <br><br>

                    No playable HTML games
                    were found inside the
                    <strong>GAMES</strong>
                    folder.

                </div>

            `;

            return;

        }



        /*
         * Clear loading
         */

        container.innerHTML = "";



        /*
         * Render categories
         */

        for(
            const category
            of categories
        ){

            const info =
                CATEGORY_INFO[
                    category.name
                ] || {

                    icon:"🎮",

                    subtitle:
                        "Practice Vietnamese with interactive games."

                };



            const section =
                document.createElement(
                    "section"
                );


            section.className =
                "game-type-section";



            const title =
                document.createElement(
                    "h2"
                );


            title.className =
                "category-title";


            title.textContent =
                `${info.icon} ${category.name}`;



            const subtitle =
                document.createElement(
                    "p"
                );


            subtitle.className =
                "category-subtitle";


            subtitle.textContent =
                info.subtitle;



            const grid =
                document.createElement(
                    "div"
                );


            grid.className =
                "game-grid";



            for(
                const game
                of category.games
            ){

                const card =
                    await createGameCard(
                        game
                    );


                grid.appendChild(
                    card
                );

            }



            section.appendChild(
                title
            );


            section.appendChild(
                subtitle
            );


            section.appendChild(
                grid
            );


            container.appendChild(
                section
            );

        }

    }


    catch(error){

        console.error(
            "Game loader error:",
            error
        );


        container.innerHTML = `

            <div class="error-message">

                <strong>
                    Unable to load games.
                </strong>

                <br><br>

                ${escapeHtml(
                    error.message
                )}

                <br><br>

                Please try again later.

            </div>

        `;

    }

}



/* ==========================================================
   START
========================================================== */

renderGames();

</script>


</body>

</html>
