<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Play free, interactive arcade mini-games to master survival Vietnamese vocabulary, pronunciation, and communication skills with Duong."
    >

    <meta
        name="keywords"
        content="learn vietnamese, vietnamese games, survival vietnamese, vietnamese vocabulary, vietnamese practice"
    >

    <meta
        name="author"
        content="Duong"
    >

    <title>
        Survival Vietnamese with Duong
    </title>


    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Segoe+UI:wght@400;600;700&display=swap"
        rel="stylesheet"
    >


    <style>


        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            color: #263238;

            background:
                linear-gradient(
                    180deg,
                    #eefaff 0%,
                    #f8fcff 48%,
                    #fffaf2 100%
                );

        }



        /* =====================================================
           HEADER
        ===================================================== */

        header {

            position: relative;

            width: 100%;

            min-height: 330px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 65px 20px;

            overflow: hidden;

            border-bottom-left-radius: 45px;

            border-bottom-right-radius: 45px;

            box-shadow:
                0 8px 30px
                rgba(30, 80, 110, 0.12);

        }


        header::before {

            content: "";

            position: absolute;

            inset: 0;

            background-image:
                url('banner.jpg');

            background-size: cover;

            background-position: center;

            filter:
                brightness(1.08)
                saturate(0.9);

            transform:
                scale(1.03);

            z-index: 0;

        }


        header::after {

            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    180deg,
                    rgba(255,255,255,0.35),
                    rgba(255,255,255,0.58)
                );

            z-index: 1;

        }


        header h1 {

            position: relative;

            z-index: 2;

            margin: 0;

            font-family:
                'Kalam',
                cursive;

            font-size:
                clamp(
                    2.8rem,
                    6vw,
                    4.6rem
                );

            line-height: 1;

            font-weight: 700;

            letter-spacing: 1px;

            color: #183b56;

            text-shadow:
                0 2px 0
                rgba(255,255,255,0.8);

        }


        header p {

            position: relative;

            z-index: 2;

            margin:
                18px auto 0;

            max-width: 650px;

            font-size: 1.15rem;

            line-height: 1.5;

            font-weight: 600;

            color: #405a6d;

        }


        .header-line {

            position: relative;

            z-index: 2;

            width: 70px;

            height: 5px;

            margin-top: 20px;

            border-radius: 10px;

            background: #1abc9c;

        }



        /* =====================================================
           MAIN CONTAINER
        ===================================================== */

        .container {

            width:
                min(
                    1100px,
                    92%
                );

            margin:
                45px auto 70px;

        }



        /* =====================================================
           MAIN TITLE
        ===================================================== */

        .section-title {

            margin:
                0 0 35px;

            text-align: center;

            font-size: 2rem;

            font-weight: 800;

            color: #263238;

        }


        .section-title::after {

            content: "";

            display: block;

            width: 65px;

            height: 5px;

            margin:
                10px auto 0;

            border-radius: 10px;

            background: #1abc9c;

        }



        /* =====================================================
           CATEGORY SECTION
        ===================================================== */

        .game-type-section {

            margin-bottom: 35px;

            padding: 25px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.9
                );

            border:
                1px solid
                rgba(
                    220,
                    235,
                    242,
                    0.9
                );

            border-radius: 24px;

            box-shadow:
                0 8px 25px
                rgba(
                    40,
                    80,
                    110,
                    0.07
                );

        }



        /* =====================================================
           CATEGORY HEADER
        ===================================================== */

        .category-title {

            display: flex;

            align-items: center;

            gap: 10px;

            margin: 0;

            padding: 0;

            border: none;

            font-size: 1.5rem;

            line-height: 1.3;

            font-weight: 800;

            color: #263238;

        }


        .category-subtitle {

            margin:
                6px 0 20px;

            color: #78909c;

            font-size: 0.95rem;

            line-height: 1.45;

        }



        /* =====================================================
           GAME GRID
        ===================================================== */

        .game-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(
                        220px,
                        1fr
                    )
                );

            gap: 18px;

        }



        /* =====================================================
           GAME CARD
        ===================================================== */

        .game-card {

            position: relative;

            min-height: 235px;

            display: flex;

            flex-direction: column;

            overflow: hidden;

            background: #ffffff;

            border:
                1px solid
                #e5edf2;

            border-radius: 18px;

            box-shadow:
                0 5px 15px
                rgba(
                    0,
                    0,
                    0,
                    0.055
                );

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;

        }


        .game-card:hover {

            transform:
                translateY(-6px);

            box-shadow:
                0 14px 28px
                rgba(
                    0,
                    0,
                    0,
                    0.11
                );

        }



        /* =====================================================
           GAME THUMBNAIL
        ===================================================== */

        .game-thumb {

            height: 95px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 3rem;

            background:
                linear-gradient(
                    135deg,
                    #e4f8ff,
                    #effff9
                );

            border-bottom:
                1px solid
                #edf3f6;

        }



        /* =====================================================
           GAME INFO
        ===================================================== */

        .game-info {

            flex: 1;

            display: flex;

            flex-direction: column;

            padding: 15px;

        }



        /* =====================================================
           GAME TITLE
        ===================================================== */

        .game-title {

            margin:
                0 0 7px;

            color: #263238;

            font-size: 1.05rem;

            font-weight: 800;

            line-height: 1.3;

            text-align: center;

        }



        /* =====================================================
           GAME DESCRIPTION
        ===================================================== */

        .game-desc {

            flex: 1;

            display: flex;

            align-items: center;

            justify-content: center;

            margin:
                0 0 12px;

            color: #78909c;

            font-size: 0.88rem;

            line-height: 1.4;

            text-align: center;

        }



        /* =====================================================
           PLAY BUTTON
        ===================================================== */

        .play-btn {

            display: block;

            width: 100%;

            padding:
                10px 14px;

            border-radius: 10px;

            background:
                #1abc9c;

            color: white;

            text-decoration: none;

            text-align: center;

            font-size: 0.9rem;

            font-weight: 800;

            transition:
                background 0.2s ease,
                transform 0.2s ease;

        }


        .play-btn:hover {

            background:
                #159a80;

            transform:
                scale(1.02);

        }



        /* =====================================================
           LOADING
        ===================================================== */

        .loading {

            padding: 50px;

            text-align: center;

            color: #78909c;

            font-size: 1rem;

        }



        /* =====================================================
           ERROR
        ===================================================== */

        .error-message {

            padding: 25px;

            background:
                #fff5f5;

            border:
                1px solid
                #f3cccc;

            border-radius: 16px;

            color:
                #c0392b;

            text-align: center;

        }



        /* =====================================================
           FOOTER
        ===================================================== */

        footer {

            padding:
                30px 20px 40px;

            color:
                #90a4ae;

            font-size:
                0.85rem;

            text-align:
                center;

        }



        /* =====================================================
           MOBILE
        ===================================================== */

        @media (
            max-width: 640px
        ) {

            header {

                min-height:
                    280px;

                padding:
                    55px 18px 50px;

                border-bottom-left-radius:
                    30px;

                border-bottom-right-radius:
                    30px;

            }


            header h1 {

                font-size:
                    2.7rem;

            }


            header p {

                font-size:
                    1rem;

            }


            .container {

                width:
                    94%;

                margin-top:
                    30px;

            }


            .section-title {

                font-size:
                    1.7rem;

                margin-bottom:
                    25px;

            }


            .game-type-section {

                padding:
                    18px;

                border-radius:
                    20px;

                margin-bottom:
                    22px;

            }


            .category-title {

                font-size:
                    1.3rem;

            }


            .category-subtitle {

                font-size:
                    0.88rem;

            }


            .game-grid {

                grid-template-columns:
                    1fr;

                gap:
                    14px;

            }


            .game-card {

                min-height:
                    215px;

            }


            .game-thumb {

                height:
                    80px;

                font-size:
                    2.5rem;

            }

        }


    </style>

</head>



<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>

        <h1>
            🌴 Survival Vietnamese
        </h1>

        <p>
            Learn Vietnamese. Play games.
            Survive real life.
        </p>

        <div class="header-line"></div>

    </header>



    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main class="container">


        <div class="section-title">
            🎮 Choose Your Game
        </div>


        <div id="game-container">

            <div class="loading">
                Loading games...
            </div>

        </div>


    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer>

        © 2026 Created by
        Survival Vietnamese with Duong

    </footer>



    <!-- =====================================================
         GAME LOADER
         
         IMPORTANT:
         This version does NOT use GitHub API.
         
         It reads categories.json directly.
    ====================================================== -->

    <script>


        /* =====================================================
           CONFIGURATION
        ===================================================== */

        const GAMES_BASE = "GAMES";



        /* =====================================================
           LOAD CATEGORIES.JSON
        ===================================================== */

        async function loadCategories() {

            const response =
                await fetch(
                    "categories.json"
                );


            if (!response.ok) {

                throw new Error(
                    "Could not load categories.json"
                );

            }


            return await response.json();

        }



        /* =====================================================
           GET META TAG
        ===================================================== */

        function getMeta(
            html,
            name
        ) {

            /*
             * Supports:
             *
             * <meta name="game-title" content="...">
             *
             * and also if attributes
             * appear in another order.
             */

            const regex =
                new RegExp(
                    `<meta[^>]*name=["']${name}["'][^>]*content=["']([^"']*)["'][^>]*>`,
                    "i"
                );


            const match =
                html.match(
                    regex
                );


            if (match) {

                return match[1];

            }


            /*
             * Backup pattern:
             * content before name
             */

            const reverseRegex =
                new RegExp(
                    `<meta[^>]*content=["']([^"']*)["'][^>]*name=["']${name}["'][^>]*>`,
                    "i"
                );


            const reverseMatch =
                html.match(
                    reverseRegex
                );


            return reverseMatch
                ? reverseMatch[1]
                : "";

        }



        /* =====================================================
           LOAD GAME METADATA
        ===================================================== */

        async function getGameMetadata(
            gameUrl,
            fallbackName
        ) {

            try {

                const response =
                    await fetch(
                        gameUrl
                    );


                if (!response.ok) {

                    throw new Error(
                        "Could not load game HTML"
                    );

                }


                const html =
                    await response.text();


                return {

                    title:
                        getMeta(
                            html,
                            "game-title"
                        ) ||
                        fallbackName,


                    description:
                        getMeta(
                            html,
                            "game-description"
                        ) ||
                        "Practice Vietnamese with this interactive game.",


                    icon:
                        getMeta(
                            html,
                            "game-icon"
                        ) ||
                        "🎮"

                };

            }


            catch (error) {

                console.warn(
                    "Could not read metadata:",
                    gameUrl
                );


                return {

                    title:
                        fallbackName,


                    description:
                        "Practice Vietnamese with this interactive game.",


                    icon:
                        "🎮"

                };

            }

        }



        /* =====================================================
           CREATE SAFE HTML TEXT
        ===================================================== */

        function escapeHTML(text) {

            return String(text)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }



        /* =====================================================
           CREATE GAME URL
        ===================================================== */

        function createGameUrl(
            categoryName,
            gamePath
        ) {

            const parts = [

                GAMES_BASE,

                categoryName,

                ...gamePath.split("/")

            ];


            return parts
                .map(
                    part =>
                        encodeURIComponent(
                            part
                        )
                )
                .join("/");

        }



        /* =====================================================
           CREATE GAME CARD
        ===================================================== */

        async function createGameCard(
            categoryName,
            gamePath
        ) {


            /*
             * Get filename for fallback title.
             */

            const fileName =
                gamePath
                    .split("/")
                    .pop()
                    .replace(
                        /\.html$/i,
                        ""
                    );


            /*
             * Build URL.
             */

            const gameUrl =
                createGameUrl(
                    categoryName,
                    gamePath
                );


            /*
             * Read metadata.
             */

            const metadata =
                await getGameMetadata(
                    gameUrl,
                    fileName
                );


            /*
             * Create card.
             */

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "game-card";


            /*
             * Build card HTML.
             */

            card.innerHTML = `

                <div class="game-thumb">

                    ${escapeHTML(
                        metadata.icon
                    )}

                </div>


                <div class="game-info">

                    <h3 class="game-title">

                        ${escapeHTML(
                            metadata.title
                        )}

                    </h3>


                    <p class="game-desc">

                        ${escapeHTML(
                            metadata.description
                        )}

                    </p>


                    <a
                        href="${gameUrl}"
                        class="play-btn"
                    >

                        Play Now →

                    </a>

                </div>

            `;


            return card;

        }



        /* =====================================================
           CREATE CATEGORY SECTION
        ===================================================== */

        async function createCategorySection(
            categoryName,
            categoryInfo
        ) {


            /*
             * Create section.
             */

            const section =
                document.createElement(
                    "section"
                );


            section.className =
                "game-type-section";


            /*
             * Category title.
             */

            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "category-title";


            title.textContent =
                `${categoryInfo.icon || "🎮"} ${categoryName}`;


            /*
             * Category subtitle.
             */

            const subtitle =
                document.createElement(
                    "p"
                );


            subtitle.className =
                "category-subtitle";


            subtitle.textContent =
                categoryInfo.subtitle ||
                "Practice Vietnamese with interactive games.";


            /*
             * Game grid.
             */

            const grid =
                document.createElement(
                    "div"
                );


            grid.className =
                "game-grid";


            /*
             * Get games.
             */

            const games =
                Array.isArray(
                    categoryInfo.games
                )
                    ? categoryInfo.games
                    : [];


            /*
             * If no games,
             * don't show category.
             */

            if (
                games.length === 0
            ) {

                return null;

            }


            /*
             * Create cards.
             */

            for (
                const gamePath
                of games
            ) {

                if (
                    typeof gamePath !==
                    "string"
                ) {

                    continue;

                }


                if (
                    !gamePath
                        .toLowerCase()
                        .endsWith(".html")
                ) {

                    continue;

                }


                const card =
                    await createGameCard(
                        categoryName,
                        gamePath
                    );


                grid.appendChild(
                    card
                );

            }


            /*
             * If no valid games,
             * don't show category.
             */

            if (
                grid.children.length === 0
            ) {

                return null;

            }


            /*
             * Add elements.
             */

            section.appendChild(
                title
            );


            section.appendChild(
                subtitle
            );


            section.appendChild(
                grid
            );


            return section;

        }



        /* =====================================================
           RENDER ALL GAMES
        ===================================================== */

        async function renderGames() {

            const container =
                document.getElementById(
                    "game-container"
                );


            try {


                /*
                 * Load categories.json.
                 */

                const categories =
                    await loadCategories();


                /*
                 * Clear loading.
                 */

                container.innerHTML = "";


                /*
                 * Track whether
                 * anything was loaded.
                 */

                let categoryCount = 0;


                /*
                 * Loop through categories.
                 *
                 * Object.keys preserves
                 * the order in categories.json.
                 */

                for (
                    const categoryName
                    of Object.keys(
                        categories
                    )
                ) {


                    const categoryInfo =
                        categories[
                            categoryName
                        ];


                    const section =
                        await createCategorySection(
                            categoryName,
                            categoryInfo
                        );


                    if (
                        section
                    ) {

                        container.appendChild(
                            section
                        );


                        categoryCount++;

                    }

                }


                /*
                 * No games found.
                 */

                if (
                    categoryCount === 0
                ) {

                    container.innerHTML = `

                        <div class="error-message">

                            <strong>
                                No games found.
                            </strong>

                            <br><br>

                            Please check
                            categories.json.

                        </div>

                    `;

                }

            }


            catch (error) {

                console.error(
                    "Game loader error:",
                    error
                );


                container.innerHTML = `

                    <div class="error-message">

                        <strong>
                            Unable to load games.
                        </strong>

                        <br><br>

                        Please check that
                        <strong>
                            categories.json
                        </strong>
                        exists and is valid.

                        <br><br>

                        <small>
                            ${escapeHTML(
                                error.message
                            )}
                        </small>

                    </div>

                `;

            }

        }



        /* =====================================================
           START
        ===================================================== */

        renderGames();


    </script>


</body>

</html>
