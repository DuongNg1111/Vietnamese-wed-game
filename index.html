<!-- =====================================================
     GAME LOADER
     Reads categories.json
====================================================== -->

<script>


    /* =====================================================
       CONFIGURATION
    ====================================================== */

    const GAMES_BASE = "GAMES";


    /* =====================================================
       CATEGORY CLASS
    ====================================================== */

    function getCategoryClass(categoryName) {

        const name =
            categoryName
                .toLowerCase()
                .trim();


        if (
            name === "color" ||
            name === "colors"
        ) {

            return "category-color";

        }


        if (
            name === "describe things"
        ) {

            return "category-describe";

        }


        if (
            name === "food and drinks"
        ) {

            return "category-food";

        }


        if (
            name === "grammar"
        ) {

            return "category-grammar";

        }


        if (
            name === "health"
        ) {

            return "category-health";

        }


        if (
            name === "mix practice"
        ) {

            return "category-mix";

        }


        if (
            name === "numbers"
        ) {

            return "category-numbers";

        }


        if (
            name === "people & pronouns"
        ) {

            return "category-people";

        }


        if (
            name === "places & locations"
        ) {

            return "category-places";

        }


        return "";

    }


    /* =====================================================
       LOAD CATEGORIES.JSON
    ====================================================== */

    async function loadCategories() {

        const response =
            await fetch(
                "categories.json",
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                `Could not load categories.json (${response.status})`
            );

        }


        return await response.json();

    }


    /* =====================================================
       ESCAPE HTML
    ====================================================== */

    function escapeHtml(value) {

        const div =
            document.createElement(
                "div"
            );


        div.textContent =
            String(
                value ?? ""
            );


        return div.innerHTML;

    }


    /* =====================================================
       ENCODE PATH
    ====================================================== */

    function encodePath(path) {

        return path
            .split("/")
            .map(
                part =>
                    encodeURIComponent(part)
            )
            .join("/");

    }


    /* =====================================================
       CREATE GAME CARD
    ====================================================== */

    function createGameCard(
        game,
        categoryClass
    ) {

        const card =
            document.createElement(
                "article"
            );


        card.className =
            "game-card";


        const gamePath =
            game.path;


        const playUrl =
            `${GAMES_BASE}/${encodePath(gamePath)}`;


        card.innerHTML = `

            <div class="game-thumb">

                ${escapeHtml(
                    game.icon || "🎮"
                )}

            </div>


            <div class="game-info">

                <h3 class="game-title">

                    ${escapeHtml(
                        game.title ||
                        "Untitled Game"
                    )}

                </h3>


                <p class="game-desc">

                    ${escapeHtml(
                        game.description ||
                        "Practice Vietnamese with this interactive game."
                    )}

                </p>


                <a
                    href="${playUrl}"
                    class="play-btn"
                >
                    Play Now →
                </a>

            </div>

        `;


        return card;

    }


    /* =====================================================
       RENDER GAMES
    ====================================================== */

    async function renderGames() {

        const container =
            document.getElementById(
                "game-container"
            );


        try {

            const categories =
                await loadCategories();


            container.innerHTML =
                "";


            let totalGames =
                0;


            /* =============================================
               LOOP THROUGH CATEGORIES
            ============================================== */

            for (
                const categoryName
                of Object.keys(categories)
            ) {


                const category =
                    categories[
                        categoryName
                    ];


                /* =========================================
                   SAFETY CHECK
                ========================================== */

                if (
                    !category ||
                    typeof category !== "object"
                ) {

                    continue;

                }


                const games =
                    Array.isArray(
                        category.games
                    )
                        ? category.games
                        : [];


                if (
                    games.length === 0
                ) {

                    continue;

                }


                /* =========================================
                   CATEGORY SECTION
                ========================================== */

                const section =
                    document.createElement(
                        "section"
                    );


                section.className =
                    "game-type-section " +
                    getCategoryClass(
                        categoryName
                    );


                /* =========================================
                   CATEGORY HEADER
                ========================================== */

                const categoryHeader =
                    document.createElement(
                        "div"
                    );


                categoryHeader.className =
                    "category-header";


                /* =========================================
                   CATEGORY ICON
                ========================================== */

                const categoryIcon =
                    document.createElement(
                        "div"
                    );


                categoryIcon.className =
                    "category-icon";


                categoryIcon.textContent =
                    category.icon ||
                    "🎮";


                /* =========================================
                   CATEGORY TEXT
                ========================================== */

                const categoryText =
                    document.createElement(
                        "div"
                    );


                categoryText.className =
                    "category-text";


                /* =========================================
                   CATEGORY TITLE
                ========================================== */

                const title =
                    document.createElement(
                        "h2"
                    );


                title.className =
                    "category-title";


                title.textContent =
                    categoryName;


                /* =========================================
                   CATEGORY SUBTITLE
                ========================================== */

                const subtitle =
                    document.createElement(
                        "p"
                    );


                subtitle.className =
                    "category-subtitle";


                subtitle.textContent =
                    category.subtitle ||
                    "Practice Vietnamese with interactive games.";


                categoryText.appendChild(
                    title
                );


                categoryText.appendChild(
                    subtitle
                );


                categoryHeader.appendChild(
                    categoryIcon
                );


                categoryHeader.appendChild(
                    categoryText
                );


                /* =========================================
                   GAME GRID
                ========================================== */

                const grid =
                    document.createElement(
                        "div"
                    );


                grid.className =
                    "game-grid";


                /* =========================================
                   ADD GAMES
                ========================================== */

                for (
                    const game
                    of games
                ) {

                    if (
                        !game ||
                        typeof game !== "object" ||
                        typeof game.path !== "string"
                    ) {

                        console.warn(
                            "Invalid game:",
                            game
                        );

                        continue;

                    }


                    const card =
                        createGameCard(
                            game,
                            getCategoryClass(
                                categoryName
                            )
                        );


                    grid.appendChild(
                        card
                    );


                    totalGames++;

                }


                /* =========================================
                   ADD CATEGORY
                ========================================== */

                if (
                    grid.children.length > 0
                ) {

                    section.appendChild(
                        categoryHeader
                    );


                    section.appendChild(
                        grid
                    );


                    container.appendChild(
                        section
                    );

                }

            }


            /* =============================================
               NO GAMES
            ============================================== */

            if (
                totalGames === 0
            ) {

                container.innerHTML = `

                    <div class="error-message">

                        <strong>
                            No games found.
                        </strong>

                        <br><br>

                        Please check
                        <strong>
                            categories.json
                        </strong>.

                    </div>

                `;

            }

        }


        catch (error) {

            console.error(
                "Game loader error:",
                error
            );


            container.innerHTML = `

                <div class="error-message">
