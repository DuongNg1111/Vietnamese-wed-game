<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Play free interactive games to practice survival Vietnamese vocabulary, pronunciation, grammar, and communication skills."
    >

    <meta
        name="keywords"
        content="learn Vietnamese, Vietnamese games, survival Vietnamese, Vietnamese vocabulary, Vietnamese grammar"
    >

    <meta
        name="author"
        content="Duong"
    >

    <title>Survival Vietnamese with Duong</title>


    <!-- =====================================================
         GOOGLE FONTS
         Kalam   -> hand-painted shopfront sign lettering (headline only)
         Be Vietnam Pro -> a Vietnamese-designed typeface for all body text,
                            chosen because this is a Vietnamese-learning product
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =====================================================
           DESIGN TOKENS
           Inspired by Vietnamese blue-and-white porcelain (gốm hoa
           lam / Bát Tràng ceramics) — cobalt blue glaze over a
           white-porcelain ground, with a thin gold trim. Blue is
           the dominant color throughout the page.
        ====================================================== */

        :root {

            --paper:        #EEF3F9;   /* porcelain white, cool undertone    */
            --paper-2:      #FFFFFF;   /* glazed white card surface          */
            --ink:          #123258;   /* deep cobalt, body text / headings  */
            --ink-soft:     #5A7392;   /* muted slate-blue secondary text    */
            --lacquer:      #2C5F9E;   /* cobalt blue — primary accent       */
            --lacquer-dark: #1D416F;
            --jade:         #1E5FA8;   /* cobalt blue, underline accents     */
            --brass:        #C9A227;   /* thin gold trim, used sparingly     */
            --line:         #D3E1EF;   /* cool hairline border               */
        }


        /* =====================================================
           RESET
        ====================================================== */

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                'Be Vietnam Pro',
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            color: var(--ink);

            background:
                linear-gradient(
                    180deg,
                    #FBFDFF 0%,
                    #EEF3F9 45%,
                    #E7EFF8 100%
                );

        }


        /* =====================================================
           SIGNATURE MOTIF: gạch bông diamond tile strip
           Reused sparingly — only bookending the page, top and
           bottom — so it reads as a deliberate frame, not noise.
        ====================================================== */

        .tile-strip {

            width: 100%;

            background-color: var(--paper-2);

            background-image:
                linear-gradient(
                    45deg,
                    rgba(18,50,88,0.88) 25%,
                    transparent 25%,
                    transparent 75%,
                    rgba(18,50,88,0.88) 75%
                ),
                linear-gradient(
                    45deg,
                    rgba(18,50,88,0.88) 25%,
                    transparent 25%,
                    transparent 75%,
                    rgba(18,50,88,0.88) 75%
                );

            background-size: 22px 22px;

            background-position:
                0 0,
                11px 11px;

        }


        /* =====================================================
           TOP NAVIGATION
        ====================================================== */

        .top-nav {

            position: absolute;

            top: 20px;

            left: 0;
            right: 0;

            z-index: 10;

            width: min(
                1250px,
                94%
            );

            margin: auto;

            display: flex;

            justify-content: flex-end;

        }


        .login-btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 6px;

            padding:
                9px 18px;

            border:
                1.5px solid
                var(--brass);

            border-radius: 999px;

            background:
                rgba(
                    251,
                    247,
                    236,
                    0.92
                );

            color:
                var(--ink);

            text-decoration: none;

            font-size:
                0.88rem;

            font-weight:
                700;

            box-shadow:
                0 4px 12px
                rgba(
                    18,
                    50,
                    88,
                    0.12
                );

            backdrop-filter:
                blur(8px);

            transition:
                0.2s ease;

        }


        .login-btn:hover {

            transform:
                translateY(-2px);

            background:
                var(--lacquer);

            border-color:
                var(--lacquer);

            color:
                var(--paper-2);

            box-shadow:
                0 7px 18px
                rgba(
                    44,
                    95,
                    158,
                    0.25
                );

        }


        /* =====================================================
           HEADER — the "shopfront awning"
        ====================================================== */

        header {

            position: relative;

            width: 100%;

            min-height: 330px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding:
                85px 20px 70px;

            overflow: hidden;

            box-shadow:
                0 8px 30px
                rgba(
                    30,
                    58,
                    52,
                    0.14
                );

        }


        header .tile-strip {

            position: absolute;

            top: 0;
            left: 0;

            height: 10px;

            z-index: 3;

        }


        header::before {

            content: "";

            position: absolute;

            inset: 0;

            background-image:
                url('banner.jpg');

            background-size:
                cover;

            background-position:
                center;

            filter:
                brightness(1.05)
                saturate(0.85);

            transform:
                scale(1.03);

            z-index: 0;

        }


        header::after {

            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    180deg,
                    rgba(238,243,249,0.45),
                    rgba(238,243,249,0.76)
                );

            z-index: 1;

        }


        .header-eyebrow {

            position: relative;

            z-index: 2;

            display: inline-block;

            margin-bottom: 16px;

            padding:
                6px 16px;

            border-radius: 999px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.55
                );

            border:
                1px solid
                rgba(
                    44,
                    95,
                    158,
                    0.35
                );

            color:
                var(--lacquer-dark);

            font-size:
                0.78rem;

            font-weight:
                700;

            letter-spacing:
                0.08em;

            text-transform:
                uppercase;

        }


        header h1 {

            position: relative;

            z-index: 2;

            margin: 0;

            font-family:
                'Kalam',
                cursive;

            font-size:
                clamp(
                    2.8rem,
                    6vw,
                    4.6rem
                );

            line-height: 1;

            font-weight: 700;

            letter-spacing: 1px;

            color:
                var(--ink);

            text-shadow:
                0 2px 0
                rgba(
                    255,
                    255,
                    255,
                    0.85
                );

        }


        header p {

            position: relative;

            z-index: 2;

            margin:
                18px auto 0;

            max-width:
                650px;

            font-size:
                1.1rem;

            line-height:
                1.5;

            font-weight:
                500;

            color:
                var(--ink-soft);

        }


        .header-line {

            position: relative;

            z-index: 2;

            width:
                70px;

            height:
                5px;

            margin-top:
                22px;

            border-radius:
                10px;

            background:
                var(--jade);

        }


        /* =====================================================
           AWNING FRINGE — scalloped divider hanging from the
           header, like a striped fabric shopfront awning.
        ====================================================== */

        .awning-fringe {

            display: block;

            width: 100%;

            line-height: 0;

            margin-top: -1px;

        }


        .awning-fringe svg {

            display: block;

            width: 100%;

            height: 26px;

        }


        /* =====================================================
           MAIN
        ====================================================== */

        .container {

            width:
                min(
                    1400px,
                    96%
                );

            margin:
                42px auto 55px;

        }


        /* =====================================================
           PAGE INTRO
        ====================================================== */

        .page-intro {

            text-align: center;

            margin-bottom: 35px;

        }


        .section-title {

            margin: 0;

            font-size:
                2rem;

            font-weight:
                800;

            color:
                var(--ink);

        }


        .section-subtitle {

            margin:
                8px auto 0;

            max-width:
                650px;

            color:
                var(--ink-soft);

            font-size:
                0.95rem;

            line-height:
                1.5;

        }


        .section-title::after {

            content: "";

            display: block;

            width:
                65px;

            height:
                5px;

            margin:
                10px auto 0;

            border-radius:
                10px;

            background:
                var(--lacquer);

        }


        /* =====================================================
           CATEGORY SECTION — the "hanging signboard"
        ====================================================== */

        .game-type-section {

            position: relative;

            margin-bottom:
                30px;

            padding:
                26px 24px 24px;

            border:
                1px solid
                var(--border);

            border-radius:
                18px;

            background:
                var(--background);

            box-shadow:
                0 8px 24px
                rgba(
                    30,
                    58,
                    52,
                    0.07
                );

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;

        }


        .game-type-section::before {

            /* the little "chain" the signboard hangs from */

            content: "";

            position: absolute;

            top: -9px;

            left: 40px;

            width: 3px;

            height: 9px;

            background: var(--accent);

            border-radius: 2px;

        }


        .game-type-section:hover {

            transform: translateY(-2px);

            box-shadow:
                0 12px 28px
                rgba(
                    30,
                    58,
                    52,
                    0.11
                );

        }


        /* =====================================================
           CATEGORY COLORS
           One blue-and-white porcelain family throughout — each
           category is a different depth/hue of cobalt so the
           page reads as unmistakably blue, while staying easy
           to tell categories apart at a glance.
        ====================================================== */

        .category-color {
            --accent: #2C5F9E;
            --background: #EDF3FA;
            --border: #CFDFEF;
        }

        .category-describe {
            --accent: #4A5B9E;
            --background: #EFF0F9;
            --border: #D6D9EF;
        }

        .category-food {
            --accent: #1F6F91;
            --background: #EAF4F8;
            --border: #C9E2EC;
        }

        .category-grammar {
            --accent: #1B5E63;
            --background: #EAF5F5;
            --border: #C9E4E4;
        }

        .category-health {
            --accent: #34527A;
            --background: #EDF1F6;
            --border: #D0DBE8;
        }

        .category-mix {
            --accent: #3D5A9E;
            --background: #EEF1FA;
            --border: #D3D9F0;
        }

        .category-numbers {
            --accent: #1E3A6B;
            --background: #EBEFF6;
            --border: #CDD6E8;
        }

        .category-pronouns {
            --accent: #3A7CA5;
            --background: #ECF5F9;
            --border: #CBE2EC;
        }

        .category-places {
            --accent: #2E6DA4;
            --background: #EBF3FA;
            --border: #CADEEF;
        }


        /* =====================================================
           CATEGORY HEADER
        ====================================================== */

        .category-header {

            display: flex;

            align-items: center;

            gap: 14px;

            margin-bottom: 20px;

            padding-bottom: 16px;

            border-bottom:
                1px dashed
                var(--border);

        }


        /* =====================================================
           CATEGORY ICON — a lacquer-button medallion
        ====================================================== */

        .category-icon {

            position: relative;

            flex-shrink: 0;

            width: 46px;
            height: 46px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    rgba(255,255,255,0.85),
                    var(--accent) 60%
                );

            color: #ffffff;

            font-size: 1.2rem;

            font-weight: 800;

            box-shadow:
                0 0 0 3px var(--paper),
                0 0 0 4.5px var(--border),
                0 4px 10px
                rgba(0,0,0,0.12);

        }


        .category-text {

            flex: 1;

        }


        .category-title {

            margin: 0;

            font-family: 'Kalam', cursive;

            font-size: 1.5rem;

            line-height: 1.2;

            font-weight: 700;

            color: var(--ink);

        }


        .category-title::before {

            content: "Category";

            display: block;

            font-family: 'Be Vietnam Pro', sans-serif;

            font-size: 0.68rem;

            font-weight: 700;

            letter-spacing: 0.12em;

            text-transform: uppercase;

            color: var(--accent);

            margin-bottom: 3px;

        }


        .category-subtitle {

            margin: 4px 0 0;

            color: var(--ink-soft);

            font-size: 0.88rem;

            line-height: 1.4;

        }


        /* =====================================================
           GAME GRID
        ====================================================== */

        .game-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(230px, 1fr)
                );

            gap: 18px;

        }


        /* =====================================================
           GAME CARD — a hanging "menu tag"
        ====================================================== */

        .game-card {

            position: relative;

            min-height: 178px;

            display: flex;

            flex-direction: column;

            overflow: visible;

            background: var(--paper-2);

            border: 1px solid var(--line);

            border-radius: 14px;

            padding-top: 12px;

            box-shadow:
                0 4px 14px
                rgba(60, 40, 10, 0.055);

            transition:
                transform 0.22s ease,
                box-shadow 0.22s ease;

        }


        .game-card:hover {

            transform: translateY(-4px);

            box-shadow:
                0 12px 26px
                rgba(60, 40, 10, 0.12);

        }


        /* =====================================================
           GAME THUMB — small corner seal, not a full band
        ====================================================== */

        .game-thumb {

            position: absolute;

            top: -14px;
            left: 16px;

            width: 38px;
            height: 38px;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #ffffff;

            background: var(--accent);

            border-radius: 50%;

            border: 3px solid var(--paper-2);

            box-shadow: 0 3px 8px rgba(0,0,0,0.16);

            font-size: 1.05rem;

            font-weight: 800;

        }


        /* =====================================================
           GAME INFO
        ====================================================== */

        .game-info {

            flex: 1;

            display: flex;

            flex-direction: column;

            padding: 22px 16px 16px;

        }


        .game-title {

            margin: 0 0 6px;

            color: var(--ink);

            font-size: 1rem;

            font-weight: 800;

            line-height: 1.3;

            text-align: center;

        }


        .game-desc {

            flex: 1;

            display: flex;

            align-items: center;

            justify-content: center;

            margin: 0 0 14px;

            color: var(--ink-soft);

            font-size: 0.84rem;

            line-height: 1.4;

            text-align: center;

        }


        /* =====================================================
           PLAY BUTTON — stamped like a lacquer seal
        ====================================================== */

        .play-btn {

            display: block;

            width: 100%;

            padding: 10px 12px;

            border-radius: 9px;

            background: var(--accent);

            color: white;

            text-decoration: none;

            text-align: center;

            font-size: 0.86rem;

            font-weight: 800;

            letter-spacing: 0.02em;

            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.14);

            transition:
                filter 0.2s ease,
                transform 0.15s ease,
                box-shadow 0.15s ease;

        }


        .play-btn:hover {

            filter: brightness(0.94);

            transform: translateY(1px);

            box-shadow: inset 0 -1px 0 rgba(0,0,0,0.14);

        }


        /* =====================================================
           LOADING
        ====================================================== */

        .loading {

            padding: 45px;

            text-align: center;

            color: var(--ink-soft);

            font-size: 1rem;

        }


        /* =====================================================
           ERROR
        ====================================================== */

        .error-message {

            padding: 25px;

            background: #FBEDEA;

            border: 1px solid #EFCFC6;

            border-radius: 16px;

            color: #9A3324;

            text-align: center;

        }


        /* =====================================================
           FOOTER
        ====================================================== */

        footer {

            padding: 0 0 40px;

            color: var(--ink-soft);

            font-size: 0.82rem;

            text-align: center;

        }


        footer .tile-strip {

            height: 8px;

            margin-bottom: 22px;

        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 700px) {

            .top-nav {
                top: 14px;
                width: 94%;
            }

            .login-btn {
                padding: 8px 14px;
                font-size: 0.82rem;
            }

            header {
                min-height: 285px;
                padding: 70px 18px 50px;
            }

            header h1 {
                font-size: 2.7rem;
            }

            header p {
                font-size: 1rem;
            }

            .awning-fringe svg {
                height: 18px;
            }

            .container {
                width: 94%;
                margin-top: 26px;
            }

            .section-title {
                font-size: 1.7rem;
            }

            .section-subtitle {
                font-size: 0.88rem;
            }

            .game-type-section {
                padding: 20px 16px 18px;
                border-radius: 16px;
                margin-bottom: 22px;
            }

            .category-header {
                margin-bottom: 15px;
                padding-bottom: 13px;
            }

            .category-icon {
                width: 40px;
                height: 40px;
                font-size: 1.05rem;
            }

            .category-title {
                font-size: 1.3rem;
            }

            .category-subtitle {
                font-size: 0.84rem;
            }

            .game-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .game-card {
                min-height: 160px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         TOP NAV
    ====================================================== -->

    <nav class="top-nav">

        <a
            href="#"
            class="login-btn"

        >

    </nav>


    <!-- =====================================================
         HEADER

    <header>

        </h1>

        <p>

    <div class="awning-fringe" aria-hidden="true">

            <path

                   a30,30 0 0 1 60,0 a30,30 0 0 1 60,0 a30,30 0 0 1 60,0 a30,30 0 0 1 60,0 a30,30 0 0 1 60,0

    <!-- =====================================================

    <!-- =====================================================
         GAME LOADER  (unchanged logic — only presentation above
         has been redesigned; class names and DOM contract below
         are identical to the original, so categories.json and
         the GAMES/ folder keep working exactly as before)
    ====================================================== -->

    <script>


        /* =====================================================
           CONFIGURATION
        ====================================================== */

        const GAMES_BASE = "GAMES";


        /* =====================================================
           CATEGORY STYLE
        ====================================================== */

        const categoryClasses = {

            "Color":
                "category-color",

            "Describe things":
                "category-describe",

            "Food and Drinks":
                "category-food",

            "Grammar":
                "category-grammar",

            "Health":
                "category-health",

            "Mix Practice":
                "category-mix",

            "Numbers":
                "category-numbers",

            "People & Pronouns":
                "category-pronouns",

            "Places & Locations":
                "category-places"

        };


        /* =====================================================
           CATEGORY SYMBOL
        ====================================================== */

        const categorySymbols = {

            "Color":
                "●",

            "Describe things":
                "✦",

            "Food and Drinks":
                "◆",

            "Grammar":
                "≡",

            "Health":
                "+",

            "Mix Practice":
                "◇",

            "Numbers":
                "#",

            "People & Pronouns":
                "◎",

            "Places & Locations":
                "⌖"

        };


        /* =====================================================
           LOAD CATEGORIES.JSON
        ====================================================== */

        async function loadCategories() {

            const response =
                await fetch(
                    "categories.json",
                    {
                        cache: "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    `Could not load categories.json (${response.status})`
                );

            }


            return await response.json();

        }


        /* =====================================================
           ESCAPE HTML
        ====================================================== */

        function escapeHtml(value) {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                String(
                    value ?? ""
                );


            return div.innerHTML;

        }


        /* =====================================================
           ENCODE PATH
        ====================================================== */

        function encodePath(path) {

            return path
                .split("/")
                .map(
                    part =>
                        encodeURIComponent(part)
                )
                .join("/");

        }


        /* =====================================================
           CREATE GAME CARD
        ====================================================== */

        function createGameCard(
            game,
            categoryName
        ) {

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "game-card";


            const gamePath =
                game.path;


            const playUrl =
                `${GAMES_BASE}/${encodePath(gamePath)}`;


            const symbol =
                categorySymbols[
                    categoryName
                ] || "•";


            card.style.setProperty(
                "--accent",
                getComputedStyle(
                    document.documentElement
                ).getPropertyValue(
                    "--accent"
                )
            );


            card.innerHTML = `

                <div
                    class="game-thumb"
                    aria-hidden="true"
                >

                    ${escapeHtml(symbol)}

                </div>


                <div class="game-info">

                    <h3 class="game-title">

                        ${escapeHtml(
                            game.title ||
                            "Untitled Game"
                        )}

                    </h3>


                    <p class="game-desc">

                        ${escapeHtml(
                            game.description ||
                            "Practice Vietnamese with this interactive game."
                        )}

                    </p>


                    <a
                        href="${playUrl}"
                        class="play-btn"
                    >

                        Play Now →

                    </a>

                </div>

            `;


            return card;

        }


        /* =====================================================
           RENDER GAMES
        ====================================================== */

        async function renderGames() {

            const container =
                document.getElementById(
                    "game-container"
                );


            try {

                const categories =
                    await loadCategories();


                container.innerHTML =
                    "";


                let totalGames =
                    0;


                /* =============================================
                   LOOP THROUGH CATEGORIES
                ============================================== */

                for (
                    const categoryName
                    of Object.keys(categories)
                ) {


                    const category =
                        categories[
                            categoryName
                        ];


                    /* =========================================
                       SAFETY CHECK
                    ========================================== */

                    if (
                        !category ||
                        typeof category !== "object"
                    ) {

                        continue;

                    }


                    const games =
                        Array.isArray(
                            category.games
                        )
                            ? category.games
                            : [];


                    if (
                        games.length === 0
                    ) {

                        continue;

                    }


                    /* =========================================
                       CATEGORY SECTION
                    ========================================== */

                    const section =
                        document.createElement(
                            "section"
                        );


                    section.className =
                        "game-type-section";


                    const className =
                        categoryClasses[
                            categoryName
                        ] || "";


                    if (className) {

                        section.classList.add(
                            className
                        );

                    }


                    /* =========================================
                       CATEGORY HEADER
                    ========================================== */

                    const categoryHeader =
                        document.createElement(
                            "div"
                        );


                    categoryHeader.className =
                        "category-header";


                    /* =========================================
                       CATEGORY ICON
                    ========================================== */

                    const categoryIcon =
                        document.createElement(
                            "div"
                        );


                    categoryIcon.className =
                        "category-icon";


                    categoryIcon.textContent =
                        categorySymbols[
                            categoryName
                        ] || "•";


                    categoryIcon.setAttribute(
                        "aria-hidden",
                        "true"
                    );


                    /* =========================================
                       CATEGORY TEXT
                    ========================================== */

                    const categoryText =
                        document.createElement(
                            "div"
                        );


                    categoryText.className =
                        "category-text";


                    /* =========================================
                       CATEGORY TITLE
                    ========================================== */

                    const title =
                        document.createElement(
                            "h2"
                        );


                    title.className =
                        "category-title";


                    title.textContent =
                        categoryName;


                    /* =========================================
                       CATEGORY SUBTITLE
                    ========================================== */

                    const subtitle =
                        document.createElement(
                            "p"
                        );


                    subtitle.className =
                        "category-subtitle";


                    subtitle.textContent =
                        category.subtitle ||
                        "Practice Vietnamese with interactive games.";


                    categoryText.appendChild(
                        title
                    );


                    categoryText.appendChild(
                        subtitle
                    );


                    categoryHeader.appendChild(
                        categoryIcon
                    );


                    categoryHeader.appendChild(
                        categoryText
                    );


                    /* =========================================
                       GAME GRID
                    ========================================== */

                    const grid =
                        document.createElement(
                            "div"
                        );


                    grid.className =
                        "game-grid";


                    /* =========================================
                       ADD GAMES
                    ========================================== */

                    for (
                        const game
                        of games
                    ) {


                        if (
                            !game ||
                            typeof game !== "object" ||
                            typeof game.path !== "string"
                        ) {

                            console.warn(
                                "Invalid game:",
                                game
                            );

                            continue;

                        }


                        const card =
                            createGameCard(
                                game,
                                categoryName
                            );


                        grid.appendChild(
                            card
                        );


                        totalGames++;

                    }


                    /* =========================================
                       ADD CATEGORY
                    ========================================== */

                    if (
                        grid.children.length > 0
                    ) {

                        section.appendChild(
                            categoryHeader
                        );


                        section.appendChild(
                            grid
                        );


                        container.appendChild(
                            section
                        );

                    }

                }


                /* =============================================
                   NO GAMES
                ============================================== */

                if (
                    totalGames === 0
                ) {

                    container.innerHTML = `

                        <div class="error-message">

                            <strong>
                                No games found.
                            </strong>

                            <br><br>

                            Please check
                            <strong>
                                categories.json
                            </strong>.

                        </div>

                    `;

                }

            }


            catch (error) {

                console.error(
                    "Game loader error:",
                    error
                );


                container.innerHTML = `

                    <div class="error-message">

                        <strong>
                            Unable to load games.
                        </strong>

                        <br><br>

                        Please check that
                        <strong>
                            categories.json
                        </strong>
                        exists and contains valid JSON.

                        <br><br>

                        <small>
                            ${escapeHtml(
                                error.message
                            )}
                        </small>

                    </div>

                `;

            }

        }


        /* =====================================================
           START
        ====================================================== */

        renderGames();


    </script>


</body>

</html>
