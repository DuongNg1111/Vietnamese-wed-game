<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Log in or create an account for Survival Vietnamese."
    >

    <title>
        Log in — Survival Vietnamese
    </title>


    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         SUPABASE
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script
        src="../../BACKEND/supabase.js"
    ></script>


    <style>

        /* =====================================================
           DESIGN TOKENS
        ====================================================== */

        :root {

            --paper:
                #F1F8FF;

            --white:
                #FFFFFF;

            --ink:
                #143A6B;

            --ink-soft:
                #5E7FA8;

            --blue:
                #2F6FED;

            --blue-dark:
                #1E4FC7;

            --cyan:
                #17B6D0;

            --yellow:
                #FFC93C;

            --line:
                #CFE3FA;

            --success-bg:
                #E8F8F1;

            --success-text:
                #147A52;

            --error-bg:
                #FFF0EE;

            --error-text:
                #A83A2A;

        }


        /* =====================================================
           RESET
        ====================================================== */

        * {
            box-sizing:
                border-box;
        }


        html {

            scroll-behavior:
                smooth;

        }


        body {

            margin:
                0;

            min-height:
                100vh;

            font-family:
                Calibri,
                'Segoe UI',
                Tahoma,
                sans-serif;

            color:
                var(--ink);

            background:
                linear-gradient(
                    180deg,
                    #FFFFFF 0%,
                    #F1F8FF 50%,
                    #EAF4FF 100%
                );

            display:
                flex;

            flex-direction:
                column;

        }


        /* =====================================================
           TOP BAR
        ====================================================== */

        .top-bar {

            width:
                min(
                    1400px,
                    94%
                );

            margin:
                0 auto;

            padding:
                20px 0;

        }


        .back-link {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                7px;

            padding:
                9px 15px;

            border:
                1.5px solid
                var(--line);

            border-radius:
                999px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.9
                );

            color:
                var(--ink);

            text-decoration:
                none;

            font-size:
                1.225rem;

            font-weight:
                700;

            box-shadow:
                0 4px 12px
                rgba(
                    20,
                    58,
                    107,
                    0.08
                );

            transition:
                0.2s ease;

        }


        .back-link:hover {

            transform:
                translateY(-2px);

            border-color:
                var(--blue);

            color:
                var(--blue);

        }


        /* =====================================================
           MAIN
        ====================================================== */

        main {

            flex:
                1;

            width:
                100%;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                20px;

        }


        /* =====================================================
           AUTH CARD
        ====================================================== */

        .auth-card {

            width:
                min(
                    440px,
                    100%
                );

            padding:
                34px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.97
                );

            border:
                1.5px solid
                var(--line);

            border-radius:
                24px;

            box-shadow:
                0 18px 50px
                rgba(
                    20,
                    58,
                    107,
                    0.13
                );

        }


        /* =====================================================
           BRAND
        ====================================================== */

        .brand {

            text-align:
                center;

            margin-bottom:
                28px;

        }


        .brand-icon {

            width:
                62px;

            height:
                62px;

            margin:
                0 auto 12px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border-radius:
                50%;

            background:
                #E8F2FF;

            border:
                3px solid
                #FFFFFF;

            box-shadow:
                0 0 0 2px
                var(--line);

            font-size:
                2.275rem;

        }


        .brand h1 {

            margin:
                0;

            font-family:
                'Kalam',
                cursive;

            font-size:
                2.875rem;

            line-height:
                1;

            color:
                var(--ink);

        }


        .brand p {

            margin:
                10px 0 0;

            color:
                var(--ink-soft);

            font-size:
                1.255rem;

            line-height:
                1.5;

        }


        /* =====================================================
           TABS
        ====================================================== */

        .tabs {

            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                6px;

            padding:
                5px;

            margin-bottom:
                24px;

            border-radius:
                13px;

            background:
                #EDF5FF;

        }


        .tab-btn {

            border:
                none;

            border-radius:
                9px;

            padding:
                10px;

            background:
                transparent;

            color:
                var(--ink-soft);

            font-family:
                inherit;

            font-size:
                1.255rem;

            font-weight:
                700;

            cursor:
                pointer;

            transition:
                0.2s ease;

        }


        .tab-btn.active {

            background:
                var(--white);

            color:
                var(--blue);

            box-shadow:
                0 3px 9px
                rgba(
                    20,
                    58,
                    107,
                    0.09
                );

        }


        /* =====================================================
           FORM
        ====================================================== */

        .form-group {

            margin-bottom:
                17px;

        }


        .form-label {

            display:
                block;

            margin-bottom:
                7px;

            color:
                var(--ink);

            font-size:
                1.215rem;

            font-weight:
                700;

        }


        .input-wrap {

            position:
                relative;

        }


        .form-input {

            width:
                100%;

            padding:
                12px 14px;

            border:
                1.5px solid
                var(--line);

            border-radius:
                11px;

            background:
                #FAFDFF;

            color:
                var(--ink);

            font-family:
                inherit;

            font-size:
                1.275rem;

            outline:
                none;

            transition:
                0.2s ease;

        }


        .form-input:focus {

            border-color:
                var(--blue);

            background:
                #FFFFFF;

            box-shadow:
                0 0 0 3px
                rgba(
                    47,
                    111,
                    237,
                    0.10
                );

        }


        .password-input {

            padding-right:
                52px;

        }


        .toggle-password {

            position:
                absolute;

            top:
                50%;

            right:
                12px;

            transform:
                translateY(-50%);

            border:
                none;

            background:
                transparent;

            color:
                var(--ink-soft);

            font-family:
                inherit;

            font-size:
                1.155rem;

            font-weight:
                700;

            cursor:
                pointer;

        }


        .toggle-password:hover {

            color:
                var(--blue);

        }


        /* =====================================================
           SUBMIT BUTTON
        ====================================================== */

        .submit-btn {

            width:
                100%;

            margin-top:
                5px;

            padding:
                12px 16px;

            border:
                none;

            border-radius:
                999px;

            background:
                var(--blue);

            color:
                white;

            font-family:
                inherit;

            font-size:
                1.275rem;

            font-weight:
                800;

            cursor:
                pointer;

            box-shadow:
                inset 0 -3px 0
                rgba(
                    0,
                    0,
                    0,
                    0.14
                ),
                0 5px 12px
                rgba(
                    47,
                    111,
                    237,
                    0.22
                );

            transition:
                0.2s ease;

        }


        .submit-btn:hover {

            background:
                var(--blue-dark);

            transform:
                translateY(-2px);

        }


        .submit-btn:disabled {

            opacity:
                0.6;

            cursor:
                wait;

            transform:
                none;

        }


        /* =====================================================
           MESSAGE
        ====================================================== */

        .message {

            display:
                none;

            margin-bottom:
                18px;

            padding:
                12px 14px;

            border-radius:
                11px;

            font-size:
                1.195rem;

            line-height:
                1.5;

        }


        .message.show {

            display:
                block;

        }


        .message.success {

            background:
                var(--success-bg);

            border:
                1px solid
                #BFE8D5;

            color:
                var(--success-text);

        }


        .message.error {

            background:
                var(--error-bg);

            border:
                1px solid
                #F0CCC5;

            color:
                var(--error-text);

        }


        /* =====================================================
           EXISTING SESSION
        ====================================================== */

        .session-box {

            margin-bottom:
                18px;

            padding:
                16px;

            border:
                1px solid
                #BFE8D5;

            border-radius:
                13px;

            background:
                var(--success-bg);

            text-align:
                center;

        }


        .session-text {

            margin:
                0 0 12px;

            color:
                var(--success-text);

            font-size:
                1.215rem;

            font-weight:
                600;

            line-height:
                1.5;

        }


        /* =====================================================
           GO TO LOBBY BUTTON
        ====================================================== */

        .lobby-btn {

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                9px 17px;

            border:
                none;

            border-radius:
                999px;

            background:
                var(--blue);

            color:
                white;

            font-family:
                inherit;

            font-size:
                1.195rem;

            font-weight:
                800;

            cursor:
                pointer;

            text-decoration:
                none;

            transition:
                0.2s ease;

        }


        .lobby-btn:hover {

            background:
                var(--blue-dark);

            transform:
                translateY(-1px);

        }


        /* =====================================================
           NOTE
        ====================================================== */

        .form-note {

            margin:
                17px 0 0;

            color:
                var(--ink-soft);

            font-size:
                1.135rem;

            line-height:
                1.5;

            text-align:
                center;

        }


        /* =====================================================
           HIDDEN
        ====================================================== */

        .hidden {

            display:
                none !important;

        }


        /* =====================================================
           FOOTER
        ====================================================== */

        footer {

            padding:
                20px;

            color:
                var(--ink-soft);

            font-size:
                1.125rem;

            text-align:
                center;

        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (
            max-width: 600px
        ) {

            .top-bar {

                width:
                    94%;

                padding:
                    14px 0;

            }


            main {

                align-items:
                    flex-start;

                padding:
                    25px 15px;

            }


            .auth-card {

                padding:
                    27px 20px;

                border-radius:
                    20px;

            }


            .brand h1 {

                font-size:
                    2.625rem;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <div class="top-bar">

        <a
            href="../../index.html"
            class="back-link"
        >
            ← Back
        </a>

    </div>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>

        <section
            class="auth-card"
            aria-label="Account"
        >


            <!-- =================================================
                 BRAND
            ================================================== -->

            <div class="brand">

                <div
                    class="brand-icon"
                    aria-hidden="true"
                >
                    🌴
                </div>

                <h1>
                    Survival Vietnamese
                </h1>

                <p>
                    Learn Vietnamese.
                    Play games.
                    Survive real life.
                </p>

            </div>


            <!-- =================================================
                 TABS
            ================================================== -->

            <div
                class="tabs"
                role="tablist"
            >

                <button
                    type="button"
                    class="tab-btn active"
                    id="login-tab"
                    role="tab"
                >
                    Log in
                </button>


                <button
                    type="button"
                    class="tab-btn"
                    id="register-tab"
                    role="tab"
                >
                    Create account
                </button>

            </div>


            <!-- =================================================
                 EXISTING SESSION
            ================================================== -->

            <div
                id="session-box"
                class="session-box hidden"
            >

                <p class="session-text">
                    You are already logged in.
                </p>

                <button
                    type="button"
                    class="lobby-btn"
                    id="go-lobby-btn"
                >
                    Go to Lobby →
                </button>

            </div>


            <!-- =================================================
                 MESSAGE
            ================================================== -->

            <div
                id="message"
                class="message"
                role="alert"
            ></div>


            <!-- =================================================
                 LOGIN FORM
            ================================================== -->

            <form
                id="login-form"
            >

                <div class="form-group">

                    <label
                        for="login-email"
                        class="form-label"
                    >
                        Email address
                    </label>

                    <input
                        id="login-email"
                        class="form-input"
                        type="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label
                        for="login-password"
                        class="form-label"
                    >
                        Password
                    </label>

                    <div class="input-wrap">

                        <input
                            id="login-password"
                            class="form-input password-input"
                            type="password"
                            autocomplete="current-password"
                            placeholder="Enter your password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="login-password"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="submit-btn"
                    id="login-submit"
                >
                    Log in
                </button>

            </form>


            <!-- =================================================
                 REGISTER FORM
            ================================================== -->

            <form
                id="register-form"
                class="hidden"
            >

                <div class="form-group">

                    <label
                        for="register-name"
                        class="form-label"
                    >
                        Your name
                    </label>

                    <input
                        id="register-name"
                        class="form-input"
                        type="text"
                        autocomplete="name"
                        placeholder="What should we call you?"
                        maxlength="50"
                        required
                    >

                </div>


                <div class="form-group">

                    <label
                        for="register-email"
                        class="form-label"
                    >
                        Email address
                    </label>

                    <input
                        id="register-email"
                        class="form-input"
                        type="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label
                        for="register-password"
                        class="form-label"
                    >
                        Password
                    </label>

                    <div class="input-wrap">

                        <input
                            id="register-password"
                            class="form-input password-input"
                            type="password"
                            autocomplete="new-password"
                            placeholder="At least 6 characters"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="register-password"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <div class="form-group">

                    <label
                        for="register-confirm-password"
                        class="form-label"
                    >
                        Confirm password
                    </label>

                    <div class="input-wrap">

                        <input
                            id="register-confirm-password"
                            class="form-input password-input"
                            type="password"
                            autocomplete="new-password"
                            placeholder="Enter your password again"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="register-confirm-password"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="submit-btn"
                    id="register-submit"
                >
                    Create account
                </button>


                <p class="form-note">

                    Your name will be used to personalize
                    your experience.

                </p>

            </form>

        </section>

    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer>

        © 2026 Survival Vietnamese with Duong

    </footer>


    <!-- =====================================================
         AUTH SCRIPT
    ====================================================== -->

    <script>

        /* =====================================================
           ELEMENTS
        ====================================================== */

        const loginTab =
            document.getElementById(
                "login-tab"
            );


        const registerTab =
            document.getElementById(
                "register-tab"
            );


        const loginForm =
            document.getElementById(
                "login-form"
            );


        const registerForm =
            document.getElementById(
                "register-form"
            );


        const message =
            document.getElementById(
                "message"
            );


        const sessionBox =
            document.getElementById(
                "session-box"
            );


        const goLobbyBtn =
            document.getElementById(
                "go-lobby-btn"
            );


        const loginSubmit =
            document.getElementById(
                "login-submit"
            );


        const registerSubmit =
            document.getElementById(
                "register-submit"
            );


        /* =====================================================
           LOBBY REDIRECT
        ====================================================== */

        function goToLobby() {

            console.log(
                "Going to lobby..."
            );

            const lobbyUrl =
                new URL(
                    "../../index.html",
                    window.location.href
                ).href;


            console.log(
                "Lobby URL:",
                lobbyUrl
            );


            window.location.assign(
                lobbyUrl
            );

        }


        /* =====================================================
           GO TO LOBBY BUTTON
        ====================================================== */

        goLobbyBtn.addEventListener(
            "click",
            goToLobby
        );


        /* =====================================================
           SHOW MESSAGE
        ====================================================== */

        function showMessage(
            text,
            type = "error"
        ) {

            message.textContent =
                text;

            message.className =
                `message show ${type}`;

        }


        /* =====================================================
           CLEAR MESSAGE
        ====================================================== */

        function clearMessage() {

            message.textContent =
                "";

            message.className =
                "message";

        }


        /* =====================================================
           SHOW LOGIN
        ====================================================== */

        function showLogin() {

            loginTab.classList.add(
                "active"
            );

            registerTab.classList.remove(
                "active"
            );

            loginForm.classList.remove(
                "hidden"
            );

            registerForm.classList.add(
                "hidden"
            );

            clearMessage();

        }


        /* =====================================================
           SHOW REGISTER
        ====================================================== */

        function showRegister() {

            registerTab.classList.add(
                "active"
            );

            loginTab.classList.remove(
                "active"
            );

            registerForm.classList.remove(
                "hidden"
            );

            loginForm.classList.add(
                "hidden"
            );

            clearMessage();

        }


        loginTab.addEventListener(
            "click",
            showLogin
        );


        registerTab.addEventListener(
            "click",
            showRegister
        );


        /* =====================================================
           PASSWORD TOGGLE
        ====================================================== */

        document
            .querySelectorAll(
                ".toggle-password"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            const target =
                                document.getElementById(
                                    button.dataset.target
                                );


                            if (
                                target.type ===
                                "password"
                            ) {

                                target.type =
                                    "text";

                                button.textContent =
                                    "Hide";

                            }
                            else {

                                target.type =
                                    "password";

                                button.textContent =
                                    "Show";

                            }

                        }
                    );

                }
            );


        /* =====================================================
           CHECK SUPABASE
        ====================================================== */

        if (
            !window.supabaseClient
        ) {

            showMessage(
                "Supabase is not connected. Please check BACKEND/supabase.js.",
                "error"
            );

        }


        /* =====================================================
           LOGIN
        ====================================================== */

        loginForm.addEventListener(
            "submit",
            async event => {

                event.preventDefault();

                clearMessage();


                if (
                    !window.supabaseClient
                ) {

                    showMessage(
                        "Supabase is not connected.",
                        "error"
                    );

                    return;

                }


                const email =
                    document
                        .getElementById(
                            "login-email"
                        )
                        .value
                        .trim();


                const password =
                    document
                        .getElementById(
                            "login-password"
                        )
                        .value;


                loginSubmit.disabled =
                    true;

                loginSubmit.textContent =
                    "Logging in...";


                try {

                    const {
                        data,
                        error
                    } =
                        await window.supabaseClient
                            .auth
                            .signInWithPassword({

                                email:
                                    email,

                                password:
                                    password

                            });


                    if (error) {

                        throw error;

                    }


                    if (
                        !data ||
                        !data.user
                    ) {

                        throw new Error(
                            "Login succeeded but no user was returned."
                        );

                    }


                    showMessage(
                        "Login successful! Taking you to the lobby...",
                        "success"
                    );


                    setTimeout(
                        () => {

                            goToLobby();

                        },
                        500
                    );

                }


                catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    let errorMessage =
                        "Unable to log in.";


                    if (
                        error &&
                        error.message
                    ) {

                        errorMessage =
                            error.message;

                    }


                    showMessage(
                        errorMessage,
                        "error"
                    );

                }


                finally {

                    loginSubmit.disabled =
                        false;

                    loginSubmit.textContent =
                        "Log in";

                }

            }
        );


        /* =====================================================
           REGISTER
        ====================================================== */

        registerForm.addEventListener(
            "submit",
            async event => {

                event.preventDefault();

                clearMessage();


                if (
                    !window.supabaseClient
                ) {

                    showMessage(
                        "Supabase is not connected.",
                        "error"
                    );

                    return;

                }


                const name =
                    document
                        .getElementById(
                            "register-name"
                        )
                        .value
                        .trim();


                const email =
                    document
                        .getElementById(
                            "register-email"
                        )
                        .value
                        .trim();


                const password =
                    document
                        .getElementById(
                            "register-password"
                        )
                        .value;


                const confirmPassword =
                    document
                        .getElementById(
                            "register-confirm-password"
                        )
                        .value;


                if (
                    !name
                ) {

                    showMessage(
                        "Please enter your name.",
                        "error"
                    );

                    return;

                }


                if (
                    name.length > 50
                ) {

                    showMessage(
                        "Your name must be 50 characters or less.",
                        "error"
                    );

                    return;

                }


                if (
                    password.length < 6
                ) {

                    showMessage(
                        "Password must be at least 6 characters.",
                        "error"
                    );

                    return;

                }


                if (
                    password !==
                    confirmPassword
                ) {

                    showMessage(
                        "Passwords do not match.",
                        "error"
                    );

                    return;

                }


                registerSubmit.disabled =
                    true;

                registerSubmit.textContent =
                    "Creating account...";


                try {

                    const {
                        data,
                        error
                    } =
                        await window.supabaseClient
                            .auth
                            .signUp({

                                email:
                                    email,

                                password:
                                    password,

                                options: {

                                    data: {

                                        name:
                                            name

                                    }

                                }

                            });


                    if (error) {

                        throw error;

                    }


                    if (
                        !data ||
                        !data.user
                    ) {

                        throw new Error(
                            "Account could not be created."
                        );

                    }


                    showMessage(
                        "Account created successfully! You can now log in.",
                        "success"
                    );


                    registerForm.reset();


                    setTimeout(
                        () => {

                            showLogin();


                            const loginEmail =
                                document.getElementById(
                                    "login-email"
                                );


                            loginEmail.value =
                                email;

                        },
                        900
                    );

                }


                catch (error) {

                    console.error(
                        "Registration error:",
                        error
                    );


                    let errorMessage =
                        "Unable to create account.";


                    if (
                        error &&
                        error.message
                    ) {

                        errorMessage =
                            error.message;

                    }


                    showMessage(
                        errorMessage,
                        "error"
                    );

                }


                finally {

                    registerSubmit.disabled =
                        false;

                    registerSubmit.textContent =
                        "Create account";

                }

            }
        );


        /* =====================================================
           CHECK EXISTING SESSION

           IMPORTANT:
           Do NOT auto-redirect.
        ====================================================== */

        async function checkExistingSession() {

            if (
                !window.supabaseClient
            ) {

                return;

            }


            try {

                const {
                    data,
                    error
                } =
                    await window.supabaseClient
                        .auth
                        .getSession();


                if (error) {

                    console.error(
                        "Session check error:",
                        error
                    );

                    return;

                }


                if (
                    data &&
                    data.session &&
                    data.session.user
                ) {

                    sessionBox.classList.remove(
                        "hidden"
                    );

                }

            }


            catch (error) {

                console.error(
                    "Session check failed:",
                    error
                );

            }

        }


        /* =====================================================
           START
        ====================================================== */

        checkExistingSession();

    </script>
