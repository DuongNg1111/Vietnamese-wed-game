<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Vietnamese Family Vocabulary</title>

<meta
    name="game-title"
    content="Vietnamese Family Vocabulary"
>

<meta
    name="game-description"
    content="Practice Vietnamese family and people vocabulary."
>

<meta
    name="game-icon"
    content="👨‍👩‍👧‍👦"
>

<meta
    name="game-explanation"
    content="true"
>


<style>

/* ==========================================================
   RESET
========================================================== */

*{
    box-sizing:border-box;
}


body{

    margin:0;

    font-family:
        'Segoe UI',
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    background:#f4f7f6;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    color:#2c3e50;

}


/* ==========================================================
   SCREEN
========================================================== */

.screen{

    display:none;

}


.screen.active{

    display:block;

}


/* ==========================================================
   CONTAINER
========================================================== */

.container{

    position:relative;

    width:min(750px,96vw);

    margin:0 auto;

    background:white;

    padding:65px 30px 30px;

    border-radius:20px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.08);

}


/* ==========================================================
   BACK TO LOBBY
========================================================== */

.lobby-btn{

    position:absolute;

    top:20px;

    left:22px;

    padding:8px 14px;

    border:none;

    border-radius:8px;

    background:#eef5fc;

    color:#34495e;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.lobby-btn:hover{

    background:#dcecff;

    transform:translateX(-2px);

}


/* ==========================================================
   INTRO
========================================================== */

#intro{

    text-align:center;

    padding:20px 20px 30px;

}


#intro .emoji{

    font-size:60px;

    margin-bottom:10px;

}


#intro h1{

    margin:0 0 15px;

    font-size:34px;

}


#intro p{

    color:#7f8c8d;

    font-size:17px;

    line-height:1.6;

    margin:8px 0;

}


.start-btn{

    margin-top:20px;

    padding:14px 35px;

    border:none;

    border-radius:12px;

    background:#34495e;

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.start-btn:hover{

    background:#2c3e50;

    transform:translateY(-2px);

}


/* ==========================================================
   TITLE
========================================================== */

.title{

    text-align:center;

    margin:0 0 5px;

}


.subtitle{

    text-align:center;

    color:#7f8c8d;

    margin-bottom:25px;

}


/* ==========================================================
   GAME BOX
========================================================== */

.game-box{

    background:#fff;

    padding:25px;

    border-radius:15px;

    border:1px solid #eee;

    text-align:center;

}


.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:15px;

    font-weight:bold;

}


.question-count{

    color:#7f8c8d;

}


.score{

    color:#27ae60;

    font-size:18px;

}


/* ==========================================================
   PROGRESS
========================================================== */

.progress-wrap{

    width:100%;

    height:9px;

    background:#eee;

    border-radius:20px;

    overflow:hidden;

    margin-bottom:20px;

}


.progress{

    width:0%;

    height:100%;

    background:#34495e;

    transition:.3s;

}


/* ==========================================================
   QUESTION
========================================================== */

.card{

    background:#fffde7;

    border:2px dashed #f1c40f;

    border-radius:12px;

    padding:35px 20px;

    margin:20px 0;

    min-height:150px;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:22px;

    font-weight:600;

    line-height:1.5;

}


/* ==========================================================
   OPTIONS
========================================================== */

.options{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:12px;

}


.option-btn{

    padding:17px;

    font-size:20px;

    font-weight:bold;

    background:#34495e;

    color:white;

    border:none;

    border-radius:9px;

    cursor:pointer;

    transition:.2s;

}


.option-btn:hover{

    background:#2c3e50;

    transform:translateY(-2px);

}


.option-btn.correct{

    background:#27ae60;

}


.option-btn.wrong{

    background:#e74c3c;

}


.option-btn.disabled{

    pointer-events:none;

    opacity:.7;

}


/* ==========================================================
   RESULT
========================================================== */

.result-message{

    min-height:40px;

    margin-top:20px;

    font-size:18px;

    font-weight:bold;

}


.correct-text{

    color:#27ae60;

}


.wrong-text{

    color:#e74c3c;

}


/* ==========================================================
   EXPLANATION
========================================================== */

.explanation{

    display:none;

    margin-top:15px;

    padding:16px 18px;

    background:#f8fbff;

    border-left:5px solid #3498db;

    border-radius:10px;

    color:#34495e;

    font-size:16px;

    line-height:1.6;

    text-align:left;

}


.explanation.show{

    display:block;

}


.explanation strong{

    color:#1976d2;

}


/* ==========================================================
   NEXT BUTTON
========================================================== */

.next-btn{

    padding:12px 28px;

    border:none;

    border-radius:10px;

    background:#34495e;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    margin-top:15px;

    transition:.2s;

}


.next-btn:hover{

    background:#2c3e50;

    transform:translateY(-2px);

}


/* ==========================================================
   FINAL
========================================================== */

#final{

    text-align:center;

    padding:30px 20px 40px;

}


#final h2{

    font-size:35px;

    color:#27ae60;

}


.final-score{

    font-size:30px;

    margin:25px 0;

    font-weight:bold;

    color:#1976d2;

}


.final-message{

    color:#7f8c8d;

    font-size:18px;

}


#final .start-btn{

    margin-top:10px;

}


/* ==========================================================
   MOBILE
========================================================== */

@media(max-width:600px){

    body{

        padding:10px;

    }


    .container{

        width:100%;

        padding:
            60px 15px 20px;

    }


    #intro{

        padding:
            20px 10px 25px;

    }


    #intro h1{

        font-size:28px;

    }


    #intro p{

        font-size:16px;

    }


    .game-box{

        padding:18px;

    }


    .options{

        grid-template-columns:1fr;

    }


    .card{

        font-size:19px;

        min-height:140px;

        padding:25px 15px;

    }


    .option-btn{

        font-size:18px;

    }


    .lobby-btn{

        top:16px;

        left:16px;

        font-size:13px;

        padding:7px 12px;

    }


    #final h2{

        font-size:30px;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- ========================================================
     BACK TO LOBBY
========================================================= -->

<button
    class="lobby-btn"
    onclick="backToLobby()"
>

    ← Back

</button>



<!-- ========================================================
     INTRO
========================================================= -->

<div
    id="intro"
    class="screen active"
>

    <div class="emoji">

        👨‍👩‍👧‍👦

    </div>


    <h1>

        Vietnamese Family Vocabulary

    </h1>


    <p>

        Read the English word and choose
        the correct Vietnamese word.

    </p>

    <button
        class="start-btn"
        onclick="startGame()"
    >

        Start Game

    </button>

</div>



<!-- ========================================================
     GAME
========================================================= -->

<div
    id="game"
    class="screen"
>


    <h1 class="title">

        👨‍👩‍👧‍👦 Vietnamese Family Vocabulary

    </h1>


    <p class="subtitle">

        Choose the correct Vietnamese word.

    </p>



    <div class="game-box">


        <!-- TOP BAR -->

        <div class="topbar">

            <div class="question-count">

                Question

                <span id="questionNumber">
                    1
                </span>

                /

                <span id="totalQuestions">
                    20
                </span>

            </div>


            <div class="score">

                Score:

                <span id="score">
                    0
                </span>

            </div>

        </div>



        <!-- PROGRESS -->

        <div class="progress-wrap">

            <div
                class="progress"
                id="progress"
            ></div>

        </div>



        <!-- QUESTION -->

        <div
            class="card"
            id="questionText"
        ></div>



        <!-- OPTIONS -->

        <div
            class="options"
            id="optionsContainer"
        ></div>



        <!-- RESULT -->

        <div
            class="result-message"
            id="resultText"
        ></div>



        <!-- EXPLANATION -->

        <div
            class="explanation"
            id="explanation"
        ></div>



        <!-- NEXT -->

        <button
            class="next-btn"
            id="nextBtn"
            onclick="nextQuestion()"
            style="display:none;"
        >

            Next →

        </button>


    </div>


</div>



<!-- ========================================================
     FINAL
========================================================= -->

<div
    id="final"
    class="screen"
>


    <h2>

        🎉 Game Complete!

    </h2>


    <p class="final-message">

        You completed Vietnamese Family Vocabulary.

    </p>


    <div class="final-score">

        Score:

        <span id="finalScore"></span>

    </div>


    <p
        class="final-message"
        id="finalMessage"
    ></p>


    <button
        class="start-btn"
        onclick="restartGame()"
    >

        Play Again

    </button>


</div>


</div>



<script>

/* ==========================================================
   QUESTION DATABASE
========================================================== */

const database = [

    {
        q: "family",
        c: "gia đình",
        a: [
            "gia đình",
            "người",
            "vợ",
            "chồng"
        ],
        e: "Gia đình means family."
    },

    {
        q: "person / people",
        c: "người",
        a: [
            "người",
            "gia đình",
            "em",
            "cháu"
        ],
        e: "Người means person or people."
    },

    {
        q: "father",
        c: "ba",
        a: [
            "ba",
            "mẹ",
            "ông",
            "bác"
        ],
        e: "Ba means father."
    },

    {
        q: "mother",
        c: "mẹ",
        a: [
            "mẹ",
            "ba",
            "bà",
            "dì"
        ],
        e: "Mẹ means mother."
    },

    {
        q: "wife",
        c: "vợ",
        a: [
            "vợ",
            "chồng",
            "mẹ",
            "chị"
        ],
        e: "Vợ means wife."
    },

    {
        q: "husband",
        c: "chồng",
        a: [
            "chồng",
            "vợ",
            "ba",
            "anh"
        ],
        e: "Chồng means husband."
    },

    {
        q: "son / boy",
        c: "con trai",
        a: [
            "con trai",
            "con gái",
            "em trai",
            "cháu trai"
        ],
        e: "Con trai means son or boy."
    },

    {
        q: "daughter / girl",
        c: "con gái",
        a: [
            "con gái",
            "con trai",
            "em gái",
            "cháu gái"
        ],
        e: "Con gái means daughter or girl."
    },

    {
        q: "nephew / grandson / male grandchild",
        c: "cháu trai",
        a: [
            "cháu trai",
            "cháu gái",
            "con trai",
            "em trai"
        ],
        e: "Cháu trai can mean nephew, grandson, or male grandchild."
    },

    {
        q: "niece / granddaughter / female grandchild",
        c: "cháu gái",
        a: [
            "cháu gái",
            "cháu trai",
            "con gái",
            "em gái"
        ],
        e: "Cháu gái can mean niece, granddaughter, or female grandchild."
    },

    {
        q: "younger brother",
        c: "em trai",
        a: [
            "em trai",
            "anh",
            "con trai",
            "cháu trai"
        ],
        e: "Em trai means younger brother."
    },

    {
        q: "younger sister",
        c: "em gái",
        a: [
            "em gái",
            "chị",
            "con gái",
            "cháu gái"
        ],
        e: "Em gái means younger sister."
    },

    {
        q: "grandfather / older man",
        c: "ông",
        a: [
            "ông",
            "bà",
            "bác",
            "chú"
        ],
        e: "Ông means grandfather and can also be used for an older man."
    },

    {
        q: "grandmother / older woman",
        c: "bà",
        a: [
            "bà",
            "ông",
            "dì",
            "chị"
        ],
        e: "Bà means grandmother and can also be used for an older woman."
    },

    {
        q: "paternal younger uncle",
        c: "chú",
        a: [
            "chú",
            "bác",
            "dì",
            "ông"
        ],
        e: "Chú means your father's younger brother."
    },

    {
        q: "maternal aunt",
        c: "dì",
        a: [
            "dì",
            "chú",
            "bác",
            "bà"
        ],
        e: "Dì means your mother's sister."
    },

    {
        q: "older aunt / uncle",
        c: "bác",
        a: [
            "bác",
            "chú",
            "dì",
            "ông"
        ],
        e: "Bác is used for an older aunt or uncle in the family."
    },

    {
        q: "older brother / older male",
        c: "anh",
        a: [
            "anh",
            "chị",
            "em",
            "chú"
        ],
        e: "Anh means older brother and can also be used for an older male."
    },

    {
        q: "older sister / older female",
        c: "chị",
        a: [
            "chị",
            "anh",
            "em",
            "dì"
        ],
        e: "Chị means older sister and can also be used for an older female."
    },

    {
        q: "younger sibling / younger person",
        c: "em",
        a: [
            "em",
            "anh",
            "chị",
            "cháu"
        ],
        e: "Em means a younger sibling or a younger person."
    },

    {
        q: "niece / nephew / grandchild / younger person",
        c: "cháu",
        a: [
            "cháu",
            "em",
            "anh",
            "bác"
        ],
        e: "Cháu can mean niece, nephew, grandchild, or a younger person."
    }

];


/* ==========================================================
   GAME SETTINGS
========================================================== */

const totalQuestions = 20;


/* ==========================================================
   STATE
========================================================== */

let questions = [];

let currentQuestion = 0;

let score = 0;

let answered = false;


/* ==========================================================
   SHUFFLE
========================================================== */

function shuffle(array){

    const arr = [...array];


    for(
        let i = arr.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] = [
            arr[j],
            arr[i]
        ];

    }


    return arr;

}


/* ==========================================================
   START GAME
========================================================== */

function startGame(){

    questions =
        shuffle(database);


    currentQuestion = 0;

    score = 0;


    document
        .getElementById("intro")
        .classList.remove("active");


    document
        .getElementById("final")
        .classList.remove("active");


    document
        .getElementById("game")
        .classList.add("active");


    document
        .getElementById("score")
        .textContent =
        "0";


    document
        .getElementById("totalQuestions")
        .textContent =
        totalQuestions;


    loadQuestion();

}


/* ==========================================================
   LOAD QUESTION
========================================================== */

function loadQuestion(){

    answered = false;


    const question =
        questions[currentQuestion];


    document
        .getElementById("questionNumber")
        .textContent =
        currentQuestion + 1;


    document
        .getElementById("progress")
        .style.width =
        (
            currentQuestion /
            totalQuestions *
            100
        ) + "%";


    document
        .getElementById("questionText")
        .textContent =
        question.q;


    document
        .getElementById("resultText")
        .textContent =
        "";


    document
        .getElementById("resultText")
        .className =
        "result-message";


    document
        .getElementById("explanation")
        .innerHTML =
        "";


    document
        .getElementById("explanation")
        .classList.remove("show");


    const nextBtn =
        document.getElementById(
            "nextBtn"
        );


    nextBtn.style.display =
        "none";


    nextBtn.textContent =
        currentQuestion ===
        totalQuestions - 1
            ? "Finish 🎉"
            : "Next →";


    const container =
        document.getElementById(
            "optionsContainer"
        );


    container.innerHTML =
        "";


    const options =
        shuffle(question.a);


    options.forEach(option => {

        const btn =
            document.createElement(
                "button"
            );


        btn.className =
            "option-btn";


        btn.textContent =
            option;


        btn.onclick = () =>
            handleAnswer(
                btn,
                option
            );


        container.appendChild(btn);

    });

}


/* ==========================================================
   HANDLE ANSWER
========================================================== */

function handleAnswer(
    button,
    selected
){

    if(answered){

        return;

    }


    answered = true;


    const question =
        questions[currentQuestion];


    const buttons =
        document.querySelectorAll(
            ".option-btn"
        );


    buttons.forEach(btn => {

        btn.classList.add(
            "disabled"
        );

    });


    if(
        selected === question.c
    ){

        button.classList.add(
            "correct"
        );


        score++;


        document
            .getElementById("score")
            .textContent =
            score;


        document
            .getElementById("resultText")
            .textContent =
            "🎉 Correct!";


        document
            .getElementById("resultText")
            .className =
            "result-message correct-text";

    }

    else{

        button.classList.add(
            "wrong"
        );


        buttons.forEach(btn => {

            if(
                btn.textContent ===
                question.c
            ){

                btn.classList.add(
                    "correct"
                );

            }

        });


        document
            .getElementById("resultText")
            .textContent =
            `❌ Incorrect. The correct answer is "${question.c}".`;


        document
            .getElementById("resultText")
            .className =
            "result-message wrong-text";

    }


    showExplanation(
        question
    );


    document
        .getElementById("nextBtn")
        .style.display =
        "inline-block";

}


/* ==========================================================
   EXPLANATION
========================================================== */

function showExplanation(
    question
){

    const explanation =
        document.getElementById(
            "explanation"
        );


    explanation.innerHTML = `

        <strong>💡 Learn:</strong>

        <br><br>

        <strong>
            ${question.c}
        </strong>

        =

        ${question.q}

        <br><br>

        ${question.e}

    `;


    explanation.classList.add(
        "show"
    );

}


/* ==========================================================
   NEXT QUESTION
========================================================== */

function nextQuestion(){

    currentQuestion++;


    if(
        currentQuestion <
        totalQuestions
    ){

        loadQuestion();

    }

    else{

        finishGame();

    }

}


/* ==========================================================
   FINISH GAME
========================================================== */

function finishGame(){

    document
        .getElementById("game")
        .classList.remove(
            "active"
        );


    document
        .getElementById("final")
        .classList.add(
            "active"
        );


    document
        .getElementById("progress")
        .style.width =
        "100%";


    document
        .getElementById("finalScore")
        .textContent =
        score +
        " / " +
        totalQuestions;


    const percent =
        Math.round(
            score /
            totalQuestions *
            100
        );


    let message;


    if(
        percent === 100
    ){

        message =
            "🏆 Perfect! You mastered the family vocabulary!";

    }

    else if(
        percent >= 80
    ){

        message =
            "👏 Excellent! Your Vietnamese family vocabulary is strong.";

    }

    else if(
        percent >= 60
    ){

        message =
            "🎉 Good job! Keep practicing these family words.";

    }

    else{

        message =
            "📚 Keep practicing! Review the vocabulary and try again.";

    }


    document
        .getElementById("finalMessage")
        .textContent =
        message;

}


/* ==========================================================
   RESTART
========================================================== */

function restartGame(){

    startGame();

}


/* ==========================================================
   BACK TO LOBBY
========================================================== */

function backToLobby(){

    window.location.href =
        "../../category.html?category=People%20%26%20Pronouns";

}

</script>


</body>

</html>
