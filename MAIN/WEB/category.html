<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Practice Vietnamese vocabulary through games"
    >

    <title>Vietnamese Vocabulary</title>


    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =====================================================
           DESIGN TOKENS
        ====================================================== */

        :root {

            --paper: #f5f9fd;
            --white: #ffffff;

            --ink: #143a6b;
            --ink-soft: #66809d;

            --blue: #2f6fed;
            --blue-dark: #1e4fc7;

            --line: #d9e6f2;

            --category-accent: #2f6fed;
            --category-accent-light: #6fa4ff;
            --category-background: #eaf3ff;
            --category-border: #c4daf6;

        }


        /* =====================================================
           RESET
        ====================================================== */

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;
            min-height: 100vh;

            font-family:
                "Be Vietnam Pro",
                "Segoe UI",
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            color: var(--ink);

            background:
                linear-gradient(
                    180deg,
                    #ffffff 0%,
                    #f5f9fd 48%,
                    #edf5fc 100%
                );

        }


        /* =====================================================
           TOP NAVIGATION
        ====================================================== */

        .top-nav {

            width: min(1400px, 94%);
            margin: 22px auto 0;

            display: flex;
            align-items: center;
            justify-content: space-between;

        }


        .back-btn {

            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 10px 17px;

            border: 1px solid rgba(20, 58, 107, 0.14);
            border-radius: 999px;

            background: rgba(255, 255, 255, 0.9);

            color: var(--ink);

            text-decoration: none;

            font-size: 0.82rem;
            font-weight: 700;

            box-shadow:
                0 4px 14px rgba(20, 58, 107, 0.08);

            transition: 0.2s ease;

        }


        .back-btn:hover {

            transform: translateX(-3px);

            color: var(--category-accent);

            border-color: var(--category-accent);

        }


        /* =====================================================
           MAIN CONTAINER
        ====================================================== */

        .container {

            width: min(1400px, 94%);
            margin: 35px auto 70px;

        }


        /* =====================================================
           CATEGORY HEADER
        ====================================================== */

        .category-header {

            position: relative;

            margin-bottom: 28px;
            padding: 34px 38px;

            overflow: hidden;

            border: 1px solid var(--category-border);
            border-radius: 24px;

            background: rgba(255, 255, 255, 0.97);

            box-shadow:
                0 12px 35px rgba(20, 58, 107, 0.08);

        }


        .category-header::before {

            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 6px;

            background:
                linear-gradient(
                    90deg,
                    var(--category-accent),
                    var(--category-accent-light)
                );

        }


        .category-header-content {

            position: relative;
            z-index: 2;

            display: flex;
            align-items: center;

            gap: 22px;

        }


        .category-header-icon {

            width: 76px;
            height: 76px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid var(--category-border);
            border-radius: 21px;

            background: var(--category-background);

            font-size: 2.45rem;

            box-shadow:
                inset 0 -4px 0 rgba(0, 0, 0, 0.04);

        }


        .category-eyebrow {

            margin: 0 0 5px;

            color: var(--category-accent);

            font-size: 0.72rem;
            font-weight: 800;

            letter-spacing: 0.09em;
            text-transform: uppercase;

        }


        .category-title {

            margin: 0;

            font-family: "Kalam", cursive;

            color: var(--ink);

            font-size: clamp(2rem, 4vw, 3rem);
            line-height: 1.05;

        }


        .category-description {

            margin: 9px 0 0;

            max-width: 720px;

            color: var(--ink-soft);

            font-size: 0.9rem;
            line-height: 1.55;

        }


        /* =====================================================
           TABS
           
           ONLY 2 SECTIONS:
           1. Games
           2. Vocabulary
        ====================================================== */

        .tabs {

            display: flex;
            align-items: center;

            gap: 8px;

            margin-bottom: 30px;
            padding: 7px;

            border: 1px solid var(--line);
            border-radius: 17px;

            background: rgba(255, 255, 255, 0.92);

            box-shadow:
                0 6px 18px rgba(20, 58, 107, 0.06);

        }


        .tab-btn {

            flex: 1;

            min-height: 48px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            padding: 10px 18px;

            border: 0;
            border-radius: 12px;

            background: transparent;

            color: var(--ink-soft);

            font-family: inherit;

            font-size: 0.82rem;
            font-weight: 800;

            cursor: pointer;

            transition: 0.2s ease;

        }


        .tab-btn:hover {

            background: var(--category-background);

            color: var(--category-accent);

        }


        .tab-btn.active {

            background: var(--category-background);

            color: var(--category-accent);

            box-shadow:
                inset 0 0 0 1px var(--category-border),
                0 3px 10px rgba(20, 58, 107, 0.06);

        }


        .tab-icon {
            font-size: 1.05rem;
        }


        /* =====================================================
           TAB CONTENT
        ====================================================== */

        .tab-panel {
            display: none;
        }


        .tab-panel.active {
            display: block;
        }


        /* =====================================================
           SECTION HEADER
        ====================================================== */

        .games-heading {

            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 18px;

        }


        .games-heading h2 {

            margin: 0;

            color: var(--ink);

            font-size: 1.25rem;
            font-weight: 800;

        }


        .item-count {

            padding: 6px 12px;

            border: 1px solid var(--category-border);
            border-radius: 999px;

            background: var(--category-background);

            color: var(--category-accent);

            font-size: 0.72rem;
            font-weight: 700;

        }


        /* =====================================================
           GAME GRID
        ====================================================== */

        .game-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(270px, 1fr)
                );

            gap: 20px;

        }


        /* =====================================================
           GAME CARD
        ====================================================== */

        .game-card {

            position: relative;

            min-height: 245px;

            display: flex;
            flex-direction: column;

            padding: 25px;

            overflow: hidden;

            border: 2px solid var(--category-border);
            border-radius: 21px;

            background: #ffffff;

            color: var(--ink);

            text-decoration: none;

            box-shadow:
                0 8px 20px rgba(20, 58, 107, 0.07);

            transition:
                transform 0.22s ease,
                box-shadow 0.22s ease,
                border-color 0.22s ease;

        }


        .game-card::before {

            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 5px;

            background: var(--category-accent);

        }


        .game-card::after {

            content: "";

            position: absolute;

            width: 120px;
            height: 120px;

            right: -45px;
            bottom: -50px;

            border-radius: 50%;

            background: var(--category-accent);

            opacity: 0.06;

            transition:
                transform 0.25s ease,
                opacity 0.25s ease;

        }


        .game-card:hover {

            transform: translateY(-7px);

            border-color: var(--category-accent);

            box-shadow:
                0 17px 32px rgba(20, 58, 107, 0.14);

        }


        .game-card:hover::after {

            transform: scale(1.35);
            opacity: 0.10;

        }


        .game-icon {

            position: relative;
            z-index: 2;

            width: 58px;
            height: 58px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 19px;

            border: 1px solid var(--category-border);
            border-radius: 16px;

            background: var(--category-background);

            font-size: 1.8rem;

            box-shadow:
                0 4px 10px rgba(20, 58, 107, 0.05);

            transition: transform 0.22s ease;

        }


        .game-card:hover .game-icon {

            transform:
                rotate(-4deg)
                scale(1.08);

        }


        .game-number {

            position: absolute;

            top: 22px;
            right: 22px;

            z-index: 2;

            color: var(--category-accent);

            font-size: 0.68rem;
            font-weight: 800;

            letter-spacing: 0.06em;

        }


        .game-title {

            position: relative;
            z-index: 2;

            margin: 0 0 8px;

            color: var(--ink);

            font-size: 1.18rem;
            font-weight: 800;

            line-height: 1.3;

        }


        .game-description {

            position: relative;
            z-index: 2;

            margin: 0;

            color: var(--ink-soft);

            font-size: 0.81rem;
            line-height: 1.5;

        }


        .game-footer {

            position: relative;
            z-index: 2;

            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-top: auto;
            padding-top: 22px;

        }


        .play-label {

            color: var(--category-accent);

            font-size: 0.73rem;
            font-weight: 800;

            letter-spacing: 0.04em;

        }


        .play-arrow {

            width: 34px;
            height: 34px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: var(--category-accent);

            color: #ffffff;

            font-size: 0.9rem;
            font-weight: 800;

            transition: transform 0.2s ease;

        }


        .game-card:hover .play-arrow {
            transform: translateX(4px);
        }


        /* =====================================================
           VOCABULARY
        ====================================================== */

        .vocab-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(220px, 1fr)
                );

            gap: 15px;

        }


        .vocab-card {

            padding: 21px;

            border: 1px solid var(--category-border);
            border-radius: 18px;

            background: #ffffff;

            box-shadow:
                0 6px 17px rgba(20, 58, 107, 0.05);

            transition: 0.2s ease;

        }


        .vocab-card:hover {

            transform: translateY(-4px);

            border-color: var(--category-accent);

            box-shadow:
                0 13px 25px rgba(20, 58, 107, 0.10);

        }


        .vocab-vietnamese {

            margin: 0 0 5px;

            color: var(--ink);

            font-size: 1.2rem;
            font-weight: 800;

        }


        .vocab-meaning {

            margin: 0;

            color: var(--ink-soft);

            font-size: 0.82rem;
            line-height: 1.45;

        }


        .vocab-phonetic {

            margin-top: 8px;

            color: var(--category-accent);

            font-size: 0.76rem;
            font-weight: 700;

        }


        /* =====================================================
           VOCABULARY TOPIC CARD
        ====================================================== */

        .vocab-topic-card {

            position: relative;

            padding: 24px;

            border: 2px solid var(--category-border);
            border-radius: 20px;

            background: #ffffff;

            cursor: pointer;

            box-shadow:
                0 7px 20px rgba(20, 58, 107, 0.06);

            transition:
                transform 0.22s ease,
                box-shadow 0.22s ease,
                border-color 0.22s ease;

        }


        .vocab-topic-card:hover {

            transform: translateY(-6px);

            border-color: var(--category-accent);

            box-shadow:
                0 15px 28px rgba(20, 58, 107, 0.12);

        }


        .vocab-topic-icon {

            width: 50px;
            height: 50px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 17px;

            border: 1px solid var(--category-border);
            border-radius: 14px;

            background: var(--category-background);

            font-size: 1.45rem;

        }


        .vocab-topic-title {

            margin: 0 0 6px;

            color: var(--ink);

            font-size: 1.12rem;
            font-weight: 800;

        }


        .vocab-topic-count {

            margin: 0;

            color: var(--ink-soft);

            font-size: 0.8rem;

        }


        .vocab-topic-arrow {

            margin-top: 20px;

            color: var(--category-accent);

            font-size: 0.72rem;
            font-weight: 800;

            letter-spacing: 0.03em;

        }


        /* =====================================================
           VOCABULARY TOPIC VIEW
        ====================================================== */

        .vocab-back-btn {

            grid-column: 1 / -1;

            width: fit-content;

            padding: 9px 15px;

            border: 1px solid var(--category-border);
            border-radius: 999px;

            background: #ffffff;

            color: var(--category-accent);

            font-family: inherit;

            font-size: 0.78rem;
            font-weight: 800;

            cursor: pointer;

            transition: 0.2s ease;

        }


        .vocab-back-btn:hover {

            background: var(--category-background);

            transform: translateX(-3px);

        }


        .vocab-topic-heading {

            grid-column: 1 / -1;

            margin: 2px 0 5px;
            padding: 4px 0 10px;

        }


        .vocab-topic-heading h3 {

            margin: 0 0 5px;

            color: var(--ink);

            font-size: 1.35rem;
            font-weight: 800;

        }


        .vocab-topic-heading span {

            color: var(--ink-soft);

            font-size: 0.78rem;
            font-weight: 600;

        }


        /* =====================================================
           EMPTY STATE
        ====================================================== */

        .empty-message {

            grid-column: 1 / -1;

            padding: 45px 25px;

            border: 1px dashed var(--category-border);
            border-radius: 20px;

            background: rgba(255, 255, 255, 0.75);

            color: var(--ink-soft);

            text-align: center;

        }


        .empty-icon {

            margin-bottom: 10px;

            font-size: 2rem;

        }


        .empty-title {

            margin: 0 0 6px;

            color: var(--ink);

            font-size: 1rem;
            font-weight: 800;

        }


        .empty-text {

            margin: 0;

            font-size: 0.82rem;

        }


        /* =====================================================
           FOOTER
        ====================================================== */

        footer {

            width: min(1400px, 94%);

            margin: 0 auto;

            padding: 15px 0 35px;

            color: #7c93aa;

            font-size: 0.78rem;

            text-align: center;

        }


        .footer-line {

            width: 100%;
            height: 1px;

            margin-bottom: 20px;

            background: #d8e5f0;

        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 700px) {

            .top-nav {

                width: 92%;
                margin-top: 14px;

            }


            .container {

                width: 92%;
                margin: 25px auto 50px;

            }


            .category-header {

                padding: 27px 22px;
                border-radius: 20px;

            }


            .category-header-content {

                align-items: flex-start;

                gap: 16px;

            }


            .category-header-icon {

                width: 60px;
                height: 60px;

                border-radius: 16px;

                font-size: 1.9rem;

            }


            .category-title {
                font-size: 2.1rem;
            }


            .category-description {
                font-size: 0.82rem;
            }


            .tabs {

                gap: 4px;
                padding: 5px;

            }


            .tab-btn {

                min-height: 45px;

                padding: 8px 7px;

                font-size: 0.7rem;

            }


            .tab-icon {
                font-size: 0.9rem;
            }


            .game-grid {

                grid-template-columns: 1fr;

                gap: 14px;

            }


            .vocab-grid {

                grid-template-columns: 1fr 1fr;

                gap: 10px;

            }


            .game-card {

                min-height: 220px;

                padding: 22px;

                border-radius: 18px;

            }


            .games-heading h2 {
                font-size: 1.1rem;
            }

        }


        @media (max-width: 430px) {

            .category-header-content {
                flex-direction: column;
            }


            .tabs {

                display: grid;

                grid-template-columns:
                    repeat(2, 1fr);

            }


            .tab-btn {

                flex-direction: column;

                gap: 3px;

            }


            .vocab-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         TOP NAVIGATION
    ====================================================== -->

    <nav class="top-nav">

        <a
            href="index.html"
            class="back-btn"
        >
            ← Back to Lobby
        </a>

    </nav>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="container">


        <!-- =================================================
             CATEGORY HEADER
        ================================================== -->

        <section
            id="category-header"
            class="category-header"
        >

            <div class="category-header-content">

                <div
                    id="category-icon"
                    class="category-header-icon"
                    aria-hidden="true"
                >
                    📚
                </div>


                <div>

                    <p class="category-eyebrow">
                        Vietnamese Practice
                    </p>


                    <h1
                        id="category-title"
                        class="category-title"
                    >
                        Loading...
                    </h1>


                    <p
                        id="category-description"
                        class="category-description"
                    >
                        Loading category...
                    </p>

                </div>

            </div>

        </section>


        <!-- =================================================
             MAIN CATEGORY SECTIONS

             Exactly 2 sections:
             1. GAMES
             2. VOCABULARY
        ================================================== -->

        <nav
            class="tabs"
            aria-label="Category sections"
        >

            <button
                type="button"
                class="tab-btn active"
                data-tab="games"
            >

                <span
                    class="tab-icon"
                    aria-hidden="true"
                >
                    🎮
                </span>

                Games

            </button>


            <button
                type="button"
                class="tab-btn"
                data-tab="vocab"
            >

                <span
                    class="tab-icon"
                    aria-hidden="true"
                >
                    🧠
                </span>

                Vocabulary

            </button>

        </nav>


        <!-- =================================================
             GAMES
        ================================================== -->

        <section
            id="games-tab"
            class="tab-panel active"
        >

            <div class="games-heading">

                <h2>
                    Choose a game
                </h2>


                <span
                    id="game-count"
                    class="item-count"
                >
                    Loading...
                </span>

            </div>


            <div
                id="game-grid"
                class="game-grid"
            >

                <div class="empty-message">

                    <div class="empty-icon">
                        🎮
                    </div>

                    <h3 class="empty-title">
                        Loading games...
                    </h3>

                    <p class="empty-text">
                        Finding games for this category.
                    </p>

                </div>

            </div>

        </section>


        <!-- =================================================
             VOCABULARY
        ================================================== -->

        <section
            id="vocab-tab"
            class="tab-panel"
        >

            <div class="games-heading">

                <h2>
                    Vocabulary
                </h2>


                <span
                    id="vocab-count"
                    class="item-count"
                >
                    0 words
                </span>

            </div>


            <div
                id="vocab-grid"
                class="vocab-grid"
            >

                <div class="empty-message">

                    <div class="empty-icon">
                        🧠
                    </div>

                    <h3 class="empty-title">
                        Vocabulary coming soon
                    </h3>

                    <p class="empty-text">
                        Useful Vietnamese words for this
                        topic will appear here.
                    </p>

                </div>

            </div>

        </section>


    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer>

        <div class="footer-line"></div>

        © 2026 Survival Vietnamese with Duong

    </footer>


    <!-- =====================================================
         SCRIPT
    ====================================================== -->

    <script>

        /* =====================================================
           CONFIGURATION

           category.html:
           MAIN/WEB/category.html

           categories.json:
           MAIN/WEB/categories.json

           Therefore all game paths are relative to MAIN/WEB/.
        ====================================================== */

        const CATEGORY_FILE = "categories.json";


        /* =====================================================
           STATE
        ====================================================== */

        let currentVocabulary = [];
        let currentCategory = null;


        /* =====================================================
           GET CATEGORY FROM URL
        ====================================================== */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const categoryName =
            params.get("category");


        /* =====================================================
           ELEMENTS
        ====================================================== */

        const categoryTitle =
            document.getElementById(
                "category-title"
            );


        const categoryDescription =
            document.getElementById(
                "category-description"
            );


        const categoryIcon =
            document.getElementById(
                "category-icon"
            );


        const gameGrid =
            document.getElementById(
                "game-grid"
            );


        const vocabGrid =
            document.getElementById(
                "vocab-grid"
            );


        const gameCount =
            document.getElementById(
                "game-count"
            );


        const vocabCount =
            document.getElementById(
                "vocab-count"
            );


        /* =====================================================
           FALLBACK THEMES
        ====================================================== */

        const fallbackThemes = {

            "Color": {

                accent: "#2878df",

                background: "#eaf3ff",
                border: "#c4daf6"

            },


            "Describe things": {

                accent: "#7657d9",

            "Food and Drinks": {

            "Grammar": {

                accent: "#079b91",

            "Health": {

                accent: "#d14f76",

            },


            "Numbers": {

                accent: "#3b82c4",

            },


            "People & Pronouns": {

                accent: "#d14f9b",

            },


            "Places, Directions & Transportation": {

                accent: "#2f9a67",

                background: "#eaf8f0",

            },


            "Useful Phrases": {

                accent: "#d47b2f",
                light: "#e4a35f",
                background: "#fff5e8",
                border: "#f1d6b6"

            },


            "Shopping & Money": {

                accent: "#c65a9e",
                light: "#df8bc0",
                background: "#fff1f8",
                border: "#efcce1"

            },


            "Mix Practice Vocabulary": {

                accent: "#d7a600",
                light: "#f0ca4d",
                background: "#fff8d9",
                border: "#eadb9b"

            }

        };


        /* =====================================================
           DEFAULT THEME
        ====================================================== */

        const defaultTheme = {

            accent: "#2f6fed",
            light: "#6fa4ff",
            background: "#eaf3ff",
            border: "#c4daf6"

        };


        /* =====================================================
           ESCAPE HTML
        ====================================================== */

        function escapeHtml(value) {

            const div =
                document.createElement("div");


            div.textContent =
                String(value ?? "");


            return div.innerHTML;

        }


        /* =====================================================
           NORMALIZE CATEGORY NAME
        ====================================================== */

        function normalizeCategoryName(value) {

            return String(value || "")
                .trim()
                .toLowerCase();

        }


        /* =====================================================
           FIND CATEGORY NAME
        ====================================================== */

        function findCategoryKey(
            categories,
            requestedName
        ) {

            if (
                categories[
                    requestedName
                ]
            ) {

                return requestedName;

            }


            const requested =
                normalizeCategoryName(
                    requestedName
                );


            return Object.keys(
                categories
            ).find(
                key =>
                    normalizeCategoryName(
                        key
                    ) === requested
            ) || null;

        }


        /* =====================================================
           APPLY CATEGORY THEME
        ====================================================== */

        function applyCategoryTheme(
            category,
            categoryKey
        ) {

            const theme =
                category &&
                category.theme
                    ? {
                        ...defaultTheme,
                        ...category.theme
                    }
                    : (
                        fallbackThemes[
                            categoryKey
                        ] ||
                        defaultTheme
                    );


            document.documentElement.style.setProperty(
                "--category-accent",
                theme.accent
            );


            document.documentElement.style.setProperty(
                "--category-accent-light",
                theme.light
            );


            document.documentElement.style.setProperty(
                "--category-background",
                theme.background
            );


            document.documentElement.style.setProperty(
                "--category-border",
                theme.border
            );

        }


        /* =====================================================
           LOAD CATEGORIES.JSON
        ====================================================== */

        async function loadCategories() {

            const response =
                await fetch(
                    CATEGORY_FILE,
                    {
                        cache: "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    `Could not load categories.json (${response.status})`
                );

            }


            const data =
                await response.json();


            if (
                !data ||
                typeof data !== "object" ||
                Array.isArray(data)
            ) {

                throw new Error(
                    "categories.json has an invalid format."
                );

            }


            return data;

        }


        /* =====================================================
           CREATE GAME CARD
        ====================================================== */

        function createGameCard(
            game,
            index
        ) {

            const card =
                document.createElement("a");


            card.className =
                "game-card";


            const gamePath =
                game &&
                typeof game === "object"
                    ? game.path
                    : "";


            /*
             * Paths in categories.json are relative
             * to MAIN/WEB/category.html.
             *
             * Examples:
             *
             * Vocabulary/Color/game1.html
             *
             * Vocabulary/Food and Drinks/game1/game1.html
             *
             * Sentences/Grammar/game1/game1.html
             */


            if (gamePath) {

                card.href =
                    encodeURI(
                        gamePath
                    );

            }

            else {

                card.href = "#";


                card.addEventListener(
                    "click",
                    event => {

                        event.preventDefault();

                    }
                );

            }


            const icon =
                game &&
                game.icon
                    ? game.icon
                    : "🎮";


            const title =
                game &&
                game.title
                    ? game.title
                    : `Game ${index + 1}`;


            const description =
                game &&
                game.description
                    ? game.description
                    : "Practice Vietnamese vocabulary through a quick interactive game.";


            card.innerHTML = `

                <span class="game-number">
                    GAME ${String(
                        index + 1
                    ).padStart(
                        2,
                        "0"
                    )}
                </span>


                <div
                    class="game-icon"
                    aria-hidden="true"
                >
                    ${escapeHtml(icon)}
                </div>


                <h3 class="game-title">
                    ${escapeHtml(title)}
                </h3>


                <p class="game-description">
                    ${escapeHtml(description)}
                </p>


                <div class="game-footer">

                    <span class="play-label">
                        PLAY GAME
                    </span>


                    <span
                        class="play-arrow"
                        aria-hidden="true"
                    >
                        →
                    </span>

                </div>

            `;


            return card;

        }


        /* =====================================================
           CREATE VOCABULARY CARD
        ====================================================== */

        function createVocabCard(
            word,
            index
        ) {

            const card =
                document.createElement("article");


            card.className =
                "vocab-card";


            let vietnamese = "";
            let meaning = "";
            let phonetic = "";


            /*
             * Array format:
             *
             * ["nhà", "House / Home", "nha"]
             */

            if (Array.isArray(word)) {

                vietnamese =
                    word[0] || "";

                meaning =
                    word[1] || "";

                phonetic =
                    word[2] || "";

            }


            /*
             * Object format.
             */

            else if (
                word &&
                typeof word === "object"
            ) {

                vietnamese =
                    word.vietnamese ||
                    word.word ||
                    word.term ||
                    "";

                meaning =
                    word.english ||
                    word.meaning ||
                    word.translation ||
                    "";

                phonetic =
                    word.phonetics ||
                    word.phonetic ||
                    word.pronunciation ||
                    "";

            }


            const cleanPhonetic =
                String(
                    phonetic
                )
                    .replace(
                        /^\/|\/$/g,
                        ""
                    );


            card.innerHTML = `

                <h3 class="vocab-vietnamese">
                    ${escapeHtml(
                        vietnamese ||
                        `Word ${index + 1}`
                    )}
                </h3>


                <p class="vocab-meaning">
                    ${escapeHtml(
                        meaning ||
                        "Vietnamese vocabulary"
                    )}
                </p>


                ${
                    cleanPhonetic
                        ? `
                            <div class="vocab-phonetic">
                                /${escapeHtml(
                                    cleanPhonetic
                                )}/
                            </div>
                          `
                        : ""
                }

            `;


            return card;

        }


        /* =====================================================
           CREATE EMPTY STATE
        ====================================================== */

        function createEmptyState(
            icon,
            title,
            text
        ) {

            const element =
                document.createElement("div");


            element.className =
                "empty-message";


            element.innerHTML = `

                <div
                    class="empty-icon"
                    aria-hidden="true"
                >
                    ${escapeHtml(icon)}
                </div>


                <h3 class="empty-title">
                    ${escapeHtml(title)}
                </h3>


                <p class="empty-text">
                    ${escapeHtml(text)}
                </p>

            `;


            return element;

        }


        /* =====================================================
           RENDER GAMES
        ====================================================== */

        function renderGames(games) {

            gameGrid.innerHTML = "";


            const validGames =
                Array.isArray(games)
                    ? games.filter(
                        game =>
                            game &&
                            typeof game === "object"
                    )
                    : [];


            gameCount.textContent =
                `${validGames.length} ${
                    validGames.length === 1
                        ? "game"
                        : "games"
                }`;


            if (
                validGames.length === 0
            ) {

                gameGrid.appendChild(
                    createEmptyState(
                        "🎮",
                        "Games coming soon",
                        "Games for this category will appear here."
                    )
                );


                return;

            }


            validGames.forEach(
                (
                    game,
                    index
                ) => {

                    gameGrid.appendChild(
                        createGameCard(
                            game,
                            index
                        )
                    );

                }
            );

        }


        /* =====================================================
           RENDER VOCABULARY
        ====================================================== */

        function renderVocabulary(vocabulary) {

            vocabGrid.innerHTML = "";


            currentVocabulary =
                Array.isArray(vocabulary)
                    ? vocabulary
                    : [];


            if (
                currentVocabulary.length === 0
            ) {

                vocabCount.textContent =
                    "0 words";


                vocabGrid.appendChild(
                    createEmptyState(
                        "🧠",
                        "Vocabulary coming soon",
                        "Useful Vietnamese words for this topic will appear here."
                    )
                );


                return;

            }


            /*
             * Detect topic-based vocabulary.
             *
             * Example:
             *
             * [
             *     {
             *         "topic": "Fruit",
             *         "vocabulary": [...]
             *     }
             * ]
             */

            const isTopicBased =
                currentVocabulary.some(
                    item =>
                        item &&
                        typeof item === "object" &&
                        !Array.isArray(item) &&
                        Array.isArray(
                            item.vocabulary
                        )
                );


            /*
             * Simple vocabulary.
             */

            if (!isTopicBased) {

                const validWords =
                    currentVocabulary.filter(
                        word =>
                            Array.isArray(word) ||
                            (
                                word &&
                                typeof word === "object"
                            )
                    );


                vocabCount.textContent =
                    `${validWords.length} ${
                        validWords.length === 1
                            ? "word"
                            : "words"
                    }`;


                validWords.forEach(
                    (
                        word,
                        index
                    ) => {

                        vocabGrid.appendChild(
                            createVocabCard(
                                word,
                                index
                            )
                        );

                    }
                );


                return;

            }


            /*
             * Topic-based vocabulary.
             */

            let totalWords = 0;


            currentVocabulary.forEach(
                topic => {

                    if (
                        topic &&
                        typeof topic === "object" &&
                        Array.isArray(
                            topic.vocabulary
                        )
                    ) {

                        totalWords +=
                            topic.vocabulary.length;

                    }

                }
            );


            vocabCount.textContent =
                `${totalWords} ${
                    totalWords === 1
                        ? "word"
                        : "words"
                }`;


            currentVocabulary.forEach(
                (
                    topic,
                    index
                ) => {

                    if (
                        !topic ||
                        typeof topic !== "object" ||
                        !Array.isArray(
                            topic.vocabulary
                        )
                    ) {

                        return;

                    }


                    const card =
                        document.createElement(
                            "article"
                        );


                    card.className =
                        "vocab-topic-card";


                    const topicName =
                        topic.topic ||
                        `Topic ${index + 1}`;


                    const wordCount =
                        topic.vocabulary.length;


                    card.innerHTML = `

                        <div
                            class="vocab-topic-icon"
                            aria-hidden="true"
                        >
                            🧠
                        </div>


                        <h3 class="vocab-topic-title">
                            ${escapeHtml(
                                topicName
                            )}
                        </h3>


                        <p class="vocab-topic-count">
                            ${wordCount}
                            ${
                                wordCount === 1
                                    ? "word"
                                    : "words"
                            }
                        </p>


                        <div class="vocab-topic-arrow">
                            VIEW VOCABULARY →
                        </div>

                    `;


                    card.addEventListener(
                        "click",
                        () => {

                            showTopicVocabulary(
                                topic
                            );

                        }
                    );


                    vocabGrid.appendChild(
                        card
                    );

                }
            );

        }


        /* =====================================================
           SHOW TOPIC VOCABULARY
        ====================================================== */

        function showTopicVocabulary(topic) {

            vocabGrid.innerHTML = "";


            const backButton =
                document.createElement("button");


            backButton.type = "button";


            backButton.className =
                "vocab-back-btn";


            backButton.textContent =
                "← Back";


            backButton.addEventListener(
                "click",
                () => {

                    renderVocabulary(
                        currentVocabulary
                    );

                }
            );


            vocabGrid.appendChild(
                backButton
            );


            const heading =
                document.createElement("div");


            heading.className =
                "vocab-topic-heading";


            const topicName =
                topic.topic ||
                "Vocabulary";


            const words =
                Array.isArray(
                    topic.vocabulary
                )
                    ? topic.vocabulary
                    : [];


            heading.innerHTML = `

                <h3>
                    ${escapeHtml(
                        topicName
                    )}
                </h3>


                <span>
                    ${words.length}
                    ${
                        words.length === 1
                            ? "word"
                            : "words"
                    }
                </span>

            `;


            vocabGrid.appendChild(
                heading
            );


            words.forEach(
                (
                    word,
                    index
                ) => {

                    vocabGrid.appendChild(
                        createVocabCard(
                            word,
                            index
                        )
                    );

                }
            );

        }


        /* =====================================================
           RENDER CATEGORY

           New structure:

           MAIN/
               WEB/
                   index.html
                   categories.json
                   category.html

                   Dictionary/

                   Sentences/
                       Grammar/
                           game1/
                               game1.html
                           game2/
                               game2.html

                   Vocabulary/
                       Color/
                           game1.html
                           game2.html
                           ...

                       Describe things/
                           game1.html
                           ...

                       Food and Drinks/
                           game1/
                               game1.html
                           game2.html
                           ...

                       Health/
                           game1.html
                           ...

                       Numbers/
                           game1.html
                           ...

                       People & Pronouns/
                           game1.html
                           ...

                       Places, Directions & Transportation/
                           game1.html
                           ...

           category.html ONLY reads categories.json.

           No GitHub API.
           No automatic folder scanning.
           No GAMES folder.
           No Quick Lessons.
        ====================================================== */

        async function renderCategory() {

            try {

                if (!categoryName) {

                    throw new Error(
                        "No category was selected."
                    );

                }


                const categories =
                    await loadCategories();


                const categoryKey =
                    findCategoryKey(
                        categories,
                        categoryName
                    );


                if (!categoryKey) {

                    throw new Error(
                        `Category "${categoryName}" was not found in categories.json.`
                    );

                }


                const category =
                    categories[
                        categoryKey
                    ];


                if (
                    !category ||
                    typeof category !== "object" ||
                    Array.isArray(category)
                ) {

                    throw new Error(
                        `Category "${categoryKey}" has an invalid format in categories.json.`
                    );

                }


                currentCategory =
                    category;


                /* =================================================
                   PAGE TITLE
                ================================================== */

                document.title =
                    `${categoryKey} | Survival Vietnamese with Duong`;


                /* =================================================
                   CATEGORY HEADER
                ================================================== */

                categoryTitle.textContent =
                    categoryKey;


                categoryDescription.textContent =
                    category.subtitle ||
                    "Practice Vietnamese through games and vocabulary review.";


                categoryIcon.textContent =
                    category.icon ||
                    "📚";


                /* =================================================
                   CATEGORY THEME
                ================================================== */

                applyCategoryTheme(
                    category,
                    categoryKey
                );


                /* =================================================
                   GAMES

                   categories.json:
                   category.games
                ================================================== */

                const games =
                    Array.isArray(
                        category.games
                    )
                        ? category.games
                        : [];


                /* =================================================
                   VOCABULARY

                   categories.json:
                   category.vocab
                ================================================== */

                const vocabulary =
                    Array.isArray(
                        category.vocab
                    )
                        ? category.vocab
                        : [];


                currentVocabulary =
                    vocabulary;


                /* =================================================
                   RENDER
                ================================================= */

                renderGames(
                    games
                );


                renderVocabulary(
                    vocabulary
                );


                console.log(
                    `Category "${categoryKey}" loaded.`,
                    {
                        games:
                            games.length,

                        vocabulary:
                            vocabulary.length
                    }
                );

            }

            catch (error) {

                console.error(
                    "Category loading error:",
                    error
                );


                categoryTitle.textContent =
                    "Something went wrong";


                categoryDescription.textContent =
                    "";


                gameCount.textContent =
                    "Error";


                vocabCount.textContent =
                    "Error";


                gameGrid.innerHTML =
                    "";


                gameGrid.appendChild(
                    createEmptyState(
                        "⚠️",
                        "Unable to load this category",
                        error &&
                        error.message
                            ? error.message
                            : "An unknown error occurred."
                    )
                );


                vocabGrid.innerHTML =
                    "";


                vocabGrid.appendChild(
                    createEmptyState(
                        "⚠️",
                        "Unable to load vocabulary",
                        "Please check categories.json and try again."
                    )
                );

            }

        }


        /* =====================================================
           TAB SWITCHING
        ====================================================== */

        const tabButtons =
            document.querySelectorAll(
                ".tab-btn"
            );


        const tabPanels = {

            games:
                document.getElementById(
                    "games-tab"
                ),

            vocab:
                document.getElementById(
                    "vocab-tab"
                )

        };


        tabButtons.forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        const target =
                            button.dataset.tab;


                        tabButtons.forEach(
                            tab => {

                                tab.classList.remove(
                                    "active"
                                );

                            }
                        );


                        button.classList.add(
                            "active"
                        );


                        Object.values(
                            tabPanels
                        ).forEach(
                            panel => {

                                panel.classList.remove(
                                    "active"
                                );

                            }
                        );


                        if (
                            tabPanels[target]
                        ) {

                            tabPanels[target].classList.add(
                                "active"
                            );

                        }

                    }
                );

            }
        );


        /* =====================================================
           START
        ====================================================== */

        renderCategory();

    </script>


</body>

</html>
